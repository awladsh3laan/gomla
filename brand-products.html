<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منتجات البراند - أولاد شعلان</title>

  <meta name="description" content="منتجات البراند - أولاد شعلان">
  <meta name="theme-color" content="#1a2a4a">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       🎨 ستايل صفحة منتجات البراند
       ============================================================ */

    /* ===== رأس البراند ===== */
    .brand-hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: var(--radius-lg);
      padding: 40px 24px;
      margin-bottom: 24px;
      color: var(--white);
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .brand-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }

    .brand-hero::after {
      content: '';
      position: absolute;
      bottom: -50%;
      left: -10%;
      width: 270px;
      height: 270px;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 10s ease-in-out infinite reverse;
    }

    .brand-hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      max-width: 800px;
      margin: 0 auto;
    }

    .brand-hero-image-wrap {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: var(--white);
      padding: 8px;
      border: 4px solid var(--gold);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      animation: logo-pulse-brand 3s ease-in-out infinite;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @keyframes logo-pulse-brand {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .brand-hero-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .brand-hero-text {
      flex: 1;
      min-width: 240px;
      text-align: right;
    }

    .brand-hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--gold);
      color: var(--navy);
      padding: 5px 14px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .brand-hero-text h1 {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 8px;
      color: var(--white);
      line-height: 1.3;
    }

    .brand-hero-text .brand-description {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.7;
      margin-bottom: 12px;
      max-width: 500px;
    }

    .brand-hero-text .count-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(201, 168, 76, 0.2);
      color: var(--gold-light);
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid rgba(201, 168, 76, 0.4);
    }

    /* ===== الفلاتر ===== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--white);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
      align-items: center;
      border: 1px solid var(--gray-200);
    }

    .filter-bar select {
      padding: 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--gray-50);
      min-width: 140px;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-bar select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
      background: var(--white);
    }

    .filter-bar .filter-icon {
      color: var(--gold);
      font-size: 1rem;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) and (pointer: coarse) {
      .brand-hero {
        padding: 28px 16px;
      }

      .brand-hero-content {
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }

      .brand-hero-image-wrap {
        width: 100px;
        height: 100px;
        border-width: 3px;
      }

      .brand-hero-text {
        text-align: center;
        min-width: 100%;
      }

      .brand-hero-text h1 {
        font-size: 1.4rem;
      }

      .brand-hero-text .brand-description {
        font-size: 0.85rem;
      }

      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-bar select {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- مكونات الموبايل -->
  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>

  <!-- الهيدر -->
  <div id="header-placeholder"></div>

  <!-- المحتوى -->
  <main class="page-content">
    <div class="container">

      <!-- مسار التنقل -->
      <div class="breadcrumb" id="breadcrumb">
        <a href="/gomla/">الرئيسية</a>
        <span>›</span>
        <a href="/gomla/categories.html" id="breadcrumbBack">الأقسام</a>
        <span>›</span>
        <span id="breadcrumbBrandName">جاري التحميل...</span>
      </div>

      <!-- رأس البراند -->
      <section class="brand-hero" id="brandHero">
        <div class="brand-hero-content">
          <div class="brand-hero-image-wrap">
            <img src="/gomla/assets/images/no-image.png" 
                 alt="شعار البراند" 
                 id="brandImage"
                 onerror="this.src='/gomla/assets/images/no-image.png'">
          </div>
          <div class="brand-hero-text">
            <div class="brand-hero-badge">
              <i class="fas fa-copyright"></i>
              براند
            </div>
            <h1 id="brandName">جاري التحميل...</h1>
            <p class="brand-description" id="brandDescription" style="display:none;"></p>
            <div class="count-badge" id="brandCount">
              <i class="fas fa-spinner fa-spin"></i>
              جاري التحميل...
            </div>
          </div>
        </div>
      </section>

      <!-- سلايدر مصغر -->
      <section class="slider-section" id="slider-section" style="margin-bottom:24px;">
        <div class="slider-container" id="sliderContainer">
          <div class="slider-track" id="sliderTrack">
            <div class="slider-item">
              <div class="slide-placeholder">
                <i class="fas fa-spinner fa-spin"></i>
                جاري التحميل...
              </div>
            </div>
          </div>
          <button class="slider-btn prev" onclick="slidePrev()" aria-label="السابق">
            <i class="fas fa-chevron-right"></i>
          </button>
          <button class="slider-btn next" onclick="slideNext()" aria-label="التالي">
            <i class="fas fa-chevron-left"></i>
          </button>
          <div class="slider-dots" id="sliderDots"></div>
        </div>
      </section>

      <!-- الفلاتر -->
      <div class="filter-bar">
        <i class="fas fa-sliders-h filter-icon"></i>
        <select id="sortFilter" onchange="applyFilters()">
          <option value="newest">الأحدث</option>
          <option value="price-low">السعر: الأقل للأعلى</option>
          <option value="price-high">السعر: الأعلى للأقل</option>
          <option value="popular">الأكثر مبيعاً</option>
        </select>
        <select id="availabilityFilter" onchange="applyFilters()">
          <option value="">كل المنتجات</option>
          <option value="available">المتوفر فقط</option>
        </select>
        <select id="categoryFilter" onchange="applyFilters()">
          <option value="">كل الأقسام</option>
        </select>
      </div>

      <!-- شبكة المنتجات -->
      <div class="products-grid" id="productsContainer">
        <div class="loading-spinner">
          <i class="fas fa-spinner fa-spin"></i>
          جاري التحميل...
        </div>
      </div>

      <!-- تحميل المزيد -->
      <div style="text-align:center;margin-top:20px;">
        <button class="btn btn-outline" id="loadMoreBtn" onclick="loadMoreProducts()" style="display:none;">
          <i class="fas fa-chevron-down"></i>
          تحميل المزيد
        </button>
      </div>

    </div>
  </main>

  <!-- التبويبات السفلى -->
  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>

  <!-- الفوتر -->
  <div id="footer-placeholder"></div>

  <!-- السايدبار -->
  <div id="sidebar-placeholder"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- نافذة البحث -->
  <div class="search-modal-overlay" id="searchModalOverlay" onclick="closeSearchModal(event)">
    <div class="search-modal" onclick="event.stopPropagation()">
      <div class="search-modal-header">
        <i class="fas fa-search search-icon"></i>
        <input type="text" 
               id="searchModalInput" 
               placeholder="ابحث عن منتج..."
               autocomplete="off"
               oninput="handleModalSearch(this.value)"
               onkeydown="handleSearchKeydown(event)">
        <button class="search-modal-close" onclick="closeSearchModal()" aria-label="إغلاق">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="search-modal-body" id="searchModalBody">
        <div id="searchInitialContent">
          <div class="search-suggestions-header">
            <i class="fas fa-fire"></i>
            اقتراحات سريعة
          </div>
          <div class="search-suggestions-chips">
            <a href="#" class="search-chip" onclick="quickSearch('منظف')">
              <i class="fas fa-spray-can"></i>
              منظفات
            </a>
            <a href="#" class="search-chip" onclick="quickSearch('ورق')">
              <i class="fas fa-toilet-paper"></i>
              ورقيات
            </a>
            <a href="#" class="search-chip" onclick="quickSearch('صابون')">
              <i class="fas fa-soap"></i>
              صابون
            </a>
          </div>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="search-keyboard-hint">
        <span><kbd>ESC</kbd> للإغلاق</span>
        <span><kbd>Enter</kbd> للبحث</span>
      </div>
    </div>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 brand-products.html - منتجات البراند
    // ============================================================

    // ===== المتغيرات =====
    let brandId = null;
    let brandData = null;
    let storeType = 'retail';
    let allProducts = [];
    let filteredProducts = [];
    let currentPage = 0;
    const pageSize = 12;
    let selectedCategoryId = '';
    let slidesCount = 0;
    let slideIndex = 0;
    let slideInterval = null;

    // ============================================================
    // 🚀 تحميل الصفحة
    // ============================================================

    async function loadPageData() {
      const urlParams = new URLSearchParams(window.location.search);
      brandId = urlParams.get('id');
      storeType = urlParams.get('type') || 'retail';

      if (!brandId) {
        showError('لم يتم تحديد براند');
        return;
      }

      // تحديد نوع المتجر حسب الصلاحية
      const user = getCurrentUser();
      if (user && user.data) {
        const role = user.data.role;
        if (role === ROLES.WHOLESALE || role === ROLES.ADMIN || role === ROLES.SUPER) {
          storeType = 'wholesale';
        }
      }

      // تحديث رابط الرجوع
      document.getElementById('breadcrumbBack').href = 
        storeType === 'wholesale' 
          ? '/gomla/store-wholesale.html'
          : '/gomla/store-retail.html';
      
      const backLink = document.getElementById('breadcrumbBack');
      backLink.innerHTML = storeType === 'wholesale' ? 'المتجر' : 'المتجر';

      await loadBrandInfo();
      await loadProducts();
      loadSlider();

      document.title = `${brandData?.name || 'البراند'} - أولاد شعلان`;
    }

    // ============================================================
    // 🏷️ معلومات البراند
    // ============================================================

    async function loadBrandInfo() {
      try {
        const doc = await db.collection(COLLECTIONS.BRANDS).doc(brandId).get();
        
        if (!doc.exists) {
          showError('البراند غير موجود');
          return;
        }

        brandData = { id: doc.id, ...doc.data() };

        document.getElementById('brandName').textContent = brandData.name || 'براند';
        document.getElementById('breadcrumbBrandName').textContent = brandData.name || 'براند';
        
        if (brandData.imageUrl) {
          document.getElementById('brandImage').src = brandData.imageUrl;
        }

        if (brandData.description) {
          const descEl = document.getElementById('brandDescription');
          descEl.textContent = brandData.description;
          descEl.style.display = 'block';
        }

      } catch (error) {
        console.error('Error loading brand:', error);
      }
    }

    // ============================================================
    // 📦 تحميل المنتجات
    // ============================================================

    async function loadProducts() {
      const container = document.getElementById('productsContainer');
      if (!container) return;

      try {
        const snapshot = await db.collection(COLLECTIONS.PRODUCTS)
          .where('available', '==', true)
          .where('brandId', '==', brandId)
          .orderBy('createdAt', 'desc')
          .limit(pageSize)
          .get();

        allProducts = [];
        snapshot.forEach(doc => {
          allProducts.push({ id: doc.id, ...doc.data() });
        });

        filteredProducts = [...allProducts];

        // تحديث العداد
        document.getElementById('brandCount').innerHTML = `
          <i class="fas fa-box"></i>
          ${allProducts.length} منتج
        `;

        // بناء قائمة الأقسام للفلترة
        await loadCategoriesFilter();

        renderProducts();

        if (allProducts.length >= pageSize) {
          document.getElementById('loadMoreBtn').style.display = 'inline-block';
        }

      } catch (error) {
        console.error('Error loading products:', error);
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>حدث خطأ في تحميل المنتجات</p>
          </div>
        `;
      }
    }

    // ============================================================
    // 📂 قائمة الأقسام للفلترة
    // ============================================================

    async function loadCategoriesFilter() {
      const select = document.getElementById('categoryFilter');
      if (!select) return;

      // استخراج الأقسام الفريدة من المنتجات
      const categories = new Map();
      allProducts.forEach(p => {
        if (p.categoryId && p.categoryName) {
          categories.set(p.categoryId, p.categoryName);
        }
      });

      if (categories.size === 0) {
        select.parentElement.style.display = 'none';
        return;
      }

      let html = '<option value="">كل الأقسام</option>';
      categories.forEach((name, id) => {
        html += `<option value="${id}">${name}</option>`;
      });

      select.innerHTML = html;
    }

    // ============================================================
    // 🎨 عرض المنتجات
    // ============================================================

    function renderProducts() {
      const container = document.getElementById('productsContainer');
      if (!container) return;

      const start = currentPage * pageSize;
      const end = start + pageSize;
      const pageProducts = filteredProducts.slice(start, end);

      if (pageProducts.length === 0 && currentPage === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-box-open"></i>
            <p>لا توجد منتجات لهذا البراند</p>
            <a href="${storeType === 'wholesale' ? '/gomla/store-wholesale.html' : '/gomla/store-retail.html'}" class="btn btn-primary">
              <i class="fas fa-arrow-right"></i>
              العودة للمتجر
            </a>
          </div>
        `;
        document.getElementById('loadMoreBtn').style.display = 'none';
        return;
      }

      const isWholesale = storeType === 'wholesale';

      let html = '';

      pageProducts.forEach(product => {
        // 🔒 السعر حسب نوع المستخدم
        const price = isWholesale ? 
          (product.wholesalePrice || 0) : 
          (product.retailPrice || 0);
        const unit = isWholesale ? 
          (product.unit || 'كرتونة') : 
          'قطعة';
        
        const stock = product.stockQuantity || 0;
        const isAvailable = stock > 0;
        
        // خصم/عرض
        const hasOffer = !isWholesale && product.hasRetailOffer === true && product.retailOfferPrice > 0;
        const offerPrice = product.retailOfferPrice || 0;
        
        const hasDiscount = isWholesale && product.hasWholesaleDiscount === true && product.wholesaleDiscountPercent > 0;
        const discountPercent = product.wholesaleDiscountPercent || 0;
        const finalPrice = hasDiscount ? price * (1 - discountPercent / 100) : price;
        
        // شارة الخصم
        let discountBadge = '';
        if (hasOffer && price > 0) {
          const disc = Math.round(((price - offerPrice) / price) * 100);
          discountBadge = `<div class="offer-badge"><i class="fas fa-percent"></i> ${disc}%</div>`;
        } else if (hasDiscount) {
          discountBadge = `<div class="offer-badge" style="background:linear-gradient(135deg, var(--gold-dark), var(--gold));"><i class="fas fa-tags"></i> ${discountPercent}%</div>`;
        }

        html += `
          <div class="product-card" onclick="goToProductDetails('${product.id}')">
            ${discountBadge}
            <img src="${product.imageUrl || '/gomla/assets/images/no-image.png'}"
                 alt="${product.name}"
                 class="product-image"
                 loading="lazy"
                 onerror="this.src='/gomla/assets/images/no-image.png'">
            <div class="product-body">
              <h4 class="product-name">${product.name}</h4>
              ${product.categoryName ? `
                <p class="product-brand">
                  <i class="fas fa-folder"></i> ${product.categoryName}
                </p>
              ` : ''}
              
              <div class="product-price">
                ${hasOffer ? `
                  <span class="price-after">${offerPrice.toFixed(2)} ج.م</span>
                  <span class="price-before">${price.toFixed(2)} ج.م</span>
                ` : hasDiscount ? `
                  <span class="price-after">${finalPrice.toFixed(2)} ج.م</span>
                  <span class="price-before">${price.toFixed(2)} ج.م</span>
                ` : `
                  ${price.toFixed(2)} ج.م
                `}
                <small>/ ${unit}</small>
              </div>
              
              ${isAvailable ? `
                <button class="btn btn-primary btn-sm"
                        onclick="event.stopPropagation();handleAddToCart('${product.id}')">
                  <i class="fas fa-cart-plus"></i> أضف للسلة
                </button>
              ` : `
                <div class="out-of-stock">
                  <i class="fas fa-times-circle"></i> غير متوفر
                </div>
              `}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      // زر تحميل المزيد
      if (filteredProducts.length > (currentPage + 1) * pageSize) {
        document.getElementById('loadMoreBtn').style.display = 'inline-block';
      } else {
        document.getElementById('loadMoreBtn').style.display = 'none';
      }
    }

    // ============================================================
    // 🔍 التصفية
    // ============================================================

    function applyFilters() {
      const sortValue = document.getElementById('sortFilter').value;
      const availability = document.getElementById('availabilityFilter').value;
      const categoryId = document.getElementById('categoryFilter').value;

      filteredProducts = [...allProducts];

      // فلتر التصنيف
      if (categoryId) {
        filteredProducts = filteredProducts.filter(p => p.categoryId === categoryId);
      }

      // فلتر التوفّر
      if (availability === 'available') {
        filteredProducts = filteredProducts.filter(p => (p.stockQuantity || 0) > 0);
      }

      // ترتيب
      const isWholesale = storeType === 'wholesale';
      switch (sortValue) {
        case 'price-low':
          filteredProducts.sort((a, b) => {
            const priceA = isWholesale ? (a.wholesalePrice || 0) : (a.retailPrice || 0);
            const priceB = isWholesale ? (b.wholesalePrice || 0) : (b.retailPrice || 0);
            return priceA - priceB;
          });
          break;
        case 'price-high':
          filteredProducts.sort((a, b) => {
            const priceA = isWholesale ? (a.wholesalePrice || 0) : (a.retailPrice || 0);
            const priceB = isWholesale ? (b.wholesalePrice || 0) : (b.retailPrice || 0);
            return priceB - priceA;
          });
          break;
        case 'popular':
          filteredProducts.sort((a, b) => (b.salesCount || 0) - (a.salesCount || 0));
          break;
        default:
          filteredProducts.sort((a, b) => 
            (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0)
          );
      }

      currentPage = 0;
      renderProducts();

      document.getElementById('brandCount').innerHTML = `
        <i class="fas fa-box"></i>
        ${filteredProducts.length} منتج
      `;
    }

    // ============================================================
    // 🔄 تحميل المزيد
    // ============================================================

    async function loadMoreProducts() {
      currentPage++;
      const start = currentPage * pageSize;

      try {
        const snapshot = await db.collection(COLLECTIONS.PRODUCTS)
          .where('available', '==', true)
          .where('brandId', '==', brandId)
          .orderBy('createdAt', 'desc')
          .limit(start + pageSize)
          .get();

        const newProducts = [];
        snapshot.forEach(doc => newProducts.push({ id: doc.id, ...doc.data() }));

        const additional = newProducts.slice(start);
        allProducts = [...allProducts, ...additional];
        filteredProducts = [...allProducts];
        
        applyFilters();

      } catch (error) {
        console.error('Error loading more:', error);
        currentPage--;
      }
    }

    // ============================================================
    // 🎞️ السلايدر
    // ============================================================

    async function loadSlider() {
      const track = document.getElementById('sliderTrack');
      const dots = document.getElementById('sliderDots');
      if (!track) return;

      try {
        const snapshot = await db.collection(COLLECTIONS.SLIDER)
          .where('active', '==', true)
          .orderBy('order', 'asc')
          .get();

        if (snapshot.empty) {
          track.innerHTML = `
            <div class="slider-item">
              <div class="slide-placeholder">
                <i class="fas fa-image"></i>
                لا توجد صور
              </div>
            </div>
          `;
          return;
        }

        let slidesHtml = '';
        let dotsHtml = '';
        let index = 0;

        snapshot.forEach(doc => {
          const slide = doc.data();
          const imageUrl = slide.imageUrl || '';
          const title = slide.title || '';
          const link = slide.link || '';
          const captionHtml = title ? `<div class="slider-caption">${title}</div>` : '';
          const content = link ?
            `<a href="${link}"><img src="${imageUrl}" alt="${title}" onerror="this.src='/gomla/assets/images/no-image.png'">${captionHtml}</a>` :
            `<img src="${imageUrl}" alt="${title}" onerror="this.src='/gomla/assets/images/no-image.png'">${captionHtml}`;
          slidesHtml += `<div class="slider-item">${content}</div>`;
          dotsHtml += `<span class="dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></span>`;
          index++;
        });

        track.innerHTML = slidesHtml;
        if (dots) dots.innerHTML = dotsHtml;
        startSliderAuto();

      } catch (error) {
        console.error('Error loading slider:', error);
      }
    }

    function startSliderAuto() {
      slidesCount = document.querySelectorAll('.slider-item').length;
      if (slidesCount <= 1) return;
      if (slideInterval) clearInterval(slideInterval);
      slideInterval = setInterval(() => {
        slideIndex = (slideIndex + 1) % slidesCount;
        updateSlider();
      }, 5000);
    }

    function slideNext() {
      if (slidesCount <= 1) return;
      slideIndex = (slideIndex + 1) % slidesCount;
      updateSlider();
      startSliderAuto();
    }

    function slidePrev() {
      if (slidesCount <= 1) return;
      slideIndex = (slideIndex - 1 + slidesCount) % slidesCount;
      updateSlider();
      startSliderAuto();
    }

    function goToSlide(index) {
      slideIndex = index;
      updateSlider();
      startSliderAuto();
    }

    function updateSlider() {
      const track = document.getElementById('sliderTrack');
      const dots = document.querySelectorAll('.slider-dots .dot');
      if (!track) return;
      track.style.transform = `translateX(${slideIndex * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle('active', i === slideIndex));
    }

    // ============================================================
    // 🛒 إضافة للسلة
    // ============================================================

    async function handleAddToCart(productId) {
      try {
        await addToCart(productId, 1);
      } catch (error) {
        console.error('Error adding to cart:', error);
      }
    }

    function goToProductDetails(productId) {
      window.location.href = `/gomla/product-details.html?id=${productId}&type=${storeType}`;
    }

    // ============================================================
    // 🛠️ رسالة الخطأ
    // ============================================================

    function showError(message) {
      document.getElementById('productsContainer').innerHTML = `
        <div class="empty-state">
          <i class="fas fa-exclamation-triangle"></i>
          <p>${message}</p>
          <a href="/gomla/" class="btn btn-primary">
            <i class="fas fa-arrow-right"></i>
            العودة للرئيسية
          </a>
        </div>
      `;
    }

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      loadPageData();
      console.log('✅ brand-products.html loaded');
    });

    // تصدير
    window.slideNext = slideNext;
    window.slidePrev = slidePrev;
    window.goToSlide = goToSlide;
    window.applyFilters = applyFilters;
    window.loadMoreProducts = loadMoreProducts;
    window.handleAddToCart = handleAddToCart;
    window.goToProductDetails = goToProductDetails;

  </script>

</body>

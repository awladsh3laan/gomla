  function toggleAlertPreview() {
    ciState.alertExpanded = !ciState.alertExpanded;
    const p = document.getElementById('alertPreview');
    if (p) p.classList.toggle('open', ciState.alertExpanded);
    const btn = document.querySelector('.btn-show');
    if (btn) btn.innerHTML = `<i class="fas fa-${ciState.alertExpanded ? 'chevron-up' : 'eye'}"></i> ${ciState.alertExpanded ? 'إخفاء' : 'اعرض الكل'}`;
  }

  // ============================================================
  // Stats & Filters
  // ============================================================
  function updateStats() {
    const all = ciState.merged;
    setText('statTotal', all.length);
    setText('statAvailable', all.filter(r => r.status === 'available').length);
    setText('statLow', all.filter(r => r.status === 'low').length);
    setText('statOut', all.filter(r => r.status === 'out').length);
  }
  function updateTabsCounts() {
    const all = ciState.merged;
    setText('tabCount-all', all.length);
    setText('tabCount-available', all.filter(r => r.status === 'available').length);
    setText('tabCount-low', all.filter(r => r.status === 'low').length);
    setText('tabCount-out', all.filter(r => r.status === 'out').length);
  }
  function setText(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }

  function switchTab(tab, event) {
    if (event) event.preventDefault();
    ciState.currentTab = tab;
    document.querySelectorAll('.ci-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    document.querySelectorAll('.ci-stat').forEach(el => el.classList.remove('active'));
    applyFilters();
  }

  function populateCategoryFilter() {
    const sel = document.getElementById('ciCategory'); if (!sel) return;
    sel.innerHTML = '<option value="">كل التصنيفات</option>' + ciState.categories.map(c => `<option value="${c.id}">${esc(c.name || '')}</option>`).join('');
  }
  function populateBrandFilter() {
    const sel = document.getElementById('ciBrand'); if (!sel) return;
    sel.innerHTML = '<option value="">كل البراندات</option>' + ciState.brands.map(b => `<option value="${b.id}">${esc(b.name || '')}</option>`).join('');
  }

  function onSearchInput() {
    if (ciState.searchDebounce) clearTimeout(ciState.searchDebounce);
    ciState.searchDebounce = setTimeout(applyFilters, 300);
  }

  function applyFilters() {
    let list = [...ciState.merged];
    if (ciState.currentTab === 'available') list = list.filter(r => r.status === 'available');
    else if (ciState.currentTab === 'low') list = list.filter(r => r.status === 'low');
    else if (ciState.currentTab === 'out') list = list.filter(r => r.status === 'out');

    const search = (document.getElementById('ciSearch')?.value || '').trim().toLowerCase();
    if (search) {
      list = list.filter(r => {
        const p = r.product;
        return (p.name || '').toLowerCase().includes(search) ||
               (p.barcode || '').toLowerCase().includes(search) ||
               (p.sku || '').toLowerCase().includes(search) ||
               (p.keywords || '').toLowerCase().includes(search);
      });
    }
    const cat = document.getElementById('ciCategory')?.value || '';
    if (cat) list = list.filter(r => r.product.categoryId === cat);
    const brand = document.getElementById('ciBrand')?.value || '';
    if (brand) list = list.filter(r => r.product.brandId === brand);

    ciState.filtered = list;
    renderList();
  }

  function resetFilters() {
    const s = document.getElementById('ciSearch'); if (s) s.value = '';
    const c = document.getElementById('ciCategory'); if (c) c.value = '';
    const b = document.getElementById('ciBrand'); if (b) b.value = '';
    ciState.currentTab = 'all';
    document.querySelectorAll('.ci-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === 'all'));
    applyFilters();
  }

  function renderList() {
    const container = document.getElementById('ciList'); if (!container) return;
    if (ciState.filtered.length === 0) {
      container.innerHTML = `
        <div class="ci-empty">
          <div class="empty-icon"><i class="fas fa-box-open"></i></div>
          <h3>لا توجد منتجات</h3>
          <p>${ciState.merged.length === 0 ? 'الفرع لا يحتوي على منتجات بعد' : 'لا توجد نتائج مطابقة'}</p>
        </div>`;
      return;
    }
    container.innerHTML = ciState.filtered.map(r => renderCard(r)).join('');
  }

  function renderCard(r) {
    const p = r.product;
    const meta = STATUS_META[r.status];
    let availCls = '';
    if (r.available === 0) availCls = 'zero';
    else if (r.available < r.minAlert) availCls = 'low';
    const canRequest = r.whAvail > 0 && r.status !== 'available';

    return `
      <div class="ci-card ${meta.cls}">
        <img class="ci-card-img" src="${p.imageUrl || '/gomla/assets/images/no-image.png'}" onerror="this.src='/gomla/assets/images/no-image.png'">
        <div class="ci-card-info">
          <div class="ci-card-name">${esc(p.name || 'منتج')}</div>
          <div class="ci-card-meta">
            ${p.barcode ? `<span><i class="fas fa-barcode"></i> ${esc(p.barcode)}</span>` : ''}
            ${p.categoryName ? `<span><i class="fas fa-tag"></i> ${esc(p.categoryName)}</span>` : ''}
            ${p.brandName ? `<span><i class="fas fa-copyright"></i> ${esc(p.brandName)}</span>` : ''}
            <span><i class="fas fa-cubes"></i> ${p.piecesPerUnit || 1} / ${esc(p.unit || 'كرتونة')}</span>
          </div>
          <div class="ci-card-numbers">
            <div class="ci-num-box"><div class="ci-num-lbl">الفعلي</div><div class="ci-num-val">${r.pieces}</div></div>
            <div class="ci-num-box reserved"><div class="ci-num-lbl">محجوز</div><div class="ci-num-val">${r.reserved}</div></div>
            <div class="ci-num-box available ${availCls}"><div class="ci-num-lbl">متاح</div><div class="ci-num-val">${r.available}</div></div>
            <div class="ci-num-box wh"><div class="ci-num-lbl">WH متاح</div><div class="ci-num-val">${r.whAvail}</div></div>
          </div>
          <span class="ci-status-badge ${meta.cls}"><i class="fas fa-${meta.icon}"></i> ${meta.label}</span>
        </div>
        <div class="ci-card-actions">
          <button class="ci-action-btn request" onclick="openTransferRequest('single', '${p.id}')" ${!canRequest ? 'disabled title="غير مطلوب أو لا يوجد مصدر"' : ''}><i class="fas fa-paper-plane"></i> طلب نقل</button>
        </div>
      </div>`;
  }

  // ============================================================
  // Transfer Request
  // ============================================================
  function openTransferRequest(mode, productId) {
    let sourceItems = [];
    if (mode === 'all') {
      sourceItems = ciState.alertItems.map(it => ({
        product: it.product, reason: it.reason, reasonText: it.reasonText,
        currentAtDest: it.currentAtDest, availableAtSource: it.availableAtSource,
        suggestedQty: it.suggestedQty, checked: true
      }));
    } else {
      const r = ciState.merged.find(x => x.product.id === productId);
      if (!r) return;
      if (r.whAvail <= 0) { window.showToast('لا يوجد مخزون في WH', 'warning'); return; }
      const suggested = (r.status === 'out') ? Math.max(r.minAlert, 10) : Math.max(r.minAlert - r.available, 1);
      sourceItems = [{
        product: r.product, reason: r.status === 'low' ? 'low' : 'out',
        reasonText: r.status === 'low' ? 'أقل من العتبة' : 'خلص من الفرع',
        currentAtDest: r.available, availableAtSource: r.whAvail,
        suggestedQty: suggested, checked: true
      }];
    }
    if (sourceItems.length === 0) { window.showToast('لا توجد منتجات لطلب نقلها', 'warning'); return; }
    ciState._transferReqItems = sourceItems;

    const itemsHtml = sourceItems.map((it, idx) => `
      <div class="tr-item-row" id="trq-item-${idx}" style="grid-template-columns:24px 48px 1fr 110px;">
        <input type="checkbox" checked onchange="onTransferItemToggle(${idx}, this.checked)">
        <img src="${it.product.imageUrl || '/gomla/assets/images/no-image.png'}" onerror="this.src='/gomla/assets/images/no-image.png'">
        <div class="tr-item-info">
          <div class="tr-item-name">${esc(it.product.name || '')}</div>
          <div class="tr-item-meta">WH: <strong>${it.availableAtSource}</strong> · عندنا: <strong>${it.currentAtDest}</strong></div>
        </div>
        <div class="tr-item-qty">
          <input type="number" min="1" max="${it.availableAtSource}" value="${it.suggestedQty}" onchange="onTransferQtyChange(${idx}, this.value)">
        </div>
      </div>`).join('');

    const html = `
      <div class="modal-overlay show" id="transferReqModal" onclick="closeModal('transferReqModal')">
        <div class="modal-content medium" onclick="event.stopPropagation()">
          <div class="modal-header blue">
            <h2><i class="fas fa-paper-plane"></i> طلب نقل من المخزن المركزي</h2>
            <button class="modal-close" onclick="closeModal('transferReqModal')">&times;</button>
          </div>
          <div class="modal-body">
            <div class="info-box blue">
              <i class="fas fa-info-circle"></i>
              <div>
                <div><strong>من:</strong> ${esc(ciState.whBranch?.name || 'المخزن المركزي')}</div>
                <div><strong>إلى:</strong> ${esc(ciState.branchName)}</div>
              </div>
            </div>
            <h4 style="font-size:0.9rem;font-weight:900;color:var(--navy);margin-bottom:10px;"><i class="fas fa-boxes" style="color:var(--gold);"></i> المنتجات</h4>
            <div id="trqItemsList">${itemsHtml}</div>
            <div style="margin-top:12px;">
              <label style="display:block;font-weight:800;font-size:0.85rem;margin-bottom:6px;">ملاحظات (اختياري)</label>
              <textarea id="trqNotes" maxlength="300" placeholder="أي تفاصيل..." style="width:100%;padding:10px 12px;border:2px solid var(--gray-200);border-radius:6px;font-family:inherit;font-size:0.88rem;min-height:60px;resize:vertical;"></textarea>
            </div>
            <div style="background:#eff6ff;border:2px solid #93c5fd;border-radius:10px;padding:12px 16px;margin-top:12px;">
              <div style="display:flex;justify-content:space-between;font-size:0.9rem;"><span><strong id="trqCount">${sourceItems.length}</strong> منتج</span><span>إجمالي: <strong id="trqTotal">${sourceItems.reduce((s, i) => s + i.suggestedQty, 0)}</strong> قطعة</span></div>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal('transferReqModal')">إلغاء</button>
            <button class="btn btn-primary" id="trqSubmitBtn" onclick="submitTransferRequest()"><i class="fas fa-paper-plane"></i> إرسال</button>
          </div>
        </div>
      </div>`;
    document.getElementById('modalContainer').innerHTML = html;
    document.body.style.overflow = 'hidden';
  }

  function onTransferItemToggle(idx, checked) {
    const row = document.getElementById(`trq-item-${idx}`);
    if (row) row.style.opacity = checked ? '1' : '0.5';
    updateTransferSummary();
  }
  function onTransferQtyChange(idx, val) {
    const it = ciState._transferReqItems[idx]; if (!it) return;
    it.suggestedQty = Math.max(1, Math.min(parseInt(val) || 0, it.availableAtSource));
  }
  function updateTransferSummary() {
    const items = ciState._transferReqItems || [];
    let sel = 0, tot = 0;
    items.forEach((it, idx) => {
      const row = document.getElementById(`trq-item-${idx}`);
      const chk = row?.querySelector('input[type="checkbox"]');
      if (!chk?.checked) return;
      const q = parseInt(row?.querySelector('input[type="number"]')?.value) || it.suggestedQty;
      sel++; tot += q;
    });
    const sc = document.getElementById('trqCount'); if (sc) sc.textContent = sel;
    const st = document.getElementById('trqTotal'); if (st) st.textContent = tot;
  }

  async function submitTransferRequest() {
    const items = ciState._transferReqItems || [];
    const selectedItems = [];
    items.forEach((it, idx) => {
      const row = document.getElementById(`trq-item-${idx}`);
      const chk = row?.querySelector('input[type="checkbox"]');
      if (!chk?.checked) return;
      const qty = Math.max(1, parseInt(row?.querySelector('input[type="number"]')?.value) || it.suggestedQty);
      selectedItems.push({
        productId: it.product.id, productName: it.product.name || '',
        productImage: it.product.imageUrl || '', unit: it.product.unit || 'قطعة',
        piecesPerUnit: it.product.piecesPerUnit || 1,
        requestedPieces: qty, availableAtSource: it.availableAtSource,
        currentAtDest: it.currentAtDest, reason: it.reason
      });
    });
    if (selectedItems.length === 0) { window.showToast('اختر منتج واحد', 'warning'); return; }

    const notes = (document.getElementById('trqNotes')?.value || '').trim();
    const btn = document.getElementById('trqSubmitBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>...';

    try {
      const now = firebase.firestore.FieldValue.serverTimestamp();
      const reqRef = db.collection('transfer_requests').doc();
      await reqRef.set({
        id: reqRef.id,
        fromBranchId: ciState.whBranch?.id || 'WH',
        fromBranchName: ciState.whBranch?.name || 'المخزن المركزي',
        toBranchId: ciState.branchId, toBranchName: ciState.branchName,
        items: selectedItems, totalItems: selectedItems.length,
        totalPieces: selectedItems.reduce((s, i) => s + i.requestedPieces, 0),
        status: 'pending',
        requestedBy: ciState.userId, requestedByName: ciState.userName,
        requestedByRole: ciState.userRole, requestedAt: now,
        approvedBy: '', approvedByName: '', approvedAt: null,
        rejectedBy: '', rejectedByName: '', rejectedAt: null, rejectionReason: '',
        completedAt: null, completedBy: '', transferId: '',
        notes, createdAt: now, updatedAt: now
      });

      try {
        await db.collection('admin_notifications').add({
          userId: 'all_admins',
          title: '📤 طلب نقل جديد',
          body: `${ciState.userName} (${ciState.userRole}) طلب ${selectedItems.length} منتج إلى ${ciState.branchName}`,
          type: 'transfer_request_created', transferRequestId: reqRef.id,
          read: false, createdAt: now
        });
      } catch (e) { console.warn(e); }

      window.showToast('✅ تم إرسال الطلب', 'success');
      closeModal('transferReqModal');
      ciState._transferReqItems = [];
    } catch (err) {
      console.error('submitTransferRequest:', err);
      window.showToast('❌ ' + err.message, 'error');
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال';
    }
  }

  // ============================================================
  // Helpers & Exports
  // ============================================================
  function closeAllModals() { document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show')); document.body.style.overflow = ''; }
  function closeModal(id) { document.getElementById(id)?.classList.remove('show'); document.body.style.overflow = ''; }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function toMs(t) { if (!t) return 0; if (t.toMillis) return t.toMillis(); if (t.toDate) return t.toDate().getTime(); if (t instanceof Date) return t.getTime(); return 0; }

  window.loadAll = loadAll;
  window.switchTab = switchTab;
  window.onSearchInput = onSearchInput;
  window.applyFilters = applyFilters;
  window.resetFilters = resetFilters;
  window.openReceiveModal = openReceiveModal;
  window.onReceiptReceivedChange = onReceiptReceivedChange;
  window.onReceiptDamagedChange = onReceiptDamagedChange;
  window.confirmReceipt = confirmReceipt;
  window.openTransitDetails = openTransitDetails;
  window.printTransferReceipt = printTransferReceipt;
  window.toggleAlertPreview = toggleAlertPreview;
  window.openTransferRequest = openTransferRequest;
  window.onTransferItemToggle = onTransferItemToggle;
  window.onTransferQtyChange = onTransferQtyChange;
  window.submitTransferRequest = submitTransferRequest;
  window.selectBranch = selectBranch;
  window.closeModal = closeModal;
  window.closeAllModals = closeAllModals;
  </script>

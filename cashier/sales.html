  // ============================================================
  // Return Modal (super/admin_plus only, within 48h)
  // ============================================================
  async function openReturnModal(saleId) {
    if (!posState.isAdmin) { window.showToast('صلاحية super/admin_plus فقط', 'warning'); return; }
    try {
      const doc = await db.collection('cashier_sales').doc(saleId).get();
      if (!doc.exists) return;
      const sale = { id: doc.id, ...doc.data() };
      if (sale.status !== 'completed') { window.showToast('لا يمكن الإرجاع', 'warning'); return; }
      const remaining = getReturnRemaining(sale.createdAt);
      if (remaining.expired) { window.showToast('انتهت مدة الإرجاع (48 ساعة)', 'error'); return; }

      const html = `
        <div class="modal-overlay show" id="returnModal" onclick="closeModal('returnModal')">
          <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header red">
              <h2><i class="fas fa-undo"></i> مرتجع الفاتورة</h2>
              <button class="modal-close" onclick="closeModal('returnModal')">&times;</button>
            </div>
            <div class="modal-body">
              <div class="return-warning">
                <i class="fas fa-exclamation-triangle"></i>
                <div>متبقي للإرجاع: <strong>${remaining.text}</strong><br>سيتم إرجاع المنتجات للمخزون وإرجاع المبلغ للعميل.</div>
              </div>
              <div style="background:#f0f9ff;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:0.85rem;color:#1e40af;">
                <strong>${esc(sale.trackCode || sale.id.slice(-8))}</strong> · ${(sale.total || 0).toFixed(2)} ج
              </div>
              <h4 style="font-size:0.9rem;font-weight:900;color:var(--navy);margin-bottom:10px;">اختر المنتجات المرتجعة</h4>
              ${(sale.items || []).map((it, i) => `
                <div style="display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--gray-200);border-radius:8px;margin-bottom:6px;">
                  <input type="checkbox" class="return-item-check" data-idx="${i}" checked style="width:18px;height:18px;accent-color:#c9a84c;cursor:pointer;">
                  <img src="${it.productImage || '/gomla/assets/images/no-image.png'}" style="width:36px;height:36px;border-radius:4px;object-fit:cover;" onerror="this.src='/gomla/assets/images/no-image.png'">
                  <div style="flex:1;min-width:0;">
                    <div style="font-size:0.82rem;font-weight:800;color:var(--navy);">${esc(it.productName)}</div>
                    <div style="font-size:0.7rem;color:var(--gray-500);">${it.qty} × ${it.price.toFixed(2)} ج</div>
                  </div>
                  <input type="number" class="return-item-qty" data-idx="${i}" min="0" max="${it.qty}" value="${it.qty}" style="width:60px;padding:6px;border:1px solid var(--gray-300);border-radius:4px;text-align:center;font-weight:800;">
                </div>
              `).join('')}
              <div class="form-group" style="margin-top:12px;">
                <label>سبب الإرجاع <span class="required">*</span></label>
                <select id="returnReason" style="padding:10px 12px;">
                  <option value="">— اختر —</option>
                  <option value="customer_request">طلب العميل</option>
                  <option value="defective">منتج معيب</option>
                  <option value="wrong_item">منتج خاطئ</option>
                  <option value="other">أخرى</option>
                </select>
              </div>
              <div id="returnSummary" style="background:#f0fdf4;border:2px solid #86efac;border-radius:10px;padding:12px;margin-top:12px;text-align:center;font-size:0.9rem;color:#166534;">
                <strong>سيتم استرداد:</strong> <span id="returnTotalPreview" style="font-size:1.2rem;font-weight:900;">${(sale.total || 0).toFixed(2)} ج</span>
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-outline" onclick="closeModal('returnModal')">إلغاء</button>
              <button class="btn btn-danger" onclick="confirmReturn('${saleId}')"><i class="fas fa-undo"></i> تأكيد المرتجع</button>
            </div>
          </div>
        </div>`;
      document.getElementById('modalContainer').innerHTML = html;
      document.body.style.overflow = 'hidden';

      setTimeout(() => {
        document.querySelectorAll('.return-item-check, .return-item-qty').forEach(el => {
          el.addEventListener('input', () => updateReturnPreview(sale));
          el.addEventListener('change', () => updateReturnPreview(sale));
        });
        updateReturnPreview(sale);
      }, 100);
    } catch (e) { console.error(e); }
  }

  function updateReturnPreview(sale) {
    let total = 0;
    (sale.items || []).forEach((it, i) => {
      const chk = document.querySelector(`.return-item-check[data-idx="${i}"]`);
      const inp = document.querySelector(`.return-item-qty[data-idx="${i}"]`);
      if (!chk?.checked) return;
      const qty = Math.min(parseInt(inp?.value) || 0, it.qty);
      total += qty * (it.price || 0);
    });
    const el = document.getElementById('returnTotalPreview');
    if (el) el.textContent = total.toFixed(2) + ' ج';
  }

  async function confirmReturn(saleId) {
    const reason = document.getElementById('returnReason')?.value;
    if (!reason) { window.showToast('سبب الإرجاع مطلوب', 'warning'); return; }

    try {
      const docRef = db.collection('cashier_sales').doc(saleId);
      const snap = await docRef.get();
      if (!snap.exists) return;
      const sale = snap.data();

      const returnItems = [];
      let refundAmount = 0;
      (sale.items || []).forEach((it, i) => {
        const chk = document.querySelector(`.return-item-check[data-idx="${i}"]`);
        const inp = document.querySelector(`.return-item-qty[data-idx="${i}"]`);
        if (!chk?.checked) return;
        const qty = Math.min(parseInt(inp?.value) || 0, it.qty);
        if (qty <= 0) return;
        const subtotal = qty * (it.price || 0);
        returnItems.push({ ...it, returnedQty: qty, returnedSubtotal: subtotal });
        refundAmount += subtotal;
      });

      if (returnItems.length === 0) { window.showToast('اختر منتج واحد على الأقل', 'warning'); return; }

      // Confirm
      if (!confirm(`تأكيد المرتجع؟\nسيتم استرداد: ${refundAmount.toFixed(2)} ج\nسيتم إرجاع المنتجات للمخزون.`)) return;

      const now = firebase.firestore.FieldValue.serverTimestamp();

      await db.runTransaction(async (tx) => {
        // Reads first
        const saleDoc = await tx.get(docRef);
        if (!saleDoc.exists) throw new Error('الفاتورة غير موجودة');
        const saleData = saleDoc.data();

        const invSnapshots = [];
        for (const it of returnItems) {
          const invRef = db.collection('branch_inventory').doc(`${posState.branchId}_${it.productId}`);
          const invDoc = await tx.get(invRef);
          invSnapshots.push({ ref: invRef, exists: invDoc.exists, data: invDoc.data(), item: it });
        }

        // Writes
        for (const s of invSnapshots) {
          if (s.exists) {
            tx.update(s.ref, {
              piecesQty: firebase.firestore.FieldValue.increment(s.item.returnedQty),
              availableQty: firebase.firestore.FieldValue.increment(s.item.returnedQty),
              lastUpdated: now
            });
          } else {
            tx.set(s.ref, {
              branchId: posState.branchId, productId: s.item.productId,
              piecesQty: s.item.returnedQty, reservedQty: 0, availableQty: s.item.returnedQty,
              minAlert: 10, productName: s.item.productName, productImage: s.item.productImage,
              unit: s.item.unit, piecesPerUnit: s.item.piecesPerUnit,
              lastUpdated: now, updatedBy: posState.userId
            });
          }
        }

        // Cashbox expense
        const cbRef = db.collection('cashbox').doc();
        tx.set(cbRef, {
          id: cbRef.id, type: 'expense', category: 'customer_refund', source: 'cashier',
          branchId: posState.branchId,
          relatedId: saleId, relatedType: 'cashier_sale_return',
          amount: refundAmount, method: saleData.paymentMethod || 'cash',
          description: `مرتجع فاتورة #${saleData.trackCode || saleId.slice(-8)}`,
          status: 'approved',
          createdBy: posState.userId, createdByName: posState.userName, createdByRole: posState.userRole,
          approvedBy: posState.userId, approvedByName: posState.userName, approvedAt: now,
          createdAt: now
        });

        // Branch balance
        const brRef = db.collection('branches').doc(posState.branchId);
        tx.update(brRef, { cashBalance: firebase.firestore.FieldValue.increment(-refundAmount) });

        // Sale update
        const isFullReturn = refundAmount >= (saleData.total || 0);
        tx.update(docRef, {
          status: isFullReturn ? 'returned' : 'partial_return',
          returnedAt: now, returnItems,
          returnReason: reason, returnAmount: refundAmount,
          updatedAt: now
        });

        // Returns collection
        const rRef = db.collection('returns').doc();
        tx.set(rRef, {
          id: rRef.id,
          returnType: 'cashier_sale',
          saleId, trackCode: saleData.trackCode,
          branchId: posState.branchId, branchName: posState.branchName,
          items: returnItems, totalAmount: refundAmount,
          reason, refundMethod: saleData.paymentMethod || 'cash',
          status: 'approved',
          createdBy: posState.userId, createdByName: posState.userName, createdByRole: posState.userRole,
          createdAt: now
        });
      });

      window.showToast('✅ تم تسجيل المرتجع', 'success');
      closeModal('returnModal');
      loadProductsAndInventory();
      loadTodaySales().then(() => { renderStatsTab(); renderHistory(); });

    } catch (err) {
      console.error('confirmReturn:', err);
      window.showToast('❌ ' + err.message, 'error');
    }
  }

  // ============================================================
  // Camera (BarcodeDetector API)
  // ============================================================
  async function openCamera() {
    if (!('BarcodeDetector' in window)) {
      window.showToast('الكاميرا غير مدعومة على هذا المتصفح — استخدم قارئ باركود خارجي', 'warning');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      posState._cameraStream = stream;

      const html = `
        <div class="modal-overlay show" id="cameraModal" onclick="closeCamera()">
          <div class="modal-content small" onclick="event.stopPropagation()">
            <div class="modal-header green">
              <h2><i class="fas fa-camera"></i> مسح الباركود</h2>
              <button class="modal-close" onclick="closeCamera()">&times;</button>
            </div>
            <div class="modal-body">
              <div class="camera-preview">
                <video id="cameraVideo" autoplay playsinline></video>
                <div class="scan-line"></div>
              </div>
              <p style="text-align:center;color:var(--gray-600);font-size:0.85rem;">وجّه الكاميرا نحو الباركود</p>
            </div>
          </div>
        </div>`;
      document.getElementById('modalContainer').innerHTML = html;
      document.body.style.overflow = 'hidden';

      const video = document.getElementById('cameraVideo');
      video.srcObject = stream;

      const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e'] });
      posState._cameraInterval = setInterval(async () => {
        try {
          const barcodes = await detector.detect(video);
          if (barcodes.length > 0) {
            const code = barcodes[0].rawValue;
            if (code) {
              playBeep(900, 80);
              closeCamera();
              handleBarcodeEnter(code);
            }
          }
        } catch (e) {}
      }, 500);
    } catch (err) {
      console.error('openCamera:', err);
      window.showToast('لا يمكن الوصول للكاميرا — تحقق من الأذونات', 'error');
    }
  }

  function closeCamera() {
    if (posState._cameraInterval) { clearInterval(posState._cameraInterval); posState._cameraInterval = null; }
    if (posState._cameraStream) { posState._cameraStream.getTracks().forEach(t => t.stop()); posState._cameraStream = null; }
    closeModal('cameraModal');
  }

  // ============================================================
  // Draft Auto-save
  // ============================================================
  function setupDraft() {
    if (posState._draftSetup) return;
    posState._draftSetup = true;
    posState._draft = createDraft({
      key: DRAFT_KEY_BASE + '_' + posState.branchId,
      getState: () => ({
        cart: posState.cart,
        discountType: posState.cartDiscountType,
        discountValue: posState.cartDiscountValue,
        saleType: posState.saleType,
        customerName: posState.customerName,
        customerPhone: posState.customerPhone,
        paymentMethod: posState.paymentMethod
      }),
      onRestore: (data) => {
        posState.cart = data.cart || [];
        posState.cartDiscountType = data.discountType || '';
        posState.cartDiscountValue = data.discountValue || 0;
        posState.saleType = data.saleType || 'cash';
        posState.customerName = data.customerName || '';
        posState.customerPhone = data.customerPhone || '';
        posState.paymentMethod = data.paymentMethod || 'cash';
        renderCart();
      }
    });
  }

  function scheduleDraftSave() {
    if (posState._draft) posState._draft.autoSave();
  }

  function tryRestoreDraft() {
    if (!posState._draft) return;
    const draft = posState._draft.tryRestore();
    if (draft?.data && (draft.data.cart?.length > 0 || draft.data.customerName)) {
      showDraftBanner(draft.ageHours);
    }
  }

  function showDraftBanner(ageHours) {
    const container = document.getElementById('draftBannerContainer');
    if (!container) return;
    const ageText = ageHours < 1 ? 'قبل قليل' : Math.floor(ageHours) + ' ساعة';
    container.innerHTML = `
      <div class="pos-draft-banner" id="draftBanner">
        <i class="fas fa-history"></i>
        <div style="flex:1;">
          <strong>تم استعادة العمل السابق</strong> — تم الحفظ تلقائياً ${ageText}
          ${posState.cart.length > 0 ? ` · ${posState.cart.length} منتج في السلة` : ''}
        </div>
        <button class="btn-sm" onclick="startFreshFromDraft()">بدء جديد</button>
      </div>`;
  }

  function removeDraftBanner() {
    const el = document.getElementById('draftBanner');
    if (el) el.remove();
  }

  function startFreshFromDraft() {
    if (posState._draft) posState._draft.clear();
    posState.cart = [];
    posState.cartDiscountType = '';
    posState.cartDiscountValue = 0;
    posState.customerName = '';
    posState.customerPhone = '';
    posState.saleType = 'cash';
    posState.paymentMethod = 'cash';
    renderCart();
    removeDraftBanner();
    window.showToast('تم البدء من جديد', 'success');
  }

  // ============================================================
  // Tabs switching
  // ============================================================
  function switchPosTab(tab) {
    document.querySelectorAll('.pos-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    ['sale', 'products', 'stats', 'history'].forEach(t => {
      const el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
      if (el) el.style.display = t === tab ? 'block' : 'none';
    });
    if (tab === 'stats') renderStatsTab();
    if (tab === 'history') renderHistory();
  }

  // ============================================================
  // Helpers
  // ============================================================
  function closeAllModals() {
    document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
    document.body.style.overflow = '';
  }
  function closeModal(id) {
    document.getElementById(id)?.classList.remove('show');
    document.body.style.overflow = '';
  }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  window.switchPosTab = switchPosTab;
  window.onSearchProducts = onSearchProducts;
  window.onSearchAllProducts = onSearchAllProducts;
  window.handleBarcodeEnter = handleBarcodeEnter;
  window.addProductToCart = addProductToCart;
  window.updateCartQty = updateCartQty;
  window.removeFromCart = removeFromCart;
  window.clearCart = clearCart;
  window.openDiscountModal = openDiscountModal;
  window.setDiscountType = setDiscountType;
  window.applyDiscount = applyDiscount;
  window.clearDiscount = clearDiscount;
  window.openPaymentModal = openPaymentModal;
  window.setSaleType = setSaleType;
  window.setPaymentMethod = setPaymentMethod;
  window.confirmSale = confirmSale;
  window.openPrintPicker = openPrintPicker;
  window.doPrint = doPrint;
  window.openReturnModal = openReturnModal;
  window.confirmReturn = confirmReturn;
  window.updateReturnPreview = updateReturnPreview;
  window.openCamera = openCamera;
  window.closeCamera = closeCamera;
  window.renderHistory = renderHistory;
  window.resetHistoryFilters = resetHistoryFilters;
  window.reloadProducts = reloadProducts;
  window.startFreshFromDraft = startFreshFromDraft;
  window.closeModal = closeModal;
  window.closeAllModals = closeAllModals;
  </script>

</body>

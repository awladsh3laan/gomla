<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العروض - أولاد شعلان</title>

  <meta name="description" content="عروض حصرية على منتجات القطاعي - أولاد شعلان">
  <meta name="theme-color" content="#1a2a4a">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       🎨 ستايل صفحة العروض (للقطاعي فقط)
       ============================================================ */

    /* ===== رأس الصفحة ===== */
    .offers-hero {
      background: linear-gradient(135deg, #c0392b 0%, #e74c3c 50%, #c0392b 100%);
      border-radius: var(--radius-lg);
      padding: 40px 24px;
      margin-bottom: 24px;
      text-align: center;
      color: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(231, 76, 60, 0.3);
    }

    .offers-hero::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }

    .offers-hero::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 10s ease-in-out infinite reverse;
    }

    .offers-hero-content {
      position: relative;
      z-index: 2;
    }

    .offers-hero-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #ffd700;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      border: 3px solid #ffd700;
      animation: fire-pulse 2s ease-in-out infinite;
      backdrop-filter: blur(10px);
    }

    @keyframes fire-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 12px rgba(255, 215, 0, 0);
      }
    }

    .offers-hero h1 {
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .offers-hero h1 i {
      color: #ffd700;
      animation: fire-pulse 1.5s ease-in-out infinite;
    }

    .offers-hero p {
      font-size: 1rem;
      opacity: 0.95;
      margin-bottom: 12px;
    }

    .offers-hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffd700;
      color: #c0392b;
      padding: 8px 20px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(255, 215, 0, 0.4);
      animation: badge-bounce-offer 2s ease-in-out infinite;
    }

    @keyframes badge-bounce-offer {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* ===== كارت العرض (مميز) ===== */
    .offer-card {
      position: relative;
      background: var(--white);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      border: 2px solid var(--danger);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .offer-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(231, 76, 60, 0.25);
      border-color: #c0392b;
    }

    /* شريط خصم علوي */
    .offer-card .discount-ribbon {
      position: absolute;
      top: 12px;
      left: 12px;
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      color: var(--white);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 900;
      z-index: 5;
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
      display: flex;
      align-items: center;
      gap: 4px;
      animation: ribbon-pulse 1.5s ease-in-out infinite;
    }

    @keyframes ribbon-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* مؤقت العرض */
    .offer-card .offer-timer {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 26, 46, 0.9);
      color: var(--gold-light);
      padding: 5px 12px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(10px);
    }

    .offer-card .offer-timer i {
      color: #ffd700;
      animation: clock-tick 1s linear infinite;
    }

    @keyframes clock-tick {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }

    .offer-card .offer-timer.urgent {
      background: rgba(231, 76, 60, 0.95);
      color: white;
    }

    .offer-card .offer-timer.urgent i {
      color: white;
    }

    /* السعر */
    .offer-card .price-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 8px 0 10px;
    }

    .offer-card .price-row-main {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .offer-card .offer-price {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--danger);
      line-height: 1.2;
    }

    .offer-card .offer-price small {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--gray-500);
    }

    .offer-card .original-price {
      font-size: 0.9rem;
      color: var(--gray-400);
      text-decoration: line-through;
      font-weight: 500;
    }

    .offer-card .saving-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      background: rgba(34, 197, 94, 0.15);
      color: #16a34a;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
      align-self: flex-start;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    /* ===== سيكشنات ===== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--white);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
      align-items: center;
      border: 1px solid var(--gray-200);
    }

    .filter-bar select {
      padding: 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--gray-50);
      min-width: 140px;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-bar select:focus {
      outline: none;
      border-color: var(--danger);
      box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.15);
      background: var(--white);
    }

    .filter-bar .filter-icon {
      color: var(--danger);
      font-size: 1rem;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) and (pointer: coarse) {
      .offers-hero {
        padding: 28px 16px;
      }

      .offers-hero-icon {
        width: 60px;
        height: 60px;
        font-size: 1.6rem;
      }

      .offers-hero h1 {
        font-size: 1.6rem;
      }

      .offers-hero p {
        font-size: 0.9rem;
      }

      .offers-hero-badge {
        padding: 6px 14px;
        font-size: 0.75rem;
      }

      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-bar select {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- مكونات الموبايل -->
  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>

  <!-- الهيدر -->
  <div id="header-placeholder"></div>

  <!-- المحتوى -->
  <main class="page-content">
    <div class="container">

      <!-- مسار التنقل -->
      <div class="breadcrumb">
        <a href="/gomla/">الرئيسية</a>
        <span>›</span>
        <a href="/gomla/store-retail.html">المتجر</a>
        <span>›</span>
        <span>العروض</span>
      </div>

      <!-- رأس الصفحة -->
      <section class="offers-hero">
        <div class="offers-hero-content">
          <div class="offers-hero-icon">
            <i class="fas fa-fire"></i>
          </div>
          <h1>
            <i class="fas fa-percent"></i>
            عروض حصرية
          </h1>
          <p>أفضل العروض على منتجات القطاعي</p>
          <div class="offers-hero-badge">
            <i class="fas fa-bolt"></i>
            خصومات تصل إلى 70%
          </div>
        </div>
      </section>

      <!-- سلايدر مصغر -->
      <section class="slider-section" id="slider-section" style="margin-bottom:24px;">
        <div class="slider-container" id="sliderContainer">
          <div class="slider-track" id="sliderTrack">
            <div class="slider-item">
              <div class="slide-placeholder">
                <i class="fas fa-spinner fa-spin"></i>
                جاري التحميل...
              </div>
            </div>
          </div>
          <button class="slider-btn prev" onclick="slidePrev()" aria-label="السابق">
            <i class="fas fa-chevron-right"></i>
          </button>
          <button class="slider-btn next" onclick="slideNext()" aria-label="التالي">
            <i class="fas fa-chevron-left"></i>
          </button>
          <div class="slider-dots" id="sliderDots"></div>
        </div>
      </section>

      <!-- شريط البحث -->
      <section class="smart-search desktop-only" style="margin-bottom:24px;">
        <div class="search-wrapper" onclick="openSearchModal()" style="cursor:pointer;">
          <i class="fas fa-search"></i>
          <input type="text" 
                 placeholder="ابحث في العروض..." 
                 readonly
                 style="cursor:pointer;">
          <button class="search-btn" type="button">
            <i class="fas fa-arrow-left"></i> بحث
          </button>
        </div>
      </section>

      <!-- الفلاتر -->
      <div class="filter-bar">
        <i class="fas fa-sliders-h filter-icon"></i>
        <select id="sortFilter" onchange="applyFilters()">
          <option value="discount-high">أعلى خصم</option>
          <option value="discount-low">أقل خصم</option>
          <option value="price-low">السعر: الأقل للأعلى</option>
          <option value="price-high">السعر: الأعلى للأقل</option>
          <option value="newest">الأحدث</option>
          <option value="ending-soon">ينتهي قريباً</option>
        </select>
        <select id="categoryFilter" onchange="applyFilters()">
          <option value="">كل الأقسام</option>
        </select>
        <select id="brandFilter" onchange="applyFilters()">
          <option value="">كل البراندات</option>
        </select>
      </div>

      <!-- شبكة العروض -->
      <div class="products-grid" id="offersContainer">
        <div class="loading-spinner">
          <i class="fas fa-spinner fa-spin"></i>
          جاري التحميل...
        </div>
      </div>

      <!-- تحميل المزيد -->
      <div style="text-align:center;margin-top:20px;">
        <button class="btn btn-outline" id="loadMoreBtn" onclick="loadMoreOffers()" style="display:none;">
          <i class="fas fa-chevron-down"></i>
          تحميل المزيد
        </button>
      </div>

    </div>
  </main>

  <!-- التبويبات السفلى -->
  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>

  <!-- الفوتر -->
  <div id="footer-placeholder"></div>

  <!-- السايدبار -->
  <div id="sidebar-placeholder"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- نافذة البحث -->
  <div class="search-modal-overlay" id="searchModalOverlay" onclick="closeSearchModal(event)">
    <div class="search-modal" onclick="event.stopPropagation()">
      <div class="search-modal-header">
        <i class="fas fa-search search-icon"></i>
        <input type="text" 
               id="searchModalInput" 
               placeholder="ابحث عن منتج..."
               autocomplete="off"
               oninput="handleModalSearch(this.value)"
               onkeydown="handleSearchKeydown(event)">
        <button class="search-modal-close" onclick="closeSearchModal()" aria-label="إغلاق">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="search-modal-body" id="searchModalBody">
        <div id="searchInitialContent">
          <div class="search-suggestions-header">
            <i class="fas fa-fire"></i>
            اقتراحات سريعة
          </div>
          <div class="search-suggestions-chips">
            <a href="#" class="search-chip" onclick="quickSearch('منظف')">
              <i class="fas fa-spray-can"></i>
              منظفات
            </a>
            <a href="#" class="search-chip" onclick="quickSearch('ورق')">
              <i class="fas fa-toilet-paper"></i>
              ورقيات
            </a>
            <a href="#" class="search-chip" onclick="quickSearch('صابون')">
              <i class="fas fa-soap"></i>
              صابون
            </a>
          </div>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="search-keyboard-hint">
        <span><kbd>ESC</kbd> للإغلاق</span>
        <span><kbd>Enter</kbd> للبحث</span>
      </div>
    </div>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 offers.html - صفحة العروض (للقطاعي فقط)
    // ============================================================

    // ===== المتغيرات =====
    let allOffers = [];
    let filteredOffers = [];
    let currentPage = 0;
    const pageSize = 12;
    let slidesCount = 0;
    let slideIndex = 0;
    let slideInterval = null;
    let timerInterval = null;

    // ============================================================
    // 🚀 تحميل الصفحة
    // ============================================================

    async function loadPageData() {
      // 🔒 حماية: القطاعي فقط
      const user = getCurrentUser();
      if (user && user.data) {
        const role = user.data.role;
        if (role === ROLES.WHOLESALE) {
          showToast('⚠️ العروض متاحة للعملاء القطاعيين فقط', 'warning');
          setTimeout(() => {
            window.location.href = '/gomla/store-wholesale.html';
          }, 1500);
          return;
        }
      }

      await loadOffers();
      await loadFilters();
      loadSlider();

      // تشغيل مؤقت تحديث العداد
      startTimersUpdate();
    }

    // ============================================================
    // 🎯 تحميل العروض
    // ============================================================

    async function loadOffers() {
      const container = document.getElementById('offersContainer');
      if (!container) return;

      try {
        const snapshot = await db.collection(COLLECTIONS.PRODUCTS)
          .where('available', '==', true)
          .where('hasRetailOffer', '==', true)
          .orderBy('updatedAt', 'desc')
          .limit(pageSize)
          .get();

        allOffers = [];
        snapshot.forEach(doc => {
          allOffers.push({ id: doc.id, ...doc.data() });
        });

        filteredOffers = [...allOffers];
        renderOffers();

        if (allOffers.length >= pageSize) {
          document.getElementById('loadMoreBtn').style.display = 'inline-block';
        }

      } catch (error) {
        console.error('Error loading offers:', error);
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>حدث خطأ في تحميل العروض</p>
          </div>
        `;
      }
    }

    // ============================================================
    // 📂 تحميل الفلاتر (الأقسام والبراندات)
    // ============================================================

    async function loadFilters() {
      const categories = new Map();
      const brands = new Map();

      allOffers.forEach(p => {
        if (p.categoryId && p.categoryName) {
          categories.set(p.categoryId, p.categoryName);
        }
        if (p.brandId && p.brandName) {
          brands.set(p.brandId, p.brandName);
        }
      });

      // الأقسام
      const catSelect = document.getElementById('categoryFilter');
      if (catSelect && categories.size > 0) {
        let html = '<option value="">كل الأقسام</option>';
        categories.forEach((name, id) => {
          html += `<option value="${id}">${name}</option>`;
        });
        catSelect.innerHTML = html;
      } else if (catSelect) {
        catSelect.parentElement.querySelector('select#categoryFilter').style.display = 'none';
      }

      // البراندات
      const brandSelect = document.getElementById('brandFilter');
      if (brandSelect && brands.size > 0) {
        let html = '<option value="">كل البراندات</option>';
        brands.forEach((name, id) => {
          html += `<option value="${id}">${name}</option>`;
        });
        brandSelect.innerHTML = html;
      } else if (brandSelect) {
        brandSelect.style.display = 'none';
      }
    }

    // ============================================================
    // 🎨 عرض العروض
    // ============================================================

    function renderOffers() {
      const container = document.getElementById('offersContainer');
      if (!container) return;

      const start = currentPage * pageSize;
      const end = start + pageSize;
      const pageOffers = filteredOffers.slice(start, end);

      if (pageOffers.length === 0 && currentPage === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <i class="fas fa-gift"></i>
            <h3 style="color:var(--gray-600);margin:12px 0 8px;">لا توجد عروض حالياً</h3>
            <p>ترقب عروضنا القادمة!</p>
            <a href="/gomla/store-retail.html" class="btn btn-primary" style="margin-top:16px;">
              <i class="fas fa-arrow-right"></i>
              تسوق الآن
            </a>
          </div>
        `;
        document.getElementById('loadMoreBtn').style.display = 'none';
        return;
      }

      let html = '';

      pageOffers.forEach(offer => {
        const originalPrice = offer.retailPrice || 0;
        const offerPrice = offer.retailOfferPrice || 0;
        const discount = originalPrice > 0 ? 
          Math.round(((originalPrice - offerPrice) / originalPrice) * 100) : 0;
        const savedAmount = originalPrice - offerPrice;
        
        const stock = offer.stockQuantity || 0;
        const isAvailable = stock > 0;

        // مؤقت العرض
        let timerHtml = '';
        let isUrgent = false;
        
        if (offer.retailOfferEndDate) {
          const endDate = offer.retailOfferEndDate.toDate ? 
            offer.retailOfferEndDate.toDate() : 
            new Date(offer.retailOfferEndDate);
          const now = new Date();
          const diff = endDate - now;
          
          if (diff > 0) {
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            isUrgent = diff < (24 * 60 * 60 * 1000); // أقل من يوم
            
            let timeText = '';
            if (days > 0) timeText = `${days} ي ${hours} س`;
            else if (hours > 0) timeText = `${hours} س ${minutes} د`;
            else timeText = `${minutes} د`;
            
            timerHtml = `
              <div class="offer-timer ${isUrgent ? 'urgent' : ''}" data-end="${endDate.getTime()}">
                <i class="fas fa-clock"></i>
                ${timeText}
              </div>
            `;
          } else {
            timerHtml = `
              <div class="offer-timer urgent">
                <i class="fas fa-times"></i>
                انتهى
              </div>
            `;
          }
        }

        html += `
          <div class="offer-card" onclick="goToProductDetails('${offer.id}')">
            <div class="discount-ribbon">
              <i class="fas fa-percent"></i>
              ${discount}% خصم
            </div>
            ${timerHtml}
            <img src="${offer.imageUrl || '/gomla/assets/images/no-image.png'}"
                 alt="${offer.name}"
                 class="product-image"
                 loading="lazy"
                 onerror="this.src='/gomla/assets/images/no-image.png'">
            <div class="product-body">
              <h4 class="product-name">${offer.name}</h4>
              ${offer.brandName ? `
                <p class="product-brand">
                  <i class="fas fa-tag"></i> ${offer.brandName}
                </p>
              ` : ''}
              
              <div class="price-section">
                <div class="price-row-main">
                  <span class="offer-price">
                    ${offerPrice.toFixed(2)} ج.م
                    <small>/ قطعة</small>
                  </span>
                  <span class="original-price">${originalPrice.toFixed(2)} ج.م</span>
                </div>
                <span class="saving-badge">
                  <i class="fas fa-wallet"></i>
                  وفر ${savedAmount.toFixed(2)} ج.م
                </span>
              </div>
              
              ${isAvailable ? `
                <button class="btn btn-primary btn-sm"
                        onclick="event.stopPropagation();handleAddToCart('${offer.id}')">
                  <i class="fas fa-cart-plus"></i> أضف للسلة
                </button>
              ` : `
                <div class="out-of-stock">
                  <i class="fas fa-times-circle"></i> غير متوفر
                </div>
              `}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      if (filteredOffers.length > (currentPage + 1) * pageSize) {
        document.getElementById('loadMoreBtn').style.display = 'inline-block';
      } else {
        document.getElementById('loadMoreBtn').style.display = 'none';
      }
    }

    // ============================================================
    // 🔄 تحديث المؤقتات كل دقيقة
    // ============================================================

    function startTimersUpdate() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        document.querySelectorAll('.offer-timer[data-end]').forEach(el => {
          const endTime = parseInt(el.dataset.end);
          const now = Date.now();
          const diff = endTime - now;
          
          if (diff <= 0) {
            el.innerHTML = '<i class="fas fa-times"></i> انتهى';
            el.classList.add('urgent');
            return;
          }
          
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          
          let timeText = '';
          if (days > 0) timeText = `${days} ي ${hours} س`;
          else if (hours > 0) timeText = `${hours} س ${minutes} د`;
          else timeText = `${minutes} د`;
          
          el.innerHTML = `<i class="fas fa-clock"></i> ${timeText}`;
          
          if (diff < (24 * 60 * 60 * 1000)) {
            el.classList.add('urgent');
          }
        });
      }, 60000); // كل دقيقة
    }

    // ============================================================
    // 🔍 التصفية
    // ============================================================

    function applyFilters() {
      const sortValue = document.getElementById('sortFilter').value;
      const categoryId = document.getElementById('categoryFilter')?.value || '';
      const brandId = document.getElementById('brandFilter')?.value || '';

      filteredOffers = [...allOffers];

      if (categoryId) {
        filteredOffers = filteredOffers.filter(p => p.categoryId === categoryId);
      }

      if (brandId) {
        filteredOffers = filteredOffers.filter(p => p.brandId === brandId);
      }

      // ترتيب
      switch (sortValue) {
        case 'discount-high':
          filteredOffers.sort((a, b) => {
            const discA = a.retailPrice > 0 ? ((a.retailPrice - a.retailOfferPrice) / a.retailPrice) * 100 : 0;
            const discB = b.retailPrice > 0 ? ((b.retailPrice - b.retailOfferPrice) / b.retailPrice) * 100 : 0;
            return discB - discA;
          });
          break;
        case 'discount-low':
          filteredOffers.sort((a, b) => {
            const discA = a.retailPrice > 0 ? ((a.retailPrice - a.retailOfferPrice) / a.retailPrice) * 100 : 0;
            const discB = b.retailPrice > 0 ? ((b.retailPrice - b.retailOfferPrice) / b.retailPrice) * 100 : 0;
            return discA - discB;
          });
          break;
        case 'price-low':
          filteredOffers.sort((a, b) => (a.retailOfferPrice || 0) - (b.retailOfferPrice || 0));
          break;
        case 'price-high':
          filteredOffers.sort((a, b) => (b.retailOfferPrice || 0) - (a.retailOfferPrice || 0));
          break;
        case 'ending-soon':
          filteredOffers.sort((a, b) => {
            const endA = a.retailOfferEndDate?.toMillis?.() || Infinity;
            const endB = b.retailOfferEndDate?.toMillis?.() || Infinity;
            return endA - endB;
          });
          break;
        default:
          filteredOffers.sort((a, b) => 
            (b.updatedAt?.toMillis() || 0) - (a.updatedAt?.toMillis() || 0)
          );
      }

      currentPage = 0;
      renderOffers();
    }

    // ============================================================
    // 🔄 تحميل المزيد
    // ============================================================

    async function loadMoreOffers() {
      currentPage++;
      const start = currentPage * pageSize;

      try {
        const snapshot = await db.collection(COLLECTIONS.PRODUCTS)
          .where('available', '==', true)
          .where('hasRetailOffer', '==', true)
          .orderBy('updatedAt', 'desc')
          .limit(start + pageSize)
          .get();

        const newOffers = [];
        snapshot.forEach(doc => newOffers.push({ id: doc.id, ...doc.data() }));

        const additional = newOffers.slice(start);
        allOffers = [...allOffers, ...additional];
        filteredOffers = [...allOffers];
        
        applyFilters();

      } catch (error) {
        console.error('Error loading more:', error);
        currentPage--;
      }
    }

    // ============================================================
    // 🎞️ السلايدر
    // ============================================================

    async function loadSlider() {
      const track = document.getElementById('sliderTrack');
      const dots = document.getElementById('sliderDots');
      if (!track) return;

      try {
        const snapshot = await db.collection(COLLECTIONS.SLIDER)
          .where('active', '==', true)
          .orderBy('order', 'asc')
          .get();

        if (snapshot.empty) {
          track.innerHTML = `
            <div class="slider-item">
              <div class="slide-placeholder">
                <i class="fas fa-image"></i>
                لا توجد صور
              </div>
            </div>
          `;
          return;
        }

        let slidesHtml = '';
        let dotsHtml = '';
        let index = 0;

        snapshot.forEach(doc => {
          const slide = doc.data();
          const imageUrl = slide.imageUrl || '';
          const title = slide.title || '';
          const link = slide.link || '';
          const captionHtml = title ? `<div class="slider-caption">${title}</div>` : '';
          const content = link ?
            `<a href="${link}"><img src="${imageUrl}" alt="${title}" onerror="this.src='/gomla/assets/images/no-image.png'">${captionHtml}</a>` :
            `<img src="${imageUrl}" alt="${title}" onerror="this.src='/gomla/assets/images/no-image.png'">${captionHtml}`;
          slidesHtml += `<div class="slider-item">${content}</div>`;
          dotsHtml += `<span class="dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></span>`;
          index++;
        });

        track.innerHTML = slidesHtml;
        if (dots) dots.innerHTML = dotsHtml;
        startSliderAuto();

      } catch (error) {
        console.error('Error loading slider:', error);
      }
    }

    function startSliderAuto() {
      slidesCount = document.querySelectorAll('.slider-item').length;
      if (slidesCount <= 1) return;
      if (slideInterval) clearInterval(slideInterval);
      slideInterval = setInterval(() => {
        slideIndex = (slideIndex + 1) % slidesCount;
        updateSlider();
      }, 5000);
    }

    function slideNext() {
      if (slidesCount <= 1) return;
      slideIndex = (slideIndex + 1) % slidesCount;
      updateSlider();
      startSliderAuto();
    }

    function slidePrev() {
      if (slidesCount <= 1) return;
      slideIndex = (slideIndex - 1 + slidesCount) % slidesCount;
      updateSlider();
      startSliderAuto();
    }

    function goToSlide(index) {
      slideIndex = index;
      updateSlider();
      startSliderAuto();
    }

    function updateSlider() {
      const track = document.getElementById('sliderTrack');
      const dots = document.querySelectorAll('.slider-dots .dot');
      if (!track) return;
      track.style.transform = `translateX(${slideIndex * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle('active', i === slideIndex));
    }

    // ============================================================
    // 🛒 إضافة للسلة
    // ============================================================

    async function handleAddToCart(productId) {
      try {
        await addToCart(productId, 1);
      } catch (error) {
        console.error('Error adding to cart:', error);
      }
    }

    function goToProductDetails(productId) {
      window.location.href = `/gomla/product-details.html?id=${productId}&type=retail`;
    }

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      loadPageData();
      console.log('✅ offers.html loaded');
    });

    // تصدير
    window.slideNext = slideNext;
    window.slidePrev = slidePrev;
    window.goToSlide = goToSlide;
    window.applyFilters = applyFilters;
    window.loadMoreOffers = loadMoreOffers;
    window.handleAddToCart = handleAddToCart;
    window.goToProductDetails = goToProductDetails;

  </script>

</body>

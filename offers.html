<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أولاد شعلان جملة - العروض</title>

  <!-- ===== SEO ===== -->
  <meta name="description" content="عروض خاصة - أولاد شعلان جملة">
  <meta name="theme-color" content="#1a2a4a">

  <!-- ===== Font Awesome ===== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- ===== Google Font ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- ===== الستايل الموحد ===== -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- ===== Favicon ===== -->
  <link rel="icon" href="assets/images/favicon.ico">

  <!-- ============================================================ -->
  <!-- 🎨 ستايل خاص بالصفحة                                          -->
  <!-- ============================================================ -->
  <style>
    .offers-header {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      color: var(--white);
      padding: 30px 0 24px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .offers-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }

    .offers-header::after {
      content: '';
      position: absolute;
      bottom: -40%;
      left: -10%;
      width: 250px;
      height: 250px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }

    .offers-header h1 {
      font-size: 2rem;
      font-weight: 900;
      position: relative;
      z-index: 1;
    }

    .offers-header h1 i {
      color: #ffd700;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .offers-header .subtitle {
      font-size: 1rem;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    .offers-header .offer-badge {
      display: inline-block;
      background: #ffd700;
      color: #c0392b;
      padding: 4px 20px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      margin-top: 8px;
      position: relative;
      z-index: 1;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--gray-500);
      margin-bottom: 16px;
    }

    .breadcrumb a {
      color: var(--gold);
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      background: var(--white);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
      align-items: center;
    }

    .filter-bar select,
    .filter-bar input {
      padding: 8px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--gray-50);
      min-width: 120px;
    }

    .filter-bar select:focus,
    .filter-bar input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
      background: var(--white);
    }

    .filter-bar .filter-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--gray-600);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-400);
    }

    .empty-state i {
      font-size: 3rem;
      display: block;
      margin-bottom: 12px;
    }

    /* ===== ستايل بطاقة العرض ===== */
    .offer-card {
      background: var(--white);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      cursor: pointer;
      border: 2px solid #e74c3c;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .offer-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #c0392b;
    }

    .offer-card .discount-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #e74c3c;
      color: var(--white);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      z-index: 2;
      box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
    }

    .offer-card .discount-badge i {
      margin-left: 4px;
    }

    .offer-card .product-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: var(--gray-100);
    }

    .offer-card .product-body {
      padding: 14px 16px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .offer-card .product-name {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 44px;
    }

    .offer-card .product-brand {
      font-size: 0.8rem;
      color: var(--gray-500);
      margin-bottom: 6px;
    }

    .offer-card .price-section {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 6px 0 10px;
    }

    .offer-card .offer-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: #e74c3c;
    }

    .offer-card .original-price {
      font-size: 0.85rem;
      color: var(--gray-400);
      text-decoration: line-through;
    }

    .offer-card .offer-price small {
      font-weight: 400;
      font-size: 0.75rem;
      color: var(--gray-500);
    }

    .offer-card .saved-amount {
      font-size: 0.75rem;
      color: #27ae60;
      font-weight: 600;
      background: #eafaf1;
      padding: 2px 10px;
      border-radius: 12px;
    }

    .offer-card .btn-sm {
      padding: 6px 14px;
      font-size: 0.85rem;
      width: 100%;
      margin-top: auto;
    }

    .offer-card .offer-timer {
      font-size: 0.75rem;
      color: var(--gray-500);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .offer-card .offer-timer i {
      color: #e74c3c;
    }

    .offer-card .out-of-stock {
      color: var(--danger);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 6px 0;
    }

    @media (max-width: 768px) {
      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-bar select,
      .filter-bar input {
        width: 100%;
        min-width: auto;
      }
      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }
      .offers-header h1 {
        font-size: 1.5rem;
      }
      .offer-card .product-image {
        height: 150px;
      }
    }

    @media (max-width: 480px) {
      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
      .offers-header {
        padding: 20px 0 16px;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================ -->
  <!-- 🧠 الهيدر (يتم تحميله من main.js)                            -->
  <!-- ============================================================ -->
  <div id="header-placeholder"></div>

  <!-- ============================================================ -->
  <!-- 📄 محتوى الصفحة                                              -->
  <!-- ============================================================ -->
  <main class="page-content">
    <div class="container">

      <!-- ===== مسار التنقل (Breadcrumb) ===== -->
      <div class="breadcrumb">
        <a href="/gomla/">الرئيسية</a>
        <span>›</span>
        <span id="breadcrumbType">العروض</span>
      </div>

      <!-- ===== رأس الصفحة ===== -->
      <div class="offers-header">
        <div class="container">
          <h1><i class="fas fa-fire"></i> عروض خاصة</h1>
          <div class="subtitle" id="offerSubtitle">أفضل العروض على منتجات الجملة</div>
          <div class="offer-badge"><i class="fas fa-percent"></i> خصومات تصل إلى 50%</div>
        </div>
      </div>

      <!-- ===== شريط التصفية ===== -->
      <div class="filter-bar" id="filterBar">
        <span class="filter-label"><i class="fas fa-sliders-h"></i> تصفية:</span>
        <select id="sortFilter" onchange="applyFilters()">
          <option value="discount-high">أعلى خصم</option>
          <option value="price-low">السعر: من الأقل للأعلى</option>
          <option value="price-high">السعر: من الأعلى للأقل</option>
          <option value="newest">الأحدث</option>
        </select>
        <select id="categoryFilter" onchange="applyFilters()">
          <option value="">كل التصنيفات</option>
        </select>
        <select id="brandFilter" onchange="applyFilters()">
          <option value="">كل البراندات</option>
        </select>
        <input type="text" id="searchFilter" placeholder="بحث في العروض..." oninput="applyFilters()">
      </div>

      <!-- ===== شبكة المنتجات ===== -->
      <div class="products-grid" id="productsContainer">
        <div class="loading-spinner" style="grid-column:1/-1;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
      </div>

      <!-- ===== تحميل المزيد ===== -->
      <div style="text-align:center;margin-top:20px;">
        <button class="btn btn-outline" id="loadMoreBtn" onclick="loadMoreProducts()" style="display:none;">
          <i class="fas fa-chevron-down"></i> تحميل المزيد
        </button>
      </div>

    </div>
  </main>

  <!-- ============================================================ -->
  <!-- 👣 الفوتر (يتم تحميله من main.js)                            -->
  <!-- ============================================================ -->
  <div id="footer-placeholder"></div>

  <!-- ============================================================ -->
  <!-- 🧠 السايدبار (يتم تحميله من main.js)                         -->
  <!-- ============================================================ -->
  <div id="sidebar-placeholder"></div>

  <!-- ============================================================ -->
  <!-- 🍞 Toast Container                                            -->
  <!-- ============================================================ -->
  <div id="toast-container"></div>

  <!-- ============================================================ -->
  <!-- 📚 Firebase & JavaScript                                      -->
  <!-- ============================================================ -->

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/main.js"></script>

  <!-- ============================================================ -->
  <!-- 📝 كود الصفحة الخاص                                           -->
  <!-- ============================================================ -->
  <script>
    // ============================================================
    // 📂 صفحة العروض - offers.html
    // ============================================================

    // ===== متغيرات عامة =====
    let allProducts = [];
    let filteredProducts = [];
    let currentPage = 0;
    const pageSize = 12;
    let storeType = 'wholesale';

    // ============================================================
    // 🚀 تحميل البيانات
    // ============================================================

    function loadPageData() {
      const urlParams = new URLSearchParams(window.location.search);
      storeType = urlParams.get('type') || 'wholesale';

      // تحديث النصوص حسب النوع
      const subtitle = document.getElementById('offerSubtitle');
      const breadcrumb = document.getElementById('breadcrumbType');
      
      if (storeType === 'wholesale') {
        subtitle.textContent = 'أفضل العروض على منتجات الجملة';
        breadcrumb.textContent = 'عروض الجملة';
        document.title = 'أولاد شعلان جملة - عروض الجملة';
      } else {
        subtitle.textContent = 'أفضل العروض على منتجات التجزئة';
        breadcrumb.textContent = 'عروض التجزئة';
        document.title = 'أولاد شعلان جملة - عروض التجزئة';
      }

      loadCategories();
      loadBrands();
      loadProducts();
    }

    // ===== تحميل التصنيفات للتصفية =====
    function loadCategories() {
      const select = document.getElementById('categoryFilter');
      if (!select) return;

      db.collection('categories')
        .orderBy('name')
        .get()
        .then(snapshot => {
          select.innerHTML = '<option value="">كل التصنيفات</option>';
          snapshot.forEach(doc => {
            const cat = doc.data();
            select.innerHTML += `<option value="${doc.id}">${cat.name}</option>`;
          });
        })
        .catch(error => console.error('Error loading categories:', error));
    }

    // ===== تحميل البراندات للتصفية =====
    function loadBrands() {
      const select = document.getElementById('brandFilter');
      if (!select) return;

      db.collection('brands')
        .orderBy('name')
        .get()
        .then(snapshot => {
          select.innerHTML = '<option value="">كل البراندات</option>';
          snapshot.forEach(doc => {
            const brand = doc.data();
            select.innerHTML += `<option value="${doc.id}">${brand.name}</option>`;
          });
        })
        .catch(error => console.error('Error loading brands:', error));
    }

    // ============================================================
    // 📦 تحميل وعرض المنتجات (العروض فقط)
    // ============================================================

    function loadProducts() {
      const container = document.getElementById('productsContainer');
      if (!container) return;

      container.innerHTML = '<div class="loading-spinner" style="grid-column:1/-1;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';

      // جلب المنتجات اللي فيها عرض
      db.collection('products')
        .where('available', '==', true)
        .where('hasOffer', '==', true)
        .orderBy('createdAt', 'desc')
        .limit(pageSize)
        .get()
        .then(snapshot => {
          allProducts = [];
          snapshot.forEach(doc => {
            allProducts.push({ id: doc.id, ...doc.data() });
          });
          filteredProducts = [...allProducts];
          renderProducts();
          
          if (allProducts.length >= pageSize) {
            document.getElementById('loadMoreBtn').style.display = 'inline-block';
          }
        })
        .catch(error => {
          console.error('Error loading offers:', error);
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-exclamation-triangle"></i>
              <p>حدث خطأ في تحميل العروض</p>
            </div>
          `;
        });
    }

    function renderProducts() {
      const container = document.getElementById('productsContainer');
      if (!container) return;

      const start = currentPage * pageSize;
      const end = start + pageSize;
      const pageProducts = filteredProducts.slice(start, end);

      if (pageProducts.length === 0 && currentPage === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-gift"></i>
            <p>لا توجد عروض حالياً</p>
            <p style="font-size:0.85rem;color:var(--gray-400);">ترقب عروضنا القادمة!</p>
          </div>
        `;
        document.getElementById('loadMoreBtn').style.display = 'none';
        return;
      }

      let html = '';
      const isWholesale = storeType === 'wholesale';

      pageProducts.forEach(product => {
        const originalPrice = isWholesale ? (product.wholesalePrice || product.price || 0) : (product.retailPrice || product.price || 0);
        const offerPrice = product.offerPrice || originalPrice * 0.8;
        const discountPercent = Math.round(((originalPrice - offerPrice) / originalPrice) * 100);
        const savedAmount = originalPrice - offerPrice;
        const unit = product.unit || (isWholesale ? 'كرتونة' : 'قطعة');
        const brandName = product.brandName || '';
        const categoryName = product.categoryName || '';
        const isAvailable = product.stockQuantity === undefined || product.stockQuantity > 0;

        // حساب الوقت المتبقي للعرض (لو موجود)
        let timerHtml = '';
        if (product.offerEndDate) {
          const endDate = product.offerEndDate.toDate ? product.offerEndDate.toDate() : new Date(product.offerEndDate);
          const now = new Date();
          const diff = endDate - now;
          if (diff > 0) {
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            timerHtml = `
              <div class="offer-timer">
                <i class="fas fa-clock"></i> متبقي: ${days > 0 ? days + ' يوم ' : ''}${hours} ساعة
              </div>
            `;
          }
        }

        html += `
          <div class="offer-card" onclick="openProductModal('${product.id}')">
            <div class="discount-badge"><i class="fas fa-percent"></i> ${discountPercent}%</div>
            <img src="${product.imageUrl || 'assets/images/no-image.png'}" alt="${product.name}" class="product-image" onerror="this.src='assets/images/no-image.png'">
            <div class="product-body">
              <h4 class="product-name">${product.name}</h4>
              ${brandName ? `<div class="product-brand"><i class="fas fa-tag"></i> ${brandName}</div>` : ''}
              <div class="price-section">
                <span class="offer-price">${offerPrice.toFixed(2)} ج.م <small>/ ${unit}</small></span>
                <span class="original-price">${originalPrice.toFixed(2)} ج.م</span>
                <span class="saved-amount"><i class="fas fa-wallet"></i> وفر ${savedAmount.toFixed(2)} ج.م</span>
              </div>
              ${timerHtml}
              ${isAvailable ? `
                <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();addToCart('${product.id}')">
                  <i class="fas fa-cart-plus"></i> أضف للسلة
                </button>
              ` : `
                <div class="out-of-stock"><i class="fas fa-times-circle"></i> غير متوفر</div>
              `}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      if (filteredProducts.length > (currentPage + 1) * pageSize) {
        document.getElementById('loadMoreBtn').style.display = 'inline-block';
      } else {
        document.getElementById('loadMoreBtn').style.display = 'none';
      }
    }

    function loadMoreProducts() {
      currentPage++;
      renderProducts();
    }

    // ============================================================
    // 🔍 التصفية والبحث
    // ============================================================

    function applyFilters() {
      const sortValue = document.getElementById('sortFilter').value;
      const categoryId = document.getElementById('categoryFilter').value;
      const brandId = document.getElementById('brandFilter').value;
      const searchTerm = document.getElementById('searchFilter').value.trim().toLowerCase();

      filteredProducts = [...allProducts];

      // فلتر التصنيف
      if (categoryId) {
        filteredProducts = filteredProducts.filter(p => p.categoryId === categoryId);
      }

      // فلتر البراند
      if (brandId) {
        filteredProducts = filteredProducts.filter(p => p.brandId === brandId);
      }

      // فلتر البحث
      if (searchTerm) {
        filteredProducts = filteredProducts.filter(p =>
          p.name.toLowerCase().includes(searchTerm) ||
          (p.categoryName && p.categoryName.toLowerCase().includes(searchTerm)) ||
          (p.brandName && p.brandName.toLowerCase().includes(searchTerm))
        );
      }

      // ترتيب
      const isWholesale = storeType === 'wholesale';
      switch (sortValue) {
        case 'discount-high':
          filteredProducts.sort((a, b) => {
            const priceA = isWholesale ? (a.wholesalePrice || a.price || 0) : (a.retailPrice || a.price || 0);
            const priceB = isWholesale ? (b.wholesalePrice || b.price || 0) : (b.retailPrice || b.price || 0);
            const discA = ((priceA - (a.offerPrice || priceA * 0.8)) / priceA) * 100;
            const discB = ((priceB - (b.offerPrice || priceB * 0.8)) / priceB) * 100;
            return discB - discA;
          });
          break;
        case 'price-low':
          filteredProducts.sort((a, b) => (a.offerPrice || a.price || 0) - (b.offerPrice || b.price || 0));
          break;
        case 'price-high':
          filteredProducts.sort((a, b) => (b.offerPrice || b.price || 0) - (a.offerPrice || a.price || 0));
          break;
        default: // newest
          filteredProducts.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
      }

      currentPage = 0;
      renderProducts();
    }

    // ============================================================
    // 🛒 إضافة للسلة
    // ============================================================

    function addToCart(productId) {
      const user = getCurrentUser();
      if (!user) {
        showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
      }

      db.collection('products').doc(productId).get()
        .then(doc => {
          if (!doc.exists) {
            showToast('❌ المنتج غير موجود', 'error');
            return;
          }

          const product = doc.data();
          const userId = user.data.id || user.data.uid;
          const isWholesale = storeType === 'wholesale';
          const price = product.offerPrice || (isWholesale ? (product.wholesalePrice || product.price || 0) : (product.retailPrice || product.price || 0));

          return db.collection('cart')
            .where('userId', '==', userId)
            .where('productId', '==', productId)
            .get()
            .then(snapshot => {
              const existingQty = snapshot.empty ? 0 : (snapshot.docs[0].data().quantity || 0);
              
              if (product.maxOrder && existingQty >= product.maxOrder) {
                showToast(`⚠️ الحد الأقصى للطلب هو ${product.maxOrder}`, 'warning');
                return;
              }

              if (snapshot.empty) {
                return db.collection('cart').add({
                  userId: userId,
                  productId: productId,
                  quantity: 1,
                  unit: product.unit || (isWholesale ? 'كرتونة' : 'قطعة'),
                  price: price,
                  productName: product.name,
                  imageUrl: product.imageUrl || '',
                  isOffer: true,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              } else {
                const doc = snapshot.docs[0];
                return db.collection('cart').doc(doc.id).update({
                  quantity: (doc.data().quantity || 0) + 1
                });
              }
            });
        })
        .then(() => {
          showToast('✅ تم إضافة المنتج للسلة', 'success');
          updateCartBadge();
        })
        .catch(error => {
          console.error('Error adding to cart:', error);
          showToast('❌ حدث خطأ', 'error');
        });
    }

    // ============================================================
    // 📦 فتح صفحة المنتج
    // ============================================================

    function openProductModal(productId) {
      window.location.href = `/gomla/product-details.html?id=${productId}&type=${storeType}`;
    }

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      loadPageData();
    });

    // تصدير الدوال
    window.applyFilters = applyFilters;
    window.loadMoreProducts = loadMoreProducts;
    window.addToCart = addToCart;
    window.openProductModal = openProductModal;
  </script>

</body>

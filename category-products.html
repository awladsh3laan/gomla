<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منتجات القسم - أولاد شعلان</title>

  <meta name="description" content="منتجات القسم - أولاد شعلان">
  <meta name="theme-color" content="#1a2a4a">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       🎨 ستايل صفحة منتجات القسم
       ============================================================ */

    /* ===== رأس القسم ===== */
    .category-hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      margin-bottom: 24px;
      color: var(--white);
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .category-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }

    .category-hero::after {
      content: '';
      position: absolute;
      bottom: -50%;
      left: -10%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 10s ease-in-out infinite reverse;
    }

    .category-hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      max-width: 700px;
      margin: 0 auto;
    }

    .category-hero-image {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--gold);
      background: var(--white);
      padding: 6px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      animation: logo-pulse-cat 3s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes logo-pulse-cat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .category-hero-text {
      flex: 1;
      min-width: 220px;
      text-align: right;
    }

    .category-hero-text h1 {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 8px;
      color: var(--white);
    }

    .category-hero-text .count-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(201, 168, 76, 0.2);
      color: var(--gold-light);
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid rgba(201, 168, 76, 0.4);
    }

    /* ===== البراندات في القسم ===== */
    .brands-in-category {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
    }

    .brands-in-category .section-header {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--gray-100);
    }

    .brands-in-category .brands-chips {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px;
      scrollbar-width: thin;
    }

    .brands-in-category .brands-chips::-webkit-scrollbar {
      height: 5px;
    }

    .brands-in-category .brands-chips::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    /* كارت براند مصغر */
    .brand-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: var(--gray-50);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition);
      border: 2px solid transparent;
      text-decoration: none;
      color: var(--gray-800);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .brand-chip:hover,
    .brand-chip.active {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      border-color: var(--gold);
      transform: translateY(-2px);
      color: var(--navy);
    }

    .brand-chip img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--white);
      border: 2px solid var(--gray-200);
    }

    .brand-chip .brand-chip-name {
      font-size: 0.88rem;
      font-weight: 700;
    }

    .brand-chip .brand-chip-count {
      font-size: 0.72rem;
      background: var(--navy);
      color: var(--gold);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: 700;
    }

    /* ===== الفلاتر ===== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--white);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
      align-items: center;
      border: 1px solid var(--gray-200);
    }

    .filter-bar select {
      padding: 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--gray-50);
      min-width: 140px;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-bar select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
      background: var(--white);
    }

    .filter-bar .filter-icon {
      color: var(--gold);
      font-size: 1rem;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) and (pointer: coarse) {
      .category-hero {
        padding: 24px 16px;
      }

      .category-hero-content {
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }

      .category-hero-image {
        width: 80px;
        height: 80px;
        border-width: 3px;
      }

      .category-hero-text {
        text-align: center;
        min-width: 100%;
      }

      .category-hero-text h1 {
        font-size: 1.4rem;
      }

      .brands-in-category {
        padding: 16px;
      }

      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-bar select {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- مكونات الموبايل -->
  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>

  <!-- الهيدر -->
  <div id="header-placeholder"></div>

  <!-- المحتوى -->
  <main class="page-content">
    <div class="container">

      <!-- مسار التنقل -->
      <div class="breadcrumb" id="breadcrumb">
        <a href="/gomla/">الرئيسية</a>
        <span>›</span>
        <a href="/gomla/categories.html" id="breadcrumbCategoriesLink">الأقسام</a>
        <span>›</span>
        <span id="breadcrumbCategoryName">جاري التحميل...</span>
      </div>

      <!-- رأس القسم -->
      <section class="category-hero" id="categoryHero">
        <div class="category-hero-content">
          <img src="/gomla/assets/images/no-image.png" 
               alt="صورة القسم" 
               class="category-hero-image" 
               id="categoryImage"
               onerror="this.src='/gomla/assets/images/no-image.png'">
          <div class="category-hero-text">
            <h1 id="categoryName">جاري التحميل...</h1>
            <div class="count-badge" id="categoryCount">
              <i class="fas fa-spinner fa-spin"></i>
              جاري التحميل...
            </div>
          </div>
        </div>
      </section>

      <!-- سلايدر مصغر -->
      <section class="slider-section" id="slider-section" style="margin-bottom:24px;">
        <div class="slider-container" id="sliderContainer">
          <div class="slider-track" id="sliderTrack">
            <div class="slider-item">
              <div class="slide-placeholder">
                <i class="fas fa-spinner fa-spin"></i>
                جاري التحميل...
              </div>
            </div>
          </div>
          <button class="slider-btn prev" onclick="slidePrev()" aria-label="السابق">
            <i class="fas fa-chevron-right"></i>
          </button>
          <button class="slider-btn next" onclick="slideNext()" aria-label="التالي">
            <i class="fas fa-chevron-left"></i>
          </button>
          <div class="slider-dots" id="sliderDots"></div>
        </div>
      </section>

      <!-- البراندات في القسم -->
      <section class="brands-in-category" id="brandsSection" style="display:none;">
        <div class="section-header">
          <h2 class="section-title">
            <i class="fas fa-copyright"></i>
            البراندات في هذا القسم
          </h2>
        </div>
        <div class="brands-chips" id="brandsChips">
          <!-- يتم تحميلها ديناميكياً -->
        </div>
      </section>

      <!-- الفلاتر -->
      <div class="filter-bar">
        <i class="fas fa-sliders-h filter-icon"></i>
        <select id="sortFilter" onchange="applyFilters()">
          <option value="newest">الأحدث</option>
          <option value="price-low">السعر: الأقل للأعلى</option>
          <option value="price-high">السعر: الأعلى للأقل</option>
          <option value="popular">الأكثر مبيعاً</option>
        </select>
        <select id="availabilityFilter" onchange="applyFilters()">
          <option value="">كل المنتجات</option>
          <option value="available">المتوفر فقط</option>
        </select>
      </div>

      <!-- شبكة المنتجات -->
      <div class="products-grid" id="productsContainer">
        <div class="loading-spinner">
          <i class="fas fa-spinner fa-spin"></i>
          جاري التحميل...
        </div>
      </div>

      <!-- تحميل المزيد -->
      <div style="text-align:center;margin-top:20px;">
        <button class="btn btn-outline" id="loadMoreBtn" onclick="loadMoreProducts()" style="display:none;">
          <i class="fas fa-chevron-down"></i>
          تحميل المزيد
        </button>
      </div>

    </div>
  </main>

  <!-- التبويبات السفلى -->
  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>

  <!-- الفوتر -->
  <div id="footer-placeholder"></div>

  <!-- السايدبار -->
  <div id="sidebar-placeholder"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- نافذة البحث -->
  <div class="search-modal-overlay" id="searchModalOverlay" onclick="closeSearchModal(event)">
    <div class="search-modal" onclick="event.stopPropagation()">
      <div class="search-modal-header">
        <i class="fas fa-search search-icon"></i>
        <input type="text" 
               id="searchModalInput" 
               placeholder="ابحث عن منتج..."
               autocomplete="off"
               oninput="handleModalSearch(this.value)"
               onkeydown="handleSearchKeydown(event)">
        <button class="search-modal-close" onclick="closeSearchModal()" aria-label="إغلاق">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="search-modal-body" id="searchModalBody">
        <div id="searchInitialContent">
          <div class="search-suggestions-header">
            <i class="fas fa-fire"></i>
            اقتراحات سريعة
          </div>
          <div class="search-suggestions-chips">
            <a href="#" class="search-chip" onclick="quickSearch('منظف')">
              <i class="fas fa-spray-can"></i>
              منظفات
            </a>
            <a href="#" class="search-chip" onclick="quickSearch('ورق')">
              <i class="fas fa-toilet-paper"></i>
              ورقيات
            </a>
            <a href="#" class="search-chip" onclick="quickSearch('صابون')">
              <i class="fas fa-soap"></i>
              صابون
            </a>
          </div>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="search-keyboard-hint">
        <span><kbd>ESC</kbd> للإغلاق</span>
        <span><kbd>Enter</kbd> للبحث</span>
      </div>
    </div>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 category-products.html - منتجات القسم
    // ============================================================

    // ===== المتغيرات =====
    let categoryId = null;
    let categoryData = null;
    let storeType = 'retail';
    let allProducts = [];
    let filteredProducts = [];
    let currentPage = 0;
    const pageSize = 12;
    let selectedBrandId = '';
    let slidesCount = 0;
    let slideIndex = 0;
    let slideInterval = null;

    // ============================================================
    // 🚀 تحميل الصفحة
    // ============================================================

    async function loadPageData() {
      const urlParams = new URLSearchParams(window.location.search);
      categoryId = urlParams.get('id');
      storeType = urlParams.get('type') || 'retail';

      if (!categoryId) {
        showError('لم يتم تحديد قسم');
        return;
      }

      // تحديث رابط "الأقسام"
      document.getElementById('breadcrumbCategoriesLink').href = 
        `/gomla/categories.html?type=${storeType}`;

      // تحديد نوع المتجر حسب الصلاحية
      const user = getCurrentUser();
      if (user && user.data) {
        const role = user.data.role;
        if (role === ROLES.WHOLESALE || role === ROLES.ADMIN || role === ROLES.SUPER) {
          storeType = 'wholesale';
        }
      }

      await loadCategoryInfo();
      await loadProducts();
      await loadCategoryBrands();
      loadSlider();

      document.title = `${categoryData?.name || 'القسم'} - أولاد شعلان`;
    }

    // ============================================================
    // 📂 معلومات القسم
    // ============================================================

    async function loadCategoryInfo() {
      try {
        const doc = await db.collection(COLLECTIONS.CATEGORIES).doc(categoryId).get();
        
        if (!doc.exists) {
          showError('القسم غير موجود');
          return;
        }

        categoryData = { id: doc.id, ...doc.data() };

        document.getElementById('categoryName').textContent = categoryData.name || 'قسم';
        document.getElementById('breadcrumbCategoryName').textContent = categoryData.name || 'قسم';
        
        if (categoryData.imageUrl) {
          document.getElementById('categoryImage').src = categoryData.imageUrl;
        }

      } catch (error) {
        console.error('Error loading category:', error);
      }
    }

    // ============================================================
    // 📦 تحميل المنتجات
    // ============================================================

    async function loadProducts() {
      const container = document.getElementById('productsContainer');
      if (!container) return;

      try {
        const snapshot = await db.collection(COLLECTIONS.PRODUCTS)
          .where('available', '==', true)
          .where('categoryId', '==', categoryId)
          .orderBy('createdAt', 'desc')
          .limit(pageSize)
          .get();

        allProducts = [];
        snapshot.forEach(doc => {
          allProducts.push({ id: doc.id, ...doc.data() });
        });

        filteredProducts = [...allProducts];

        // تحديث العداد
        document.getElementById('categoryCount').innerHTML = `
          <i class="fas fa-box"></i>
          ${allProducts.length} منتج
        `;

        renderProducts();

        if (allProducts.length >= pageSize) {
          document.getElementById('loadMoreBtn').style.display = 'inline-block';
        }

      } catch (error) {
        console.error('Error loading products:', error);
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>حدث خطأ في تحميل المنتجات</p>
          </div>
        `;
      }
    }

    // ============================================================
    // 🎨 عرض المنتجات
    // ============================================================

    function renderProducts() {
      const container = document.getElementById('productsContainer');
      if (!container) return;

      const start = currentPage * pageSize;
      const end = start + pageSize;
      const pageProducts = filteredProducts.slice(start, end);

      if (pageProducts.length === 0 && currentPage === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-box-open"></i>
            <p>لا توجد منتجات في هذا القسم</p>
            <a href="/gomla/categories.html?type=${storeType}" class="btn btn-primary">
              <i class="fas fa-arrow-right"></i>
              العودة للأقسام
            </a>
          </div>
        `;
        document.getElementById('loadMoreBtn').style.display = 'none';
        return;
      }

      const isWholesale = storeType === 'wholesale';

      let html = '';

      pageProducts.forEach(product => {
        // 🔒 السعر حسب نوع المستخدم
        const price = isWholesale ? 
          (product.wholesalePrice || 0) : 
          (product.retailPrice || 0);
        const unit = isWholesale ? 
          (product.unit || 'كرتونة') : 
          'قطعة';
        
        const stock = product.stockQuantity || 0;
        const isAvailable = stock > 0;
        
        // خصم/عرض
        const hasOffer = !isWholesale && product.hasRetailOffer === true && product.retailOfferPrice > 0;
        const offerPrice = product.retailOfferPrice || 0;
        
        const hasDiscount = isWholesale && product.hasWholesaleDiscount === true && product.wholesaleDiscountPercent > 0;
        const discountPercent = product.wholesaleDiscountPercent || 0;
        const finalPrice = hasDiscount ? price * (1 - discountPercent / 100) : price;
        
        // نسبة الخصم القطاعي
        let discountBadge = '';
        if (hasOffer && price > 0) {
          const disc = Math.round(((price - offerPrice) / price) * 100);
          discountBadge = `<div class="offer-badge"><i class="fas fa-percent"></i> ${disc}%</div>`;
        } else if (hasDiscount) {
          discountBadge = `<div class="offer-badge" style="background:linear-gradient(135deg, var(--gold-dark), var(--gold));"><i class="fas fa-tags"></i> ${discountPercent}%</div>`;
        }

        html += `
          <div class="product-card" onclick="goToProductDetails('${product.id}')">
            ${discountBadge}
            <img src="${product.imageUrl || '/gomla/assets/images/no-image.png'}"
                 alt="${product.name}"
                 class="product-image"
                 loading="lazy"
                 onerror="this.src='/gomla/assets/images/no-image.png'">
            <div class="product-body">
              <h4 class="product-name">${product.name}</h4>
              ${product.brandName ? `
                <p class="product-brand">
                  <i class="fas fa-tag"></i> ${product.brandName}
                </p>
              ` : ''}
              
              <div class="product-price">
                ${hasOffer ? `
                  <span class="price-after">${offerPrice.toFixed(2)} ج.م</span>
                  <span class="price-before">${price.toFixed(2)} ج.م</span>
                ` : hasDiscount ? `
                  <span class="price-after">${finalPrice.toFixed(2)} ج.م</span>
                  <span class="price-before">${price.toFixed(2)} ج.م</span>
                ` : `
                  ${price.toFixed(2)} ج.م
                `}
                <small>/ ${unit}</small>
              </div>
              
              ${isAvailable ? `
                <button class="btn btn-primary btn-sm"
                        onclick="event.stopPropagation();handleAddToCart('${product.id}')">
                  <i class="fas fa-cart-plus"></i> أضف للسلة
                </button>
              ` : `
                <div class="out-of-stock">
                  <i class="fas fa-times-circle"></i> غير متوفر
                </div>
              `}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      // زر تحميل المزيد
      if (filteredProducts.length > (currentPage + 1) * pageSize) {
        document.getElementById('loadMoreBtn').style.display = 'inline-block';
      } else {
        document.getElementById('loadMoreBtn').style.display = 'none';
      }
    }

    // ============================================================
    // 🏷️ البراندات في القسم
    // ============================================================

    async function loadCategoryBrands() {
      const section = document.getElementById('brandsSection');
      const container = document.getElementById('brandsChips');
      if (!section || !container) return;

      try {
        // جلب كل المنتجات في القسم (بدون limit)
        const snapshot = await db.collection(COLLECTIONS.PRODUCTS)
          .where('available', '==', true)
          .where('categoryId', '==', categoryId)
          .get();

        // تجميع البراندات وعدّها
        const brandCounts = {};
        
        snapshot.forEach(doc => {
          const p = doc.data();
          if (p.brandId && p.brandName) {
            if (!brandCounts[p.brandId]) {
              brandCounts[p.brandId] = {
                id: p.brandId,
                name: p.brandName,
                imageUrl: p.brandImageUrl || '',
                count: 0
              };
            }
            brandCounts[p.brandId].count++;
          }
        });

        const brands = Object.values(brandCounts);

        if (brands.length === 0) {
          section.style.display = 'none';
          return;
        }

        // جلب صور البراندات من Firestore
        const brandIds = brands.map(b => b.id);
        const brandsSnapshot = await db.collection(COLLECTIONS.BRANDS).get();
        const brandData = {};
        brandsSnapshot.forEach(doc => {
          brandData[doc.id] = doc.data();
        });

        // بناء HTML
        let html = `
          <a href="#" class="brand-chip active" onclick="filterByBrand(event, '')">
            <i class="fas fa-list" style="color:var(--gold);font-size:1rem;"></i>
            <span class="brand-chip-name">الكل</span>
            <span class="brand-chip-count">${snapshot.size}</span>
          </a>
        `;

        brands.forEach(brand => {
          const brandInfo = brandData[brand.id] || {};
          const imageUrl = brandInfo.imageUrl || brand.imageUrl || '/gomla/assets/images/no-image.png';
          
          html += `
            <a href="#" class="brand-chip" onclick="filterByBrand(event, '${brand.id}')">
              <img src="${imageUrl}" 
                   alt="${brand.name}"
                   onerror="this.src='/gomla/assets/images/no-image.png'">
              <span class="brand-chip-name">${brand.name}</span>
              <span class="brand-chip-count">${brand.count}</span>
            </a>
          `;
        });

        container.innerHTML = html;
        section.style.display = 'block';

      } catch (error) {
        console.error('Error loading brands:', error);
      }
    }

    // ============================================================
    // 🎯 فلترة بالبراند
    // ============================================================

    function filterByBrand(event, brandId) {
      event.preventDefault();
      selectedBrandId = brandId;

      // تحديث الـ active
      document.querySelectorAll('.brand-chip').forEach(chip => {
        chip.classList.remove('active');
      });
      event.currentTarget.classList.add('active');

      applyFilters();
    }

    // ============================================================
    // 🔍 التصفية
    // ============================================================

    function applyFilters() {
      const sortValue = document.getElementById('sortFilter').value;
      const availability = document.getElementById('availabilityFilter').value;

      filteredProducts = [...allProducts];

      // فلتر البراند
      if (selectedBrandId) {
        filteredProducts = filteredProducts.filter(p => p.brandId === selectedBrandId);
      }

      // فلتر التوفّر
      if (availability === 'available') {
        filteredProducts = filteredProducts.filter(p => (p.stockQuantity || 0) > 0);
      }

      // ترتيب
      const isWholesale = storeType === 'wholesale';
      switch (sortValue) {
        case 'price-low':
          filteredProducts.sort((a, b) => {
            const priceA = isWholesale ? (a.wholesalePrice || 0) : (a.retailPrice || 0);
            const priceB = isWholesale ? (b.wholesalePrice || 0) : (b.retailPrice || 0);
            return priceA - priceB;
          });
          break;
        case 'price-high':
          filteredProducts.sort((a, b) => {
            const priceA = isWholesale ? (a.wholesalePrice || 0) : (a.retailPrice || 0);
            const priceB = isWholesale ? (b.wholesalePrice || 0) : (b.retailPrice || 0);
            return priceB - priceA;
          });
          break;
        case 'popular':
          filteredProducts.sort((a, b) => (b.salesCount || 0) - (a.salesCount || 0));
          break;
        default:
          filteredProducts.sort((a, b) => 
            (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0)
          );
      }

      currentPage = 0;
      renderProducts();

      document.getElementById('categoryCount').innerHTML = `
        <i class="fas fa-box"></i>
        ${filteredProducts.length} منتج
      `;
    }

    // ============================================================
    // 🔄 تحميل المزيد
    // ============================================================

    async function loadMoreProducts() {
      currentPage++;
      const start = currentPage * pageSize;

      try {
        const snapshot = await db.collection(COLLECTIONS.PRODUCTS)
          .where('available', '==', true)
          .where('categoryId', '==', categoryId)
          .orderBy('createdAt', 'desc')
          .limit(start + pageSize)
          .get();

        const newProducts = [];
        snapshot.forEach(doc => newProducts.push({ id: doc.id, ...doc.data() }));

        const additional = newProducts.slice(start);
        allProducts = [...allProducts, ...additional];
        filteredProducts = [...allProducts, ...additional];
        
        applyFilters();

      } catch (error) {
        console.error('Error loading more:', error);
        currentPage--;
      }
    }

    // ============================================================
    // 🎞️ السلايدر
    // ============================================================

    async function loadSlider() {
      const track = document.getElementById('sliderTrack');
      const dots = document.getElementById('sliderDots');
      if (!track) return;

      try {
        const snapshot = await db.collection(COLLECTIONS.SLIDER)
          .where('active', '==', true)
          .orderBy('order', 'asc')
          .get();

        if (snapshot.empty) {
          track.innerHTML = `
            <div class="slider-item">
              <div class="slide-placeholder">
                <i class="fas fa-image"></i>
                لا توجد صور
              </div>
            </div>
          `;
          return;
        }

        let slidesHtml = '';
        let dotsHtml = '';
        let index = 0;

        snapshot.forEach(doc => {
          const slide = doc.data();
          const imageUrl = slide.imageUrl || '';
          const title = slide.title || '';
          const link = slide.link || '';
          const captionHtml = title ? `<div class="slider-caption">${title}</div>` : '';
          const content = link ?
            `<a href="${link}"><img src="${imageUrl}" alt="${title}" onerror="this.src='/gomla/assets/images/no-image.png'">${captionHtml}</a>` :
            `<img src="${imageUrl}" alt="${title}" onerror="this.src='/gomla/assets/images/no-image.png'">${captionHtml}`;
          slidesHtml += `<div class="slider-item">${content}</div>`;
          dotsHtml += `<span class="dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></span>`;
          index++;
        });

        track.innerHTML = slidesHtml;
        if (dots) dots.innerHTML = dotsHtml;
        startSliderAuto();

      } catch (error) {
        console.error('Error loading slider:', error);
      }
    }

    function startSliderAuto() {
      slidesCount = document.querySelectorAll('.slider-item').length;
      if (slidesCount <= 1) return;
      if (slideInterval) clearInterval(slideInterval);
      slideInterval = setInterval(() => {
        slideIndex = (slideIndex + 1) % slidesCount;
        updateSlider();
      }, 5000);
    }

    function slideNext() {
      if (slidesCount <= 1) return;
      slideIndex = (slideIndex + 1) % slidesCount;
      updateSlider();
      startSliderAuto();
    }

    function slidePrev() {
      if (slidesCount <= 1) return;
      slideIndex = (slideIndex - 1 + slidesCount) % slidesCount;
      updateSlider();
      startSliderAuto();
    }

    function goToSlide(index) {
      slideIndex = index;
      updateSlider();
      startSliderAuto();
    }

    function updateSlider() {
      const track = document.getElementById('sliderTrack');
      const dots = document.querySelectorAll('.slider-dots .dot');
      if (!track) return;
      track.style.transform = `translateX(${slideIndex * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle('active', i === slideIndex));
    }

    // ============================================================
    // 🛒 إضافة للسلة
    // ============================================================

    async function handleAddToCart(productId) {
      try {
        await addToCart(productId, 1);
      } catch (error) {
        console.error('Error adding to cart:', error);
      }
    }

    function goToProductDetails(productId) {
      window.location.href = `/gomla/product-details.html?id=${productId}&type=${storeType}`;
    }

    // ============================================================
    // 🛠️ رسالة الخطأ
    // ============================================================

    function showError(message) {
      document.getElementById('productsContainer').innerHTML = `
        <div class="empty-state">
          <i class="fas fa-exclamation-triangle"></i>
          <p>${message}</p>
          <a href="/gomla/categories.html" class="btn btn-primary">
            <i class="fas fa-arrow-right"></i>
            العودة للأقسام
          </a>
        </div>
      `;
    }

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      loadPageData();
      console.log('✅ category-products.html loaded');
    });

    // تصدير
    window.slideNext = slideNext;
    window.slidePrev = slidePrev;
    window.goToSlide = goToSlide;
    window.applyFilters = applyFilters;
    window.filterByBrand = filterByBrand;
    window.loadMoreProducts = loadMoreProducts;
    window.handleAddToCart = handleAddToCart;
    window.goToProductDetails = goToProductDetails;

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منتجات القسم - أولاد شعلان</title>

  <meta name="description" content="منتجات القسم - أولاد شعلان">
  <meta name="theme-color" content="#1a2a4a">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       🎨 ستايل صفحة منتجات القسم
       ============================================================ */

    /* ===== الشريط المضغوط (Sticky) ===== */
    .category-compact-bar {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--white);
      box-shadow: var(--shadow-md);
      border-bottom: 3px solid var(--gold);
      position: relative;
      overflow: hidden;
      
      /* Sticky */
      position: sticky;
      top: 0;
      z-index: 100;
      transition: box-shadow 0.3s ease;
    }

    /* حالة Sticky (أثناء السكرول) */
    .category-compact-bar.sticky-active {
      box-shadow: 0 8px 30px rgba(15, 26, 46, 0.3);
      border-radius: 0;
    }

    .category-compact-bar::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* صورة القسم */
    .category-compact-bar .compact-image {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--gold);
      background: var(--white);
      padding: 2px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      box-shadow: 0 4px 12px rgba(201, 168, 76, 0.35);
      transition: transform 0.3s ease;
    }

    .category-compact-bar:hover .compact-image {
      transform: scale(1.08);
    }

    /* معلومات القسم */
    .category-compact-bar .compact-info {
      flex: 1;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .category-compact-bar .compact-info h1 {
      font-size: 1.15rem;
      font-weight: 900;
      margin: 0 0 2px;
      line-height: 1.3;
      color: var(--white);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .category-compact-bar .compact-info p {
      font-size: 0.75rem;
      margin: 0;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-compact-bar .compact-info p i {
      color: var(--gold);
    }

    /* عدد المنتجات */
    .category-compact-bar .compact-count {
      background: var(--gold);
      color: var(--navy);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      box-shadow: 0 4px 12px rgba(201, 168, 76, 0.4);
    }

    .category-compact-bar .compact-count i {
      font-size: 0.75rem;
    }

    /* ============================================================
       🏷️ شرائح البراندات
       ============================================================ */
    .brands-chips-bar {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      display: none;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
    }

    .brands-chips-bar.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .brands-chips-bar .brands-chips-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--gray-600);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .brands-chips-bar .brands-chips-title i {
      color: var(--gold);
      font-size: 0.85rem;
    }

    /* حاوية الشرائح */
    .brands-chips-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .brands-chips-scroll::-webkit-scrollbar {
      height: 4px;
    }

    .brands-chips-scroll::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    /* شريحة براند */
    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: var(--gray-50);
      border: 2px solid transparent;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: var(--gray-700);
      flex-shrink: 0;
      white-space: nowrap;
      font-family: inherit;
      font-size: 0.85rem;
    }

    .brand-chip:hover {
      background: var(--gray-100);
      border-color: var(--gold-light);
      transform: translateY(-2px);
    }

    .brand-chip.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border-color: var(--gold-dark);
      color: var(--navy);
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(201, 168, 76, 0.35);
    }

    .brand-chip img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--white);
      border: 2px solid var(--gray-200);
      flex-shrink: 0;
    }

    .brand-chip.active img {
      border-color: var(--navy);
    }

    .brand-chip .brand-chip-name {
      font-weight: 700;
    }

    .brand-chip .brand-chip-count {
      background: var(--navy);
      color: var(--gold);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 0.68rem;
      font-weight: 800;
      min-width: 22px;
      text-align: center;
    }

    .brand-chip.active .brand-chip-count {
      background: var(--navy);
      color: var(--gold-light);
    }

    /* شريحة "الكل" */
    .brand-chip.all-chip .brand-chip-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .brand-chip.active.all-chip .brand-chip-icon {
      background: var(--navy);
      color: var(--gold-light);
    }

    /* ============================================================
       🔍 الفلاتر
       ============================================================ */
    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--white);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
      align-items: center;
      border: 1px solid var(--gray-200);
    }

    .category-filters .filter-icon {
      color: var(--gold);
      font-size: 1rem;
    }

    .category-filters select {
      padding: 9px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.88rem;
      background: var(--gray-50);
      min-width: 130px;
      cursor: pointer;
      transition: var(--transition);
      color: var(--gray-700);
      font-weight: 600;
    }

    .category-filters select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
      background: var(--white);
    }

    /* ============================================================
       🎨 المنتجات
       ============================================================ */
    .products-grid {
      margin-bottom: 24px;
    }

    /* زر تحميل المزيد */
    .load-more-wrapper {
      text-align: center;
      padding: 16px 0;
    }

    /* ============================================================
       🔄 تحميل الشريط أثناء السكرول
       ============================================================ */
    .category-compact-bar.is-scrolled {
      box-shadow: 0 4px 20px rgba(15, 26, 46, 0.2);
    }

    /* ============================================================
       📱 Responsive
       ============================================================ */
    @media (max-width: 768px) and (pointer: coarse) {
      /* الشريط المضغوط */
      .category-compact-bar {
        padding: 10px 12px;
        gap: 10px;
        margin-bottom: 12px;
        top: var(--mobile-top-bar-height, 0);
      }

      .category-compact-bar .compact-image {
        width: 44px;
        height: 44px;
        border-width: 2px;
      }

      .category-compact-bar .compact-info h1 {
        font-size: 1rem;
      }

      .category-compact-bar .compact-info p {
        font-size: 0.7rem;
      }

      .category-compact-bar .compact-count {
        padding: 5px 10px;
        font-size: 0.72rem;
      }

      /* شرائح البراندات */
      .brands-chips-bar {
        padding: 10px 12px;
        margin-bottom: 12px;
      }

      .brand-chip {
        padding: 6px 10px;
        font-size: 0.78rem;
        gap: 6px;
      }

      .brand-chip img,
      .brand-chip.all-chip .brand-chip-icon {
        width: 24px;
        height: 24px;
      }

      .brand-chip .brand-chip-count {
        padding: 2px 6px;
        font-size: 0.62rem;
      }

      /* الفلاتر */
      .category-filters {
        flex-direction: column;
        align-items: stretch;
        padding: 10px 12px;
        gap: 8px;
      }

      .category-filters .filter-icon {
        display: none;
      }

      .category-filters select {
        width: 100%;
        min-width: auto;
      }
    }

    @media (max-width: 480px) {
      .category-compact-bar .compact-info h1 {
        font-size: 0.92rem;
      }

      .category-compact-bar .compact-count {
        padding: 4px 8px;
        font-size: 0.68rem;
      }

      .brand-chip .brand-chip-name {
        max-width: 80px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  </style>
</head>
<body>

  <!-- مكونات الموبايل -->
  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>

  <!-- الهيدر -->
  <div id="header-placeholder"></div>

  <!-- المحتوى -->
  <main class="page-content">
    <div class="container">

      <!-- مسار التنقل -->
      <div class="breadcrumb" id="breadcrumb" style="margin-bottom:12px;">
        <a href="/gomla/">الرئيسية</a>
        <span>›</span>
        <a href="/gomla/categories.html" id="breadcrumbCategoriesLink">الأقسام</a>
        <span>›</span>
        <span id="breadcrumbCategoryName">جاري التحميل...</span>
      </div>

      <!-- ============================================================ -->
      <!-- 🎯 الشريط المضغوط (Sticky)                                    -->
      <!-- ============================================================ -->
      <div class="category-compact-bar" id="categoryCompactBar">
        <img src="/gomla/assets/images/no-image.png" 
             alt="صورة القسم" 
             class="compact-image" 
             id="categoryImage"
             onerror="this.src='/gomla/assets/images/no-image.png'">
        
        <div class="compact-info">
          <h1 id="categoryName">جاري التحميل...</h1>
          <p>
            <i class="fas fa-tag"></i>
            <span>تصفح منتجات هذا القسم</span>
          </p>
        </div>
        
        <div class="compact-count" id="categoryCount">
          <i class="fas fa-spinner fa-spin"></i>
          <span>—</span>
        </div>
      </div>

      <!-- ============================================================ -->
      <!-- 🏷️ شرائح البراندات                                            -->
      <!-- ============================================================ -->
      <div class="brands-chips-bar" id="brandsChipsBar">
        <div class="brands-chips-title">
          <i class="fas fa-copyright"></i>
          <span>البراندات في هذا القسم</span>
        </div>
        <div class="brands-chips-scroll" id="brandsChipsScroll">
          <!-- يتم تحميلها ديناميكياً -->
        </div>
      </div>

      <!-- ============================================================ -->
      <!-- 🔍 الفلاتر                                                    -->
      <!-- ============================================================ -->
      <div class="category-filters">
        <i class="fas fa-sliders-h filter-icon"></i>
        <select id="sortFilter" onchange="applyFilters()">
          <option value="newest">الأحدث</option>
          <option value="price-low">السعر: الأقل للأعلى</option>
          <option value="price-high">السعر: الأعلى للأقل</option>
          <option value="popular">الأكثر مبيعاً</option>
        </select>
        <select id="availabilityFilter" onchange="applyFilters()">
          <option value="">كل المنتجات</option>
          <option value="available">المتوفر فقط</option>
        </select>
      </div>

      <!-- ============================================================ -->
      <!-- 📦 شبكة المنتجات                                              -->
      <!-- ============================================================ -->
      <div class="products-grid" id="productsContainer">
        <div class="loading-spinner">
          <i class="fas fa-spinner fa-spin"></i>
          جاري تحميل المنتجات...
        </div>
      </div>

      <!-- تحميل المزيد -->
      <div class="load-more-wrapper">
        <button class="btn btn-outline" id="loadMoreBtn" onclick="loadMoreProducts()" style="display:none;">
          <i class="fas fa-chevron-down"></i>
          تحميل المزيد
        </button>
      </div>

    </div>
  </main>

  <!-- التبويبات السفلى -->
  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>

  <!-- الفوتر -->
  <div id="footer-placeholder"></div>

  <!-- السايدبار -->
  <div id="sidebar-placeholder"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- نافذة البحث -->
  <div class="search-modal-overlay" id="searchModalOverlay" onclick="closeSearchModal(event)">
    <div class="search-modal" onclick="event.stopPropagation()">
      <div class="search-modal-header">
        <i class="fas fa-search search-icon"></i>
        <input type="text" 
               id="searchModalInput" 
               placeholder="ابحث عن منتج..."
               autocomplete="off"
               oninput="handleModalSearch(this.value)"
               onkeydown="handleSearchKeydown(event)">
        <button class="search-modal-close" onclick="closeSearchModal()" aria-label="إغلاق">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="search-modal-body" id="searchModalBody">
        <div id="searchInitialContent">
          <div class="search-suggestions-header">
            <i class="fas fa-fire"></i>
            اقتراحات سريعة
          </div>
          <div class="search-suggestions-chips">
            <a href="#" class="search-chip" onclick="quickSearch('منظف')">
              <i class="fas fa-spray-can"></i>
              منظفات
            </a>
            <a href="#" class="search-chip" onclick="quickSearch('ورق')">
              <i class="fas fa-toilet-paper"></i>
              ورقيات
            </a>
            <a href="#" class="search-chip" onclick="quickSearch('صابون')">
              <i class="fas fa-soap"></i>
              صابون
            </a>
          </div>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="search-keyboard-hint">
        <span><kbd>ESC</kbd> للإغلاق</span>
        <span><kbd>Enter</kbd> للبحث</span>
      </div>
    </div>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 category-products.html - منتجات القسم
    // ============================================================

    // ===== المتغيرات =====
    let categoryId = null;
    let categoryData = null;
    let storeType = 'retail';
    let allProducts = [];
    let filteredProducts = [];
    let currentPage = 0;
    const pageSize = 12;
    let selectedBrandId = '';
    let brandData = {}; // { brandId: { name, imageUrl } }

    // ============================================================
    // 🚀 تحميل الصفحة
    // ============================================================

    async function loadPageData() {
      const urlParams = new URLSearchParams(window.location.search);
      categoryId = urlParams.get('id');
      storeType = urlParams.get('type') || 'retail';

      if (!categoryId) {
        showError('لم يتم تحديد قسم');
        return;
      }

      // تحديد نوع المتجر حسب الصلاحية
      const user = getCurrentUser();
      if (user && user.data) {
        const role = user.data.role;
        if (role === ROLES.WHOLESALE || role === ROLES.ADMIN || role === ROLES.SUPER || role === ROLES.ADMIN_PLUS) {
          storeType = 'wholesale';
        } else {
          storeType = 'retail';
        }
      }

      // تحديث رابط "الأقسام"
      document.getElementById('breadcrumbCategoriesLink').href = 
        `/gomla/categories.html`;

      await loadCategoryInfo();
      await loadProducts();
      await loadCategoryBrands();
      initStickyBar();

      document.title = `${categoryData?.name || 'القسم'} - أولاد شعلان`;
    }

    // ============================================================
    // 📂 معلومات القسم
    // ============================================================

    async function loadCategoryInfo() {
      try {
        const doc = await db.collection(COLLECTIONS.CATEGORIES).doc(categoryId).get();
        
        if (!doc.exists) {
          showError('القسم غير موجود');
          return;
        }

        categoryData = { id: doc.id, ...doc.data() };

        document.getElementById('categoryName').textContent = categoryData.name || 'قسم';
        document.getElementById('breadcrumbCategoryName').textContent = categoryData.name || 'قسم';
        
        if (categoryData.imageUrl) {
          document.getElementById('categoryImage').src = categoryData.imageUrl;
        }

      } catch (error) {
        console.error('Error loading category:', error);
      }
    }

    // ============================================================
    // 📦 تحميل المنتجات
    // ============================================================

    async function loadProducts() {
      const container = document.getElementById('productsContainer');
      if (!container) return;

      try {
        const snapshot = await db.collection(COLLECTIONS.PRODUCTS)
          .where('available', '==', true)
          .where('categoryId', '==', categoryId)
          .orderBy('createdAt', 'desc')
          .limit(pageSize)
          .get();

        allProducts = [];
        snapshot.forEach(doc => {
          allProducts.push({ id: doc.id, ...doc.data() });
        });

        filteredProducts = [...allProducts];

        // تحديث العداد
        updateCategoryCount(allProducts.length);

        renderProducts();

        if (allProducts.length >= pageSize) {
          document.getElementById('loadMoreBtn').style.display = 'inline-block';
        }

      } catch (error) {
        console.error('Error loading products:', error);
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>حدث خطأ في تحميل المنتجات</p>
          </div>
        `;
      }
    }

    // ============================================================
    // 📊 تحديث عدد المنتجات
    // ============================================================

    function updateCategoryCount(count) {
      const countEl = document.getElementById('categoryCount');
      if (countEl) {
        countEl.innerHTML = `
          <i class="fas fa-box"></i>
          <span>${count} منتج</span>
        `;
      }
    }

    // ============================================================
    // 🎨 عرض المنتجات
    // ============================================================

    function renderProducts() {
      const container = document.getElementById('productsContainer');
      if (!container) return;

      const start = currentPage * pageSize;
      const end = start + pageSize;
      const pageProducts = filteredProducts.slice(start, end);

      if (pageProducts.length === 0 && currentPage === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <i class="fas fa-box-open"></i>
            <p>لا توجد منتجات في هذا القسم</p>
            <a href="/gomla/categories.html" class="btn btn-primary" style="margin-top:12px;">
              <i class="fas fa-arrow-right"></i>
              العودة للأقسام
            </a>
          </div>
        `;
        document.getElementById('loadMoreBtn').style.display = 'none';
        return;
      }

      const isWholesale = storeType === 'wholesale';

      let html = '';

      pageProducts.forEach(product => {
        // 🔒 السعر والوحدة حسب نوع المستخدم
        let price, unit;
        if (isWholesale) {
          price = product.wholesalePrice || 0;
          unit = product.unit || 'كرتونة';
        } else {
          price = product.retailPrice || 0;
          unit = 'قطعة';
        }
        
        const stock = product.stockQuantity || 0;
        const isAvailable = stock > 0;
        
        // عرض/خصم
        const hasRetailOffer = !isWholesale && product.hasRetailOffer === true && product.retailOfferPrice > 0;
        const hasWholesaleDiscount = isWholesale && product.hasWholesaleDiscount === true && product.wholesaleDiscountPercent > 0;
        
        let discountBadge = '';
        let finalPrice = price;
        let priceHtml = `${price.toFixed(2)} ج.م`;
        
        if (hasRetailOffer) {
          const offerPrice = product.retailOfferPrice || 0;
          const disc = price > 0 ? Math.round(((price - offerPrice) / price) * 100) : 0;
          finalPrice = offerPrice;
          discountBadge = `<div class="offer-badge"><i class="fas fa-percent"></i> ${disc}%</div>`;
          priceHtml = `
            <span class="price-after">${offerPrice.toFixed(2)} ج.م</span>
            <span class="price-before">${price.toFixed(2)} ج.م</span>
          `;
        } else if (hasWholesaleDiscount) {
          const disc = product.wholesaleDiscountPercent || 0;
          finalPrice = price * (1 - disc / 100);
          discountBadge = `<div class="offer-badge" style="background:linear-gradient(135deg, var(--gold-dark), var(--gold));"><i class="fas fa-tags"></i> ${disc}%</div>`;
          priceHtml = `
            <span class="price-after">${finalPrice.toFixed(2)} ج.م</span>
            <span class="price-before">${price.toFixed(2)} ج.م</span>
          `;
        }

        html += `
          <div class="product-card" onclick="goToProductDetails('${product.id}')">
            ${discountBadge}
            <img src="${product.imageUrl || '/gomla/assets/images/no-image.png'}"
                 alt="${product.name}"
                 class="product-image"
                 loading="lazy"
                 onerror="this.src='/gomla/assets/images/no-image.png'">
            <div class="product-body">
              <h4 class="product-name">${product.name}</h4>
              ${product.brandName ? `
                <p class="product-brand">
                  <i class="fas fa-tag"></i> ${product.brandName}
                </p>
              ` : ''}
              
              <div class="product-price">
                ${priceHtml}
                <small>/ ${unit}</small>
              </div>
              
              ${isAvailable ? `
                <button class="btn btn-primary btn-sm"
                        onclick="event.stopPropagation();handleAddToCart('${product.id}')">
                  <i class="fas fa-cart-plus"></i> أضف للسلة
                </button>
              ` : `
                <div class="out-of-stock">
                  <i class="fas fa-times-circle"></i> غير متوفر
                </div>
              `}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      if (filteredProducts.length > (currentPage + 1) * pageSize) {
        document.getElementById('loadMoreBtn').style.display = 'inline-block';
      } else {
        document.getElementById('loadMoreBtn').style.display = 'none';
      }
    }

    // ============================================================
    // 🏷️ البراندات في القسم (Chips)
    // ============================================================

    async function loadCategoryBrands() {
      const bar = document.getElementById('brandsChipsBar');
      const scroll = document.getElementById('brandsChipsScroll');
      if (!bar || !scroll) return;

      try {
        // جلب كل منتجات القسم بدون limit
        const snapshot = await db.collection(COLLECTIONS.PRODUCTS)
          .where('available', '==', true)
          .where('categoryId', '==', categoryId)
          .get();

        // تجميع البراندات
        const brandCounts = {};
        
        snapshot.forEach(doc => {
          const p = doc.data();
          if (p.brandId && p.brandName) {
            if (!brandCounts[p.brandId]) {
              brandCounts[p.brandId] = {
                id: p.brandId,
                name: p.brandName,
                count: 0
              };
            }
            brandCounts[p.brandId].count++;
          }
        });

        const brands = Object.values(brandCounts);

        if (brands.length === 0) {
          bar.classList.remove('show');
          return;
        }

        // جلب صور البراندات من كولكشن brands
        const brandsSnapshot = await db.collection(COLLECTIONS.BRANDS).get();
        brandsSnapshot.forEach(doc => {
          brandData[doc.id] = doc.data();
        });

        // بناء HTML
        let html = `
          <button class="brand-chip all-chip active" onclick="filterByBrand(event, '')">
            <div class="brand-chip-icon">
              <i class="fas fa-list"></i>
            </div>
            <span class="brand-chip-name">الكل</span>
            <span class="brand-chip-count">${snapshot.size}</span>
          </button>
        `;

        brands.forEach(brand => {
          const info = brandData[brand.id] || {};
          const imageUrl = info.imageUrl || '/gomla/assets/images/no-image.png';
          
          html += `
            <button class="brand-chip" onclick="filterByBrand(event, '${brand.id}')">
              <img src="${imageUrl}" 
                   alt="${brand.name}"
                   onerror="this.src='/gomla/assets/images/no-image.png'">
              <span class="brand-chip-name">${brand.name}</span>
              <span class="brand-chip-count">${brand.count}</span>
            </button>
          `;
        });

        scroll.innerHTML = html;
        
        // إظهار الشريط بأنيميشن
        setTimeout(() => bar.classList.add('show'), 100);

      } catch (error) {
        console.error('Error loading brands:', error);
      }
    }

    // ============================================================
    // 🎯 فلترة بالبراند
    // ============================================================

    function filterByBrand(event, brandId) {
      event.preventDefault();
      selectedBrandId = brandId;

      // تحديث الـ active
      document.querySelectorAll('.brand-chip').forEach(chip => {
        chip.classList.remove('active');
      });
      event.currentTarget.classList.add('active');

      applyFilters();
    }

    // ============================================================
    // 🔍 التصفية
    // ============================================================

    function applyFilters() {
      const sortValue = document.getElementById('sortFilter').value;
      const availability = document.getElementById('availabilityFilter').value;

      filteredProducts = [...allProducts];

      // فلتر البراند
      if (selectedBrandId) {
        filteredProducts = filteredProducts.filter(p => p.brandId === selectedBrandId);
      }

      // فلتر التوفّر
      if (availability === 'available') {
        filteredProducts = filteredProducts.filter(p => (p.stockQuantity || 0) > 0);
      }

      // ترتيب
      const isWholesale = storeType === 'wholesale';
      switch (sortValue) {
        case 'price-low':
          filteredProducts.sort((a, b) => {
            const priceA = isWholesale ? (a.wholesalePrice || 0) : (a.retailPrice || 0);
            const priceB = isWholesale ? (b.wholesalePrice || 0) : (b.retailPrice || 0);
            return priceA - priceB;
          });
          break;
        case 'price-high':
          filteredProducts.sort((a, b) => {
            const priceA = isWholesale ? (a.wholesalePrice || 0) : (a.retailPrice || 0);
            const priceB = isWholesale ? (b.wholesalePrice || 0) : (b.retailPrice || 0);
            return priceB - priceA;
          });
          break;
        case 'popular':
          filteredProducts.sort((a, b) => (b.salesCount || 0) - (a.salesCount || 0));
          break;
        default:
          filteredProducts.sort((a, b) => 
            (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0)
          );
      }

      currentPage = 0;
      renderProducts();

      updateCategoryCount(filteredProducts.length);
    }

    // ============================================================
    // 🔄 تحميل المزيد
    // ============================================================

    async function loadMoreProducts() {
      currentPage++;
      const start = currentPage * pageSize;

      try {
        const snapshot = await db.collection(COLLECTIONS.PRODUCTS)
          .where('available', '==', true)
          .where('categoryId', '==', categoryId)
          .orderBy('createdAt', 'desc')
          .limit(start + pageSize)
          .get();

        const newProducts = [];
        snapshot.forEach(doc => newProducts.push({ id: doc.id, ...doc.data() }));

        const additional = newProducts.slice(start);
        allProducts = [...allProducts, ...additional];
        
        applyFilters();

      } catch (error) {
        console.error('Error loading more:', error);
        currentPage--;
      }
    }

    // ============================================================
    // 📌 شريط الـ Sticky - إضافة Class أثناء السكرول
    // ============================================================

    function initStickyBar() {
      const bar = document.getElementById('categoryCompactBar');
      if (!bar) return;

      const observer = new IntersectionObserver(
        ([entry]) => {
          bar.classList.toggle('is-scrolled', !entry.isIntersecting);
        },
        { threshold: 1, rootMargin: '-10px 0px 0px 0px' }
      );

      // عنصر مراقب مخفي
      const sentinel = document.createElement('div');
      sentinel.style.cssText = 'position:absolute;top:0;height:1px;width:1px;';
      bar.parentElement.insertBefore(sentinel, bar);

      observer.observe(sentinel);
    }

    // ============================================================
    // 🛒 إضافة للسلة
    // ============================================================

    async function handleAddToCart(productId) {
      try {
        await addToCart(productId, 1);
      } catch (error) {
        console.error('Error adding to cart:', error);
      }
    }

    function goToProductDetails(productId) {
      window.location.href = `/gomla/product-details.html?id=${productId}&type=${storeType}`;
    }

    // ============================================================
    // 🛠️ رسالة الخطأ
    // ============================================================

    function showError(message) {
      document.getElementById('productsContainer').innerHTML = `
        <div class="empty-state">
          <i class="fas fa-exclamation-triangle"></i>
          <p>${message}</p>
          <a href="/gomla/categories.html" class="btn btn-primary" style="margin-top:12px;">
            <i class="fas fa-arrow-right"></i>
            العودة للأقسام
          </a>
        </div>
      `;
    }

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      loadPageData();
      console.log('✅ category-products.html loaded');
    });

    // تصدير
    window.applyFilters = applyFilters;
    window.filterByBrand = filterByBrand;
    window.loadMoreProducts = loadMoreProducts;
    window.handleAddToCart = handleAddToCart;
    window.goToProductDetails = goToProductDetails;

  </script>

</body>

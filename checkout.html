<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الطلب - أولاد شعلان</title>

  <meta name="description" content="إتمام الطلب - أولاد شعلان للمنظفات والورقيات">
  <meta name="theme-color" content="#1a2a4a">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       🎨 ستايل صفحة إتمام الطلب
       ============================================================ */

    /* ===== رأس الصفحة ===== */
    .checkout-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      border-radius: var(--radius-md);
      color: var(--white);
      border-bottom: 4px solid var(--gold);
      box-shadow: var(--shadow-md);
    }

    .checkout-header .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .checkout-header .header-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 6px 20px rgba(201, 168, 76, 0.4);
    }

    .checkout-header h1 {
      font-size: 1.4rem;
      font-weight: 900;
      margin: 0;
    }

    .checkout-header h1 .gold {
      color: var(--gold);
    }

    .checkout-header .steps-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid rgba(201, 168, 76, 0.3);
    }

    .checkout-header .steps-badge i {
      color: var(--gold);
    }

    /* ===== التخطيط ===== */
    .checkout-layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 20px;
      align-items: start;
    }

    /* ===== النموذج ===== */
    .checkout-form-container {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow: hidden;
    }

    .checkout-section {
      padding: 20px 24px;
      border-bottom: 2px solid var(--gray-100);
    }

    .checkout-section:last-child {
      border-bottom: none;
    }

    .checkout-section .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--gray-100);
    }

    .checkout-section .section-header .section-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: var(--navy);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .checkout-section .section-header h2 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--navy);
      margin: 0;
      flex: 1;
    }

    .checkout-section .section-header .section-badge {
      font-size: 0.7rem;
      background: var(--gray-100);
      color: var(--gray-500);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-weight: 700;
    }

    /* ===== حقول الإدخال ===== */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--gray-700);
      margin-bottom: 6px;
    }

    .form-group label i {
      color: var(--gold);
      font-size: 0.8rem;
    }

    .form-group label .required {
      color: var(--danger);
      margin-right: 2px;
    }

    .form-group label .locked-badge {
      font-size: 0.65rem;
      background: #eff6ff;
      color: #2563eb;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: 700;
      margin-right: 6px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.92rem;
      background: var(--gray-50);
      color: var(--gray-800);
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
      background: var(--white);
    }

    .form-group input[readonly],
    .form-group input:disabled {
      background: var(--gray-100);
      color: var(--gray-600);
      cursor: not-allowed;
      border-color: var(--gray-200);
    }

    .form-group input.error {
      border-color: var(--danger);
      background: #fef2f2;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    .form-group .help-text {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      font-size: 0.72rem;
      color: var(--gray-500);
      margin-top: 4px;
      line-height: 1.5;
    }

    .form-group .help-text i {
      color: var(--gold);
      font-size: 0.7rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .form-group .help-text.warning {
      color: #d97706;
      background: #fef9e7;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border-right: 3px solid var(--warning);
    }

    .form-group .help-text.warning i {
      color: var(--warning);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* ===== حقل المنطقة ===== */
    .region-select-wrapper {
      position: relative;
    }

    .region-select-wrapper select {
      width: 100%;
      cursor: pointer;
      appearance: none;
      padding-left: 40px;
    }

    .region-select-wrapper::after {
      content: '\f107';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      pointer-events: none;
      font-size: 0.85rem;
    }

    /* معلومات الشحن */
    .shipping-info {
      display: none;
      margin-top: 10px;
      padding: 10px 14px;
      background: #eff6ff;
      border-radius: var(--radius-sm);
      border-right: 3px solid var(--info);
      font-size: 0.82rem;
      color: #1e40af;
    }

    .shipping-info.show {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    .shipping-info i {
      color: var(--info);
      font-size: 0.95rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .shipping-info strong {
      color: var(--info);
    }

    /* ===== الملخص الجانبي ===== */
    .checkout-summary {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow: hidden;
      position: sticky;
      top: 20px;
    }

    .checkout-summary .summary-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      border-bottom: 3px solid var(--gold);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkout-summary .summary-header i {
      color: var(--gold);
      font-size: 1.1rem;
    }

    .checkout-summary .summary-header h3 {
      font-size: 1rem;
      font-weight: 800;
      margin: 0;
      color: var(--white);
    }

    /* قائمة المنتجات */
    .checkout-summary .summary-items {
      max-height: 300px;
      overflow-y: auto;
      padding: 12px 20px;
      border-bottom: 1px solid var(--gray-100);
    }

    .checkout-summary .summary-items::-webkit-scrollbar {
      width: 4px;
    }

    .checkout-summary .summary-items::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .summary-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--gray-100);
    }

    .summary-item:last-child {
      border-bottom: none;
    }

    .summary-item img {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      border: 1px solid var(--gray-200);
      flex-shrink: 0;
    }

    .summary-item .item-info {
      flex: 1;
      min-width: 0;
    }

    .summary-item .item-info .item-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }

    .summary-item .item-info .item-qty {
      font-size: 0.72rem;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .summary-item .item-info .item-qty i {
      color: var(--gold);
      font-size: 0.65rem;
    }

    .summary-item .item-total {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--gold-dark);
      flex-shrink: 0;
    }

    /* تفاصيل الحساب */
    .checkout-summary .summary-details {
      padding: 16px 20px;
    }

    .checkout-summary .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 0.88rem;
    }

    .checkout-summary .summary-row .label {
      color: var(--gray-600);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .checkout-summary .summary-row .label i {
      color: var(--gold);
      font-size: 0.8rem;
    }

    .checkout-summary .summary-row .value {
      font-weight: 700;
      color: var(--navy);
    }

    .checkout-summary .summary-row .value.gold {
      color: var(--gold-dark);
    }

    .checkout-summary .summary-row .value.green {
      color: var(--success);
    }

    .checkout-summary .summary-row .value.free {
      color: var(--success);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .checkout-summary .summary-row.total {
      font-size: 1.15rem;
      font-weight: 900;
      border-top: 2px solid var(--gray-200);
      padding-top: 14px;
      margin-top: 8px;
      color: var(--navy);
    }

    .checkout-summary .summary-row.total .value {
      color: var(--gold-dark);
      font-size: 1.35rem;
    }

    /* ===== زر التأكيد ===== */
    .checkout-summary .confirm-btn {
      width: 100%;
      padding: 15px 24px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 0;
      border-radius: var(--radius-full);
      margin: 8px 20px 16px;
      width: calc(100% - 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .checkout-summary .confirm-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .checkout-summary .back-to-cart {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--gray-500);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 10px;
      margin-bottom: 16px;
      transition: all 0.2s ease;
      font-weight: 700;
    }

    .checkout-summary .back-to-cart:hover {
      color: var(--gold-dark);
    }

    /* ===== شاشة النجاح ===== */
    .success-screen {
      display: none;
      padding: 60px 24px;
      text-align: center;
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
    }

    .success-screen.show {
      display: block;
      animation: success-in 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes success-in {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .success-screen .success-icon {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: var(--white);
      font-size: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 12px 40px rgba(34, 197, 94, 0.4);
      animation: success-pulse 2s ease-in-out infinite;
    }

    @keyframes success-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 12px 40px rgba(34, 197, 94, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 16px 50px rgba(34, 197, 94, 0.5);
      }
    }

    .success-screen h2 {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 12px;
    }

    .success-screen .order-number {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #fcf9f0, #f8f4e8);
      border: 2px solid var(--gold);
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-size: 1rem;
      font-weight: 800;
      color: var(--gold-dark);
      margin-bottom: 20px;
    }

    .success-screen .order-number i {
      color: var(--gold);
    }

    .success-screen p {
      font-size: 1rem;
      color: var(--gray-600);
      line-height: 1.8;
      max-width: 500px;
      margin: 0 auto 24px;
    }

    .success-screen .success-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ===== Responsive ===== */
    @media (max-width: 992px) {
      .checkout-layout {
        grid-template-columns: 1fr;
      }

      .checkout-summary {
        position: static;
      }
    }

    @media (max-width: 768px) and (pointer: coarse) {
      .checkout-header {
        padding: 12px 14px;
      }

      .checkout-header .header-icon {
        width: 42px;
        height: 42px;
        font-size: 1.2rem;
      }

      .checkout-header h1 {
        font-size: 1.1rem;
      }

      .checkout-header .steps-badge {
        font-size: 0.7rem;
        padding: 5px 10px;
      }

      .checkout-section {
        padding: 16px;
      }

      .checkout-section .section-header h2 {
        font-size: 0.95rem;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .checkout-summary .summary-items {
        max-height: 200px;
      }

      .success-screen {
        padding: 40px 16px;
      }

      .success-screen .success-icon {
        width: 90px;
        height: 90px;
        font-size: 2.5rem;
      }

      .success-screen h2 {
        font-size: 1.4rem;
      }

      .success-screen .success-actions .btn {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .checkout-header h1 {
        font-size: 0.95rem;
      }

      .checkout-section {
        padding: 14px 12px;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        padding: 10px 12px;
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>

  <!-- مكونات الموبايل -->
  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>

  <!-- الهيدر -->
  <div id="header-placeholder"></div>

  <!-- المحتوى -->
  <main class="page-content">
    <div class="container">

      <!-- مسار التنقل -->
      <div class="breadcrumb" style="margin-bottom:12px;">
        <a href="/gomla/">الرئيسية</a>
        <span>›</span>
        <a href="/gomla/cart.html">السلة</a>
        <span>›</span>
        <span>إتمام الطلب</span>
      </div>

      <!-- ============================================================ -->
      <!-- 📝 محتوى الدفع                                               -->
      <!-- ============================================================ -->
      <div id="checkoutContainer">
        <div class="cart-loading" style="text-align:center;padding:60px 20px;color:var(--gray-400);">
          <i class="fas fa-spinner fa-spin" style="font-size:2.5rem;color:var(--gold);display:block;margin-bottom:12px;"></i>
          <p>جاري تحميل بيانات الدفع...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- التبويبات السفلى -->
  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>

  <!-- الفوتر -->
  <div id="footer-placeholder"></div>

  <!-- السايدبار -->
  <div id="sidebar-placeholder"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 checkout.html - إتمام الطلب
    // ============================================================

    // ===== المتغيرات =====
    let cartItems = [];
    let isGuest = false;
    let userId = null;
    let userRole = ROLES.GUEST;
    let storeType = 'retail';
    let userData = null;
    let shippingCost = 0;
    let subtotal = 0;
    let total = 0;
    let selectedRegion = '';
    let isFreeShipping = false;
    let minOrderAmount = 0;
    let isSubmitting = false;

    // ============================================================
    // 🚀 تحميل الصفحة
    // ============================================================

    async function loadCheckout() {
      const container = document.getElementById('checkoutContainer');
      if (!container) return;

      // جلب نوع المتجر من الرابط
      const urlParams = new URLSearchParams(window.location.search);
      storeType = urlParams.get('type') || 'retail';

      // جلب بيانات المستخدم
      const user = getCurrentUser();

      if (user) {
        isGuest = false;
        userId = user.data.id || user.data.uid;
        userRole = user.data.role || ROLES.RETAIL;
        userData = user.data;

        // التحقق من نوع المتجر
        if (userRole === ROLES.WHOLESALE || userRole === ROLES.ADMIN || userRole === ROLES.SUPER || userRole === ROLES.ADMIN_PLUS) {
          storeType = 'wholesale';
          minOrderAmount = window.WHOLESALE_MIN_ORDER || 1500;
        } else {
          storeType = 'retail';
          minOrderAmount = 0;
        }

        await loadUserCart();

      } else {
        isGuest = true;
        userId = null;
        userRole = ROLES.GUEST;
        storeType = 'retail';
        minOrderAmount = 0;

        loadGuestCart();
      }
    }

    // ============================================================
    // 📥 تحميل سلة المستخدم المسجل
    // ============================================================

    async function loadUserCart() {
      try {
        const snapshot = await db.collection(COLLECTIONS.CART)
          .where('userId', '==', userId)
          .get();

        if (snapshot.empty) {
          window.location.href = '/gomla/cart.html';
          return;
        }

        cartItems = [];
        snapshot.forEach(doc => {
          cartItems.push({ id: doc.id, ...doc.data() });
        });

        renderCheckout();

      } catch (error) {
        console.error('Error loading cart:', error);
        showToast('❌ حدث خطأ في تحميل السلة', 'error');
      }
    }

    // ============================================================
    // 📥 تحميل سلة الزائر
    // ============================================================

    function loadGuestCart() {
      const saved = localStorage.getItem('guest_cart');
      if (saved) {
        try {
          cartItems = JSON.parse(saved);
        } catch (e) {
          cartItems = [];
        }
      }

      if (cartItems.length === 0) {
        window.location.href = '/gomla/cart.html';
        return;
      }

      renderCheckout();
    }

    // ============================================================
    // 🎨 عرض صفحة الدفع
    // ============================================================

    function renderCheckout() {
      const container = document.getElementById('checkoutContainer');
      if (!container) return;

      // حساب المجموع الفرعي
      subtotal = 0;
      cartItems.forEach(item => {
        subtotal += (item.price || 0) * (item.quantity || 1);
      });

      const isWholesale = storeType === 'wholesale';

      // قائمة المناطق
      const regions = isWholesale ? 
        Object.keys(SHIPPING_RATES.wholesale) : 
        Object.keys(SHIPPING_RATES.retail);
      
      const regionLabel = isWholesale ? 'اختر المدينة' : 'اختر المنطقة';
      const regionPlaceholder = isWholesale ? 'طنطا، المنصورة، المحلة' : 'الرجبي، السبع بنات، الزراعة...';

      // البيانات التلقائية للمسجل
      const autoName = !isGuest && userData?.name ? userData.name : '';
      const autoPhone = !isGuest && userData?.phone ? userData.phone : '';
      const autoAddress = !isGuest && userData?.address ? userData.address : '';

      // بناء HTML
      let html = `
        <!-- رأس الصفحة -->
        <div class="checkout-header">
          <div class="header-left">
            <div class="header-icon">
              <i class="fas fa-check-circle"></i>
            </div>
            <h1>إتمام <span class="gold">الطلب</span></h1>
          </div>
          <div class="steps-badge">
            <i class="fas fa-${isWholesale ? 'store' : 'shopping-cart'}"></i>
            ${isWholesale ? 'متجر الجملة' : 'متجر القطاعي'}
          </div>
        </div>

        <div class="checkout-layout">
          
          <!-- النموذج -->
          <div class="checkout-form-container">
            <form id="checkoutForm" onsubmit="handleSubmit(event)">
              
              <!-- ===== قسم العميل ===== -->
              <div class="checkout-section">
                <div class="section-header">
                  <div class="section-icon">
                    <i class="fas fa-user"></i>
                  </div>
                  <h2>بيانات العميل</h2>
                  ${!isGuest ? `<span class="section-badge">جلب تلقائي</span>` : `<span class="section-badge">إدخال يدوي</span>`}
                </div>

                <div class="form-group">
                  <label>
                    <i class="fas fa-user"></i>
                    الاسم الكامل
                    <span class="required">*</span>
                    ${!isGuest ? `<span class="locked-badge"><i class="fas fa-lock"></i> مقروء</span>` : ''}
                  </label>
                  <input 
                    type="text" 
                    id="customerName" 
                    value="${autoName}"
                    placeholder="الاسم الثلاثي"
                    maxlength="60"
                    ${!isGuest ? 'readonly' : 'required'}>
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label>
                      <i class="fas fa-phone"></i>
                      رقم الهاتف
                      <span class="required">*</span>
                      ${!isGuest ? `<span class="locked-badge"><i class="fas fa-lock"></i></span>` : ''}
                    </label>
                    <input 
                      type="tel" 
                      id="customerPhone" 
                      value="${autoPhone}"
                      placeholder="01xxxxxxxxx"
                      maxlength="11"
                      inputmode="numeric"
                      ${!isGuest ? 'readonly' : 'required'}>
                  </div>

                  <div class="form-group">
                    <label>
                      <i class="fas fa-phone-volume"></i>
                      رقم هاتف بديل
                      <span class="required">*</span>
                    </label>
                    <input 
                      type="tel" 
                      id="customerPhone2" 
                      placeholder="01xxxxxxxxx"
                      maxlength="11"
                      inputmode="numeric"
                      required>
                  </div>
                </div>

                <div class="form-group">
                  <label>
                    <i class="fas fa-map-marker-alt"></i>
                    العنوان الأساسي
                    <span class="required">*</span>
                    ${!isGuest ? `<span class="locked-badge"><i class="fas fa-lock"></i></span>` : ''}
                  </label>
                  <input 
                    type="text" 
                    id="customerAddress" 
                    value="${autoAddress}"
                    placeholder="المدينة - الشارع - رقم المبنى"
                    maxlength="150"
                    ${!isGuest ? 'readonly' : 'required'}>
                </div>

                <div class="form-group">
                  <label>
                    <i class="fas fa-map-marked-alt"></i>
                    عنوان بديل (اختياري)
                  </label>
                  <input 
                    type="text" 
                    id="customerAddress2" 
                    placeholder="عنوان آخر للتوصيل"
                    maxlength="150">
                  <div class="help-text">
                    <i class="fas fa-info-circle"></i>
                    يمكنك إضافة عنوان مختلف لتوصيل الطلب إليه
                  </div>
                </div>
              </div>

              <!-- ===== قسم التوصيل ===== -->
              <div class="checkout-section">
                <div class="section-header">
                  <div class="section-icon">
                    <i class="fas fa-truck"></i>
                  </div>
                  <h2>بيانات التوصيل</h2>
                </div>

                <div class="form-group">
                  <label>
                    <i class="fas fa-map-pin"></i>
                    ${regionLabel}
                    <span class="required">*</span>
                  </label>
                  <div class="region-select-wrapper">
                    <select id="regionSelect" onchange="handleRegionChange()" required>
                      <option value="">-- ${regionPlaceholder} --</option>
                      ${regions.map(r => `<option value="${r}">${r}</option>`).join('')}
                    </select>
                  </div>
                  <div class="help-text warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    ${isWholesale ? 
                      'يتم التوصيل للمدن المذكورة فقط - يرجى التواصل مع الدعم للمدن الأخرى' : 
                      'التوصيل متاح داخل المحلة الكبرى فقط'}
                  </div>
                </div>

                <!-- معلومات الشحن -->
                <div class="shipping-info" id="shippingInfo">
                  <i class="fas fa-info-circle"></i>
                  <div id="shippingInfoText"></div>
                </div>

                <div class="form-group">
                  <label>
                    <i class="fas fa-calendar-alt"></i>
                    موعد التوصيل المقترح
                    <span class="required">*</span>
                  </label>
                  <input 
                    type="date" 
                    id="deliveryDate" 
                    min="${getMinDate()}"
                    required>
                  <div class="help-text">
                    <i class="fas fa-clock"></i>
                    قد تستغرق عملية التوصيل من ساعتين إلى 4 أيام عمل حسب الظروف والحالة
                  </div>
                </div>

                <div class="form-group">
                  <label>
                    <i class="fas fa-comment-alt"></i>
                    ملاحظات (اختياري)
                  </label>
                  <textarea 
                    id="orderNotes" 
                    rows="3"
                    placeholder="أي تعليمات إضافية للتوصيل أو ملاحظات..."
                    maxlength="300"></textarea>
                </div>
              </div>

            </form>
          </div>

          <!-- الملخص -->
          <div class="checkout-summary">
            <div class="summary-header">
              <i class="fas fa-receipt"></i>
              <h3>ملخص الطلب</h3>
            </div>

            <div class="summary-items">
              ${renderSummaryItems()}
            </div>

            <div class="summary-details">
              <div class="summary-row">
                <span class="label">
                  <i class="fas fa-boxes"></i>
                  إجمالي المنتجات
                </span>
                <span class="value">${getTotalItems()} منتج</span>
              </div>

              <div class="summary-row">
                <span class="label">
                  <i class="fas fa-money-bill-wave"></i>
                  المجموع الفرعي
                </span>
                <span class="value gold">${subtotal.toFixed(2)} ج.م</span>
              </div>

              <div class="summary-row" id="shippingRow">
                <span class="label">
                  <i class="fas fa-truck"></i>
                  الشحن
                </span>
                <span class="value" id="shippingValue">-- اختر المنطقة --</span>
              </div>

              <div class="summary-row total">
                <span class="label">الإجمالي النهائي</span>
                <span class="value" id="totalValue">${subtotal.toFixed(2)} ج.م</span>
              </div>
            </div>

            <button 
              type="submit" 
              form="checkoutForm"
              class="btn btn-primary confirm-btn" 
              id="confirmBtn">
              <i class="fas fa-check-circle"></i>
              تأكيد الطلب
            </button>

            <a href="/gomla/cart.html" class="back-to-cart">
              <i class="fas fa-arrow-right"></i>
              رجوع للسلة
            </a>
          </div>

        </div>

        <!-- شاشة النجاح -->
        <div class="success-screen" id="successScreen">
          <div class="success-icon">
            <i class="fas fa-check"></i>
          </div>
          <h2>🎉 تم استلام طلبك بنجاح!</h2>
          <div class="order-number">
            <i class="fas fa-hashtag"></i>
            <span id="successOrderNumber">--</span>
          </div>
          <p>
            شكراً لثقتك بنا! سيتم التواصل معك قريباً لتأكيد الطلب وتفاصيل التوصيل.
            <br>
            ${isGuest ? 
              '<strong>ملاحظة:</strong> أنت تطلب كزائر. يمكنك التسجيل لتتبع طلباتك.' : 
              'يمكنك متابعة طلبك من صفحة "طلباتي".'}
          </p>
          <div class="success-actions">
            <a href="/gomla/${isWholesale ? 'store-wholesale' : 'store-retail'}.html" class="btn btn-primary">
              <i class="fas fa-shopping-cart"></i>
              متابعة التسوق
            </a>
            ${!isGuest ? `
              <a href="/gomla/customer/orders.html" class="btn btn-outline">
                <i class="fas fa-list"></i>
                طلباتي
              </a>
            ` : `
              <a href="/gomla/customer-register.html" class="btn btn-outline">
                <i class="fas fa-user-plus"></i>
                أنشئ حساب
              </a>
            `}
          </div>
        </div>
      `;

      container.innerHTML = html;

      // التركيز التلقائي على أول حقل فارغ
      setTimeout(() => {
        if (isGuest) {
          document.getElementById('customerName')?.focus();
        } else {
          document.getElementById('customerPhone2')?.focus();
        }
      }, 300);

      console.log('✅ Checkout page rendered');
    }

    // ============================================================
    // 📋 عرض المنتجات في الملخص
    // ============================================================

    function renderSummaryItems() {
      let html = '';

      cartItems.forEach(item => {
        const qty = item.quantity || 1;
        const price = item.price || 0;
        const total = price * qty;
        const productName = item.productName || item.name || 'منتج';
        const productImage = item.imageUrl || '/gomla/assets/images/no-image.png';
        const unit = item.unit || 'قطعة';

        html += `
          <div class="summary-item">
            <img src="${productImage}" 
                 alt="${productName}"
                 onerror="this.src='/gomla/assets/images/no-image.png'">
            <div class="item-info">
              <div class="item-name">${productName}</div>
              <div class="item-qty">
                <i class="fas fa-times"></i>
                ${qty} ${unit}
              </div>
            </div>
            <div class="item-total">${total.toFixed(2)} ج.م</div>
          </div>
        `;
      });

      return html;
    }

    function getTotalItems() {
      return cartItems.reduce((sum, item) => sum + (item.quantity || 1), 0);
    }

    // ============================================================
    // 🚚 حساب الشحن
    // ============================================================

    function handleRegionChange() {
      const regionSelect = document.getElementById('regionSelect');
      const region = regionSelect.value;
      selectedRegion = region;

      const shippingInfo = document.getElementById('shippingInfo');
      const shippingInfoText = document.getElementById('shippingInfoText');
      const shippingValue = document.getElementById('shippingValue');
      const totalValue = document.getElementById('totalValue');

      if (!region) {
        shippingValue.textContent = '-- اختر المنطقة --';
        shippingValue.style.color = 'var(--gray-500)';
        totalValue.textContent = `${subtotal.toFixed(2)} ج.م`;
        shippingInfo.classList.remove('show');
        return;
      }

      const rates = SHIPPING_RATES[storeType];
      const rate = rates[region];

      if (!rate) {
        shippingValue.textContent = 'غير متاح';
        shippingValue.style.color = 'var(--danger)';
        totalValue.textContent = `${subtotal.toFixed(2)} ج.م`;
        return;
      }

      // حساب الشحن
      const isFree = subtotal >= rate.freeThreshold;
      isFreeShipping = isFree;
      shippingCost = isFree ? 0 : rate.cost;

      if (isFree) {
        shippingValue.innerHTML = `<span class="value green"><i class="fas fa-check-circle"></i> مجاني</span>`;
        shippingInfoText.innerHTML = `
          ✅ <strong>شحن مجاني!</strong> لأن مجموع طلبك تجاوز ${rate.freeThreshold} ج.م
        `;
        shippingInfo.classList.add('show');
      } else {
        shippingValue.textContent = `${shippingCost.toFixed(2)} ج.م`;
        shippingValue.style.color = 'var(--gold-dark)';
        
        const remaining = rate.freeThreshold - subtotal;
        shippingInfoText.innerHTML = `
          💡 أضف <strong>${remaining.toFixed(2)} ج.م</strong> للحصول على شحن مجاني
          (الحد الأدنى ${rate.freeThreshold} ج.م)
        `;
        shippingInfo.classList.add('show');
      }

      // حساب الإجمالي
      total = subtotal + shippingCost;
      totalValue.textContent = `${total.toFixed(2)} ج.م`;
      totalValue.style.color = 'var(--gold-dark)';
    }

    // ============================================================
    // 📅 تاريخ أدنى للتوصيل
    // ============================================================

    function getMinDate() {
      const today = new Date();
      today.setDate(today.getDate() + 1); // يبدأ من الغد
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      return `${yyyy}-${mm}-${dd}`;
    }

    // ============================================================
    // 📝 إرسال الطلب
    // ============================================================

    async function handleSubmit(event) {
      event.preventDefault();

      if (isSubmitting) return;

      // جمع البيانات
      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const phone2 = document.getElementById('customerPhone2').value.trim();
      const address = document.getElementById('customerAddress').value.trim();
      const address2 = document.getElementById('customerAddress2').value.trim();
      const deliveryDate = document.getElementById('deliveryDate').value;
      const notes = document.getElementById('orderNotes').value.trim();

      // ===== التحقق =====
      if (!name || name.length < 3) {
        showToast('⚠️ يرجى إدخال الاسم الكامل', 'warning');
        document.getElementById('customerName').focus();
        return;
      }

      if (!phone || !/^01[0-9]{9}$/.test(phone)) {
        showToast('⚠️ رقم الهاتف يجب أن يكون 11 رقم', 'warning');
        document.getElementById('customerPhone').focus();
        return;
      }

      if (!phone2 || !/^01[0-9]{9}$/.test(phone2)) {
        showToast('⚠️ رقم الهاتف البديل يجب أن يكون 11 رقم', 'warning');
        document.getElementById('customerPhone2').focus();
        return;
      }

      if (!address || address.length < 5) {
        showToast('⚠️ يرجى إدخال العنوان بالتفصيل', 'warning');
        document.getElementById('customerAddress').focus();
        return;
      }

      if (!selectedRegion) {
        showToast('⚠️ يرجى اختيار المنطقة', 'warning');
        document.getElementById('regionSelect').focus();
        return;
      }

      if (!deliveryDate) {
        showToast('⚠️ يرجى اختيار موعد التوصيل', 'warning');
        document.getElementById('deliveryDate').focus();
        return;
      }

      // التحقق من الحد الأدنى للجملة
      if (storeType === 'wholesale' && subtotal < minOrderAmount) {
        const remaining = minOrderAmount - subtotal;
        showToast(`⚠️ الحد الأدنى للطلب ${minOrderAmount} ج.م - المتبقي ${remaining.toFixed(2)} ج.م`, 'warning');
        return;
      }

      // ===== بدء الإرسال =====
      isSubmitting = true;
      const btn = document.getElementById('confirmBtn');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري إرسال الطلب...';

      try {
        // ===== بناء بيانات الطلب =====
        const orderData = {
          // العميل
          customerId: userId || null,
          customerName: name,
          customerPhone: phone,
          customerPhone2: phone2,
          customerAddress: address,
          customerAddress2: address2 || '',
          
          // نوع الطلب
          isGuest: isGuest,
          storeType: storeType,
          userRole: userRole,
          
          // الشحن
          region: selectedRegion,
          deliveryDate: deliveryDate,
          notes: notes || '',
          
          // المنتجات
          items: cartItems.map(item => ({
            productId: item.productId,
            productName: item.productName || item.name || 'منتج',
            quantity: item.quantity || 1,
            unit: item.unit || 'قطعة',
            price: item.price || 0,
            total: (item.price || 0) * (item.quantity || 1),
            imageUrl: item.imageUrl || ''
          })),
          
          // المبالغ
          subtotal: subtotal,
          shippingCost: shippingCost,
          total: total,
          isFreeShipping: isFreeShipping,
          
          // الحالة
          status: 'pending',
          paymentStatus: 'unpaid',
          paid: 0,
          remaining: total,
          
          // الطوابع الزمنية
          orderDate: new Date().toISOString().slice(0, 10),
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        // ===== حفظ الطلب =====
        const orderRef = await db.collection(COLLECTIONS.ORDERS).add(orderData);
        const orderNumber = orderRef.id.slice(-8).toUpperCase();

        // ===== حذف السلة =====
        if (isGuest) {
          localStorage.removeItem('guest_cart');
        } else {
          // حذف من Firestore (batch)
          const cartSnapshot = await db.collection(COLLECTIONS.CART)
            .where('userId', '==', userId)
            .get();

          const batch = db.batch();
          cartSnapshot.forEach(doc => batch.delete(doc.ref));
          await batch.commit();
        }

        // ===== تسجيل النشاط =====
        try {
          await db.collection(COLLECTIONS.ACTIVITY_LOG).add({
            userId: userId || 'guest',
            userName: name,
            userRole: userRole,
            action: 'إنشاء طلب جديد',
            details: `الطلب #${orderNumber} - ${total.toFixed(2)} ج.م`,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (logError) {
          console.warn('Could not log activity:', logError);
        }

        // ===== تحديث شارة السلة =====
        if (typeof updateCartBadge === 'function') {
          updateCartBadge();
        }

        // ===== الانتقال لصفحة النجاح =====
        window.location.href = `/gomla/order-success.html?id=${orderRef.id}`;

      } catch (error) {
        console.error('Error submitting order:', error);
        showToast('❌ حدث خطأ في إرسال الطلب: ' + error.message, 'error');
        
        btn.disabled = false;
        btn.innerHTML = originalText;
        isSubmitting = false;
      }
    }

    // ============================================================
    // ✅ شاشة النجاح
    // ============================================================

    function showSuccess(orderNumber) {
      // إخفاء الـ layout
      const layout = document.querySelector('.checkout-layout');
      const header = document.querySelector('.checkout-header');
      if (layout) layout.style.display = 'none';
      if (header) header.style.display = 'none';

      // عرض شاشة النجاح
      document.getElementById('successOrderNumber').textContent = `#${orderNumber}`;
      document.getElementById('successScreen').classList.add('show');

      // Scroll للأعلى
      window.scrollTo({ top: 0, behavior: 'smooth' });

      showToast('🎉 تم استلام طلبك بنجاح!', 'success');
    }

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      loadCheckout();
      console.log('✅ checkout.html loaded');
    });

    // ============================================================
    // 🌐 تصدير الدوال
    // ============================================================

    window.loadCheckout = loadCheckout;
    window.handleRegionChange = handleRegionChange;
    window.handleSubmit = handleSubmit;

  </script>

</body>
</html>

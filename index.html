<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر أولاد شعلان للمنظفات و الورقيات</title>

  <!-- ===== SEO ===== -->
  <meta name="description" content="متجر أولاد شعلان جملة - أفضل العروض على المنظفات والورقيات بالجملة والقطاعي">
  <meta name="theme-color" content="#1a2a4a">

  <!-- ===== Font Awesome ===== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- ===== Google Font ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- ===== الستايل الموحد ===== -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- ===== Favicon ===== -->
  <link rel="icon" href="assets/images/favicon.ico">
</head>
<body>

  <!-- ========================================== -->
  <!-- 🧠 الهيدر (يتم تحميله من main.js)          -->
  <!-- ========================================== -->
  <div id="header-placeholder"></div>

  <!-- ========================================== -->
  <!-- 📢 منطقة العروض والإعلانات والمقولات        -->
  <!-- ========================================== -->
  <section class="promo-section">
    <div class="container">
      <!-- ===== سلايدر العروض ===== -->
      <div class="slider-container" id="sliderContainer">
        <div class="slider-track" id="sliderTrack">
          <!-- سيتم تحميل الصور من Firebase -->
        </div>
        <button class="slider-btn prev" onclick="slidePrev()"><i class="fas fa-chevron-right"></i></button>
        <button class="slider-btn next" onclick="slideNext()"><i class="fas fa-chevron-left"></i></button>
        <div class="slider-dots" id="sliderDots"></div>
      </div>

      <!-- ===== شريط المقولات ===== -->
      <div class="quotes-bar" id="quotesBar">
        <i class="fas fa-quote-right"></i>
        <span id="quoteText">جاري تحميل المقولات...</span>
      </div>

      <!-- ===== شريط الأخبار ===== -->
      <div class="news-bar" id="newsBar">
        <i class="fas fa-bullhorn"></i>
        <span id="newsText">جاري تحميل الأخبار...</span>
      </div>

      <!-- ===== الإعلانات (بنرات) ===== -->
      <div class="ads-grid" id="adsGrid">
        <!-- سيتم تحميل الإعلانات من Firebase -->
      </div>
    </div>
  </section>

  <!-- ========================================== -->
  <!-- 🛒 المحتوى الرئيسي (المتجر القطاعي)        -->
  <!-- ========================================== -->
  <main class="main-content">
    <div class="container">

      <!-- ===== التصنيفات ===== -->
      <section class="categories-section">
        <h2 class="section-title"><i class="fas fa-tags"></i> التصنيفات</h2>
        <div class="categories-grid" id="categoriesContainer">
          <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
        </div>
      </section>

      <!-- ===== المنتجات ===== -->
      <section class="products-section">
        <h2 class="section-title"><i class="fas fa-boxes"></i> أحدث المنتجات</h2>
        <div class="products-grid" id="productsContainer">
          <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
        </div>
      </section>

      <!-- ===== العروض ===== -->
      <section class="offers-section">
        <h2 class="section-title"><i class="fas fa-percent"></i> عروض حصرية</h2>
        <div class="products-grid" id="offersContainer">
          <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
        </div>
      </section>

    </div>
  </main>

  <!-- ========================================== -->
  <!-- 👣 الفوتر (يتم تحميله من main.js)          -->
  <!-- ========================================== -->
  <div id="footer-placeholder"></div>

  <!-- ========================================== -->
  <!-- 🧠 السايدبار (يتم تحميله من main.js)       -->
  <!-- ========================================== -->
  <div id="sidebar-placeholder"></div>

  <!-- ========================================== -->
  <!-- 🍞 Toast Notifications                     -->
  <!-- ========================================== -->
  <div id="toast-container"></div>

  <!-- ========================================== -->
  <!-- 📚 Firebase & JavaScript                   -->
  <!-- ========================================== -->

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/public.js"></script>

</body>
</html>

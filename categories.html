<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأقسام - أولاد شعلان</title>

  <meta name="description" content="كل الأقسام - أولاد شعلان للمنظفات والورقيات">
  <meta name="theme-color" content="#1a2a4a">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Style -->
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  
  <!-- Favicon -->
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       🎨 ستايل صفحة الأقسام المبسّطة
       ============================================================ */

    /* ===== شريط العنوان ===== */
    .categories-title-bar {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      border-bottom: 4px solid var(--gold);
    }

    .categories-title-bar::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }

    .categories-title-bar .title-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      box-shadow: 0 6px 20px rgba(201, 168, 76, 0.4);
      animation: pulse 2.5s ease-in-out infinite;
    }

    .categories-title-bar .title-content {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .categories-title-bar .title-content h1 {
      font-size: 1.5rem;
      font-weight: 900;
      margin: 0 0 4px;
      line-height: 1.3;
    }

    .categories-title-bar .title-content h1 .gold {
      color: var(--gold);
    }

    .categories-title-bar .title-content p {
      font-size: 0.85rem;
      opacity: 0.85;
      margin: 0;
    }

    .categories-title-bar .title-badge {
      background: rgba(201, 168, 76, 0.15);
      color: var(--gold-light);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid rgba(201, 168, 76, 0.4);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== شبكة الأقسام ===== */
    .categories-full-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    /* كارت القسم - أنيميشن نزول */
    .category-full-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid transparent;
      cursor: pointer;
      text-decoration: none;
      color: var(--gray-800);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(-40px);
      animation: dropIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      position: relative;
      overflow: hidden;
    }

    @keyframes dropIn {
      0% {
        opacity: 0;
        transform: translateY(-40px) scale(0.9);
      }
      60% {
        opacity: 1;
        transform: translateY(4px) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* شريط ذهبي علوي عند التحويم */
    .category-full-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.4s ease;
    }

    .category-full-card:hover::before {
      transform: scaleX(1);
    }

    .category-full-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold);
    }

    /* صورة القسم */
    .category-full-card .category-image-wrap {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--gray-200);
      transition: all 0.3s ease;
      flex-shrink: 0;
      position: relative;
    }

    .category-full-card:hover .category-image-wrap {
      border-color: var(--gold);
      transform: scale(1.1);
      box-shadow: 0 8px 20px rgba(201, 168, 76, 0.3);
    }

    .category-full-card .category-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .category-full-card:hover .category-image-wrap img {
      transform: scale(1.15);
    }

    /* اسم القسم */
    .category-full-card .category-name {
      font-size: 1rem;
      font-weight: 800;
      color: var(--navy);
      margin: 0;
      line-height: 1.4;
      transition: color 0.3s ease;
    }

    .category-full-card:hover .category-name {
      color: var(--gold-dark);
    }

    /* عدد المنتجات */
    .category-full-card .category-count {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      background: var(--gray-100);
      color: var(--gray-600);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .category-full-card:hover .category-count {
      background: var(--gold);
      color: var(--navy);
    }

    .category-full-card .category-count i {
      font-size: 0.7rem;
    }

    /* تأخير الأنيميشن لكل كارت */
    .category-full-card:nth-child(1) { animation-delay: 0.05s; }
    .category-full-card:nth-child(2) { animation-delay: 0.1s; }
    .category-full-card:nth-child(3) { animation-delay: 0.15s; }
    .category-full-card:nth-child(4) { animation-delay: 0.2s; }
    .category-full-card:nth-child(5) { animation-delay: 0.25s; }
    .category-full-card:nth-child(6) { animation-delay: 0.3s; }
    .category-full-card:nth-child(7) { animation-delay: 0.35s; }
    .category-full-card:nth-child(8) { animation-delay: 0.4s; }
    .category-full-card:nth-child(9) { animation-delay: 0.45s; }
    .category-full-card:nth-child(10) { animation-delay: 0.5s; }
    .category-full-card:nth-child(11) { animation-delay: 0.55s; }
    .category-full-card:nth-child(12) { animation-delay: 0.6s; }

    /* ============================================================
       📱 Responsive
       ============================================================ */
    @media (max-width: 768px) and (pointer: coarse) {
      .categories-title-bar {
        padding: 14px 16px;
        gap: 12px;
        margin-bottom: 16px;
      }

      .categories-title-bar .title-icon {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
      }

      .categories-title-bar .title-content h1 {
        font-size: 1.15rem;
      }

      .categories-title-bar .title-content p {
        font-size: 0.75rem;
      }

      .categories-title-bar .title-badge {
        display: none;
      }

      .categories-full-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }

      .category-full-card {
        padding: 12px;
        gap: 8px;
      }

      .category-full-card .category-image-wrap {
        width: 70px;
        height: 70px;
      }

      .category-full-card .category-name {
        font-size: 0.88rem;
      }

      .category-full-card .category-count {
        font-size: 0.7rem;
        padding: 3px 10px;
      }
    }

    @media (max-width: 480px) {
      .categories-full-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .category-full-card .category-image-wrap {
        width: 60px;
        height: 60px;
      }

      .category-full-card .category-name {
        font-size: 0.8rem;
      }

      .categories-title-bar .title-content h1 {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- مكونات الموبايل -->
  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>

  <!-- الهيدر -->
  <div id="header-placeholder"></div>

  <!-- المحتوى -->
  <main class="page-content">
    <div class="container">

      <!-- ============================================================ -->
      <!-- 🏷️ شريط العنوان                                              -->
      <!-- ============================================================ -->
      <div class="categories-title-bar">
        <div class="title-icon">
          <i class="fas fa-th-large"></i>
        </div>
        <div class="title-content">
          <h1>كل <span class="gold">الأقسام</span></h1>
          <p>اكتشف منتجاتنا المتنوعة عبر الأقسام</p>
        </div>
        <div class="title-badge" id="categoriesCountBadge">
          <i class="fas fa-spinner fa-spin"></i>
          جاري التحميل...
        </div>
      </div>

      <!-- ============================================================ -->
      <!-- 📂 شبكة الأقسام                                              -->
      <!-- ============================================================ -->
      <div class="categories-full-grid" id="categoriesFullGrid">
        <div class="loading-spinner" style="grid-column:1/-1;">
          <i class="fas fa-spinner fa-spin"></i>
          جاري تحميل الأقسام...
        </div>
      </div>

    </div>
  </main>

  <!-- التبويبات السفلى -->
  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>

  <!-- الفوتر -->
  <div id="footer-placeholder"></div>

  <!-- السايدبار -->
  <div id="sidebar-placeholder"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- نافذة البحث -->
  <div class="search-modal-overlay" id="searchModalOverlay" onclick="closeSearchModal(event)">
    <div class="search-modal" onclick="event.stopPropagation()">
      <div class="search-modal-header">
        <i class="fas fa-search search-icon"></i>
        <input type="text" 
               id="searchModalInput" 
               placeholder="ابحث عن منتج..."
               autocomplete="off"
               oninput="handleModalSearch(this.value)"
               onkeydown="handleSearchKeydown(event)">
        <button class="search-modal-close" onclick="closeSearchModal()" aria-label="إغلاق">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="search-modal-body" id="searchModalBody">
        <div id="searchInitialContent">
          <div class="search-suggestions-header">
            <i class="fas fa-fire"></i>
            اقتراحات سريعة
          </div>
          <div class="search-suggestions-chips">
            <a href="#" class="search-chip" onclick="quickSearch('منظف')">
              <i class="fas fa-spray-can"></i>
              منظفات
            </a>
            <a href="#" class="search-chip" onclick="quickSearch('ورق')">
              <i class="fas fa-toilet-paper"></i>
              ورقيات
            </a>
            <a href="#" class="search-chip" onclick="quickSearch('صابون')">
              <i class="fas fa-soap"></i>
              صابون
            </a>
          </div>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="search-keyboard-hint">
        <span><kbd>ESC</kbd> للإغلاق</span>
        <span><kbd>Enter</kbd> للبحث</span>
      </div>
    </div>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 categories.html - صفحة الأقسام المبسّطة
    // ============================================================

    let currentUserType = 'retail';

    // ============================================================
    // 🚀 تحميل الأقسام
    // ============================================================

    async function loadCategories() {
      const container = document.getElementById('categoriesFullGrid');
      const countBadge = document.getElementById('categoriesCountBadge');
      if (!container) return;

      try {
        // جلب كل الأقسام
        const snapshot = await db.collection(COLLECTIONS.CATEGORIES)
          .orderBy('name')
          .get();

        if (snapshot.empty) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-folder-open"></i>
              <p>لا توجد أقسام حالياً</p>
            </div>
          `;
          if (countBadge) {
            countBadge.innerHTML = '<i class="fas fa-box"></i> 0 قسم';
          }
          return;
        }

        // جلب عدد المنتجات الحقيقي لكل قسم
        const categoriesWithCount = [];

        for (const doc of snapshot.docs) {
          const cat = doc.data();
          
          // جلب عدد المنتجات المتاحة في هذا القسم
          const productsSnapshot = await db.collection(COLLECTIONS.PRODUCTS)
            .where('available', '==', true)
            .where('categoryId', '==', doc.id)
            .get();

          categoriesWithCount.push({
            id: doc.id,
            name: cat.name || 'قسم',
            imageUrl: cat.imageUrl || '/gomla/assets/images/no-image.png',
            realCount: productsSnapshot.size
          });
        }

        // فلترة الأقسام الفارغة
        const visibleCategories = categoriesWithCount.filter(c => c.realCount > 0);

        if (visibleCategories.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-folder-open"></i>
              <p>لا توجد أقسام بها منتجات حالياً</p>
            </div>
          `;
          if (countBadge) {
            countBadge.innerHTML = '<i class="fas fa-box"></i> 0 قسم';
          }
          return;
        }

        // بناء HTML
        let html = '';

        visibleCategories.forEach(cat => {
          html += `
            <a href="/gomla/category-products.html?id=${cat.id}&type=${currentUserType}" 
               class="category-full-card">
              <div class="category-image-wrap">
                <img src="${cat.imageUrl}"
                     alt="${cat.name}"
                     onerror="this.src='/gomla/assets/images/no-image.png'">
              </div>
              <h3 class="category-name">${cat.name}</h3>
              <span class="category-count">
                <i class="fas fa-box"></i>
                ${cat.realCount} منتج
              </span>
            </a>
          `;
        });

        container.innerHTML = html;

        if (countBadge) {
          countBadge.innerHTML = `<i class="fas fa-th-large"></i> ${visibleCategories.length} قسم`;
        }

      } catch (error) {
        console.error('Error loading categories:', error);
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>حدث خطأ في تحميل الأقسام</p>
            <button class="btn btn-primary" onclick="loadCategories()">
              <i class="fas fa-sync-alt"></i>
              إعادة المحاولة
            </button>
          </div>
        `;
        if (countBadge) {
          countBadge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> خطأ';
        }
      }
    }

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      // تحديد نوع المستخدم
      const user = getCurrentUser();
      if (user && user.data) {
        const role = user.data.role;
        if (role === ROLES.WHOLESALE || role === ROLES.ADMIN || role === ROLES.SUPER || role === ROLES.ADMIN_PLUS) {
          currentUserType = 'wholesale';
        } else {
          currentUserType = 'retail';
        }
      }

      // تحميل الأقسام
      loadCategories();

      console.log('✅ categories.html loaded');
    });

    // تصدير
    window.loadCategories = loadCategories;

  </script>

</body>
</html>

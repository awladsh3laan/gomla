<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول الكاشير - أولاد شعلان</title>

  <meta name="description" content="تسجيل دخول الكاشير - أولاد شعلان">
  <meta name="theme-color" content="#1a2a4a">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       🎨 ستايل صفحة تسجيل دخول الكاشير
       ============================================================ */

    .login-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #2e1065 0%, #4c1d95 40%, #6d28d9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* زخارف خلفية */
    .login-page::before {
      content: '';
      position: absolute;
      top: -20%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      animation: float-slow 12s ease-in-out infinite;
      pointer-events: none;
    }

    .login-page::after {
      content: '';
      position: absolute;
      bottom: -20%;
      left: -10%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: float-slow 14s ease-in-out infinite reverse;
      pointer-events: none;
    }

    @keyframes float-slow {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.15); }
    }

    /* ===== البطاقة ===== */
    .login-card {
      max-width: 480px;
      width: 100%;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      position: relative;
      z-index: 2;
      animation: card-in 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(-30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* شريط بنفسجي علوي */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #6d28d9, #a78bfa, #c4b5fd, #a78bfa, #6d28d9);
      background-size: 200% 100%;
      animation: shimmer-bar 3s linear infinite;
      z-index: 3;
    }

    @keyframes shimmer-bar {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* ===== الرأس ===== */
    .login-header {
      padding: 36px 32px 24px;
      text-align: center;
      background: linear-gradient(135deg, #2e1065 0%, #4c1d95 50%, #6d28d9 100%);
      color: var(--white);
      position: relative;
      overflow: hidden;
    }

    .login-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.25) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }

    .login-header > * {
      position: relative;
      z-index: 1;
    }

    .login-header .header-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      color: var(--white);
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      border: 4px solid rgba(196, 181, 253, 0.6);
      animation: pulse-icon-purple 2.5s ease-in-out infinite;
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.5);
    }

    @keyframes pulse-icon-purple {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 10px 30px rgba(124, 58, 237, 0.5);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 15px 45px rgba(124, 58, 237, 0.7);
      }
    }

    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 6px;
      color: var(--white);
    }

    .login-header h1 .purple {
      color: #c4b5fd;
    }

    .login-header p {
      font-size: 0.9rem;
      opacity: 0.9;
      color: rgba(255, 255, 255, 0.85);
    }

    .login-header .badge-purple {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(167, 139, 250, 0.2);
      color: #c4b5fd;
      padding: 5px 14px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 800;
      margin-top: 10px;
      border: 1px solid rgba(167, 139, 250, 0.4);
      backdrop-filter: blur(10px);
    }

    .login-header .badge-purple i {
      color: #c4b5fd;
    }

    /* ===== الجسم ===== */
    .login-body {
      padding: 28px 32px 24px;
    }

    /* ===== تنبيه ===== */
    .info-alert {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background: linear-gradient(135deg, #f5f3ff, #ede9fe);
      border: 2px solid #c4b5fd;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 0.82rem;
      color: #4c1d95;
      line-height: 1.6;
    }

    .info-alert i {
      color: #7c3aed;
      font-size: 1.1rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .info-alert strong {
      color: #2e1065;
      font-weight: 800;
    }

    /* رسالة الخطأ */
    .login-error {
      display: none;
      background: #fef2f2;
      border-right: 4px solid var(--danger);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #dc2626;
      font-size: 0.88rem;
      font-weight: 600;
      align-items: center;
      gap: 10px;
      animation: shake 0.4s ease;
    }

    .login-error.show {
      display: flex;
    }

    .login-error i {
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* رسالة النجاح */
    .login-success {
      display: none;
      background: #f0fdf4;
      border-right: 4px solid var(--success);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #16a34a;
      font-size: 0.88rem;
      font-weight: 600;
      align-items: center;
      gap: 10px;
    }

    .login-success.show {
      display: flex;
    }

    .login-success i {
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    /* ===== حقول الإدخال ===== */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--gray-700);
      margin-bottom: 6px;
    }

    .form-group label i {
      color: #7c3aed;
      font-size: 0.85rem;
    }

    .form-group .input-wrap {
      position: relative;
    }

    .form-group input {
      width: 100%;
      padding: 13px 44px 13px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.95rem;
      background: var(--gray-50);
      color: var(--gray-800);
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
      background: var(--white);
    }

    .form-group input.error {
      border-color: var(--danger);
      background: #fef2f2;
    }

    .form-group .input-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.3s ease;
    }

    .form-group input:focus + .input-icon {
      color: #7c3aed;
    }

    /* زر إظهار/إخفاء الباسورد */
    .toggle-password {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--gray-400);
      cursor: pointer;
      font-size: 1rem;
      padding: 6px;
      border-radius: 50%;
      transition: all 0.2s ease;
      pointer-events: auto;
    }

    .toggle-password:hover {
      color: #7c3aed;
      background: #f5f3ff;
    }

    /* ===== خيارات ===== */
    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0;
      flex-wrap: wrap;
      gap: 10px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--gray-600);
      font-weight: 600;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #7c3aed;
      cursor: pointer;
    }

    .contact-admin {
      font-size: 0.88rem;
      color: #7c3aed;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .contact-admin:hover {
      color: #4c1d95;
      text-decoration: underline;
    }

    /* ===== زر الدخول ===== */
    .login-btn {
      width: 100%;
      padding: 15px 24px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      color: var(--white);
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease;
    }

    .login-btn:hover::before {
      width: 500px;
      height: 500px;
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(124, 58, 237, 0.6);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .login-btn i,
    .login-btn span {
      position: relative;
      z-index: 1;
    }

    /* ===== الفاصل ===== */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 20px;
      color: var(--gray-400);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }

    /* ===== أزرار بديلة ===== */
    .alt-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .alt-btn {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      border: 2px solid var(--gray-200);
      color: var(--gray-700);
      background: var(--white);
      cursor: pointer;
      font-family: inherit;
    }

    .alt-btn:hover {
      border-color: #7c3aed;
      color: #7c3aed;
      background: #f5f3ff;
      transform: translateY(-2px);
    }

    .alt-btn i {
      font-size: 0.9rem;
    }

    /* ===== الفوتر ===== */
    .login-footer {
      padding: 20px 32px;
      background: var(--gray-50);
      border-top: 1px solid var(--gray-200);
      text-align: center;
      font-size: 0.88rem;
      color: var(--gray-600);
    }

    .login-footer a {
      color: #7c3aed;
      font-weight: 800;
      text-decoration: none;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }

    .login-footer a:hover {
      background: #f5f3ff;
      color: #4c1d95;
    }

    /* ===== الرجوع ===== */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      transition: all 0.2s ease;
      font-weight: 700;
      margin-top: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(167, 139, 250, 0.3);
    }

    .back-link:hover {
      color: #c4b5fd;
      background: rgba(167, 139, 250, 0.15);
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) and (pointer: coarse) {
      .login-page {
        padding: 20px 12px;
      }

      .login-card {
        border-radius: var(--radius-md);
      }

      .login-header {
        padding: 28px 20px 20px;
      }

      .login-header .header-icon {
        width: 72px;
        height: 72px;
        font-size: 1.8rem;
      }

      .login-header h1 {
        font-size: 1.25rem;
      }

      .login-body {
        padding: 22px 20px 18px;
      }

      .form-group input {
        padding: 11px 40px 11px 12px;
        font-size: 0.92rem;
      }

      .login-btn {
        padding: 14px 20px;
        font-size: 1rem;
      }

      .alt-actions {
        grid-template-columns: 1fr;
      }

      .login-footer {
        padding: 16px 20px;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 480px) {
      .login-header h1 {
        font-size: 1.15rem;
      }

      .login-header p {
        font-size: 0.85rem;
      }

      .login-options {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================ -->
  <!-- 🧑‍💻 صفحة تسجيل دخول الكاشير                                 -->
  <!-- ============================================================ -->
  <div class="login-page">
    <div class="container">

      <div class="login-card" id="loginCard">

        <!-- ===== الرأس ===== -->
        <div class="login-header">
          <div class="header-icon">
            <i class="fas fa-cash-register"></i>
          </div>
          <h1>تسجيل دخول <span class="purple">الكاشير</span></h1>
          <p>أدخل بياناتك للوصول لواجهة الكاشير</p>
          <div class="badge-purple">
            <i class="fas fa-user-tie"></i>
            حساب كاشير معتمد
          </div>
        </div>

        <!-- ===== الجسم ===== -->
        <div class="login-body" id="loginBody">

          <!-- تنبيه -->
          <div class="info-alert">
            <i class="fas fa-info-circle"></i>
            <span>
              حساب الكاشير بيتم إنشاؤه بواسطة <strong>الإدارة</strong>. 
              تواصل معنا لو محتاج مساعدة.
            </span>
          </div>

          <!-- رسالة الخطأ -->
          <div class="login-error" id="loginError">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">حدث خطأ</span>
          </div>

          <!-- رسالة النجاح -->
          <div class="login-success" id="loginSuccess">
            <i class="fas fa-check-circle"></i>
            <span id="successText">تم تسجيل الدخول</span>
          </div>

          <!-- النموذج -->
          <form id="loginForm" onsubmit="handleLogin(event)">

            <!-- البريد الإلكتروني -->
            <div class="form-group">
              <label>
                <i class="fas fa-envelope"></i>
                البريد الإلكتروني
              </label>
              <div class="input-wrap">
                <input 
                  type="email" 
                  id="cashierEmail" 
                  placeholder="cashier@example.com"
                  autocomplete="email"
                  autofocus>
                <i class="fas fa-envelope input-icon"></i>
              </div>
            </div>

            <!-- كلمة المرور -->
            <div class="form-group">
              <label>
                <i class="fas fa-lock"></i>
                كلمة المرور
              </label>
              <div class="input-wrap">
                <input 
                  type="password" 
                  id="cashierPassword" 
                  placeholder="••••••••"
                  autocomplete="current-password">
                <i class="fas fa-lock input-icon"></i>
                <button 
                  type="button" 
                  class="toggle-password" 
                  onclick="togglePassword()"
                  tabindex="-1">
                  <i class="fas fa-eye" id="passwordEye"></i>
                </button>
              </div>
            </div>

            <!-- الخيارات -->
            <div class="login-options">
              <label class="remember-me">
                <input type="checkbox" id="rememberMe">
                <span>احفظ كلمة المرور</span>
              </label>
              <a href="https://wa.me/201120282953?text=مرحباً، أحتاج مساعدة في تسجيل الدخول كاشير" 
                 target="_blank"
                 class="contact-admin">
                <i class="fab fa-whatsapp"></i>
                تواصل مع الإدارة
              </a>
            </div>

            <!-- زر الدخول -->
            <button type="submit" class="login-btn" id="loginBtn">
              <i class="fas fa-sign-in-alt"></i>
              <span>دخول الكاشير</span>
            </button>

          </form>

          <!-- فاصل -->
          <div class="divider">أو</div>

          <!-- أزرار بديلة -->
          <div class="alt-actions">
            <a href="/gomla/trader-login.html" class="alt-btn">
              <i class="fas fa-store"></i>
              دخول التجار
            </a>
            <a href="/gomla/login.html" class="alt-btn">
              <i class="fas fa-arrow-right"></i>
              بوابة الدخول
            </a>
          </div>

        </div>

        <!-- ===== الفوتر ===== -->
        <div class="login-footer">
          كاشير جديد؟ 
          <a href="https://wa.me/201120282953?text=مرحباً، أرغب في إنشاء حساب كاشير" 
             target="_blank">
            <i class="fab fa-whatsapp"></i>
            تواصل مع الإدارة
          </a>
        </div>

      </div>

      <!-- زر الرجوع -->
      <div style="text-align:center;position:relative;z-index:2;">
        <a href="/gomla/" class="back-link">
          <i class="fas fa-arrow-right"></i>
          العودة للصفحة الرئيسية
        </a>
      </div>

    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 cashier-login.html - تسجيل دخول الكاشير
    // ============================================================

    let isSubmitting = false;

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      // التحقق من وجود مستخدم مسجل
      const user = getCurrentUser();
      if (user) {
        redirectByRole(user.data.role);
        return;
      }

      // استرجاع البريد المحفوظ
      const savedEmail = localStorage.getItem('saved_cashier_email');
      if (savedEmail) {
        document.getElementById('cashierEmail').value = savedEmail;
        document.getElementById('rememberMe').checked = true;
        setTimeout(() => {
          document.getElementById('cashierPassword').focus();
        }, 300);
      }

      console.log('✅ cashier-login.html loaded');
    });

    // ============================================================
    // 🔐 إظهار/إخفاء كلمة المرور
    // ============================================================

    function togglePassword() {
      const field = document.getElementById('cashierPassword');
      const icon = document.getElementById('passwordEye');

      if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        field.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // ============================================================
    // 📝 تسجيل الدخول
    // ============================================================

    async function handleLogin(event) {
      event.preventDefault();

      if (isSubmitting) return;

      // جلب البيانات
      const email = document.getElementById('cashierEmail').value.trim().toLowerCase();
      const password = document.getElementById('cashierPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      // التحقق
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('يرجى إدخال بريد إلكتروني صحيح');
        document.getElementById('cashierEmail').focus();
        return;
      }

      if (!password || password.length < 6) {
        showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
        document.getElementById('cashierPassword').focus();
        return;
      }

      // بدء الإرسال
      isSubmitting = true;
      const btn = document.getElementById('loginBtn');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>جاري الدخول...</span>';

      hideError();

      try {
        // 1️⃣ تسجيل الدخول عبر Firebase Auth
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const uid = userCredential.user.uid;

        // 2️⃣ البحث عن الكاشير في Firestore
        const cashierDoc = await db.collection(COLLECTIONS.CASHIERS).doc(uid).get();

        if (!cashierDoc.exists) {
          // ممكن يكون أدمن؟ نتحقق
          const adminDoc = await db.collection(COLLECTIONS.ADMINS).doc(uid).get();
          
          if (adminDoc.exists) {
            const adminData = adminDoc.data();
            adminData.id = uid;
            
            // الأدمن عادي، نحوله للوحة التحكم
            localStorage.setItem('admin', JSON.stringify(adminData));
            localStorage.setItem('adminId', uid);
            
            showSuccess(`مرحباً ${adminData.name || 'بك'}! جاري التحويل...`);
            showToast(`✅ مرحباً ${adminData.name}`, 'success');
            
            setTimeout(() => {
              window.location.href = '/gomla/admin/home.html';
            }, 1000);
            return;
          }
          
          throw new Error('هذا الحساب ليس حساب كاشير. تواصل مع الإدارة.');
        }

        const cashierData = cashierDoc.data();
        cashierData.id = uid;

        // 3️⃣ التحقق من الحالة
        if (cashierData.active === false) {
          throw new Error('حسابك موقوف. تواصل مع الإدارة.');
        }

        // 4️⃣ حفظ في localStorage
        localStorage.setItem('cashier', JSON.stringify({
          id: cashierData.id,
          name: cashierData.name,
          email: cashierData.email,
          phone: cashierData.phone || '',
          role: ROLES.CASHIER,
          branchId: cashierData.branchId || '',
          branchName: cashierData.branchName || '',
          avatar: cashierData.avatar || '',
          active: true
        }));

        // 5️⃣ حفظ البريد لو "احفظ" مفعّل
        if (rememberMe) {
          localStorage.setItem('saved_cashier_email', email);
        } else {
          localStorage.removeItem('saved_cashier_email');
        }

        // 6️⃣ تسجيل النشاط
        try {
          await db.collection(COLLECTIONS.ACTIVITY_LOG).add({
            userId: uid,
            userName: cashierData.name || 'unknown',
            userRole: ROLES.CASHIER,
            action: 'تسجيل دخول كاشير',
            details: `البريد: ${email} - الفرع: ${cashierData.branchName || 'غير محدد'}`,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (logError) {
          console.warn('Could not log activity:', logError);
        }

        // 7️⃣ عرض رسالة النجاح
        showSuccess(`مرحباً ${cashierData.name || 'بك'}! جاري التحويل...`);
        showToast(`✅ مرحباً ${cashierData.name}`, 'success');

        // 8️⃣ التوجيه
        setTimeout(() => {
          window.location.href = '/gomla/cashier/home.html';
        }, 1000);

      } catch (error) {
        console.error('Login error:', error);

        let errorMessage = 'حدث خطأ في تسجيل الدخول';

        if (error.code === 'auth/user-not-found') {
          errorMessage = 'لا يوجد حساب بهذا البريد الإلكتروني';
        } else if (error.code === 'auth/wrong-password') {
          errorMessage = 'كلمة المرور غير صحيحة';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'البريد الإلكتروني غير صحيح';
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = 'تم تجاوز عدد المحاولات. حاول لاحقاً';
        } else if (error.code === 'auth/network-request-failed') {
          errorMessage = 'فشل الاتصال بالإنترنت. تأكد من الشبكة';
        } else if (error.code === 'auth/user-disabled') {
          errorMessage = 'هذا الحساب موقوف';
        } else if (error.message) {
          errorMessage = error.message;
        }

        showError(errorMessage);
        btn.disabled = false;
        btn.innerHTML = originalText;
        isSubmitting = false;
      }
    }

    // ============================================================
    // 🎯 التوجيه حسب الدور
    // ============================================================

    function redirectByRole(role) {
      if (role === ROLES.SUPER || role === ROLES.ADMIN_PLUS || role === ROLES.ADMIN) {
        window.location.href = '/gomla/admin/home.html';
        return;
      }

      if (role === ROLES.CASHIER) {
        window.location.href = '/gomla/cashier/home.html';
        return;
      }

      if (role === ROLES.WHOLESALE) {
        window.location.href = '/gomla/store-wholesale.html';
        return;
      }

      if (role === ROLES.RETAIL) {
        window.location.href = '/gomla/customer-home.html';
      }
    }

    // ============================================================
    // 🛠️ دوال العرض
    // ============================================================

    function showError(message) {
      const errorEl = document.getElementById('loginError');
      const errorText = document.getElementById('errorText');
      errorText.textContent = message;
      errorEl.classList.add('show');
      document.getElementById('loginSuccess').classList.remove('show');

      errorEl.style.animation = 'none';
      setTimeout(() => {
        errorEl.style.animation = 'shake 0.4s ease';
      }, 10);
    }

    function hideError() {
      document.getElementById('loginError').classList.remove('show');
    }

    function showSuccess(message) {
      const successEl = document.getElementById('loginSuccess');
      const successText = document.getElementById('successText');
      successText.textContent = message;
      successEl.classList.add('show');
      document.getElementById('loginError').classList.remove('show');
    }

    // ============================================================
    // 🌐 تصدير الدوال
    // ============================================================

    window.togglePassword = togglePassword;
    window.handleLogin = handleLogin;

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سياسة الاستبدال والإرجاع - أولاد شعلان للمنظفات والورقيات</title>
  <meta name="description" content="سياسة الاستبدال والإرجاع - أولاد شعلان للمنظفات والورقيات">
  <meta name="theme-color" content="#1a2a4a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    html, body { overflow-x: hidden !important; max-width: 100vw; }
    .page-content, .page-content .container { overflow-x: hidden; min-width: 0; max-width: 100%; }

    /* Hero - ألوان ذهبية/برتقالية للاستبدال */
    .ex-hero {
      background: linear-gradient(135deg, #7c2d12 0%, #b45309 50%, #d97706 100%);
      border-radius: var(--radius-lg);
      padding: 42px 24px 38px;
      margin-bottom: 20px;
      color: var(--white);
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(124,45,18,.4);
      border-bottom: 4px solid var(--gold);
    }
    .ex-hero::before {
      content: '';
      position: absolute;
      top: -100px; right: -80px;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(201,168,76,.35) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }
    .ex-hero::after {
      content: '';
      position: absolute;
      bottom: -80px; left: -60px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(251,191,36,.25) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 10s ease-in-out infinite reverse;
    }
    .ex-hero-inner { position: relative; z-index: 1; }
    .ex-hero .hero-icon {
      width: 84px; height: 84px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.3rem;
      margin: 0 auto 16px;
      box-shadow: 0 12px 32px rgba(201,168,76,.6);
      border: 3px solid rgba(255,255,255,.25);
      animation: rotatePulse 3s ease-in-out infinite;
    }
    @keyframes rotatePulse {
      0%,100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.05) rotate(-5deg); }
    }
    .ex-hero .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px;
      background: rgba(255,255,255,.15);
      color: #fef3c7;
      border: 1px solid rgba(251,191,36,.5);
      border-radius: var(--radius-full);
      font-size: 0.72rem; font-weight: 800;
      backdrop-filter: blur(10px);
      margin-bottom: 12px;
    }
    .ex-hero .hero-badge i {
      color: #fbbf24;
      animation: iconSpin 4s linear infinite;
    }
    @keyframes iconSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .ex-hero h1 {
      font-size: 1.75rem; font-weight: 900;
      margin-bottom: 8px; color: var(--white);
    }
    .ex-hero h1 .gold-text { color: #fde68a; }
    .ex-hero .hero-sub {
      font-size: 0.95rem; opacity: .95;
      color: rgba(255,255,255,.95);
      max-width: 600px; margin: 0 auto 14px;
      line-height: 1.7;
    }
    .ex-hero .hero-date {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px;
      background: rgba(255,255,255,.12);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      color: #fef3c7;
      font-weight: 700;
      border: 1px solid rgba(251,191,36,.4);
    }
    .ex-hero .hero-date i { color: #fbbf24; }

    /* TOC */
    .toc-card {
      background: linear-gradient(135deg, #fcf9f0, #fef3c7);
      border: 2px solid var(--gold-light);
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .toc-header {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      gap: 10px;
    }
    .toc-header h3 {
      font-size: 1rem; font-weight: 900;
      color: var(--navy); margin: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .toc-header h3 i { color: var(--gold); }
    .toc-header .toc-toggle {
      color: var(--gold-dark);
      transition: var(--transition);
      font-size: 0.9rem;
    }
    .toc-card.open .toc-toggle { transform: rotate(180deg); }
    .toc-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .4s ease;
      padding: 0 18px;
    }
    .toc-card.open .toc-body {
      max-height: 800px;
      padding: 4px 18px 18px;
    }
    .toc-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .toc-link {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: var(--navy);
      text-decoration: none;
      font-weight: 700;
      transition: var(--transition);
      cursor: pointer;
    }
    .toc-link:hover {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--white);
      border-color: var(--gold-dark);
      transform: translateX(-4px);
    }
    .toc-link i { color: var(--gold); transition: var(--transition); }
    .toc-link:hover i { color: var(--white); }
    .toc-num {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--navy); color: var(--gold);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-weight: 900;
      flex-shrink: 0;
    }
    .toc-link:hover .toc-num {
      background: var(--white); color: var(--gold-dark);
    }

    /* Section */
    .policy-section {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      margin-bottom: 14px;
      overflow: hidden;
      scroll-margin-top: 80px;
      animation: fadeInUp .5s ease both;
    }
    .policy-section-header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #7c2d12, #b45309);
      color: var(--white);
      position: relative;
    }
    .policy-section-header::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0; left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold), #fde68a, var(--gold), var(--gold-dark));
      background-size: 200% 100%;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .policy-section-header .sec-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(217,119,6,.5);
    }
    .policy-section-header .sec-info { flex: 1; min-width: 0; }
    .policy-section-header .sec-num {
      font-size: 0.68rem;
      color: #fef3c7;
      font-weight: 800;
      margin-bottom: 2px;
      letter-spacing: .5px;
    }
    .policy-section-header h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--white);
      line-height: 1.4;
    }
    .policy-section-body {
      padding: 18px 20px;
      font-size: 0.92rem;
      color: var(--gray-700);
      line-height: 1.9;
    }
    .policy-section-body p { margin: 0 0 12px; }
    .policy-section-body p:last-child { margin-bottom: 0; }
    .policy-section-body strong { color: var(--gold-dark); font-weight: 800; }

    /* Quote */
    .quote-box {
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      border-right: 5px solid #d97706;
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      margin: 8px 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: #78350f;
      line-height: 1.8;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .quote-box i {
      color: #d97706;
      font-size: 1.2rem;
      flex-shrink: 0;
      margin-top: 3px;
    }

    /* List */
    .policy-list {
      list-style: none;
      padding: 0;
      margin: 8px 0 0;
    }
    .policy-list li {
      display: flex;
      gap: 10px;
      padding: 8px 0;
      font-size: 0.9rem;
      color: var(--gray-700);
      line-height: 1.8;
      align-items: flex-start;
    }
    .policy-list li::before {
      content: '\f058';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      color: #d97706;
      font-size: 0.85rem;
      flex-shrink: 0;
      margin-top: 5px;
    }

    /* Cards */
    .policy-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    .policy-card {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 14px;
      transition: var(--transition);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .policy-card:hover {
      background: #fffbeb;
      border-color: #fbbf24;
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .policy-card .pc-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(217,119,6,.3);
    }
    .policy-card .pc-body { flex: 1; min-width: 0; }
    .policy-card h4 {
      font-size: 0.88rem; font-weight: 800;
      color: var(--navy); margin: 0 0 5px;
    }
    .policy-card p {
      font-size: 0.8rem; color: var(--gray-600);
      line-height: 1.7; margin: 0;
    }

    /* Table */
    .policy-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .policy-table tr {
      border-bottom: 1px solid var(--gray-200);
    }
    .policy-table tr:last-child { border-bottom: none; }
    .policy-table tr:nth-child(even) { background: var(--gray-50); }
    .policy-table td {
      padding: 11px 14px;
      font-size: 0.85rem;
      vertical-align: top;
      color: var(--gray-700);
      line-height: 1.7;
    }
    .policy-table td:first-child {
      font-weight: 800;
      color: var(--navy);
      width: 32%;
      background: rgba(217,119,6,.06);
      white-space: nowrap;
    }

    /* Steps */
    .policy-steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    .policy-step {
      display: flex;
      gap: 14px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      border: 1px solid #fbbf24;
      border-radius: var(--radius-sm);
      position: relative;
      transition: var(--transition);
    }
    .policy-step:hover {
      transform: translateX(-4px);
      box-shadow: var(--shadow-sm);
    }
    .policy-step .step-num {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c2d12, #b45309);
      color: #fde68a;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      flex-shrink: 0;
      border: 3px solid var(--white);
      box-shadow: 0 4px 12px rgba(124,45,18,.3);
    }
    .policy-step .step-body { flex: 1; min-width: 0; }
    .policy-step .step-body h4 {
      font-size: 0.92rem; font-weight: 800;
      color: var(--navy); margin: 0 0 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .policy-step .step-body h4 i {
      color: #d97706; font-size: 0.85rem;
    }
    .policy-step .step-body p {
      font-size: 0.83rem; color: var(--gray-600);
      margin: 0; line-height: 1.7;
    }

    /* Contact */
    .policy-contact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    .policy-contact-btn {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      padding: 16px 12px;
      background: var(--white);
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--navy);
      transition: var(--transition);
      text-align: center;
      font-family: inherit;
      cursor: pointer;
    }
    .policy-contact-btn:hover {
      border-color: var(--gold);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }
    .policy-contact-btn .pcb-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: var(--white);
      font-size: 1.15rem;
    }
    .policy-contact-btn .pcb-title {
      font-size: 0.82rem; font-weight: 800;
      color: var(--navy);
    }
    .policy-contact-btn .pcb-value {
      font-size: 0.72rem; color: var(--gray-500);
      direction: ltr;
    }

    /* FAQ */
    .policy-faq-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .policy-faq-item {
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--white);
      transition: var(--transition);
    }
    .policy-faq-item.open {
      border-color: #fbbf24;
      box-shadow: var(--shadow-sm);
    }
    .policy-faq-q {
      padding: 12px 14px;
      background: var(--gray-50);
      cursor: pointer;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .policy-faq-item.open .policy-faq-q {
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
    }
    .policy-faq-q i.faq-icon {
      color: #d97706;
      flex-shrink: 0;
    }
    .policy-faq-q .faq-title { flex: 1; }
    .policy-faq-q i.faq-toggle {
      color: var(--gray-400);
      font-size: 0.75rem;
      transition: transform 0.3s ease;
    }
    .policy-faq-item.open .policy-faq-q i.faq-toggle {
      transform: rotate(180deg);
      color: #d97706;
    }
    .policy-faq-a {
      display: none;
      padding: 12px 14px;
      border-top: 1px solid var(--gray-200);
      font-size: 0.85rem;
      line-height: 1.8;
      color: var(--gray-700);
    }
    .policy-faq-item.open .policy-faq-a { display: block; }

    /* Loading */
    .pp-loading {
      text-align: center;
      padding: 60px 20px;
    }
    .pp-loading i {
      font-size: 2rem;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .pp-loading p {
      color: var(--gray-500);
      font-size: 0.9rem;
    }

    @media (max-width: 768px) and (pointer: coarse) {
      .ex-hero { padding: 30px 18px 26px; border-radius: var(--radius-md); }
      .ex-hero .hero-icon { width: 68px; height: 68px; font-size: 1.85rem; border-radius: 16px; }
      .ex-hero h1 { font-size: 1.3rem; }
      .ex-hero .hero-sub { font-size: 0.85rem; }

      .toc-grid { grid-template-columns: 1fr; }
      .toc-header h3 { font-size: 0.9rem; }

      .policy-section-header { padding: 13px 16px; }
      .policy-section-header .sec-icon { width: 38px; height: 38px; font-size: 1rem; }
      .policy-section-header h2 { font-size: 0.92rem; }
      .policy-section-body { padding: 14px 16px; font-size: 0.85rem; }

      .policy-cards { grid-template-columns: 1fr; }
      .policy-table td { padding: 10px 12px; font-size: 0.8rem; }
      .policy-table td:first-child { width: 40%; }
      .policy-contact-grid { grid-template-columns: 1fr; }
      .policy-step { padding: 12px 14px; }
      .policy-step .step-num { width: 38px; height: 38px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>
  <div id="header-placeholder"></div>

  <main class="page-content">
    <div class="container">

      <!-- Hero -->
      <section class="ex-hero">
        <div class="ex-hero-inner">
          <div class="hero-icon">
            <i class="fas fa-exchange-alt"></i>
          </div>
          <div class="hero-badge">
            <i class="fas fa-heart"></i>
            رضاك أولويتنا
          </div>
          <h1>
            سياسة <span class="gold-text">الاستبدال والإرجاع</span>
          </h1>
          <p class="hero-sub">
            نوفر لك سياسة استبدال وإرجاع واضحة وعادلة — لأننا نهتم برضاك وسلامة تجربتك معانا.
          </p>
          <div class="hero-date" id="lastUpdatedBadge">
            <i class="fas fa-clock"></i>
            <span id="lastUpdatedText">آخر تحديث: —</span>
          </div>
        </div>
      </section>

      <!-- TOC -->
      <div class="toc-card open" id="tocCard">
        <div class="toc-header" onclick="toggleTOC()">
          <h3>
            <i class="fas fa-list-ul"></i>
            محتويات الصفحة
          </h3>
          <i class="fas fa-chevron-down toc-toggle"></i>
        </div>
        <div class="toc-body">
          <div class="toc-grid" id="tocGrid">
            <div class="pp-loading" style="grid-column:1/-1;padding:20px;">
              <i class="fas fa-spinner fa-spin"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Sections -->
      <div id="sectionsContainer">
        <div class="pp-loading">
          <i class="fas fa-spinner fa-spin"></i>
          <p>جاري تحميل السياسة...</p>
        </div>
      </div>

    </div>
  </main>

  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>
  <div id="footer-placeholder"></div>
  <div id="sidebar-placeholder"></div>
  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 exchange-policy.html
    // ============================================================

    const CURRENT_COLLECTION = 'exchange_sections';
    const CURRENT_META = 'exchange_meta';

    // ============================================================
    // 📌 المحتوى الافتراضي (Fallback)
    // ============================================================

      { order: 3, title: "الحالات المقبولة", icon: "fa-check-circle", bodyType: "cards", active: true,

      { order: 4, title: "الحالات المرفوضة", icon: "fa-ban", bodyType: "list", active: true,

        items: [
          "مر على الشراء أكثر من 3 أيام",
          "المنتج مستخدم أو مفتوح",

          "منتجات العناية الشخصية المفتوحة",

        ] },
      { order: 5, title: "خطوات الاستبدال", icon: "fa-route", bodyType: "steps", active: true,
        body: "للاستبدال، اتبع الخطوات:",
        items: [

          { icon: "fa-camera", title: "ارفع صورة", text: "صورة واضحة للمنتج والمشكلة" },
          { icon: "fa-clipboard-check", title: "نراجع الطلب", text: "نفحص الطلب خلال 24 ساعة" },
          { icon: "fa-truck", title: "نرسل مندوب", text: "لاستلام المنتج من عندك" },
          { icon: "fa-check-circle", title: "الاستبدال", text: "نستبدل أو نرد المبلغ" }
        ] },
      { order: 6, title: "استرداد المبلغ", icon: "fa-money-bill-wave", bodyType: "cards", active: true,
        items: [
          { icon: "fa-money-bill-wave", title: "كاش", text: "استرداد نقدي مباشر عند الاستلام" },
          { icon: "fa-wallet", title: "رصيد", text: "رصيد في حسابك على الموقع" },
          { icon: "fa-university", title: "تحويل بنكي", text: "لحسابك البنكي خلال 3-7 أيام عمل" },
          { icon: "fa-clock", title: "المدة", text: "خلال 3-7 أيام عمل حسب الطريقة" }
        ] },
      { order: 7, title: "منتجات غير قابلة للإرجاع", icon: "fa-times-circle", bodyType: "list", active: true,
        body: "المنتجات التالية غير قابلة للإرجاع لأسباب صحية أو أمنية:",
        items: [
          "المواد الغذائية المفتوحة",
          "منتجات العناية الشخصية المفتوحة",
          "المنتجات بأسعار خاصة أو نهائية",
          "المنتجات المشتراة بخصم كبير",
          "المنتجات المُخصصة (طلبية خاصة)"
        ] },
      { order: 8, title: "رسوم الإرجاع", icon: "fa-coins", bodyType: "table", active: true,
        items: [
          { label: "خطأ من الشركة", value: "الشركة تتحمل كل الرسوم" },
          { label: "خطأ من العميل", value: "العميل يتحمل رسوم التوصيل" },
          { label: "الاستبدال بمنتج آخر", value: "بدون رسوم إضافية" }
        ] },
      { order: 9, title: "تواصل معنا", icon: "fa-headset", bodyType: "contact", active: true,
        body: "للاستبدال أو الاستفسار، كلمنا:",
        items: [
          { icon: "fab fa-whatsapp", title: "واتساب", text: "01068385028", url: "https://wa.me/201068385028", color: "#25D366" },
          { icon: "fas fa-envelope", title: "إيميل", text: "awladsh3laan@gmail.com", url: "mailto:awladsh3laan@gmail.com", color: "#EA4335" },
          { icon: "fas fa-ticket-alt", title: "تذكرة دعم", text: "اضغط هنا", url: "/gomla/support.html", color: "#c9a84c" }
        ] }
    ];

    // ============================================================
    // 🚀 Init
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      loadContent();
      loadMeta();
    });

    // ============================================================
    // 📖 تحميل الأقسام
    // ============================================================
    async function loadContent() {
      try {
        const snap = await db.collection(CURRENT_COLLECTION)
          .where('active', '==', true)
          .orderBy('order', 'asc')
          .get();

        let sections = [];
        snap.forEach(d => sections.push({ id: d.id, ...d.data() }));

        if (!sections.length) {
          console.info('ℹ️ الكولكشن فاضي - استخدام المحتوى الافتراضي');
          sections = FALLBACK_SECTIONS.map((s, i) => ({ id: 'fallback-' + i, ...s }));
        }

        renderSections(sections);
        renderTOC(sections);

      } catch (err) {
        console.warn('loadContent error:', err);
        const sections = FALLBACK_SECTIONS.map((s, i) => ({ id: 'fallback-' + i, ...s }));
        renderSections(sections);
        renderTOC(sections);
      }
    }

    // ============================================================
    // 🎨 عرض الأقسام
    // ============================================================
    function renderSections(sections) {
      const container = document.getElementById('sectionsContainer');
      if (!container) return;

      container.innerHTML = sections.map((s, idx) => {
        const anchorId = 'section-' + (idx + 1);
        return `
          <section class="policy-section" id="${anchorId}" style="animation-delay:${idx * 0.05}s;">
            <div class="policy-section-header">
              <div class="sec-icon">
                <i class="fas ${s.icon || 'fa-file-alt'}"></i>
              </div>
              <div class="sec-info">
                <div class="sec-num">القسم ${idx + 1}</div>
                <h2>${escapeHtml(s.title)}</h2>
              </div>
            </div>
            <div class="policy-section-body">
              ${renderBody(s)}
            </div>
          </section>
        `;
      }).join('');
    }

    function renderBody(s) {
      const type = s.bodyType || 'text';
      const body = s.body || '';
      const items = s.items || [];

      switch (type) {
        case 'text':
          return `<p>${body}</p>`;

        case 'quote':
          return `
            <div class="quote-box">
              <i class="fas fa-quote-right"></i>
              <div>${body}</div>
            </div>
          `;

        case 'list':
          return `
            ${body ? `<p>${body}</p>` : ''}
            <ul class="policy-list">
              ${items.map(it => `<li>${escapeHtml(typeof it === 'string' ? it : (it.text || ''))}</li>`).join('')}
            </ul>
          `;

        case 'cards':
          return `
            ${body ? `<p>${body}</p>` : ''}
            <div class="policy-cards">
              ${items.map(it => `
                <div class="policy-card">
                  <div class="pc-icon"><i class="fas ${it.icon || 'fa-info'}"></i></div>
                  <div class="pc-body">
                    <h4>${escapeHtml(it.title || '')}</h4>
                    <p>${escapeHtml(it.text || '')}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          `;

        case 'table':
          return `
            ${body ? `<p>${body}</p>` : ''}
            <table class="policy-table">
              <tbody>
                ${items.map(it => `
                  <tr>
                    <td>${escapeHtml(it.label || '')}</td>
                    <td>${escapeHtml(it.value || '')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;

        case 'steps':
          return `
            ${body ? `<p>${body}</p>` : ''}
            <div class="policy-steps">
              ${items.map((it, i) => `
                <div class="policy-step">
                  <div class="step-num">${i + 1}</div>
                  <div class="step-body">
                    <h4>
                      ${it.icon ? `<i class="fas ${it.icon}"></i>` : ''}
                      ${escapeHtml(it.title || '')}
                    </h4>
                    ${it.text ? `<p>${escapeHtml(it.text)}</p>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          `;

        case 'contact':
          return `
            ${body ? `<p>${body}</p>` : ''}
            <div class="policy-contact-grid">
              ${items.map(it => {
                const icon = it.icon || 'fas fa-link';
                const color = it.color || 'var(--navy)';
                const url = it.url || '#';
                return `
                  <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="policy-contact-btn">
                    <div class="pcb-icon" style="background:${color};">
                      <i class="${icon}"></i>
                    </div>
                    <div class="pcb-title">${escapeHtml(it.title || '')}</div>
                    <div class="pcb-value">${escapeHtml(it.text || '')}</div>
                  </a>
                `;
              }).join('')}
            </div>
          `;

        case 'faq':
          return `
            ${body ? `<p>${body}</p>` : ''}
            <div class="policy-faq-list">
              ${items.map((it, i) => `
                <div class="policy-faq-item" id="faq-${i}">
                  <div class="policy-faq-q" onclick="toggleFaq(${i})">
                    <i class="fas fa-question-circle faq-icon"></i>
                    <span class="faq-title">${escapeHtml(it.title || '')}</span>
                    <i class="fas fa-chevron-down faq-toggle"></i>
                  </div>
                  <div class="policy-faq-a">
                    ${escapeHtml(it.text || '')}
                  </div>
                </div>
              `).join('')}
            </div>
          `;

        default:
          return `<p>${body || '—'}</p>`;
      }
    }

    function toggleFaq(idx) {
      const item = document.getElementById('faq-' + idx);
      if (!item) return;
      item.classList.toggle('open');
    }

    // ============================================================
    // 📑 TOC
    // ============================================================
    function renderTOC(sections) {
      const grid = document.getElementById('tocGrid');
      if (!grid) return;

      if (!sections.length) {
        grid.innerHTML = '<div style="text-align:center;color:var(--gray-400);padding:14px;grid-column:1/-1;">لا يوجد محتوى</div>';
        return;
      }

      grid.innerHTML = sections.map((s, i) => `
        <a class="toc-link" onclick="scrollToSection('section-${i + 1}')">
          <span class="toc-num">${i + 1}</span>
          <i class="fas ${s.icon || 'fa-file-alt'}"></i>
          <span>${escapeHtml(s.title)}</span>
        </a>
      `).join('');
    }

    function scrollToSection(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (window.innerWidth <= 768) {
        document.getElementById('tocCard').classList.remove('open');
      }
    }

    function toggleTOC() {
      const card = document.getElementById('tocCard');
      if (card) card.classList.toggle('open');
    }

    // ============================================================
    // 📅 آخر تحديث
    // ============================================================
    async function loadMeta() {
      const el = document.getElementById('lastUpdatedText');
      if (!el) return;
      try {
        const doc = await db.collection('site_content').doc(CURRENT_META).get();
        if (doc.exists && doc.data().lastUpdated) {
          const d = doc.data().lastUpdated.toDate ? doc.data().lastUpdated.toDate() : new Date(doc.data().lastUpdated);
          el.textContent = 'آخر تحديث: ' + d.toLocaleDateString('ar-EG', {
            year: 'numeric', month: 'long', day: 'numeric'
          });
          return;
        }
        el.textContent = 'آخر تحديث: —';
      } catch (e) {
        console.warn('loadMeta error:', e);
        el.textContent = 'آخر تحديث: —';
      }
    }

    // ============================================================
    // 🛠️ Helpers
    // ============================================================
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    window.toggleTOC = toggleTOC;
    window.scrollToSection = scrollToSection;
    window.toggleFaq = toggleFaq;
  </script>

</body>

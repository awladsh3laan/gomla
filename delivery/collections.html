<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحصيلاتي - الموصل | أولاد شعلان</title>
  <meta name="theme-color" content="#047857">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       💰 تحصيلاتي - الموصل v1.0
       ============================================================ */
    :root {
      --del-green-1: #064e3b;
      --del-green-2: #047857;
      --del-green-3: #059669;
      --del-green-light: #10b981;
      --del-green-bg: #ecfdf5;
    }

    html, body { overflow-x: hidden !important; max-width: 100vw; }
    .page-content, .page-content .container {
      overflow-x: hidden; min-width: 0; max-width: 100%;
    }

    /* Header */
    .col-header {
      background: linear-gradient(135deg, var(--del-green-1), var(--del-green-2), var(--del-green-3));
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      margin-bottom: 14px;
      color: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(6,78,59,.35);
      border-bottom: 4px solid var(--del-green-light);
    }
    .col-header::before {
      content: '';
      position: absolute;
      top: -50%; right: -15%;
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(16,185,129,.35), transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }
    .col-header-content {
      position: relative; z-index: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .col-header-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--del-green-light), #34d399);
      color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(16,185,129,.5);
    }
    .col-header-text { flex: 1; min-width: 180px; }
    .col-header-text h1 {
      font-size: 1.2rem; font-weight: 900;
      margin: 0 0 3px; color: var(--white);
      display: flex; align-items: center; gap: 8px;
    }
    .col-header-text h1 i { color: #a7f3d0; }
    .col-header-text p {
      font-size: 0.78rem; margin: 0;
      color: rgba(255,255,255,.85);
    }
    .col-header-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,.15);
      color: #d1fae5;
      border: 1px solid rgba(16,185,129,.5);
      border-radius: var(--radius-full);
      font-size: 0.72rem; font-weight: 800;
    }
    .col-header-badge i { color: #34d399; }

    /* Big Cash Card */
    .cash-card {
      background: linear-gradient(135deg, #065f46, #059669);
      border-radius: var(--radius-md);
      padding: 22px 24px;
      margin-bottom: 14px;
      color: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(5,150,105,.4);
      border: 2px solid rgba(16,185,129,.4);
    }
    .cash-card::before {
      content: '';
      position: absolute;
      top: -50%; right: -20%;
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(255,255,255,.15), transparent 70%);
      border-radius: 50%;
      animation: float 10s ease-in-out infinite;
    }
    .cash-card::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -40px;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(255,255,255,.1), transparent 70%);
      border-radius: 50%;
      animation: float 12s ease-in-out infinite reverse;
    }
    .cash-card-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .cash-card-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      border: 3px solid rgba(255,255,255,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      color: #a7f3d0;
      flex-shrink: 0;
      animation: cashPulse 2.5s ease-in-out infinite;
    }
    @keyframes cashPulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .cash-card-info { flex: 1; min-width: 200px; }
    .cash-card-info .label {
      font-size: 0.82rem;
      color: #a7f3d0;
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cash-card-info .amount {
      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1;
      direction: ltr;
      color: var(--white);
      text-shadow: 0 2px 12px rgba(0,0,0,.2);
      margin-bottom: 8px;
    }
    .cash-card-info .amount small {
      font-size: 1rem;
      font-weight: 700;
      color: #d1fae5;
    }
    .cash-card-info .sublabel {
      font-size: 0.75rem;
      color: rgba(255,255,255,.85);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .cash-card-info .sublabel i { color: #a7f3d0; font-size: 0.7rem; }

    /* Stats Grid */
    .col-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .col-stat-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      text-align: center;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .col-stat-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 4px; height: 100%;
      background: var(--del-green-3);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.4s ease;
    }
    .col-stat-card:hover::before { transform: scaleY(1); }
    .col-stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--del-green-light);
    }
    .col-stat-card .stat-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      margin: 0 auto 8px;
    }
    .stat-icon.green { background: rgba(16,185,129,.15); color: var(--del-green-3); }
    .stat-icon.gold { background: rgba(201,168,76,.15); color: var(--gold-dark); }
    .stat-icon.blue { background: rgba(59,130,246,.12); color: #2563eb; }
    .col-stat-card .stat-number {
      font-size: 1.15rem; font-weight: 900;
      color: var(--navy); line-height: 1.2;
      margin-bottom: 2px;
    }
    .col-stat-card .stat-number.gold { color: var(--gold-dark); }
    .col-stat-card .stat-number.blue { color: #2563eb; }
    .col-stat-card .stat-label {
      font-size: 0.68rem; color: var(--gray-500);
      font-weight: 700;
    }

    /* Info Box */
    .col-info-box {
      background: linear-gradient(135deg, #fef9e7, #fcf9f0);
      border: 2px solid var(--gold-light);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .col-info-box .icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(201,168,76,.4);
    }
    .col-info-box .content {
      flex: 1;
      min-width: 0;
      font-size: 0.8rem;
      color: #78350f;
      line-height: 1.7;
    }
    .col-info-box .content strong {
      color: var(--gold-dark);
      font-weight: 900;
    }
    .col-info-box .content .breakdown {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .col-info-box .content .breakdown span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: rgba(255,255,255,.7);
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 800;
      border: 1px solid var(--gold-light);
    }

    /* Tabs */
    .col-tabs-wrap {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 8px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow: hidden;
      min-width: 0;
    }
    .col-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      min-width: 0;
      max-width: 100%;
    }
    .col-tabs::-webkit-scrollbar { height: 4px; }
    .col-tabs::-webkit-scrollbar-thumb {
      background: var(--del-green-3);
      border-radius: 10px;
    }
    .col-tab {
      flex-shrink: 0;
      padding: 10px 16px;
      border: 2px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
      border-radius: var(--radius-full);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .col-tab:hover {
      border-color: var(--del-green-light);
      background: var(--del-green-bg);
    }
    .col-tab.active {
      background: linear-gradient(135deg, var(--del-green-1), var(--del-green-3));
      color: var(--white);
      border-color: var(--del-green-2);
      box-shadow: 0 6px 16px rgba(5,150,105,.3);
    }
    .col-tab.active i { color: #a7f3d0; }
    .col-tab i { font-size: 0.85rem; }
    .col-tab .tab-count {
      background: rgba(0,0,0,.08);
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 0.68rem;
      font-weight: 900;
      min-width: 20px;
      text-align: center;
    }
    .col-tab.active .tab-count {
      background: rgba(255,255,255,.25);
      color: var(--white);
    }

    /* Toolbar */
    .col-toolbar {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .col-search {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    .col-search input {
      width: 100%;
      padding: 10px 40px 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.85rem;
      background: var(--gray-50);
      outline: none;
      transition: var(--transition);
    }
    .col-search input:focus {
      border-color: var(--del-green-3);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(16,185,129,.15);
    }
    .col-search .si {
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      pointer-events: none;
    }
    .col-toolbar select {
      padding: 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.82rem;
      background: var(--gray-50);
      outline: none;
      cursor: pointer;
      transition: var(--transition);
    }
    .col-toolbar select:focus {
      border-color: var(--del-green-3);
      background: var(--white);
    }

    /* Collections List */
    .col-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .col-card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .col-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 5px; height: 100%;
    }
    .col-card.type-collect::before {
      background: linear-gradient(180deg, var(--del-green-3), var(--del-green-2));
    }
    .col-card.type-settle::before {
      background: linear-gradient(180deg, #3b82f6, #2563eb);
    }
    .col-card:hover {
      border-color: var(--del-green-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .col-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .col-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 900;
      white-space: nowrap;
    }
    .col-type-badge.collect {
      background: linear-gradient(135deg, var(--del-green-3), var(--del-green-2));
      color: var(--white);
      box-shadow: 0 3px 10px rgba(5,150,105,.3);
    }
    .col-type-badge.settle {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: var(--white);
      box-shadow: 0 3px 10px rgba(59,130,246,.3);
    }
    .col-type-badge i { font-size: 0.75rem; }

    .col-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 0.68rem;
      font-weight: 800;
    }
    .col-status-pill.confirmed {
      background: rgba(34,197,94,.12);
      color: #16a34a;
    }
    .col-status-pill.pending {
      background: rgba(245,158,11,.12);
      color: #d97706;
    }

    .col-card-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .col-card-amount {
      font-size: 1.6rem;
      font-weight: 900;
      direction: ltr;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .col-card-amount.collect { color: var(--del-green-2); }
    .col-card-amount.settle { color: #2563eb; }
    .col-card-amount small {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gray-500);
    }

    .col-card-info { text-align: left; min-width: 0; }
    .col-order-num {
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      font-weight: 900;
      color: var(--navy);
      direction: ltr;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
      justify-content: flex-end;
    }
    .col-order-num i {
      color: var(--del-green-3);
      font-size: 0.7rem;
    }

    .col-card-footer {
      padding-top: 10px;
      border-top: 1px dashed var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .col-card-date {
      font-size: 0.72rem;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .col-card-date i { color: var(--del-green-3); font-size: 0.65rem; }

    .col-method-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      background: var(--gray-100);
      border-radius: var(--radius-full);
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--gray-600);
    }
    .col-method-pill i { font-size: 0.65rem; color: var(--del-green-3); }

    .col-card-notes {
      margin-top: 8px;
      padding: 8px 12px;
      background: var(--gray-50);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      color: var(--gray-600);
      line-height: 1.6;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .col-card-notes i {
      color: var(--gray-400);
      font-size: 0.8rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Empty */
    .col-empty {
      text-align: center;
      padding: 60px 20px;
      background: var(--white);
      border-radius: var(--radius-md);
      border: 2px dashed var(--gray-300);
    }
    .col-empty .empty-icon {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: var(--del-green-bg);
      color: var(--del-green-3);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem;
      margin: 0 auto 16px;
    }
    .col-empty h3 {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .col-empty p {
      font-size: 0.85rem;
      color: var(--gray-500);
      margin: 0;
    }

    /* Loading */
    .col-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-400);
    }
    .col-loading i {
      font-size: 2.2rem;
      color: var(--del-green-3);
      display: block;
      margin-bottom: 10px;
    }

    /* Responsive */
    @media (max-width: 768px) and (pointer: coarse) {
      .col-header { padding: 16px 16px; border-radius: var(--radius-md); }
      .col-header-icon { width: 46px; height: 46px; font-size: 1.2rem; }
      .col-header-text h1 { font-size: 1rem; }

      .cash-card { padding: 18px 16px; }
      .cash-card-icon { width: 54px; height: 54px; font-size: 1.5rem; }
      .cash-card-info .amount { font-size: 1.9rem; }
      .cash-card-info .label { font-size: 0.75rem; }

      .col-stats { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .col-stat-card { padding: 10px 8px; }
      .col-stat-card .stat-icon { width: 34px; height: 34px; font-size: 0.88rem; }
      .col-stat-card .stat-number { font-size: 0.95rem; }
      .col-stat-card .stat-label { font-size: 0.62rem; }

      .col-info-box { padding: 12px 14px; }
      .col-info-box .icon { width: 36px; height: 36px; font-size: 0.9rem; }

      .col-tab { padding: 8px 12px; font-size: 0.75rem; }
      .col-tab i { font-size: 0.78rem; }

      .col-toolbar { padding: 10px; }
      .col-search { min-width: 100%; }

      .col-card { padding: 12px 14px; }
      .col-card-amount { font-size: 1.4rem; }
      .col-order-num { font-size: 0.72rem; }
      .col-card-info { width: 100%; text-align: right; }
      .col-order-num { justify-content: flex-start; }
    }
  </style>
</head>
<body>

  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>
  <div id="header-placeholder"></div>

  <main class="page-content">
    <div class="container">

      <!-- Header -->
      <div class="col-header">
        <div class="col-header-content">
          <div class="col-header-icon">
            <i class="fas fa-money-bill-wave"></i>
          </div>
          <div class="col-header-text">
            <h1><i class="fas fa-coins"></i> تحصيلاتي</h1>
            <p>كشف حساب تفصيلي لكل تحصيلاتك وتصفياتك</p>
          </div>
          <span class="col-header-badge">
            <i class="fas fa-circle"></i>
            <span id="collectionsCount">0</span> حركة
          </span>
        </div>
      </div>

      <!-- Big Cash Card -->
      <div class="cash-card">
        <div class="cash-card-content">
          <div class="cash-card-icon">
            <i class="fas fa-wallet"></i>
          </div>
          <div class="cash-card-info">
            <div class="label">
              <i class="fas fa-hand-holding-usd"></i>
              الكاش الحالي معك
            </div>
            <div class="amount" id="currentCash">0 <small>ج.م</small></div>
            <div class="sublabel">
              <i class="fas fa-info-circle"></i>
              يشمل: فلوس المنتجات + فلوس الشحن
            </div>
          </div>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="col-stats">
        <div class="col-stat-card">
          <div class="stat-icon green"><i class="fas fa-coins"></i></div>
          <div class="stat-number" id="statTotalCollected">0</div>
          <div class="stat-label">إجمالي التحصيلات</div>
        </div>
        <div class="col-stat-card">
          <div class="stat-icon blue"><i class="fas fa-handshake"></i></div>
          <div class="stat-number blue" id="statTotalSettled">0</div>
          <div class="stat-label">إجمالي التصفيات</div>
        </div>
        <div class="col-stat-card">
          <div class="stat-icon gold"><i class="fas fa-truck"></i></div>
          <div class="stat-number gold" id="statTotalDelivered">0</div>
          <div class="stat-label">عدد التسليمات</div>
        </div>
      </div>

      <!-- Info Box -->
      <div class="col-info-box">
        <div class="icon"><i class="fas fa-info-circle"></i></div>
        <div class="content">
          <strong>تقسيم الكاش:</strong>
          <div class="breakdown">
            <span><i class="fas fa-box"></i> فلوس المنتجات → تُسلَّم للأدمن</span>
            <span><i class="fas fa-truck"></i> فلوس الشحن → من حقك</span>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="col-tabs-wrap">
        <div class="col-tabs" id="colTabs">
          <button class="col-tab active" data-filter="all" onclick="setFilter('all')">
            <i class="fas fa-list"></i>
            <span>الكل</span>
            <span class="tab-count" id="tabAll">0</span>
          </button>
          <button class="col-tab" data-filter="collect" onclick="setFilter('collect')">
            <i class="fas fa-hand-holding-usd"></i>
            <span>تحصيلات</span>
            <span class="tab-count" id="tabCollect">0</span>
          </button>
          <button class="col-tab" data-filter="settle" onclick="setFilter('settle')">
            <i class="fas fa-handshake"></i>
            <span>تصفيات</span>
            <span class="tab-count" id="tabSettle">0</span>
          </button>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="col-toolbar">
        <div class="col-search">
          <input type="text" id="searchInput" placeholder="ابحث برقم الأوردر أو الملاحظات..." oninput="handleSearch(this.value)">
          <i class="fas fa-search si"></i>
        </div>
        <select id="dateFilter" onchange="applyFilters()">
          <option value="all">كل التواريخ</option>
          <option value="today">اليوم</option>
          <option value="week">آخر 7 أيام</option>
          <option value="month">آخر 30 يوم</option>
        </select>
      </div>

      <!-- List -->
      <div class="col-list" id="collectionsList">
        <div class="col-loading">
          <i class="fas fa-spinner fa-spin"></i>
          <p>جاري تحميل التحصيلات...</p>
        </div>
      </div>

    </div>
  </main>

  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>
  <div id="footer-placeholder"></div>
  <div id="sidebar-placeholder"></div>
  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 delivery/collections.html — تحصيلاتي
    // ============================================================

    let _agent = null;
    let _agentId = null;
    let _allCollections = [];
    let _filtered = [];
    let _currentFilter = 'all';
    let _searchTerm = '';
    let _unsub = null;

    // ============================================================
    // 🚀 Init
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
      // حماية
      if (typeof protectDeliveryPage === 'function') {
        const ok = protectDeliveryPage();
        if (ok === false) return;
      }

      const user = getCurrentUser();
      if (!user || user.type !== 'delivery' || !user.data) {
        window.location.href = '/gomla/delivery-login.html';
        return;
      }

      _agent = user.data;
      _agentId = _agent.uid || _agent.id;

      if (!_agentId) {
        showToast('خطأ في بيانات الموصل', 'error');
        return;
      }

      // عرض الكاش الحالي من localStorage
      renderCurrentCash();

      loadCollections();
    });

    // ============================================================
    // 💰 عرض الكاش الحالي
    // ============================================================
    function renderCurrentCash() {
      const el = document.getElementById('currentCash');
      if (!el) return;
      const cash = _agent.currentCashOnHand || 0;
      el.innerHTML = `${cash.toLocaleString('en-US', { maximumFractionDigits: 0 })} <small>ج.م</small>`;

      const deliveredEl = document.getElementById('statTotalDelivered');
      if (deliveredEl) deliveredEl.textContent = _agent.totalDelivered || 0;
    }

    // ============================================================
    // 📥 تحميل التحصيلات (Realtime)
    // ============================================================
    function loadCollections() {
      if (_unsub) _unsub();

      _unsub = db.collection('delivery_collections')
        .where('deliveryAgentId', '==', _agentId)
        .limit(200)
        .onSnapshot(snap => {
          _allCollections = [];
          snap.forEach(d => {
            _allCollections.push({ id: d.id, ...d.data() });
          });

          // ترتيب محلي (الأحدث أولاً)
          _allCollections.sort((a, b) => {
            const ta = a.createdAt?.toMillis?.() || 0;
            const tb = b.createdAt?.toMillis?.() || 0;
            return tb - ta;
          });

          updateStats();
          applyFilters();

        }, err => {
          console.error('loadCollections error:', err);
          const list = document.getElementById('collectionsList');
          if (list) {
            list.innerHTML = `
              <div class="col-empty">
                <div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <h3>فشل التحميل</h3>
                <p>${err.code === 'permission-denied' ? 'ليس لديك صلاحية' : 'حدث خطأ في الاتصال'}</p>
              </div>
            `;
          }
        });
    }

    // ============================================================
    // 📊 الإحصائيات
    // ============================================================
    function updateStats() {
      let totalCollected = 0;
      let totalSettled = 0;
      let collectCount = 0;
      let settleCount = 0;

      _allCollections.forEach(c => {
        const amount = c.amount || 0;
        if (c.type === 'settle') {
          totalSettled += amount;
          settleCount++;
        } else {
          // الافتراضي 'collect'
          totalCollected += amount;
          collectCount++;
        }
      });

      // تحديث الكروت
      setText('statTotalCollected', totalCollected.toLocaleString('en-US', { maximumFractionDigits: 0 }));
      setText('statTotalSettled', totalSettled.toLocaleString('en-US', { maximumFractionDigits: 0 }));
      setText('statTotalDelivered', _agent.totalDelivered || collectCount);

      // التبويبات
      setText('tabAll', _allCollections.length);
      setText('tabCollect', collectCount);
      setText('tabSettle', settleCount);
      setText('collectionsCount', _allCollections.length);

      // الكاش الحالي (نستخدم اللي في الـ agent لأنه الأدق)
      const currentCashEl = document.getElementById('currentCash');
      if (currentCashEl) {
        const cash = _agent.currentCashOnHand || (totalCollected - totalSettled);
        currentCashEl.innerHTML = `${cash.toLocaleString('en-US', { maximumFractionDigits: 0 })} <small>ج.م</small>`;
      }
    }

    function setText(id, val) {
      const el = document.getElementById(id);
      if (el) el.textContent = val;
    }

    // ============================================================
    // 🎯 الفلترة
    // ============================================================
    function setFilter(filter) {
      _currentFilter = filter;
      updateActiveTab();
      applyFilters();
    }

    function updateActiveTab() {
      document.querySelectorAll('.col-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.filter === _currentFilter);
      });
    }

    function handleSearch(value) {
      _searchTerm = value.trim().toLowerCase();
      applyFilters();
    }

    function applyFilters() {
      const dateFilter = document.getElementById('dateFilter')?.value || 'all';

      _filtered = _allCollections.filter(c => {
        // فلتر النوع
        if (_currentFilter === 'collect' && c.type === 'settle') return false;
        if (_currentFilter === 'settle' && c.type !== 'settle') return false;

        // فلتر التاريخ
        if (dateFilter !== 'all') {
          const created = c.createdAt?.toDate?.() || new Date(c.createdAt);
          if (!created) return false;

          const now = new Date();
          let fromDate;
          if (dateFilter === 'today') {
            fromDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          } else if (dateFilter === 'week') {
            fromDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          } else if (dateFilter === 'month') {
            fromDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
          }
          if (fromDate && created < fromDate) return false;
        }

        // البحث
        if (_searchTerm) {
          const orderNum = (c.orderNumber || '').toLowerCase();
          const notes = (c.notes || '').toLowerCase();
          const orderId = (c.orderId || '').toLowerCase();
          if (!orderNum.includes(_searchTerm) &&
              !notes.includes(_searchTerm) &&
              !orderId.includes(_searchTerm)) {
            return false;
          }
        }

        return true;
      });

      renderList();
    }

    // ============================================================
    // 🎨 عرض القائمة
    // ============================================================
    function renderList() {
      const list = document.getElementById('collectionsList');
      if (!list) return;

      if (!_filtered.length) {
        const msg = _searchTerm
          ? `لا نتائج مطابقة لـ "${escapeHtml(_searchTerm)}"`
          : (_allCollections.length ? 'لا حركات في هذا التصنيف' : 'مفيش تحصيلات لسه');

        list.innerHTML = `
          <div class="col-empty">
            <div class="empty-icon"><i class="fas fa-coins"></i></div>
            <h3>${_searchTerm ? 'لا نتائج' : 'مفيش تحصيلات'}</h3>
            <p>${msg}</p>
          </div>
        `;
        return;
      }

      list.innerHTML = _filtered.map(c => renderCard(c)).join('');
    }

    function renderCard(c) {
      const isSettle = c.type === 'settle';
      const typeClass = isSettle ? 'settle' : 'collect';
      const typeLabel = isSettle ? 'تصفية مع الأدمن' : 'تحصيل من عميل';
      const typeIcon = isSettle ? 'fa-handshake' : 'fa-hand-holding-usd';
      const amount = (c.amount || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });

      // طريقة الدفع
      const methodLabels = {
        cash: 'كاش',
        instapay: 'إنستا باي',
        wallet: 'محفظة إلكترونية',
        transfer: 'تحويل بنكي'
      };
      const methodLabel = methodLabels[c.method] || 'كاش';
      const methodIcon = c.method === 'instapay' ? 'fa-university' :
                         c.method === 'wallet' ? 'fa-mobile-alt' :
                         c.method === 'transfer' ? 'fa-exchange-alt' :
                         'fa-money-bill-wave';

      // الحالة
      const statusCls = c.status === 'confirmed' ? 'confirmed' : 'pending';
      const statusLabel = c.status === 'confirmed' ? 'مؤكد' : 'معلّق';
      const statusIcon = c.status === 'confirmed' ? 'fa-check-circle' : 'fa-clock';

      // التاريخ
      const dateStr = formatDateTime(c.createdAt);

      // الرقم أو الملاحظة
      const orderNumHtml = c.orderNumber ? `
        <div class="col-order-num">
          <i class="fas fa-hashtag"></i>
          ${escapeHtml(c.orderNumber.replace('#', ''))}
        </div>
      ` : '';

      // الملاحظات
      const notesHtml = c.notes ? `
        <div class="col-card-notes">
          <i class="fas fa-comment-alt"></i>
          <div>${escapeHtml(c.notes)}</div>
        </div>
      ` : '';

      return `
        <div class="col-card type-${typeClass}">
          <div class="col-card-header">
            <span class="col-type-badge ${typeClass}">
              <i class="fas ${typeIcon}"></i>
              ${typeLabel}
            </span>
            <span class="col-status-pill ${statusCls}">
              <i class="fas ${statusIcon}"></i>
              ${statusLabel}
            </span>
          </div>

          <div class="col-card-body">
            <div class="col-card-amount ${typeClass}">
              ${isSettle ? '-' : '+'} ${amount} <small>ج.م</small>
            </div>
            <div class="col-card-info">
              ${orderNumHtml}
            </div>
          </div>

          <div class="col-card-footer">
            <div class="col-card-date">
              <i class="fas fa-clock"></i>
              ${dateStr}
            </div>
            <span class="col-method-pill">
              <i class="fas ${methodIcon}"></i>
              ${methodLabel}
            </span>
          </div>

          ${notesHtml}
        </div>
      `;
    }

    // ============================================================
    // 🛠️ Helpers
    // ============================================================
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function formatDateTime(ts) {
      if (!ts) return '—';
      try {
        const date = ts.toDate ? ts.toDate() : new Date(ts);
        return date.toLocaleDateString('ar-EG', {
          year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      } catch {
        return '—';
      }
    }

    // تصدير
    window.setFilter = setFilter;
    window.handleSearch = handleSearch;
    window.applyFilters = applyFilters;
    window.loadCollections = loadCollections;
  </script>

</body>
</html>

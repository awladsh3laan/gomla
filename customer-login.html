<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول العملاء - أولاد شعلان</title>

  <meta name="description" content="تسجيل دخول العملاء - أولاد شعلان للمنظفات والورقيات">
  <meta name="theme-color" content="#1a2a4a">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       🎨 ستايل صفحة تسجيل دخول العملاء
       ============================================================ */

    .login-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f4f8 0%, #f8fafc 50%, #fcf9f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* زخارف خلفية */
    .login-page::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 10s ease-in-out infinite;
      pointer-events: none;
    }

    .login-page::after {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(26, 42, 74, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 12s ease-in-out infinite reverse;
      pointer-events: none;
    }

    /* ===== البطاقة ===== */
    .login-card {
      max-width: 480px;
      width: 100%;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 60px rgba(26, 42, 74, 0.15);
      overflow: hidden;
      position: relative;
      z-index: 2;
      animation: card-in 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(-30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* شريط علوي متدرج */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #2563eb, #60a5fa, #93c5fd, #60a5fa, #2563eb);
      background-size: 200% 100%;
      animation: shimmer-bar 3s linear infinite;
    }

    @keyframes shimmer-bar {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* ===== الرأس ===== */
    .login-header {
      padding: 36px 32px 24px;
      text-align: center;
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      color: var(--white);
      position: relative;
      overflow: hidden;
    }

    .login-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }

    .login-header > * {
      position: relative;
      z-index: 1;
    }

    .login-header .header-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: var(--white);
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      animation: pulse-icon 2.5s ease-in-out infinite;
      backdrop-filter: blur(10px);
    }

    @keyframes pulse-icon {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 15px rgba(255, 255, 255, 0);
      }
    }

    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    /* ===== الجسم ===== */
    .login-body {
      padding: 28px 32px 24px;
    }

    /* رسالة الخطأ */
    .login-error {
      display: none;
      background: #fef2f2;
      border-right: 4px solid var(--danger);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #dc2626;
      font-size: 0.88rem;
      font-weight: 600;
      align-items: center;
      gap: 10px;
      animation: shake 0.4s ease;
    }

    .login-error.show {
      display: flex;
    }

    .login-error i {
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* رسالة النجاح */
    .login-success {
      display: none;
      background: #f0fdf4;
      border-right: 4px solid var(--success);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #16a34a;
      font-size: 0.88rem;
      font-weight: 600;
      align-items: center;
      gap: 10px;
    }

    .login-success.show {
      display: flex;
    }

    .login-success i {
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    /* حقول الإدخال */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--gray-700);
      margin-bottom: 6px;
    }

    .form-group label i {
      color: #2563eb;
      font-size: 0.85rem;
    }

    .form-group .input-wrap {
      position: relative;
    }

    .form-group input {
      width: 100%;
      padding: 13px 44px 13px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.95rem;
      background: var(--gray-50);
      color: var(--gray-800);
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
      background: var(--white);
    }

    .form-group input.error {
      border-color: var(--danger);
      background: #fef2f2;
    }

    .form-group .input-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.3s ease;
    }

    .form-group input:focus + .input-icon {
      color: #2563eb;
    }

    /* زر إظهار/إخفاء الباسورد */
    .toggle-password {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--gray-400);
      cursor: pointer;
      font-size: 1rem;
      padding: 6px;
      border-radius: 50%;
      transition: all 0.2s ease;
      pointer-events: auto;
    }

    .toggle-password:hover {
      color: #2563eb;
      background: var(--gray-100);
    }

    /* ===== خيارات إضافية ===== */
    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0;
      flex-wrap: wrap;
      gap: 10px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--gray-600);
      font-weight: 600;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .forgot-password {
      font-size: 0.88rem;
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .forgot-password:hover {
      color: #1e40af;
      text-decoration: underline;
    }

    /* ===== زر الدخول ===== */
    .login-btn {
      width: 100%;
      padding: 15px 24px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: var(--white);
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease;
    }

    .login-btn:hover::before {
      width: 500px;
      height: 500px;
    }

    .login-btn:hover {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(201, 168, 76, 0.4);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .login-btn i,
    .login-btn span {
      position: relative;
      z-index: 1;
    }

    /* ===== فاصل ===== */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 20px;
      color: var(--gray-400);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }

    /* ===== أزرار بديلة ===== */
    .alt-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .alt-btn {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      border: 2px solid var(--gray-200);
      color: var(--gray-700);
      background: var(--white);
      cursor: pointer;
      font-family: inherit;
    }

    .alt-btn:hover {
      border-color: #2563eb;
      color: #2563eb;
      background: #eff6ff;
      transform: translateY(-2px);
    }

    .alt-btn i {
      font-size: 0.95rem;
    }

    /* ===== الفوتر ===== */
    .login-footer {
      padding: 20px 32px;
      background: var(--gray-50);
      border-top: 1px solid var(--gray-200);
      text-align: center;
      font-size: 0.88rem;
      color: var(--gray-600);
    }

    .login-footer a {
      color: #2563eb;
      font-weight: 800;
      text-decoration: none;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }

    .login-footer a:hover {
      background: #eff6ff;
      color: #1e40af;
    }

    /* ===== الرجوع ===== */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gray-500);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      transition: all 0.2s ease;
      font-weight: 700;
      margin-top: 16px;
    }

    .back-link:hover {
      color: #2563eb;
      background: #eff6ff;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) and (pointer: coarse) {
      .login-page {
        padding: 20px 12px;
      }

      .login-card {
        border-radius: var(--radius-md);
      }

      .login-header {
        padding: 28px 20px 20px;
      }

      .login-header .header-icon {
        width: 64px;
        height: 64px;
        font-size: 1.6rem;
      }

      .login-header h1 {
        font-size: 1.25rem;
      }

      .login-body {
        padding: 22px 20px 18px;
      }

      .form-group input {
        padding: 11px 40px 11px 12px;
        font-size: 0.92rem;
      }

      .login-btn {
        padding: 14px 20px;
        font-size: 1rem;
      }

      .alt-actions {
        grid-template-columns: 1fr;
      }

      .login-footer {
        padding: 16px 20px;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 480px) {
      .login-header h1 {
        font-size: 1.15rem;
      }

      .login-header p {
        font-size: 0.85rem;
      }

      .login-options {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================ -->
  <!-- 🔐 صفحة تسجيل دخول العملاء                                   -->
  <!-- ============================================================ -->
  <div class="login-page">
    <div class="container">

      <div class="login-card" id="loginCard">

        <!-- ===== الرأس ===== -->
        <div class="login-header">
          <div class="header-icon">
            <i class="fas fa-user"></i>
          </div>
          <h1>تسجيل دخول العملاء</h1>
          <p>سجل دخولك للاستفادة من مزايا المتجر</p>
        </div>

        <!-- ===== الجسم ===== -->
        <div class="login-body" id="loginBody">

          <!-- رسالة الخطأ -->
          <div class="login-error" id="loginError">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">حدث خطأ</span>
          </div>

          <!-- رسالة النجاح -->
          <div class="login-success" id="loginSuccess">
            <i class="fas fa-check-circle"></i>
            <span id="successText">تم تسجيل الدخول</span>
          </div>

          <!-- النموذج -->
          <form id="loginForm" onsubmit="handleLogin(event)">

            <!-- البريد الإلكتروني -->
            <div class="form-group">
              <label>
                <i class="fas fa-envelope"></i>
                البريد الإلكتروني
              </label>
              <div class="input-wrap">
                <input 
                  type="email" 
                  id="loginEmail" 
                  placeholder="example@email.com"
                  autocomplete="email"
                  autofocus>
                <i class="fas fa-envelope input-icon"></i>
              </div>
            </div>

            <!-- كلمة المرور -->
            <div class="form-group">
              <label>
                <i class="fas fa-lock"></i>
                كلمة المرور
              </label>
              <div class="input-wrap">
                <input 
                  type="password" 
                  id="loginPassword" 
                  placeholder="••••••••"
                  autocomplete="current-password">
                <i class="fas fa-lock input-icon"></i>
                <button 
                  type="button" 
                  class="toggle-password" 
                  onclick="togglePassword()"
                  tabindex="-1">
                  <i class="fas fa-eye" id="passwordEye"></i>
                </button>
              </div>
            </div>

            <!-- الخيارات -->
            <div class="login-options">
              <label class="remember-me">
                <input type="checkbox" id="rememberMe">
                <span>احفظ كلمة المرور</span>
              </label>
              <a href="#" class="forgot-password" onclick="handleForgotPassword(event)">
                نسيت كلمة المرور؟
              </a>
            </div>

            <!-- زر الدخول -->
            <button type="submit" class="login-btn" id="loginBtn">
              <i class="fas fa-sign-in-alt"></i>
              <span>تسجيل الدخول</span>
            </button>

          </form>

          <!-- فاصل -->
          <div class="divider">أو</div>

          <!-- أزرار بديلة -->
          <div class="alt-actions">
            <a href="/gomla/customer-register.html" class="alt-btn">
              <i class="fas fa-user-plus"></i>
              حساب جديد
            </a>
            <a href="/gomla/login.html" class="alt-btn">
              <i class="fas fa-arrow-right"></i>
              بوابة الدخول
            </a>
          </div>

        </div>

        <!-- ===== الفوتر ===== -->
        <div class="login-footer">
          ليس لديك حساب؟ 
          <a href="/gomla/customer-register.html">
            <i class="fas fa-user-plus"></i>
            أنشئ حسابك الآن
          </a>
        </div>

      </div>

      <!-- زر الرجوع للرئيسية -->
      <div style="text-align:center;position:relative;z-index:2;">
        <a href="/gomla/" class="back-link">
          <i class="fas fa-arrow-right"></i>
          العودة للصفحة الرئيسية
        </a>
      </div>

    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 customer-login.html - تسجيل دخول العملاء
    // ============================================================

    let isSubmitting = false;

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      // التحقق من وجود مستخدم مسجل
      const user = getCurrentUser();
      if (user) {
        redirectByRole(user.data.role);
        return;
      }

      // استرجاع البريد المحفوظ
      const savedEmail = localStorage.getItem('saved_customer_email');
      if (savedEmail) {
        document.getElementById('loginEmail').value = savedEmail;
        document.getElementById('rememberMe').checked = true;
        setTimeout(() => {
          document.getElementById('loginPassword').focus();
        }, 300);
      }

      console.log('✅ customer-login.html loaded');
    });

    // ============================================================
    // 🔐 إظهار/إخفاء كلمة المرور
    // ============================================================

    function togglePassword() {
      const field = document.getElementById('loginPassword');
      const icon = document.getElementById('passwordEye');

      if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        field.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // ============================================================
    // 📝 تسجيل الدخول
    // ============================================================

    async function handleLogin(event) {
      event.preventDefault();

      if (isSubmitting) return;

      // جلب البيانات
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      // التحقق
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('يرجى إدخال بريد إلكتروني صحيح');
        document.getElementById('loginEmail').focus();
        return;
      }

      if (!password || password.length < 6) {
        showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
        document.getElementById('loginPassword').focus();
        return;
      }

      // بدء الإرسال
      isSubmitting = true;
      const btn = document.getElementById('loginBtn');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>جاري الدخول...</span>';

      hideError();

      try {
        // 1️⃣ تسجيل الدخول عبر Firebase Auth
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const uid = userCredential.user.uid;

        // 2️⃣ جلب بيانات المستخدم من Firestore
        let userData = null;
        let userType = null;

        // البحث في customers
        const customerDoc = await db.collection(COLLECTIONS.CUSTOMERS).doc(uid).get();
        
        if (customerDoc.exists) {
          userData = customerDoc.data();
          userData.id = uid;
          userType = 'customer';
        } else {
          // البحث في admins (للأدمن اللي بيدخل من هنا)
          const adminDoc = await db.collection(COLLECTIONS.ADMINS).doc(uid).get();
          if (adminDoc.exists) {
            userData = adminDoc.data();
            userData.id = uid;
            userType = 'admin';
          }
        }

        if (!userData) {
          throw new Error('حسابك غير مسجل في النظام. تواصل مع الإدارة.');
        }

        // 3️⃣ التحقق من حالة الحساب
        if (userData.active === false) {
          throw new Error('حسابك موقوف. تواصل مع الإدارة.');
        }

        // 4️⃣ التحقق من الدور (يجب أن يكون عميل أو تاجر)
        if (userType === 'customer') {
          const role = userData.role;
          if (role !== ROLES.RETAIL && role !== ROLES.WHOLESALE) {
            throw new Error('هذا الحساب ليس حساب عميل. يرجى استخدام بوابة الدخول الصحيحة.');
          }
        }

        // 5️⃣ حفظ في localStorage
        if (userType === 'admin') {
          localStorage.setItem('admin', JSON.stringify(userData));
          localStorage.setItem('adminId', uid);
        } else {
          localStorage.setItem('customer', JSON.stringify(userData));
        }

        // 6️⃣ حفظ البريد لو "احفظ كلمة المرور" مفعّل
        if (rememberMe) {
          localStorage.setItem('saved_customer_email', email);
        } else {
          localStorage.removeItem('saved_customer_email');
        }

        // 7️⃣ تسجيل النشاط
        try {
          await db.collection(COLLECTIONS.ACTIVITY_LOG).add({
            userId: uid,
            userName: userData.name || 'unknown',
            userRole: userData.role || 'unknown',
            action: 'تسجيل دخول',
            details: `البريد: ${email}`,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (logError) {
          console.warn('Could not log activity:', logError);
        }

        // 8️⃣ عرض رسالة النجاح
        showSuccess(`مرحباً ${userData.name || 'بك'}! جاري التحويل...`);
        showToast(`✅ مرحباً ${userData.name}`, 'success');

        // 9️⃣ التوجيه حسب الدور
        setTimeout(() => {
          redirectByRole(userData.role, userType);
        }, 1000);

      } catch (error) {
        console.error('Login error:', error);

        let errorMessage = 'حدث خطأ في تسجيل الدخول';

        if (error.code === 'auth/user-not-found') {
          errorMessage = 'لا يوجد حساب بهذا البريد الإلكتروني';
        } else if (error.code === 'auth/wrong-password') {
          errorMessage = 'كلمة المرور غير صحيحة';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'البريد الإلكتروني غير صحيح';
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = 'تم تجاوز عدد المحاولات. حاول مرة أخرى لاحقاً';
        } else if (error.code === 'auth/network-request-failed') {
          errorMessage = 'فشل الاتصال بالإنترنت. تأكد من الشبكة';
        } else if (error.code === 'auth/user-disabled') {
          errorMessage = 'هذا الحساب موقوف';
        } else if (error.message) {
          errorMessage = error.message;
        }

        showError(errorMessage);
        btn.disabled = false;
        btn.innerHTML = originalText;
        isSubmitting = false;
      }
    }

    // ============================================================
    // 🎯 التوجيه حسب الدور
    // ============================================================

    function redirectByRole(role, userType) {
      // أدمن بلص / أدمن / سوبر
      if (role === ROLES.SUPER || role === ROLES.ADMIN_PLUS || role === ROLES.ADMIN) {
        window.location.href = '/gomla/admin/home.html';
        return;
      }

      // تاجر
      if (role === ROLES.WHOLESALE) {
        window.location.href = '/gomla/trader-home.html';
        return;
      }

      // كاشير
      if (role === ROLES.CASHIER) {
        window.location.href = '/gomla/cashier/home.html';
        return;
      }

      // عميل قطاعي
      window.location.href = '/gomla/customer-home.html';
    }

    // ============================================================
    // 🔑 نسيت كلمة المرور
    // ============================================================

    async function handleForgotPassword(event) {
      event.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('يرجى إدخال بريدك الإلكتروني أولاً في الحقل أعلاه');
        document.getElementById('loginEmail').focus();
        return;
      }

      if (!confirm(`سيتم إرسال رابط إعادة تعيين كلمة المرور إلى:\n\n${email}\n\nهل أنت متأكد؟`)) {
        return;
      }

      try {
        await auth.sendPasswordResetEmail(email);
        showSuccess('✅ تم إرسال رابط إعادة التعيين إلى بريدك. تحقق من صندوق الوارد.');
        showToast('📧 تم إرسال رابط إعادة التعيين', 'success');
      } catch (error) {
        console.error('Forgot password error:', error);

        let errorMessage = 'فشل إرسال الرابط';
        if (error.code === 'auth/user-not-found') {
          errorMessage = 'لا يوجد حساب بهذا البريد الإلكتروني';
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = 'تم تجاوز الحد المسموح. حاول لاحقاً';
        } else if (error.message) {
          errorMessage = error.message;
        }

        showError(errorMessage);
      }
    }

    // ============================================================
    // 🛠️ دوال العرض
    // ============================================================

    function showError(message) {
      const errorEl = document.getElementById('loginError');
      const errorText = document.getElementById('errorText');
      errorText.textContent = message;
      errorEl.classList.add('show');
      document.getElementById('loginSuccess').classList.remove('show');

      errorEl.style.animation = 'none';
      setTimeout(() => {
        errorEl.style.animation = 'shake 0.4s ease';
      }, 10);
    }

    function hideError() {
      document.getElementById('loginError').classList.remove('show');
    }

    function showSuccess(message) {
      const successEl = document.getElementById('loginSuccess');
      const successText = document.getElementById('successText');
      successText.textContent = message;
      successEl.classList.add('show');
      document.getElementById('loginError').classList.remove('show');
    }

    // ============================================================
    // 🌐 تصدير الدوال
    // ============================================================

    window.togglePassword = togglePassword;
    window.handleLogin = handleLogin;
    window.handleForgotPassword = handleForgotPassword;

  </script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أولاد شعلان جملة - دخول العملاء</title>
  
  <meta name="description" content="دخول العملاء - أولاد شعلان جملة">
  <meta name="theme-color" content="#1a2a4a">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="assets/images/favicon.ico">
  
  <style>
    /* ===== استيراد الستايل الأساسي ===== */
    /* (نفس الستايل الموجود في index.html مع إضافة ستايل صفحة الدخول) */
    
    /* ===== إضافات صفحة الدخول ===== */
    .login-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--gray-50);
    }
    
    .login-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-md);
      text-align: center;
      border-top: 4px solid var(--gold);
    }
    
    .login-card .login-icon {
      font-size: 3.5rem;
      color: var(--gold);
      display: block;
      margin-bottom: 12px;
    }
    
    .login-card h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 4px;
    }
    
    .login-card .subtitle {
      color: var(--gray-400);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    
    .login-card .form-group {
      margin-bottom: 16px;
      text-align: right;
    }
    
    .login-card .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--gray-600);
      margin-bottom: 4px;
    }
    
    .login-card .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s ease;
      background: var(--gray-50);
    }
    
    .login-card .form-group input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.15);
      background: var(--white);
    }
    
    .login-card .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-full);
      background: var(--navy);
      color: var(--white);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .login-card .login-btn:hover {
      background: var(--gold);
      color: var(--navy);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(201, 168, 76, 0.35);
    }
    
    .login-card .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .login-card .error-msg {
      color: #dc2626;
      font-size: 0.9rem;
      margin-top: 12px;
      padding: 10px 16px;
      background: #fef2f2;
      border-radius: var(--radius-sm);
      display: none;
    }
    
    .login-card .error-msg.show {
      display: block;
    }
    
    .login-card .back-link {
      display: inline-block;
      margin-top: 16px;
      color: var(--gray-400);
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.3s ease;
    }
    
    .login-card .back-link:hover {
      color: var(--gold);
    }
    
    .login-card .code-hint {
      background: var(--gray-50);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--gray-600);
      margin-bottom: 20px;
      border-right: 3px solid var(--gold);
    }
  </style>
</head>
<body>

  <!-- ===== الهيدر ===== -->
  <header class="smart-header">
    <div class="container">
      <a href="/gomla/" class="logo">
        <img src="assets/images/logo.png" alt="أولاد شعلان" onerror="this.style.display='none'">
        <span>أولاد شعلان <small>جملة</small></span>
        <span class="gold">✦</span>
      </a>
      <div class="header-actions">
        <a href="/gomla/admin/login.html" class="btn btn-outline">
          <i class="fas fa-user-shield"></i> دخول المديرين
        </a>
      </div>
    </div>
  </header>

  <!-- ===== صفحة الدخول ===== -->
  <section class="login-page">
    <div class="login-card">
      <span class="login-icon"><i class="fas fa-key"></i></span>
      <h1>دخول العملاء</h1>
      <p class="subtitle">أدخل كودك السري للوصول إلى حسابك</p>
      
      <div class="code-hint">
        <i class="fas fa-info-circle" style="color:var(--gold);"></i>
        الكود الخاص بك تجده في رسالة الترحيب المرسلة لك
      </div>
      
      <form id="customerLoginForm">
        <div class="form-group">
          <label><i class="fas fa-qrcode"></i> الكود السري</label>
          <input type="text" id="customerCode" placeholder="مثال: MHL-1234" required autofocus>
        </div>
        
        <div id="loginError" class="error-msg">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorText">الكود غير صحيح، يرجى المحاولة مرة أخرى</span>
        </div>
        
        <button type="submit" class="login-btn" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> دخول
        </button>
      </form>
      
      <a href="/gomla/" class="back-link">
        <i class="fas fa-arrow-right"></i> العودة للرئيسية
      </a>
    </div>
  </section>

  <!-- ===== الفوتر ===== -->
  <footer class="smart-footer">
    <div class="container">
      <div class="copyright">© 2026 أولاد شعلان جملة - جميع الحقوق محفوظة</div>
      <div class="footer-links">
        <a href="/gomla/">الرئيسية</a>
        <a href="/gomla/customer-login.html">دخول العملاء</a>
        <a href="/gomla/admin/login.html">دخول المديرين</a>
      </div>
      <div class="social-icons">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
      </div>
    </div>
  </footer>

  <!-- ===== زر المنيو ===== -->
  <button class="sidebar-toggle" id="sidebarToggle">
    <i class="fas fa-bars"></i>
  </button>

  <!-- ===== Firebase ===== -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <!-- ===== ملفات JS ===== -->
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/public.js"></script>
  
  <script>
    // ===== تسجيل دخول العميل =====
    document.getElementById('customerLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const code = document.getElementById('customerCode').value.trim();
      const errorDiv = document.getElementById('loginError');
      const errorText = document.getElementById('errorText');
      const loginBtn = document.getElementById('loginBtn');
      
      if (!code) {
        errorText.textContent = 'يرجى إدخال الكود السري';
        errorDiv.classList.add('show');
        return;
      }
      
      // إخفاء الخطأ السابق
      errorDiv.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
      
      // البحث عن العميل في Firebase
      db.collection('customers')
        .where('code', '==', code)
        .get()
        .then((snapshot) => {
          if (snapshot.empty) {
            errorText.textContent = 'الكود غير صحيح، يرجى المحاولة مرة أخرى';
            errorDiv.classList.add('show');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
            return;
          }
          
          const customerData = snapshot.docs[0].data();
          customerData.id = snapshot.docs[0].id;
          
          // حفظ بيانات العميل
          localStorage.setItem('customer', JSON.stringify(customerData));
          localStorage.setItem('customerCode', code);
          
          showToast(`✅ مرحباً ${customerData.name}`, 'success');
          
          // تحديث السايدبار
          updateSidebarContent();
          
          // التوجيه للصفحة الشخصية
          window.location.href = '/gomla/customer-dashboard.html';
        })
        .catch((error) => {
          console.error('Error logging in:', error);
          errorText.textContent = 'حدث خطأ، يرجى المحاولة مرة أخرى';
          errorDiv.classList.add('show');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
        });
    });
    
    // ===== دخول بالضغط على Enter =====
    document.getElementById('customerCode').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('customerLoginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>

</body>
</html>

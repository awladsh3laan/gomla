<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أولاد شعلان جملة - توليد أكواد العملاء</title>

  <meta name="description" content="توليد أكواد العملاء - أولاد شعلان جملة">
  <meta name="theme-color" content="#1a2a4a">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="../assets/images/favicon.ico">

  <style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');

    /* ========================================== */
    /* 🎨 الألوان الموحدة - أولاد شعلان جملة      */
    /* ========================================== */

    :root {
      --navy: #1a2a4a;
      --navy-light: #2a3f6a;
      --navy-dark: #0f1a2e;
      --gold: #c9a84c;
      --gold-light: #e8d5a3;
      --gold-dark: #b8942a;
      --white: #ffffff;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.12);
      --shadow-xl: 0 16px 60px rgba(0, 0, 0, 0.16);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --transition-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      direction: rtl;
    }

    body {
      font-family: 'Tajawal', -apple-system, sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ===== الهيدر ===== */
    .smart-header {
      background: var(--navy);
      color: var(--white);
      padding: 14px 0;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 3px solid var(--gold);
    }

    .smart-header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .smart-header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--white);
      text-decoration: none;
    }

    .smart-header .logo img {
      height: 44px;
      border-radius: 10px;
    }

    .smart-header .logo small {
      font-size: 0.7rem;
      font-weight: 400;
      opacity: 0.8;
    }

    .smart-header .logo .gold {
      color: var(--gold);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-actions .btn {
      padding: 8px 20px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      transition: var(--transition-base);
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions .btn-gold {
      background: var(--gold);
      color: var(--navy);
    }

    .header-actions .btn-gold:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(201, 168, 76, 0.35);
    }

    .header-actions .btn-outline {
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--white);
    }

    .header-actions .btn-outline:hover {
      background: var(--gold);
      color: var(--navy);
      transform: translateY(-2px);
    }

    /* ===== المحتوى ===== */
    .page-content {
      flex: 1;
      padding: 32px 0 48px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .page-header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--navy);
    }

    .page-header h1 i {
      color: var(--gold);
      margin-left: 8px;
    }

    .page-header .badge-super {
      background: var(--gold);
      color: var(--navy);
      padding: 6px 18px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* ===== بطاقة التوليد ===== */
    .generate-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 32px;
      max-width: 700px;
      margin: 0 auto;
      box-shadow: var(--shadow-md);
      border-top: 5px solid var(--gold);
      animation: fadeInUp 0.6s ease both;
    }

    .generate-card .form-group {
      margin-bottom: 18px;
    }

    .generate-card .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--gray-600);
      margin-bottom: 4px;
    }

    .generate-card .form-group label i {
      color: var(--gold);
      margin-left: 4px;
    }

    .generate-card .form-group input,
    .generate-card .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s ease;
      background: var(--gray-50);
    }

    .generate-card .form-group input:focus,
    .generate-card .form-group select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
      background: var(--white);
    }

    .generate-card .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .generate-card .code-preview {
      background: var(--gray-50);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      text-align: center;
      margin: 12px 0 16px;
      border: 2px dashed var(--gold);
      display: none;
    }

    .generate-card .code-preview.show {
      display: block;
    }

    .generate-card .code-preview .code-text {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--navy);
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
    }

    .generate-card .code-preview .code-label {
      font-size: 0.8rem;
      color: var(--gray-400);
    }

    .generate-card .barcode-preview {
      text-align: center;
      margin: 12px 0;
      display: none;
    }

    .generate-card .barcode-preview.show {
      display: block;
    }

    .generate-card .barcode-preview img {
      max-width: 200px;
      height: auto;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 8px;
    }

    .generate-card .btn-generate {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-full);
      background: var(--navy);
      color: var(--white);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .generate-card .btn-generate:hover {
      background: var(--gold);
      color: var(--navy);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(201, 168, 76, 0.35);
    }

    .generate-card .btn-generate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .generate-card .actions-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .generate-card .actions-row .btn {
      flex: 1;
      justify-content: center;
      padding: 10px;
      font-size: 0.9rem;
      min-width: 120px;
    }

    .generate-card .btn-success {
      background: #22c55e;
      color: var(--white);
    }

    .generate-card .btn-success:hover {
      background: #16a34a;
      transform: translateY(-2px);
    }

    .generate-card .btn-whatsapp {
      background: #25d366;
      color: var(--white);
    }

    .generate-card .btn-whatsapp:hover {
      background: #1ebe5a;
      transform: translateY(-2px);
    }

    .generate-card .btn-outline {
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--gold);
    }

    .generate-card .btn-outline:hover {
      background: var(--gold);
      color: var(--navy);
      transform: translateY(-2px);
    }

    /* ===== رسائل ===== */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 90%;
    }

    .toast {
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      color: var(--white);
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: var(--shadow-lg);
      animation: fadeInUp 0.3s ease;
      direction: rtl;
      font-family: 'Tajawal', sans-serif;
    }

    .toast-success {
      background: #22c55e;
    }
    .toast-error {
      background: #ef4444;
    }
    .toast-warning {
      background: #f59e0b;
    }
    .toast-info {
      background: #3b82f6;
    }

    /* ===== الفوتر ===== */
    .smart-footer {
      background: var(--navy-dark);
      color: rgba(255, 255, 255, 0.85);
      padding: 28px 0;
      margin-top: 0;
      border-top: 3px solid var(--gold);
    }

    .smart-footer .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .smart-footer .footer-links {
      display: flex;
      gap: 20px;
    }

    .smart-footer .footer-links a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: var(--transition-base);
    }

    .smart-footer .footer-links a:hover {
      color: var(--gold);
    }

    .smart-footer .social-icons {
      display: flex;
      gap: 12px;
    }

    .smart-footer .social-icons a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      color: var(--white);
      text-decoration: none;
      transition: var(--transition-base);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .smart-footer .social-icons a:hover {
      background: var(--gold);
      color: var(--navy);
      transform: translateY(-3px);
    }

    /* ========================================== */
    /* 🧠 السايدبار الذكي                       */
    /* ========================================== */

    .smart-sidebar {
      position: fixed;
      top: 0;
      right: -380px;
      width: 360px;
      height: 100%;
      background: var(--white);
      z-index: 9999;
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: -4px 0 40px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .smart-sidebar.open {
      right: 0;
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 9998;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .sidebar-header {
      padding: 20px 24px;
      background: var(--navy);
      color: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .sidebar-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
    }

    .sidebar-username {
      font-weight: 700;
      font-size: 1rem;
    }

    .sidebar-user-role {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .sidebar-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--white);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      transition: var(--transition-base);
    }

    .sidebar-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .sidebar-motivational {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      padding: 20px 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .motivational-icon {
      font-size: 1.4rem;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .motivational-text {
      font-size: 1rem;
      font-weight: 500;
      transition: opacity 0.3s ease;
      line-height: 1.6;
    }

    .sidebar-news {
      padding: 16px 24px;
      border-bottom: 1px solid var(--gray-200);
      flex-shrink: 0;
    }

    .news-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--navy);
      margin-bottom: 10px;
    }

    .news-header i {
      color: var(--gold);
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .news-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--gray-600);
      padding: 4px 0;
    }

    .news-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      color: var(--gray-600);
      text-decoration: none;
      transition: var(--transition-base);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .sidebar-link:hover {
      background: var(--gray-100);
      color: var(--navy);
    }

    .sidebar-link.active {
      background: var(--navy);
      color: var(--white);
    }

    .sidebar-link i {
      width: 20px;
      text-align: center;
      font-size: 1.05rem;
    }

    .sidebar-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--gray-200);
      flex-shrink: 0;
    }

    .sidebar-action-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius-full);
      background: var(--gold);
      color: var(--navy);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition-base);
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .sidebar-action-btn:hover {
      background: var(--gold-light);
      transform: scale(1.02);
    }

    .sidebar-toggle {
      position: fixed;
      left: 20px;
      bottom: 20px;
      background: var(--navy);
      color: var(--white);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      border: none;
      z-index: 999;
      transition: var(--transition-base);
    }

    .sidebar-toggle:hover {
      background: var(--gold);
      color: var(--navy);
      transform: scale(1.05);
    }

    /* ========================================== */
    /* 📱 تحسينات الشاشات الصغيرة                */
    /* ========================================== */

    @media (max-width: 768px) {
      .generate-card {
        padding: 24px 16px;
      }

      .generate-card .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .smart-sidebar {
        width: 320px;
        right: -340px;
      }

      .smart-header .container {
        flex-direction: column;
        align-items: stretch;
      }

      .header-actions {
        justify-content: center;
      }

      .smart-footer .container {
        flex-direction: column;
        text-align: center;
      }

      .smart-footer .footer-links {
        justify-content: center;
      }

      .page-header h1 {
        font-size: 1.4rem;
      }

      .generate-card .code-preview .code-text {
        font-size: 1.3rem;
      }

      .generate-card .actions-row .btn {
        min-width: 100px;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .generate-card {
        padding: 16px 12px;
      }

      .smart-sidebar {
        width: 290px;
        right: -310px;
      }

      .sidebar-toggle {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
        left: 12px;
        bottom: 12px;
      }

      .generate-card .code-preview .code-text {
        font-size: 1.1rem;
      }

      .generate-card .actions-row {
        flex-direction: column;
      }

      .generate-card .actions-row .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- ===== الهيدر ===== -->
  <header class="smart-header">
    <div class="container">
      <a href="/gomla/admin/home.html" class="logo">
        <img src="../assets/images/logo.png" alt="أولاد شعلان" onerror="this.style.display='none'">
        <span>أولاد شعلان <small>جملة</small></span>
        <span class="gold">✦</span>
      </a>
      <div class="header-actions">
        <span class="btn btn-gold" id="adminNameDisplay">
          <i class="fas fa-user-cog"></i> مرحباً <span id="adminName">مدير</span>
        </span>
        <a href="/gomla/admin/dashboard.html" class="btn btn-outline">
          <i class="fas fa-th-large"></i> لوحة التحكم
        </a>
        <button class="btn btn-outline" onclick="logoutAdmin()">
          <i class="fas fa-sign-out-alt"></i> خروج
        </button>
      </div>
    </div>
  </header>

  <!-- ===== المحتوى ===== -->
  <section class="page-content">
    <div class="container">

      <div class="page-header">
        <h1><i class="fas fa-key"></i> توليد أكواد العملاء</h1>
        <span class="badge-super">👑 سوبر أدمن فقط</span>
      </div>

      <div class="generate-card" id="generateCard">
        <form id="generateForm">

          <div class="form-row">
            <div class="form-group">
              <label><i class="fas fa-user"></i> اسم العميل *</label>
              <input type="text" id="customerName" placeholder="مثال: أحمد محمد" required autofocus>
            </div>
            <div class="form-group">
              <label><i class="fas fa-phone"></i> رقم الهاتف *</label>
              <input type="tel" id="customerPhone" placeholder="مثال: 01012345678" required>
            </div>
          </div>

          <div class="form-group">
            <label><i class="fas fa-store"></i> اسم المحل / المتجر</label>
            <input type="text" id="customerShop" placeholder="مثال: محل النور">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label><i class="fas fa-map-marker-alt"></i> المدينة *</label>
              <select id="customerCity" required>
                <option value="">اختر المدينة...</option>
                <option value="المحلة">المحلة (MHL)</option>
                <option value="المنصورة">المنصورة (MNS)</option>
                <option value="طنطا">طنطا (TNT)</option>
              </select>
            </div>
            <div class="form-group">
              <label><i class="fas fa-home"></i> العنوان</label>
              <input type="text" id="customerAddress" placeholder="العنوان الكامل">
            </div>
          </div>

          <!-- ===== معاينة الكود ===== -->
          <div class="code-preview" id="codePreview">
            <span class="code-label">الكود المولد</span>
            <div class="code-text" id="generatedCode">MHL-m1236</div>
          </div>

          <!-- ===== معاينة الباركود ===== -->
          <div class="barcode-preview" id="barcodePreview">
            <img id="barcodeImage" src="" alt="باركود">
          </div>

          <button type="submit" class="btn-generate" id="generateBtn">
            <i class="fas fa-sync-alt"></i> توليد الكود وحفظه
          </button>

          <div class="actions-row" id="actionsRow" style="display:none;">
            <button type="button" class="btn btn-whatsapp" onclick="sendWhatsApp()">
              <i class="fab fa-whatsapp"></i> إرسال عبر واتساب
            </button>
            <button type="button" class="btn btn-success" onclick="downloadBarcode()">
              <i class="fas fa-download"></i> تحميل الباركود
            </button>
            <button type="button" class="btn btn-outline" onclick="resetForm()">
              <i class="fas fa-plus"></i> توليد آخر
            </button>
          </div>

        </form>
      </div>

    </div>

  <!-- ===== Firebase ===== -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- ===== الملفات ===== -->
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/admin.js"></script>

  <script>
    // ============================================
    // 🔑 توليد أكواد العملاء - admin/generate-codes.html
    // ============================================

    let generatedCustomerId = null;
    let generatedCode = null;

    // ===== التحقق من صلاحية السوبر أدمن =====
    function checkSuperAdmin() {
      const adminData = localStorage.getItem('admin');
      if (!adminData) {
        window.location.href = '/gomla/admin/login.html';
        return null;
      }

      const admin = JSON.parse(adminData);
      if (admin.role !== 'super') {
        window.location.href = '/gomla/admin/dashboard.html';
        return null;
      }

      // عرض اسم المدير
      document.getElementById('adminName').textContent = admin.name || 'مدير';
      return admin;
    }

    // ===== توليد كود عشوائي =====
    function generateRandomCode(prefix) {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let result = '';
      for (let i = 0; i < 5; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `${prefix}-${result}`;
    }

    // ===== توليد كود فريد =====
    async function generateUniqueCode(city) {
      const prefixMap = {
        'المحلة': 'MHL',
        'المنصورة': 'MNS',
        'طنطا': 'TNT'
      };
      const prefix = prefixMap[city] || 'MHL';

      let code;
      let exists = true;
      let attempts = 0;

      while (exists && attempts < 20) {
        code = generateRandomCode(prefix);
        const snapshot = await db.collection('customers')
          .where('code', '==', code)
          .get();
        exists = !snapshot.empty;
        attempts++;
      }

      return code;
    }

    // ===== توليد الباركود =====
    function generateBarcodeUrl(code) {
      const url = `https://barcode.tec-it.com/barcode.ashx?data=${encodeURIComponent(code)}&code=Code128&dpi=96`;
      return url;
    }

    // ===== حفظ العميل في Firebase =====
    async function saveCustomer(data) {
      const customerRef = db.collection('customers').doc();
      await customerRef.set({
        ...data,
        balance: 0,
        type: 'cash',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      return customerRef.id;
    }

    // ===== معالج النموذج =====
    document.getElementById('generateForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const shop = document.getElementById('customerShop').value.trim();
      const city = document.getElementById('customerCity').value;
      const address = document.getElementById('customerAddress').value.trim();
      const btn = document.getElementById('generateBtn');
      const preview = document.getElementById('codePreview');
      const barcodePreview = document.getElementById('barcodePreview');
      const actionsRow = document.getElementById('actionsRow');

      if (!name || !phone || !city) {
        showToast('⚠️ يرجى ملء جميع الحقول المطلوبة', 'warning');
        return;
      }

      // التحقق من رقم الهاتف
      const phoneRegex = /^[0-9]{11}$/;
      if (!phoneRegex.test(phone)) {
        showToast('⚠️ رقم الهاتف غير صحيح (11 رقم)', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التوليد...';

      try {
        // توليد كود فريد
        const code = await generateUniqueCode(city);
        generatedCode = code;

        // حفظ العميل
        const customerId = await saveCustomer({
          name: name,
          phone: phone,
          shop: shop || '',
          city: city,
          address: address || '',
          code: code,
          barcode: generateBarcodeUrl(code)
        });

        generatedCustomerId = customerId;

        // عرض الكود
        document.getElementById('generatedCode').textContent = code;
        preview.classList.add('show');

        // عرض الباركود
        const barcodeUrl = generateBarcodeUrl(code);
        document.getElementById('barcodeImage').src = barcodeUrl;
        barcodePreview.classList.add('show');

        actionsRow.style.display = 'flex';

        showToast(`✅ تم توليد الكود بنجاح للعميل ${name}`, 'success');

        // تسجيل النشاط
        logActivity('توليد كود عميل', `${name} - ${code}`);

      } catch (error) {
        console.error('Error generating code:', error);
        showToast('❌ حدث خطأ في توليد الكود', 'error');
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sync-alt"></i> توليد الكود وحفظه';
    });

    // ===== إرسال عبر واتساب =====
    function sendWhatsApp() {
      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const code = generatedCode;

      if (!code || !phone) {
        showToast('⚠️ لا توجد بيانات للإرسال', 'warning');
        return;
      }

      // تنظيف رقم الهاتف
      let cleanPhone = phone.replace(/[^0-9]/g, '');
      if (cleanPhone.startsWith('0')) cleanPhone = cleanPhone.substring(1);
      if (!cleanPhone.startsWith('2')) cleanPhone = '2' + cleanPhone;

      const message = `مرحباً ${name} 👋\n\n` +
        `تم إنشاء حسابك في متجر أولاد شعلان جملة.\n` +
        `🔑 كود الدخول الخاص بك هو: *${code}*\n\n` +
        `يمكنك استخدام هذا الكود لتسجيل الدخول ومتابعة طلباتك وفواتيرك.\n\n` +
        `رابط المتجر: https://awladsh3laan.github.io/gomla/\n\n` +
        `شكراً لثقتك بنا 🙏`;

      const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');

      logActivity('إرسال كود واتساب', `${name} - ${code}`);
    }

    // ===== تحميل الباركود =====
    function downloadBarcode() {
      const img = document.getElementById('barcodeImage');
      if (!img || !img.src) {
        showToast('⚠️ لا يوجد باركود للتحميل', 'warning');
        return;
      }

      const link = document.createElement('a');
      link.download = `barcode-${generatedCode}.png`;
      link.href = img.src;
      link.target = '_blank';
      link.click();

      showToast('✅ جاري تحميل الباركود', 'success');
    }

    // ===== إعادة تعيين النموذج =====
    function resetForm() {
      document.getElementById('generateForm').reset();
      document.getElementById('codePreview').classList.remove('show');
      document.getElementById('barcodePreview').classList.remove('show');
      document.getElementById('actionsRow').style.display = 'none';
      document.getElementById('generatedCode').textContent = '';
      document.getElementById('barcodeImage').src = '';
      generatedCustomerId = null;
      generatedCode = null;
      document.getElementById('customerName').focus();
    }

    // ===== تسجيل النشاط =====
    function logActivity(action, details) {
      const adminData = localStorage.getItem('admin');
      const admin = adminData ? JSON.parse(adminData) : { name: 'غير معروف' };

      db.collection('activityLog').add({
        adminId: localStorage.getItem('adminId') || 'unknown',
        adminName: admin.name || 'غير معروف',
        action: action,
        details: details || '',
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(() => {});
    }

    // ============================================
    // 🚀 تشغيل الصفحة
    // ============================================

    document.addEventListener('DOMContentLoaded', function() {
      const admin = checkSuperAdmin();
      if (!admin) return;

      // تحميل السايدبار
      loadSidebar();
    });

    // تصدير الدوال للاستخدام العالمي
    window.sendWhatsApp = sendWhatsApp;
    window.downloadBarcode = downloadBarcode;
    window.resetForm = resetForm;
    window.logoutAdmin = logoutAdmin;
  </script>

</body>

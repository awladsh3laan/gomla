<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العملاء - أولاد شعلان جملة</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Style الموحد -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <!-- الهيدر والسايدبار الديناميكي -->
    <div id="header-container"></div>
    <div id="sidebar-container"></div>

    <main class="page-content">
        <div class="container">
            
            <!-- عنوان الصفحة والأزرار -->
            <div class="page-header">
                <h1><i class="fa-solid fa-users"></i> إدارة العملاء</h1>
                <div class="header-actions">
                    <button class="btn btn-gold" onclick="openAddCustomerModal()">
                        <i class="fa-solid fa-user-plus"></i> إضافة عميل جديد
                    </button>
                    <a href="generate-codes.html" class="btn btn-outline">
                        <i class="fa-solid fa-key"></i> توليد الأكواد
                    </a>
                </div>
            </div>

            <!-- إحصائيات سريعة للعملاء -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="fa-solid fa-users"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" id="total-customers-count">0</span>
                        <span class="stat-label">إجمالي العملاء</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fa-solid fa-user-check"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" id="active-customers-count">0</span>
                        <span class="stat-label">حسابات نشطة</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon red"><i class="fa-solid fa-user-slash"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" id="inactive-customers-count">0</span>
                        <span class="stat-label">حسابات معطلة</span>
                    </div>
                </div>
            </div>

            <!-- أشرطة البحث والفلترة -->
            <div style="background: var(--white); padding: 16px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); margin-bottom: 24px; display: flex; gap: 12px; flex-wrap: wrap;">
                <input type="text" id="search-customer-input" placeholder="بحث باسم العميل، الهاتف، أو الكود..." style="flex: 1; min-width: 240px; padding: 10px 16px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); font-family: inherit;">
                <select id="filter-status-select" style="padding: 10px 16px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); font-family: inherit; background: var(--white);">
                    <option value="all">كل الحالات</option>
                    <option value="active">نشط فقط</option>
                    <option value="inactive">معطل فقط</option>
                </select>
            </div>

            <!-- جدول العملاء -->
            <div style="background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: right;">
                    <thead>
                        <tr style="background: var(--navy); color: var(--white);">
                            <th style="padding: 14px 16px;">الكود</th>
                            <th style="padding: 14px 16px;">اسم العميل</th>
                            <th style="padding: 14px 16px;">رقم الهاتف</th>
                            <th style="padding: 14px 16px;">المنطقة / العنوان</th>
                            <th style="padding: 14px 16px;">الحالة</th>
                            <th style="padding: 14px 16px; text-align: center;">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="customers-table-body">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 24px; color: var(--gray-400);">جاري تحميل بيانات العملاء...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- مودال إضافة / تعديل عميل -->
    <div id="customer-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: var(--white); border-radius: var(--radius-md); max-width: 500px; width: 100%; padding: 24px; box-shadow: var(--shadow-lg);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--gold); padding-bottom: 10px;">
                <h3 id="modal-title" style="color: var(--navy);"><i class="fa-solid fa-user-plus"></i> إضافة عميل جديد</h3>
                <button onclick="closeCustomerModal()" style="background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray-600);">&times;</button>
            </div>
            
            <form id="customer-form" onsubmit="handleCustomerSubmit(event)">
                <input type="hidden" id="customer-doc-id">
                
                <div style="margin-bottom: 14px;">
                    <label style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--navy);">اسم العميل بالكامل</label>
                    <input type="text" id="customer-name" required placeholder="مثال: أحمد محمود" style="width: 100%; padding: 10px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); font-family: inherit;">
                </div>

                <div style="margin-bottom: 14px;">
                    <label style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--navy);">رقم الهاتف (للدخول وتلقي الإشعارات)</label>
                    <input type="tel" id="customer-phone" required placeholder="01xxxxxxxxx" style="width: 100%; padding: 10px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); font-family: inherit;">
                </div>

                <div style="margin-bottom: 14px;">
                    <label style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--navy);">كود الدخول السري</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="customer-code" required placeholder="مثال: SH-1020" style="flex: 1; padding: 10px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); font-family: inherit;">
                        <button type="button" class="btn btn-outline btn-sm" onclick="generateRandomCodeInput()">توليد</button>
                    </div>
                </div>

                <div style="margin-bottom: 14px;">
                    <label style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--navy);">العنوان / المحل</label>
                    <input type="text" id="customer-address" placeholder="المحلة الكبرى - شارع ..." style="width: 100%; padding: 10px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); font-family: inherit;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--navy);">حالة الحساب</label>
                    <select id="customer-status" style="width: 100%; padding: 10px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); font-family: inherit; background: var(--white);">
                        <option value="active">نشط (يمكنه الدخول لمتجر الجملة)</option>
                        <option value="inactive">معطل (موقوف مؤقتاً)</option>
                    </select>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn btn-outline" onclick="closeCustomerModal()">إلغاء</button>
                    <button type="submit" class="btn btn-gold" id="save-customer-btn">حفظ البيانات</button>
                </div>
            </form>
        </div>
    </div>

    <!-- الفوتر الموحد -->
    <div id="footer-container"></div>

    <!-- Firebase JS (SDKs) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- ملفات النظام الموحدة -->
    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/main.js"></script>

    <!-- السكربت التشغيلي لصفحة العملاء -->
    <script>
        let allCustomers = [];

        document.addEventListener('DOMContentLoaded', async () => {
            // حماية الصفحة للمسئولين فقط
            if (typeof protectPage === 'function') {
                await protectPage(['admin', 'superadmin']);
            }
            
            // تحميل المكونات الهيكلية
            loadComponent('../assets/components/header.html', 'header-container');
            loadComponent('../assets/components/sidebar.html', 'sidebar-container');
            loadComponent('../assets/components/footer.html', 'footer-container');

            // جلب العملاء من Firestore
            fetchCustomers();

            // إعداد أسرعة البحث والفلترة
            document.getElementById('search-customer-input').addEventListener('input', filterAndRenderCustomers);
            document.getElementById('filter-status-select').addEventListener('change', filterAndRenderCustomers);
        });

        // جلب قائمة العملاء
        async function fetchCustomers() {
            try {
                const snapshot = await db.collection('users').where('role', '==', 'customer').get();
                allCustomers = [];
                snapshot.forEach(doc => {
                    allCustomers.push({ id: doc.id, ...doc.data() });
                });
                renderCustomers(allCustomers);
                updateStats(allCustomers);
            } catch (error) {
                console.error("خطأ في جلب العملاء:", error);
                showToast("فشل في تحميل بيانات العملاء", "error");
            }
        }

        // تحديث الإحصائيات
        function updateStats(customers) {
            document.getElementById('total-customers-count').textContent = customers.length;
            const active = customers.filter(c => c.status !== 'inactive').length;
            const inactive = customers.length - active;
            document.getElementById('active-customers-count').textContent = active;
            document.getElementById('inactive-customers-count').textContent = inactive;
        }

        // عرض العملاء في الجدول
        function renderCustomers(customers) {
            const tbody = document.getElementById('customers-table-body');
            tbody.innerHTML = '';

            if (customers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 24px; color: var(--gray-400);">لا يوجد عملاء مطابقون للبحث.</td></tr>`;
                return;
            }

            customers.forEach(customer => {
                const isActive = customer.status !== 'inactive';
                const statusBadge = isActive 
                    ? `<span style="background: rgba(34,197,94,0.15); color: #22c55e; padding: 4px 12px; border-radius: var(--radius-full); font-weight: 700; font-size: 0.8rem;">نشط</span>`
                    : `<span style="background: rgba(239,68,68,0.15); color: #ef4444; padding: 4px 12px; border-radius: var(--radius-full); font-weight: 700; font-size: 0.8rem;">معطل</span>`;

                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid var(--gray-100)';
                tr.innerHTML = `
                    <td style="padding: 12px 16px; font-weight: 700; color: var(--navy);"><i class="fa-solid fa-key" style="color: var(--gold); font-size: 0.8rem;"></i> ${customer.code || 'بدون كود'}</td>
                    <td style="padding: 12px 16px; font-weight: 700;">${customer.name || 'بدون اسم'}</td>
                    <td style="padding: 12px 16px; direction: ltr; text-align: right;">${customer.phone || '-'}</td>
                    <td style="padding: 12px 16px; color: var(--gray-600);">${customer.address || 'غير محدد'}</td>
                    <td style="padding: 12px 16px;">${statusBadge}</td>
                    <td style="padding: 12px 16px; text-align: center;">
                        <button class="btn btn-outline btn-sm" onclick="editCustomer('${customer.id}')" title="تعديل"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm ${isActive ? 'btn-danger' : 'btn-success'}" onclick="toggleCustomerStatus('${customer.id}', '${customer.status}')" title="${isActive ? 'تعطيل' : 'تفعيل'}">
                            <i class="fa-solid ${isActive ? 'fa-user-slash' : 'fa-user-check'}"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // فلترة القائمة
        function filterAndRenderCustomers() {
            const searchValue = document.getElementById('search-customer-input').value.toLowerCase().trim();
            const statusFilter = document.getElementById('filter-status-select').value;

            const filtered = allCustomers.filter(c => {
                const matchesSearch = (c.name && c.name.toLowerCase().includes(searchValue)) ||
                                      (c.phone && c.phone.includes(searchValue)) ||
                                      (c.code && c.code.toLowerCase().includes(searchValue));
                
                let matchesStatus = true;
                if (statusFilter === 'active') matchesStatus = c.status !== 'inactive';
                if (statusFilter === 'inactive') matchesStatus = c.status === 'inactive';

                return matchesSearch && matchesStatus;
            });

            renderCustomers(filtered);
        }

        // فتح مودال إضافة عميل
        function openAddCustomerModal() {
            document.getElementById('customer-doc-id').value = '';
            document.getElementById('customer-form').reset();
            document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-user-plus"></i> إضافة عميل جديد`;
            generateRandomCodeInput();
            document.getElementById('customer-modal').style.display = 'flex';
        }

        // فتح مودال تعديل عميل
        function editCustomer(id) {
            const customer = allCustomers.find(c => c.id === id);
            if (!customer) return;

            document.getElementById('customer-doc-id').value = customer.id;
            document.getElementById('customer-name').value = customer.name || '';
            document.getElementById('customer-phone').value = customer.phone || '';
            document.getElementById('customer-code').value = customer.code || '';
            document.getElementById('customer-address').value = customer.address || '';
            document.getElementById('customer-status').value = customer.status || 'active';

            document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-user-pen"></i> تعديل بيانات العميل`;
            document.getElementById('customer-modal').style.display = 'flex';
        }

        function closeCustomerModal() {
            document.getElementById('customer-modal').style.display = 'none';
        }

        // توليد كود سري عشوائي
        function generateRandomCodeInput() {
            if (typeof generateRandomCode === 'function') {
                document.getElementById('customer-code').value = generateRandomCode(6);
            } else {
                document.getElementById('customer-code').value = 'SH-' + Math.floor(1000 + Math.random() * 9000);
            }
        }

        // تقديم نموذج العميل (إضافة / تعديل)
        async function handleCustomerSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('save-customer-btn');
            btn.disabled = true;
            btn.textContent = 'جاري الحفظ...';

            const docId = document.getElementById('customer-doc-id').value;
            const customerData = {
                name: document.getElementById('customer-name').value.trim(),
                phone: document.getElementById('customer-phone').value.trim(),
                code: document.getElementById('customer-code').value.trim().toUpperCase(),
                address: document.getElementById('customer-address').value.trim(),
                status: document.getElementById('customer-status').value,
                role: 'customer',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (docId) {
                    await db.collection('users').doc(docId).update(customerData);
                    showToast("تم تحديث بيانات العميل بنجاح", "success");
                } else {
                    customerData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('users').add(customerData);
                    showToast("تم إضافة العميل بنجاح", "success");
                }
                closeCustomerModal();
                fetchCustomers();
            } catch (err) {
                console.error("خطأ في حفظ العميل:", err);
                showToast("حدث خطأ أثناء حفظ البيانات", "error");
            } finally {
                btn.disabled = false;
                btn.textContent = 'حفظ البيانات';
            }
        }

        // تفعيل / تعطيل العميل
        async function toggleCustomerStatus(id, currentStatus) {
            const newStatus = currentStatus === 'inactive' ? 'active' : 'inactive';
            const actionText = newStatus === 'active' ? 'تفعيل' : 'تعطيل';
            
            if (!confirm(`هل أنت تأكد من ${actionText} هذا العميل؟`)) return;

            try {
                await db.collection('users').doc(id).update({
                    status: newStatus,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToast(`تم ${actionText} العميل بنجاح`, "success");
                fetchCustomers();
            } catch (err) {
                console.error("خطأ تغيير حالة العميل:", err);
                showToast("فشل في تغيير حالة العميل", "error");
            }
        }
    </script>
</body>
</html>

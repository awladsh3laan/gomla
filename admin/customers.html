<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة العملاء - أولاد شعلان</title>
  <meta name="description" content="إدارة العملاء والذمم المالية - أولاد شعلان">
  <meta name="theme-color" content="#1a2a4a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       🎨 إدارة العملاء — v2.0
       ============================================================ */
    html, body { overflow-x: hidden !important; max-width: 100vw; }
    .page-content, .page-content .container { overflow-x: hidden; min-width: 0; max-width: 100%; }

    /* Page Header */
    .cm-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 18px;
      color: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(26, 42, 74, 0.25);
      border-bottom: 4px solid var(--gold);
    }
    .cm-header::before {
      content: '';
      position: absolute;
      top: -50%; right: -15%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(201,168,76,.18) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }
    .cm-header-inner {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
    }
    .cm-header-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 200px; }
    .cm-header-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(201,168,76,.4);
    }
    .cm-header h1 {
      font-size: 1.35rem; font-weight: 900;
      margin: 0 0 3px; color: var(--white);
    }
    .cm-header p {
      font-size: 0.83rem; opacity: 0.88;
      color: rgba(255,255,255,.85); margin: 0;
    }
    .cm-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .cm-header-actions .btn {
      background: rgba(255,255,255,.15);
      color: var(--white);
      border: 1px solid rgba(255,255,255,.3);
    }
    .cm-header-actions .btn:hover {
      background: var(--gold);
      color: var(--navy);
      border-color: var(--gold);
    }

    /* Tabs */
    .cm-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: var(--white);
      padding: 8px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .cm-tabs::-webkit-scrollbar { height: 4px; }
    .cm-tabs::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    .cm-tab {
      flex-shrink: 0;
      padding: 11px 18px;
      border: 2px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .cm-tab:hover { border-color: var(--gold-light); background: var(--gray-50); }
    .cm-tab.active {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      border-color: var(--navy);
      box-shadow: 0 6px 16px rgba(26,42,74,.25);
    }
    .cm-tab.active i { color: var(--gold); }
    .cm-tab .tab-count {
      background: rgba(0,0,0,.08);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.68rem;
      font-weight: 900;
      min-width: 22px;
      text-align: center;
    }
    .cm-tab.active .tab-count { background: var(--gold); color: var(--navy); }

    /* Stats */
    .cm-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .cm-stat-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      text-align: center;
      transition: var(--transition);
    }
    .cm-stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--gold-light);
    }
    .cm-stat-card .stat-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem;
      margin: 0 auto 8px;
    }
    .stat-icon.blue { background: rgba(59,130,246,.12); color: #2563eb; }
    .stat-icon.green { background: rgba(34,197,94,.12); color: #16a34a; }
    .stat-icon.red { background: rgba(239,68,68,.12); color: #dc2626; }
    .stat-icon.gold { background: rgba(201,168,76,.15); color: var(--gold-dark); }
    .stat-icon.purple { background: rgba(139,92,246,.12); color: #7c3aed; }
    .cm-stat-card .stat-number {
      font-size: 1.15rem; font-weight: 900;
      color: var(--navy); line-height: 1.2;
      margin-bottom: 2px;
    }
    .stat-number.gold { color: var(--gold-dark); }
    .stat-number.green { color: #16a34a; }
    .stat-number.red { color: #dc2626; }
    .cm-stat-card .stat-label {
      font-size: 0.68rem; color: var(--gray-500);
      font-weight: 700; line-height: 1.2;
    }

    /* Toolbar */
    .cm-toolbar {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .cm-search {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    .cm-search input {
      width: 100%;
      padding: 10px 40px 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.88rem;
      background: var(--gray-50);
      outline: none;
      transition: var(--transition);
    }
    .cm-search input:focus {
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(201,168,76,.15);
    }
    .cm-search i {
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      pointer-events: none;
    }
    .cm-toolbar select {
      padding: 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.85rem;
      background: var(--gray-50);
      outline: none;
      cursor: pointer;
      min-width: 120px;
    }
    .cm-toolbar select:focus { border-color: var(--gold); background: var(--white); }
    .cm-toolbar .btn-icon-only {
      padding: 10px 14px;
      border: 2px solid var(--gray-200);
      background: var(--white);
      border-radius: var(--radius-sm);
      color: var(--gray-600);
      cursor: pointer;
      transition: var(--transition);
    }
    .cm-toolbar .btn-icon-only:hover {
      border-color: var(--gold);
      color: var(--gold-dark);
    }

    /* Grid */
    .cm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    /* Customer Card */
    .cust-card {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      padding: 14px 16px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cust-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 5px; height: 100%;
      background: var(--gold);
    }
    .cust-card.role-retail::before { background: linear-gradient(180deg, #22c55e, #16a34a); }
    .cust-card.role-wholesale::before { background: linear-gradient(180deg, var(--gold), var(--gold-dark)); }
    .cust-card.role-cardoona::before { background: linear-gradient(180deg, #8b5cf6, #7c3aed); }
    .cust-card.inactive { opacity: 0.65; background: var(--gray-50); }
    .cust-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold-light);
    }

    .cust-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .cust-name {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--navy);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .cust-name i { color: var(--gold); font-size: 0.85rem; }
    .cust-rating-stars {
      display: inline-flex;
      gap: 2px;
      font-size: 0.7rem;
      color: var(--gold);
      margin-right: 4px;
    }

    .cust-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      font-size: 0.65rem;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cust-status-badge.active {
      background: rgba(34,197,94,.15);
      color: #16a34a;
    }
    .cust-status-badge.inactive {
      background: rgba(107,114,128,.15);
      color: #4b5563;
    }
    .cust-status-badge.pending {
      background: rgba(245,158,11,.15);
      color: #d97706;
    }

    .cust-info-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--gray-600);
      min-width: 0;
    }
    .cust-info-row i {
      color: var(--gold);
      font-size: 0.72rem;
      width: 14px;
      text-align: center;
      flex-shrink: 0;
    }
    .cust-info-row .val {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .cust-info-row .val.code {
      font-family: 'Courier New', monospace;
      background: var(--gray-100);
      padding: 2px 8px;
      border-radius: 6px;
      color: var(--navy);
      font-weight: 800;
      font-size: 0.75rem;
      direction: ltr;
      display: inline-block;
      max-width: fit-content;
    }
    .cust-info-row .val.phone {
      direction: ltr;
      text-align: right;
      color: var(--navy);
      font-weight: 700;
    }

    .cust-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px dashed var(--gray-200);
    }
    .cust-metric {
      text-align: center;
      padding: 6px;
      border-radius: var(--radius-sm);
      background: var(--gray-50);
    }
    .cust-metric .m-val {
      font-size: 0.95rem;
      font-weight: 900;
      line-height: 1.2;
    }
    .cust-metric .m-val.green { color: #16a34a; }
    .cust-metric .m-val.red { color: #dc2626; }
    .cust-metric .m-val.gold { color: var(--gold-dark); }
    .cust-metric .m-lbl {
      font-size: 0.65rem;
      color: var(--gray-500);
      font-weight: 700;
      margin-top: 2px;
    }

    .cust-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      padding-top: 8px;
    }
    .cust-action-btn {
      padding: 8px 6px;
      border: 1.5px solid;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--white);
      white-space: nowrap;
    }
    .cust-action-btn.view {
      border-color: var(--gray-300);
      color: var(--gray-700);
    }
    .cust-action-btn.view:hover {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }
    .cust-action-btn.edit {
      border-color: #fcd34d;
      color: #d97706;
    }
    .cust-action-btn.edit:hover {
      background: #f59e0b;
      color: var(--white);
      border-color: #d97706;
    }
    .cust-action-btn.toggle {
      border-color: var(--gray-300);
      color: var(--gray-700);
    }
    .cust-action-btn.toggle.off {
      border-color: #86efac;
      color: #16a34a;
    }
    .cust-action-btn.toggle:hover {
      background: var(--gray-600);
      color: var(--white);
      border-color: var(--gray-600);
    }
    .cust-action-btn.toggle.off:hover {
      background: #22c55e;
      color: var(--white);
      border-color: #16a34a;
    }

    /* Special actions for cardoona pending */
    .cust-actions.cardoona-pending {
      grid-template-columns: 1fr 1fr 1fr 1fr;
    }
    .cust-action-btn.generate {
      border-color: var(--gold);
      color: var(--gold-dark);
      background: #fcf9f0;
    }
    .cust-action-btn.generate:hover {
      background: var(--gold);
      color: var(--navy);
    }
    .cust-action-btn.reject {
      border-color: #fca5a5;
      color: #dc2626;
    }
    .cust-action-btn.reject:hover {
      background: #dc2626;
      color: var(--white);
    }

    /* Empty / Loading */
    .cm-empty {
      text-align: center;
      padding: 60px 20px;
      background: var(--white);
      border-radius: var(--radius-md);
      border: 2px dashed var(--gray-300);
      grid-column: 1/-1;
    }
    .cm-empty .empty-icon {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: var(--gray-100);
      color: var(--gray-400);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto 16px;
    }
    .cm-empty h3 {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .cm-empty p {
      font-size: 0.85rem;
      color: var(--gray-500);
    }

    .cm-loading {
      text-align: center;
      padding: 60px 20px;
      background: var(--white);
      border-radius: var(--radius-md);
      border: 1px solid var(--gray-200);
      grid-column: 1/-1;
    }
    .cm-loading i { font-size: 2rem; color: var(--gold); margin-bottom: 10px; }

    /* Pagination */
    .cm-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .cm-page-btn {
      padding: 8px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      background: var(--white);
      color: var(--gray-700);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .cm-page-btn:hover:not(:disabled) {
      border-color: var(--gold);
      color: var(--gold-dark);
    }
    .cm-page-btn.active {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }
    .cm-page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Details Modal */
    .details-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--gray-100);
      overflow-x: auto;
    }
    .details-tab {
      padding: 10px 16px;
      border: none;
      background: none;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.82rem;
      color: var(--gray-500);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: var(--transition);
    }
    .details-tab:hover { color: var(--navy); }
    .details-tab.active {
      color: var(--navy);
      border-bottom-color: var(--gold);
    }

    .detail-section {
      background: var(--gray-50);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--gray-200);
    }
    .detail-section h4 {
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--navy);
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--gray-200);
    }
    .detail-section h4 i { color: var(--gold); }

    .detail-line {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.85rem;
      gap: 12px;
      flex-wrap: wrap;
    }
    .detail-line .lbl {
      color: var(--gray-500);
      font-weight: 700;
      flex-shrink: 0;
    }
    .detail-line .val {
      color: var(--navy);
      font-weight: 800;
      text-align: left;
      word-break: break-word;
    }
    .detail-line .val.code {
      font-family: 'Courier New', monospace;
      direction: ltr;
      background: var(--gray-100);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .rating-display {
      text-align: center;
      padding: 16px;
      background: linear-gradient(135deg, #fcf9f0, #f8f4e8);
      border: 2px solid var(--gold-light);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
    }
    .rating-display .stars-large {
      font-size: 2rem;
      color: var(--gold);
      margin-bottom: 8px;
      letter-spacing: 4px;
    }
    .rating-display .rating-label {
      font-size: 1rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 4px;
    }
    .rating-display .rating-meta {
      font-size: 0.78rem;
      color: var(--gray-500);
      font-weight: 700;
    }

    .invoice-mini-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: var(--white);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      font-size: 0.82rem;
      gap: 8px;
    }
    .invoice-mini-row .inv-num {
      font-family: 'Courier New', monospace;
      font-weight: 800;
      color: var(--navy);
      font-size: 0.78rem;
    }
    .invoice-mini-row .inv-amount {
      font-weight: 900;
      color: var(--gold-dark);
    }
    .invoice-mini-row .inv-days {
      font-size: 0.7rem;
      color: var(--gray-500);
      font-weight: 700;
    }

    /* Form Modal */
    .cm-form-modal { max-width: 560px; }
    .cm-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Responsive */
    @media (max-width: 768px) and (pointer: coarse) {
      .cm-header { padding: 16px; border-radius: var(--radius-md); }
      .cm-header-icon { width: 46px; height: 46px; font-size: 1.2rem; }
      .cm-header h1 { font-size: 1.05rem; }
      .cm-header p { font-size: 0.72rem; }
      .cm-header-actions .btn { font-size: 0.75rem; padding: 7px 12px; }

      .cm-tab { padding: 9px 14px; font-size: 0.78rem; }

      .cm-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .cm-stat-card { padding: 11px 8px; }
      .cm-stat-card .stat-icon { width: 34px; height: 34px; font-size: 0.9rem; }
      .cm-stat-card .stat-number { font-size: 1rem; }

      .cm-toolbar { padding: 10px; flex-direction: column; align-items: stretch; }
      .cm-search { min-width: 100%; }
      .cm-toolbar select { min-width: 100%; }

      .cm-grid { grid-template-columns: 1fr; gap: 10px; }

      .cust-card { padding: 12px 14px; }
      .cust-name { font-size: 0.88rem; }
      .cust-info-row { font-size: 0.72rem; }
      .cust-metric .m-val { font-size: 0.85rem; }

      .cm-form-row { grid-template-columns: 1fr; gap: 0; }
    }

    @media (max-width: 480px) {
      .cust-actions { grid-template-columns: 1fr 1fr; }
      .cust-actions.cardoona-pending { grid-template-columns: 1fr 1fr; }
      .cm-pagination { gap: 4px; }
      .cm-page-btn { padding: 6px 10px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>
  <div id="header-placeholder"></div>

  <main class="page-content">
    <div class="container">

      <!-- Page Header -->
      <div class="cm-header">
        <div class="cm-header-inner">
          <div class="cm-header-left">
            <div class="cm-header-icon">
              <i class="fas fa-users-cog"></i>
            </div>
            <div>
              <h1>إدارة العملاء</h1>
              <p>عرض وإدارة العملاء التجار والعملاء القطاعيين</p>
            </div>
          </div>
          <div class="cm-header-actions">
            <button class="btn btn-sm" onclick="exportCSV()">
              <i class="fas fa-file-export"></i> تصدير CSV
            </button>
            <button class="btn btn-sm" onclick="openAddCustomerModal()">
              <i class="fas fa-plus"></i> إضافة عميل
            </button>
          </div>
        </div>

      <div class="cm-tabs" id="cmTabs">
        <button class="cm-tab active" data-tab="retail" onclick="switchTab('retail')">
          <i class="fas fa-user"></i>
          <span>قطاعي</span>
          <span class="tab-count" id="tabCount-retail">0</span>
        </button>
        <button class="cm-tab" data-tab="wholesale" onclick="switchTab('wholesale')">
          <i class="fas fa-store"></i>
          <span>تجار الجملة</span>
          <span class="tab-count" id="tabCount-wholesale">0</span>
        </button>
        <button class="cm-tab" data-tab="cardoona" onclick="switchTab('cardoona')">
          <i class="fas fa-file-invoice-dollar"></i>
          <span>تجار كرتونة</span>
          <span class="tab-count" id="tabCount-cardoona">0</span>
        </button>
      </div>

      <!-- Stats -->
      <div class="cm-stats" id="cmStats">
        <div class="cm-stat-card">
          <div class="stat-icon blue"><i class="fas fa-users"></i></div>
          <div class="stat-number" id="statTotal">0</div>
          <div class="stat-label">إجمالي</div>
        </div>
        <div class="cm-stat-card">
          <div class="stat-icon green"><i class="fas fa-user-check"></i></div>
          <div class="stat-number green" id="statActive">0</div>
          <div class="stat-label">نشط</div>
        </div>
        <div class="cm-stat-card">
          <div class="stat-icon red"><i class="fas fa-user-slash"></i></div>
          <div class="stat-number red" id="statInactive">0</div>
          <div class="stat-label">معطل</div>
        </div>
        <div class="cm-stat-card">
          <div class="stat-icon gold"><i class="fas fa-hand-holding-dollar"></i></div>
          <div class="stat-number gold" id="statDebt">0</div>
          <div class="stat-label">إجمالي الديون</div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="cm-toolbar">
        <div class="cm-search">
          <input type="text" id="searchInput" placeholder="ابحث بالاسم / الهاتف / الكود..." oninput="onSearchInput()">
          <i class="fas fa-search"></i>
        </div>
        <select id="statusFilter" onchange="applyFilters()">
          <option value="">كل الحالات</option>
          <option value="active">نشط</option>
          <option value="inactive">معطل</option>
        </select>
        <select id="sortFilter" onchange="applyFilters()">
          <option value="newest">الأحدث</option>
          <option value="oldest">الأقدم</option>
          <option value="debt-high">الأعلى ديناً</option>
          <option value="debt-low">الأقل ديناً</option>
        </select>
        <button class="btn-icon-only" onclick="resetFilters()" title="إعادة تعيين">
          <i class="fas fa-undo"></i>
        </button>
      </div>

      <!-- Grid -->
      <div class="cm-grid" id="customersGrid">
        <div class="cm-loading">
          <i class="fas fa-spinner fa-spin"></i>
          <p>جاري تحميل العملاء...</p>
        </div>
      </div>

      <!-- Pagination -->
      <div class="cm-pagination" id="pagination"></div>

    </div>
  </main>

  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>
  <div id="footer-placeholder"></div>
  <div id="sidebar-placeholder"></div>
  <div id="toast-container"></div>

  <!-- ============================================================
       Scripts
       ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 admin/customers.html v2.0
    // ============================================================

    // ===== State =====
    let allCustomers = [];
    let filteredCustomers = [];
    let invoicesByCustomer = {};
    let ordersByCustomer = {};
    let currentTab = 'retail';
    let currentPage = 0;
    const PAGE_SIZE = 12;
    let searchDebounce = null;
    let unsubscribeCustomers = null;
    let currentAdminId = null;

    // ============================================================
    // 🚀 Init
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
      if (!protectAnyAdminPage()) return;

      const user = getCurrentUser();
      currentAdminId = user?.data?.id || user?.data?.uid;

      // Load invoices & orders first (for ratings)
      await loadInvoicesAndOrders();

      // Load customers (realtime)
      loadCustomers();

      // ESC handler
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeAllModals();
        }
      });
    });

    // ============================================================
    // 📥 Load Invoices & Orders (for ratings & stats)
    // ============================================================
    async function loadInvoicesAndOrders() {
      try {
        const ninetyDaysAgo = new Date();
        ninetyDaysAgo.setDate(ninetyDaysAgo.getDate() - 90);

        const [invoicesSnap, ordersSnap] = await Promise.all([
          db.collection(COLLECTIONS.INVOICES)
            .where('createdAt', '>=', ninetyDaysAgo)
            .limit(2000)
            .get(),
          db.collection(COLLECTIONS.ORDERS)
            .where('createdAt', '>=', ninetyDaysAgo)
            .limit(2000)
            .get()
        ]);

        invoicesByCustomer = {};
        ordersByCustomer = {};

        invoicesSnap.forEach(doc => {
          const inv = { id: doc.id, ...doc.data() };
          const cid = inv.customerId;
          if (!cid) return;
          if (!invoicesByCustomer[cid]) invoicesByCustomer[cid] = [];
          invoicesByCustomer[cid].push(inv);
        });

        ordersSnap.forEach(doc => {
          const ord = { id: doc.id, ...doc.data() };
          const cid = ord.customerId;
          if (!cid) return;
          if (!ordersByCustomer[cid]) ordersByCustomer[cid] = [];
          ordersByCustomer[cid].push(ord);
        });

      } catch (err) {
        console.warn('⚠️ Could not load invoices/orders:', err.code || err.message);
        invoicesByCustomer = {};
        ordersByCustomer = {};
      }
    }

    // ============================================================
    // 📥 Load Customers (realtime)
    // ============================================================
    function loadCustomers() {
      if (unsubscribeCustomers) unsubscribeCustomers();

      const grid = document.getElementById('customersGrid');
      if (grid) {
        grid.innerHTML = `
          <div class="cm-loading" style="grid-column:1/-1;">
            <i class="fas fa-spinner fa-spin"></i>
            <p>جاري تحميل العملاء...</p>
          </div>`;
      }

      unsubscribeCustomers = db.collection(COLLECTIONS.CUSTOMERS)
        .onSnapshot(snap => {
          allCustomers = [];
          snap.forEach(doc => {
            allCustomers.push({ id: doc.id, ...doc.data() });
          });

          updateTabCounts();
          updateStats();
          applyFilters();

        }, err => {
          console.error('loadCustomers error:', err);
          if (grid) {
            grid.innerHTML = `
              <div class="cm-empty" style="grid-column:1/-1;">
                <div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <h3>فشل التحميل</h3>
                <p>${err.code === 'permission-denied' ? 'ليس لديك صلاحية' : 'حدث خطأ في الاتصال'}</p>
              </div>`;
          }
        });
    }

    // ============================================================
    // 🎯 Tabs
    // ============================================================
    function switchTab(tab) {
      currentTab = tab;
      currentPage = 0;

      document.querySelectorAll('.cm-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });

      updateStats();
      applyFilters();
    }

    function getTabCustomers() {
      if (currentTab === 'retail') {
        return allCustomers.filter(c => c.role === ROLES.RETAIL);
      }
      if (currentTab === 'wholesale') {
        return allCustomers.filter(c =>
          c.role === ROLES.WHOLESALE && c.source !== 'cardoona'
        );
      }
      if (currentTab === 'cardoona') {
        return allCustomers.filter(c => c.source === 'cardoona');
      }
      return [];
    }

    function updateTabCounts() {
      const retail = allCustomers.filter(c => c.role === ROLES.RETAIL).length;
      const wholesale = allCustomers.filter(c =>
        c.role === ROLES.WHOLESALE && c.source !== 'cardoona'
      ).length;
      const cardoona = allCustomers.filter(c => c.source === 'cardoona').length;

      setText('tabCount-retail', retail);
      setText('tabCount-wholesale', wholesale);
      setText('tabCount-cardoona', cardoona);
    }

    // ============================================================
    // 📊 Stats
    // ============================================================
    function updateStats() {
      const list = getTabCustomers();
      const total = list.length;
      const active = list.filter(c => c.active !== false && c.pending_approval !== true).length;
      const inactive = total - active;
      const totalDebt = list.reduce((sum, c) => sum + (Number(c.balance) || 0), 0);

      setText('statTotal', total);
      setText('statActive', active);
      setText('statInactive', inactive);
      setText('statDebt', formatMoney(totalDebt));
    }

    function setText(id, val) {
      const el = document.getElementById(id);
      if (el) el.textContent = val;
    }

    function formatMoney(n) {
      if (!n || n === 0) return '0';
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return Math.round(n).toString();
    }

    // ============================================================
    // 🔍 Search & Filters
    // ============================================================
    function onSearchInput() {
      if (searchDebounce) clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        currentPage = 0;
        applyFilters();
      }, 300);
    }

    function applyFilters() {
      const search = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      const status = document.getElementById('statusFilter')?.value || '';
      const sort = document.getElementById('sortFilter')?.value || 'newest';

      let list = getTabCustomers();

      if (search) {
        list = list.filter(c => {
          const name = (c.name || '').toLowerCase();
          const phone = (c.phone || '').toLowerCase();
          const code = (c.code || '').toLowerCase();
          return name.includes(search) || phone.includes(search) || code.includes(search);
        });
      }

      if (status === 'active') {
        list = list.filter(c => c.active !== false && c.pending_approval !== true);
      } else if (status === 'inactive') {
        list = list.filter(c => c.active === false || c.pending_approval === true);
      }

      switch (sort) {
        case 'oldest':
          list.sort((a, b) => toMillis(a.createdAt) - toMillis(b.createdAt));
          break;
        case 'debt-high':
          list.sort((a, b) => (Number(b.balance) || 0) - (Number(a.balance) || 0));
          break;
        case 'debt-low':
          list.sort((a, b) => (Number(a.balance) || 0) - (Number(b.balance) || 0));
          break;
        default:
          list.sort((a, b) => toMillis(b.createdAt) - toMillis(a.createdAt));
      }

      filteredCustomers = list;
      renderCustomers();
      renderPagination();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('statusFilter').value = '';
      document.getElementById('sortFilter').value = 'newest';
      currentPage = 0;
      applyFilters();
    }

    function toMillis(ts) {
      if (!ts) return 0;
      if (ts.toMillis) return ts.toMillis();
      if (ts.toDate) return ts.toDate().getTime();
      if (ts instanceof Date) return ts.getTime();
      return 0;
    }

    // ============================================================
    // 🎨 Render
    // ============================================================
    function renderCustomers() {
      const grid = document.getElementById('customersGrid');
      if (!grid) return;

      if (filteredCustomers.length === 0) {
        grid.innerHTML = `
          <div class="cm-empty" style="grid-column:1/-1;">
            <div class="empty-icon"><i class="fas fa-users-slash"></i></div>
            <h3>لا يوجد عملاء</h3>
            <p>${currentTab === 'retail' ? 'لم يتم إضافة عملاء قطاعيين بعد' :
                currentTab === 'wholesale' ? 'لم يتم إضافة تجار بعد' :
                'لا يوجد تجار كرتونة'}</p>
          </div>`;
        return;
      }

      const start = currentPage * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const page = filteredCustomers.slice(start, end);

      grid.innerHTML = page.map(c => renderCustomerCard(c)).join('');
    }

    function renderCustomerCard(c) {
      const isActive = c.active !== false && c.pending_approval !== true;
      const isPending = c.pending_approval === true;

      const tabClass = c.source === 'cardoona' ? 'role-cardoona'
                     : c.role === ROLES.WHOLESALE ? 'role-wholesale'
                     : 'role-retail';

      const statusBadge = isPending
        ? `<span class="cust-status-badge pending"><i class="fas fa-clock"></i> معلق</span>`
        : isActive
        ? `<span class="cust-status-badge active"><i class="fas fa-check-circle"></i> نشط</span>`
        : `<span class="cust-status-badge inactive"><i class="fas fa-ban"></i> معطل</span>`;

      // Rating (wholesale + cardoona only)
      const showRating = c.role === ROLES.WHOLESALE;
      const rating = showRating ? calculateRating(c) : null;
      const starsHtml = rating
        ? `<span class="cust-rating-stars">${'★'.repeat(rating.stars)}${'☆'.repeat(5 - rating.stars)}</span>`
        : '';

      // Invoice stats
      const invoices = invoicesByCustomer[c.id] || [];
      const orders = ordersByCustomer[c.id] || [];
      const balance = Number(c.balance) || 0;
      const paid = invoices.filter(i => i.paymentStatus === 'paid').length;

      // Actions
      const canDelete = isSuperAdmin();
      const canGenerate = isSuperAdmin() && c.source === 'cardoona' && isPending;

      let actionsHtml = '';
      if (c.source === 'cardoona' && isPending && canGenerate) {
        actionsHtml = `
          <div class="cust-actions cardoona-pending">
            <button class="cust-action-btn view" onclick="event.stopPropagation();openDetailsModal('${c.id}')">
              <i class="fas fa-eye"></i> تفاصيل
            </button>
            <button class="cust-action-btn generate" onclick="event.stopPropagation();openGenerateCodeModal('${c.id}')">
              <i class="fas fa-key"></i> كود
            </button>
            <button class="cust-action-btn reject" onclick="event.stopPropagation();openRejectModal('${c.id}')">
              <i class="fas fa-times"></i> رفض
            </button>
            ${canDelete ? `
              <button class="cust-action-btn toggle" onclick="event.stopPropagation();toggleActive('${c.id}')">
                <i class="fas fa-trash"></i>
              </button>
            ` : ''}
          </div>`;
      } else {
        actionsHtml = `
          <div class="cust-actions">
            <button class="cust-action-btn view" onclick="event.stopPropagation();openDetailsModal('${c.id}')">
              <i class="fas fa-eye"></i> تفاصيل
            </button>
            <button class="cust-action-btn edit" onclick="event.stopPropagation();openEditCustomerModal('${c.id}')">
              <i class="fas fa-pen"></i> تعديل
            </button>
            <button class="cust-action-btn toggle ${isActive ? '' : 'off'}" onclick="event.stopPropagation();toggleActive('${c.id}')">
              <i class="fas ${isActive ? 'fa-eye-slash' : 'fa-eye'}"></i>
              ${isActive ? 'تعطيل' : 'تفعيل'}
            </button>
          </div>`;
      }

      return `
        <div class="cust-card ${tabClass} ${isActive ? '' : 'inactive'}"
             onclick="openDetailsModal('${c.id}')">
          <div class="cust-card-head">
            <div class="cust-name">
              <i class="fas fa-user"></i>
              ${escapeHtml(c.name || 'بدون اسم')}
              ${starsHtml}
            </div>
            ${statusBadge}
          </div>

          ${c.code ? `
            <div class="cust-info-row">
              <i class="fas fa-key"></i>
              <span class="val code">${escapeHtml(c.code)}</span>
            </div>` : ''}

          ${c.phone ? `
            <div class="cust-info-row">
              <i class="fas fa-phone"></i>
              <span class="val phone">${escapeHtml(c.phone)}</span>
            </div>` : ''}

          ${(c.city || c.address) ? `
            <div class="cust-info-row">
              <i class="fas fa-map-marker-alt"></i>
              <span class="val">${escapeHtml(c.city || c.address || '')}</span>
            </div>` : ''}

          <div class="cust-metrics">
            <div class="cust-metric">
              <div class="m-val ${balance > 0 ? 'red' : balance < 0 ? 'green' : 'green'}">
                ${balance !== 0 ? Math.abs(balance).toLocaleString('en-US', {maximumFractionDigits: 0}) + ' ج.م' : '0 ج.م'}
              </div>
              <div class="m-lbl">${balance > 0 ? 'مديونية' : balance < 0 ? 'رصيد دائن' : 'مسدد'}</div>
            </div>
            <div class="cust-metric">
              <div class="m-val gold">${invoices.length}</div>
              <div class="m-lbl">فواتير</div>
            </div>
          </div>

          ${actionsHtml}
        </div>
      `;
    }

    // ============================================================
    // ⭐ Rating Calculation
    // ============================================================
    function calculateRating(customer) {
      if (customer.role !== ROLES.WHOLESALE) return null;

      // Cash customers = 5 stars automatically
      if (customer.businessType === 'cash' || customer.paymentType === 'cash') {
        return { stars: 5, label: 'عميل نقدي ممتاز', avgDays: 0, isCash: true };
      }

      const invoices = invoicesByCustomer[customer.id] || [];
      const paidInvoices = invoices.filter(i =>
        i.paymentStatus === 'paid' && i.paidAt && i.createdAt
      );

      if (paidInvoices.length === 0) {
        return { stars: 0, label: 'لا يوجد سجل سداد', avgDays: 0, count: 0 };
      }

      // Consider last 10 paid
      const recent = paidInvoices.slice(-10);
      const totalDays = recent.reduce((sum, inv) => {
        const created = toMillis(inv.createdAt);
        const paid = toMillis(inv.paidAt);
        if (!created || !paid) return sum;
        return sum + Math.max(0, (paid - created) / (1000 * 60 * 60 * 24));
      }, 0);
      const avgDays = totalDays / recent.length;

      let stars;
      if (avgDays <= 3) stars = 5;
      else if (avgDays <= 5) stars = 4;
      else if (avgDays <= 7) stars = 3;
      else if (avgDays <= 10) stars = 2;
      else stars = 1;

      return {
        stars,
        avgDays: Math.round(avgDays),
        count: paidInvoices.length,
        label: stars >= 4 ? 'ممتاز' : stars >= 3 ? 'جيد' : 'يحتاج متابعة'
      };
    }

    // ============================================================
    // 📄 Pagination
    // ============================================================
    function renderPagination() {
      const container = document.getElementById('pagination');
      if (!container) return;

      const totalPages = Math.ceil(filteredCustomers.length / PAGE_SIZE);
      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '';
      html += `<button class="cm-page-btn" ${currentPage === 0 ? 'disabled' : ''}
                onclick="goToPage(${currentPage - 1})">
                <i class="fas fa-chevron-right"></i> السابق
              </button>`;

      const start = Math.max(0, currentPage - 2);
      const end = Math.min(totalPages, currentPage + 3);

      for (let i = start; i < end; i++) {
        html += `<button class="cm-page-btn ${i === currentPage ? 'active' : ''}"
                  onclick="goToPage(${i})">${i + 1}</button>`;
      }

      html += `<button class="cm-page-btn" ${currentPage >= totalPages - 1 ? 'disabled' : ''}
                onclick="goToPage(${currentPage + 1})">
                التالي <i class="fas fa-chevron-left"></i>
              </button>`;

      container.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      renderCustomers();
      renderPagination();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // 📋 Details Modal
    // ============================================================
    let detailsActiveTab = 'info';

    function openDetailsModal(customerId) {
      const c = allCustomers.find(x => x.id === customerId);
      if (!c) return;

      const invoices = invoicesByCustomer[c.id] || [];
      const orders = ordersByCustomer[c.id] || [];
      const rating = calculateRating(c);
      const balance = Number(c.balance) || 0;

      const status = c.pending_approval === true ? 'معلق'
        : c.active !== false ? 'نشط' : 'معطل';

      const roleLabel = c.role === ROLES.WHOLESALE ? 'تاجر جملة'
        : c.role === ROLES.RETAIL ? 'عميل قطاعي' : c.role;

      const sourceLabel = c.source === 'cardoona' ? 'كرتونة'
        : c.source === 'cashier' ? 'كاشير' : 'الموقع';

      const html = `
        <div class="modal-overlay show" id="detailsModal" onclick="closeDetailsModal(event)">
          <div class="modal-content medium" onclick="event.stopPropagation()">

            <div class="modal-header">
              <h3>
                <i class="fas fa-user"></i>
                ${escapeHtml(c.name || 'عميل')}
              </h3>
              <button class="modal-close" onclick="closeDetailsModal()">
                <i class="fas fa-times"></i>
              </button>
            </div>

            <div class="modal-body">

              <!-- Rating Display -->
              ${rating ? `
                <div class="rating-display">
                  <div class="stars-large">
                    ${'★'.repeat(rating.stars)}${'☆'.repeat(5 - rating.stars)}
                  </div>
                  <div class="rating-label">${rating.label}</div>
                  <div class="rating-meta">
                    ${rating.isCash
                      ? 'عميل نقدي — يدفع فوراً'
                      : rating.count > 0
                      ? `متوسط السداد: ${rating.avgDays} يوم · ${rating.count} فاتورة`
                      : 'لا يوجد سجل سداد بعد'}
                  </div>
                </div>
              ` : ''}

              <!-- Tabs -->
              <div class="details-tabs">
                <button class="details-tab active" data-dtab="info" onclick="switchDetailsTab('info')">
                  <i class="fas fa-info-circle"></i> البيانات
                </button>
                <button class="details-tab" data-dtab="financial" onclick="switchDetailsTab('financial')">
                  <i class="fas fa-wallet"></i> المالية
                </button>
                ${rating ? `
                  <button class="details-tab" data-dtab="rating" onclick="switchDetailsTab('rating')">
                    <i class="fas fa-star"></i> التقييم
                  </button>` : ''}
                <button class="details-tab" data-dtab="invoices" onclick="switchDetailsTab('invoices')">
                  <i class="fas fa-file-invoice"></i> الفواتير
                </button>
              </div>

              <div id="detailsContent"></div>

            </div>

            <div class="modal-actions">
              <button class="btn btn-outline" onclick="closeDetailsModal()">إغلاق</button>
              ${c.source === 'cardoona' && c.pending_approval && isSuperAdmin() ? `

    function generateCustomerCode() {
      const role = document.getElementById('custRole').value;
      const city = document.getElementById('custCity').value || 'MHL';
      const cityCodes = { 'المحلة': 'MHL', 'طنطا': 'TNT', 'المنصورة': 'MNS', 'أخرى': 'OTH' };
      const prefix = role === 'wholesale' ? (cityCodes[city] || 'OTH') : 'C';
      const code = generateCode(prefix + '-', 4);
      document.getElementById('custCode').value = code;
    }

    async function saveCustomer(event) {
      if (event) event.preventDefault();

      const btn = document.getElementById('saveCustomerBtn');
      const id = document.getElementById('custId').value;

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const phone2 = document.getElementById('custPhone2').value.trim();
      const city = document.getElementById('custCity').value;
      const role = document.getElementById('custRole').value;
      const address = document.getElementById('custAddress').value.trim();
      const balance = parseFloat(document.getElementById('custBalance').value) || 0;
      const code = document.getElementById('custCode').value.trim();
      const notes = document.getElementById('custNotes').value.trim();

      if (!name || name.length < 3) {
        showToast('ادخل الاسم الكامل', 'warning');
        return;
      }
      if (!validatePhone(phone)) {
        showToast('رقم الهاتف غير صحيح', 'warning');
        return;
      }
      if (phone2 && !validatePhone(phone2)) {
        showToast('رقم الهاتف البديل غير صحيح', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      try {
        const payload = {
          name, phone, phone2: phone2 || '',
          city: city || '', address: address || '',
          role, balance,
          notes: notes || '',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (!id) {
          // New customer
          payload.active = true;
          payload.source = 'manual';
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          payload.createdBy = currentAdminId;
          if (code) payload.code = code;

          await db.collection(COLLECTIONS.CUSTOMERS).add(payload);
          showToast('✅ تم إضافة العميل', 'success');
        } else {
          // Edit
          const existing = allCustomers.find(x => x.id === id);
          // Only update code if it's currently empty
          if (!existing?.code && code) payload.code = code;
          await db.collection(COLLECTIONS.CUSTOMERS).doc(id).update(payload);
          showToast('✅ تم تحديث العميل', 'success');
        }

        closeCustomerFormModal();
      } catch (err) {
        console.error('saveCustomer error:', err);
        showToast('فشل الحفظ: ' + (err.message || 'خطأ'), 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
      }
    }

    function updateGeneratedCodePreview() {

    async function confirmGenerateCode(customerId) {
      const c = allCustomers.find(x => x.id === customerId);
      if (!c) return;

      const code = document.getElementById('genCode').value.trim();
      if (!code || !/^[A-Z]{3}-[A-Z0-9]{4}$/.test(code)) {
        showToast('الكود غير صحيح', 'warning');
        return;
      }

      const btn = document.getElementById('genCodeBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التوليد...';

      try {
        // 1. Check if code already exists
        const existing = await db.collection(COLLECTIONS.TRADER_LOOKUP).doc(code).get();
        if (existing.exists) {
          showToast('الكود مستخدم بالفعل، جرب كود آخر', 'warning');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-check"></i> تأكيد وتوليد';
          return;
        }

        // 2. Create Firebase Auth account (secondary app)
        const secondaryName = 'TraderCreator_' + Date.now();
        const secondaryApp = firebase.initializeApp(firebaseConfig, secondaryName);
        const secondaryAuth = secondaryApp.auth();

        const authEmail = `${code.toLowerCase()}@trader.awladshalaan.com`;
        const userCred = await secondaryAuth.createUserWithEmailAndPassword(authEmail, code);
        const uid = userCred.user.uid;

        await secondaryAuth.signOut();
        await secondaryApp.delete();

        // 3. Update customer + create lookup
        const now = firebase.firestore.FieldValue.serverTimestamp();

        await db.collection(COLLECTIONS.CUSTOMERS).doc(customerId).update({
          uid, code, authEmail,
          active: true,
          pending_approval: false,
          approvedBy: currentAdminId,
          approvedAt: now,
          updatedAt: now
        });

        await db.collection(COLLECTIONS.TRADER_LOOKUP).doc(code).set({
          customerId,
          authEmail, code,
          name: c.name,
          phone: c.phone || '',
          role: ROLES.WHOLESALE,
          active: true,
          createdAt: now
        });

        showToast(`✅ تم توليد الكود ${code}`, 'success');
        closeGenerateCodeModal();

        // Show result
        setTimeout(() => showCodeResult(code, authEmail, c.name, c.phone), 300);

      } catch (err) {
        console.error('confirmGenerateCode error:', err);
        showToast('فشل التوليد: ' + (err.message || 'خطأ'), 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> تأكيد وتوليد';
      }
    }

    function showCodeResult(code, email, name, phone) {
      const waMsg = encodeURIComponent(
        `مرحباً ${name}\n\nتم تفعيل حسابك كتاجر في أولاد شعلان\n\n` +
        `🔑 كود الدخول: ${code}\n` +
        `📧 الإيميل: ${email}\n\n` +
        `رابط الدخول: https://awladsh3laan.github.io/gomla/trader-login.html`
      );
      const waPhone = (phone || '').replace(/^0/, '20');

      const html = `
        <div class="modal-overlay show" id="codeResultModal" onclick="closeCodeResultModal(event)">
          <div class="modal-content small" onclick="event.stopPropagation()">
            <div class="modal-header" style="background:linear-gradient(135deg,#065f46,#10b981);color:white;">
              <h3><i class="fas fa-check-circle"></i> تم توليد الكود بنجاح</h3>
              <button class="modal-close" onclick="closeCodeResultModal()" style="color:white;background:rgba(255,255,255,.15);">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="modal-body">
              <div style="background:#f0fdf4;border:2px solid #86efac;border-radius:8px;padding:16px;margin-bottom:14px;text-align:center;">
                <div style="font-size:0.75rem;color:#16a34a;font-weight:800;margin-bottom:6px;">كود الدخول</div>
                <div style="font-family:'Courier New',monospace;font-size:1.8rem;font-weight:900;color:#065f46;letter-spacing:3px;margin-bottom:10px;">${code}</div>
                <button onclick="copyToClipboard('${code}')"
                        style="background:#16a34a;color:white;border:none;padding:8px 16px;border-radius:6px;font-weight:800;cursor:pointer;font-family:inherit;">
                  <i class="fas fa-copy"></i> نسخ
                </button>
              </div>

              <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:12px;margin-bottom:14px;font-size:0.8rem;word-break:break-all;">
                <div style="font-weight:800;color:#065f46;margin-bottom:4px;">الإيميل</div>
                <div style="font-family:monospace;direction:ltr;color:#1e293b;">${email}</div>
              </div>

              <p style="font-size:0.8rem;color:var(--gray-600);text-align:center;margin-bottom:14px;">
                <i class="fas fa-info-circle" style="color:var(--gold);"></i>
                انسخ البيانات وأرسلها للتاجر عبر واتساب
              </p>
            </div>
            <div class="modal-actions">
              <button class="btn btn-outline" onclick="closeCodeResultModal()">إغلاق</button>
              <a href="https://wa.me/${waPhone}?text=${waMsg}" target="_blank"
                 class="btn btn-gold" style="text-decoration:none;">
                <i class="fab fa-whatsapp"></i> واتساب
              </a>
            </div>
          </div>
        </div>
      `;

      const old = document.getElementById('codeResultModal');
      if (old) old.remove();
      document.body.insertAdjacentHTML('beforeend', html);
    }

    function closeCodeResultModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const m = document.getElementById('codeResultModal');
      if (m) m.remove();
      document.body.style.overflow = '';
    }

    function closeGenerateCodeModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const m = document.getElementById('generateCodeModal');
      if (m) m.remove();
      document.body.style.overflow = '';
    }

    // ============================================================
    // ❌ Reject Customer (Cardoona)
    // ============================================================
    function openRejectModal(customerId) {
      const c = allCustomers.find(x => x.id === customerId);
      if (!c) return;

      const html = `
        <div class="modal-overlay show" id="rejectModal" onclick="closeRejectModal(event)">
          <div class="modal-content small" onclick="event.stopPropagation()">
            <div class="modal-header" style="background:linear-gradient(135deg,#991b1b,#dc2626);color:white;">
              <h3><i class="fas fa-times-circle"></i> رفض الطلب</h3>
              <button class="modal-close" onclick="closeRejectModal()" style="color:white;background:rgba(255,255,255,.15);">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="modal-body">
              <div class="alert-box danger" style="margin-bottom:14px;">
                <i class="fas fa-exclamation-triangle"></i>
                <div>سيتم رفض "${escapeHtml(c.name)}" وإخفاؤه من قائمة التجار المعلقين.</div>
              </div>
              <div class="form-group">
                <label>سبب الرفض <span style="color:var(--danger);">*</span></label>
                <textarea id="rejectReason" maxlength="300" placeholder="اكتب السبب..."
                          style="width:100%;padding:10px;border:1.5px solid var(--gray-200);border-radius:8px;font-family:inherit;min-height:70px;"></textarea>
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-outline" onclick="closeRejectModal()">إلغاء</button>
              <button class="btn btn-red" id="rejectBtn" onclick="confirmReject('${c.id}')">
                <i class="fas fa-times"></i> رفض نهائي
              </button>
            </div>
          </div>
        </div>
      `;

      const old = document.getElementById('rejectModal');
      if (old) old.remove();
      document.body.insertAdjacentHTML('beforeend', html);
      document.body.style.overflow = 'hidden';
    }

    async function confirmReject(customerId) {
      const reason = document.getElementById('rejectReason').value.trim();
      if (!reason || reason.length < 5) {
        showToast('اكتب سبب الرفض (5 حروف على الأقل)', 'warning');
        return;
      }

      const btn = document.getElementById('rejectBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الرفض...';

      try {
        await db.collection(COLLECTIONS.CUSTOMERS).doc(customerId).update({
          pending_approval: false,
          rejected: true,
          rejectionReason: reason,
          rejectedBy: currentAdminId,
          rejectedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast('✅ تم رفض الطلب', 'success');
        closeRejectModal();
      } catch (err) {
        console.error(err);
        showToast('فشل الرفض', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-times"></i> رفض نهائي';
      }
    }

    function closeRejectModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const m = document.getElementById('rejectModal');
      if (m) m.remove();
      document.body.style.overflow = '';
    }

    // ============================================================
    // 📥 Export CSV
    // ============================================================
    function exportCSV() {
      if (filteredCustomers.length === 0) {
        showToast('لا يوجد عملاء للتصدير', 'warning');
        return;
      }

      let csv = 'الاسم,الهاتف,الكود,المدينة,العنوان,الرصيد,الدور,الحالة\n';
      filteredCustomers.forEach(c => {
        const status = c.pending_approval ? 'معلق' : c.active !== false ? 'نشط' : 'معطل';
        csv += `"${c.name || ''}","${c.phone || ''}","${c.code || ''}","${c.city || ''}","${c.address || ''}",${c.balance || 0},"${c.role === 'wholesale' ? 'تاجر' : 'عميل'}","${status}"\n`;
      });

      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `customers_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('✅ تم التصدير', 'success');
    }

    // ============================================================
    // 🛠️ Helpers
    // ============================================================
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function escapeAttr(s) {
      return String(s ?? '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function closeAllModals() {
      ['detailsModal', 'customerFormModal', 'generateCodeModal',
       'rejectModal', 'codeResultModal'].forEach(id => {
        const m = document.getElementById(id);
        if (m) m.remove();
      });
      document.body.style.overflow = '';
    }

    // ============================================================
    // 🌐 Exports
    // ============================================================
    window.switchTab = switchTab;
    window.applyFilters = applyFilters;
    window.resetFilters = resetFilters;
    window.onSearchInput = onSearchInput;
    window.goToPage = goToPage;
    window.openDetailsModal = openDetailsModal;
    window.closeDetailsModal = closeDetailsModal;
    window.switchDetailsTab = switchDetailsTab;
    window.openAddCustomerModal = openAddCustomerModal;
    window.openEditCustomerModal = openEditCustomerModal;
    window.closeCustomerFormModal = closeCustomerFormModal;
    window.saveCustomer = saveCustomer;
    window.generateCustomerCode = generateCustomerCode;
    window.toggleActive = toggleActive;
    window.openGenerateCodeModal = openGenerateCodeModal;
    window.closeGenerateCodeModal = closeGenerateCodeModal;
    window.updateGeneratedCodePreview = updateGeneratedCodePreview;
    window.regenerateCode = regenerateCode;
    window.confirmGenerateCode = confirmGenerateCode;
    window.closeCodeResultModal = closeCodeResultModal;
    window.openRejectModal = openRejectModal;
    window.closeRejectModal = closeRejectModal;
    window.confirmReject = confirmReject;
    window.exportCSV = exportCSV;
  </script>

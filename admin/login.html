lo<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أولاد شعلان جملة - دخول المديرين</title>

  <!-- ===== SEO ===== -->
  <meta name="description" content="دخول المديرين - أولاد شعلان جملة">
  <meta name="theme-color" content="#1a2a4a">

  <!-- ===== Font Awesome ===== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- ===== Google Font ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- ===== الستايل الموحد ===== -->
  <link rel="stylesheet" href="../assets/css/style.css">

  <!-- ===== Favicon ===== -->
  <link rel="icon" href="../assets/images/favicon.ico">

  <!-- ============================================================ -->
  <!-- 🎨 ستايل خاص بالصفحة (فقط لدخول المديرين)                    -->
  <!-- ============================================================ -->
  <style>
    /* ===== صفحة الدخول ===== */
    .login-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--gray-50);
    }

    .login-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 44px 36px;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-md);
      text-align: center;
      border-top: 5px solid var(--gold);
      animation: fadeInUp 0.6s ease both;
    }

    .login-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .login-card .login-icon {
      font-size: 3.5rem;
      color: var(--gold);
      display: block;
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }

    .login-card h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .login-card .subtitle {
      color: var(--gray-400);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .login-card .form-group {
      margin-bottom: 18px;
      text-align: right;
    }

    .login-card .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--gray-600);
      margin-bottom: 4px;
    }

    .login-card .form-group label i {
      color: var(--gold);
      margin-left: 4px;
    }

    .login-card .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      transition: 0.3s ease;
      background: var(--gray-50);
    }

    .login-card .form-group input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
      background: var(--white);
    }

    .login-card .password-wrapper {
      position: relative;
    }

    .login-card .password-wrapper input {
      padding-left: 48px;
    }

    .login-card .toggle-password {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--gray-400);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
    }

    .login-card .toggle-password:hover {
      color: var(--navy);
    }

    .login-card .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-full);
      background: var(--navy);
      color: var(--white);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: 0.3s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-card .login-btn:hover {
      background: var(--gold);
      color: var(--navy);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(201, 168, 76, 0.35);
    }

    .login-card .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-card .error-msg {
      color: #dc2626;
      font-size: 0.9rem;
      margin: 12px 0 16px;
      padding: 10px 16px;
      background: #fef2f2;
      border-radius: var(--radius-sm);
      display: none;
      border-right: 3px solid #dc2626;
    }

    .login-card .error-msg.show {
      display: block;
    }

    .login-card .back-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--gray-400);
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.3s ease;
    }

    .login-card .back-link:hover {
      color: var(--gold);
    }

    /* ===== استجابة ===== */
    @media (max-width: 768px) {
      .login-card {
        padding: 32px 20px;
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 24px 16px;
      }
      .login-card h1 {
        font-size: 1.3rem;
      }
      .login-card .login-icon {
        font-size: 2.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================ -->
  <!-- 🧠 الهيدر (يتم تحميله من main.js)                            -->
  <!-- ============================================================ -->
  <div id="header-placeholder"></div>

  <!-- ============================================================ -->
  <!-- 📄 محتوى صفحة الدخول                                          -->
  <!-- ============================================================ -->
  <section class="login-page">
    <div class="login-card">
      <span class="login-icon"><i class="fas fa-user-shield"></i></span>
      <h1>دخول المديرين</h1>
      <p class="subtitle">أدخل بياناتك للوصول إلى لوحة التحكم</p>

      <form id="adminLoginForm">
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
          <input type="email" id="adminEmail" placeholder="admin@example.com" required autofocus>
        </div>

        <div class="form-group">
          <label><i class="fas fa-lock"></i> كلمة السر</label>
          <div class="password-wrapper">
            <input type="password" id="adminPassword" placeholder="••••••••" required>
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
              <i class="fas fa-eye" id="passwordIcon"></i>
            </button>
          </div>
        </div>

        <div id="loginError" class="error-msg">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorText">البريد الإلكتروني أو كلمة السر غير صحيحة</span>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> دخول
        </button>
      </form>

      <a href="/gomla/" class="back-link">
        <i class="fas fa-arrow-right"></i> العودة للرئيسية
      </a>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- 👣 الفوتر (يتم تحميله من main.js)                            -->
  <!-- ============================================================ -->
  <div id="footer-placeholder"></div>

  <!-- ============================================================ -->
  <!-- 🧠 السايدبار (يتم تحميله من main.js)                         -->
  <!-- ============================================================ -->
  <div id="sidebar-placeholder"></div>

  <!-- ============================================================ -->
  <!-- 🍞 Toast Container                                            -->
  <!-- ============================================================ -->
  <div id="toast-container"></div>

  <!-- ============================================================ -->
  <!-- 📚 Firebase & JavaScript                                      -->
  <!-- ============================================================ -->

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/main.js"></script>

  <!-- ============================================================ -->
  <!-- 📝 كود الصفحة الخاص (دخول المديرين)                          -->
  <!-- ============================================================ -->
  <script>
    // ============================================================
    // 🔐 دخول المديرين - admin/login.html
    // ============================================================

    // ===== استخدام آمن لـ db و auth =====
    const db = window.db || firebase.firestore();
    const auth = window.auth || firebase.auth();

    // ===== عناصر الصفحة =====
    const form = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('adminEmail');
    const passwordInput = document.getElementById('adminPassword');
    const loginBtn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('loginError');
    const errorText = document.getElementById('errorText');

    // ===== إظهار/إخفاء كلمة السر =====
    function togglePasswordVisibility() {
      const icon = document.getElementById('passwordIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // ===== تسجيل الدخول =====
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // ===== التحقق من الإدخال =====
      if (!email || !password) {
        errorText.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة السر';
        errorDiv.classList.add('show');
        return;
      }

      // ===== إخفاء الخطأ السابق =====
      errorDiv.classList.remove('show');

      // ===== تعطيل الزر =====
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';

      // ===== تسجيل الدخول عبر Firebase Auth =====
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;

          // ===== التحقق من وجود المدير في Firestore =====
          return db.collection('admins').doc(user.uid).get();
        })
        .then((doc) => {
          if (!doc.exists) {
            // ===== إذا لم يكن مديراً =====
            auth.signOut();
            errorText.textContent = 'غير مصرح لك بالدخول إلى لوحة التحكم';
            errorDiv.classList.add('show');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
            return;
          }

          // ===== استخراج بيانات المدير =====
          const adminData = doc.data();
          adminData.id = doc.id;

          // ===== حفظ بيانات المدير =====
          localStorage.setItem('admin', JSON.stringify(adminData));
          localStorage.setItem('adminId', doc.id);

          // ===== عرض رسالة ترحيب =====
          showToast(`✅ مرحباً ${adminData.name}`, 'success');

          // ===== تحديث السايدبار والهيدر =====
          if (typeof updateSidebar === 'function') updateSidebar();
          if (typeof updateHeader === 'function') updateHeader();

        
          // ===== رسائل خطأ محددة =====
          let message = 'البريد الإلكتروني أو كلمة السر غير صحيحة';
          if (error.code === 'auth/user-not-found') {
            message = 'لا يوجد حساب بهذا البريد الإلكتروني';
          } else if (error.code === 'auth/wrong-password') {
            message = 'كلمة السر غير صحيحة';
          } else if (error.code === 'auth/too-many-requests') {
            message = 'تم تجاوز عدد المحاولات، يرجى المحاولة لاحقاً';
          }

          errorText.textContent = message;
          errorDiv.classList.add('show');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
        });
    });

    // ===== دخول بالضغط على Enter =====
    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        form.dispatchEvent(new Event('submit'));
      }
    });

    // ===== التحقق من عدم وجود جلسة مفتوحة =====
    document.addEventListener('DOMContentLoaded', function() {
      const adminData = localStorage.getItem('admin');
      if (adminData) {
        // إذا كان المدير مسجلاً بالفعل، نحوله للوحة التحكم
        window.location.href = '/gomla/admin/dashboard.html';
      }
    });

    // ===== تصدير الدوال للاستخدام العالمي =====
    window.togglePasswordVisibility = togglePasswordVisibility;
  </script>

</body>
</html>

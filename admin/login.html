<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أولاد شعلان جملة - دخول المديرين</title>

  <meta name="description" content="دخول المديرين والمشرفين - أولاد شعلان جملة">
  <meta name="theme-color" content="#1a2a4a">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="../assets/images/favicon.ico">

  <style>
    /* ===== نفس الستايل الموحد بتاع الصفحة الرئيسية ودخول العملاء ===== */
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy: #1a2a4a;
      --navy-light: #2a3f6a;
      --navy-dark: #0f1a2e;
      --gold: #c9a84c;
      --gold-light: #e8d5a3;
      --white: #ffffff;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-400: #94a3b8;
      --gray-600: #475569;
      --gray-800: #1e293b;
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.12);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-full: 9999px;
    }

    html {
      scroll-behavior: smooth;
      direction: rtl;
    }

    body {
      font-family: 'Tajawal', -apple-system, sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ===== الهيدر ===== */
    .smart-header {
      background: var(--navy);
      color: var(--white);
      padding: 14px 0;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 3px solid var(--gold);
    }

    .smart-header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .smart-header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--white);
      text-decoration: none;
    }

    .smart-header .logo img {
      height: 44px;
      border-radius: 10px;
    }

    .smart-header .logo small {
      font-size: 0.7rem;
      font-weight: 400;
      opacity: 0.8;
    }

    .smart-header .logo .gold {
      color: var(--gold);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-actions .btn {
      padding: 8px 20px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions .btn-gold {
      background: var(--gold);
      color: var(--navy);
    }

    .header-actions .btn-gold:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(201, 168, 76, 0.35);
    }

    .header-actions .btn-outline {
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--white);
    }

    .header-actions .btn-outline:hover {
      background: var(--gold);
      color: var(--navy);
      transform: translateY(-2px);
    }

    /* ===== صفحة الدخول ===== */
    .login-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      background: var(--gray-50);
    }

    .login-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 44px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-md);
      text-align: center;
      border-top: 5px solid var(--gold);
      animation: fadeInUp 0.6s ease both;
      transition: all 0.3s ease;
    }

    .login-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .login-card .login-icon {
      font-size: 3.8rem;
      color: var(--gold);
      display: block;
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }

    .login-card h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .login-card .subtitle {
      color: var(--gray-400);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .login-card .form-group {
      margin-bottom: 18px;
      text-align: right;
    }

    .login-card .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--gray-600);
      margin-bottom: 4px;
    }

    .login-card .form-group label i {
      color: var(--gold);
      margin-left: 4px;
    }

    .login-card .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s ease;
      background: var(--gray-50);
    }

    .login-card .form-group input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
      background: var(--white);
    }

    .login-card .password-wrapper {
      position: relative;
    }

    .login-card .password-wrapper input {
      padding-left: 48px;
    }

    .login-card .toggle-password {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--gray-400);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
    }

    .login-card .toggle-password:hover {
      color: var(--navy);
    }

    .login-card .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-full);
      background: var(--navy);
      color: var(--white);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-card .login-btn:hover {
      background: var(--gold);
      color: var(--navy);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(201, 168, 76, 0.35);
    }

    .login-card .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-card .error-msg {
      color: #dc2626;
      font-size: 0.9rem;
      margin: 12px 0 16px;
      padding: 10px 16px;
      background: #fef2f2;
      border-radius: var(--radius-sm);
      display: none;
      border-right: 3px solid #dc2626;
    }

    .login-card .error-msg.show {
      display: block;
    }

    .login-card .back-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--gray-400);
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.3s ease;
    }

    .login-card .back-link:hover {
      color: var(--gold);
    }

    /* ===== الفوتر ===== */
    .smart-footer {
      background: var(--navy-dark);
      color: rgba(255, 255, 255, 0.85);
      padding: 28px 0;
      margin-top: 0;
      border-top: 3px solid var(--gold);
    }

    .smart-footer .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .smart-footer .footer-links {
      display: flex;
      gap: 20px;
    }

    .smart-footer .footer-links a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: 0.3s ease;
    }

    .smart-footer .footer-links a:hover {
      color: var(--gold);
    }

    .smart-footer .social-icons {
      display: flex;
      gap: 12px;
    }

    .smart-footer .social-icons a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      color: var(--white);
      text-decoration: none;
      transition: 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .smart-footer .social-icons a:hover {
      background: var(--gold);
      color: var(--navy);
      transform: translateY(-3px);
    }

    /* ===== السايدبار ===== */
    .smart-sidebar {
      position: fixed;
      top: 0;
      right: -380px;
      width: 360px;
      height: 100%;
      background: var(--white);
      z-index: 9999;
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: -4px 0 40px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .smart-sidebar.open {
      right: 0;
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 9998;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .sidebar-header {
      padding: 20px 24px;
      background: var(--navy);
      color: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .sidebar-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
    }

    .sidebar-username {
      font-weight: 700;
      font-size: 1rem;
    }

    .sidebar-user-role {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .sidebar-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--white);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .sidebar-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .sidebar-motivational {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      padding: 20px 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .motivational-icon {
      font-size: 1.4rem;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .motivational-text {
      font-size: 1rem;
      font-weight: 500;
      transition: opacity 0.3s ease;
      line-height: 1.6;
    }

    .sidebar-news {
      padding: 16px 24px;
      border-bottom: 1px solid var(--gray-200);
      flex-shrink: 0;
    }

    .news-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--navy);
      margin-bottom: 10px;
    }

    .news-header i {
      color: var(--gold);
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .news-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--gray-600);
      padding: 4px 0;
    }

    .news-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      color: var(--gray-600);
      text-decoration: none;
      transition: all 0.3s ease;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .sidebar-link:hover {
      background: var(--gray-100);
      color: var(--navy);
    }

    .sidebar-link.active {
      background: var(--navy);
      color: var(--white);
    }

    .sidebar-link i {
      width: 20px;
      text-align: center;
      font-size: 1.05rem;
    }

    .sidebar-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--gray-200);
      flex-shrink: 0;
    }

    .sidebar-action-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius-full);
      background: var(--gold);
      color: var(--navy);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .sidebar-action-btn:hover {
      background: var(--gold-light);
      transform: scale(1.02);
    }

    .sidebar-toggle {
      position: fixed;
      left: 20px;
      bottom: 20px;
      background: var(--navy);
      color: var(--white);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      border: none;
      z-index: 999;
      transition: all 0.3s ease;
    }

    .sidebar-toggle:hover {
      background: var(--gold);
      color: var(--navy);
      transform: scale(1.05);
    }

    /* ===== تحسينات الشاشات الصغيرة ===== */
    @media (max-width: 768px) {
      .login-card {
        padding: 32px 20px;
      }

      .smart-sidebar {
        width: 320px;
        right: -340px;
      }

      .smart-header .container {
        flex-direction: column;
        align-items: stretch;
      }

      .header-actions {
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 24px 16px;
      }

      .login-card h1 {
        font-size: 1.3rem;
      }

      .smart-sidebar {
        width: 290px;
        right: -310px;
      }

      .sidebar-toggle {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
        left: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== الهيدر ===== -->
  <header class="smart-header">
    <div class="container">
      <a href="/gomla/" class="logo">
        <img src="../assets/images/logo.png" alt="أولاد شعلان" onerror="this.style.display='none'">
        <span>أولاد شعلان <small>جملة</small></span>
        <span class="gold">✦</span>
      </a>
      <div class="header-actions">
        <a href="/gomla/customer-login.html" class="btn btn-gold">
          <i class="fas fa-key"></i> دخول العملاء
        </a>
      </div>
    </div>
  </header>

  <!-- ===== صفحة الدخول ===== -->
  <section class="login-page">
    <div class="login-card">
      <span class="login-icon"><i class="fas fa-user-shield"></i></span>
      <h1>دخول المديرين</h1>
      <p class="subtitle">أدخل بياناتك للوصول إلى لوحة التحكم</p>

      <form id="adminLoginForm">
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
          <input type="email" id="adminEmail" placeholder="admin@example.com" required autofocus>
        </div>

        <div class="form-group">
          <label><i class="fas fa-lock"></i> كلمة السر</label>
          <div class="password-wrapper">
            <input type="password" id="adminPassword" placeholder="••••••••" required>
            <button type="button" class="toggle-password" onclick="togglePassword()">
              <i class="fas fa-eye" id="passwordIcon"></i>
            </button>
          </div>
        </div>

        <div id="loginError" class="error-msg">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorText">البريد الإلكتروني أو كلمة السر غير صحيحة</span>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> دخول
        </button>
      </form>

      <a href="/gomla/" class="back-link">
        <i class="fas fa-arrow-right"></i> العودة للرئيسية
      </a>
    </div>
  </section>

  <!-- ===== الفوتر ===== -->
  <footer class="smart-footer">
    <div class="container">
      <div class="copyright">© 2026 أولاد شعلان جملة - جميع الحقوق محفوظة</div>
      <div class="footer-links">
        <a href="/gomla/">الرئيسية</a>
        <a href="/gomla/customer-login.html">دخول العملاء</a>
        <a href="/gomla/admin/login.html">دخول المديرين</a>
      </div>
      <div class="social-icons">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
      </div>
    </div>
  </footer>

  <!-- ===== زر المنيو ===== -->
  <button class="sidebar-toggle" id="sidebarToggle">
    <i class="fas fa-bars"></i>
  </button>

  <!-- ===== Firebase ===== -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <!-- ===== الملفات ===== -->
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/admin.js"></script>
 

  <script>
    // ===== إظهار/إخفاء كلمة السر =====
    function togglePassword() {
      const passwordInput = document.getElementById('adminPassword');
      const icon = document.getElementById('passwordIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // ===== تسجيل دخول المدير =====
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const errorDiv = document.getElementById('loginError');
      const errorText = document.getElementById('errorText');
      const loginBtn = document.getElementById('loginBtn');

      if (!email || !password) {
        errorText.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة السر';
        errorDiv.classList.add('show');
        return;
      }

      errorDiv.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          return db.collection('admins').doc(user.uid).get();
        })
        .then((doc) => {
          if (!doc.exists) {
            auth.signOut();
            errorText.textContent = 'غير مصرح لك بالدخول إلى لوحة التحكم';
            errorDiv.classList.add('show');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
            return;
          }

          const adminData = doc.data();
          adminData.id = doc.id;

          localStorage.setItem('admin', JSON.stringify(adminData));
          localStorage.setItem('adminId', doc.id);

          showToast(`✅ مرحباً ${adminData.name}`, 'success');
          updateSidebarContent();

          window.location.href = '/gomla/admin/dashboard.html';
        })
        .catch((error) => {
          console.error('Login error:', error);
          let message = 'البريد الإلكتروني أو كلمة السر غير صحيحة';
          if (error.code === 'auth/user-not-found') {
            message = 'لا يوجد حساب بهذا البريد الإلكتروني';
          } else if (error.code === 'auth/wrong-password') {
            message = 'كلمة السر غير صحيحة';
          } else if (error.code === 'auth/too-many-requests') {
            message = 'تم تجاوز عدد المحاولات، يرجى المحاولة لاحقاً';
          }
          errorText.textContent = message;
          errorDiv.classList.add('show');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
        });
    });
  </script>

</body>
</html>

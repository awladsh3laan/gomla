<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة تذاكر الدعم | أولاد شعلان</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
:root { --navy:#1a2a4a; --navy-light:#2a3f6a; --navy-dark:#0f1a2e; --gold:#c9a84c; --gold-light:#e8d5a3; --gold-dark:#b8942a; }
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body { margin:0; font-family:'Tajawal',sans-serif; background:#f5f6fa; padding-top:60px; }

.top-bar {
  position:fixed; top:0; right:0; left:0; height:60px; z-index:900;
  background:linear-gradient(135deg,var(--navy-dark),var(--navy),var(--navy-light));
  display:flex; align-items:center; justify-content:space-between;
  padding:0 14px; color:#fff; box-shadow:0 2px 20px rgba(0,0,0,.25);
}
.top-bar .title { display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; }
.top-bar .title i { color:var(--gold); }
.top-bar button {
  background:rgba(255,255,255,.1); color:#fff; border:0;
  width:40px; height:40px; border-radius:12px; cursor:pointer;
  transition:.2s;
}
.top-bar button:hover { background:rgba(255,255,255,.2); }

.container { max-width:1200px; margin:0 auto; padding:18px 14px 90px; }

/* Stats */
.stats-grid {
  display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:18px;
}
.stat-card {
  background:#fff; border-radius:14px; padding:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
  display:flex; align-items:center; gap:12px;
}
.stat-card .ico {
  width:46px; height:46px; border-radius:12px;
  display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff;
}
.stat-card .ico.total { background:linear-gradient(135deg,var(--navy),var(--navy-light)); }
.stat-card .ico.open { background:linear-gradient(135deg,#f59e0b,#d97706); }
.stat-card .ico.proc { background:linear-gradient(135deg,#3b82f6,#1e40af); }
.stat-card .ico.closed { background:linear-gradient(135deg,#22c55e,#16a34a); }
.stat-card .num { font-size:22px; font-weight:900; color:var(--navy); line-height:1; }
.stat-card .lbl { font-size:11px; color:#6b7280; margin-top:3px; }

/* Filters */
.filters-bar {
  display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;
  scrollbar-width:none; overscroll-behavior-x:contain;
}
.filters-bar::-webkit-scrollbar { display:none; }
.chip {
  padding:8px 14px; border-radius:20px; border:1.5px solid #e5e7eb;
  background:#fff; color:#6b7280; font-family:inherit; font-weight:700;
  font-size:12px; cursor:pointer; white-space:nowrap; transition:.2s; flex-shrink:0;
}
.chip.active { background:linear-gradient(135deg,var(--navy),var(--navy-light)); color:#fff; border-color:transparent; }
.chip.urgent.active { background:linear-gradient(135deg,#ef4444,#dc2626); }

/* Tickets grid */
.tickets-grid { display:grid; grid-template-columns:1fr; gap:10px; }
.tk-card {
  background:#fff; border-radius:14px; padding:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
  cursor:pointer; transition:.25s; border-right:4px solid var(--gold);
  animation: dropIn .4s ease backwards;
}
@keyframes dropIn {
  from { opacity:0; transform:translateY(-20px); }
  to { opacity:1; transform:translateY(0); }
}
.tk-card:hover { transform:translateY(-3px); box-shadow:0 8px 22px rgba(0,0,0,.1); }
.tk-card.priority-urgent { border-right-color:#ef4444; }
.tk-card.priority-high { border-right-color:#f59e0b; }
.tk-row1 { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px; }
.tk-num { font-weight:800; color:var(--navy); font-size:13px; }
.tk-subject { font-size:14px; font-weight:700; color:#1f2937; margin:0 0 6px; }
.tk-sender { font-size:12px; color:#6b7280; margin-bottom:6px; }
.tk-sender i { color:var(--gold); margin-left:4px; }
.tk-meta { display:flex; flex-wrap:wrap; gap:6px; font-size:11px; color:#9ca3af; }
.status-pill { font-size:10px; padding:3px 9px; border-radius:20px; font-weight:700; }
.status-open { background:#fef3c7; color:#92400e; }
.status-processing { background:#dbeafe; color:#1e40af; }
.status-closed { background:#dcfce7; color:#166534; }
.priority-pill { font-size:10px; padding:3px 9px; border-radius:20px; font-weight:700; }
.priority-normal { background:#f3f4f6; color:#374151; }
.priority-high { background:#fed7aa; color:#9a3412; }
.priority-urgent { background:#fecaca; color:#991b1b; }
.cat-pill { font-size:10px; padding:3px 9px; border-radius:20px; background:#ede9fe; color:#5b21b6; font-weight:700; }

.empty-state { text-align:center; padding:50px 14px; color:#9ca3af; }
.empty-state i { font-size:48px; color:#e5e7eb; margin-bottom:12px; display:block; }

/* Modal */
.modal-overlay {
  position:fixed; inset:0; background:rgba(15,26,46,.75);
  display:none; align-items:center; justify-content:center; z-index:2000;
  padding:14px; backdrop-filter:blur(6px);
}
.modal-overlay.active { display:flex; animation:fadeIn .2s; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.modal {
  background:#fff; border-radius:20px; width:100%; max-width:640px;
  max-height:92vh; overflow-y:auto; animation:slideUp .3s;
}
@keyframes slideUp { from { transform:translateY(40px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.modal-head {
  background:linear-gradient(135deg,var(--navy-dark),var(--navy));
  color:#fff; padding:18px 20px; border-radius:20px 20px 0 0;
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  position:sticky; top:0; z-index:5;
}
.modal-head .close {
  background:rgba(255,255,255,.15); border:0; color:#fff;
  width:34px; height:34px; border-radius:10px; cursor:pointer; flex-shrink:0;
}
.modal-head .tkt-num { font-size:12px; color:var(--gold-light); font-weight:700; margin-bottom:4px; }
.modal-head h3 { margin:0; font-size:15px; font-weight:800; }
.modal-body { padding:20px; }

.info-row { font-size:12px; color:#6b7280; margin-bottom:14px; line-height:1.9; }
.info-row b { color:var(--navy); }

.timeline { padding:8px 0; margin-bottom:14px; }
.tl-item { display:flex; gap:12px; padding:10px 0; position:relative; }
.tl-item::before {
  content:''; position:absolute; right:15px; top:30px; bottom:-10px;
  width:2px; background:#e5e7eb;
}
.tl-item:last-child::before { display:none; }
.tl-dot {
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:13px; z-index:1;
}
.tl-dot.user { background:#dbeafe; color:#1e40af; }
.tl-dot.admin { background:var(--gold-light); color:var(--gold-dark); }
.tl-dot.sys { background:#e5e7eb; color:#6b7280; }
.tl-body { flex:1; min-width:0; }
.tl-body .who { font-size:12px; font-weight:800; color:var(--navy); }
.tl-body .when { font-size:10px; color:#9ca3af; margin-right:6px; }
.tl-body .txt {
  font-size:13px; color:#374151; margin-top:4px;
  background:#f9fafb; padding:8px 12px; border-radius:10px;
  line-height:1.6; word-wrap:break-word;
}
.attachment-thumb {
  max-width:100%; max-height:220px; border-radius:10px;
  margin-top:8px; cursor:pointer; border:1px solid #e5e7eb;
}

.reply-box { display:flex; gap:8px; margin-bottom:14px; }
.reply-box input {
  flex:1; padding:11px 13px; border:1.5px solid #e5e7eb;
  border-radius:10px; font-family:inherit; font-size:14px; outline:none;
}
.reply-box input:focus { border-color:var(--gold); }
.reply-box button {
  padding:0 18px; border-radius:10px; border:0;
  background:var(--gold); color:#fff; font-weight:700;
  cursor:pointer; display:flex; align-items:center; gap:6px;
}
.reply-box button:hover { background:var(--gold-dark); }

.actions-bar {
  display:flex; gap:8px; flex-wrap:wrap; padding-top:14px;
  border-top:1px solid #eef0f5;
}
.btn {
  flex:1; min-width:120px; padding:11px 16px; border-radius:10px; border:0;
  font-family:inherit; font-weight:800; font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:.2s;
}
.btn-process { background:linear-gradient(135deg,#3b82f6,#1e40af); color:#fff; }
.btn-close-t { background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; }
.btn-delete { background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; }
.btn:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,.15); }

/* Toast */
.toast-wrap {
  position:fixed; top:76px; left:50%; transform:translateX(-50%);
  z-index:3000; display:flex; flex-direction:column; gap:8px;
  pointer-events:none; width:90%; max-width:400px;
}
.toast {
  background:var(--navy); color:#fff; padding:12px 16px;
  border-radius:12px; font-size:13px; font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  display:flex; align-items:center; gap:10px; animation:toastIn .3s;
}
.toast.success { background:linear-gradient(135deg,#22c55e,#16a34a); }
.toast.error { background:linear-gradient(135deg,#ef4444,#dc2626); }
.toast.warning { background:linear-gradient(135deg,#f59e0b,#d97706); }
@keyframes toastIn { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }

@media(min-width:640px){
  .stats-grid { grid-template-columns:repeat(4,1fr); }
  .tickets-grid { grid-template-columns:repeat(2,1fr); }
}
@media(min-width:1024px){
  .tickets-grid { grid-template-columns:repeat(3,1fr); }
}
</style>
</head>
<body>

<div class="top-bar">
  <button onclick="location.href='home.html'"><i class="fas fa-arrow-right"></i></button>
  <div class="title"><i class="fas fa-ticket-alt"></i> إدارة تذاكر الدعم</div>
  <button onclick="location.href='home.html'"><i class="fas fa-home"></i></button>
</div>

<div class="container">
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card"><div class="ico total"><i class="fas fa-ticket-alt"></i></div><div><div class="num" id="stTotal">0</div><div class="lbl">إجمالي</div></div></div>
    <div class="stat-card"><div class="ico open"><i class="fas fa-folder-open"></i></div><div><div class="num" id="stOpen">0</div><div class="lbl">مفتوحة</div></div></div>
    <div class="stat-card"><div class="ico proc"><i class="fas fa-spinner"></i></div><div><div class="num" id="stProc">0</div><div class="lbl">جاري المعالجة</div></div></div>
    <div class="stat-card"><div class="ico closed"><i class="fas fa-check-double"></i></div><div><div class="num" id="stClosed">0</div><div class="lbl">مغلقة</div></div></div>
  </div>

  <!-- Filters -->
  <div class="filters-bar" id="filtersBar">
    <button class="chip active" data-filter="all">الكل</button>
    <button class="chip" data-filter="open">مفتوحة</button>
    <button class="chip" data-filter="processing">جاري المعالجة</button>
    <button class="chip" data-filter="closed">مغلقة</button>
    <button class="chip urgent" data-filter="urgent">🔥 عاجلة</button>
    <button class="chip" data-filter="complaint">شكاوى</button>
    <button class="chip" data-filter="financial">مالية</button>
    <button class="chip" data-filter="inquiry">استفسارات</button>
  </div>

  <!-- Grid -->
  <div class="tickets-grid" id="ticketsGrid"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="ticketModal">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="tkt-num" id="vtNum">TKT-000000</div>
        <h3 id="vtSubj">—</h3>
      </div>
      <button class="close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="info-row">
        <b>المرسل:</b> <span id="vtSender">—</span><br>
        <b>الهاتف:</b> <span id="vtPhone">—</span><br>
        <b>الدور:</b> <span id="vtRole">—</span><br>
        <b>التصنيف:</b> <span id="vtCat">—</span> • <b>الأولوية:</b> <span id="vtPrio">—</span><br>
        <b>الحالة:</b> <span id="vtStatus">—</span> • <b>التاريخ:</b> <span id="vtDate">—</span>
      </div>
      <div class="timeline" id="vtTimeline"></div>
      <div class="reply-box" id="vtReplyBox">
        <input type="text" id="replyInput" placeholder="اكتب ردك كأدمن..." maxlength="800">
        <button onclick="sendAdminReply()"><i class="fas fa-paper-plane"></i> رد</button>
      </div>
      <div class="actions-bar" id="vtActions">
        <button class="btn btn-process" onclick="setStatus('processing')"><i class="fas fa-spinner"></i> جاري المعالجة</button>
        <button class="btn btn-close-t" onclick="setStatus('closed')"><i class="fas fa-check-double"></i> إغلاق</button>
        <button class="btn btn-delete" id="btnDelete" onclick="deleteTicket()"><i class="fas fa-trash"></i> حذف</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/main.js"></script>
<script>
/* =============================================
   admin/support.html
   ============================================= */
let _admin = null;
let _allTickets = [];
let _filter = 'all';
let _currentTicket = null;
let _unsubTicket = null;

document.addEventListener('DOMContentLoaded', () => {
  // Page protection handled by main.js if you add protectAdminPage() call
  if (typeof protectAdminPage === 'function') protectAdminPage();

  _admin = JSON.parse(localStorage.getItem('admin') || 'null');
  if (!_admin) { location.href = 'login.html'; return; }

  setupFilters();
  loadTickets();
});

function setupFilters() {
  document.querySelectorAll('#filtersBar .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#filtersBar .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      _filter = chip.dataset.filter;
      renderTickets();
    });
  });
}

function loadTickets() {
  db.collection('support_tickets')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snap => {
      _allTickets = [];
      snap.forEach(d => _allTickets.push({ id: d.id, ...d.data() }));
      updateStats();
      renderTickets();
    }, err => {
      console.error(err);
      showToast('فشل تحميل التذاكر', 'error');
    });
}

function updateStats() {
  document.getElementById('stTotal').textContent = _allTickets.length;
  document.getElementById('stOpen').textContent = _allTickets.filter(t => t.status === 'open').length;
  document.getElementById('stProc').textContent = _allTickets.filter(t => t.status === 'processing').length;
  document.getElementById('stClosed').textContent = _allTickets.filter(t => t.status === 'closed').length;
}

function filterTickets(list) {
  if (_filter === 'all') return list;
  if (_filter === 'urgent') return list.filter(t => t.priority === 'urgent');
  if (['open','processing','closed'].includes(_filter)) return list.filter(t => t.status === _filter);
  return list.filter(t => t.category === _filter);
}

function renderTickets() {
  const list = filterTickets(_allTickets);
  const grid = document.getElementById('ticketsGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-inbox"></i>مفيش تذاكر مطابقة</div>`;
    return;
  }
  grid.innerHTML = list.map((t, i) => `
    <div class="tk-card priority-${t.priority || 'normal'}" style="animation-delay:${i*0.03}s" onclick="openTicket('${t.id}')">
      <div class="tk-row1">
        <span class="tk-num">${escapeHtml(t.ticketNumber || '')}</span>
        <span class="status-pill status-${t.status}">${statusArabic(t.status)}</span>
      </div>
      <p class="tk-subject">${escapeHtml(t.subject || '')}</p>
      <div class="tk-sender"><i class="fas fa-user"></i> ${escapeHtml(t.senderName || '')} ${t.senderPhone ? '• '+escapeHtml(t.senderPhone) : ''}</div>
      <div class="tk-meta">
        <span class="cat-pill">${categoryArabic(t.category)}</span>
        <span class="priority-pill priority-${t.priority || 'normal'}">${priorityArabic(t.priority)}</span>
        <span>${relativeTime(t.createdAt)}</span>
        <span>${(t.replies?.length || 0)} رد</span>
      </div>
    </div>
  `).join('');
}

/* ===== Open Ticket ===== */
function openTicket(id) {
  document.getElementById('ticketModal').classList.add('active');
  document.getElementById('vtTimeline').innerHTML = '<div style="text-align:center;padding:20px;color:#9ca3af;"><i class="fas fa-spinner fa-spin"></i></div>';

  if (_unsubTicket) _unsubTicket();
  _unsubTicket = db.collection('support_tickets').doc(id).onSnapshot(doc => {
    if (!doc.exists) { closeModal(); return; }
    _currentTicket = { id: doc.id, ...doc.data() };
    renderDetail(_currentTicket);
  });
}

function closeModal() {
  document.getElementById('ticketModal').classList.remove('active');
  if (_unsubTicket) { _unsubTicket(); _unsubTicket = null; }
  _currentTicket = null;
}

function renderDetail(t) {
  document.getElementById('vtNum').textContent = t.ticketNumber || '';
  document.getElementById('vtSubj').textContent = t.subject || '';
  document.getElementById('vtSender').textContent = t.senderName || '—';
  document.getElementById('vtPhone').textContent = t.senderPhone || '—';
  document.getElementById('vtRole').textContent = roleArabic(t.senderRole);
  document.getElementById('vtCat').textContent = categoryArabic(t.category);
  document.getElementById('vtPrio').textContent = priorityArabic(t.priority);
  document.getElementById('vtStatus').innerHTML = `<span class="status-pill status-${t.status}">${statusArabic(t.status)}</span>`;
  document.getElementById('vtDate').textContent = formatDate(t.createdAt);

  // Timeline
  const replies = (t.replies || []).slice().sort((a, b) => new Date(a.at) - new Date(b.at));
  let tlHtml = replies.map(r => {
    const isAdmin = ['super','admin_plus','admin','cashier'].includes(r.byRole) && !r.isInitial;
    const cls = r.isInitial ? 'user' : (isAdmin ? 'admin' : 'user');
    const icon = r.isInitial ? 'fa-user' : (isAdmin ? 'fa-shield-alt' : 'fa-user');
    return `
      <div class="tl-item">
        <div class="tl-dot ${cls}"><i class="fas ${icon}"></i></div>
        <div class="tl-body">
          <span class="who">${escapeHtml(r.byName || '—')}</span>
          <span class="when">${relativeTime(r.at)}</span>
          <div class="txt">${escapeHtml(r.text || '').replace(/\n/g,'<br>')}</div>
        </div>
      </div>`;
  }).join('');

  if (t.attachments && t.attachments.length) {
    tlHtml += `
      <div class="tl-item">
        <div class="tl-dot sys"><i class="fas fa-paperclip"></i></div>
        <div class="tl-body">
          <span class="who">مرفق من المرسل</span>
          <div style="margin-top:6px;">
            <img src="${t.attachments[0]}" class="attachment-thumb" onclick="window.open('${t.attachments[0]}','_blank')">
          </div>
        </div>
      </div>`;
  }
  document.getElementById('vtTimeline').innerHTML = tlHtml;

  // Reply box visibility
  const rb = document.getElementById('vtReplyBox');
  if (t.status === 'closed') {
    rb.innerHTML = '<div style="text-align:center;color:#9ca3af;font-size:12px;padding:8px;">التذكرة مغلقة</div>';
  } else {
    rb.innerHTML = `
      <input type="text" id="replyInput" placeholder="اكتب ردك كأدمن..." maxlength="800">
      <button onclick="sendAdminReply()"><i class="fas fa-paper-plane"></i> رد</button>`;
    document.getElementById('replyInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendAdminReply();
    });
  }

  // Delete button: super admin only
  const btnDel = document.getElementById('btnDelete');
  if (_admin.role === 'super') btnDel.style.display = 'flex';
  else btnDel.style.display = 'none';
}

/* ===== Admin Actions ===== */
async function sendAdminReply() {
  if (!_currentTicket) return;
  const input = document.getElementById('replyInput');
  const text = (input?.value || '').trim();
  if (!text) return;

  input.disabled = true;
  try {
    const newReply = {
      by: _admin.id || _admin.uid,
      byName: _admin.name || 'الأدمن',
      byRole: _admin.role || 'admin',
      text,
      at: new Date().toISOString(),
      isInitial: false
    };
    await db.collection('support_tickets').doc(_currentTicket.id).update({
      replies: firebase.firestore.FieldValue.arrayUnion(newReply),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastReplyAt: firebase.firestore.FieldValue.serverTimestamp(),
      status: _currentTicket.status === 'open' ? 'processing' : _currentTicket.status
    });

    // Notify user
    await notifyUser(_currentTicket, text);
    // Log
    await logActivity('support_reply', `رد على تذكرة ${_currentTicket.ticketNumber}`);

    input.value = '';
    showToast('تم إرسال الرد وإشعار المستخدم', 'success');
  } catch (err) {
    console.error(err);
    showToast('فشل الإرسال', 'error');
  } finally {
    if (input) input.disabled = false;
  }
}

async function notifyUser(ticket, replyText) {
  try {
    await db.collection('customer_notifications').add({
      userId: ticket.senderId,
      title: `رد جديد على تذكرة ${ticket.ticketNumber}`,
      message: replyText.slice(0, 100),
      type: 'support_reply',
      ticketId: ticket.id,
      read: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { console.warn('notifyUser failed', e); }
}

async function setStatus(newStatus) {
  if (!_currentTicket) return;
  try {
    const upd = {
      status: newStatus,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      reviewedBy: _admin.id || _admin.uid,
      reviewedByName: _admin.name || 'الأدمن'
    };
    if (newStatus === 'closed') upd.closedAt = firebase.firestore.FieldValue.serverTimestamp();

    await db.collection('support_tickets').doc(_currentTicket.id).update(upd);
    await logActivity('support_status', `تغيير حالة تذكرة ${_currentTicket.ticketNumber} إلى ${statusArabic(newStatus)}`);
    showToast('تم تحديث الحالة', 'success');
  } catch (err) {
    console.error(err);
    showToast('فشل التحديث', 'error');
  }
}

async function deleteTicket() {
  if (!_currentTicket) return;
  if (_admin.role !== 'super') { showToast('الحذف للسوبر أدمن فقط', 'warning'); return; }
  if (!confirm('متأكد من حذف التذكرة نهائياً؟')) return;
  try {
    await db.collection('support_tickets').doc(_currentTicket.id).delete();
    await logActivity('support_delete', `حذف تذكرة ${_currentTicket.ticketNumber}`);
    showToast('تم الحذف', 'success');
    closeModal();
  } catch (err) {
    console.error(err);
    showToast('فشل الحذف', 'error');
  }
}

async function logActivity(action, details) {
  try {
    await db.collection('activityLog').add({
      action, details,
      by: _admin.id || _admin.uid,
      byName: _admin.name || 'الأدمن',
      byRole: _admin.role,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) {}
}

/* ===== Helpers ===== */
function statusArabic(s) { return { open:'مفتوحة', processing:'جاري المعالجة', closed:'مغلقة' }[s] || s; }
function categoryArabic(c) { return { complaint:'شكوى', inquiry:'استفسار', request:'طلب', suggestion:'اقتراح', financial:'مشكلة مالية' }[c] || c; }
function priorityArabic(p) { return { normal:'عادية', high:'مهمة', urgent:'عاجلة' }[p] || p; }
function roleArabic(r) { return { super:'سوبر أدمن', admin_plus:'أدمن بلص', admin:'أدمن', cashier:'كاشير', wholesale:'تاجر', retail:'عميل', guest:'زائر' }[r] || r; }
function relativeTime(ts) {
  if (!ts) return '';
  let d;
  if (typeof ts === 'string') d = new Date(ts);
  else if (ts.toDate) d = ts.toDate();
  else if (ts.seconds) d = new Date(ts.seconds * 1000);
  else return '';
  const diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return 'الآن';
  if (diff < 3600) return `منذ ${Math.floor(diff/60)} د`;
  if (diff < 86400) return `منذ ${Math.floor(diff/3600)} س`;
  if (diff < 604800) return `منذ ${Math.floor(diff/86400)} ي`;
  return d.toLocaleDateString('ar-EG');
}
function formatDate(ts) {
  if (!ts) return '—';
  let d;
  if (ts.toDate) d = ts.toDate();
  else if (ts.seconds) d = new Date(ts.seconds * 1000);
  else if (typeof ts === 'string') d = new Date(ts);
  else return '—';
  return d.toLocaleString('ar-EG', { dateStyle:'short', timeStyle:'short' });
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg, type = 'info') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = { success:'fa-check-circle', error:'fa-times-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
  el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateY(-10px)'; setTimeout(()=>el.remove(), 300); }, 3200);
}

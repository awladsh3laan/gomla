<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة النقل — أولاد شعلان</title>
  <meta name="theme-color" content="#1a2a4a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    html, body { overflow-x: hidden !important; max-width: 100vw; }

    /* Header */
    .tr-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: var(--radius-lg); padding: 22px 24px; margin-bottom: 18px;
      color: var(--white); position: relative; overflow: hidden;
      box-shadow: 0 12px 40px rgba(26,42,74,.25);
      border-bottom: 4px solid var(--gold);
    }
    .tr-header::before {
      content: ''; position: absolute; top: -50%; right: -15%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(201,168,76,.18) 0%, transparent 70%);
      border-radius: 50%;
    }
    .tr-header-inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .tr-header-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 220px; }
    .tr-header-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy); display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(201,168,76,.4);
    }
    .tr-header h1 { font-size: 1.35rem; font-weight: 900; margin: 0 0 3px; color: var(--white); }
    .tr-header p { font-size: 0.83rem; opacity: 0.88; margin: 0; }
    .tr-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .tr-header-actions .btn {
      background: rgba(255,255,255,.15); color: var(--white);
      border: 1px solid rgba(255,255,255,.3);
      padding: 8px 14px; border-radius: var(--radius-sm);
      font-family: inherit; font-weight: 700; font-size: 0.82rem;
      cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tr-header-actions .btn:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }
    .tr-header-actions .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy); border-color: var(--gold-dark);
    }
    .tr-header-actions .btn-primary:hover { background: var(--gold-dark); color: var(--white); }

    /* Stats */
    .tr-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .tr-stat {
      background: var(--white); border-radius: var(--radius-md);
      padding: 14px 10px; box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      text-align: center; transition: var(--transition);
      cursor: pointer;
    }
    .tr-stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--gold-light); }
    .tr-stat.active { border-color: var(--gold); background: linear-gradient(135deg, #fcf9f0, #f8f4e8); }
    .tr-stat-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; margin: 0 auto 6px; }
    .tr-stat-icon.blue   { background: rgba(59,130,246,.12); color: #2563eb; }
    .tr-stat-icon.orange { background: rgba(249,115,22,.12); color: #ea580c; }
    .tr-stat-icon.green  { background: rgba(34,197,94,.12); color: #16a34a; }
    .tr-stat-icon.red    { background: rgba(239,68,68,.12);  color: #dc2626; }
    .tr-stat-num { font-size: 1.15rem; font-weight: 900; color: var(--navy); line-height: 1.2; margin-bottom: 2px; }
    .tr-stat-num.blue { color: #2563eb; }
    .tr-stat-num.orange { color: #ea580c; }
    .tr-stat-num.green { color: #16a34a; }
    .tr-stat-num.red { color: #dc2626; }
    .tr-stat-label { font-size: 0.65rem; color: var(--gray-500); font-weight: 700; line-height: 1.2; }

    /* Tabs */
    .tr-tabs {
      display: flex; gap: 6px; margin-bottom: 16px;
      background: var(--white); padding: 8px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow-x: auto; scrollbar-width: thin;
    }
    .tr-tabs::-webkit-scrollbar { height: 4px; }
    .tr-tabs::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    .tr-tab {
      flex-shrink: 0; padding: 10px 16px;
      border: 2px solid var(--gray-200); background: var(--white);
      color: var(--gray-600); border-radius: var(--radius-sm);
      font-family: inherit; font-weight: 800; font-size: 0.82rem;
      cursor: pointer; transition: all 0.25s ease;
      display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .tr-tab:hover { border-color: var(--gold-light); background: var(--gray-50); }
    .tr-tab.active {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white); border-color: var(--navy);
      box-shadow: 0 6px 16px rgba(26,42,74,.25);
    }
    .tr-tab.active i { color: var(--gold); }
    .tr-tab .tab-count {
      background: rgba(0,0,0,.08); padding: 1px 7px;
      border-radius: 10px; font-size: 0.65rem; font-weight: 900;
      min-width: 20px; text-align: center;
    }
    .tr-tab.active .tab-count { background: var(--gold); color: var(--navy); }

    /* Filters */
    .tr-filters {
      background: var(--white); border-radius: var(--radius-md);
      padding: 12px 14px; margin-bottom: 16px;
      box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200);
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .tr-search { position: relative; flex: 1; min-width: 200px; }
    .tr-search input {
      width: 100%; padding: 10px 40px 10px 14px;
      border: 2px solid var(--gray-200); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 0.88rem;
      background: var(--gray-50); outline: none; transition: var(--transition);
    }
    .tr-search input:focus { border-color: var(--gold); background: var(--white); box-shadow: 0 0 0 4px rgba(201,168,76,.15); }
    .tr-search i { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--gray-400); }
    .tr-filters select {
      padding: 10px 12px; border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm); font-family: inherit;
      font-size: 0.82rem; background: var(--gray-50);
      outline: none; cursor: pointer; min-width: 120px;
    }
    .tr-filters select:focus { border-color: var(--gold); background: var(--white); }
    .tr-filters .btn-icon-only {
      padding: 10px 14px; border: 2px solid var(--gray-200);
      background: var(--white); border-radius: var(--radius-sm);
      color: var(--gray-600); cursor: pointer; transition: var(--transition);
    }
    .tr-filters .btn-icon-only:hover { border-color: var(--gold); color: var(--gold-dark); }

    /* List */
    .tr-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }

    .tr-card {
      background: var(--white); border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200);
      padding: 14px 16px; transition: var(--transition);
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; gap: 10px;
    }
    .tr-card::before {
      content: ''; position: absolute; top: 0; right: 0;
      width: 5px; height: 100%; background: var(--gold);
    }
    .tr-card.pending::before { background: #3b82f6; }
    .tr-card.in_transit::before { background: #f97316; }
    .tr-card.completed::before { background: #22c55e; }
    .tr-card.partially_received::before { background: #eab308; }
    .tr-card.rejected_at_destination::before { background: #dc2626; }
    .tr-card.cancelled::before { background: #6b7280; }
    .tr-card:hover { box-shadow: var(--shadow-md); border-color: var(--gold-light); }

    .tr-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .tr-card-title { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 900; color: var(--navy); flex-wrap: wrap; }
    .tr-num {
      font-family: 'Courier New', monospace;
      background: var(--gray-100); padding: 2px 10px;
      border-radius: 6px; font-size: 0.75rem; direction: ltr;
    }
    .tr-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .tr-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: var(--radius-full);
      font-size: 0.68rem; font-weight: 800; white-space: nowrap;
    }
    .tr-badge.pending { background: rgba(59,130,246,.15); color: #1d4ed8; }
    .tr-badge.in_transit { background: rgba(249,115,22,.15); color: #c2410c; }
    .tr-badge.completed { background: rgba(34,197,94,.15); color: #15803d; }
    .tr-badge.partially_received { background: rgba(234,179,8,.15); color: #a16207; }
    .tr-badge.rejected_at_destination { background: rgba(239,68,68,.15); color: #b91c1c; }
    .tr-badge.cancelled { background: rgba(107,114,128,.15); color: #4b5563; }
    .tr-badge.late { background: rgba(220,38,38,.2); color: #991b1b; animation: pulseLate 1.5s infinite; }
    @keyframes pulseLate { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

    .tr-card-route {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; background: var(--gray-50);
      border-radius: 8px; border: 1px solid var(--gray-200);
      font-size: 0.85rem;
    }
    .tr-route-point {
      display: flex; align-items: center; gap: 6px;
      font-weight: 900; color: var(--navy);
    }
    .tr-route-point i { color: var(--gold); }
    .tr-route-arrow { color: var(--gray-400); font-size: 1.1rem; }
    .tr-route-meta { margin-right: auto; font-size: 0.72rem; color: var(--gray-500); }

    .tr-card-info {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 10px; font-size: 0.8rem;
    }
    .tr-info-item { display: flex; align-items: center; gap: 6px; color: var(--gray-600); }
    .tr-info-item i { color: var(--gold); font-size: 0.72rem; width: 14px; text-align: center; flex-shrink: 0; }
    .tr-info-item .val { font-weight: 700; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .tr-items-preview {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .tr-item-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; background: var(--gray-100);
      border-radius: 20px; font-size: 0.72rem; font-weight: 700;
      color: var(--gray-700);
    }
    .tr-item-chip strong { color: var(--navy); }
    .tr-item-chip i { color: var(--gold); font-size: 0.65rem; }

    .tr-card-actions {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding-top: 10px; border-top: 1px solid var(--gray-100);
    }
    .tr-action-btn {
      padding: 7px 14px; border: 1.5px solid;
      border-radius: var(--radius-sm);
      font-family: inherit; font-weight: 800;
      font-size: 0.75rem; cursor: pointer;
      transition: all .2s ease;
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--white); white-space: nowrap;
    }
    .tr-action-btn.view { border-color: var(--gray-300); color: var(--gray-700); }
    .tr-action-btn.view:hover { background: var(--navy); color: white; border-color: var(--navy); }
    .tr-action-btn.approve { border-color: #86efac; color: #15803d; background: #f0fdf4; }
    .tr-action-btn.approve:hover { background: #16a34a; color: white; border-color: #15803d; }
    .tr-action-btn.reject { border-color: #fca5a5; color: #b91c1c; background: #fef2f2; }
    .tr-action-btn.reject:hover { background: #dc2626; color: white; }
    .tr-action-btn.print { border-color: #c4b5fd; color: #6d28d9; background: #f5f3ff; }
    .tr-action-btn.print:hover { background: #8b5cf6; color: white; }
    .tr-action-btn.cancel { border-color: #fca5a5; color: #dc2626; }
    .tr-action-btn.cancel:hover { background: #dc2626; color: white; }
    .tr-action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Empty / Loading */
    .tr-empty, .tr-loading {
      text-align: center; padding: 60px 20px;
      background: var(--white); border-radius: var(--radius-md);
      border: 2px dashed var(--gray-300);
    }
    .tr-empty .empty-icon {
      width: 90px; height: 90px; border-radius: 50%;
      background: var(--gray-100); color: var(--gray-400);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; margin: 0 auto 16px;
    }
    .tr-empty h3 { font-size: 1.1rem; font-weight: 900; color: var(--navy); margin-bottom: 6px; }
    .tr-empty p { font-size: 0.85rem; color: var(--gray-500); }
    .tr-loading i { font-size: 2rem; color: var(--gold); margin-bottom: 10px; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(15,26,46,.75); backdrop-filter: blur(4px);
      z-index: 999; justify-content: center; align-items: center;
      padding: 20px; overflow-y: auto;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: var(--white); border-radius: var(--radius-lg);
      max-width: 900px; width: 100%;
      max-height: 92vh; overflow-y: auto;
      padding: 0; position: relative;
      animation: modalSlide .3s ease;
    }
    .modal-content.small { max-width: 500px; }
    .modal-content.medium { max-width: 720px; }
    @keyframes modalSlide { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header {
      padding: 18px 22px;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 2;
    }
    .modal-header h2 { font-size: 1.05rem; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 8px; }
    .modal-header h2 i { color: var(--gold); }
    .modal-header.green { background: linear-gradient(135deg, #15803d, #22c55e); }
    .modal-header.red { background: linear-gradient(135deg, #991b1b, #dc2626); }
    .modal-header.orange { background: linear-gradient(135deg, #c2410c, #f97316); }
    .modal-close {
      background: rgba(255,255,255,.15); border: none;
      color: var(--white); width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; font-size: 1.1rem;
      transition: var(--transition);
    }
    .modal-close:hover { background: var(--danger); transform: rotate(90deg); }
    .modal-body { padding: 20px 22px; }
    .modal-actions {
      padding: 16px 22px; border-top: 2px solid var(--gray-100);
      display: flex; gap: 10px; justify-content: flex-end;
      position: sticky; bottom: 0; background: var(--white);
      flex-wrap: wrap;
    }
    .btn {
      padding: 9px 18px; border: none; border-radius: var(--radius-sm);
      font-family: inherit; font-weight: 800; font-size: 0.85rem;
      cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 2px solid var(--gray-300); color: var(--gray-700); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold-dark); }
    .btn-gold { background: var(--gold); color: var(--navy); }
    .btn-gold:hover { background: var(--gold-dark); color: var(--white); }
    .btn-success { background: #16a34a; color: white; }
    .btn-success:hover { background: #15803d; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1e40af; }

    /* Item row in approve/direct modal */
    .item-row {
      display: grid;
      grid-template-columns: 48px 1fr 110px 110px;
      gap: 10px; align-items: center;
      padding: 10px; border: 1px solid var(--gray-200);
      border-radius: 8px; margin-bottom: 8px;
      background: white;
    }
    .item-row img {
      width: 48px; height: 48px; border-radius: 6px;
      object-fit: cover; border: 1px solid var(--gray-200);
    }
    .item-info { min-width: 0; }
    .item-name {
      font-size: 0.85rem; font-weight: 800;
      color: var(--navy); margin-bottom: 3px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .item-meta { font-size: 0.7rem; color: var(--gray-500); }
    .item-qty-box {
      display: flex; flex-direction: column; gap: 2px;
    }
    .item-qty-box label {
      font-size: 0.65rem; color: var(--gray-500); font-weight: 700;
    }
    .item-qty-box input {
      padding: 7px; border: 2px solid var(--gray-200);
      border-radius: 6px; text-align: center;
      font-family: inherit; font-weight: 900;
      font-size: 0.9rem; outline: none; width: 100%;
    }
    .item-qty-box input:focus { border-color: var(--gold); }
    .item-qty-box input.error { border-color: var(--danger); background: #fef2f2; }
    .item-qty-box input:disabled { background: var(--gray-100); color: var(--gray-500); }

    .summary-box {
      background: #eff6ff; border: 2px solid #93c5fd;
      border-radius: 10px; padding: 14px 16px;
      margin-top: 12px;
    }
    .summary-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 0; font-size: 0.85rem;
    }
    .summary-row.total {
      border-top: 2px solid #bfdbfe; margin-top: 6px; padding-top: 10px;
      font-size: 1rem; font-weight: 900; color: #1e40af;
    }

    .info-box {
      border-radius: 10px; padding: 12px 16px;
      margin-bottom: 16px; font-size: 0.85rem;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .info-box i { font-size: 1.1rem; flex-shrink: 0; margin-top: 2px; }
    .info-box.blue { background: #eff6ff; border: 1px solid #93c5fd; color: #1e40af; }
    .info-box.yellow { background: #fef3c7; border: 1px solid #fbbf24; color: #92400e; }
    .info-box.red { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
    .info-box.green { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }

    /* Product picker */
    .picker-search {
      width: 100%; padding: 10px 14px;
      border: 2px solid var(--gray-200); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 0.9rem; outline: none;
      margin-bottom: 10px;
    }
    .picker-search:focus { border-color: var(--gold); }
    .picker-list {
      max-height: 350px; overflow-y: auto;
      border: 1px solid var(--gray-200); border-radius: 8px;
      padding: 6px;
    }
    .picker-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px; border-radius: 6px; cursor: pointer;
      transition: background 0.15s;
    }
    .picker-item:hover { background: #f0fdf4; }
    .picker-item img {
      width: 40px; height: 40px; border-radius: 6px;
      object-fit: cover; border: 1px solid var(--gray-200);
    }
    .picker-item .info { flex: 1; min-width: 0; }
    .picker-item .name { font-size: 0.85rem; font-weight: 800; color: var(--navy); }
    .picker-item .meta { font-size: 0.7rem; color: var(--gray-500); }
    .picker-item .stock { font-size: 0.75rem; font-weight: 900; color: #16a34a; }
    .picker-item.disabled { opacity: 0.5; cursor: not-allowed; }
    .picker-item.disabled .stock { color: #dc2626; }

    /* Responsive */
    @media (max-width: 992px) {
      .tr-stats { grid-template-columns: repeat(2, 1fr); }
      .tr-card-info { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .tr-header { padding: 16px; }
      .tr-header-icon { width: 46px; height: 46px; font-size: 1.2rem; }
      .tr-header h1 { font-size: 1.05rem; }
      .tr-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .tr-stat { padding: 11px 8px; }
      .tr-tab { padding: 8px 12px; font-size: 0.75rem; }
      .tr-filters { flex-direction: column; align-items: stretch; }
      .tr-search, .tr-filters select { min-width: 100%; }
      .tr-card-info { grid-template-columns: 1fr; }
      .tr-card-actions { justify-content: flex-start; }
      .tr-action-btn { font-size: 0.7rem; padding: 6px 10px; flex: 1; justify-content: center; min-width: calc(50% - 3px); }
      .modal-content { margin: 10px; }
      .modal-body { padding: 16px; }
      .item-row { grid-template-columns: 40px 1fr; }
      .item-qty-box { grid-column: 1 / -1; }
      .tr-card-route { flex-direction: column; align-items: flex-start; }
      .tr-route-arrow { transform: rotate(90deg); }
      .tr-route-meta { margin-right: 0; margin-top: 4px; }
    }
  </style>
</head>
<body>

  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>
  <div id="header-placeholder"></div>

  <main class="page-content">
    <div class="container">

      <div class="tr-header">
        <div class="tr-header-inner">
          <div class="tr-header-left">
            <div class="tr-header-icon"><i class="fas fa-exchange-alt"></i></div>
            <div>
              <h1>إدارة النقل بين الفروع</h1>
              <p>طلبات النقل · في الطريق · المكتملة</p>
            </div>
          </div>
          <div class="tr-header-actions">
            <button class="btn" onclick="loadAll()" id="refreshBtn">
              <i class="fas fa-sync-alt"></i> تحديث
            </button>
            <button class="btn btn-primary" onclick="openDirectTransferModal()">
              <i class="fas fa-plus"></i> نقل مباشر
            </button>
          </div>
        </div>
      </div>

      <div class="tr-stats">
        <div class="tr-stat" onclick="switchTab('pending', event)">
          <div class="tr-stat-icon blue"><i class="fas fa-clock"></i></div>
          <div class="tr-stat-num blue" id="statPending">0</div>
          <div class="tr-stat-label">طلبات معلقة</div>
        </div>
        <div class="tr-stat" onclick="switchTab('in_transit', event)">
          <div class="tr-stat-icon orange"><i class="fas fa-truck"></i></div>
          <div class="tr-stat-num orange" id="statInTransit">0</div>
          <div class="tr-stat-label">في الطريق</div>
        </div>
        <div class="tr-stat" onclick="switchTab('completed', event)">
          <div class="tr-stat-icon green"><i class="fas fa-check-circle"></i></div>
          <div class="tr-stat-num green" id="statCompleted">0</div>
          <div class="tr-stat-label">مكتملة</div>
        </div>
        <div class="tr-stat" onclick="switchTab('cancelled', event)">
          <div class="tr-stat-icon red"><i class="fas fa-times-circle"></i></div>
          <div class="tr-stat-num red" id="statCancelled">0</div>
          <div class="tr-stat-label">ملغية / مرفوضة</div>
        </div>
      </div>

      <div class="tr-tabs" id="trTabs">
        <button class="tr-tab active" data-tab="pending" onclick="switchTab('pending')">
          <i class="fas fa-clock"></i> طلبات معلقة
          <span class="tab-count" id="tabCount-pending">0</span>
        </button>
        <button class="tr-tab" data-tab="in_transit" onclick="switchTab('in_transit')">
          <i class="fas fa-truck"></i> في الطريق
          <span class="tab-count" id="tabCount-in_transit">0</span>
        </button>
        <button class="tr-tab" data-tab="completed" onclick="switchTab('completed')">
          <i class="fas fa-check-circle"></i> مكتملة
          <span class="tab-count" id="tabCount-completed">0</span>
        </button>
        <button class="tr-tab" data-tab="cancelled" onclick="switchTab('cancelled')">
          <i class="fas fa-ban"></i> ملغية / مرفوضة
          <span class="tab-count" id="tabCount-cancelled">0</span>
        </button>
      </div>

      <div class="tr-filters">
        <div class="tr-search">
          <input type="text" id="trSearch" placeholder="بحث برقم الطلب / الفرع / المنتج..." oninput="onSearchInput()">
          <i class="fas fa-search"></i>
        </div>
        <select id="trFromFilter" onchange="applyFilters()">
          <option value="">من: كل الفروع</option>
        </select>
        <select id="trToFilter" onchange="applyFilters()">
          <option value="">إلى: كل الفروع</option>
        </select>
        <button class="btn-icon-only" onclick="resetFilters()" title="إعادة تعيين">
          <i class="fas fa-undo"></i>
        </button>
      </div>

      <div class="tr-list" id="trList">
        <div class="tr-loading"><i class="fas fa-spinner fa-spin"></i><p>جاري التحميل...</p></div>
      </div>

    </div>
  </main>

  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>
  <div id="footer-placeholder"></div>
  <div id="sidebar-placeholder"></div>
  <div id="toast-container"></div>
  <div id="modalContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
  // ============================================================
  // admin/transfers.html v2.0
  // ✅ 3 تبويبات + موافقة/رفض + طباعة + نقل مباشر
  // ============================================================

  const trState = {
    role: 'guest',
    isSuper: false,
    isAdminPlus: false,
    isAdmin: false,
    adminId: '',
    adminName: '',
    branches: [],
    products: [],
    pendingRequests: [],
    inTransitTransfers: [],
    completedTransfers: [],
    cancelledTransfers: [],
    filtered: [],
    currentTab: 'pending',
    searchDebounce: null,
    approveTarget: null,
    approveItems: [],
    directItems: [],
    directSourceId: '',
    directDestId: '',
    directPickerSearch: '',
    loading: false
  };

  const REQUEST_STATUS = {
    pending: { label: 'معلق', icon: 'clock', cls: 'pending' },
    approved: { label: 'موافق', icon: 'check', cls: 'completed' },
    rejected: { label: 'مرفوض', icon: 'times', cls: 'cancelled' },
    cancelled: { label: 'ملغي', icon: 'ban', cls: 'cancelled' },
    completed: { label: 'مكتمل', icon: 'check-circle', cls: 'completed' }
  };

  const TRANSFER_STATUS = {
    in_transit: { label: 'في الطريق', icon: 'truck', cls: 'in_transit' },
    completed: { label: 'مكتمل', icon: 'check-circle', cls: 'completed' },
    partially_received: { label: 'مستلم جزئياً', icon: 'exclamation', cls: 'partially_received' },
    rejected_at_destination: { label: 'مرفوض بالفرع', icon: 'times-circle', cls: 'rejected_at_destination' },
    cancelled: { label: 'ملغي', icon: 'ban', cls: 'cancelled' }
  };

  // ============================================================
  // Init
  // ============================================================
  document.addEventListener('DOMContentLoaded', async () => {
    if (!protectAdminPage([ROLES.SUPER, ROLES.ADMIN_PLUS])) return;

    const user = getCurrentUser();
    trState.role = user.data?.role || 'admin_plus';
    trState.isSuper = trState.role === 'super';
    trState.isAdminPlus = trState.role === 'admin_plus';
    trState.isAdmin = true;
    trState.adminId = user.data?.id || user.data?.uid || '';
    trState.adminName = user.data?.name || '';

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAllModals();
    });

    await loadBranches();
    await loadProducts();
    populateFilters();
    await loadAll();

    console.log('✅ transfers v2.0 ready — role:', trState.role);
  });

  // ============================================================
  // Load Branches
  // ============================================================
  async function loadBranches() {
    try {
      const snap = await db.collection('branches').where('active', '==', true).get();
      trState.branches = [];
      snap.forEach(doc => trState.branches.push({ id: doc.id, ...doc.data() }));
      trState.branches.sort((a, b) => {
        if (a.isWarehouse) return -1;
        if (b.isWarehouse) return 1;
        return (a.name || '').localeCompare(b.name || '', 'ar');
      });
    } catch (err) {
      console.error('loadBranches:', err);
    }
  }

  async function loadProducts() {
    try {
      const snap = await db.collection('products').where('available', '==', true).limit(800).get();
      trState.products = [];
      snap.forEach(doc => trState.products.push({ id: doc.id, ...doc.data() }));
      trState.products.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
    } catch (err) {
      console.error('loadProducts:', err);
    }
  }

  function populateFilters() {
    const fromSel = document.getElementById('trFromFilter');
    const toSel = document.getElementById('trToFilter');
    const opts = trState.branches.map(b => `<option value="${b.id}">${esc(b.name || b.id)}</option>`).join('');
    if (fromSel) fromSel.innerHTML = '<option value="">من: كل الفروع</option>' + opts;
    if (toSel) toSel.innerHTML = '<option value="">إلى: كل الفروع</option>' + opts;
  }

  function getBranch(id) {
    return trState.branches.find(b => b.id === id);
  }

  // ============================================================
  // Load All Data (realtime)
  // ============================================================
  let _unsubRequests = null;
  let _unsubTransfers = null;

  async function loadAll() {
    if (trState.loading) return;
    trState.loading = true;

    const btn = document.getElementById('refreshBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> تحميل...'; }

    try {
      // Load pending requests (realtime)
      if (_unsubRequests) _unsubRequests();
      _unsubRequests = db.collection('transfer_requests')
        .where('status', '==', 'pending')
        .orderBy('requestedAt', 'desc')
        .limit(100)
        .onSnapshot(snap => {
          trState.pendingRequests = [];
          snap.forEach(doc => trState.pendingRequests.push({ id: doc.id, ...doc.data() }));
          updateStats();
          if (trState.currentTab === 'pending') applyFilters();
        }, err => console.warn('pending stream:', err));

      // Load transfers (all statuses — for in_transit + completed + cancelled)
      if (_unsubTransfers) _unsubTransfers();
      _unsubTransfers = db.collection('transfers')
        .orderBy('createdAt', 'desc')
        .limit(200)
        .onSnapshot(snap => {
          trState.inTransitTransfers = [];
          trState.completedTransfers = [];
          trState.cancelledTransfers = [];
          snap.forEach(doc => {
            const t = { id: doc.id, ...doc.data() };
            if (t.status === 'in_transit') trState.inTransitTransfers.push(t);
            else if (['completed', 'partially_received', 'rejected_at_destination'].includes(t.status)) trState.completedTransfers.push(t);
            else if (t.status === 'cancelled') trState.cancelledTransfers.push(t);
          });
          updateStats();
          if (trState.currentTab !== 'pending') applyFilters();
        }, err => console.warn('transfers stream:', err));

      trState.loading = false;
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث'; }

    } catch (err) {
      trState.loading = false;
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث'; }
      console.error('loadAll:', err);
      window.showToast('خطأ في التحميل: ' + err.message, 'error');
    }
  }

  function updateStats() {
    setText('statPending', trState.pendingRequests.length);
    setText('statInTransit', trState.inTransitTransfers.length);
    setText('statCompleted', trState.completedTransfers.length);
    setText('statCancelled', trState.cancelledTransfers.length);
    setText('tabCount-pending', trState.pendingRequests.length);
    setText('tabCount-in_transit', trState.inTransitTransfers.length);
    setText('tabCount-completed', trState.completedTransfers.length);
    setText('tabCount-cancelled', trState.cancelledTransfers.length);
  }
  function setText(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }

  // ============================================================
  // Tabs & Filters
  // ============================================================
  function switchTab(tab, event) {
    if (event) event.preventDefault();
    trState.currentTab = tab;
    document.querySelectorAll('.tr-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    applyFilters();
  }

  function onSearchInput() {
    if (trState.searchDebounce) clearTimeout(trState.searchDebounce);
    trState.searchDebounce = setTimeout(applyFilters, 300);
  }

  function applyFilters() {
    let list = [];
    if (trState.currentTab === 'pending') list = [...trState.pendingRequests];
    else if (trState.currentTab === 'in_transit') list = [...trState.inTransitTransfers];
    else if (trState.currentTab === 'completed') list = [...trState.completedTransfers];
    else if (trState.currentTab === 'cancelled') list = [...trState.cancelledTransfers];

    const search = (document.getElementById('trSearch')?.value || '').trim().toLowerCase();
    if (search) {
      list = list.filter(r => {
        const fromName = (r.fromBranchName || getBranch(r.fromBranchId)?.name || '').toLowerCase();
        const toName = (r.toBranchName || getBranch(r.toBranchId)?.name || '').toLowerCase();
        const productMatch = (r.items || []).some(i => (i.productName || '').toLowerCase().includes(search));
        return (r.id || '').toLowerCase().includes(search) ||
               fromName.includes(search) ||
               toName.includes(search) ||
               productMatch;
      });
    }

    const fromF = document.getElementById('trFromFilter')?.value || '';
    if (fromF) list = list.filter(r => r.fromBranchId === fromF);

    const toF = document.getElementById('trToFilter')?.value || '';
    if (toF) list = list.filter(r => r.toBranchId === toF);

    trState.filtered = list;
    renderList();
  }

  function resetFilters() {
    const s = document.getElementById('trSearch');
    const f = document.getElementById('trFromFilter');
    const t = document.getElementById('trToFilter');
    if (s) s.value = '';
    if (f) f.value = '';
    if (t) t.value = '';
    applyFilters();
  }

  // ============================================================
  // Render List
  // ============================================================
  function renderList() {
    const container = document.getElementById('trList');
    if (!container) return;

    if (trState.filtered.length === 0) {
      const labels = {
        pending: 'لا توجد طلبات معلقة',
        in_transit: 'لا توجد شحنات في الطريق',
        completed: 'لا توجد شحنات مكتملة',
        cancelled: 'لا توجد شحنات ملغية'
      };
      container.innerHTML = `
        <div class="tr-empty">
          <div class="empty-icon"><i class="fas fa-truck"></i></div>
          <h3>${labels[trState.currentTab] || 'لا توجد بيانات'}</h3>
          <p>${trState.currentTab === 'pending' ? 'سيظهر هنا طلبات النقل الجديدة من الفروع' : 'ستظهر هنا الشحنات بمجرد توفرها'}</p>
        </div>`;
      return;
    }

    container.innerHTML = trState.filtered.map(r => {
      if (trState.currentTab === 'pending') return renderPendingCard(r);
      return renderTransferCard(r);
    }).join('');
  }

  // ============================================================
  // Render Pending Request Card
  // ============================================================
  function renderPendingCard(req) {
    const fromBranch = getBranch(req.fromBranchId) || { name: req.fromBranchName || req.fromBranchId };
    const toBranch = getBranch(req.toBranchId) || { name: req.toBranchName || req.toBranchId };
    const st = REQUEST_STATUS[req.status] || REQUEST_STATUS.pending;

    const reqDate = req.requestedAt ? formatDateTime(req.requestedAt) : '—';
    const ageHours = req.requestedAt ? Math.round((Date.now() - toMs(req.requestedAt)) / (1000 * 60 * 60)) : 0;
    const isLate = ageHours >= 24;

    const itemsChips = (req.items || []).slice(0, 4).map(i => `
      <span class="tr-item-chip">
        <i class="fas fa-box"></i>
        ${esc(i.productName || '')}
        <strong>×${i.requestedPieces || 0}</strong>
      </span>
    `).join('');
    const moreItems = (req.items || []).length > 4 ? `<span class="tr-item-chip"><i class="fas fa-plus"></i> ${(req.items || []).length - 4} آخر</span>` : '';

    return `
      <div class="tr-card pending">
        <div class="tr-card-head">
          <div class="tr-card-title">
            <span class="tr-num">#${req.id.slice(-8).toUpperCase()}</span>
            <span>طلب نقل — ${esc(req.requestedByName || req.requestedByRole || 'مستخدم')}</span>
          </div>
          <div class="tr-badges">
            <span class="tr-badge pending"><i class="fas fa-${st.icon}"></i> ${st.label}</span>
            ${isLate ? `<span class="tr-badge late"><i class="fas fa-exclamation-triangle"></i> متأخر ${ageHours} ساعة</span>` : ''}
          </div>
        </div>

        <div class="tr-card-route">
          <div class="tr-route-point">
            <i class="fas fa-warehouse"></i>
            ${esc(fromBranch.name || fromBranch.id)}
          </div>
          <i class="fas fa-arrow-left tr-route-arrow"></i>
          <div class="tr-route-point">
            <i class="fas fa-store-alt"></i>
            ${esc(toBranch.name || toBranch.id)}
          </div>
          <div class="tr-route-meta">
            <i class="fas fa-clock"></i> ${reqDate}
          </div>
        </div>

        <div class="tr-card-info">
          <div class="tr-info-item">
            <i class="fas fa-boxes"></i>
            <span class="val">${req.totalItems || (req.items || []).length} منتج</span>
          </div>
          <div class="tr-info-item">
            <i class="fas fa-cubes"></i>
            <span class="val">${req.totalPieces || 0} قطعة</span>
          </div>
          <div class="tr-info-item">
            <i class="fas fa-user"></i>
            <span class="val">${esc(req.requestedByName || '—')}</span>
          </div>
          <div class="tr-info-item">
            <i class="fas fa-clock"></i>
            <span class="val">منذ ${ageHours} ساعة</span>
          </div>
        </div>

        <div class="tr-items-preview">${itemsChips}${moreItems}</div>

        <div class="tr-card-actions">
          <button class="tr-action-btn view" onclick="openRequestDetails('${req.id}')">
            <i class="fas fa-eye"></i> تفاصيل
          </button>
          <button class="tr-action-btn approve" onclick="openApproveModal('${req.id}')">
            <i class="fas fa-check"></i> موافقة
          </button>
          <button class="tr-action-btn reject" onclick="openRejectModal('${req.id}')">
            <i class="fas fa-times"></i> رفض
          </button>
        </div>
      </div>`;
  }

  // ============================================================
  // Render Transfer Card (in_transit / completed / cancelled)
  // ============================================================
  function renderTransferCard(tr) {
    const fromBranch = getBranch(tr.fromBranchId) || { name: tr.fromBranchName || tr.fromBranchId };
    const toBranch = getBranch(tr.toBranchId) || { name: tr.toBranchName || tr.toBranchId };
    const st = TRANSFER_STATUS[tr.status] || TRANSFER_STATUS.in_transit;

    const trDate = tr.createdAt ? formatDateTime(tr.createdAt) : '—';
    const ageHours = tr.createdAt ? Math.round((Date.now() - toMs(tr.createdAt)) / (1000 * 60 * 60)) : 0;
    const isLate = tr.status === 'in_transit' && ageHours >= 24;

    const itemsChips = (tr.items || []).slice(0, 4).map(i => {
      const qty = tr.status === 'in_transit' ? (i.approvedPieces || i.requestedPieces || 0) : (i.receivedPieces || i.approvedPieces || i.requestedPieces || 0);
      return `<span class="tr-item-chip"><i class="fas fa-box"></i> ${esc(i.productName || '')} <strong>×${qty}</strong></span>`;
    }).join('');
    const moreItems = (tr.items || []).length > 4 ? `<span class="tr-item-chip"><i class="fas fa-plus"></i> ${(tr.items || []).length - 4} آخر</span>` : '';

    const isDirect = tr.isDirectTransfer === true;

    return `
      <div class="tr-card ${st.cls}">
        <div class="tr-card-head">
          <div class="tr-card-title">
            <span class="tr-num">#${tr.id.slice(-8).toUpperCase()}</span>
            <span>${isDirect ? 'نقل مباشر' : 'طلب نقل معتمد'}</span>
          </div>
          <div class="tr-badges">
            <span class="tr-badge ${st.cls}"><i class="fas fa-${st.icon}"></i> ${st.label}</span>
            ${isDirect ? `<span class="tr-badge" style="background:rgba(139,92,246,.15);color:#6d28d9;"><i class="fas fa-bolt"></i> مباشر</span>` : ''}
            ${isLate ? `<span class="tr-badge late"><i class="fas fa-exclamation-triangle"></i> متأخر ${ageHours} ساعة</span>` : ''}
          </div>
        </div>

        <div class="tr-card-route">
          <div class="tr-route-point">
            <i class="fas fa-warehouse"></i>
            ${esc(fromBranch.name || fromBranch.id)}
          </div>
          <i class="fas fa-arrow-left tr-route-arrow"></i>
          <div class="tr-route-point">
            <i class="fas fa-store-alt"></i>
            ${esc(toBranch.name || toBranch.id)}
          </div>
          <div class="tr-route-meta">
            <i class="fas fa-clock"></i> ${trDate}
          </div>
        </div>

        <div class="tr-card-info">
          <div class="tr-info-item">
            <i class="fas fa-boxes"></i>
            <span class="val">${(tr.items || []).length} منتج</span>
          </div>
          <div class="tr-info-item">
            <i class="fas fa-cubes"></i>
            <span class="val">${tr.totalApprovedPieces || tr.totalRequestedPieces || 0} قطعة</span>
          </div>
          <div class="tr-info-item">
            <i class="fas fa-user-check"></i>
            <span class="val">${esc(tr.approvedByName || tr.createdByName || '—')}</span>
          </div>
          ${tr.receivedByName ? `
            <div class="tr-info-item">
              <i class="fas fa-hand-holding"></i>
              <span class="val">استلمها: ${esc(tr.receivedByName)}</span>
            </div>
          ` : `
            <div class="tr-info-item">
              <i class="fas fa-hourglass-half"></i>
              <span class="val">بانتظار الاستلام</span>
            </div>
          `}
        </div>

        <div class="tr-items-preview">${itemsChips}${moreItems}</div>

        <div class="tr-card-actions">
          <button class="tr-action-btn view" onclick="openTransferDetails('${tr.id}')">
            <i class="fas fa-eye"></i> تفاصيل
          </button>
          <button class="tr-action-btn print" onclick="printReceipt('${tr.id}')">
            <i class="fas fa-print"></i> طباعة إذن
          </button>
          ${tr.status === 'in_transit' ? `
            <button class="tr-action-btn cancel" onclick="openCancelTransferModal('${tr.id}')">
              <i class="fas fa-times"></i> إلغاء النقل
            </button>
          ` : ''}
        </div>
      </div>`;
  }

  // ============================================================
  // Request Details Modal
  // ============================================================
  function openRequestDetails(reqId) {
    const req = trState.pendingRequests.find(r => r.id === reqId);
    if (!req) return;

    const fromBranch = getBranch(req.fromBranchId) || { name: req.fromBranchName || req.fromBranchId };
    const toBranch = getBranch(req.toBranchId) || { name: req.toBranchName || req.toBranchId };

    const itemsHtml = (req.items || []).map(i => `
      <div style="display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--gray-200);border-radius:8px;margin-bottom:8px;background:white;">
        <img src="${i.productImage || '/gomla/assets/images/no-image.png'}" style="width:48px;height:48px;border-radius:6px;object-fit:cover;border:1px solid var(--gray-200);" onerror="this.src='/gomla/assets/images/no-image.png'">
        <div style="flex:1;min-width:0;">

  async function openApproveModal(reqId) {
    const req = trState.pendingRequests.find(r => r.id === reqId);
    if (!req) return;

    trState.approveTarget = req;
    trState.approveItems = (req.items || []).map(i => ({
      productId: i.productId,
      productName: i.productName,
      productImage: i.productImage,
      unit: i.unit || 'قطعة',
      piecesPerUnit: i.piecesPerUnit || 1,
      requestedPieces: i.requestedPieces || 0,
      approvedPieces: i.requestedPieces || 0,
      availableInWH: 0,
      availableInWH_afterReserved: 0
    }));

    // Load current WH availability for all items
    await loadWHAvailabilityForApprove();

    renderApproveModal();
  }

  async function loadWHAvailabilityForApprove() {
    try {
      const pids = trState.approveItems.map(i => i.productId);
      for (let i = 0; i < pids.length; i += 30) {
        const chunk = pids.slice(i, i + 30);
        const snap = await db.collection('products')
          .where(firebase.firestore.FieldPath.documentId(), 'in', chunk).get();
        snap.forEach(doc => {
          const p = doc.data();
          const ppu = p.piecesPerUnit || 1;
          const total = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
          const reserved = p.reservedPieces || 0;
          const available = Math.max(0, total - reserved);
          const it = trState.approveItems.find(x => x.productId === doc.id);
          if (it) {
            it.availableInWH = total;
            it.availableInWH_afterReserved = available;
          }
        });
      }
    } catch (err) {
      console.error('loadWHAvailability:', err);
    }
  }

  // ============================================================
  // Confirm Approve — Transaction (reads first!)
  // ============================================================
  async function confirmApprove() {
    const req = trState.approveTarget;
    if (!req) return;

    const notes = (document.getElementById('approveNotes')?.value || '').trim();
    const items = trState.approveItems.filter(i => i.approvedPieces > 0);
    if (items.length === 0) { window.showToast('اعتمد منتج واحد على الأقل', 'warning'); return; }

    const btn = document.getElementById('confirmApproveBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري المعالجة...';

    try {
      const reqRef = db.collection('transfer_requests').doc(req.id);
      let createdTransferId = null;

      await db.runTransaction(async (t) => {
        // ===== PHASE 1: ALL READS =====
        const reqDoc = await t.get(reqRef);
        if (!reqDoc.exists) throw new Error('الطلب غير موجود');
        const reqData = reqDoc.data();
        if (reqData.status !== 'pending') throw new Error('تم معالجة الطلب مسبقاً');

        // Read all products (WH source) first
        const productSnapshots = [];
        for (const item of items) {
          const pRef = db.collection('products').doc(item.productId);
          const pDoc = await t.get(pRef);
          if (!pDoc.exists) throw new Error(`منتج "${item.productName}" غير موجود`);
          productSnapshots.push({ ref: pRef, data: pDoc.data(), item });
        }

        // ===== PHASE 2: ALL WRITES =====
        const now = firebase.firestore.FieldValue.serverTimestamp();
        const fromBranch = getBranch(reqData.fromBranchId);
        const toBranch = getBranch(reqData.toBranchId);

        // Update products — deduct from warehouse
        for (const ps of productSnapshots) {
          const p = ps.data;
          const ppu = p.piecesPerUnit || 1;
          const currentTotal = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
          const currentReserved = p.reservedPieces || 0;
          const currentAvailable = Math.max(0, currentTotal - currentReserved);
          if (ps.item.approvedPieces > currentAvailable) {
            throw new Error(`الكمية المطلوبة من "${ps.item.productName}" تتجاوز المتاح (${currentAvailable})`);
          }
          const newTotal = currentTotal - ps.item.approvedPieces;
          t.update(ps.ref, {
            warehouseStock: Math.floor(newTotal / ppu),
            warehousePieces: newTotal % ppu,
            updatedAt: now
          });
        }

        // Create transfer (in_transit)
        const transferRef = db.collection('transfers').doc();
        createdTransferId = transferRef.id;

        const transferItems = items.map(i => ({
          productId: i.productId,
          productName: i.productName,
          productImage: i.productImage,
          unit: i.unit,
          piecesPerUnit: i.piecesPerUnit,
          requestedPieces: i.requestedPieces,
          approvedPieces: i.approvedPieces,
          receivedPieces: 0,
          damagedPieces: 0,
          notes: ''
        }));

        const totalApprovedPieces = transferItems.reduce((s, i) => s + i.approvedPieces, 0);

        t.set(transferRef, {
          id: transferRef.id,
          fromBranchId: reqData.fromBranchId,
          fromBranchName: fromBranch?.name || reqData.fromBranchName || '',
          fromBranchCode: fromBranch?.code || reqData.fromBranchId,
          toBranchId: reqData.toBranchId,
          toBranchName: toBranch?.name || reqData.toBranchName || '',
          toBranchCode: toBranch?.code || reqData.toBranchId,
          items: transferItems,
          totalRequestedPieces: (reqData.items || []).reduce((s, i) => s + (i.requestedPieces || 0), 0),
          totalApprovedPieces: totalApprovedPieces,
          totalReceivedPieces: 0,
          totalDamagedPieces: 0,
          status: 'in_transit',
          requestId: reqData.id,
          isDirectTransfer: false,
          notes: notes || reqData.notes || '',
          approvedBy: trState.adminId,
          approvedByName: trState.adminName,
          approvedAt: now,
          cancelledBy: '',
          cancelledByName: '',
          cancelledAt: null,
          cancelReason: '',
          receivedBy: '',
          receivedByName: '',
          receivedByRole: '',
          receivedAt: null,
          receiptPrintedAt: null,
          createdAt: now,
          updatedAt: now
        });

        // Update request
        t.update(reqRef, {
          status: 'approved',
          transferId: createdTransferId,
          approvedBy: trState.adminId,
          approvedByName: trState.adminName,
          approvedAt: now,
          approvedItems: items.map(i => ({
            productId: i.productId,
            approvedPieces: i.approvedPieces,
            requestedPieces: i.requestedPieces
          })),
          approvedNotes: notes || '',
          updatedAt: now
        });

        // Notify cashier of destination branch
        t.set(db.collection('admin_notifications').doc(), {
          userId: 'branch_' + reqData.toBranchId,
          branchId: reqData.toBranchId,
          title: '📦 بضاعة في الطريق إليك',
          body: `${items.length} منتج (${totalApprovedPieces} قطعة) في الطريق من ${fromBranch?.name || reqData.fromBranchId}`,
          type: 'transfer_in_transit',
          transferId: createdTransferId,
          read: false,
          createdAt: now
        });
      });

      window.showToast('✅ تمت الموافقة — البضاعة في الطريق', 'success');
      closeModal('approveModal');
      trState.approveTarget = null;
      trState.approveItems = [];

    } catch (err) {
      console.error('confirmApprove:', err);
      window.showToast('❌ ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check"></i> تأكيد الموافقة والشحن';
    }
  }

        rejectedBy: trState.adminId,
        rejectedByName: trState.adminName,

  async function confirmCancelTransfer(trId) {
    const reason = (document.getElementById('cancelReason')?.value || '').trim();
    if (!reason || reason.length < 5) {
      window.showToast('سبب الإلغاء مطلوب', 'warning');
      return;
    }

    const btn = document.getElementById('confirmCancelBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإلغاء...';

    try {
      const trRef = db.collection('transfers').doc(trId);

      await db.runTransaction(async (t) => {
        // ===== PHASE 1: ALL READS =====
        const trDoc = await t.get(trRef);
        if (!trDoc.exists) throw new Error('الشحنة غير موجودة');
        const tr = trDoc.data();
        if (tr.status !== 'in_transit') throw new Error('لا يمكن إلغاء شحنة في هذه الحالة');

        const productSnapshots = [];
        for (const item of tr.items || []) {
          const pRef = db.collection('products').doc(item.productId);
          const pDoc = await t.get(pRef);
          if (pDoc.exists) productSnapshots.push({ ref: pRef, data: pDoc.data(), item });
        }

        // ===== PHASE 2: ALL WRITES =====
        const now = firebase.firestore.FieldValue.serverTimestamp();

        // Return items to source WH
        for (const ps of productSnapshots) {
          const p = ps.data;
          const ppu = p.piecesPerUnit || 1;
          const currentTotal = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
          const newTotal = currentTotal + (ps.item.approvedPieces || 0);
          t.update(ps.ref, {
            warehouseStock: Math.floor(newTotal / ppu),
            warehousePieces: newTotal % ppu,
            updatedAt: now
          });
        }

        // Update transfer
        t.update(trRef, {
          status: 'cancelled',
          cancelledBy: trState.adminId,
          cancelledByName: trState.adminName,
          cancelledAt: now,
          cancelReason: reason,
          updatedAt: now
        });

        // Update request if exists
        if (tr.requestId) {
          const reqRef = db.collection('transfer_requests').doc(tr.requestId);
          const reqDoc = await t.get(reqRef);
          if (reqDoc.exists) {
            t.update(reqRef, {
              status: 'cancelled',
              cancelledAt: now,
              cancelReason: reason,
              updatedAt: now
            });
          }
        }
      });

      window.showToast('✅ تم إلغاء النقل وإرجاع الكميات', 'success');
      closeModal('cancelTransferModal');

    } catch (err) {
      console.error('confirmCancelTransfer:', err);
      window.showToast('❌ ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-ban"></i> تأكيد الإلغاء';
    }
  }

    if (!it) return;
    let q = parseInt(val) || 1;

  async function openDirectProductPicker() {
    if (!trState.directSourceId) { window.showToast('اختر المصدر أولاً', 'warning'); return; }

    // Load current WH stock (or from selected source — must be WH for direct)
    const sourceBranch = getBranch(trState.directSourceId);
    if (!sourceBranch?.isWarehouse) {
      window.showToast('حالياً النقل المباشر من المخزن المركزي فقط', 'warning');
      return;
    }

    // Load all products with availability
    try {
      const existing = new Set(trState.directItems.map(i => i.productId));
      const snap = await db.collection('products').where('available', '==', true).limit(800).get();
      const list = [];
      snap.forEach(doc => {
        const p = doc.data();
        const ppu = p.piecesPerUnit || 1;
        const total = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
        const reserved = p.reservedPieces || 0;
        const available = Math.max(0, total - reserved);
        if (available > 0 && !existing.has(doc.id)) {
          list.push({ id: doc.id, ...p, availablePieces: available });
        }
      });
      list.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));

      renderDirectPicker(list);
    } catch (err) {
      console.error(err);
      window.showToast('خطأ في تحميل المنتجات', 'error');
    }
  }

  function renderDirectPicker(list) {
    const html = `
      <div class="modal-overlay show" id="directPickerModal" onclick="closeModal('directPickerModal')">
        <div class="modal-content medium" onclick="event.stopPropagation()">
          <div class="modal-header" style="background:linear-gradient(135deg,#065f46,#10b981);">
            <h2><i class="fas fa-plus-circle"></i> إضافة منتج</h2>
            <button class="modal-close" onclick="closeModal('directPickerModal')">&times;</button>
          </div>
          <div style="padding:12px 16px;border-bottom:1px solid var(--gray-200);">
            <input type="text" class="picker-search" id="directPickerSearch"
              placeholder="بحث بالاسم / الباركود..." oninput="filterDirectPicker(this.value)">
          </div>
          <div class="picker-list" id="directPickerList">
            ${list.length === 0 ? '<div style="text-align:center;padding:20px;color:var(--gray-400);">لا توجد منتجات متاحة</div>' :
              list.map(p => `
                <div class="picker-item" data-name="${escAttr(p.name || '')}" data-barcode="${escAttr(p.barcode || '')}"
                     onclick="addDirectItem('${p.id}', ${p.availablePieces})">
                  <img src="${p.imageUrl || '/gomla/assets/images/no-image.png'}" onerror="this.src='/gomla/assets/images/no-image.png'">
                  <div class="info">
                    <div class="name">${esc(p.name || '')}</div>
                    <div class="meta">${esc(p.unit || 'قطعة')} · ${p.piecesPerUnit || 1} قطعة/وحدة</div>
                  </div>
                  <div class="stock">${p.availablePieces} متاح</div>
                </div>
              `).join('')}
          </div>
        </div>
      </div>`;
    document.getElementById('modalContainer').insertAdjacentHTML('beforeend', html);
    trState._directPickerList = list;
  }

  function filterDirectPicker(search) {
    const q = (search || '').toLowerCase();
    document.querySelectorAll('#directPickerList .picker-item').forEach(el => {
      const name = (el.dataset.name || '').toLowerCase();
      const bc = (el.dataset.barcode || '').toLowerCase();
      el.style.display = (!q || name.includes(q) || bc.includes(q)) ? 'flex' : 'none';
    });
  }

  function addDirectItem(productId, availablePieces) {
    const p = (trState._directPickerList || []).find(x => x.id === productId);
    if (!p) return;

    trState.directItems.push({
      productId: p.id,
      productName: p.name || '',
      productImage: p.imageUrl || '',
      unit: p.unit || 'قطعة',
      piecesPerUnit: p.piecesPerUnit || 1,
      qty: Math.min(10, availablePieces),
      availableAtSource: availablePieces
    });

    closeModal('directPickerModal');
    renderDirectTransferModal();
  }

  async function submitDirectTransfer() {
    if (!trState.directSourceId || !trState.directDestId) { window.showToast('اختر المصدر والوجهة', 'warning'); return; }
    if (trState.directItems.length === 0) { window.showToast('أضف منتج واحد', 'warning'); return; }

    const notes = (document.getElementById('directNotes')?.value || '').trim();
    const btn = document.getElementById('submitDirectBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري المعالجة...';

    try {
      const sourceBranch = getBranch(trState.directSourceId);
      const destBranch = getBranch(trState.directDestId);
      let createdTransferId = null;

      await db.runTransaction(async (t) => {
        // ===== PHASE 1: ALL READS =====
        const productSnapshots = [];
        for (const item of trState.directItems) {
          const pRef = db.collection('products').doc(item.productId);
          const pDoc = await t.get(pRef);
          if (!pDoc.exists) throw new Error(`منتج "${item.productName}" غير موجود`);
          productSnapshots.push({ ref: pRef, data: pDoc.data(), item });
        }

        // ===== PHASE 2: ALL WRITES =====
        const now = firebase.firestore.FieldValue.serverTimestamp();

        // Deduct from WH
        for (const ps of productSnapshots) {
          const p = ps.data;
          const ppu = p.piecesPerUnit || 1;
          const currentTotal = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
          const currentReserved = p.reservedPieces || 0;
          const currentAvailable = Math.max(0, currentTotal - currentReserved);
          if (ps.item.qty > currentAvailable) {
            throw new Error(`الكمية المطلوبة من "${ps.item.productName}" تتجاوز المتاح (${currentAvailable})`);
          }
          const newTotal = currentTotal - ps.item.qty;
          t.update(ps.ref, {
            warehouseStock: Math.floor(newTotal / ppu),
            warehousePieces: newTotal % ppu,
            updatedAt: now
          });
        }

        // Create transfer
        const transferRef = db.collection('transfers').doc();
        createdTransferId = transferRef.id;

        const items = trState.directItems.map(i => ({
          productId: i.productId,
          productName: i.productName,
          productImage: i.productImage,
          unit: i.unit,
          piecesPerUnit: i.piecesPerUnit,
          requestedPieces: i.qty,
          approvedPieces: i.qty,
          receivedPieces: 0,
          damagedPieces: 0,
          notes: ''
        }));

        t.set(transferRef, {
          id: transferRef.id,
          fromBranchId: trState.directSourceId,
          fromBranchName: sourceBranch?.name || '',
          fromBranchCode: sourceBranch?.code || trState.directSourceId,
          toBranchId: trState.directDestId,
          toBranchName: destBranch?.name || '',
          toBranchCode: destBranch?.code || trState.directDestId,
          items,
          totalRequestedPieces: items.reduce((s, i) => s + i.requestedPieces, 0),
          totalApprovedPieces: items.reduce((s, i) => s + i.approvedPieces, 0),
          totalReceivedPieces: 0,
          totalDamagedPieces: 0,
          status: 'in_transit',
          requestId: '',
          isDirectTransfer: true,
          notes,
          approvedBy: trState.adminId,
          approvedByName: trState.adminName,
          approvedAt: now,
          cancelledBy: '', cancelledByName: '', cancelledAt: null, cancelReason: '',
          receivedBy: '', receivedByName: '', receivedByRole: '', receivedAt: null,
          receiptPrintedAt: null,
          createdAt: now,
          updatedAt: now
        });

        // Notify destination
        t.set(db.collection('admin_notifications').doc(), {
          userId: 'branch_' + trState.directDestId,
          branchId: trState.directDestId,
          title: '📦 بضاعة في الطريق إليك',
          body: `نقل مباشر: ${items.length} منتج (${items.reduce((s, i) => s + i.approvedPieces, 0)} قطعة)`,
          type: 'transfer_in_transit',
          transferId: createdTransferId,
          read: false,
          createdAt: now
        });
      });

      window.showToast('✅ تم بدء النقل المباشر', 'success');
      closeModal('directModal');
      trState.directItems = [];

    } catch (err) {
      console.error('submitDirectTransfer:', err);
      window.showToast('❌ ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-bolt"></i> بدء النقل المباشر';
    }
  }

  // ============================================================
  // Helpers
  // ============================================================
  function closeAllModals() {
    document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
    document.body.style.overflow = '';
  }
  function closeModal(id) {
    document.getElementById(id)?.classList.remove('show');
    document.body.style.overflow = '';
  }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function escAttr(s) {
    return String(s ?? '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function toMs(t) {
    if (!t) return 0;
    if (t.toMillis) return t.toMillis();
    if (t.toDate) return t.toDate().getTime();
    if (t instanceof Date) return t.getTime();
    return 0;
  }

  // ============================================================
  // Exports
  // ============================================================
  window.loadAll = loadAll;
  window.switchTab = switchTab;
  window.onSearchInput = onSearchInput;
  window.applyFilters = applyFilters;
  window.resetFilters = resetFilters;
  window.openRequestDetails = openRequestDetails;
  window.openApproveModal = openApproveModal;
  window.onApproveQtyChange = onApproveQtyChange;
  window.confirmApprove = confirmApprove;
  window.openRejectModal = openRejectModal;
  window.confirmReject = confirmReject;
  window.openTransferDetails = openTransferDetails;
  window.printReceipt = printReceipt;
  window.openCancelTransferModal = openCancelTransferModal;
  window.confirmCancelTransfer = confirmCancelTransfer;
  window.openDirectTransferModal = openDirectTransferModal;
  window.onDirectSourceChange = onDirectSourceChange;
  window.onDirectDestChange = onDirectDestChange;
  window.onDirectQtyChange = onDirectQtyChange;
  window.removeDirectItem = removeDirectItem;
  window.openDirectProductPicker = openDirectProductPicker;
  window.filterDirectPicker = filterDirectPicker;
  window.addDirectItem = addDirectItem;
  window.submitDirectTransfer = submitDirectTransfer;
  window.closeModal = closeModal;
  window.closeAllModals = closeAllModals;
  </script>

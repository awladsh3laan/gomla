<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المحتوى - أولاد شعلان</title>
  <meta name="theme-color" content="#1a2a4a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" href="../assets/images/favicon.ico">

  <style>
    /* ============================================================
       🎨 إدارة المحتوى الموحدة - v1.0
       ============================================================ */
    html, body { overflow-x: hidden !important; max-width: 100vw; }
    .page-content, .page-content .container { overflow-x: hidden; min-width: 0; max-width: 100%; }

    /* ===== Header ===== */
    .cm-header {
      background: linear-gradient(135deg, var(--navy-dark), var(--navy), var(--navy-light));
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 18px;
      color: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(15,26,46,.35);
      border-bottom: 4px solid var(--gold);
    }
    .cm-header::before {
      content: '';
      position: absolute;
      top: -50%; right: -15%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(201,168,76,.25), transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }
    .cm-header-content {
      position: relative; z-index: 1;
      display: flex; align-items: center;
      gap: 16px; flex-wrap: wrap;
    }
    .cm-header-content .header-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(201,168,76,.5);
    }
    .cm-header-content .header-text { flex: 1; min-width: 200px; }
    .cm-header-content .header-text h1 {
      font-size: 1.3rem; font-weight: 900;
      margin-bottom: 4px; color: var(--white);
    }
    .cm-header-content .header-text p {
      font-size: 0.82rem; opacity: .9;
      color: rgba(255,255,255,.9); margin: 0;
    }
    .cm-header-content .header-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,.15);
      color: var(--gold-light);
      border: 1px solid rgba(201,168,76,.5);
      border-radius: var(--radius-full);
      font-size: 0.75rem; font-weight: 800;
    }
    .cm-header-content .header-badge i { color: var(--gold); }

    /* ===== Tabs ===== */
    .cm-tabs-wrap {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 8px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow: hidden;
      min-width: 0;
    }
    .cm-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      min-width: 0;
      max-width: 100%;
    }
    .cm-tabs::-webkit-scrollbar { height: 4px; }
    .cm-tabs::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .cm-tab {
      flex-shrink: 0;
      padding: 11px 18px;
      border: 2px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      position: relative;
    }
    .cm-tab:hover {
      border-color: var(--gold-light);
      background: var(--gray-50);
    }
    .cm-tab.active {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      border-color: var(--navy);
      box-shadow: 0 6px 16px rgba(26,42,74,.25);
    }
    .cm-tab.active i { color: var(--gold); }
    .cm-tab i { font-size: 0.95rem; }
    .cm-tab .tab-count {
      background: rgba(0,0,0,.08);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.68rem;
      font-weight: 800;
      min-width: 22px;
      text-align: center;
    }
    .cm-tab.active .tab-count {
      background: var(--gold);
      color: var(--navy);
    }

    /* ===== Stats ===== */
    .cm-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .cm-stat-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      text-align: center;
      transition: var(--transition);
    }
    .cm-stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--gold-light);
    }
    .cm-stat-card .stat-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem;
      margin: 0 auto 8px;
    }
    .stat-icon.blue { background: rgba(59,130,246,.12); color: #2563eb; }
    .stat-icon.green { background: rgba(34,197,94,.12); color: #16a34a; }
    .stat-icon.orange { background: rgba(245,158,11,.12); color: #d97706; }
    .stat-icon.purple { background: rgba(139,92,246,.12); color: #7c3aed; }
    .cm-stat-card .stat-number {
      font-size: 1.2rem; font-weight: 900;
      color: var(--navy); line-height: 1.2;
      margin-bottom: 2px;
    }
    .cm-stat-card .stat-label {
      font-size: 0.68rem; color: var(--gray-500);
      font-weight: 700;
    }

    /* ===== Toolbar ===== */
    .cm-toolbar {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .cm-search {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    .cm-search input {
      width: 100%;
      padding: 10px 40px 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.88rem;
      background: var(--gray-50);
      outline: none;
      transition: var(--transition);
    }
    .cm-search input:focus {
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(201,168,76,.15);
    }
    .cm-search .si {
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      pointer-events: none;
    }

    /* ===== Sections List ===== */
    .cm-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }
    .cm-section-card {
      background: var(--white);
      border-radius: var(--radius-md);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-sm);
      padding: 14px 16px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
    }
    .cm-section-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 5px; height: 100%;
      background: var(--gold);
    }
    .cm-section-card.inactive::before {
      background: var(--gray-300);
    }
    .cm-section-card.inactive {
      opacity: 0.65;
      background: var(--gray-50);
    }
    .cm-section-card:hover {
      border-color: var(--gold-light);
      box-shadow: var(--shadow-md);
    }
    .cm-order {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem;
      font-weight: 900;
      flex-shrink: 0;
      border: 2px solid var(--white);
      box-shadow: 0 4px 12px rgba(26,42,74,.2);
    }
    .cm-section-info { min-width: 0; }
    .cm-section-info h4 {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--navy);
      margin: 0 0 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cm-section-info h4 i { color: var(--gold); font-size: 0.9rem; }
    .cm-section-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--gray-500);
      align-items: center;
    }
    .cm-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      background: var(--gray-100);
      border-radius: var(--radius-full);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--gray-600);
    }
    .cm-pill.green { background: rgba(34,197,94,.12); color: #16a34a; }
    .cm-pill.orange { background: rgba(245,158,11,.12); color: #d97706; }
    .cm-pill.purple { background: rgba(139,92,246,.12); color: #7c3aed; }
    .cm-pill.blue { background: rgba(59,130,246,.12); color: #2563eb; }
    .cm-pill i { font-size: 0.6rem; }

    .cm-actions {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .cm-action-btn {
      width: 34px; height: 34px;
      border-radius: 10px;
      border: 2px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.82rem;
    }
    .cm-action-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .cm-action-btn.up:hover { background: #3b82f6; color: white; border-color: #2563eb; }
    .cm-action-btn.down:hover { background: #3b82f6; color: white; border-color: #2563eb; }
    .cm-action-btn.edit:hover { background: #f59e0b; color: white; border-color: #d97706; }
    .cm-action-btn.toggle:hover { background: var(--gold); color: var(--navy); border-color: var(--gold-dark); }
    .cm-action-btn.delete:hover { background: #ef4444; color: white; border-color: #dc2626; }
    .cm-action-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ===== Empty / Loading ===== */
    .cm-empty {
      text-align: center;
      padding: 50px 20px;
      background: var(--white);
      border-radius: var(--radius-md);
      border: 2px dashed var(--gray-300);
    }
    .cm-empty .empty-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--gray-100);
      color: var(--gray-400);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px;
    }
    .cm-empty h3 {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .cm-empty p {
      font-size: 0.85rem;
      color: var(--gray-500);
      margin-bottom: 18px;
    }

    /* ===== Modal ===== */
    .cm-modal-header {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .cm-modal-header h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cm-modal-header h3 i { color: var(--gold); }

    /* Items editor */
    .items-editor {
      border: 2px dashed var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 12px;
      background: var(--gray-50);
      margin-top: 6px;
    }
    .item-row {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-bottom: 8px;
      position: relative;
    }
    .item-row:last-child { margin-bottom: 0; }
    .item-row .row-num {
      position: absolute;
      top: -8px;
      right: 10px;
      background: var(--navy);
      color: var(--gold);
      font-size: 0.65rem;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 10px;
      z-index: 1;
    }
    .item-row .remove-item {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: #fee2e2;
      color: #dc2626;
      border: none;
      cursor: pointer;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .item-row .remove-item:hover {
      background: #dc2626;
      color: white;
    }
    .item-row .item-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding-right: 6px;
    }
    .item-row .item-grid.two-col {
      grid-template-columns: 100px 1fr;
    }
    .item-row label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--gray-500);
      margin-bottom: 3px;
      display: block;
    }
    .item-row input,
    .item-row textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.82rem;
      background: var(--white);
      outline: none;
      transition: var(--transition);
    }
    .item-row input:focus,
    .item-row textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,.15);
    }
    .item-row textarea {
      resize: vertical;
      min-height: 50px;
    }
    .add-item-btn {
      width: 100%;
      padding: 10px;
      border: 2px dashed var(--gold-light);
      background: transparent;
      color: var(--gold-dark);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .add-item-btn:hover {
      background: rgba(201,168,76,.08);
      border-color: var(--gold);
    }

    .type-hint {
      font-size: 0.72rem;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
    }
    .type-hint i { color: var(--gold); }

    /* Toggle switch */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      margin-top: 14px;
    }
    .switch-row .switch-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .switch-row .switch-label i { color: var(--gold); }
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }
    .switch input { display: none; }
    .switch .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--gray-300);
      border-radius: 24px;
      transition: .3s;
    }
    .switch .slider::before {
      content: '';
      position: absolute;
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: .3s;
      box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }
    .switch input:checked + .slider {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    }
    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) and (pointer: coarse) {
      .cm-header { padding: 18px 16px; border-radius: var(--radius-md); }
      .cm-header-content .header-icon { width: 46px; height: 46px; font-size: 1.2rem; }
      .cm-header-content .header-text h1 { font-size: 1.02rem; }
      .cm-header-content .header-text p { font-size: 0.72rem; }

      .cm-tab { padding: 9px 14px; font-size: 0.78rem; }
      .cm-tab i { font-size: 0.85rem; }

      .cm-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .cm-stat-card { padding: 11px 8px; }
      .cm-stat-card .stat-icon { width: 34px; height: 34px; font-size: 0.9rem; }
      .cm-stat-card .stat-number { font-size: 1rem; }

      .cm-toolbar { padding: 10px; }
      .cm-search { min-width: 100%; }

      .cm-section-card {
        grid-template-columns: auto 1fr;
        gap: 10px;
        padding: 12px 14px;
      }
      .cm-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
        flex-wrap: wrap;
        padding-top: 8px;
        border-top: 1px solid var(--gray-100);
      }
      .cm-order { width: 38px; height: 38px; font-size: 0.95rem; }
      .cm-section-info h4 { font-size: 0.88rem; }
      .cm-action-btn { width: 32px; height: 32px; font-size: 0.75rem; }

      .item-row .item-grid.two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>
  <div id="header-placeholder"></div>

  <main class="page-content">
    <div class="container">

      <!-- Header -->
      <div class="cm-header">
        <div class="cm-header-content">
          <div class="header-icon"><i class="fas fa-file-alt"></i></div>
          <div class="header-text">
            <h1>إدارة المحتوى</h1>
            <p>إدارة الصفحات القانونية والمعلوماتية من مكان واحد</p>
          </div>
          <span class="header-badge">
            <i class="fas fa-crown"></i>
            سوبر أدمن
          </span>
        </div>
      </div>

      <!-- Tabs -->
      <div class="cm-tabs-wrap">
        <div class="cm-tabs" id="cmTabs">
          <button class="cm-tab active" data-collection="privacy_sections" data-meta="privacy_meta">
            <i class="fas fa-lock"></i>
            <span>سياسة الخصوصية</span>
            <span class="tab-count" id="tabCount-privacy">0</span>
          </button>
          <button class="cm-tab" data-collection="shipping_sections" data-meta="shipping_meta">
            <i class="fas fa-truck-fast"></i>
            <span>سياسة الشحن</span>
            <span class="tab-count" id="tabCount-shipping">0</span>
          </button>
          <button class="cm-tab" data-collection="exchange_sections" data-meta="exchange_meta">
            <i class="fas fa-exchange-alt"></i>
            <span>الاستبدال والإرجاع</span>
            <span class="tab-count" id="tabCount-exchange">0</span>
          </button>
          <button class="cm-tab" data-collection="terms_sections" data-meta="terms_meta">
            <i class="fas fa-file-contract"></i>
            <span>الشروط والأحكام</span>
            <span class="tab-count" id="tabCount-terms">0</span>
          </button>
          <button class="cm-tab" data-collection="faq_sections" data-meta="faq_meta">
            <i class="fas fa-question-circle"></i>
            <span>الأسئلة الشائعة</span>
            <span class="tab-count" id="tabCount-faq">0</span>
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div class="cm-stats">
        <div class="cm-stat-card">
          <div class="stat-icon blue"><i class="fas fa-list"></i></div>
          <div class="stat-number" id="statTotal">0</div>
          <div class="stat-label">إجمالي الأقسام</div>
        </div>
        <div class="cm-stat-card">
          <div class="stat-icon green"><i class="fas fa-eye"></i></div>
          <div class="stat-number" id="statActive">0</div>
          <div class="stat-label">نشطة</div>
        </div>
        <div class="cm-stat-card">
          <div class="stat-icon orange"><i class="fas fa-eye-slash"></i></div>
          <div class="stat-number" id="statInactive">0</div>
          <div class="stat-label">مخفية</div>
        </div>
        <div class="cm-stat-card">
          <div class="stat-icon purple"><i class="fas fa-clock"></i></div>
          <div class="stat-number" id="statUpdated" style="font-size:0.82rem;">—</div>
          <div class="stat-label">آخر تحديث</div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="cm-toolbar">
        <div class="cm-search">
          <input type="text" id="searchInput" placeholder="ابحث في الأقسام..." oninput="handleSearch(this.value)">
          <i class="fas fa-search si"></i>
        </div>
        <button class="btn btn-gold" onclick="openAddModal()">
          <i class="fas fa-plus"></i>
          قسم جديد
        </button>
        <button class="btn btn-outline" onclick="openSeedConfirm()">
          <i class="fas fa-download"></i>
          استيراد الافتراضي
        </button>
      </div>

      <!-- Sections List -->
      <div class="cm-list" id="sectionsList">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><p>جاري التحميل...</p></div>
      </div>

    </div>
  </main>

  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>
  <div id="footer-placeholder"></div>
  <div id="sidebar-placeholder"></div>
  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 admin/content-manager.html v1.0
    // إدارة موحدة للصفحات القانونية والمعلوماتية
    // ============================================================

    let _admin = null;
    let _currentCollection = 'privacy_sections';
    let _currentMeta = 'privacy_meta';
    let _sections = [];
    let _filtered = [];
    let _search = '';
    let _editingId = null;
    let _currentItems = [];
    let _unsub = null;

    const ICON_OPTIONS = [
      'fa-book-open', 'fa-handshake', 'fa-database', 'fa-bullseye', 'fa-cookie-bite',
      'fa-shield-virus', 'fa-user-lock', 'fa-balance-scale', 'fa-credit-card',
      'fa-user-check', 'fa-sync-alt', 'fa-headset', 'fa-file-alt', 'fa-lock',
      'fa-key', 'fa-shield-alt', 'fa-fire', 'fa-ban', 'fa-trash', 'fa-user-shield',
      'fa-eye', 'fa-flag', 'fa-heart', 'fa-star', 'fa-check-circle', 'fa-info-circle',
      'fa-gavel', 'fa-user', 'fa-users', 'fa-globe', 'fa-image', 'fa-shopping-bag',
      'fa-truck-fast', 'fa-file-invoice-dollar', 'fa-phone', 'fa-envelope',
      'fa-ticket-alt', 'fa-clock', 'fa-shield', 'fa-cog', 'fa-truck', 'fa-box',
      'fa-calendar-alt', 'fa-exchange-alt', 'fa-undo', 'fa-times-circle',
      'fa-question-circle', 'fa-life-ring', 'fa-comments', 'fa-cart-shopping',
      'fa-list-ol', 'fa-hourglass-half', 'fa-map-marker-alt', 'fa-road',
      'fa-file-contract', 'fa-gavel', 'fa-flag-checkered'
    ];

    const TYPE_LABELS = {
      text: 'فقرة نصية',
      quote: 'اقتباس مميز',
      list: 'قائمة نقطية',
      cards: 'شبكة كروت',
      table: 'جدول',
      contact: 'كروت تواصل',
      steps: 'خطوات مرقمة',
      faq: 'أسئلة وأجوبة'
    };

    // ============================================================
    // 🚀 Init
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof protectSuperAdminPage === 'function') {
        const ok = protectSuperAdminPage();
        if (ok === false) return;
      }

      if (typeof getCurrentUser !== 'function') {
        window.location.href = 'login.html';
        return;
      }

      const user = getCurrentUser();
      if (!user || !user.data || user.data.role !== ROLES.SUPER) {
        if (typeof showToast === 'function') {
          showToast('هذه الصفحة للسوبر أدمن فقط', 'error');
        }
        setTimeout(() => { window.location.href = 'home.html'; }, 1300);
        return;
      }

      _admin = user.data;

      // استرجاع آخر تبويب مفتوح
      const savedTab = sessionStorage.getItem('cm_active_tab');
      if (savedTab) {
        const tab = document.querySelector(`.cm-tab[data-collection="${savedTab}"]`);
        if (tab) {
          document.querySelectorAll('.cm-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          _currentCollection = tab.dataset.collection;
          _currentMeta = tab.dataset.meta;
        }
      }

      setupTabs();
      loadSections();
      loadMeta();
    });

    // ============================================================
    // 🎯 إدارة التبويبات
    // ============================================================
    function setupTabs() {
      document.querySelectorAll('.cm-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          if (_unsub) { _unsub(); _unsub = null; }

          document.querySelectorAll('.cm-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          _currentCollection = tab.dataset.collection;
          _currentMeta = tab.dataset.meta;
          _search = '';
          const si = document.getElementById('searchInput');
          if (si) si.value = '';

          sessionStorage.setItem('cm_active_tab', _currentCollection);

          loadSections();
          loadMeta();
        });
      });
    }

    // ============================================================
    // 📥 تحميل الأقسام (Realtime)
    // ============================================================
    function loadSections() {
      if (_unsub) { _unsub(); _unsub = null; }

      const list = document.getElementById('sectionsList');
      if (list) {
        list.innerHTML = `<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><p>جاري التحميل...</p></div>`;
      }

      _unsub = db.collection(_currentCollection)
        .orderBy('order', 'asc')
        .onSnapshot(snap => {
          _sections = [];
          snap.forEach(d => _sections.push({ id: d.id, ...d.data() }));
          updateStats();
          updateTabCounts();
          applyFilter();
        }, err => {
          console.error('loadSections error:', err);
          const l = document.getElementById('sectionsList');
          if (l) {
            l.innerHTML = `<div class="cm-empty">
              <div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>
              <h3>فشل التحميل</h3>
              <p>${err.code === 'permission-denied' ? 'ليس لديك صلاحية' : 'حدث خطأ في الاتصال'}</p>
            </div>`;
          }
        });
    }

    // تحديث عدد كل تبويب
    async function updateTabCounts() {
      const collections = [
        { id: 'privacy', collection: 'privacy_sections' },
        { id: 'shipping', collection: 'shipping_sections' },
        { id: 'exchange', collection: 'exchange_sections' },
        { id: 'terms', collection: 'terms_sections' },
        { id: 'faq', collection: 'faq_sections' }
      ];

      for (const c of collections) {
        try {
          let count = 0;
          if (c.collection === _currentCollection) {
            count = _sections.length;
          } else {
            const snap = await db.collection(c.collection).get();
            count = snap.size;
          }
          const el = document.getElementById(`tabCount-${c.id}`);
          if (el) el.textContent = count;
        } catch (e) {
          // تجاهل الأخطاء
        }
      }
    }

    // ============================================================
    // 📊 الإحصائيات
    // ============================================================
    function updateStats() {
      const total = _sections.length;
      const active = _sections.filter(s => s.active !== false).length;
      const inactive = total - active;
      setText('statTotal', total);
      setText('statActive', active);
      setText('statInactive', inactive);
    }

    function setText(id, v) {
      const el = document.getElementById(id);
      if (el) el.textContent = v;
    }

    // ============================================================
    // 📅 آخر تحديث
    // ============================================================
    async function loadMeta() {
      const el = document.getElementById('statUpdated');
      if (!el) return;
      try {
        const doc = await db.collection('site_content').doc(_currentMeta).get();
        if (doc.exists && doc.data().lastUpdated) {
          const d = doc.data().lastUpdated.toDate ? doc.data().lastUpdated.toDate() : new Date(doc.data().lastUpdated);
          el.textContent = d.toLocaleDateString('ar-EG', { month: 'short', day: 'numeric' });
        } else {
          el.textContent = '—';
        }
      } catch (e) {
        el.textContent = '—';
      }
    }

    // ============================================================
    // 🔍 بحث + عرض
    // ============================================================
    function handleSearch(v) {
      _search = v.trim().toLowerCase();
      applyFilter();
    }

    function applyFilter() {
      if (!_search) {
        _filtered = _sections.slice();
      } else {
        _filtered = _sections.filter(s =>
          (s.title || '').toLowerCase().includes(_search)
        );
      }
      renderList();
    }

    function renderList() {
      const list = document.getElementById('sectionsList');
      if (!list) return;

      if (!_filtered.length) {
        list.innerHTML = `
          <div class="cm-empty">
            <div class="empty-icon"><i class="fas fa-inbox"></i></div>
            <h3>${_sections.length ? 'لا نتائج للبحث' : 'مفيش أقسام لسه'}</h3>
            <p>${_sections.length ? 'جرب كلمة تانية' : 'ابدأ بإضافة قسم جديد أو استيراد المحتوى الافتراضي'}</p>
            ${!_sections.length ? `
              <button class="btn btn-gold" onclick="openAddModal()">
                <i class="fas fa-plus"></i>
                إضافة أول قسم
              </button>
            ` : ''}
          </div>
        `;
        return;
      }

      list.innerHTML = _filtered.map((s, idx) => {
        const isFirst = _sections.indexOf(s) === 0;
        const isLast = _sections.indexOf(s) === _sections.length - 1;
        const typeLabel = TYPE_LABELS[s.bodyType] || s.bodyType || '—';
        const active = s.active !== false;

        return `
          <div class="cm-section-card ${active ? '' : 'inactive'}">
            <div class="cm-order">${s.order || idx + 1}</div>

            <div class="cm-section-info">
              <h4>
                <i class="fas ${s.icon || 'fa-file-alt'}"></i>
                ${escapeHtml(s.title || 'بدون عنوان')}
              </h4>
              <div class="cm-section-meta">
                <span class="cm-pill purple">
                  <i class="fas fa-shapes"></i>
                  ${typeLabel}
                </span>
                <span class="cm-pill ${active ? 'green' : 'orange'}">
                  <i class="fas ${active ? 'fa-check-circle' : 'fa-eye-slash'}"></i>
                  ${active ? 'نشط' : 'مخفي'}
                </span>
                <span class="cm-pill">
                  <i class="fas fa-list-ol"></i>
                  عدد العناصر: ${(s.items && s.items.length) || 0}
                </span>
              </div>
            </div>

            <div class="cm-actions">
              <button class="cm-action-btn up" ${isFirst ? 'disabled' : ''}
                      onclick="moveUp('${s.id}')" title="تحريك لأعلى">
                <i class="fas fa-arrow-up"></i>
              </button>
              <button class="cm-action-btn down" ${isLast ? 'disabled' : ''}
                      onclick="moveDown('${s.id}')" title="تحريك لأسفل">
                <i class="fas fa-arrow-down"></i>
              </button>
              <button class="cm-action-btn toggle"
                      onclick="toggleActive('${s.id}')" title="${active ? 'إخفاء' : 'إظهار'}">
                <i class="fas ${active ? 'fa-eye-slash' : 'fa-eye'}"></i>
              </button>
              <button class="cm-action-btn edit" onclick="openEditModal('${s.id}')" title="تعديل">
                <i class="fas fa-pen"></i>
              </button>
              <button class="cm-action-btn delete" onclick="confirmDelete('${s.id}')" title="حذف">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ============================================================
    // 🔼🔼 الترتيب
    // ============================================================
    async function moveUp(id) {
      const idx = _sections.findIndex(s => s.id === id);
      if (idx <= 0) return;
      await swapOrders(idx, idx - 1);
    }

    async function moveDown(id) {
      const idx = _sections.findIndex(s => s.id === id);
      if (idx < 0 || idx >= _sections.length - 1) return;
      await swapOrders(idx, idx + 1);
    }

    async function swapOrders(i, j) {
      try {
        const a = _sections[i];
        const b = _sections[j];
        const batch = db.batch();
        batch.update(db.collection(_currentCollection).doc(a.id), { order: b.order || (j + 1) });
        batch.update(db.collection(_currentCollection).doc(b.id), { order: a.order || (i + 1) });
        await batch.commit();
        await touchMeta();
      } catch (err) {
        console.error(err);
        showToast('فشل الترتيب', 'error');
      }
    }

    // ============================================================
    // 👁️ إظهار/إخفاء
    // ============================================================
    async function toggleActive(id) {
      const s = _sections.find(x => x.id === id);
      if (!s) return;
      try {
        await db.collection(_currentCollection).doc(id).update({
          active: !(s.active !== false),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await touchMeta();
        showToast(s.active !== false ? 'تم إخفاء القسم' : 'تم إظهار القسم', 'success');
      } catch (err) {
        console.error(err);
        showToast('فشل التحديث', 'error');
      }
    }

    // ============================================================
    // ➕ Modal إضافة
    // ============================================================
    function openAddModal() {
      _editingId = null;
      const nextOrder = _sections.length ? Math.max(..._sections.map(s => s.order || 0)) + 1 : 1;
      showEditorModal({
        title: 'إضافة قسم جديد',
        icon: 'fa-plus',
        data: {
          title: '',
          icon: 'fa-file-alt',
          bodyType: 'text',
          body: '',
          items: [],
          order: nextOrder,
          active: true
        }
      });
    }

    // ============================================================
    // ✏️ Modal تعديل
    // ============================================================
    function openEditModal(id) {
      const s = _sections.find(x => x.id === id);
      if (!s) return;
      _editingId = id;
      showEditorModal({
        title: 'تعديل القسم',
        icon: 'fa-pen',
        data: { ...s }
      });
    }

    // ============================================================
    // 🎨 بناء Modal المحرر
    // ============================================================
    function showEditorModal({ title, icon, data }) {
      const iconsListHtml = ICON_OPTIONS.map(i => `<option value="${i}">`).join('');
      const typesOptions = Object.entries(TYPE_LABELS).map(([k, v]) =>
        `<option value="${k}" ${data.bodyType === k ? 'selected' : ''}>${v}</option>`
      ).join('');

      const modalHtml = `
        <div class="modal-overlay show" id="editorModal" onclick="closeEditorModal(event)">
          <div class="modal-content medium" onclick="event.stopPropagation()" style="max-width:700px;">
            <div class="cm-modal-header">
              <h3><i class="fas ${icon}"></i> ${title}</h3>
              <button class="modal-close" onclick="closeEditorModal()"><i class="fas fa-times"></i></button>
            </div>

            <div class="modal-body">

              <div class="form-group">
                <label>عنوان القسم <span class="required">*</span></label>
                <input type="text" id="fTitle" maxlength="120" value="${escapeAttr(data.title)}" placeholder="مثال: مقدمة">
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label>الأيقونة</label>
                  <input type="text" id="fIcon" list="iconList" value="${escapeAttr(data.icon)}" placeholder="fa-file-alt">
                  <datalist id="iconList">${iconsListHtml}</datalist>
                  <div class="type-hint">
                    <i class="fas fa-info-circle"></i>
                    اكتب اسم أيقونة Font Awesome أو اختر من القائمة
                  </div>
                </div>

                <div class="form-group">
                  <label>نوع المحتوى <span class="required">*</span></label>
                  <select id="fBodyType" onchange="onTypeChange(this.value)">
                    ${typesOptions}
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label id="fBodyLabel">نص توضيحي (اختياري)</label>
                <textarea id="fBody" placeholder="نص يظهر قبل المحتوى..." maxlength="3000" style="min-height:80px;">${escapeHtml(data.body || '')}</textarea>
                <div class="type-hint">
                  <i class="fas fa-info-circle"></i>
                  يدعم HTML البسيط مثل &lt;strong&gt; و &lt;br&gt;
                </div>
              </div>

              <div class="form-group" id="itemsEditorGroup">
                <label id="itemsLabel">عناصر القسم</label>
                <div class="items-editor" id="itemsEditor"></div>
                <button class="add-item-btn" type="button" onclick="addItem()" style="margin-top:8px;">
                  <i class="fas fa-plus"></i>
                  إضافة عنصر
                </button>
              </div>

              <div class="switch-row">
                <div class="switch-label">
                  <i class="fas fa-eye"></i>
                  القسم نشط (يظهر في الصفحة)
                </div>
                <label class="switch">
                  <input type="checkbox" id="fActive" ${data.active !== false ? 'checked' : ''}>
                  <span class="slider"></span>
                </label>
              </div>

            </div>

            <div class="modal-actions">
              <button class="btn btn-outline" onclick="closeEditorModal()">
                <i class="fas fa-times"></i>
                إلغاء
              </button>
              <button class="btn btn-gold" id="saveBtn" onclick="saveSection()">
                <i class="fas fa-save"></i>
                حفظ
              </button>
            </div>
          </div>
        </div>
      `;

      const existing = document.getElementById('editorModal');
      if (existing) existing.remove();

      document.body.insertAdjacentHTML('beforeend', modalHtml);
      document.body.style.overflow = 'hidden';

      _currentItems = (data.items || []).map(it => ({ ...it }));
      renderItemsEditor(data.bodyType);
    }

    let _currentBodyType = 'text';

    function onTypeChange(type) {
      _currentBodyType = type;
      renderItemsEditor(type);
    }

    // ============================================================
    // 🎯 محرر العناصر
    // ============================================================
    function renderItemsEditor(type) {
      _currentBodyType = type;
      const itemsGroup = document.getElementById('itemsEditorGroup');
      if (!itemsGroup) return;

      const bodyLabel = document.getElementById('fBodyLabel');
      const itemsLabel = document.getElementById('itemsLabel');
      const bodyField = document.getElementById('fBody');

      // الأنواع اللي مش محتاجة عناصر
      if (type === 'text' || type === 'quote') {
        itemsGroup.style.display = 'none';
        if (bodyLabel) bodyLabel.textContent = 'المحتوى (يقبل HTML البسيط)';
        if (bodyField) bodyField.placeholder = 'اكتب المحتوى هنا...';
        return;
      }

      itemsGroup.style.display = 'block';

      // تسميات حسب النوع
      const labels = {
        list: { body: 'نص توضيحي (اختياري)', items: 'عناصر القائمة', btn: 'إضافة بند', ph: 'مثال: الاسم الكامل' },
        cards: { body: 'نص توضيحي (اختياري)', items: 'كروت القسم', btn: 'إضافة كارت', ph: 'مثال: بيانات الحساب' },
        table: { body: 'نص توضيحي (اختياري)', items: 'صفوف الجدول', btn: 'إضافة صف', ph: 'مثال: 100' },
        contact: { body: 'نص توضيحي (اختياري)', items: 'وسائل التواصل', btn: 'إضافة وسيلة', ph: 'مثال: واتساب' },
        steps: { body: 'نص توضيحي (اختياري)', items: 'الخطوات', btn: 'إضافة خطوة', ph: 'مثال: تواصل معنا' },
        faq: { body: 'نص توضيحي (اختياري)', items: 'الأسئلة والأجوبة', btn: 'إضافة سؤال', ph: 'مثال: كيف أسجل؟' }
      };

      const l = labels[type] || labels.list;
      if (bodyLabel) bodyLabel.textContent = l.body;
      if (itemsLabel) itemsLabel.textContent = l.items;
      if (bodyField) bodyField.placeholder = 'نص يظهر قبل العناصر (اختياري)...';

      if (!_currentItems.length) {
        _currentItems = [createEmptyItem(type)];
      }

      renderItems();

      const addBtn = document.querySelector('.add-item-btn');
      if (addBtn) {
        addBtn.innerHTML = `<i class="fas fa-plus"></i> ${l.btn}`;
      }
    }

    function createEmptyItem(type) {
      if (type === 'list') return { text: '' };
      if (type === 'table') return { label: '', value: '' };
      if (type === 'contact') return { icon: 'fas fa-link', title: '', text: '', url: '', color: '#1a2a4a' };
      if (type === 'steps') return { icon: 'fa-check', title: '', text: '' };
      if (type === 'faq') return { title: '', text: '' };
      return { icon: 'fa-info', title: '', text: '' }; // cards
    }

    function renderItems() {
      const editor = document.getElementById('itemsEditor');
      const type = _currentBodyType;
      if (!editor) return;

      editor.innerHTML = _currentItems.map((it, i) => {
        let content = '';

        if (type === 'list') {
          content = `
            <div class="item-grid">
              <div>
                <label>النص</label>
                <textarea oninput="_currentItems[${i}].text = this.value" maxlength="500">${escapeHtml(it.text || '')}</textarea>
              </div>
            </div>
          `;
        } else if (type === 'table') {
          content = `
            <div class="item-grid two-col">
              <div>
                <label>العنوان</label>
                <input type="text" value="${escapeAttr(it.label || '')}" oninput="_currentItems[${i}].label = this.value" maxlength="100">
              </div>
              <div>
                <label>القيمة</label>
                <input type="text" value="${escapeAttr(it.value || '')}" oninput="_currentItems[${i}].value = this.value" maxlength="300">
              </div>
            </div>
          `;
        } else if (type === 'contact') {
          content = `
            <div class="item-grid">
              <div class="item-grid two-col">
                <div>
                  <label>الأيقونة (Font Awesome)</label>
                  <input type="text" value="${escapeAttr(it.icon || '')}" oninput="_currentItems[${i}].icon = this.value" placeholder="fas fa-envelope">
                </div>
                <div>
                  <label>اللون (Hex)</label>
                  <input type="text" value="${escapeAttr(it.color || '#1a2a4a')}" oninput="_currentItems[${i}].color = this.value" placeholder="#1a2a4a">
                </div>
              </div>
              <div>
                <label>الاسم الظاهر</label>
                <input type="text" value="${escapeAttr(it.title || '')}" oninput="_currentItems[${i}].title = this.value" maxlength="60">
              </div>
              <div>
                <label>القيمة (رقم/إيميل)</label>
                <input type="text" value="${escapeAttr(it.text || '')}" oninput="_currentItems[${i}].text = this.value" maxlength="120">
              </div>
              <div>
                <label>الرابط (URL)</label>
                <input type="text" value="${escapeAttr(it.url || '')}" oninput="_currentItems[${i}].url = this.value" maxlength="300" placeholder="https://...">
              </div>
            </div>
          `;
        } else if (type === 'steps') {
          content = `
            <div class="item-grid">
              <div class="item-grid two-col">
                <div>
                  <label>الأيقونة</label>
                  <input type="text" value="${escapeAttr(it.icon || '')}" oninput="_currentItems[${i}].icon = this.value" placeholder="fa-check">
                </div>
                <div>

    function addItem() {

      _currentItems.splice(idx, 1);
      renderItems();

    // ============================================================
    // 💾 حفظ
    // ============================================================
    async function saveSection() {
      const btn = document.getElementById('saveBtn');
      const title = document.getElementById('fTitle').value.trim();
      const icon = document.getElementById('fIcon').value.trim() || 'fa-file-alt';
      const bodyType = document.getElementById('fBodyType').value;
      const body = document.getElementById('fBody').value.trim();
      const active = document.getElementById('fActive').checked;

      if (!title) {
        showToast('اكتب عنوان القسم', 'warning');
        document.getElementById('fTitle').focus();
        return;
      }

      let items = [];
      if (bodyType === 'list' || bodyType === 'faq') {
        items = _currentItems.filter(it => (it.text || '').trim() || (it.title || '').trim());
      } else if (bodyType === 'table') {
        items = _currentItems.filter(it => (it.label || '').trim() || (it.value || '').trim());
      } else if (bodyType === 'contact' || bodyType === 'cards' || bodyType === 'steps') {
        items = _currentItems.filter(it => (it.title || '').trim() || (it.text || '').trim());
      }

      if (['list', 'table', 'cards', 'contact', 'steps', 'faq'].includes(bodyType) && !items.length) {
        showToast('أضف عنصر واحد على الأقل', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      try {
        const now = firebase.firestore.FieldValue.serverTimestamp();
        const payload = {
          title,
          icon,
          bodyType,
          body,
          items,
          active,
          updatedAt: now
        };

        if (_editingId) {
          await db.collection(_currentCollection).doc(_editingId).update(payload);
        } else {
          payload.order = _sections.length ? Math.max(..._sections.map(s => s.order || 0)) + 1 : 1;
          payload.createdAt = now;
          await db.collection(_currentCollection).add(payload);
        }

        await touchMeta();
        showToast('تم الحفظ', 'success');
        closeEditorModal();
        updateTabCounts();

      } catch (err) {
        console.error(err);
        showToast('فشل الحفظ: ' + (err.message || ''), 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
      }
    }

    function closeEditorModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const m = document.getElementById('editorModal');
      if (m) m.remove();
      document.body.style.overflow = '';
      _editingId = null;
      _currentItems = [];
    }

    function confirmDelete(id) {
      const s = _sections.find(x => x.id === id);
      if (!s) return;

      const modalHtml = `
        <div class="modal-overlay show" id="deleteModal" onclick="closeDeleteModal(event)">
          <div class="modal-content small" onclick="event.stopPropagation()">
            <div class="cm-modal-header" style="background:linear-gradient(135deg,#dc2626,#991b1b);">
              <h3><i class="fas fa-trash"></i> تأكيد الحذف</h3>
              <button class="modal-close" onclick="closeDeleteModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" style="text-align:center;padding:24px;">
              <div style="width:70px;height:70px;border-radius:50%;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 14px;">
                <i class="fas fa-exclamation-triangle"></i>
              </div>
              <h4 style="font-size:1.05rem;color:var(--navy);margin-bottom:8px;">متأكد من حذف "${escapeHtml(s.title)}"؟</h4>
              <p style="font-size:0.85rem;color:var(--gray-500);margin-bottom:0;">لا يمكن استرجاع القسم بعد الحذف.</p>
            </div>
            <div class="modal-actions">
              <button class="btn btn-outline" onclick="closeDeleteModal()">
                <i class="fas fa-times"></i> إلغاء
              </button>
              <button class="btn btn-danger" id="confirmDelBtn" onclick="doDelete('${id}')">
                <i class="fas fa-trash"></i> حذف نهائي
              </button>
            </div>
          </div>
        </div>
      `;
      const existing = document.getElementById('deleteModal');
      if (existing) existing.remove();
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      document.body.style.overflow = 'hidden';
    }

    function closeDeleteModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const m = document.getElementById('deleteModal');
      if (m) m.remove();
      document.body.style.overflow = '';
    }

    async function doDelete(id) {
      const btn = document.getElementById('confirmDelBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحذف...';
      try {
        await db.collection(_currentCollection).doc(id).delete();
        await touchMeta();
        showToast('تم الحذف', 'success');
        closeDeleteModal();
        updateTabCounts();
      } catch (err) {
        console.error(err);
        showToast('فشل الحذف', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-trash"></i> حذف نهائي';
      }
    }

        privacy: 'سياسة الخصوصية',
        shipping: 'سياسة الشحن',
        exchange: 'الاستبدال والإرجاع',
        terms: 'الشروط والأحكام',
        faq: 'الأسئلة الشائعة'
      };

      const modalHtml = `
        <div class="modal-overlay show" id="seedModal" onclick="closeSeedModal(event)">
          <div class="modal-content small" onclick="event.stopPropagation()">
            <div class="cm-modal-header" style="background:linear-gradient(135deg,#c9a84c,#b8942a);">
              <h3><i class="fas fa-download"></i> استيراد الأقسام الافتراضية</h3>
              <button class="modal-close" onclick="closeSeedModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" style="padding:20px;">
              <div style="background:#fcf9f0;border:1px solid var(--gold-light);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px;font-size:0.85rem;line-height:1.7;color:var(--gray-700);">
                <i class="fas fa-info-circle" style="color:var(--gold-dark);"></i>
                سيتم إضافة <strong>${missing.length}</strong> قسم جديد لصفحة <strong>${names[collectionName] || ''}</strong>.
                الأقسام الموجودة بنفس العنوان <strong>لن يتم لمسها</strong>.
              </div>
              <div style="max-height:240px;overflow-y:auto;background:var(--gray-50);border-radius:var(--radius-sm);padding:10px;font-size:0.82rem;">
                ${missing.map((s, i) => `<div style="padding:5px 0;border-bottom:1px solid var(--gray-100);">${i + 1}. ${escapeHtml(s.title)}</div>`).join('')}
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-outline" onclick="closeSeedModal()">
                <i class="fas fa-times"></i> إلغاء
              </button>
              <button class="btn btn-gold" id="seedBtn" onclick="doSeed()">
                <i class="fas fa-download"></i> استيراد
              </button>
            </div>
          </div>
        </div>
      `;
      const ex = document.getElementById('seedModal');
      if (ex) ex.remove();
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      document.body.style.overflow = 'hidden';
    }

    function closeSeedModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const m = document.getElementById('seedModal');
      if (m) m.remove();
      document.body.style.overflow = '';
    }

    async function doSeed() {
      const btn = document.getElementById('seedBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الاستيراد...';

      try {
        const seedList = SEED_DATA[_currentCollection] || [];
        const existingTitles = _sections.map(s => (s.title || '').trim());
        const missing = seedList.filter(s => !existingTitles.includes(s.title));
        let startOrder = _sections.length ? Math.max(..._sections.map(s => s.order || 0)) : 0;
        const now = firebase.firestore.FieldValue.serverTimestamp();
        const batch = db.batch();

        missing.forEach(s => {
          startOrder++;
          const ref = db.collection(_currentCollection).doc();
          batch.set(ref, {
            ...s,
            order: startOrder,
            active: true,
            createdAt: now,
            updatedAt: now
          });
        });

        await batch.commit();
        await touchMeta();
        showToast(`تم استيراد ${missing.length} قسم`, 'success');
        closeSeedModal();
        updateTabCounts();
      } catch (err) {
        console.error(err);
        showToast('فشل الاستيراد: ' + (err.message || ''), 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-download"></i> استيراد';
      }
    }

    // ============================================================
    // 📅 تحديث meta (تاريخ آخر تعديل)
    // ============================================================
    async function touchMeta() {
      try {
        await db.collection('site_content').doc(_currentMeta).set({
          lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy: _admin.uid || _admin.id,
          updatedByName: _admin.name || 'السوبر أدمن',
          version: '1.0'
        }, { merge: true });
        loadMeta();
      } catch (e) {
        console.warn('touchMeta failed', e);
      }
    }

    // ============================================================
    // 🛠️ Helpers
    // ============================================================
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function escapeAttr(s) {
      return String(s == null ? '' : s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeEditorModal();
        closeDeleteModal();
        closeSeedModal();
      }
    });

    window.openAddModal = openAddModal;
    window.openEditModal = openEditModal;
    window.closeEditorModal = closeEditorModal;
    window.saveSection = saveSection;
    window.moveUp = moveUp;
    window.moveDown = moveDown;
    window.toggleActive = toggleActive;
    window.confirmDelete = confirmDelete;
    window.closeDeleteModal = closeDeleteModal;
    window.doDelete = doDelete;
    window.openSeedConfirm = openSeedConfirm;
    window.closeSeedModal = closeSeedModal;
    window.doSeed = doSeed;
    window.handleSearch = handleSearch;
    window.onTypeChange = onTypeChange;
    window.addItem = addItem;
    window.removeItem = removeItem;
  </script>

</body>
</html>

  function previewInstallmentSchedule() {
    const days = parseInt(document.getElementById('planDays')?.value) || 7;
    const startDate = document.getElementById('planStartDate')?.value || new Date().toISOString().slice(0,10);
    const order = orState.orders.find(o => o.id === orState.currentOrderId);
    if (!order) return;

    const total = order.total || 0;
    const cfg = window.CREDIT_CONFIG;
    const count = cfg.INSTALLMENTS_PER_DAYS[days] || 2;
    const baseAmount = Math.floor(total / count);
    const remainder = total - (baseAmount * (count - 1));

    let schedule = [];
    let start = new Date(startDate);
    for (let i = 1; i <= count; i++) {
      let due = new Date(start);
      due.setDate(due.getDate() + Math.round(i * days / count));
      const amount = i === count ? remainder : baseAmount;
      schedule.push({ n: i, due: due, amount: amount });
    }

    const rows = schedule.map(s => `
      <tr style="border-bottom:1px solid var(--gray-200);">
        <td style="padding:6px;text-align:center;font-weight:800;">${s.n}</td>
        <td style="padding:6px;color:var(--gray-700);">${s.due.toLocaleDateString('ar-EG')}</td>
        <td style="padding:6px;text-align:left;font-weight:900;color:#5b21b6;">${s.amount.toFixed(2)} ج</td>
      </tr>
    `).join('');

    const preview = document.getElementById('schedulePreview');
    if (preview) {
      preview.innerHTML = `
        <table style="width:100%;">
          <thead>
            <tr style="border-bottom:2px solid var(--gray-300);">
              <th style="padding:4px;text-align:center;font-size:0.75rem;">#</th>
              <th style="padding:4px;text-align:right;font-size:0.75rem;">التاريخ</th>
              <th style="padding:4px;text-align:left;font-size:0.75rem;">المبلغ</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-300);text-align:center;font-weight:900;color:#5b21b6;">
          الإجمالي: ${total.toFixed(2)} ج
        </div>
      `;
    }
  }

  async function confirmInstallmentPlan(orderId) {
    const days = parseInt(document.getElementById('planDays')?.value) || 7;
    const startDate = document.getElementById('planStartDate')?.value;

    if (!startDate) {
      window.showToast('اختر تاريخ البداية', 'warning');
      return;
    }

    if (!confirm(`إنشاء خطة أقساط ${days} أيام؟`)) return;

    try {
      const orderRef = db.collection('orders').doc(orderId);
      const orderDoc = await orderRef.get();
      if (!orderDoc.exists) throw new Error('الطلب غير موجود');
      const order = orderDoc.data();

      if (order.installmentPlanId) throw new Error('يوجد خطة أقساط بالفعل');

      const total = order.total || 0;
      const cfg = window.CREDIT_CONFIG;
      const count = cfg.INSTALLMENTS_PER_DAYS[days] || 2;
      const baseAmount = Math.floor(total / count);
      const remainder = total - (baseAmount * (count - 1));
      const now = firebase.firestore.FieldValue.serverTimestamp();

      let schedule = [];
      let start = new Date(startDate);
      for (let i = 1; i <= count; i++) {
        let due = new Date(start);
        due.setDate(due.getDate() + Math.round(i * days / count));
        const amount = i === count ? remainder : baseAmount;
        schedule.push({
          n: i,
          dueDate: firebase.firestore.Timestamp.fromDate(due),
          amount: amount,
          paid: false,
          paidAt: null,
          paidAmount: 0,
          fee: 0,
          cashboxEntryId: '',
          method: ''
        });
      }

      const planRef = db.collection('installment_plans').doc();
      const planId = planRef.id;

      await db.runTransaction(async (t) => {
        t.set(planRef, {
          id: planId,
          customerId: order.customerId || null,
          customerName: order.customerName || '',
          orderId,
          invoiceId: order.invoiceId || null,
          totalAmount: total,
          days,
          installmentsCount: count,
          schedule,
          paidAmount: 0,
          remainingAmount: total,
          status: 'active',
          createdBy: orState.adminId,
          createdByName: orState.adminName,
          createdAt: now,
          reminders_sent: [],
          completedAt: null,
          notes: ''
        });

        t.update(orderRef, {
          installmentPlanId: planId,
          installmentSchedule: schedule,
          installmentPaidAmount: 0,
          installmentRemaining: total,
          paymentStatus: 'unpaid',
          updatedAt: now
        });
      });

      window.showToast('✅ تم إنشاء خطة الأقساط', 'success');
      closeModal('installmentModal');
      closeModal('orderModal');

    } catch (err) {
      console.error('confirmInstallmentPlan error:', err);
      window.showToast('❌ ' + err.message, 'error');
    }
  }

  async function sendWhatsApp(orderId) {
    const order = orState.orders.find(o => o.id === orderId);
    if (!order) return;

    const message = document.getElementById('waMessage')?.value || '';
    if (!message) return;

    const phone = (order.customerPhone || '').replace(/^0/, '20');
    if (!phone) {
      window.showToast('لا يوجد رقم هاتف', 'warning');
      return;
    }

    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');

    try {
      await db.collection('whatsapp_outbox').add({
        recipientPhone: order.customerPhone,
        recipientName: order.customerName || '',
        template: document.getElementById('waTemplate')?.value || 'order_confirmed',

  async function loadAvailableProductsForEdit(isWholesale, branchId, order) {
    const products = [];
    const currentIds = new Set((order.items || []).map(i => i.productId));

    try {
      if (isWholesale) {
        const snap = await db.collection('products').where('available', '==', true).limit(500).get();
        snap.forEach(doc => {
          const p = doc.data();
          const ppu = p.piecesPerUnit || 1;
          const total = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
          const reserved = p.reservedPieces || 0;
          const available = Math.max(0, total - reserved);
          const isCurrent = currentIds.has(doc.id);
          if (available > 0 || isCurrent) {
            const currentQty = isCurrent ? (order.items.find(i => i.productId === doc.id)?.quantity || 0) : 0;
            products.push({
              id: doc.id, name: p.name || '', imageUrl: p.imageUrl || '',
              unit: p.unit || 'قطعة', price: p.wholesalePrice || 0,
              available: available + currentQty
            });
          }
        });
      } else {
        const snap = await db.collection('branch_inventory').where('branchId', '==', branchId).limit(500).get();
        const invItems = [];
        snap.forEach(doc => {
          const d = doc.data();
          const available = (d.piecesQty || 0) - (d.reservedQty || 0);
          const isCurrent = currentIds.has(d.productId);
          if (available > 0 || isCurrent) {
            invItems.push({ inv: d, available, isCurrent });
          }
        });

        const pids = invItems.map(x => x.inv.productId);
        const productsMap = {};
        for (let i = 0; i < pids.length; i += 30) {
          const chunk = pids.slice(i, i + 30);
          if (chunk.length === 0) continue;
          const pSnap = await db.collection('products')
            .where(firebase.firestore.FieldPath.documentId(), 'in', chunk).get();
          pSnap.forEach(pd => { productsMap[pd.id] = pd.data(); });
        }

        invItems.forEach(({ inv, available, isCurrent }) => {
          const p = productsMap[inv.productId];
          if (!p) return;
          const currentQty = isCurrent ? (order.items.find(i => i.productId === inv.productId)?.quantity || 0) : 0;
          products.push({
            id: inv.productId, name: p.name || '',
            imageUrl: p.imageUrl || inv.productImage || '',
            unit: p.unit || inv.unit || 'قطعة',
            price: p.retailPrice || 0,
            available: available + currentQty
          });
        });
      }
    } catch (err) {
      console.error('Load products error:', err);
    }

    products.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
    return products;
  }

  function updateEditTotalsPreview() {
    const order = orState.orders.find(o => o.id === orState.currentOrderId);
    if (!order) return;

    const previewEl = document.getElementById('editTotalsPreview');
    if (!previewEl) return;

    const subtotal = (orState.editItems || []).reduce((s, i) => s + (i.price || 0) * (i.quantity || 0), 0);
    const rates = (window.SHIPPING_RATES_DEFAULTS || {})[order.storeType] || {};
    const rate = rates[order.region];
    const shipping = rate ? (subtotal >= rate.freeThreshold ? 0 : rate.cost) : (order.shippingCost || 0);
    const feePercent = order.paymentMethod === 'wallet' ? 1 : 0;
    const fee = (subtotal + shipping) * feePercent / 100;
    const total = Math.round((subtotal + shipping + fee) / 5) * 5;

    const diff = total - (order.total || 0);
    const diffClass = diff > 0 ? 'color:#dc2626;' : diff < 0 ? 'color:#16a34a;' : 'color:var(--gray-500);';
    const diffText = diff > 0 ? `+${diff.toFixed(0)} ج (زيادة)` : diff < 0 ? `${Math.abs(diff).toFixed(0)} ج (نقصان)` : 'لا تغيير';

    previewEl.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:0.82rem;">
        <div><strong>المجموع الفرعي:</strong> ${subtotal.toFixed(2)} ج</div>

      </div>

        الفرق: ${diffText}

  }

  async function saveEditedOrder(orderId) {
    const name = (document.getElementById('editName')?.value || '').trim();
    const phone = (document.getElementById('editPhone')?.value || '').trim();
    const phone2 = (document.getElementById('editPhone2')?.value || '').trim();
    const address = (document.getElementById('editAddress')?.value || '').trim();
    const deliveryDate = document.getElementById('editDeliveryDate')?.value || '';
    const notes = (document.getElementById('editNotes')?.value || '').trim();

    if (!name || name.length < 3) {
      window.showToast('الاسم مطلوب (3 أحرف على الأقل)', 'warning');
      document.getElementById('editName')?.focus();
      return;
    }
    if (!phone || !/^01[0-9]{9}$/.test(phone)) {
      window.showToast('رقم الهاتف غير صحيح', 'warning');
      document.getElementById('editPhone')?.focus();
      return;
    }
    if (phone2 && !/^01[0-9]{9}$/.test(phone2)) {
      window.showToast('رقم الهاتف البديل غير صحيح', 'warning');
      return;
    }
    if (!orState.editItems || orState.editItems.length === 0) {
      window.showToast('يجب أن يحتوي الطلب على منتج واحد على الأقل', 'warning');
      return;
    }

    const btn = document.getElementById('saveEditOrderBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

    try {
      const orderRef = db.collection('orders').doc(orderId);

      await db.runTransaction(async (t) => {
        const orderDoc = await t.get(orderRef);
        if (!orderDoc.exists) throw new Error('الطلب غير موجود');
        const o = orderDoc.data();

        if (!['pending', 'processing'].includes(o.status)) throw new Error('الطلب لم يعد قابلاً للتعديل');
        if (o.paymentStatus === 'paid' || o.paymentStatus === 'refunded') throw new Error('الطلب مدفوع — لا يمكن تعديله');

        const isWholesale = o.storeType === 'wholesale';
        const branchId = o.branchId || 'RGB';
        const now = firebase.firestore.FieldValue.serverTimestamp();

        const oldMap = {};
        (o.items || []).forEach(i => { oldMap[i.productId] = (oldMap[i.productId] || 0) + (i.quantity || 0); });
        const newMap = {};
        orState.editItems.forEach(i => { newMap[i.productId] = (newMap[i.productId] || 0) + (i.quantity || 0); });

        const allPids = new Set([...Object.keys(oldMap), ...Object.keys(newMap)]);
        const deltaChanges = [];

        for (const pid of allPids) {
          const oldQty = oldMap[pid] || 0;
          const newQty = newMap[pid] || 0;
          const delta = newQty - oldQty;
          if (delta === 0) continue;

          if (isWholesale) {
            const pRef = db.collection('products').doc(pid);
            const pDoc = await t.get(pRef);
            if (!pDoc.exists) {
              if (delta > 0) throw new Error(`المنتج غير موجود`);
              continue;
            }
            const p = pDoc.data();
            if (delta > 0) {
              const ppu = p.piecesPerUnit || 1;
              const totalPieces = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
              const reserved = p.reservedPieces || 0;
              const available = totalPieces - reserved;
              if (available < delta) throw new Error(`مخزون غير كافٍ: ${p.name} (متاح ${available} فقط)`);
            }
            t.update(pRef, { reservedPieces: firebase.firestore.FieldValue.increment(delta) });
            deltaChanges.push({ pid, name: p.name, delta });
          } else {
            const invRef = db.collection('branch_inventory').doc(`${branchId}_${pid}`);
            const invDoc = await t.get(invRef);
            if (!invDoc.exists) {
              if (delta > 0) throw new Error(`المنتج غير متوفر في الفرع`);
              continue;
            }
            const inv = invDoc.data();
            if (delta > 0) {
              const available = inv.availableQty || 0;
              if (available < delta) throw new Error(`مخزون غير كافٍ: ${inv.productName || pid} (متاح ${available} فقط)`);
            }
            t.update(invRef, {
              reservedQty: firebase.firestore.FieldValue.increment(delta),
              availableQty: firebase.firestore.FieldValue.increment(-delta),
              lastUpdated: now,
              updatedBy: orState.adminId
            });
            deltaChanges.push({ pid, name: inv.productName, delta });
          }
        }

        const newSubtotal = orState.editItems.reduce((s, i) => s + (i.price || 0) * (i.quantity || 0), 0);
        const rates = (window.SHIPPING_RATES_DEFAULTS || {})[o.storeType] || {};
        const rate = rates[o.region];
        const newShipping = rate ? (newSubtotal >= rate.freeThreshold ? 0 : rate.cost) : (o.shippingCost || 0);
        const feePercent = o.paymentMethod === 'wallet' ? 1 : 0;
        const newFee = (newSubtotal + newShipping) * feePercent / 100;
        const newTotal = Math.round((newSubtotal + newShipping + newFee) / 5) * 5;

        const cleanedItems = orState.editItems.map(i => ({
          productId: i.productId, productName: i.productName, imageUrl: i.imageUrl,
          quantity: i.quantity, unit: i.unit, price: i.price, total: i.total
        }));

        const balanceDelta = (o.customerId && o.balanceApplied) ? (newTotal - (o.total || 0)) : 0;

        const changes = [];
        if (o.customerName !== name) changes.push({ field: 'customerName', old: o.customerName, new: name });
        if (o.customerPhone !== phone) changes.push({ field: 'customerPhone', old: o.customerPhone, new: phone });
        if ((o.customerPhone2 || '') !== phone2) changes.push({ field: 'customerPhone2', old: o.customerPhone2, new: phone2 });
        if ((o.deliveryAddress || o.customerAddress || '') !== address) changes.push({ field: 'address', old: o.deliveryAddress || o.customerAddress, new: address });
        if ((o.deliveryDate || '') !== deliveryDate) changes.push({ field: 'deliveryDate', old: o.deliveryDate, new: deliveryDate });
        if ((o.notes || '') !== notes) changes.push({ field: 'notes', old: o.notes, new: notes });
        if (deltaChanges.length > 0) changes.push({ field: 'items', changes: deltaChanges });
        if (newTotal !== (o.total || 0)) changes.push({ field: 'total', old: o.total, new: newTotal });

        t.update(orderRef, {
          customerName: name,
          customerPhone: phone,
          customerPhone2: phone2 || '',
          deliveryAddress: address,
          customerAddress: address,
          deliveryDate: deliveryDate || '',
          notes: notes || '',
          items: cleanedItems,
          subtotal: newSubtotal,
          shippingCost: newShipping,
          paymentFee: newFee,
          total: newTotal,
          remaining: newTotal - (o.paidAmount || 0),
          modifications: firebase.firestore.FieldValue.arrayUnion({
            at: new Date().toISOString(),
            by: orState.adminId,
            byName: orState.adminName,
            changes
          }),
          updatedAt: now
        });

        if (balanceDelta !== 0) {
          const custRef = db.collection('customers').doc(o.customerId);
          t.update(custRef, { balance: firebase.firestore.FieldValue.increment(balanceDelta) });
        }

        if (o.customerId) {
          let notifBody = [];
          if (changes.some(c => c.field === 'items')) notifBody.push('تم تحديث المنتجات');
          if (changes.some(c => c.field === 'deliveryDate')) notifBody.push('موعد توصيل جديد');
          if (changes.some(c => c.field === 'total')) notifBody.push(`الإجمالي الجديد: ${newTotal} ج`);
          t.set(db.collection('customer_notifications').doc(), {
            userId: o.customerId,
            title: 'تم تعديل طلبك',
            body: notifBody.join(' · ') || 'تم تحديث بيانات طلبك',
            type: 'order_modified',
            orderId, read: false, createdAt: now
          });
        }
      });

      try {
        await db.collection(COLLECTIONS.ACTIVITY_LOG).add({
          userId: orState.adminId,
          userName: orState.adminName,
          userRole: orState.role,
          action: 'تعديل طلب',
          details: `#${orderId.slice(-8).toUpperCase()}`,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          url: window.location.pathname
        });
      } catch (e) {}

      window.showToast('✅ تم حفظ التعديلات', 'success');
      closeModal('editOrderModal');
      closeModal('orderModal');
      orState.editItems = null;
      orState.editAvailableProducts = null;

    } catch (err) {
      console.error('saveEditedOrder error:', err);
      window.showToast('❌ ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
    }
  }

    return String(s ?? '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الطلبات - أولاد شعلان</title>
  <meta name="theme-color" content="#1a2a4a">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       الأساسيات
       ============================================================ */
    html,
    body {
      overflow-x: hidden !important;
      max-width: 100vw;
    }

    /* ============================================================
       الهيدر الرئيسي
       ============================================================ */
    .or-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 18px;
      color: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(26, 42, 74, .25);
      border-bottom: 4px solid var(--gold);
    }

    .or-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -15%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(201, 168, 76, .18) 0%, transparent 70%);
      border-radius: 50%;
    }

    .or-header-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .or-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 220px;
    }

    .or-header-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(201, 168, 76, .4);
    }

    .or-header h1 {
      font-size: 1.35rem;
      font-weight: 900;
      margin: 0 0 3px;
      color: var(--white);
    }

    .or-header p {
      font-size: 0.83rem;
      opacity: 0.88;
      margin: 0;
    }

    .or-header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .or-header-actions .btn {
      background: rgba(255, 255, 255, .15);
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, .3);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .or-header-actions .btn:hover {
      background: var(--gold);
      color: var(--navy);
      border-color: var(--gold);
    }

    /* ============================================================
       الإحصائيات
       ============================================================ */
    .or-stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .or-stat {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 14px 10px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      text-align: center;
      transition: var(--transition);
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }

    .or-stat:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--gold-light);
    }

    .or-stat.active {
      border-color: var(--gold);
      background: linear-gradient(135deg, #fcf9f0, #f8f4e8);
    }

    .or-stat-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      margin: 0 auto 6px;
    }

    .or-stat-icon.gold   { background: rgba(201, 168, 76, .15);  color: var(--gold-dark); }
    .or-stat-icon.blue   { background: rgba(59, 130, 246, .12);  color: #2563eb; }
    .or-stat-icon.orange { background: rgba(249, 115, 22, .12);  color: #ea580c; }
    .or-stat-icon.purple { background: rgba(139, 92, 246, .12);  color: #7c3aed; }
    .or-stat-icon.green  { background: rgba(34, 197, 94, .12);   color: #16a34a; }
    .or-stat-icon.teal   { background: rgba(20, 184, 166, .12);  color: #0d9488; }
    .or-stat-icon.red    { background: rgba(239, 68, 68, .12);   color: #dc2626; }

    .or-stat-num {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--navy);
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .or-stat-num.gold   { color: var(--gold-dark); }
    .or-stat-num.blue   { color: #2563eb; }
    .or-stat-num.orange { color: #ea580c; }
    .or-stat-num.purple { color: #7c3aed; }
    .or-stat-num.green  { color: #16a34a; }
    .or-stat-num.teal   { color: #0d9488; }
    .or-stat-num.red    { color: #dc2626; }

    .or-stat-label {
      font-size: 0.65rem;
      color: var(--gray-500);
      font-weight: 700;
      line-height: 1.2;
    }

    /* ============================================================
       التبويبات
       ============================================================ */
    .or-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: var(--white);
      padding: 8px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .or-tabs::-webkit-scrollbar {
      height: 4px;
    }

    .or-tabs::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .or-tab {
      flex-shrink: 0;
      padding: 10px 16px;
      border: 2px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .or-tab:hover {
      border-color: var(--gold-light);
      background: var(--gray-50);
    }

    .or-tab.active {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      border-color: var(--navy);
      box-shadow: 0 6px 16px rgba(26, 42, 74, .25);
    }

    .or-tab.active i {
      color: var(--gold);
    }

    .or-tab .tab-count {
      background: rgba(0, 0, 0, .08);
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 900;
      min-width: 20px;
      text-align: center;
    }

    .or-tab.active .tab-count {
      background: var(--gold);
      color: var(--navy);
    }

    /* ============================================================
       الفلاتر
       ============================================================ */
    .or-filters {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .or-search {
      position: relative;
      flex: 1;
      min-width: 200px;
    }

    .or-search input {
      width: 100%;
      padding: 10px 40px 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.88rem;
      background: var(--gray-50);
      outline: none;
      transition: var(--transition);
    }

    .or-search input:focus {
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, .15);
    }

    .or-search i {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
    }

    .or-filters select,
    .or-filters input[type="date"] {
      padding: 10px 12px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.82rem;
      background: var(--gray-50);
      outline: none;
      cursor: pointer;
      min-width: 120px;
    }

    .or-filters select:focus,
    .or-filters input[type="date"]:focus {
      border-color: var(--gold);
      background: var(--white);
    }

    .or-filters .btn-icon-only {
      padding: 10px 14px;
      border: 2px solid var(--gray-200);
      background: var(--white);
      border-radius: var(--radius-sm);
      color: var(--gray-600);
      cursor: pointer;
      transition: var(--transition);
    }

    .or-filters .btn-icon-only:hover {
      border-color: var(--gold);
      color: var(--gold-dark);
    }

    .or-date-range {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .or-date-range span {
      font-size: 0.7rem;
      color: var(--gray-500);
    }

    /* ============================================================
       قائمة الطلبات
       ============================================================ */
    .or-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .or-card {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      padding: 14px 16px;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .or-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      height: 100%;
      background: var(--gold);
    }

    .or-card.status-pending::before              { background: #f59e0b; }
    .or-card.status-processing::before           { background: #3b82f6; }
    .or-card.status-ready::before                { background: #f97316; }
    .or-card.status-shipped::before              { background: #8b5cf6; }
    .or-card.status-delivered::before            { background: #eab308; }
    .or-card.status-paid::before                 { background: #22c55e; }
    .or-card.status-rejected::before             { background: #dc2626; }
    .or-card.status-rejected_by_customer::before { background: #b91c1c; }
    .or-card.status-cancelled::before            { background: #ef4444; }
    .or-card.status-auto_cancelled::before       { background: #6b7280; }
    .or-card.status-returned::before             { background: #f97316; }

    .or-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--gold-light);
    }

    .or-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .or-card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--navy);
      flex-wrap: wrap;
    }

    .or-num {
      font-family: 'Courier New', monospace;
      background: var(--gray-100);
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      direction: ltr;
    }

    /* ============================================================
       الشارات (Badges)
       ============================================================ */
    .or-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .or-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 0.68rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .or-badge.status-pending              { background: rgba(245, 158, 11, .15); color: #b45309; }
    .or-badge.status-processing           { background: rgba(59, 130, 246, .15); color: #1d4ed8; }
    .or-badge.status-ready                { background: rgba(249, 115, 22, .15); color: #c2410c; }
    .or-badge.status-shipped              { background: rgba(139, 92, 246, .15); color: #6d28d9; }
    .or-badge.status-delivered            { background: rgba(234, 179, 8, .15);  color: #a16207; }
    .or-badge.status-paid                 { background: rgba(34, 197, 94, .15);  color: #15803d; }
    .or-badge.status-rejected             { background: rgba(239, 68, 68, .15);  color: #b91c1c; }
    .or-badge.status-rejected_by_customer { background: rgba(185, 28, 28, .15);  color: #991b1b; }
    .or-badge.status-cancelled            { background: rgba(239, 68, 68, .15);  color: #b91c1c; }
    .or-badge.status-auto_cancelled       { background: rgba(107, 114, 128, .15); color: #4b5563; }
    .or-badge.status-returned             { background: rgba(249, 115, 22, .15); color: #c2410c; }

    .or-badge.payment-unpaid          { background: rgba(239, 68, 68, .15);  color: #b91c1c; }
    .or-badge.payment-pending         { background: rgba(245, 158, 11, .15); color: #b45309; }
    .or-badge.payment-partial         { background: rgba(245, 158, 11, .15); color: #b45309; }
    .or-badge.payment-paid            { background: rgba(34, 197, 94, .15);  color: #15803d; }
    .or-badge.payment-refunded        { background: rgba(139, 92, 246, .15); color: #6d28d9; }
    .or-badge.payment-awaiting_admin  { background: rgba(139, 92, 246, .15); color: #6d28d9; }
    .or-badge.payment-awaiting_agent  { background: rgba(59, 130, 246, .15); color: #1d4ed8; }
    .or-badge.payment-awaiting_cardoona { background: rgba(201, 168, 76, .15); color: #92400e; }

    .or-badge.reserved     { background: rgba(139, 92, 246, .15); color: #6d28d9; }
    .or-badge.cash-pending { background: rgba(234, 179, 8, .2);   color: #a16207; }
    .or-badge.branch       { background: var(--gray-100);         color: var(--gray-700); }

    /* ============================================================
       معلومات الكارد
       ============================================================ */
    .or-card-info {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      font-size: 0.8rem;
    }

    .or-info-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--gray-600);
    }

    .or-info-item i {
      color: var(--gold);
      font-size: 0.72rem;
      width: 14px;
      text-align: center;
      flex-shrink: 0;
    }

    .or-info-item .val {
      font-weight: 700;
      color: var(--navy);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .or-info-item .val.total {
      color: var(--gold-dark);
      font-size: 0.92rem;
    }

    /* ============================================================
       أزرار الإجراءات
       ============================================================ */
    .or-card-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px solid var(--gray-100);
    }

    .or-action-btn {
      padding: 7px 12px;
      border: 1.5px solid;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all .2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--white);
      white-space: nowrap;
    }

    .or-action-btn.view       { border-color: var(--gray-300); color: var(--gray-700); }
    .or-action-btn.view:hover { background: var(--navy); color: white; border-color: var(--navy); }

    .or-action-btn.approve        { border-color: #86efac; color: #15803d; background: #f0fdf4; }
    .or-action-btn.approve:hover  { background: #16a34a; color: white; border-color: #15803d; }

    .or-action-btn.reject        { border-color: #fca5a5; color: #b91c1c; background: #fef2f2; }
    .or-action-btn.reject:hover  { background: #dc2626; color: white; }

    .or-action-btn.ready        { border-color: #fdba74; color: #c2410c; background: #fff7ed; }
    .or-action-btn.ready:hover  { background: #f97316; color: white; }

    .or-action-btn.shipped        { border-color: #c4b5fd; color: #6d28d9; }
    .or-action-btn.shipped:hover  { background: #8b5cf6; color: white; border-color: #6d28d9; }

    .or-action-btn.deliver        { border-color: #fde68a; color: #a16207; background: #fefce8; }
    .or-action-btn.deliver:hover  { background: #eab308; color: white; }

    .or-action-btn.cash        { border-color: #86efac; color: #166534; background: #dcfce7; }
    .or-action-btn.cash:hover  { background: #16a34a; color: white; }

    .or-action-btn.cancel        { border-color: #fca5a5; color: #dc2626; }
    .or-action-btn.cancel:hover  { background: #dc2626; color: white; }

    .or-action-btn.return        { border-color: #fdba74; color: #c2410c; }
    .or-action-btn.return:hover  { background: #f97316; color: white; }

    .or-action-btn.install        { border-color: var(--gold); color: var(--gold-dark); background: #fcf9f0; }
    .or-action-btn.install:hover  { background: var(--gold); color: var(--navy); }

    .or-action-btn.reject-cust        { border-color: #fecaca; color: #b91c1c; background: #fef2f2; }
    .or-action-btn.reject-cust:hover  { background: #dc2626; color: white; }

    .or-action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ============================================================
       حالات فارغة / تحميل
       ============================================================ */
    .or-empty,
    .or-loading {
      text-align: center;
      padding: 60px 20px;
      background: var(--white);
      border-radius: var(--radius-md);
      border: 2px dashed var(--gray-300);
    }

    .or-empty .empty-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--gray-100);
      color: var(--gray-400);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto 16px;
    }

    .or-empty h3 {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .or-empty p {
      font-size: 0.85rem;
      color: var(--gray-500);
    }

    .or-loading i {
      font-size: 2rem;
      color: var(--gold);
      margin-bottom: 10px;
    }

    /* ============================================================
       النوافذ المنبثقة (Modal)
       ============================================================ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 26, 46, .75);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-content {
      background: var(--white);
      border-radius: var(--radius-lg);
      max-width: 850px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      padding: 0;
      position: relative;
      animation: modalSlide .3s ease;
    }

    .modal-content.small  { max-width: 500px; }
    .modal-content.medium { max-width: 650px; }

    @keyframes modalSlide {
      from { transform: translateY(-30px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      padding: 18px 22px;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .modal-header h2 {
      font-size: 1.05rem;
      font-weight: 900;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-header h2 i {
      color: var(--gold);
    }

    .modal-close {
      background: rgba(255, 255, 255, .15);
      border: none;
      color: var(--white);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      transition: var(--transition);
    }

    .modal-close:hover {
      background: var(--danger);
      transform: rotate(90deg);
    }

    .modal-body {
      padding: 20px 22px;
    }

    .modal-actions {
      padding: 16px 22px;
      border-top: 2px solid var(--gray-100);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      position: sticky;
      bottom: 0;
      background: var(--white);
      flex-wrap: wrap;
    }

    /* ============================================================
       أزرار عامة
       ============================================================ */
    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-outline        { background: transparent; border: 2px solid var(--gray-300); color: var(--gray-700); }
    .btn-outline:hover  { border-color: var(--gold); color: var(--gold-dark); }

    .btn-gold        { background: var(--gold); color: var(--navy); }
    .btn-gold:hover  { background: var(--gold-dark); color: var(--white); transform: translateY(-1px); }

    .btn-success        { background: #16a34a; color: white; }
    .btn-success:hover  { background: #15803d; }

    .btn-danger        { background: var(--danger); color: white; }
    .btn-danger:hover  { background: #b91c1c; }

    .btn-purple        { background: #8b5cf6; color: white; }
    .btn-purple:hover  { background: #6d28d9; }

    .btn-orange        { background: #f97316; color: white; }
    .btn-orange:hover  { background: #ea580c; }

    /* ============================================================
       تبويبات التفاصيل
       ============================================================ */
    .od-tab {
      padding: 8px 14px;
      border: none;
      background: transparent;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.78rem;
      color: var(--gray-600);
      cursor: pointer;
      transition: all .2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .od-tab:hover {
      background: rgba(255, 255, 255, .7);
      color: var(--navy);
    }

    .od-tab.active {
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .od-tab.active i {
      color: var(--gold);
    }

    .od-tab-content {
      display: none;
    }

    .od-tab-content.active {
      display: block;
      animation: fadeInTab .25s ease;
    }

    @keyframes fadeInTab {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       الاستجابة (Responsive)
       ============================================================ */
    @media (max-width: 1200px) {
      .or-stats {
        grid-template-columns: repeat(3, 1fr);
      }
      .or-card-info {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .or-header {
        padding: 16px;
        border-radius: var(--radius-md);
      }
      .or-header-icon {
        width: 46px;
        height: 46px;
        font-size: 1.2rem;
      }
      .or-header h1 {
        font-size: 1.05rem;
      }
      .or-stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .or-stat {
        padding: 11px 8px;
      }
      .or-stat-icon {
        width: 32px;
        height: 32px;
        font-size: 0.85rem;
      }
      .or-stat-num {
        font-size: 0.95rem;
      }
      .or-stat-label {
        font-size: 0.6rem;
      }
      .or-tab {
        padding: 8px 12px;
        font-size: 0.75rem;
      }
      .or-filters {
        flex-direction: column;
        align-items: stretch;
      }
      .or-search,
      .or-filters select,
      .or-filters input[type="date"] {
        min-width: 100%;
      }
      .or-card-info {
        grid-template-columns: 1fr;
      }
      .or-card-actions {
        justify-content: flex-start;
      }
      .or-action-btn {
        font-size: 0.68rem;
        padding: 6px 10px;
        flex: 1;
        justify-content: center;
        min-width: calc(50% - 3px);
      }
      .modal-content {
        margin: 10px;
      }
      .modal-body {
        padding: 16px;
      }
      .modal-actions {
        padding: 12px 16px;
      }
      .modal-actions .btn {
        flex: 1;
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .or-stats {
        grid-template-columns: 1fr 1fr;
      }
      .or-action-btn {
        min-width: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>
  <div id="header-placeholder"></div>

  <main class="page-content">
    <div class="container">

      <!-- ============================================================
           الهيدر
           ============================================================ -->
      <div class="or-header">
        <div class="or-header-inner">
          <div class="or-header-left">
            <div class="or-header-icon">
              <i class="fas fa-shopping-bag"></i>
            </div>
            <div>
              <h1>إدارة الطلبات</h1>
              <p>الموافقة · التحضير · التجهيز · الشحن · التسليم · استلام النقد</p>
            </div>
          </div>
          <div class="or-header-actions">
            <button class="btn" onclick="loadOrders(true)">
              <i class="fas fa-sync-alt"></i> تحديث
            </button>
            <button class="btn" onclick="releaseExpiredManual()">
              <i class="fas fa-broom"></i> تنظيف المنتهية
            </button>
          </div>
        </div>
      </div>

      <!-- ============================================================
           الإحصائيات
           ============================================================ -->
      <div class="or-stats">
        <a href="#" class="or-stat" onclick="filterByStatus('pending', event)">
          <div class="or-stat-icon gold"><i class="fas fa-clock"></i></div>
          <div class="or-stat-num gold" id="statPending">0</div>
          <div class="or-stat-label">قيد المراجعة</div>
        </a>

        <a href="#" class="or-stat" onclick="filterByStatus('processing', event)">
          <div class="or-stat-icon blue"><i class="fas fa-cog"></i></div>
          <div class="or-stat-num blue" id="statProcessing">0</div>
          <div class="or-stat-label">جاري التحضير</div>
        </a>

        <a href="#" class="or-stat" onclick="filterByStatus('ready', event)">
          <div class="or-stat-icon orange"><i class="fas fa-box-open"></i></div>
          <div class="or-stat-num orange" id="statReady">0</div>
          <div class="or-stat-label">تم التجهيز</div>
        </a>

        <a href="#" class="or-stat" onclick="filterByStatus('shipped', event)">
          <div class="or-stat-icon purple"><i class="fas fa-truck"></i></div>
          <div class="or-stat-num purple" id="statShipped">0</div>
          <div class="or-stat-label">جاري الشحن</div>
        </a>

        <a href="#" class="or-stat" onclick="filterByStatus('delivered', event)">
          <div class="or-stat-icon teal"><i class="fas fa-hand-holding-usd"></i></div>
          <div class="or-stat-num teal" id="statDelivered">0</div>
          <div class="or-stat-label">نقد مع المندوب</div>
        </a>

        <a href="#" class="or-stat" onclick="filterByStatus('paid', event)">
          <div class="or-stat-icon green"><i class="fas fa-check-circle"></i></div>
          <div class="or-stat-num green" id="statPaid">0</div>
          <div class="or-stat-label">مدفوع + خالص</div>
        </a>
      </div>

      <!-- ============================================================
           التبويبات
           ============================================================ -->
      <div class="or-tabs" id="orTabs">
        <button class="or-tab active" data-tab="" onclick="switchTab('')">
          <i class="fas fa-list"></i> الكل
          <span class="tab-count" id="tabCount-all">0</span>
        </button>
        <button class="or-tab" data-tab="pending" onclick="switchTab('pending')">
          <i class="fas fa-clock"></i> قيد المراجعة
          <span class="tab-count" id="tabCount-pending">0</span>
        </button>
        <button class="or-tab" data-tab="processing" onclick="switchTab('processing')">
          <i class="fas fa-cog"></i> جاري التحضير
          <span class="tab-count" id="tabCount-processing">0</span>
        </button>
        <button class="or-tab" data-tab="ready" onclick="switchTab('ready')">
          <i class="fas fa-box-open"></i> تم التجهيز
          <span class="tab-count" id="tabCount-ready">0</span>
        </button>
        <button class="or-tab" data-tab="shipped" onclick="switchTab('shipped')">
          <i class="fas fa-truck"></i> جاري الشحن
          <span class="tab-count" id="tabCount-shipped">0</span>
        </button>
        <button class="or-tab" data-tab="delivered" onclick="switchTab('delivered')">
          <i class="fas fa-hand-holding-usd"></i> نقد مع المندوب
          <span class="tab-count" id="tabCount-delivered">0</span>
        </button>
        <button class="or-tab" data-tab="paid" onclick="switchTab('paid')">
          <i class="fas fa-check"></i> مدفوع
          <span class="tab-count" id="tabCount-paid">0</span>
        </button>
        <button class="or-tab" data-tab="cancelled" onclick="switchTab('cancelled')">
          <i class="fas fa-ban"></i> ملغي/مرفوض/مرتجع
          <span class="tab-count" id="tabCount-cancelled">0</span>
        </button>
      </div>

      <!-- ============================================================
           الفلاتر
           ============================================================ -->
      <div class="or-filters">
        <div class="or-search">
          <input
            type="text"
            id="searchInput"
            placeholder="بحث برقم الطلب / الاسم / الهاتف..."
            oninput="onSearchInput()"
          >
          <i class="fas fa-search"></i>
        </div>

        <select id="paymentFilter" onchange="applyFilters()">
          <option value="">كل حالات الدفع</option>
          <option value="unpaid">غير مدفوع</option>
          <option value="pending">معلق</option>
          <option value="paid">مدفوع</option>
          <option value="partial">جزئي</option>
          <option value="refunded">مرتجع</option>
          <option value="awaiting_admin">بانتظار الأدمن</option>
        </select>

        <select id="branchFilter" onchange="applyFilters()">
          <option value="">كل الفروع</option>
        </select>

        <select id="storeFilter" onchange="applyFilters()">
          <option value="">كل المتاجر</option>
          <option value="retail">قطاعي</option>
          <option value="wholesale">جملة</option>
        </select>

        <select id="reservedFilter" onchange="applyFilters()">
          <option value="">الكل</option>
          <option value="yes">محجوز فقط</option>
          <option value="no">غير محجوز</option>
        </select>

        <div class="or-date-range">
          <input type="date" id="dateFrom" onchange="applyFilters()" title="من تاريخ">
          <span>→</span>
          <input type="date" id="dateTo" onchange="applyFilters()" title="إلى تاريخ">
        </div>

        <button class="btn-icon-only" onclick="resetFilters()" title="إعادة تعيين">
          <i class="fas fa-undo"></i>
        </button>
      </div>

      <!-- ============================================================
           قائمة الطلبات
           ============================================================ -->
      <div class="or-list" id="ordersList">
        <div class="or-loading">
          <i class="fas fa-spinner fa-spin"></i>
          <p>جاري تحميل الطلبات...</p>

      </div>

    </div>

  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>
  <div id="footer-placeholder"></div>
  <div id="sidebar-placeholder"></div>
  <div id="toast-container"></div>
  <div id="modalContainer"></div>

  <!-- ============================================================
       Firebase + Scripts
       ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <!-- ============================================================
       Part 1/3 — State + Init + Rendering
       ============================================================ -->
  <script>
    // ============================================================
    // الحالة العامة
    // ============================================================
    const orState = {
      role: 'guest',
      isSuper: false,
      isAdminPlus: false,
      isAdmin: false,
      adminId: '',
      adminName: '',
      orders: [],
      filtered: [],
      branches: [],
      currentTab: '',
      currentOrderId: null,
      searchDebounce: null,
      unsubscribe: null,
      editItems: null,
      editAvailableProducts: null,
      editPickerSearch: ''
    };

    let _orderDetailTab = 'overview';

    // ============================================================
    // الثوابت
    // ============================================================
    const STATUS_LABELS = {
      pending: 'قيد المراجعة',
      processing: 'جاري التحضير',
      ready: 'تم التجهيز',
      shipped: 'جاري الشحن',
      delivered: 'تم التسليم (نقد مع المندوب)',
      paid: 'مدفوع + خالص',
      rejected: 'مرفوض',
      rejected_by_customer: 'رفض العميل',
      cancelled: 'ملغي',
      auto_cancelled: 'ملغي تلقائي',
      returned: 'مرتجع'
    };

    const PAYMENT_STATUS_LABELS = {
      unpaid: 'غير مدفوع',
      pending: 'معلق',
      paid: 'مدفوع',
      partial: 'جزئي',
      refunded: 'مرتجع',
      awaiting_cardoona: 'بانتظار كرتونة',
      awaiting_agent: 'بانتظار مندوب',
      awaiting_admin: 'بانتظار الأدمن'
    };

    const STORE_TYPE_LABELS = {
      retail: 'قطاعي',
      wholesale: 'جملة'
    };

    // ============================================================
    // التهيئة
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = getCurrentUser();

        if (!user || user.type !== 'admin') {
          window.location.href = '/gomla/admin/login.html';
          return;
        }

        orState.role = user.data?.role || 'admin';
        orState.isSuper = orState.role === 'super';
        orState.isAdminPlus = orState.role === 'admin_plus';
        orState.isAdmin = ['super', 'admin_plus', 'admin'].includes(orState.role);
        orState.adminId = user.data?.id || user.data?.uid || '';
        orState.adminName = user.data?.name || '';

        await loadBranchesCache();
        populateBranchFilter();
        loadOrders();

        if (typeof window.releaseExpiredOrders === 'function') {
          window.releaseExpiredOrders().catch(() => {});
        }

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            closeAllModals();
          }
        });

        console.log('✅ orders.html v3.0 ready — role:', orState.role);
      } catch (err) {
        console.error('Init:', err);
        window.showToast('خطأ', 'error');
      }
    });

    // ============================================================
    // تحميل الفروع
    // ============================================================
    async function loadBranchesCache() {
      try {
        const snap = await db
          .collection('branches')
          .where('active', '==', true)
          .get();

        orState.branches = [];
        snap.forEach(doc => {
          orState.branches.push({ id: doc.id, ...doc.data() });
        });

        orState.branches.sort((a, b) =>
          (a.name || '').localeCompare(b.name || '', 'ar')
        );
      } catch (err) {
        console.warn(err);
      }
    }

    function populateBranchFilter() {
      const sel = document.getElementById('branchFilter');
      if (!sel) {
        return;
      }

      sel.innerHTML =
        '<option value="">كل الفروع</option>' +
        orState.branches
          .map(b => `<option value="${b.id}">${_esc(b.name)}</option>`)
          .join('');
    }

    function getBranchName(id) {
      if (!id) {
        return '—';
      }
      const b = orState.branches.find(x => x.id === id);
      return b ? b.name : id;
    }

    // ============================================================
    // تحميل الطلبات (onSnapshot)
    // ============================================================
    function loadOrders(forceRefresh) {
      if (orState.unsubscribe && !forceRefresh) {
        return;
      }

      if (orState.unsubscribe) {
        orState.unsubscribe();
      }

      const list = document.getElementById('ordersList');
      if (list) {
        list.innerHTML = `
          <div class="or-loading">
            <i class="fas fa-spinner fa-spin"></i>
            <p>جاري التحميل...</p>
          </div>
        `;
      }

      orState.unsubscribe = db
        .collection('orders')
        .orderBy('createdAt', 'desc')
        .limit(300)
        .onSnapshot(snap => {
          orState.orders = [];
          snap.forEach(doc => {
            orState.orders.push({ id: doc.id, ...doc.data() });
          });
          updateStats();
          updateTabCounts();
          applyFilters();
        }, err => {
          if (list) {
            list.innerHTML = `
              <div class="or-empty">
                <div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <h3>فشل التحميل</h3>
                <p>${err.code === 'permission-denied' ? 'ليس لديك صلاحية' : 'خطأ: ' + err.message}</p>
              </div>
            `;
          }
        });
    }

    // ============================================================
    // الإحصائيات والعدادات
    // ============================================================
    function updateStats() {
      const a = orState.orders;

      _setText('statPending', a.filter(o => o.status === 'pending').length);
      _setText('statProcessing', a.filter(o => o.status === 'processing').length);
      _setText('statReady', a.filter(o => o.status === 'ready').length);
      _setText('statShipped', a.filter(o => o.status === 'shipped').length);
      _setText('statDelivered', a.filter(o => o.status === 'delivered').length);
      _setText('statPaid', a.filter(o => o.status === 'paid').length);
    }

    function updateTabCounts() {
      const a = orState.orders;

      _setText('tabCount-all', a.length);
      _setText('tabCount-pending', a.filter(o => o.status === 'pending').length);
      _setText('tabCount-processing', a.filter(o => o.status === 'processing').length);
      _setText('tabCount-ready', a.filter(o => o.status === 'ready').length);
      _setText('tabCount-shipped', a.filter(o => o.status === 'shipped').length);
      _setText('tabCount-delivered', a.filter(o => o.status === 'delivered').length);
      _setText('tabCount-paid', a.filter(o => o.status === 'paid').length);
      _setText(
        'tabCount-cancelled',
        a.filter(o => [
          'cancelled',
          'auto_cancelled',
          'returned',
          'rejected',
          'rejected_by_customer'
        ].includes(o.status)).length
      );
    }

    function _setText(id, val) {
      const el = document.getElementById(id);
      if (el) {
        el.textContent = val;
      }
    }

    // ============================================================
    // التبويبات
    // ============================================================
    function switchTab(tab) {
      orState.currentTab = tab;
      document.querySelectorAll('.or-tab').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === tab);
      });
      applyFilters();
    }

    function filterByStatus(status, event) {
      if (event) {
        event.preventDefault();
      }

      orState.currentTab = status;
      document.querySelectorAll('.or-tab').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === orState.currentTab);
      });
      applyFilters();
    }

    function onSearchInput() {
      if (orState.searchDebounce) {
        clearTimeout(orState.searchDebounce);
      }
      orState.searchDebounce = setTimeout(applyFilters, 300);
    }

    // ============================================================
    // الفلاتر
    // ============================================================
    function applyFilters() {
      const search = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      const payStatus = document.getElementById('paymentFilter')?.value || '';
      const branch = document.getElementById('branchFilter')?.value || '';
      const store = document.getElementById('storeFilter')?.value || '';
      const reserved = document.getElementById('reservedFilter')?.value || '';
      const dateFrom = document.getElementById('dateFrom')?.value || '';
      const dateTo = document.getElementById('dateTo')?.value || '';

      let list = [...orState.orders];

      if (orState.currentTab === 'paid') {
        list = list.filter(o => o.status === 'paid');
      } else if (orState.currentTab === 'cancelled') {
        list = list.filter(o => [
          'cancelled',
          'auto_cancelled',
          'returned',
          'rejected',
          'rejected_by_customer'
        ].includes(o.status));
      } else if (orState.currentTab) {
        list = list.filter(o => o.status === orState.currentTab);
      }

      if (search) {
        list = list.filter(o =>
          (o.customerName || '').toLowerCase().includes(search) ||
          (o.customerPhone || '').includes(search) ||
          (o.id || '').toLowerCase().includes(search)
        );
      }

      if (payStatus) {
        list = list.filter(o => o.paymentStatus === payStatus);
      }

      if (branch) {
        list = list.filter(o => o.branchId === branch);
      }

      if (store) {
        list = list.filter(o => o.storeType === store);
      }

      if (reserved === 'yes') {
        list = list.filter(o => o.reserved === true && !o.released);
      } else if (reserved === 'no') {
        list = list.filter(o => !o.reserved || o.released);
      }

      if (dateFrom) {
        const f = new Date(dateFrom).setHours(0, 0, 0, 0);
        list = list.filter(o => _ts(o.createdAt) >= f);
      }

      if (dateTo) {
        const t = new Date(dateTo).setHours(23, 59, 59, 999);
        list = list.filter(o => _ts(o.createdAt) <= t);
      }

      orState.filtered = list;
      renderOrders();
    }

    function resetFilters() {
      [
        'searchInput',
        'paymentFilter',
        'branchFilter',
        'storeFilter',
        'reservedFilter',
        'dateFrom',
        'dateTo'
      ].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.value = '';
        }
      });

      orState.currentTab = '';
      document.querySelectorAll('.or-tab').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === '');
      });
      applyFilters();
    }

    function _ts(t) {
      if (!t) {
        return 0;
      }
      if (t.toMillis) {
        return t.toMillis();
      }
      if (t.toDate) {
        return t.toDate().getTime();
      }
      if (t instanceof Date) {
        return t.getTime();
      }
      return 0;
    }

    // ============================================================
    // رندر القائمة
    // ============================================================
    function renderOrders() {
      const list = document.getElementById('ordersList');
      if (!list) {
        return;
      }

      if (orState.filtered.length === 0) {
        list.innerHTML = `
          <div class="or-empty">
            <div class="empty-icon"><i class="fas fa-shopping-bag"></i></div>
            <h3>لا توجد طلبات</h3>
            <p>${orState.orders.length === 0 ? 'لم يتم استقبال طلبات بعد' : 'لا توجد نتائج مطابقة'}</p>
          </div>
        `;
        return;
      }

      list.innerHTML = orState.filtered
        .map(o => renderOrderCard(o))
        .join('');
    }

    function renderOrderCard(o) {
      const orderNum = o.id.slice(-8).toUpperCase();
      const status = o.status || 'pending';
      const payStatus = o.paymentStatus || 'unpaid';
      const dateStr = o.createdAt ? formatDate(o.createdAt) : '—';
      const itemsCount = (o.items || []).length;
      const totalQty = (o.items || []).reduce((s, i) => s + (i.quantity || 0), 0);
      const isReserved = o.reserved === true && !o.released;
      const isCashPending = status === 'delivered' && o.cashInDeliveryHand;

      const statusIcon = {
        pending: 'clock',
        processing: 'cog',
        ready: 'box-open',
        shipped: 'truck',
        delivered: 'hand-holding-usd',
        paid: 'check-circle',
        rejected: 'times-circle',
        rejected_by_customer: 'ban',
        cancelled: 'times-circle',
        auto_cancelled: 'ban',
        returned: 'undo'
      }[status] || 'circle';

      const payMethodLabel = (typeof formatPaymentMethodLabel === 'function')
        ? formatPaymentMethodLabel(o.paymentMethod)
        : (o.paymentMethod || '—');

      return `
        <div class="or-card status-${status}" onclick="openOrderDetails('${o.id}')">
          <div class="or-card-head">
            <div class="or-card-title">
              <span class="or-num">#${orderNum}</span>
              <span>${_esc(o.customerName || 'عميل')}</span>
            </div>
            <div class="or-badges">
              <span class="or-badge status-${status}">
                <i class="fas fa-${statusIcon}"></i> ${STATUS_LABELS[status] || status}
              </span>
              <span class="or-badge payment-${payStatus}">
                <i class="fas fa-money-bill"></i> ${PAYMENT_STATUS_LABELS[payStatus] || payStatus}
              </span>
              ${isReserved ? `<span class="or-badge reserved"><i class="fas fa-lock"></i> محجوز</span>` : ''}
              ${isCashPending ? `<span class="or-badge cash-pending"><i class="fas fa-hand-holding-usd"></i> نقد مع المندوب</span>` : ''}
              ${o.installmentPlanId ? `<span class="or-badge" style="background:rgba(139,92,246,.15);color:#6d28d9;"><i class="fas fa-calendar-check"></i> أقساط</span>` : ''}
            </div>
          </div>

          <div class="or-card-info">
            <div class="or-info-item">
              <i class="fas fa-phone"></i>
              <span class="val">${_esc(o.customerPhone || '—')}</span>
            </div>
            <div class="or-info-item">
              <i class="fas fa-building"></i>
              <span class="val">${_esc(getBranchName(o.branchId))}</span>
            </div>
            <div class="or-info-item">
              <i class="fas fa-calendar"></i>
              <span class="val">${dateStr}</span>
            </div>
            <div class="or-info-item">
              <i class="fas fa-boxes"></i>
              <span class="val">${itemsCount} منتج (${totalQty} قطعة)</span>
            </div>
            <div class="or-info-item">
              <i class="fas fa-store"></i>
              <span class="val">${STORE_TYPE_LABELS[o.storeType] || o.storeType || '—'}</span>
            </div>
          </div>

          <div class="or-card-actions" onclick="event.stopPropagation()">
            ${renderCardActions(o)}
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--gray-100);">
            <span style="font-size:0.72rem;color:var(--gray-500);">
              <i class="fas fa-credit-card" style="color:var(--gold);"></i> ${payMethodLabel}
            </span>
            <span style="font-size:1.05rem;font-weight:900;color:var(--gold-dark);">
              ${(o.total || 0).toFixed(0)} ج.م
            </span>
          </div>
        </div>
      `;
    }

    // ============================================================
    // أزرار الإجراءات على الكارد
    // ============================================================
    function renderCardActions(o) {
      const status = o.status || 'pending';
      const payStatus = o.paymentStatus || 'unpaid';
      const canSuperPlus = orState.isSuper || orState.isAdminPlus;

      let html = `
        <button class="or-action-btn view" onclick="openOrderDetails('${o.id}')">
          <i class="fas fa-eye"></i> تفاصيل
        </button>
      `;

      // تعديل
      const canEditStatuses = ['pending', 'processing', 'ready', 'shipped'];
      const canEditShipped = status === 'shipped' ? canSuperPlus : true;
      const canEdit =
        canEditStatuses.includes(status) &&
        payStatus !== 'paid' &&
        payStatus !== 'refunded' &&
        !o.installmentPlanId &&
        canEditShipped;

      if (canEdit) {
        html += `
          <button class="or-action-btn" onclick="openEditOrder('${o.id}')" style="border-color:#93c5fd;color:#1e40af;background:#eff6ff;">
            <i class="fas fa-edit"></i> تعديل
          </button>
        `;
      }

      // pending → approve / reject
      if (status === 'pending') {
        html += `
          <button class="or-action-btn approve" onclick="approveOrder('${o.id}')">
            <i class="fas fa-check"></i> موافقة
          </button>
          <button class="or-action-btn reject" onclick="openRejectModal('${o.id}')">
            <i class="fas fa-times"></i> رفض
          </button>
        `;
      }

      // processing → ready
      if (status === 'processing') {
        html += `
          <button class="or-action-btn ready" onclick="markReady('${o.id}')">
            <i class="fas fa-box-open"></i> تم التجهيز
          </button>
        `;
      }

      // ready → shipped
      if (status === 'ready') {
        html += `
          <button class="or-action-btn shipped" onclick="openShipModal('${o.id}')">
            <i class="fas fa-truck"></i> تم الشحن
          </button>
        `;
      }

      // shipped → delivered / rejected_by_customer
      if (status === 'shipped') {
        html += `
          <button class="or-action-btn deliver" onclick="markDelivered('${o.id}')">
            <i class="fas fa-hand-holding-usd"></i> تم التسليم + نقد
          </button>
          <button class="or-action-btn reject-cust" onclick="openRejectByCustomerModal('${o.id}')">
            <i class="fas fa-user-slash"></i> رفض العميل
          </button>
        `;
      }

      // delivered → confirm cash / installment / reject by customer
      if (status === 'delivered') {
        if (canSuperPlus) {
          html += `
            <button class="or-action-btn cash" onclick="confirmCashReceipt('${o.id}')">
              <i class="fas fa-money-check-alt"></i> تأكيد استلام النقد
            </button>
          `;
        }
        if (canSuperPlus && o.storeType === 'wholesale' && !o.installmentPlanId) {
          html += `
            <button class="or-action-btn install" onclick="openInstallmentPlan('${o.id}')">
              <i class="fas fa-calendar-check"></i> أقساط
            </button>
          `;
        }
        html += `
          <button class="or-action-btn reject-cust" onclick="openRejectByCustomerModal('${o.id}')">
            <i class="fas fa-user-slash"></i> رفض العميل
          </button>
        `;
      }

      // paid → return
      if (status === 'paid' && canSuperPlus) {
        html += `
          <button class="or-action-btn return" onclick="openReturnModal('${o.id}')">
            <i class="fas fa-undo"></i> مرتجع
          </button>
        `;
      }

      // cancel — super/plus فقط
      const cancellableStatuses = ['pending', 'processing', 'ready', 'shipped', 'delivered'];
      if (canSuperPlus && cancellableStatuses.includes(status)) {
        html += `
          <button class="or-action-btn cancel" onclick="cancelOrder('${o.id}')">
            <i class="fas fa-trash"></i> إلغاء
          </button>
        `;
      }

      return html;
    }

    // ============================================================
    // أدوات مساعدة
    // ============================================================
    function closeAllModals() {
      document
        .querySelectorAll('.modal-overlay.show')
        .forEach(m => m.classList.remove('show'));
      document.body.style.overflow = '';
    }

    function closeModal(id) {
      document.getElementById(id)?.classList.remove('show');
      document.body.style.overflow = '';
    }

    function _esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    function _escAttr(s) {
      return String(s ?? '')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ============================================================
    // تنظيف الطلبات المنتهية (يدوي)
    // ============================================================
    async function releaseExpiredManual() {
      if (typeof window.releaseExpiredOrders !== 'function') {
        window.showToast('غير متاحة', 'warning');
        return;
      }
      try {
        const r = await window.releaseExpiredOrders();
        window.showToast(
          r?.count > 0
            ? `✅ تم تنظيف ${r.count} طلب`
            : '✅ لا توجد طلبات منتهية',
          'success'
        );
      } catch (e) {
        window.showToast('❌ ' + e.message, 'error');
      }
    }
  </script>

  <!-- ============================================================
       Part 2/3 — Details Modal + Actions
       ============================================================ -->
  <script>
    // ============================================================
    // فتح تفاصيل الطلب
    // ============================================================
    async function openOrderDetails(orderId) {
      const order = orState.orders.find(o => o.id === orderId);
      if (!order) {
        return;
      }

      orState.currentOrderId = orderId;
      _orderDetailTab = 'overview';

      const html = `
        <div class="modal-overlay show" id="orderModal" onclick="closeModal('orderModal')">
          <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
              <h2><i class="fas fa-receipt"></i> تفاصيل الطلب #${orderId.slice(-8).toUpperCase()}</h2>
              <button class="modal-close" onclick="closeModal('orderModal')">&times;</button>
            </div>
            <div class="modal-body">
              ${renderOrderDetails(order)}
            </div>
            <div class="modal-actions" id="orderModalActions">
              ${renderOrderModalActions(order)}
            </div>
          </div>
        </div>
      `;

      document.getElementById('modalContainer').innerHTML = html;
      document.body.style.overflow = 'hidden';
    }

    // ============================================================
    // رندر تفاصيل الطلب (4 تبويبات)
    // ============================================================
    function renderOrderDetails(o) {
      const status = o.status || 'pending';
      const payStatus = o.paymentStatus || 'unpaid';
      const isReserved = o.reserved === true && !o.released;
      const items = o.items || [];
      const payMethodLabel = (typeof formatPaymentMethodLabel === 'function')
        ? formatPaymentMethodLabel(o.paymentMethod)
        : (o.paymentMethod || '—');

      const headerColors = {
        pending: 'linear-gradient(135deg, #b45309, #f59e0b)',
        processing: 'linear-gradient(135deg, #1e40af, #3b82f6)',
        ready: 'linear-gradient(135deg, #c2410c, #f97316)',
        shipped: 'linear-gradient(135deg, #6d28d9, #8b5cf6)',
        delivered: 'linear-gradient(135deg, #a16207, #eab308)',
        paid: 'linear-gradient(135deg, #15803d, #22c55e)',
        rejected: 'linear-gradient(135deg, #b91c1c, #ef4444)',
        rejected_by_customer: 'linear-gradient(135deg, #7f1d1d, #dc2626)',
        cancelled: 'linear-gradient(135deg, #b91c1c, #ef4444)',
        auto_cancelled: 'linear-gradient(135deg, #4b5563, #6b7280)',
        returned: 'linear-gradient(135deg, #c2410c, #f97316)'
      };

      const headerBg = headerColors[status] || 'linear-gradient(135deg, var(--navy), var(--navy-light))';

      // ---------- الملخص ----------
      const summaryHtml = `
        <div style="background:${headerBg};border-radius:12px;padding:18px;color:white;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.15);">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
            <div>
              <div style="font-size:0.75rem;opacity:0.85;margin-bottom:4px;">
                <i class="fas fa-hashtag"></i> ${o.id.slice(-8).toUpperCase()}
              </div>
              <div style="font-size:1.3rem;font-weight:900;margin-bottom:6px;">
                ${_esc(o.customerName || 'عميل')}
              </div>
              <div style="font-size:0.82rem;opacity:0.9;">
                <i class="fas fa-phone"></i> ${_esc(o.customerPhone || '—')}
                ${o.region ? ` · <i class="fas fa-map-marker-alt"></i> ${_esc(o.region)}` : ''}
              </div>
            </div>
            <div style="text-align:left;">
              <div style="background:rgba(255,255,255,.15);padding:8px 16px;border-radius:20px;font-size:0.78rem;font-weight:900;margin-bottom:6px;">
                <i class="fas fa-circle" style="font-size:0.5rem;"></i>
                ${STATUS_LABELS[status] || status}
              </div>
              <div style="font-size:1.4rem;font-weight:900;">
                ${(o.total || 0).toFixed(0)}
                <span style="font-size:0.7rem;opacity:0.85;">ج.م</span>
              </div>
            </div>
          </div>

          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">
            <span style="background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px;font-size:0.7rem;font-weight:800;">
              <i class="fas fa-money-bill"></i> ${PAYMENT_STATUS_LABELS[payStatus] || payStatus}
            </span>
            ${isReserved ? `<span style="background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px;font-size:0.7rem;font-weight:800;"><i class="fas fa-lock"></i> محجوز</span>` : ''}
            ${o.cashInDeliveryHand ? `<span style="background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px;font-size:0.7rem;font-weight:800;"><i class="fas fa-hand-holding-usd"></i> نقد مع المندوب</span>` : ''}
            ${o.installmentPlanId ? `<span style="background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px;font-size:0.7rem;font-weight:800;"><i class="fas fa-calendar-check"></i> أقساط</span>` : ''}
          </div>
        </div>
      `;

      // ---------- التبويبات ----------
      const tabsHtml = `
        <div style="display:flex;gap:4px;margin-bottom:16px;background:var(--gray-100);padding:4px;border-radius:8px;overflow-x:auto;">
          <button class="od-tab ${_orderDetailTab === 'overview' ? 'active' : ''}" onclick="switchOrderDetailTab('overview')" data-tab="overview">
            <i class="fas fa-info-circle"></i> نظرة عامة
          </button>
          <button class="od-tab ${_orderDetailTab === 'items' ? 'active' : ''}" onclick="switchOrderDetailTab('items')" data-tab="items">
            <i class="fas fa-boxes"></i> المنتجات (${items.length})
          </button>
          <button class="od-tab ${_orderDetailTab === 'payment' ? 'active' : ''}" onclick="switchOrderDetailTab('payment')" data-tab="payment">
            <i class="fas fa-credit-card"></i> الدفع
          </button>
          <button class="od-tab ${_orderDetailTab === 'timeline' ? 'active' : ''}" onclick="switchOrderDetailTab('timeline')" data-tab="timeline">
            <i class="fas fa-history"></i> السجل
          </button>
        </div>
      `;

      // ---------- نظرة عامة ----------
      const overviewHtml = `
        <div class="od-tab-content ${_orderDetailTab === 'overview' ? 'active' : ''}" id="od-tab-overview">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div style="background:#eff6ff;border:2px solid #93c5fd;border-radius:10px;padding:14px;">
              <div style="font-size:0.75rem;font-weight:900;color:#1e40af;margin-bottom:10px;">
                <i class="fas fa-user-circle"></i> بيانات العميل
              </div>
              <div style="font-size:0.82rem;line-height:1.9;">
                <div><strong>الاسم:</strong> ${_esc(o.customerName || '—')}</div>
                <div><strong>الهاتف:</strong> <span style="direction:ltr;display:inline-block;">${_esc(o.customerPhone || '—')}</span></div>
                ${o.customerPhone2 ? `<div><strong>هاتف بديل:</strong> <span style="direction:ltr;display:inline-block;">${_esc(o.customerPhone2)}</span></div>` : ''}
                <div style="margin-top:6px;"><strong>العنوان:</strong> ${_esc(o.deliveryAddress || o.customerAddress || '—')}</div>
              </div>
            </div>

            <div style="background:#f0fdf4;border:2px solid #86efac;border-radius:10px;padding:14px;">
              <div style="font-size:0.75rem;font-weight:900;color:#166534;margin-bottom:10px;">
                <i class="fas fa-receipt"></i> بيانات الطلب
              </div>
              <div style="font-size:0.82rem;line-height:1.9;">
                <div><strong>المتجر:</strong> ${STORE_TYPE_LABELS[o.storeType] || o.storeType || '—'}</div>
                <div><strong>الفرع:</strong> ${_esc(getBranchName(o.branchId))}</div>
                <div>
                  <strong>المصدر:</strong>
                  ${o.source === 'cardoona'
                    ? 'كرتونة'
                    : o.source === 'cashier'
                      ? 'كاشير'
                      : o.source === 'manual'
                        ? 'يدوي'
                        : 'الموقع'}
                </div>
                ${o.deliveryDate ? `<div><strong>موعد التوصيل:</strong> ${_esc(o.deliveryDate)}</div>` : ''}
                ${o.deliveryAgentName ? `<div><strong>المندوب:</strong> ${_esc(o.deliveryAgentName)}</div>` : ''}
              </div>
            </div>
          </div>

          ${o.rejectedReason ? `
            <div style="margin-top:12px;background:#fef2f2;border:2px solid #fca5a5;border-radius:10px;padding:12px;">
              <div style="font-size:0.75rem;font-weight:900;color:#991b1b;margin-bottom:6px;">
                <i class="fas fa-times-circle"></i> سبب الرفض
              </div>
              <div style="font-size:0.85rem;color:#7f1d1d;">${_esc(o.rejectedReason)}</div>
            </div>
          ` : ''}

          ${o.rejectedByCustomerReason ? `
            <div style="margin-top:12px;background:#fef2f2;border:2px solid #fca5a5;border-radius:10px;padding:12px;">
              <div style="font-size:0.75rem;font-weight:900;color:#991b1b;margin-bottom:6px;">
                <i class="fas fa-user-slash"></i> رفض العميل
              </div>
              <div style="font-size:0.85rem;color:#7f1d1d;">${_esc(o.rejectedByCustomerReason)}</div>
            </div>
          ` : ''}

          ${o.notes ? `
            <div style="margin-top:12px;background:#fef3c7;border:2px solid #fbbf24;border-radius:10px;padding:12px;">
              <div style="font-size:0.75rem;font-weight:900;color:#92400e;margin-bottom:6px;">
                <i class="fas fa-comment-alt"></i> ملاحظات
              </div>
              <div style="font-size:0.85rem;color:#78350f;">${_esc(o.notes)}</div>
            </div>
          ` : ''}

          ${o.installmentPlanId && o.installmentSchedule ? `
            <div style="margin-top:12px;background:#f5f3ff;border:2px solid #c4b5fd;border-radius:10px;padding:14px;">
              <div style="font-size:0.75rem;font-weight:900;color:#5b21b6;margin-bottom:10px;">

              </div>
              <div style="background:white;border-radius:8px;overflow:hidden;">
                ${o.installmentSchedule.map(s => `
                  <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--gray-100);${s.paid ? 'background:#f0fdf4;' : ''}font-size:0.82rem;">
                    <div>
                      <strong>قسط #${s.n}</strong>
                      <div style="font-size:0.7rem;color:var(--gray-500);">${s.dueDate ? formatDate(s.dueDate) : '—'}</div>
                    </div>
                    <div style="font-weight:900;color:#5b21b6;">${(s.amount || 0).toFixed(2)} ج</div>
                    <div>
                      ${s.paid
                        ? '<span style="color:#16a34a;"><i class="fas fa-check-circle"></i> مدفوع</span>'

                    </div>
                  </div>
                `).join('')}
              </div>
              <div style="margin-top:10px;font-size:0.8rem;color:#5b21b6;text-align:center;">

                    ${o.invoiceId.slice(-8).toUpperCase()}
                  </span>
                </div>
                <div style="margin-top:4px;">
                  <strong>التاريخ:</strong> ${o.confirmedAt ? formatDateTime(o.confirmedAt) : '—'}
                </div>
              </div>

          ` : ''}
        </div>
      `;

      // ---------- المنتجات ----------
      const itemsHtml = `
        <div class="od-tab-content ${_orderDetailTab === 'items' ? 'active' : ''}" id="od-tab-items">
          ${items.length === 0
            ? `
              <div style="text-align:center;padding:40px 20px;color:var(--gray-400);">
                <i class="fas fa-box-open" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
                <p>لا توجد منتجات</p>
              </div>
            `
            : items.map(item => `
              <div style="display:flex;align-items:center;gap:12px;padding:12px;background:white;border:1px solid var(--gray-200);border-radius:8px;margin-bottom:8px;">
                <img
                  src="${item.imageUrl || '/gomla/assets/images/no-image.png'}"
                  style="width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--gray-200);flex-shrink:0;"
                  onerror="this.src='/gomla/assets/images/no-image.png'"
                >
                <div style="flex:1;min-width:0;">
                  <div style="font-size:0.88rem;font-weight:800;color:var(--navy);margin-bottom:4px;">
                    ${_esc(item.productName || 'منتج')}
                  </div>
                  <div style="font-size:0.75rem;color:var(--gray-500);">
                    <i class="fas fa-cube" style="color:var(--gold);"></i>
                    ${item.quantity} ${_esc(item.unit || 'قطعة')} × ${(item.price || 0).toFixed(2)} ج
                  </div>
                </div>
                <div style="font-size:1rem;font-weight:900;color:var(--gold-dark);">
                  ${(item.total || 0).toFixed(2)} ج
                </div>
              </div>
            `).join('')
          }
        </div>
      `;

      // ---------- الدفع ----------

    // ============================================================
    // approveOrder (pending → processing)
    // ============================================================
    async function approveOrder(orderId) {
      if (!orState.isAdmin) {
        window.showToast('غير مصرح', 'warning');
        return;
      }

      if (!confirm(
        'الموافقة على الطلب؟\n' +
        'سيتم:\n' +
        '- تحويل الحالة إلى "جاري التحضير"\n' +
        '- إضافة قيمة الطلب كمديونية على العميل\n' +
        '- إرسال إشعار للعميل'
      )) {
        return;
      }

      try {
        const ref = db.collection('orders').doc(orderId);

        await db.runTransaction(async t => {
          const snap = await t.get(ref);
          if (!snap.exists) {
            throw new Error('الطلب غير موجود');
          }

          const o = snap.data();
          if (o.status !== 'pending') {
            throw new Error('يمكن الموافقة على "قيد المراجعة" فقط');
          }

          const now = firebase.firestore.FieldValue.serverTimestamp();

          if (o.customerId && !o.balanceApplied) {
            const custRef = db.collection('customers').doc(o.customerId);
            const custDoc = await t.get(custRef);

            if (custDoc.exists) {
              t.update(custRef, {
                balance: firebase.firestore.FieldValue.increment(o.total || 0),
                lastOrderAt: now
              });
            }
          }

          t.update(ref, {
            status: 'processing',
            balanceApplied: true,
            balanceAppliedAt: now,
            approvedAt: now,
            approvedBy: orState.adminId,
            approvedByName: orState.adminName,
            processedAt: now,
            processedBy: orState.adminId,
            processedByName: orState.adminName,
            updatedAt: now
          });

          if (o.customerId) {
            t.set(db.collection('customer_notifications').doc(), {
              userId: o.customerId,
              title: '✅ تم قبول طلبك',
              body: `طلبك #${orderId.slice(-8).toUpperCase()} قيد التحضير`,
              type: 'order_approved',
              orderId,
              read: false,
              createdAt: now
            });
          }
        });

        window.showToast('✅ تم قبول الطلب', 'success');
        closeModal('orderModal');
      } catch (err) {
        window.showToast('❌ ' + err.message, 'error');
      }
    }

    // ════════════════════════════════════════════════════════════
    // ✅ إصلاح: كل القراءات قبل كل الكتابات
    // ============================================================
    async function confirmReject(orderId) {
      const reason = (document.getElementById('rejectReason')?.value || '').trim();

      if (!reason || reason.length < 5) {
        window.showToast('سبب الرفض مطلوب (5 أحرف على الأقل)', 'warning');
        return;
      }

      try {
        const ref = db.collection('orders').doc(orderId);

        await db.runTransaction(async t => {
          // ════════════ المرحلة 1: كل القراءات ════════════
          const snap = await t.get(ref);
          if (!snap.exists) {
            throw new Error('الطلب غير موجود');
          }

          const o = snap.data();
          if (o.status !== 'pending') {
            throw new Error('يمكن رفض "قيد المراجعة" فقط');
          }

          const isWholesale = o.storeType === 'wholesale';
          const branchId = o.branchId || 'RGB';
          const now = firebase.firestore.FieldValue.serverTimestamp();

          const productReads = [];
          const inventoryReads = [];

          for (const item of o.items || []) {
            const qty = item.quantity || 0;
            if (qty <= 0) continue;

            if (isWholesale) {
              const pRef = db.collection('products').doc(item.productId);
              const pDoc = await t.get(pRef);
              productReads.push({ ref: pRef, exists: pDoc.exists, qty });
            } else {
              const invRef = db.collection('branch_inventory').doc(`${branchId}_${item.productId}`);
              const invDoc = await t.get(invRef);
              inventoryReads.push({ ref: invRef, exists: invDoc.exists, qty });
            }
          }

          // ════════════ المرحلة 2: كل الكتابات ════════════

          for (const r of productReads) {
            if (!r.exists) continue;
            t.update(r.ref, {
              reservedPieces: firebase.firestore.FieldValue.increment(-r.qty)
            });
          }

          for (const r of inventoryReads) {
            if (!r.exists) continue;
            t.update(r.ref, {
              reservedQty: firebase.firestore.FieldValue.increment(-r.qty),
              availableQty: firebase.firestore.FieldValue.increment(r.qty)
            });
          }

          t.update(ref, {
            status: 'rejected',
            released: true,
            releasedAt: now,
            releaseReason: reason,
            rejectedReason: reason,
            rejectedAt: now,
            rejectedBy: orState.adminId,
            rejectedByName: orState.adminName,
            updatedAt: now
          });

          if (o.customerId) {
            t.set(db.collection('customer_notifications').doc(), {
              userId: o.customerId,
              title: 'تم رفض طلبك',
              body: `السبب: ${reason}`,
              type: 'order_rejected',
              orderId,
              read: false,
              createdAt: now
            });
          }
        });

        window.showToast('✅ تم رفض الطلب', 'success');
        closeModal('rejectModal');
        closeModal('orderModal');
      } catch (err) {
        window.showToast('❌ ' + err.message, 'error');
      }
    }

        window.showToast('غير مصرح', 'warning');
        return;
      }

      if (!confirm('تم تجهيز الطلب؟ سيتم تحويل الحالة إلى "تم التجهيز" وإشعار العميل.')) {
        return;
      }

      try {
        const ref = db.collection('orders').doc(orderId);

        await db.runTransaction(async t => {
          const snap = await t.get(ref);
          if (!snap.exists) {
            throw new Error('الطلب غير موجود');
          }

          const o = snap.data();
          if (o.status !== 'processing') {
            throw new Error('يمكن التجهيز من "جاري التحضير" فقط');
          }

          const now = firebase.firestore.FieldValue.serverTimestamp();

          t.update(ref, {
            status: 'ready',
            readyAt: now,
            readyBy: orState.adminId,
            readyByName: orState.adminName,
            updatedAt: now
          });

          if (o.customerId) {

              userId: o.customerId,
              title: '📦 تم تجهيز طلبك',
              body: 'طلبك جاهز في انتظار الشحن',
              type: 'order_ready',
              orderId,
              read: false,
              createdAt: now
            });
          }
        });

        window.showToast('✅ تم تجهيز الطلب', 'success');
        closeModal('orderModal');
      } catch (err) {
        window.showToast('❌ ' + err.message, 'error');
      }

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أولاد شعلان جملة - إدارة الطلبات</title>

  <!-- ===== SEO ===== -->
  <meta name="description" content="إدارة الطلبات - لوحة التحكم">
  <meta name="theme-color" content="#1a2a4a">

  <!-- ===== Font Awesome ===== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- ===== Google Font ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- ===== الستايل الموحد ===== -->
  <link rel="stylesheet" href="../assets/css/style.css">

  <!-- ===== Favicon ===== -->
  <link rel="icon" href="../assets/images/favicon.ico">

  <!-- ============================================================ -->
  <!-- 🎨 ستايل خاص بالصفحة                                          -->
  <!-- ============================================================ -->
  <style>
    /* ===== الأزرار ===== */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: var(--gold);
      color: var(--navy);
    }
    .btn-primary:hover {
      background: #b8942a;
      transform: translateY(-2px);
    }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--gray-300);
      color: var(--gray-700);
    }
    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .btn-sm {
      padding: 6px 14px;
      font-size: 0.85rem;
    }
    .btn-success {
      background: #27ae60;
      color: white;
    }
    .btn-danger {
      background: #e74c3c;
      color: white;
    }
    .btn-warning {
      background: #f39c12;
      color: white;
    }

    /* ===== رأس الصفحة ===== */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .admin-header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--navy);
    }
    .admin-header h1 i {
      color: var(--gold);
    }
    .admin-header .header-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ===== الإحصائيات ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--white);
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      border: 2px solid transparent;
    }
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }
    .stat-card.active {
      border-color: var(--gold);
      background: #fcf9f0;
    }
    .stat-card .stat-number {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--navy);
    }
    .stat-card .stat-label {
      font-size: 0.8rem;
      color: var(--gray-500);
    }
    .stat-card .stat-number.pending { color: #f39c12; }
    .stat-card .stat-number.processing { color: #e67e22; }
    .stat-card .stat-number.shipped { color: #9b59b6; }
    .stat-card .stat-number.delivered { color: #27ae60; }
    .stat-card .stat-number.cancelled { color: #e74c3c; }

    /* ===== شريط التصفية ===== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--white);
      padding: 16px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
      align-items: center;
    }
    .filter-bar input,
    .filter-bar select {
      padding: 8px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--gray-50);
      min-width: 130px;
    }
    .filter-bar input:focus,
    .filter-bar select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
    }
    .filter-bar .filter-checkboxes {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-bar .filter-checkboxes label {
      font-size: 0.85rem;
      color: var(--gray-600);
      cursor: pointer;
    }
    .filter-bar .filter-checkboxes input[type="checkbox"] {
      margin-left: 4px;
      cursor: pointer;
    }

    /* ===== جدول الطلبات ===== */
    .table-container {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .table-scroll {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    table thead {
      background: var(--gray-50);
    }
    table th {
      padding: 12px 14px;
      text-align: right;
      font-weight: 700;
      color: var(--gray-600);
      border-bottom: 2px solid var(--gray-200);
      white-space: nowrap;
    }
    table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--gray-100);
      vertical-align: middle;
    }
    table tbody tr:hover {
      background: var(--gray-50);
    }

    /* ===== حالة الطلب ===== */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-badge.pending {
      background: #fef9e7;
      color: #f39c12;
    }
    .status-badge.processing {
      background: #fdf2e9;
      color: #e67e22;
    }
    .status-badge.shipped {
      background: #f4ecf7;
      color: #9b59b6;
    }
    .status-badge.delivered {
      background: #eafaf1;
      color: #27ae60;
    }
    .status-badge.cancelled {
      background: #fdedec;
      color: #e74c3c;
    }

    /* ===== شارة نوع الطلب ===== */
    .store-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .store-badge.wholesale {
      background: #fef9e7;
      color: #f39c12;
    }
    .store-badge.retail {
      background: #eafaf1;
      color: #27ae60;
    }

    /* ===== شارة الزائر ===== */
    .guest-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 700;
      background: #fef9e7;
      color: #f39c12;
      margin-right: 6px;
    }

    /* ===== أزرار الإجراءات ===== */
    .action-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .action-buttons button {
      padding: 4px 10px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-view {
      background: #e8f0fe;
      color: #1a73e8;
    }
    .btn-view:hover {
      background: #1a73e8;
      color: white;
    }
    .btn-edit {
      background: #dbeafe;
      color: #2563eb;
    }
    .btn-edit:hover {
      background: #2563eb;
      color: white;
    }
    .btn-delete {
      background: #fde8e8;
      color: #e74c3c;
    }
    .btn-delete:hover {
      background: #e74c3c;
      color: white;
    }
    .btn-print {
      background: #f4ecf7;
      color: #9b59b6;
    }
    .btn-print:hover {
      background: #9b59b6;
      color: white;
    }

    /* ===== تحميل المزيد ===== */
    .load-more-container {
      text-align: center;
      padding: 16px;
    }

    /* ===== النوافذ المنبثقة ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-content {
      background: var(--white);
      border-radius: var(--radius-md);
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      position: relative;
      animation: slideDown 0.3s ease;
    }
    .modal-content.small {
      max-width: 500px;
    }
    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-content .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--gray-100);
    }
    .modal-content .modal-header h2 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--navy);
    }
    .modal-content .modal-header h2 i {
      color: var(--gold);
    }
    .modal-content .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--gray-400);
      cursor: pointer;
      transition: var(--transition);
    }
    .modal-content .modal-close:hover {
      color: var(--danger);
      transform: rotate(90deg);
    }

    /* ===== تفاصيل الطلب ===== */
    .order-details-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
      padding: 16px;
      background: var(--gray-50);
      border-radius: var(--radius-sm);
    }
    .order-details-header .detail-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .order-details-header .detail-group .detail-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    .order-details-header .detail-group .detail-item .label {
      color: var(--gray-500);
      font-weight: 600;
    }
    .order-details-header .detail-group .detail-item .value {
      color: var(--navy);
      font-weight: 700;
    }

    .order-items-list {
      margin-bottom: 20px;
    }
    .order-items-list h4 {
      font-size: 1rem;
      color: var(--navy);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gray-100);
    }
    .order-item-row {
      display: grid;
      grid-template-columns: 60px 1fr 80px 100px 100px;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--gray-100);
      align-items: center;
    }
    .order-item-row:last-child {
      border-bottom: none;
    }
    .order-item-row img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--gray-200);
    }
    .order-item-row .item-name {
      font-weight: 700;
      font-size: 0.9rem;
    }
    .order-item-row .item-unit {
      font-size: 0.75rem;
      color: var(--gray-500);
    }
    .order-item-row .item-qty {
      text-align: center;
      font-weight: 700;
    }
    .order-item-row .item-price {
      text-align: center;
      color: var(--gold);
      font-weight: 700;
    }
    .order-item-row .item-total {
      text-align: center;
      color: var(--navy);
      font-weight: 800;
    }

    .order-summary-box {
      background: var(--gray-50);
      padding: 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
    }
    .order-summary-box .summary-line {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.9rem;
    }
    .order-summary-box .summary-line.total {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--navy);
      border-top: 2px solid var(--gray-200);
      padding-top: 12px;
      margin-top: 8px;
    }
    .order-summary-box .summary-line .value.gold {
      color: var(--gold);
    }
    .order-summary-box .summary-line .value.green {
      color: #27ae60;
    }

    /* ===== تحديث الحالة ===== */
    .status-update-box {
      background: #fcf9f0;
      padding: 16px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--gold);
      margin-bottom: 20px;
    }
    .status-update-box label {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .status-update-box select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.95rem;
      background: var(--white);
      margin-bottom: 12px;
    }
    .status-update-box select:focus {
      outline: none;
      border-color: var(--gold);
    }
    .status-update-box .notes-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--white);
      resize: vertical;
      min-height: 70px;
      margin-bottom: 12px;
    }

    /* ===== أزرار النافذة ===== */
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 2px solid var(--gray-100);
    }

    /* ===== التحميل ===== */
    .loading-container {
      text-align: center;
      padding: 40px 20px;
      color: var(--gray-400);
    }
    .loading-container i {
      font-size: 2rem;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-400);
    }
    .empty-state i {
      font-size: 3rem;
      display: block;
      margin-bottom: 12px;
    }

    /* ============================================================ */
    /* 📱 تحسينات الموبايل                                          */
    /* ============================================================ */
    @media (max-width: 768px) {
      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-bar input,
      .filter-bar select {
        width: 100%;
        min-width: auto;
      }
      .filter-bar .filter-checkboxes {
        flex-wrap: wrap;
        justify-content: center;
      }
      .admin-header {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      .admin-header .header-actions {
        justify-content: center;
        flex-wrap: wrap;
      }
      .admin-header .header-actions .btn {
        font-size: 0.8rem;
        padding: 8px 12px;
      }
      .modal-content {
        padding: 16px;
        margin: 10px;
      }
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .stat-card {
        padding: 10px 8px;
      }
      .stat-card .stat-number {
        font-size: 1.3rem;
      }
      .stat-card .stat-label {
        font-size: 0.7rem;
      }
      .order-details-header {
        grid-template-columns: 1fr;
      }
      .order-item-row {
        grid-template-columns: 50px 1fr;
        gap: 8px;
      }
      .order-item-row .item-qty,
      .order-item-row .item-price,
      .order-item-row .item-total {
        grid-column: span 2;
        display: flex;
        justify-content: space-between;
        text-align: right;
        padding-right: 8px;
        font-size: 0.85rem;
      }
      .order-item-row .item-qty::before {
        content: "الكمية: ";
        font-weight: 400;
        color: var(--gray-500);
      }
      .order-item-row .item-price::before {
        content: "السعر: ";
        font-weight: 400;
        color: var(--gray-500);
      }
      .order-item-row .item-total::before {
        content: "الإجمالي: ";
        font-weight: 400;
        color: var(--gray-500);
      }

      /* ===== إخفاء رأس الجدول ===== */
      table thead {
        display: none;
      }

      /* ===== عرض الطلبات ككروت ===== */
      table tbody tr {
        display: block;
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-md);
        margin-bottom: 12px;
        padding: 12px;
        background: var(--white);
        box-shadow: var(--shadow-sm);
      }
      table tbody tr td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border: none;
        border-bottom: 1px solid var(--gray-100);
        font-size: 0.85rem;
        flex-wrap: wrap;
        gap: 4px;
      }
      table tbody tr td:last-child {
        border-bottom: none;
      }
      table tbody tr td::before {
        content: attr(data-label);
        font-weight: 700;
        color: var(--gray-600);
        font-size: 0.75rem;
        min-width: 90px;
      }
      table tbody tr td:first-child {
        display: none;
      }
      table tbody tr td:nth-child(2) {
        font-size: 1rem;
        font-weight: 700;
        border-bottom: 2px solid var(--gold);
        padding-bottom: 8px;
        margin-bottom: 4px;
      }
      table tbody tr td:nth-child(2)::before {
        content: "📦 ";
      }
      table tbody tr td:last-child {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding-top: 10px;
        border-top: 2px solid var(--gray-200);
        margin-top: 4px;
      }
      table tbody tr td:last-child::before {
        display: none;
      }
      .action-buttons button {
        padding: 8px 14px;
        font-size: 0.85rem;
        border-radius: var(--radius-sm);
      }
    }

    @media (max-width: 480px) {
      .admin-header h1 {
        font-size: 1.3rem;
      }
      .admin-header .header-actions .btn {
        font-size: 0.7rem;
        padding: 6px 10px;
      }
      .modal-content {
        padding: 12px;
      }
      .action-buttons button {
        padding: 6px 10px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================ -->
  <!-- 🧠 الهيدر (يتم تحميله من main.js)                            -->
  <!-- ============================================================ -->
  <div id="header-placeholder"></div>

  <!-- ============================================================ -->
  <!-- 📄 محتوى الصفحة                                              -->
  <!-- ============================================================ -->
  <main class="page-content">
    <div class="container">

      <!-- ===== رأس الصفحة ===== -->
      <div class="admin-header">
        <h1><i class="fas fa-shopping-bag"></i> إدارة الطلبات</h1>
        <div class="header-actions">
          <button class="btn btn-outline" onclick="exportOrders()">
            <i class="fas fa-file-export"></i> تصدير
          </button>
          <button class="btn btn-outline" onclick="loadOrders()">
            <i class="fas fa-sync-alt"></i> تحديث
          </button>
        </div>
      </div>

      <!-- ===== الإحصائيات (فلترة سريعة) ===== -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card active" data-status="" onclick="filterByStatus('')">
          <div class="stat-number" id="statTotal">0</div>
          <div class="stat-label">كل الطلبات</div>
        </div>
        <div class="stat-card" data-status="pending" onclick="filterByStatus('pending')">
          <div class="stat-number pending" id="statPending">0</div>
          <div class="stat-label">قيد الانتظار</div>
        </div>
        <div class="stat-card" data-status="processing" onclick="filterByStatus('processing')">
          <div class="stat-number processing" id="statProcessing">0</div>
          <div class="stat-label">قيد المعالجة</div>
        </div>
        <div class="stat-card" data-status="shipped" onclick="filterByStatus('shipped')">
          <div class="stat-number shipped" id="statShipped">0</div>
          <div class="stat-label">تم الشحن</div>
        </div>
        <div class="stat-card" data-status="delivered" onclick="filterByStatus('delivered')">
          <div class="stat-number delivered" id="statDelivered">0</div>
          <div class="stat-label">تم التسليم</div>
        </div>
        <div class="stat-card" data-status="cancelled" onclick="filterByStatus('cancelled')">
          <div class="stat-number cancelled" id="statCancelled">0</div>
          <div class="stat-label">ملغي</div>
        </div>
      </div>

      <!-- ===== شريط التصفية ===== -->
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 بحث برقم الطلب أو اسم العميل أو الهاتف..." oninput="applyFilters()">
        <select id="statusFilter" onchange="applyFilters()">
          <option value="">كل الحالات</option>
          <option value="pending">قيد الانتظار</option>
          <option value="processing">قيد المعالجة</option>
          <option value="shipped">تم الشحن</option>
          <option value="delivered">تم التسليم</option>
          <option value="cancelled">ملغي</option>
        </select>
        <select id="storeTypeFilter" onchange="applyFilters()">
          <option value="">كل المتاجر</option>
          <option value="wholesale">جملة</option>
          <option value="retail">قطاعي</option>
        </select>
        <select id="sortFilter" onchange="applyFilters()">
          <option value="newest">الأحدث</option>
          <option value="oldest">الأقدم</option>
          <option value="total-high">الأعلى سعراً</option>
          <option value="total-low">الأقل سعراً</option>
        </select>
        <div class="filter-checkboxes">
          <label>
            <input type="checkbox" id="showGuestsOnly" onchange="applyFilters()">
            زوار فقط
          </label>
        </div>
        <button class="btn btn-outline btn-sm" onclick="resetFilters()">
          <i class="fas fa-undo"></i> إعادة تعيين
        </button>
      </div>

      <!-- ===== جدول الطلبات ===== -->
      <div class="table-container">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>رقم الطلب</th>
                <th>العميل</th>
                <th>الهاتف</th>
                <th>المنتجات</th>
                <th>الإجمالي</th>
                <th>المتجر</th>
                <th>الحالة</th>
                <th>التاريخ</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr>
                <td colspan="10" class="loading-container">
                  <i class="fas fa-spinner fa-spin"></i>
                  <p>جاري تحميل الطلبات...</p>
                </td>
              </tr>
            </tbody>
          </table>

          <button class="btn btn-outline" id="loadMoreBtn" onclick="loadMoreOrders()" style="display:none;">

        <div class="loading-container"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
      </div>

  <!-- ============================================================ -->
  <!-- ✏️ نافذة تغيير الحالة                                        -->
  <!-- ============================================================ -->
  <div class="modal-overlay" id="statusModal">
    <div class="modal-content small">
      <div class="modal-header">
        <h2><i class="fas fa-edit"></i> تغيير حالة الطلب</h2>
        <button class="modal-close" onclick="closeModal('statusModal')">&times;</button>
      </div>
      <input type="hidden" id="statusOrderId" value="">
      <div class="status-update-box">
        <label>الحالة الجديدة</label>
        <select id="newStatus">
          <option value="pending">🟡 قيد الانتظار</option>
          <option value="processing">🟠 قيد المعالجة</option>
          <option value="shipped">🟣 تم الشحن</option>
          <option value="delivered">🟢 تم التسليم</option>
          <option value="cancelled">🔴 ملغي</option>
        </select>
        <label>ملاحظات (اختياري)</label>
        <textarea id="statusNotes" class="notes-input" placeholder="أي ملاحظات حول تغيير الحالة..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('statusModal')">إلغاء</button>
        <button class="btn btn-primary" onclick="updateOrderStatus()">
          <i class="fas fa-save"></i> حفظ التغييرات
        </button>
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- 📚 Firebase & JavaScript                                      -->
  <!-- ============================================================ -->

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/main.js"></script>

  <!-- ============================================================ -->
  <!-- 📝 كود الصفحة الخاص                                           -->
  <!-- ============================================================ -->
  <script>
    // ============================================================
    // 📂 صفحة إدارة الطلبات - admin/orders.html
    // ============================================================

    // ===== متغيرات عامة =====
    let allOrders = [];
    let filteredOrders = [];
    let currentPage = 0;
    const pageSize = 20;
    let currentUserRole = 'customer';
    let selectedStatusFilter = '';

    // ============================================================
    // 🔐 التحقق من الصلاحيات
    // ============================================================

    function isAdmin() {
      return ['admin', 'super', 'superadmin'].includes(currentUserRole);
    }

    async function fetchUserRole(uid) {
      try {
        const adminDoc = await db.collection('admins').doc(uid).get();
        if (adminDoc.exists && adminDoc.data().role) {
          return adminDoc.data().role;
        }
        const userDoc = await db.collection('users').doc(uid).get();
        if (userDoc.exists && userDoc.data().role) {
          return userDoc.data().role;
        }
        return 'customer';
      } catch (error) {
        console.error('❌ خطأ في جلب الدور:', error);
        return 'customer';
      }
    }

    async function checkAccess() {
      return new Promise((resolve) => {
        const unsubscribe = firebase.auth().onAuthStateChanged(async (user) => {
          unsubscribe();
          if (!user) {
            resolve(false);
            return;
          }
          currentUserRole = await fetchUserRole(user.uid);
          resolve(isAdmin());
        });
      });
    }

    // ============================================================
    // 🚀 تحميل الطلبات
    // ============================================================

    function loadOrders() {
      const tbody = document.getElementById('ordersTableBody');
      if (!tbody) return;

      tbody.innerHTML =
        '<tr><td colspan="10" class="loading-container"><i class="fas fa-spinner fa-spin"></i><p>جاري تحميل الطلبات...</p></td></tr>';

      return db.collection('orders')
        .orderBy('createdAt', 'desc')
        .limit(pageSize)
        .get()
        .then(snapshot => {
          allOrders = [];
          snapshot.forEach(doc => {
            allOrders.push({ id: doc.id, ...doc.data() });
          });
          filteredOrders = [...allOrders];
          updateStats();
          renderOrders();

          if (allOrders.length >= pageSize) {
            document.getElementById('loadMoreBtn').style.display = 'inline-block';
          } else {
            document.getElementById('loadMoreBtn').style.display = 'none';
          }
        })
        .catch(error => {
          console.error('Error loading orders:', error);
          tbody.innerHTML = `
            <tr><td colspan="10" class="empty-state">
              <i class="fas fa-exclamation-triangle"></i>
              <p>حدث خطأ في تحميل الطلبات</p>
            </td></tr>
          `;
        });
    }

    // ============================================================
    // 📊 تحديث الإحصائيات
    // ============================================================

    function updateStats() {
      const total = allOrders.length;
      const pending = allOrders.filter(o => o.status === 'pending').length;
      const processing = allOrders.filter(o => o.status === 'processing').length;
      const shipped = allOrders.filter(o => o.status === 'shipped').length;
      const delivered = allOrders.filter(o => o.status === 'delivered').length;
      const cancelled = allOrders.filter(o => o.status === 'cancelled').length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statProcessing').textContent = processing;
      document.getElementById('statShipped').textContent = shipped;
      document.getElementById('statDelivered').textContent = delivered;
      document.getElementById('statCancelled').textContent = cancelled;
    }

    // ============================================================
    // 📦 عرض الطلبات
    // ============================================================

    function renderOrders() {
      const tbody = document.getElementById('ordersTableBody');
      if (!tbody) return;

      const start = currentPage * pageSize;
      const end = start + pageSize;
      const pageOrders = filteredOrders.slice(start, end);

      if (pageOrders.length === 0 && currentPage === 0) {
        tbody.innerHTML = `
          <tr><td colspan="10" class="empty-state">
            <i class="fas fa-shopping-bag"></i>
            <p>لا توجد طلبات</p>
          </td></tr>
        `;
        document.getElementById('loadMoreBtn').style.display = 'none';
        return;
      }

      let html = '';
      const startNumber = start + 1;

      pageOrders.forEach((order, index) => {
        const statusMap = {
          'pending': { class: 'pending', text: '🟡 قيد الانتظار' },
          'processing': { class: 'processing', text: '🟠 قيد المعالجة' },
          'shipped': { class: 'shipped', text: '🟣 تم الشحن' },
          'delivered': { class: 'delivered', text: '🟢 تم التسليم' },
          'cancelled': { class: 'cancelled', text: '🔴 ملغي' }
        };
        const status = statusMap[order.status] || statusMap['pending'];
        const orderId = order.id.slice(-8).toUpperCase();
        const customerName = order.customerName || 'غير معروف';
        const customerPhone = order.customerPhone || '-';
        const itemsCount = order.items?.length || 0;
        const total = order.total || 0;
        const isWholesale = order.storeType === 'wholesale';
        const isGuest = order.isGuest === true;

        const orderDate = order.createdAt?.toDate?.() || new Date();
        const dateStr = orderDate.toLocaleDateString('ar-EG');

        html += `
          <tr>
            <td data-label="#">${startNumber + index}</td>
            <td data-label="رقم الطلب"><strong>#${orderId}</strong></td>
            <td data-label="العميل">
              ${customerName}
              ${isGuest ? '<span class="guest-badge">زائر</span>' : ''}
            </td>
            <td data-label="الهاتف">${customerPhone}</td>
            <td data-label="المنتجات">${itemsCount} منتج</td>
            <td data-label="الإجمالي"><strong style="color:var(--gold);">${total.toFixed(2)} ج.م</strong></td>
            <td data-label="المتجر">
              <span class="store-badge ${isWholesale ? 'wholesale' : 'retail'}">
                ${isWholesale ? '🏪 جملة' : '🛒 قطاعي'}
              </span>
            </td>
            <td data-label="الحالة"><span class="status-badge ${status.class}">${status.text}</span></td>
            <td data-label="التاريخ">${dateStr}</td>
            <td>
              <div class="action-buttons">
                <button class="btn-view" onclick="viewOrder('${order.id}')" title="عرض التفاصيل">
                  <i class="fas fa-eye"></i>
                </button>
                <button class="btn-edit" onclick="openStatusModal('${order.id}', '${order.status}')" title="تغيير الحالة">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn-print" onclick="printOrder('${order.id}')" title="طباعة">
                  <i class="fas fa-print"></i>
                </button>
                ${currentUserRole === 'super' || currentUserRole === 'superadmin' ? `
                  <button class="btn-delete" onclick="deleteOrder('${order.id}')" title="حذف">
                    <i class="fas fa-trash"></i>
                  </button>
                ` : ''}
              </div>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;

      if (filteredOrders.length > (currentPage + 1) * pageSize) {
        document.getElementById('loadMoreBtn').style.display = 'inline-block';
      } else {
        document.getElementById('loadMoreBtn').style.display = 'none';
      }
    }

    // ============================================================
    // 📥 تحميل المزيد
    // ============================================================

    function loadMoreOrders() {
      currentPage++;
      renderOrders();
    }

    // ============================================================
    // 🔍 التصفية والبحث
    // ============================================================

    function filterByStatus(status) {
      selectedStatusFilter = status;
      document.getElementById('statusFilter').value = status;
      
      document.querySelectorAll('.stat-card').forEach(card => {
        card.classList.toggle('active', card.dataset.status === status);
      });
      
      applyFilters();
    }

    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const storeTypeFilter = document.getElementById('storeTypeFilter').value;
      const sortValue = document.getElementById('sortFilter').value;
      const showGuestsOnly = document.getElementById('showGuestsOnly').checked;

      filteredOrders = [...allOrders];

      // فلتر الحالة
      if (statusFilter) {
        filteredOrders = filteredOrders.filter(o => o.status === statusFilter);
      }

      // فلتر المتجر
      if (storeTypeFilter) {
        filteredOrders = filteredOrders.filter(o => o.storeType === storeTypeFilter);
      }

      // فلتر الزوار
      if (showGuestsOnly) {
        filteredOrders = filteredOrders.filter(o => o.isGuest === true);
      }

      // بحث
      if (searchTerm) {
        filteredOrders = filteredOrders.filter(o => {
          const orderId = (o.id || '').toLowerCase();
          const customerName = (o.customerName || '').toLowerCase();
          const customerPhone = (o.customerPhone || '').toLowerCase();
          return orderId.includes(searchTerm) ||
                 customerName.includes(searchTerm) ||
                 customerPhone.includes(searchTerm);
        });
      }

      // ترتيب
      switch (sortValue) {
        case 'newest':
          filteredOrders.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
          break;
        case 'oldest':
          filteredOrders.sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));
          break;
        case 'total-high':
          filteredOrders.sort((a, b) => (b.total || 0) - (a.total || 0));
          break;
        case 'total-low':
          filteredOrders.sort((a, b) => (a.total || 0) - (b.total || 0));
          break;
      }

      currentPage = 0;
      renderOrders();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('statusFilter').value = '';
      document.getElementById('storeTypeFilter').value = '';
      document.getElementById('sortFilter').value = 'newest';
      document.getElementById('showGuestsOnly').checked = false;
      selectedStatusFilter = '';
      
      document.querySelectorAll('.stat-card').forEach(card => {
        card.classList.toggle('active', card.dataset.status === '');
      });
      
      applyFilters();
    }

    // ============================================================
    // 👁️ عرض تفاصيل الطلب
    // ============================================================

    function viewOrder(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) {
        showToast('❌ الطلب غير موجود', 'error');
        return;
      }

      const content = document.getElementById('orderDetailsContent');
      document.getElementById('modalOrderId').textContent = '#' + orderId.slice(-8).toUpperCase();

      const statusMap = {
        'pending': { class: 'pending', text: '🟡 قيد الانتظار' },
        'processing': { class: 'processing', text: '🟠 قيد المعالجة' },
        'shipped': { class: 'shipped', text: '🟣 تم الشحن' },
        'delivered': { class: 'delivered', text: '🟢 تم التسليم' },
        'cancelled': { class: 'cancelled', text: '🔴 ملغي' }
      };
      const status = statusMap[order.status] || statusMap['pending'];

      const orderDate = order.createdAt?.toDate?.() || new Date();
      const dateStr = orderDate.toLocaleString('ar-EG');
      const isWholesale = order.storeType === 'wholesale';
      const isGuest = order.isGuest === true;

      let itemsHtml = '';
      if (order.items && order.items.length > 0) {
        order.items.forEach(item => {
          const itemTotal = (item.price || 0) * (item.quantity || 1);
          const itemImage = item.imageUrl || item.productImageUrl || '../assets/images/no-image.png';
          
          itemsHtml += `
            <div class="order-item-row">
              <img src="${itemImage}" alt="${item.productName || 'منتج'}" onerror="this.src='../assets/images/no-image.png'">
              <div>
                <div class="item-name">${item.productName || 'منتج'}</div>
                <div class="item-unit">${item.unit || 'قطعة'}</div>
              </div>
              <div class="item-qty">${item.quantity || 1}</div>
              <div class="item-price">${(item.price || 0).toFixed(2)} ج.م</div>
              <div class="item-total">${itemTotal.toFixed(2)} ج.م</div>
            </div>
          `;
        });
      } else {
        itemsHtml = '<p style="text-align:center;color:var(--gray-400);">لا توجد منتجات</p>';
      }

      const subtotal = order.subtotal || 0;
      const shippingCost = order.shippingCost || 0;
      const total = order.total || 0;
      const isFreeShipping = order.isFreeShipping === true;

      let html = `
        <div class="order-details-header">
          <div class="detail-group">
            <div class="detail-item">
              <span class="label">👤 العميل</span>
              <span class="value">${order.customerName || 'غير معروف'} ${isGuest ? '<span class="guest-badge">زائر</span>' : ''}</span>
            </div>
            <div class="detail-item">
              <span class="label">📞 الهاتف</span>
              <span class="value">${order.customerPhone || '-'}</span>
            </div>
            ${order.customerPhone2 ? `
              <div class="detail-item">
                <span class="label">📞 هاتف بديل</span>
                <span class="value">${order.customerPhone2}</span>
              </div>
            ` : ''}
            <div class="detail-item">
              <span class="label">📍 العنوان</span>
              <span class="value">${order.customerAddress || '-'}</span>
            </div>
            ${order.customerAddress2 ? `
              <div class="detail-item">
                <span class="label">📍 عنوان بديل</span>
                <span class="value">${order.customerAddress2}</span>
              </div>
            ` : ''}
          </div>
          <div class="detail-group">
            <div class="detail-item">
              <span class="label">📅 التاريخ</span>
              <span class="value">${dateStr}</span>
            </div>
            <div class="detail-item">
              <span class="label">🏪 المتجر</span>
              <span class="value">
                <span class="store-badge ${isWholesale ? 'wholesale' : 'retail'}">
                  ${isWholesale ? 'جملة' : 'قطاعي'}
                </span>
              </span>
            </div>
            <div class="detail-item">
              <span class="label">📌 الحالة</span>
              <span class="value"><span class="status-badge ${status.class}">${status.text}</span></span>
            </div>
            <div class="detail-item">
              <span class="label">🚚 المنطقة</span>
              <span class="value">${order.region || '-'}</span>
            </div>
            ${order.deliveryDate ? `
              <div class="detail-item">
                <span class="label">📅 موعد التوصيل</span>
                <span class="value">${order.deliveryDate}</span>
              </div>
            ` : ''}
          </div>
        </div>

        <div class="order-items-list">
          <h4><i class="fas fa-box"></i> المنتجات (${order.items?.length || 0})</h4>
          ${itemsHtml}
        </div>

        <div class="order-summary-box">
          <div class="summary-line">
            <span>المجموع الفرعي</span>
            <span class="value gold">${subtotal.toFixed(2)} ج.م</span>
          </div>
          <div class="summary-line">
            <span>الشحن</span>
            <span class="value ${isFreeShipping ? 'green' : ''}">
              ${isFreeShipping ? '✅ مجاني' : shippingCost.toFixed(2) + ' ج.م'}
            </span>
          </div>
          <div class="summary-line total">
            <span>الإجمالي</span>
            <span class="value">${total.toFixed(2)} ج.م</span>
          </div>
        </div>

        ${order.notes ? `
          <div class="order-summary-box" style="background:#fef9e7;">
            <div class="summary-line">
              <span style="font-weight:700;">📝 ملاحظات:</span>
              <span>${order.notes}</span>
            </div>
          </div>
        ` : ''}
      `;

      content.innerHTML = html;
      document.getElementById('orderDetailsModal').classList.add('show');
    }

    // ============================================================
    // ✏️ تغيير حالة الطلب
    // ============================================================

    function openStatusModal(orderId, currentStatus) {
      document.getElementById('statusOrderId').value = orderId;
      document.getElementById('newStatus').value = currentStatus || 'pending';
      document.getElementById('statusNotes').value = '';
      document.getElementById('statusModal').classList.add('show');
    }

    function updateOrderStatus() {
      const orderId = document.getElementById('statusOrderId').value;
      const newStatus = document.getElementById('newStatus').value;
      const notes = document.getElementById('statusNotes').value.trim();

      if (!orderId) return;

      const updateData = {
        status: newStatus,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (notes) {
        updateData.statusNotes = notes;
      }

      db.collection('orders').doc(orderId).update(updateData)
        .then(() => {
          showToast('✅ تم تحديث حالة الطلب بنجاح', 'success');
          closeModal('statusModal');
          loadOrders();
        })
        .catch(error => {
          console.error('Error updating order status:', error);
          showToast('❌ حدث خطأ في تحديث الحالة', 'error');
        });
    }

    // ============================================================
    // 🗑️ حذف الطلب (للسوبر أدمن فقط)
    // ============================================================

    function deleteOrder(orderId) {
      if (currentUserRole !== 'super' && currentUserRole !== 'superadmin') {
        showToast('⚠️ غير مصرح لك بحذف الطلبات', 'error');
        return;
      }

      if (!confirm('⚠️ هل أنت متأكد من حذف هذا الطلب؟ لا يمكن التراجع!')) return;

      db.collection('orders').doc(orderId).delete()
        .then(() => {
          showToast('✅ تم حذف الطلب بنجاح', 'success');
          loadOrders();
        })
        .catch(error => {
          console.error('Error deleting order:', error);
          showToast('❌ حدث خطأ في حذف الطلب', 'error');
        });
    }

    // ============================================================
    // 🖨️ طباعة الطلب
    // ============================================================

    function printOrder(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;

      const orderId8 = orderId.slice(-8).toUpperCase();
      const statusMap = {
        'pending': 'قيد الانتظار',
        'processing': 'قيد المعالجة',
        'shipped': 'تم الشحن',
        'delivered': 'تم التسليم',
        'cancelled': 'ملغي'
      };
      const statusText = statusMap[order.status] || 'قيد الانتظار';

      const orderDate = order.createdAt?.toDate?.() || new Date();
      const dateStr = orderDate.toLocaleString('ar-EG');

      let itemsRows = '';
      (order.items || []).forEach(item => {
        itemsRows += `
          <tr>
            <td>${item.productName || 'منتج'}</td>
            <td>${item.quantity || 1}</td>
            <td>${item.unit || 'قطعة'}</td>

    // ============================================================
    // 📥 تصدير الطلبات

    function exportOrders() {
      if (filteredOrders.length === 0) {
        showToast('⚠️ لا توجد طلبات للتصدير', 'warning');
        return;
      }

      let csv = 'رقم الطلب,العميل,الهاتف,العنوان,عدد المنتجات,المجموع الفرعي,الشحن,الإجمالي,الحالة,التاريخ\n';
      filteredOrders.forEach(o => {
        const orderId = o.id.slice(-8).toUpperCase();
        const statusMap = {
          'pending': 'قيد الانتظار',
          'processing': 'قيد المعالجة',
          'shipped': 'تم الشحن',
          'delivered': 'تم التسليم',
          'cancelled': 'ملغي'
        };
        const status = statusMap[o.status] || 'قيد الانتظار';
        const date = (o.createdAt?.toDate?.() || new Date()).toLocaleDateString('ar-EG');
        
        csv += `"#${orderId}","${o.customerName || ''}","${o.customerPhone || ''}","${o.customerAddress || ''}",${o.items?.length || 0},${o.subtotal || 0},${o.shippingCost || 0},${o.total || 0},"${status}","${date}"\n`;
      });

      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `orders_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
      URL.revokeObjectURL(link.href);

      showToast('✅ تم تصدير الطلبات بنجاح', 'success');
    }

    // ============================================================
    // 🛠️ دوال مساعدة
    // ============================================================

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('show');
    }

    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      if (!container) {
        console.log('Toast:', message, type);
        return;
      }

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', async function() {
      try {
        const hasAccess = await checkAccess();
        if (!hasAccess) {
          showToast('⚠️ غير مصرح لك بالدخول', 'error');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
          return;
        }

        await loadOrders();

        // إغلاق النوافذ عند الضغط خارجها
        document.querySelectorAll('.modal-overlay').forEach(modal => {
          modal.addEventListener('click', function(e) {
            if (e.target === this) {
              this.classList.remove('show');
            }
          });
        });

        console.log('✅ Page loaded. Role:', currentUserRole);

      } catch (error) {
        console.error('Error initializing page:', error);
        showToast('⚠️ حدث خطأ في تحميل الصفحة', 'error');
      }
    });

    async function confirmShip(orderId) {
      const agentId = document.getElementById('shipAgentSelect').value;
      const notes = document.getElementById('shipNotes').value.trim();

      if (!agentId) {
        window.showToast('اختر مندوب', 'warning');
        return;
      }

      try {
        const agentDoc = await db.collection('delivery_agents').doc(agentId).get();
        if (!agentDoc.exists) {
          throw new Error('المندوب غير موجود');
        }

        const agent = agentDoc.data();
        const ref = db.collection('orders').doc(orderId);

        await db.runTransaction(async t => {
          const snap = await t.get(ref);
          if (!snap.exists) {
            throw new Error('الطلب غير موجود');
          }

          const o = snap.data();
          if (o.status !== 'ready') {
            throw new Error('يمكن الشحن من "تم التجهيز" فقط');
          }

          const now = firebase.firestore.FieldValue.serverTimestamp();

          t.update(ref, {
            status: 'shipped',
            shippedAt: now,
            shippedBy: orState.adminId,
            shippedByName: orState.adminName,
            deliveryAgentId: agentId,
            deliveryAgentName: agent.name || '',
            deliveryAgentPhone: agent.phone || '',
            assignedAt: now,
            assignedBy: orState.adminId,
            assignedByName: orState.adminName,
            deliveryNotes: notes || '',
            updatedAt: now
          });

          if (o.customerId) {
            t.set(db.collection('customer_notifications').doc(), {
              userId: o.customerId,
              title: '🚚 طلبك في الطريق',
              body: 'تم شحن طلبك — في حالة الرفض، يرجى دفع مصاريف الشحن',
              type: 'order_shipped',
              orderId,
              read: false,
              createdAt: now
            });
          }

          t.set(db.collection('notifications').doc(), {
            userId: agentId,
            userType: 'delivery',
            title: 'طلب جديد معيّن لك',
            body: `#${orderId.slice(-8).toUpperCase()}`,
            type: 'order_assigned',
            orderId,
            read: false,
            createdAt: now
          });
        });

        window.showToast('✅ تم الشحن وتعيين المندوب', 'success');
        closeModal('shipModal');
        closeModal('orderModal');
      } catch (err) {
        window.showToast('❌ ' + err.message, 'error');
      }
    }

    // ════════════════════════════════════════════════════════════
    // ✅ إصلاح: كل القراءات قبل كل الكتابات
    // ============================================================
    async function markDelivered(orderId) {
      if (!orState.isAdmin) {
        window.showToast('غير مصرح', 'warning');
        return;
      }

      if (!confirm(
        'تأكيد التسليم للعميل؟\n' +
        'سيتم:\n' +
        '- خصم المخزون نهائياً\n' +
        '- تسجيل النقد كـ"في حيازة المندوب"\n' +
        '- إشعار العميل\n\n' +
        '⚠️ النقد لن يُضاف للصندوق حتى التأكيد النهائي.'
      )) {
        return;
      }

      try {
        const ref = db.collection('orders').doc(orderId);

        await db.runTransaction(async t => {
          // ════════════ المرحلة 1: كل القراءات ════════════
          const snap = await t.get(ref);
          if (!snap.exists) {
            throw new Error('الطلب غير موجود');
          }

          const o = snap.data();

          if (o.status !== 'shipped') {
            throw new Error('يمكن التسليم من "جاري الشحن" فقط');
          }
          if (o.stockCommitted) {
            throw new Error('المخزون تم خصمه بالفعل');
          }

          const isWholesale = o.storeType === 'wholesale';
          const branchId = o.branchId || 'RGB';
          const now = firebase.firestore.FieldValue.serverTimestamp();

          const productReads = [];
          const inventoryReads = [];

          for (const item of o.items || []) {
            const qty = item.quantity || 0;
            if (qty <= 0) continue;

            if (isWholesale) {
              const pRef = db.collection('products').doc(item.productId);
              const pDoc = await t.get(pRef);
              if (!pDoc.exists) {
                throw new Error(`منتج ${item.productName} غير موجود`);
              }

              const p = pDoc.data();
              const ppu = p.piecesPerUnit || 1;
              const totalPieces = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);

              if (totalPieces < qty) {
                throw new Error(`مخزون غير كافٍ: ${item.productName}`);
              }

              productReads.push({ ref: pRef, p, qty, ppu });
            } else {
              const invRef = db.collection('branch_inventory').doc(`${branchId}_${item.productId}`);
              const invDoc = await t.get(invRef);
              if (!invDoc.exists) {
                throw new Error(`مخزون ${item.productName} غير موجود`);
              }

              const inv = invDoc.data();
              const pieces = inv.piecesQty || 0;

              if (pieces < qty) {
                throw new Error(`مخزون فرع غير كافٍ: ${item.productName}`);
              }

              inventoryReads.push({ ref: invRef, inv, qty });
            }
          }

          // ════════════ المرحلة 2: كل الكتابات ════════════

          for (const r of productReads) {
            const totalPieces = (r.p.warehouseStock || 0) * r.ppu + (r.p.warehousePieces || 0);
            const nt = totalPieces - r.qty;
            t.update(r.ref, {
              warehouseStock: Math.floor(nt / r.ppu),
              warehousePieces: nt % r.ppu,
              reservedPieces: Math.max(0, (r.p.reservedPieces || 0) - r.qty),
              updatedAt: now
            });
          }

          for (const r of inventoryReads) {
            const pieces = r.inv.piecesQty || 0;
            t.update(r.ref, {
              piecesQty: pieces - r.qty,
              reservedQty: Math.max(0, (r.inv.reservedQty || 0) - r.qty),
              lastUpdated: now,
              updatedBy: orState.adminId
            });
          }

          t.update(ref, {
            status: 'delivered',
            deliveredAt: now,
            deliveredBy: orState.adminId,
            deliveredByName: orState.adminName,
            reserved: false,
            stockCommitted: true,
            stockCommittedAt: now,
            cashInDeliveryHand: true,
            cashAmount: o.total || 0,
            updatedAt: now
          });

          if (o.customerId) {
            t.set(db.collection('customer_notifications').doc(), {
              userId: o.customerId,
              title: '✅ تم تسليم طلبك',
              body: 'شكراً لتعاملك معنا',
              type: 'order_delivered',
              orderId,
              read: false,
              createdAt: now
            });
          }
        });

        window.showToast('✅ تم التسليم — النقد مع المندوب', 'success');
        closeModal('orderModal');
      } catch (err) {
        window.showToast('❌ ' + err.message, 'error');
      }
    }

    // ============================================================
    // confirmCashReceipt (delivered → paid)
    // ============================================================
    async function confirmCashReceipt(orderId) {
      if (!orState.isSuper && !orState.isAdminPlus) {
        window.showToast('صلاحية super/admin_plus فقط', 'warning');
        return;
      }

      const order = orState.orders.find(o => o.id === orderId);
      if (!order) {
        return;
      }

      if (order.paymentStatus === 'paid') {
        window.showToast('مدفوع بالفعل', 'warning');
        return;
      }

      if (order.installmentPlanId) {
        window.showToast('مرتبط بأقساط — استخدم صفحة الأقساط', 'warning');
        return;
      }

      if (!confirm(
        'تأكيد استلام النقد من المندوب؟\n' +
        'سيتم:\n' +
        '- إنشاء فاتورة\n' +
        '- إضافة المبلغ للصندوق\n' +
        '- خصم المديونية من العميل\n' +
        '- تحويل الحالة إلى "مدفوع + خالص"'
      )) {
        return;
      }

      try {
        const ref = db.collection('orders').doc(orderId);
        let invoiceRef = null;

        await db.runTransaction(async t => {
          const snap = await t.get(ref);
          if (!snap.exists) {
            throw new Error('الطلب غير موجود');
          }

          const o = snap.data();

          if (o.paymentStatus === 'paid') {
            throw new Error('مدفوع بالفعل');
          }
          if (o.invoiceGenerated) {
            throw new Error('الفاتورة موجودة');
          }
          if (o.installmentPlanId) {
            throw new Error('مرتبط بأقساط');
          }

          const now = firebase.firestore.FieldValue.serverTimestamp();
          const branchId = o.branchId || 'RGB';

          if (o.customerId && o.balanceApplied) {
            const custRef = db.collection('customers').doc(o.customerId);
            t.update(custRef, {
              balance: firebase.firestore.FieldValue.increment(-(o.total || 0)),
              warningNote: '',
              warningNoteSetAt: null,
              warningNoteOrderId: null
            });
          }

          // إنشاء الفاتورة
          invoiceRef = db.collection('invoices').doc();
          t.set(invoiceRef, {
            id: invoiceRef.id,
            orderId,
            orderNumber: orderId.slice(-8).toUpperCase(),
            customerId: o.customerId || null,
            customerName: o.customerName || '',
            customerPhone: o.customerPhone || '',
            customerAddress: o.deliveryAddress || o.customerAddress || '',
            branchId,
            storeType: o.storeType,
            items: o.items || [],
            subtotal: o.subtotal || 0,
            shippingCost: o.shippingCost || 0,
            discount: 0,
            total: o.total || 0,
            paidAmount: o.total || 0,
            remainingAmount: 0,
            paymentMethod: o.paymentMethod || 'cash',
            paymentStatus: 'paid',
            source: o.source || 'website',
            notes: o.notes || '',
            createdAt: now,
            createdBy: orState.adminId,
            createdByName: orState.adminName
          });

          // إدخال في الصندوق
          const cbRef = db.collection('cashbox').doc();
          t.set(cbRef, {
            id: cbRef.id,
            type: 'income',
            category: 'order_payment',
            source: o.source || 'website',
            branchId,
            relatedId: orderId,
            relatedType: 'order',
            amount: o.total || 0,
            method: o.paymentMethod === 'credit' ? 'cash' : (o.paymentMethod || 'cash'),
            description: `دفع طلب #${orderId.slice(-8).toUpperCase()}`,
            attachments: o.paymentProof ? [o.paymentProof] : [],
            dailyCloseId: '',
            isOpening: false,
            refundOf: '',
            isRefund: false,
            status: 'approved',
            createdBy: orState.adminId,
            createdByName: orState.adminName,
            createdByRole: orState.role,
            approvedBy: orState.adminId,
            approvedByName: orState.adminName,
            approvedAt: now,
            createdAt: now,
            rejectionReason: ''
          });

          t.update(ref, {
            status: 'paid',
            paymentStatus: 'paid',
            paid: o.total || 0,
            paidAmount: o.total || 0,
            remaining: 0,
            invoiceGenerated: true,
            invoiceId: invoiceRef.id,
            cashInDeliveryHand: false,
            cashConfirmedAt: now,
            cashConfirmedBy: orState.adminId,
            cashConfirmedByName: orState.adminName,
            confirmedByAdmin: true,
            confirmedAt: now,
            confirmedBy: orState.adminId,
            confirmedByName: orState.adminName,
            cashboxEntryId: cbRef.id,
            updatedAt: now
          });

          if (o.customerId) {
            t.set(db.collection('customer_notifications').doc(), {
              userId: o.customerId,
              title: '✅ تم تأكيد الدفع',
              body: `تم استلام مبلغ ${o.total} ج.م — شكراً`,
              type: 'payment_confirmed',
              orderId,
              invoiceId: invoiceRef.id,
              read: false,
              createdAt: now
            });
          }
        });

        window.showToast('✅ تم تأكيد النقد وإنشاء الفاتورة', 'success');
        closeModal('orderModal');
      } catch (err) {
        window.showToast('❌ ' + err.message, 'error');
      }
    }

    // ════════════════════════════════════════════════════════════
    // ✅ إصلاح: كل القراءات قبل كل الكتابات
    // ============================================================
    async function confirmRejectByCustomer(orderId) {
      const reason = (document.getElementById('rejectCustReason')?.value || '').trim();

      try {
        const ref = db.collection('orders').doc(orderId);

        await db.runTransaction(async t => {
          // ════════════ المرحلة 1: كل القراءات ════════════
          const snap = await t.get(ref);
          if (!snap.exists) {
            throw new Error('الطلب غير موجود');
          }

          const o = snap.data();
          if (!['shipped', 'delivered'].includes(o.status)) {
            throw new Error('الحالة لا تسمح');
          }

          const isWholesale = o.storeType === 'wholesale';
          const branchId = o.branchId || 'RGB';
          const now = firebase.firestore.FieldValue.serverTimestamp();
          const wasCommitted = o.stockCommitted === true;

          // قراءة بيانات العميل (إن وجدت)
          let custRef = null;
          let custDoc = null;
          if (o.customerId) {
            custRef = db.collection('customers').doc(o.customerId);
            custDoc = await t.get(custRef);
          }

          const productReads = [];
          const inventoryReads = [];

          for (const item of o.items || []) {
            const qty = item.quantity || 0;
            if (qty <= 0) continue;

            if (isWholesale) {
              const pRef = db.collection('products').doc(item.productId);
              const pDoc = await t.get(pRef);
              productReads.push({ ref: pRef, exists: pDoc.exists, data: pDoc.exists ? pDoc.data() : null, qty });
            } else {
              const invRef = db.collection('branch_inventory').doc(`${branchId}_${item.productId}`);
              const invDoc = await t.get(invRef);
              inventoryReads.push({ ref: invRef, exists: invDoc.exists, qty });
            }
          }

          // ════════════ المرحلة 2: كل الكتابات ════════════

          for (const r of productReads) {
            if (!r.exists) continue;
            const p = r.data;
            const ppu = p.piecesPerUnit || 1;

            if (wasCommitted) {
              const curTotal = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
              const nt = curTotal + r.qty;
              t.update(r.ref, {
                warehouseStock: Math.floor(nt / ppu),
                warehousePieces: nt % ppu,
                updatedAt: now
              });
            } else {
              t.update(r.ref, {
                reservedPieces: firebase.firestore.FieldValue.increment(-r.qty)
              });
            }
          }

          for (const r of inventoryReads) {
            if (!r.exists) continue;

            if (wasCommitted) {
              t.update(r.ref, {
                piecesQty: firebase.firestore.FieldValue.increment(r.qty),
                availableQty: firebase.firestore.FieldValue.increment(r.qty),
                lastUpdated: now
              });
            } else {
              t.update(r.ref, {
                reservedQty: firebase.firestore.FieldValue.increment(-r.qty),
                availableQty: firebase.firestore.FieldValue.increment(r.qty),
                lastUpdated: now
              });
            }
          }

          if (o.customerId && o.balanceApplied && !o.invoiceGenerated && custRef) {
            t.update(custRef, {
              balance: firebase.firestore.FieldValue.increment(-(o.total || 0))
            });
          }

          if (o.customerId && custRef) {
            const warningText =
              `مرحباً ${o.customerName || ''}، ` +
              `لقد قمت بإنشاء طلب سابق وتم شحنه لك، ثم رفضت الاستلام بدون أسباب مقبولة. ` +
              `هذا يُعد استهتاراً وعدم التزام منك نحونا، ما جعلنا نتعرض لخسارة تجهيز وتحميل وشحن. ` +
              `في حالة تكرار نفس الأمر سيتم حظرك وعدم التعامل معك مرة أخرى. شكراً لتفهمك.`;

            t.update(custRef, {
              warningNote: warningText,
              warningNoteSetAt: now,
              warningNoteOrderId: orderId
            });

            t.set(db.collection('customer_notifications').doc(), {
              userId: o.customerId,
              title: 'تم رفض الاستلام',
              body: reason || 'تم تسجيل رفضك للاستلام',
              type: 'order_rejected_by_customer',
              orderId,
              read: false,
              createdAt: now
            });
          }

          t.update(ref, {
            status: 'rejected_by_customer',
            released: true,
            releasedAt: now,
            releaseReason: reason || 'customer_refused',
            rejectedByCustomerAt: now,
            rejectedByCustomerReason: reason || 'رفض الاستلام',
            rejectedByCustomerBy: orState.adminId,
            stockCommitted: false,
            cashInDeliveryHand: false,
            updatedAt: now
          });
        });

        window.showToast('✅ تم تسجيل الرفض', 'success');
        closeModal('rejectCustModal');
        closeModal('orderModal');
      } catch (err) {
        window.showToast('❌ ' + err.message, 'error');
      }
    }

    async function cancelOrder(orderId) {

      try {
        const ref = db.collection('orders').doc(orderId);

        await db.runTransaction(async t => {
          // ════════════ المرحلة 1: كل القراءات ════════════
          const snap = await t.get(ref);
          if (!snap.exists) {
            throw new Error('الطلب غير موجود');
          }

          const o = snap.data();

          if (['cancelled', 'auto_cancelled', 'returned', 'rejected', 'rejected_by_customer'].includes(o.status)) {
            throw new Error('الحالة لا تسمح');
          }
          if (o.paymentStatus === 'paid') {
            throw new Error('مدفوع — استخدم مرتجع');
          }
          if (o.paymentStatus === 'refunded') {
            throw new Error('مرتجع بالفعل');
          }

          const isWholesale = o.storeType === 'wholesale';
          const branchId = o.branchId || 'RGB';
          const now = firebase.firestore.FieldValue.serverTimestamp();
          const wasCommitted = o.stockCommitted === true;

          let custRef = null;
          const needCustUpdate = o.customerId && o.balanceApplied && !o.invoiceGenerated;

          if (needCustUpdate) {
            custRef = db.collection('customers').doc(o.customerId);
            await t.get(custRef);
          }

          const productReads = [];
          const inventoryReads = [];

          for (const item of o.items || []) {
            const qty = item.quantity || 0;
            if (qty <= 0) continue;

            if (isWholesale) {
              const pRef = db.collection('products').doc(item.productId);
              const pDoc = await t.get(pRef);
              productReads.push({ ref: pRef, exists: pDoc.exists, data: pDoc.exists ? pDoc.data() : null, qty });
            } else {
              const invRef = db.collection('branch_inventory').doc(`${branchId}_${item.productId}`);
              const invDoc = await t.get(invRef);
              inventoryReads.push({ ref: invRef, exists: invDoc.exists, qty });
            }
          }

          // ════════════ المرحلة 2: كل الكتابات ════════════

          for (const r of productReads) {
            if (!r.exists) continue;
            const p = r.data;
            const ppu = p.piecesPerUnit || 1;

            if (wasCommitted) {
              const curTotal = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
              const nt = curTotal + r.qty;
              t.update(r.ref, {
                warehouseStock: Math.floor(nt / ppu),
                warehousePieces: nt % ppu,
                updatedAt: now
              });
            } else {
              t.update(r.ref, {
                reservedPieces: firebase.firestore.FieldValue.increment(-r.qty)
              });
            }
          }

          for (const r of inventoryReads) {
            if (!r.exists) continue;

            if (wasCommitted) {
              t.update(r.ref, {
                piecesQty: firebase.firestore.FieldValue.increment(r.qty),
                availableQty: firebase.firestore.FieldValue.increment(r.qty),
                lastUpdated: now
              });
            } else {
              t.update(r.ref, {
                reservedQty: firebase.firestore.FieldValue.increment(-r.qty),
                availableQty: firebase.firestore.FieldValue.increment(r.qty),
                lastUpdated: now
              });
            }
          }

          if (needCustUpdate && custRef) {
            t.update(custRef, {
              balance: firebase.firestore.FieldValue.increment(-(o.total || 0))
            });
          }

          t.update(ref, {
            status: 'cancelled',
            released: true,
            releasedAt: now,
            releaseReason: reason || 'cancelled_by_admin',
            cancelledBy: orState.adminId,
            cancelledByName: orState.adminName,
            cancelledAt: now,
            stockCommitted: false,
            cashInDeliveryHand: false,
            updatedAt: now
          });

          if (o.customerId) {
            t.set(db.collection('customer_notifications').doc(), {
              userId: o.customerId,
              title: 'تم إلغاء طلبك',
              body: reason ? `السبب: ${reason}` : 'تم إلغاء الطلب',
              type: 'order_cancelled',
              orderId,
              read: false,
              createdAt: now
            });
          }
        });

        window.showToast('✅ تم الإلغاء', 'success');
        closeModal('orderModal');
      } catch (err) {
        window.showToast('❌ ' + err.message, 'error');
      }
    }
  </script>

  <script>

      }

      if (!order) {
        return;
      }

      orState.currentOrderId = orderId;

      const maxRefund = (order.total || 0) - (order.refundedAmount || 0);
      const items = order.items || [];

          <input

            <div style="font-size:0.8rem;font-weight:800;color:var(--navy);">

            <div style="font-size:0.7rem;color:var(--gray-500);">

            </div>

        </div>
      `).join('');

      const html = `

              <button class="modal-close" onclick="closeModal('returnModal')">&times;</button>
            </div>
            <div class="modal-body">
              <div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:10px;margin-bottom:14px;font-size:0.82rem;color:#92400e;">
                <i class="fas fa-exclamation-triangle"></i>
                الحد الأقصى: <strong>${maxRefund.toFixed(2)} ج.م</strong>
              </div>

              <h4 style="font-size:0.9rem;font-weight:900;margin-bottom:10px;">
                <i class="fas fa-boxes" style="color:var(--gold);"></i> المنتجات
              </h4>
              <div id="returnItemsList">${itemsHtml}</div>

              <h4 style="font-size:0.9rem;font-weight:900;margin:14px 0 10px;">
                <i class="fas fa-info-circle" style="color:var(--gold);"></i> التفاصيل
              </h4>

              <div style="margin-bottom:10px;">
                <label style="display:block;font-weight:800;font-size:0.82rem;margin-bottom:4px;">السبب</label>
                <select
                  id="returnReason"
                  style="width:100%;padding:9px;border:2px solid var(--gray-200);border-radius:6px;font-family:inherit;font-size:0.85rem;"
                >
                  <option value="defective">معيب</option>
                  <option value="wrong_item">منتج خاطئ</option>
                  <option value="not_needed">غير مطلوب</option>
                  <option value="expired">منتهي الصلاحية</option>
                  <option value="other">أخرى</option>
                </select>
              </div>

              <div style="margin-bottom:10px;">
                <label style="display:block;font-weight:800;font-size:0.82rem;margin-bottom:4px;">طريقة الاسترداد</label>
                <select
                  id="refundMethod"
                  style="width:100%;padding:9px;border:2px solid var(--gray-200);border-radius:6px;font-family:inherit;font-size:0.85rem;"
                >
                  <option value="cash">نقدي</option>
                  <option value="instapay">إنستا باي</option>
                  <option value="wallet">محفظة</option>
                  <option value="credit_note">رصيد دائن</option>
                </select>
              </div>

              <div style="margin-bottom:10px;">
                <label style="display:block;font-weight:800;font-size:0.82rem;margin-bottom:4px;">ملاحظات</label>
                <textarea
                  id="returnNotes"
                  maxlength="300"
                  style="width:100%;padding:9px;border:2px solid var(--gray-200);border-radius:6px;font-family:inherit;font-size:0.85rem;min-height:50px;"
                ></textarea>
              </div>

              <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px;margin-top:10px;font-size:0.82rem;">
                <strong>الإجمالي المتوقع:</strong>
                <span id="returnTotalPreview" style="color:#166534;font-weight:900;font-size:1rem;">
                  ${maxRefund.toFixed(2)} ج.م
                </span>
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-outline" onclick="closeModal('returnModal')">إلغاء</button>
              <button class="btn btn-orange" onclick="confirmReturn('${orderId}')">

      document.getElementById('modalContainer').innerHTML = html;
      document.body.style.overflow = 'hidden';

      setTimeout(() => {
        document
          .querySelectorAll('.return-item-qty, .return-item-check')
          .forEach(el => {
            el.addEventListener('input', updateReturnPreview);
            el.addEventListener('change', updateReturnPreview);
          });
        updateReturnPreview();
      }, 100);
    }

    function updateReturnPreview() {
      const order = orState.orders.find(o => o.id === orState.currentOrderId);
      if (!order) {
        return;
      }

      let total = 0;

      (order.items || []).forEach((item, idx) => {
        const check = document.querySelector(`.return-item-check[data-idx="${idx}"]`);
        const qtyInput = document.querySelector(`.return-item-qty[data-idx="${idx}"]`);

        if (!check || !qtyInput || !check.checked) {
          return;
        }

        total += (parseInt(qtyInput.value) || 0) * (item.price || 0);
      });

      const p = document.getElementById('returnTotalPreview');
      if (p) {
        p.textContent = total.toFixed(2) + ' ج.م';
      }
    }

    // ════════════════════════════════════════════════════════════
    // ✅ إصلاح: كل القراءات قبل كل الكتابات
    // ============================================================
    async function confirmReturn(orderId) {
      const order = orState.orders.find(o => o.id === orderId);
      if (!order) {
        return;
      }

      const reason = document.getElementById('returnReason').value;
      const refundMethod = document.getElementById('refundMethod').value;
      const notes = (document.getElementById('returnNotes').value || '').trim();

      const returnItems = [];
      let refundTotal = 0;

      (order.items || []).forEach((item, idx) => {
        const check = document.querySelector(`.return-item-check[data-idx="${idx}"]`);
        const qtyInput = document.querySelector(`.return-item-qty[data-idx="${idx}"]`);

        if (!check || !qtyInput || !check.checked) {
          return;
        }

        const qty = Math.min(parseInt(qtyInput.value) || 0, item.quantity || 0);
        if (qty <= 0) {
          return;
        }

        returnItems.push({
          productId: item.productId,
          productName: item.productName,
          imageUrl: item.imageUrl,
          quantity: qty,
          unit: item.unit,
          price: item.price,
          total: qty * (item.price || 0)
        });

        refundTotal += qty * (item.price || 0);
      });

      if (returnItems.length === 0) {
        window.showToast('اختر منتج واحد', 'warning');
        return;
      }

      const maxRefund = (order.total || 0) - (order.refundedAmount || 0);
      if (refundTotal > maxRefund) {
        window.showToast(`الحد ${maxRefund.toFixed(2)} ج`, 'warning');
        return;
      }

      if (!confirm(`تأكيد المرتجع؟\nالإجمالي: ${refundTotal.toFixed(2)} ج`)) {
        return;
      }

      try {
        const ref = db.collection('orders').doc(orderId);
        const isWholesale = order.storeType === 'wholesale';
        const branchId = order.branchId || 'RGB';
        const now = firebase.firestore.FieldValue.serverTimestamp();

        await db.runTransaction(async t => {
          // ════════════ المرحلة 1: كل القراءات ════════════
          const snap = await t.get(ref);
          if (!snap.exists) {
            throw new Error('الطلب غير موجود');
          }

          const o = snap.data();

          const productReads = [];
          const inventoryReads = [];

          for (const ri of returnItems) {
            if (isWholesale) {
              const pRef = db.collection('products').doc(ri.productId);
              const pDoc = await t.get(pRef);
              productReads.push({
                ref: pRef,
                exists: pDoc.exists,
                data: pDoc.exists ? pDoc.data() : null,
                qty: ri.quantity
              });
            } else {
              const invRef = db.collection('branch_inventory').doc(`${branchId}_${ri.productId}`);
              const invDoc = await t.get(invRef);
              inventoryReads.push({ ref: invRef, exists: invDoc.exists, qty: ri.quantity });
            }
          }

          // ════════════ المرحلة 2: كل الكتابات ════════════

          for (const r of productReads) {
            if (!r.exists) continue;
            const p = r.data;
            const ppu = p.piecesPerUnit || 1;
            const nt = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0) + r.qty;
            t.update(r.ref, {
              warehouseStock: Math.floor(nt / ppu),
              warehousePieces: nt % ppu,
              updatedAt: now
            });
          }

          for (const r of inventoryReads) {
            if (!r.exists) continue;
            t.update(r.ref, {
              piecesQty: firebase.firestore.FieldValue.increment(r.qty),
              availableQty: firebase.firestore.FieldValue.increment(r.qty),
              lastUpdated: now
            });
          }

          const returnRef = db.collection('returns').doc();
          t.set(returnRef, {
            id: returnRef.id,
            returnType: 'customer',
            customerId: o.customerId || null,
            customerName: o.customerName || '',
            orderId,
            invoiceId: o.invoiceId || null,
            branchId,
            items: returnItems,
            totalAmount: refundTotal,
            reason,
            reasonText: notes,
            inventoryAction: 'restock',
            refundMethod,
            refundAmount: refundTotal,
            status: 'approved',
            createdBy: orState.adminId,
            createdByName: orState.adminName,
            createdByRole: orState.role,
            createdAt: now,
            approvedBy: orState.adminId,
            approvedAt: now
          });

          if (['cash', 'instapay', 'wallet'].includes(refundMethod)) {
            const cbRef = db.collection('cashbox').doc();
            t.set(cbRef, {
              id: cbRef.id,
              type: 'expense',
              category: 'customer_refund',
              source: 'manual',
              branchId,
              relatedId: returnRef.id,
              relatedType: 'return',
              amount: refundTotal,
              method: refundMethod,
              description: `مرتجع طلب #${orderId.slice(-8).toUpperCase()}`,
              attachments: [],
              dailyCloseId: '',
              isOpening: false,
              refundOf: '',
              isRefund: true,
              status: 'approved',
              createdBy: orState.adminId,
              createdByName: orState.adminName,
              createdByRole: orState.role,
              approvedBy: orState.adminId,
              approvedByName: orState.adminName,
              approvedAt: now,
              createdAt: now,
              rejectionReason: ''
            });
            t.update(returnRef, { cashboxEntryId: cbRef.id });
          }

          if (refundMethod === 'credit_note' && o.customerId) {
            t.update(db.collection('customers').doc(o.customerId), {
              balance: firebase.firestore.FieldValue.increment(-refundTotal)
            });
          }

          const newRefunded = (o.refundedAmount || 0) + refundTotal;
          const isFully = newRefunded >= (o.total || 0);

          t.update(ref, {
            refundedAmount: newRefunded,
            paymentStatus: isFully ? 'refunded' : 'partial',
            status: isFully ? 'returned' : o.status,
            returnIds: firebase.firestore.FieldValue.arrayUnion(returnRef.id),
            returnedAt: isFully ? now : (o.returnedAt || null),
            updatedAt: now
          });

          if (o.customerId) {
            t.set(db.collection('customer_notifications').doc(), {
              userId: o.customerId,
              title: 'تم استلام مرتجعك',
              body: `تم استرداد ${refundTotal.toFixed(2)} ج.م — ${refundMethod}`,
              type: 'return_confirmed',
              orderId,
              returnId: returnRef.id,
              read: false,
              createdAt: now
            });
          }
        });

        window.showToast('✅ تم تسجيل المرتجع', 'success');
        closeModal('returnModal');
        closeModal('orderModal');
      } catch (err) {
        window.showToast('❌ ' + err.message, 'error');
      }
    }

    // ============================================================
    // Installments — خطة الأقساط
    // ============================================================
    async function openInstallmentPlan(orderId) {
      if (!orState.isSuper && !orState.isAdminPlus) {
        window.showToast('صلاحية super/admin_plus فقط', 'warning');
        return;
      }

      const order = orState.orders.find(o => o.id === orderId);
      if (!order) {
        return;
      }

      orState.currentOrderId = orderId;

      const total = order.total || 0;
      const cfg = window.CREDIT_CONFIG;

      if (total > cfg.MAX_AMOUNT) {
        window.showToast(`الحد ${cfg.MAX_AMOUNT} ج`, 'error');
        return;
      }

      const daysOptions = cfg.ALLOWED_DAYS
        .map(d => `<option value="${d}">${d} أيام — ${cfg.INSTALLMENTS_PER_DAYS[d]} أقساط</option>`)
        .join('');

      const html = `
        <div class="modal-overlay show" id="installmentModal" onclick="closeModal('installmentModal')">
          <div class="modal-content medium" onclick="event.stopPropagation()">
            <div class="modal-header" style="background:linear-gradient(135deg,#5b21b6,#7c3aed);">
              <h2><i class="fas fa-calendar-check"></i> خطة أقساط</h2>
              <button class="modal-close" onclick="closeModal('installmentModal')">&times;</button>
            </div>
            <div class="modal-body">
              <div style="background:#f5f3ff;border:1px solid #c4b5fd;border-radius:8px;padding:12px;margin-bottom:16px;font-size:0.85rem;color:#5b21b6;">
                <strong>الطلب:</strong> #${orderId.slice(-8).toUpperCase()}<br>
                <strong>الإجمالي:</strong> ${total.toFixed(2)} ج
              </div>

              <div style="margin-bottom:12px;">
                <label style="display:block;font-weight:800;font-size:0.85rem;margin-bottom:6px;">المدة</label>
                <select
                  id="planDays"
                  onchange="previewInstallmentSchedule()"
                  style="width:100%;padding:10px;border:2px solid var(--gray-200);border-radius:6px;font-family:inherit;font-size:0.9rem;"
                >
                  ${daysOptions}
                </select>
              </div>

              <div style="margin-bottom:12px;">
                <label style="display:block;font-weight:800;font-size:0.85rem;margin-bottom:6px;">البداية</label>
                <input
                  type="date"
                  id="planStartDate"
                  value="${new Date().toISOString().slice(0, 10)}"
                  onchange="previewInstallmentSchedule()"
                  style="width:100%;padding:10px;border:2px solid var(--gray-200);border-radius:6px;font-family:inherit;font-size:0.9rem;"
                >
              </div>

              <div id="schedulePreview" style="background:var(--gray-50);border-radius:6px;padding:10px;font-size:0.82rem;">
                جاري الحساب...
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-outline" onclick="closeModal('installmentModal')">إلغاء</button>
              <button class="btn btn-purple" onclick="confirmInstallmentPlan('${orderId}')">
                <i class="fas fa-check"></i> إنشاء
              </button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('modalContainer').innerHTML = html;
      document.body.style.overflow = 'hidden';

      setTimeout(() => previewInstallmentSchedule(), 100);
    }

    function previewInstallmentSchedule() {
      const days = parseInt(document.getElementById('planDays')?.value) || 7;
      const sd = document.getElementById('planStartDate')?.value || new Date().toISOString().slice(0, 10);
      const order = orState.orders.find(o => o.id === orState.currentOrderId);

      if (!order) {
        return;
      }

      const total = order.total || 0;
      const cfg = window.CREDIT_CONFIG;
      const count = cfg.INSTALLMENTS_PER_DAYS[days] || 2;
      const baseAmount = Math.floor(total / count);
      const remainder = total - (baseAmount * (count - 1));

      let schedule = [];
      const start = new Date(sd);

      for (let i = 1; i <= count; i++) {
        const d = new Date(start);
        d.setDate(d.getDate() + Math.round(i * days / count));
        schedule.push({
          n: i,
          due: d,
          amount: i === count ? remainder : baseAmount
        });
      }

      const preview = document.getElementById('schedulePreview');
      if (preview) {
        preview.innerHTML = `
          <table style="width:100%;">
            <thead>
              <tr style="border-bottom:2px solid var(--gray-300);">
                <th style="padding:4px;">#</th>
                <th style="padding:4px;">التاريخ</th>
                <th style="padding:4px;">المبلغ</th>
              </tr>
            </thead>
            <tbody>
              ${schedule.map(s => `
                <tr style="border-bottom:1px solid var(--gray-200);">
                  <td style="padding:6px;text-align:center;font-weight:800;">${s.n}</td>
                  <td style="padding:6px;">${s.due.toLocaleDateString('ar-EG')}</td>
                  <td style="padding:6px;text-align:left;font-weight:900;color:#5b21b6;">${s.amount.toFixed(2)} ج</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-300);text-align:center;font-weight:900;color:#5b21b6;">
            الإجمالي: ${total.toFixed(2)} ج
          </div>
        `;
      }
    }

    async function confirmInstallmentPlan(orderId) {
      const days = parseInt(document.getElementById('planDays')?.value) || 7;
      const sd = document.getElementById('planStartDate')?.value;

      if (!sd) {
        window.showToast('اختر تاريخ البداية', 'warning');
        return;
      }

      if (!confirm(`إنشاء خطة ${days} أيام؟`)) {
        return;
      }

      try {
        const ref = db.collection('orders').doc(orderId);
        const snap = await ref.get();
        if (!snap.exists) {
          throw new Error('الطلب غير موجود');
        }

        const o = snap.data();
        if (o.installmentPlanId) {
          throw new Error('يوجد خطة بالفعل');
        }

        const total = o.total || 0;
        const cfg = window.CREDIT_CONFIG;
        const count = cfg.INSTALLMENTS_PER_DAYS[days] || 2;
        const baseAmount = Math.floor(total / count);
        const remainder = total - (baseAmount * (count - 1));
        const now = firebase.firestore.FieldValue.serverTimestamp();
        const start = new Date(sd);
        const schedule = [];

        for (let i = 1; i <= count; i++) {
          const d = new Date(start);
          d.setDate(d.getDate() + Math.round(i * days / count));
          schedule.push({
            n: i,
            dueDate: firebase.firestore.Timestamp.fromDate(d),
            amount: i === count ? remainder : baseAmount,
            paid: false,
            paidAt: null,
            paidAmount: 0,
            fee: 0,
            cashboxEntryId: '',
            method: ''
          });
        }

        const planRef = db.collection('installment_plans').doc();

        await db.runTransaction(async t => {
          t.set(planRef, {
            id: planRef.id,
            customerId: o.customerId || null,
            customerName: o.customerName || '',
            orderId,
            invoiceId: o.invoiceId || null,
            totalAmount: total,
            days,
            installmentsCount: count,
            schedule,
            paidAmount: 0,
            remainingAmount: total,
            status: 'active',
            createdBy: orState.adminId,
            createdByName: orState.adminName,
            createdAt: now,
            reminders_sent: [],
            completedAt: null,
            notes: ''
          });

          t.update(ref, {
            installmentPlanId: planRef.id,
            installmentSchedule: schedule,
            installmentPaidAmount: 0,
            installmentRemaining: total,
            paymentStatus: 'unpaid',
            updatedAt: now
          });
        });

        window.showToast('✅ تم إنشاء الخطة', 'success');
        closeModal('installmentModal');
        closeModal('orderModal');
      } catch (err) {
        window.showToast('❌ ' + err.message, 'error');
      }
    }

    async function loadAvailableProductsForEdit(isWholesale, branchId, order) {
      const products = [];
      const currentIds = new Set((order.items || []).map(i => i.productId));

      try {
        if (isWholesale) {
          const snap = await db.collection('products').where('available', '==', true).limit(500).get();

          snap.forEach(doc => {
            const p = doc.data();
            const ppu = p.piecesPerUnit || 1;
            const total = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
            const available = Math.max(0, total - (p.reservedPieces || 0));
            const isC = currentIds.has(doc.id);

            if (available > 0 || isC) {
              products.push({
                id: doc.id,
                name: p.name || '',
                imageUrl: p.imageUrl || '',
                unit: p.unit || 'قطعة',
                price: p.wholesalePrice || 0,
                available: available + (isC ? (order.items.find(i => i.productId === doc.id)?.quantity || 0) : 0)
              });
            }
          });
        } else {
          const snap = await db.collection('branch_inventory').where('branchId', '==', branchId).limit(500).get();
          const invs = [];

          snap.forEach(doc => {
            const d = doc.data();
            const avail = (d.piecesQty || 0) - (d.reservedQty || 0);
            const isC = currentIds.has(d.productId);
            if (avail > 0 || isC) {
              invs.push({ inv: d, avail, isC });
            }
          });

          const pids = invs.map(x => x.inv.productId);
          const pMap = {};

          for (let i = 0; i < pids.length; i += 30) {
            const chunk = pids.slice(i, i + 30);
            if (!chunk.length) {
              continue;
            }

            const pSnap = await db
              .collection('products')
              .where(firebase.firestore.FieldPath.documentId(), 'in', chunk)
              .get();

            pSnap.forEach(pd => {
              pMap[pd.id] = pd.data();
            });
          }

          invs.forEach(({ inv, avail, isC }) => {
            const p = pMap[inv.productId];
            if (!p) {
              return;
            }

            products.push({
              id: inv.productId,
              name: p.name || '',
              imageUrl: p.imageUrl || inv.productImage || '',
              unit: p.unit || inv.unit || 'قطعة',
              price: p.retailPrice || 0,
              available: avail + (isC ? (order.items.find(i => i.productId === inv.productId)?.quantity || 0) : 0)
            });
          });
        }
      } catch (err) {
        console.error(err);
      }

      products.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
      return products;
    }

          <div style="font-weight:900;color:var(--gold-dark);font-size:0.9rem;min-width:70px;text-align:left;">
            ${((item.price || 0) * (item.quantity || 0)).toFixed(0)} ج
          </div>
          <button
            type="button"
            onclick="removeEditItem(${idx})"
            style="background:#fee2e2;color:#dc2626;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;flex-shrink:0;"
          >
            <i class="fas fa-trash"></i>
          </button>
        </div>
      `).join('');
    }

    function updateEditItemQty(idx, value) {
      const item = orState.editItems[idx];
      if (!item) {
        return;
      }

      const max = item._newMax || item.quantity || 1;
      const qty = Math.max(1, Math.min(parseInt(value) || 1, max));

      item.quantity = qty;
      item.total = qty * (item.price || 0);

      renderEditItemsList();
      updateEditTotalsPreview();
    }

    function removeEditItem(idx) {
      if (!confirm('حذف المنتج؟')) {
        return;
      }

      orState.editItems.splice(idx, 1);
      renderEditItemsList();
      updateEditTotalsPreview();
    }

    function updateEditTotalsPreview() {
      const order = orState.orders.find(o => o.id === orState.currentOrderId);
      if (!order) {
        return;
      }

      const p = document.getElementById('editTotalsPreview');
      if (!p) {
        return;
      }

      const subtotal = (orState.editItems || []).reduce(
        (s, i) => s + (i.price || 0) * (i.quantity || 0),
        0
      );

      const rates = (window.SHIPPING_RATES_DEFAULTS || {})[order.storeType] || {};
      const rate = rates[order.region];
      const shipping = rate
        ? (subtotal >= rate.freeThreshold ? 0 : rate.cost)
        : (order.shippingCost || 0);

      const feePercent = order.paymentMethod === 'wallet' ? 1 : 0;
      const fee = (subtotal + shipping) * feePercent / 100;
      const total = Math.round((subtotal + shipping + fee) / 5) * 5;

      const diff = total - (order.total || 0);
      const diffClass =
        diff > 0
          ? 'color:#dc2626;'
          : diff < 0
            ? 'color:#16a34a;'
            : 'color:var(--gray-500);';

      const diffText =
        diff > 0
          ? `+${diff.toFixed(0)} ج (زيادة)`
          : diff < 0
            ? `${Math.abs(diff).toFixed(0)} ج (نقصان)`
            : 'لا تغيير';

      p.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:0.82rem;">
          <div><strong>المجموع:</strong> ${subtotal.toFixed(2)} ج</div>
          <div><strong>الشحن:</strong> ${shipping.toFixed(2)} ج</div>
          ${fee > 0 ? `<div><strong>رسوم:</strong> ${fee.toFixed(2)} ج</div>` : ''}
          <div>
            <strong>الإجمالي:</strong>
            <span style="color:var(--gold-dark);font-weight:900;">${total.toFixed(0)} ج</span>
          </div>
        </div>
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid #bae6fd;font-size:0.82rem;${diffClass}font-weight:800;">
          الفرق: ${diffText}
        </div>
      `;
    }

    function openEditProductPicker() {
      const curIds = new Set((orState.editItems || []).map(i => i.productId));
      const avail = (orState.editAvailableProducts || []).filter(p => !curIds.has(p.id));

      if (avail.length === 0) {
        window.showToast('كل المنتجات مضافة', 'warning');
        return;
      }

      orState.editPickerSearch = '';

      const html = `
        <div class="modal-overlay show" id="editPickerModal" onclick="closeModal('editPickerModal')">
          <div class="modal-content medium" onclick="event.stopPropagation()">
            <div class="modal-header" style="background:linear-gradient(135deg,#065f46,#10b981);">
              <h2><i class="fas fa-plus-circle"></i> إضافة منتج</h2>
              <button class="modal-close" onclick="closeModal('editPickerModal')">&times;</button>
            </div>
            <div style="padding:12px 16px;border-bottom:1px solid var(--gray-200);">
              <input
                type="text"
                id="editPickerSearch"
                placeholder="بحث..."
                oninput="filterEditPicker(this.value)"
                style="width:100%;padding:10px 12px;border:2px solid var(--gray-200);border-radius:6px;font-family:inherit;font-size:0.88rem;outline:none;"
              >
            </div>
            <div
              style="max-height:400px;overflow-y:auto;padding:8px;"
              id="editPickerList"
            ></div>
          </div>
        </div>
      `;

      document
        .getElementById('modalContainer')
        .insertAdjacentHTML('beforeend', html);

      renderEditPickerList();
    }

    function filterEditPicker(s) {
      orState.editPickerSearch = (s || '').toLowerCase();
      renderEditPickerList();
    }

    function renderEditPickerList() {
      const c = document.getElementById('editPickerList');
      if (!c) {
        return;
      }

      const curIds = new Set((orState.editItems || []).map(i => i.productId));
      let avail = (orState.editAvailableProducts || []).filter(p => !curIds.has(p.id));

      if (orState.editPickerSearch) {
        avail = avail.filter(p =>
          (p.name || '').toLowerCase().includes(orState.editPickerSearch)
        );
      }

      if (avail.length === 0) {
        c.innerHTML = `
          <div style="text-align:center;padding:30px 20px;color:var(--gray-400);">
            لا توجد نتائج
          </div>
        `;
        return;
      }

      c.innerHTML = avail.map(p => `
        <div
          onclick="addProductToEditOrder('${p.id}')"
          style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:6px;cursor:pointer;border:1.5px solid transparent;transition:all .2s;"
          onmouseover="this.style.background='#f0fdf4';this.style.borderColor='#86efac'"
          onmouseout="this.style.background='';this.style.borderColor='transparent'"
        >
          <img
            src="${p.imageUrl || '/gomla/assets/images/no-image.png'}"
            style="width:42px;height:42px;border-radius:6px;object-fit:cover;"
            onerror="this.src='/gomla/assets/images/no-image.png'"
          >
          <div style="flex:1;min-width:0;">
            <div style="font-size:0.85rem;font-weight:800;color:var(--navy);">
              ${_esc(p.name || '')}
            </div>
            <div style="font-size:0.7rem;color:var(--gray-500);">
              ${p.available} ${_esc(p.unit || 'قطعة')} · ${(p.price || 0).toFixed(2)} ج
            </div>
          </div>
          <i class="fas fa-plus-circle" style="color:#16a34a;font-size:1.1rem;"></i>
        </div>
      `).join('');
    }

    function addProductToEditOrder(pid) {
      const p = (orState.editAvailableProducts || []).find(x => x.id === pid);
      if (!p) {
        return;
      }

      orState.editItems.push({
        productId: p.id,
        productName: p.name,
        imageUrl: p.imageUrl,
        unit: p.unit,
        price: p.price,
        quantity: 1,
        total: p.price,
        _newMax: p.available,
        _isNew: true
      });

      closeModal('editPickerModal');
      renderEditItemsList();
      updateEditTotalsPreview();
    }

    // ════════════════════════════════════════════════════════════
    // ✅ إصلاح: كل القراءات قبل كل الكتابات
    // ============================================================
    async function saveEditedOrder(orderId) {
      const name = (document.getElementById('editName')?.value || '').trim();
      const phone = (document.getElementById('editPhone')?.value || '').trim();
      const phone2 = (document.getElementById('editPhone2')?.value || '').trim();
      const address = (document.getElementById('editAddress')?.value || '').trim();
      const dd = document.getElementById('editDeliveryDate')?.value || '';
      const notes = (document.getElementById('editNotes')?.value || '').trim();

      if (!name || name.length < 3) {
        window.showToast('الاسم مطلوب', 'warning');
        return;
      }
      if (!phone || !/^01[0-9]{9}$/.test(phone)) {
        window.showToast('هاتف غير صحيح', 'warning');
        return;
      }
      if (phone2 && !/^01[0-9]{9}$/.test(phone2)) {
        window.showToast('هاتف بديل غير صحيح', 'warning');
        return;
      }
      if (!orState.editItems || !orState.editItems.length) {
        window.showToast('أضف منتجاً', 'warning');
        return;
      }

      const btn = document.getElementById('saveEditOrderBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>...';

      try {
        const ref = db.collection('orders').doc(orderId);

        await db.runTransaction(async t => {
          // ════════════ المرحلة 1: كل القراءات ════════════
          const snap = await t.get(ref);
          if (!snap.exists) {
            throw new Error('الطلب غير موجود');
          }

          const o = snap.data();

          if (!['pending', 'processing', 'ready', 'shipped'].includes(o.status)) {
            throw new Error('لا يمكن تعديل هذه الحالة');
          }
          if (o.status === 'shipped' && !orState.isSuper && !orState.isAdminPlus) {
            throw new Error('المشحونة لـ super/plus فقط');
          }
          if (o.paymentStatus === 'paid' || o.paymentStatus === 'refunded') {
            throw new Error('مدفوع/مرتجع');
          }

          const isWh = o.storeType === 'wholesale';
          const branchId = o.branchId || 'RGB';
          const now = firebase.firestore.FieldValue.serverTimestamp();

          // حساب الفروقات
          const oldMap = {};
          (o.items || []).forEach(i => {
            oldMap[i.productId] = (oldMap[i.productId] || 0) + (i.quantity || 0);
          });

          const newMap = {};
          orState.editItems.forEach(i => {
            newMap[i.productId] = (newMap[i.productId] || 0) + (i.quantity || 0);
          });

          const allPids = new Set([...Object.keys(oldMap), ...Object.keys(newMap)]);
          const deltaList = [];

          // قراءة كل المنتجات مرة واحدة (قبل أي كتابة)
          for (const pid of allPids) {
            const delta = (newMap[pid] || 0) - (oldMap[pid] || 0);
            if (delta === 0) continue;

            if (isWh) {
              const pRef = db.collection('products').doc(pid);
              const pDoc = await t.get(pRef);
              if (!pDoc.exists) {
                if (delta > 0) {
                  throw new Error('منتج غير موجود');
                }
                continue;
              }

              const p = pDoc.data();
              if (delta > 0) {
                const ppu = p.piecesPerUnit || 1;
                const tp = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0) - (p.reservedPieces || 0);
                if (tp < delta) {
                  throw new Error(`مخزون ${p.name} (متاح ${tp})`);
                }
              }

              deltaList.push({ type: 'product', pid, ref: pRef, delta, name: p.name });
            } else {
              const invRef = db.collection('branch_inventory').doc(`${branchId}_${pid}`);
              const invDoc = await t.get(invRef);
              if (!invDoc.exists) {
                if (delta > 0) {
                  throw new Error('منتج غير متوفر بالفرع');
                }
                continue;
              }

              const inv = invDoc.data();
              if (delta > 0) {
                const a = inv.availableQty || 0;
                if (a < delta) {
                  throw new Error(`مخزون ${inv.productName || pid} (متاح ${a})`);
                }
              }

              deltaList.push({ type: 'inventory', pid, ref: invRef, delta, name: inv.productName });
            }
          }

          // ════════════ المرحلة 2: كل الكتابات ════════════

          const deltaChanges = [];

          for (const d of deltaList) {
            if (d.type === 'product') {
              t.update(d.ref, {
                reservedPieces: firebase.firestore.FieldValue.increment(d.delta)
              });
            } else {
              t.update(d.ref, {
                reservedQty: firebase.firestore.FieldValue.increment(d.delta),
                availableQty: firebase.firestore.FieldValue.increment(-d.delta),
                lastUpdated: now,
                updatedBy: orState.adminId
              });
            }
            deltaChanges.push({ pid: d.pid, name: d.name, delta: d.delta });
          }

          // إعادة حساب الإجمالي
          const newSub = orState.editItems.reduce(
            (s, i) => s + (i.price || 0) * (i.quantity || 0),
            0
          );

          const rates = (window.SHIPPING_RATES_DEFAULTS || {})[o.storeType] || {};
          const rate = rates[o.region];
          const newShip = rate
            ? (newSub >= rate.freeThreshold ? 0 : rate.cost)
            : (o.shippingCost || 0);

          const feePct = o.paymentMethod === 'wallet' ? 1 : 0;
          const newFee = (newSub + newShip) * feePct / 100;
          const newTotal = Math.round((newSub + newShip + newFee) / 5) * 5;

          const cleanedItems = orState.editItems.map(i => ({
            productId: i.productId,
            productName: i.productName,
            imageUrl: i.imageUrl,
            quantity: i.quantity,
            unit: i.unit,
            price: i.price,
            total: i.total
          }));

          const balanceDelta = (o.customerId && o.balanceApplied)
            ? (newTotal - (o.total || 0))
            : 0;

          const changes = [];
          if (o.customerName !== name) changes.push({ field: 'customerName', old: o.customerName, new: name });
          if (o.customerPhone !== phone) changes.push({ field: 'customerPhone', old: o.customerPhone, new: phone });
          if ((o.customerPhone2 || '') !== phone2) changes.push({ field: 'customerPhone2', old: o.customerPhone2, new: phone2 });
          if ((o.deliveryAddress || o.customerAddress || '') !== address) changes.push({ field: 'address', old: o.deliveryAddress || o.customerAddress, new: address });
          if ((o.deliveryDate || '') !== dd) changes.push({ field: 'deliveryDate', old: o.deliveryDate, new: dd });
          if ((o.notes || '') !== notes) changes.push({ field: 'notes', old: o.notes, new: notes });
          if (deltaChanges.length > 0) changes.push({ field: 'items', changes: deltaChanges });
          if (newTotal !== (o.total || 0)) changes.push({ field: 'total', old: o.total, new: newTotal });

          t.update(ref, {
            customerName: name,
            customerPhone: phone,
            customerPhone2: phone2 || '',
            deliveryAddress: address,
            customerAddress: address,
            deliveryDate: dd || '',
            notes: notes || '',
            items: cleanedItems,
            subtotal: newSub,
            shippingCost: newShip,
            paymentFee: newFee,
            total: newTotal,
            remaining: newTotal - (o.paidAmount || 0),
            modifications: firebase.firestore.FieldValue.arrayUnion({
              at: new Date().toISOString(),
              by: orState.adminId,
              byName: orState.adminName,
              changes
            }),
            updatedAt: now
          });

          if (balanceDelta !== 0) {
            t.update(db.collection('customers').doc(o.customerId), {
              balance: firebase.firestore.FieldValue.increment(balanceDelta)
            });
          }

          if (o.customerId) {
            const n = [];
            if (changes.some(c => c.field === 'items')) n.push('تم تحديث المنتجات');
            if (changes.some(c => c.field === 'total')) n.push(`الإجمالي الجديد ${newTotal} ج`);

            t.set(db.collection('customer_notifications').doc(), {
              userId: o.customerId,
              title: 'تم تعديل طلبك',
              body: n.join(' · ') || 'تم التحديث',
              type: 'order_modified',
              orderId,
              read: false,
              createdAt: now
            });
          }
        });

        window.showToast('✅ تم الحفظ', 'success');
        closeModal('editOrderModal');
        closeModal('orderModal');

        orState.editItems = null;
        orState.editAvailableProducts = null;
      } catch (err) {
        window.showToast('❌ ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
      }
    }

    // ============================================================
    // تصدير الدوال على window
    // ============================================================
    window.loadOrders = loadOrders;
    window.onSearchInput = onSearchInput;
    window.applyFilters = applyFilters;
    window.resetFilters = resetFilters;
    window.filterByStatus = filterByStatus;
    window.switchTab = switchTab;
    window.closeModal = closeModal;
    window.closeAllModals = closeAllModals;
    window.releaseExpiredManual = releaseExpiredManual;
    window.openOrderDetails = openOrderDetails;
    window.switchOrderDetailTab = switchOrderDetailTab;
    window.approveOrder = approveOrder;
    window.openRejectModal = openRejectModal;
    window.confirmReject = confirmReject;
    window.markReady = markReady;
    window.openShipModal = openShipModal;
    window.confirmShip = confirmShip;
    window.markDelivered = markDelivered;
    window.confirmCashReceipt = confirmCashReceipt;
    window.openRejectByCustomerModal = openRejectByCustomerModal;
    window.confirmRejectByCustomer = confirmRejectByCustomer;
    window.cancelOrder = cancelOrder;
    window.openReturnModal = openReturnModal;
    window.updateReturnPreview = updateReturnPreview;
    window.confirmReturn = confirmReturn;
    window.openInstallmentPlan = openInstallmentPlan;
    window.previewInstallmentSchedule = previewInstallmentSchedule;
    window.confirmInstallmentPlan = confirmInstallmentPlan;
    window.openWhatsApp = openWhatsApp;
    window.previewWhatsApp = previewWhatsApp;
    window.sendWhatsApp = sendWhatsApp;
    window.printInvoice = printInvoice;
    window.openEditOrder = openEditOrder;
    window.saveEditedOrder = saveEditedOrder;
    window.renderEditOrderModal = renderEditOrderModal;
    window.loadAvailableProductsForEdit = loadAvailableProductsForEdit;
    window.renderEditItemsList = renderEditItemsList;
    window.updateEditItemQty = updateEditItemQty;
    window.removeEditItem = removeEditItem;
    window.updateEditTotalsPreview = updateEditTotalsPreview;
    window.openEditProductPicker = openEditProductPicker;
    window.filterEditPicker = filterEditPicker;
    window.renderEditPickerList = renderEditPickerList;
    window.addProductToEditOrder = addProductToEditOrder;
  </script>

</body>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الطلبات - أولاد شعلان</title>
  <meta name="theme-color" content="#1a2a4a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    html, body { overflow-x: hidden !important; max-width: 100vw; }

    /* ============================================================ */
    /* Page Header                                                   */
    /* ============================================================ */
    .or-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: var(--radius-lg); padding: 22px 24px; margin-bottom: 18px;
      color: var(--white); position: relative; overflow: hidden;
      box-shadow: 0 12px 40px rgba(26,42,74,.25);
      border-bottom: 4px solid var(--gold);
    }
    .or-header::before {
      content: ''; position: absolute; top: -50%; right: -15%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(201,168,76,.18) 0%, transparent 70%);
      border-radius: 50%;
    }
    .or-header-inner {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
    }
    .or-header-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 220px; }
    .or-header-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy); display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(201,168,76,.4);
    }
    .or-header h1 { font-size: 1.35rem; font-weight: 900; margin: 0 0 3px; color: var(--white); }
    .or-header p { font-size: 0.83rem; opacity: 0.88; margin: 0; }
    .or-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .or-header-actions .btn {
      background: rgba(255,255,255,.15); color: var(--white);
      border: 1px solid rgba(255,255,255,.3);
      padding: 8px 14px; border-radius: var(--radius-sm);
      font-family: inherit; font-weight: 700; font-size: 0.82rem;
      cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .or-header-actions .btn:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }

    /* ============================================================ */
    /* Stats                                                         */
    /* ============================================================ */
    .or-stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .or-stat {
      background: var(--white); border-radius: var(--radius-md);
      padding: 14px 10px; box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      text-align: center; transition: var(--transition);
      text-decoration: none; color: inherit;
      position: relative; overflow: hidden;
    }
    .or-stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--gold-light); }
    .or-stat.active { border-color: var(--gold); background: linear-gradient(135deg, #fcf9f0, #f8f4e8); }
    .or-stat-icon {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; margin: 0 auto 6px;
    }
    .or-stat-icon.gold   { background: rgba(201,168,76,.15); color: var(--gold-dark); }
    .or-stat-icon.blue   { background: rgba(59,130,246,.12); color: #2563eb; }
    .or-stat-icon.purple { background: rgba(139,92,246,.12); color: #7c3aed; }
    .or-stat-icon.green  { background: rgba(34,197,94,.12);  color: #16a34a; }
    .or-stat-icon.teal   { background: rgba(20,184,166,.12); color: #0d9488; }
    .or-stat-icon.red    { background: rgba(239,68,68,.12);  color: #dc2626; }
    .or-stat-num { font-size: 1.1rem; font-weight: 900; color: var(--navy); line-height: 1.2; margin-bottom: 2px; }
    .or-stat-num.gold   { color: var(--gold-dark); }
    .or-stat-num.blue   { color: #2563eb; }
    .or-stat-num.purple { color: #7c3aed; }
    .or-stat-num.green  { color: #16a34a; }
    .or-stat-num.teal   { color: #0d9488; }
    .or-stat-num.red    { color: #dc2626; }
    .or-stat-label { font-size: 0.65rem; color: var(--gray-500); font-weight: 700; line-height: 1.2; }

    /* ============================================================ */
    /* Tabs                                                          */
    /* ============================================================ */
    .or-tabs {
      display: flex; gap: 6px; margin-bottom: 16px;
      background: var(--white); padding: 8px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow-x: auto; scrollbar-width: thin;
    }
    .or-tabs::-webkit-scrollbar { height: 4px; }
    .or-tabs::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    .or-tab {
      flex-shrink: 0; padding: 10px 16px;
      border: 2px solid var(--gray-200); background: var(--white);
      color: var(--gray-600); border-radius: var(--radius-sm);
      font-family: inherit; font-weight: 800; font-size: 0.82rem;
      cursor: pointer; transition: all 0.25s ease;
      display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .or-tab:hover { border-color: var(--gold-light); background: var(--gray-50); }
    .or-tab.active {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white); border-color: var(--navy);
      box-shadow: 0 6px 16px rgba(26,42,74,.25);
    }
    .or-tab.active i { color: var(--gold); }
    .or-tab .tab-count {
      background: rgba(0,0,0,.08); padding: 1px 7px;
      border-radius: 10px; font-size: 0.65rem; font-weight: 900;
      min-width: 20px; text-align: center;
    }
    .or-tab.active .tab-count { background: var(--gold); color: var(--navy); }

    /* ============================================================ */
    /* Filters                                                       */
    /* ============================================================ */
    .or-filters {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .or-search { position: relative; flex: 1; min-width: 200px; }
    .or-search input {
      width: 100%; padding: 10px 40px 10px 14px;
      border: 2px solid var(--gray-200); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 0.88rem;
      background: var(--gray-50); outline: none; transition: var(--transition);
    }
    .or-search input:focus { border-color: var(--gold); background: var(--white); box-shadow: 0 0 0 4px rgba(201,168,76,.15); }
    .or-search i { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--gray-400); }
    .or-filters select, .or-filters input[type="date"] {
      padding: 10px 12px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit; font-size: 0.82rem;
      background: var(--gray-50); outline: none;
      cursor: pointer; min-width: 120px;
    }
    .or-filters select:focus, .or-filters input[type="date"]:focus { border-color: var(--gold); background: var(--white); }
    .or-filters .btn-icon-only {
      padding: 10px 14px;
      border: 2px solid var(--gray-200);
      background: var(--white); border-radius: var(--radius-sm);
      color: var(--gray-600); cursor: pointer; transition: var(--transition);
    }
    .or-filters .btn-icon-only:hover { border-color: var(--gold); color: var(--gold-dark); }
    .or-date-range {
      display: flex; gap: 4px; align-items: center;
    }
    .or-date-range span { font-size: 0.7rem; color: var(--gray-500); }

    /* ============================================================ */
    /* Orders List                                                   */
    /* ============================================================ */
    .or-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }

    .or-card {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      padding: 14px 16px;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: flex; flex-direction: column; gap: 10px;
    }
    .or-card::before {
      content: '';
      position: absolute; top: 0; right: 0;
      width: 5px; height: 100%;
      background: var(--gold);
    }
    .or-card.status-pending::before         { background: #f59e0b; }
    .or-card.status-processing::before      { background: #3b82f6; }
    .or-card.status-shipped::before         { background: #8b5cf6; }
    .or-card.status-delivered::before       { background: #22c55e; }
    .or-card.status-cancelled::before       { background: #ef4444; }
    .or-card.status-auto_cancelled::before  { background: #6b7280; }
    .or-card.status-returned::before        { background: #f97316; }
    .or-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--gold-light);
    }

    .or-card-head {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 10px; flex-wrap: wrap;
    }
    .or-card-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.95rem; font-weight: 900;
      color: var(--navy);
      flex-wrap: wrap;
    }
    .or-num {
      font-family: 'Courier New', monospace;
      background: var(--gray-100);
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      direction: ltr;
    }
    .or-badges { display: flex; gap: 6px; flex-wrap: wrap; }

    .or-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: var(--radius-full);
      font-size: 0.68rem; font-weight: 800;
      white-space: nowrap;
    }
    .or-badge.status-pending         { background: rgba(245,158,11,.15);  color: #b45309; }
    .or-badge.status-processing      { background: rgba(59,130,246,.15);  color: #1d4ed8; }
    .or-badge.status-shipped         { background: rgba(139,92,246,.15);  color: #6d28d9; }
    .or-badge.status-delivered       { background: rgba(34,197,94,.15);   color: #15803d; }
    .or-badge.status-cancelled       { background: rgba(239,68,68,.15);   color: #b91c1c; }
    .or-badge.status-auto_cancelled  { background: rgba(107,114,128,.15); color: #4b5563; }
    .or-badge.status-returned        { background: rgba(249,115,22,.15);  color: #c2410c; }

    .or-badge.payment-unpaid         { background: rgba(239,68,68,.15);  color: #b91c1c; }
    .or-badge.payment-pending        { background: rgba(245,158,11,.15); color: #b45309; }
    .or-badge.payment-partial        { background: rgba(245,158,11,.15); color: #b45309; }
    .or-badge.payment-paid           { background: rgba(34,197,94,.15);  color: #15803d; }
    .or-badge.payment-refunded       { background: rgba(139,92,246,.15); color: #6d28d9; }
    .or-badge.payment-awaiting_admin { background: rgba(139,92,246,.15); color: #6d28d9; }
    .or-badge.payment-awaiting_agent { background: rgba(59,130,246,.15); color: #1d4ed8; }
    .or-badge.payment-awaiting_cardoona { background: rgba(201,168,76,.15); color: #92400e; }

    .or-badge.reserved { background: rgba(139,92,246,.15); color: #6d28d9; }
    .or-badge.branch   { background: var(--gray-100); color: var(--gray-700); }

    .or-card-info {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      font-size: 0.8rem;
    }
    .or-info-item {
      display: flex; align-items: center; gap: 6px;
      color: var(--gray-600);
    }
    .or-info-item i {
      color: var(--gold); font-size: 0.72rem;
      width: 14px; text-align: center; flex-shrink: 0;
    }
    .or-info-item .val {
      font-weight: 700; color: var(--navy);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .or-info-item .val.total { color: var(--gold-dark); font-size: 0.92rem; }

    .or-card-actions {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px solid var(--gray-100);
    }
    .or-action-btn {
      padding: 7px 12px;
      border: 1.5px solid;
      border-radius: var(--radius-sm);
      font-family: inherit; font-weight: 800;
      font-size: 0.72rem; cursor: pointer;
      transition: all .2s ease;
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--white); white-space: nowrap;
    }
    .or-action-btn.view     { border-color: var(--gray-300); color: var(--gray-700); }
    .or-action-btn.view:hover { background: var(--navy); color: white; border-color: var(--navy); }
    .or-action-btn.process  { border-color: #93c5fd; color: #1d4ed8; }
    .or-action-btn.process:hover { background: #3b82f6; color: white; border-color: #2563eb; }
    .or-action-btn.assign   { border-color: #c4b5fd; color: #6d28d9; }
    .or-action-btn.assign:hover { background: #8b5cf6; color: white; border-color: #6d28d9; }
    .or-action-btn.shipped  { border-color: #c4b5fd; color: #6d28d9; }
    .or-action-btn.shipped:hover { background: #8b5cf6; color: white; border-color: #6d28d9; }
    .or-action-btn.delivered{ border-color: #86efac; color: #16a34a; background: #f0fdf4; }
    .or-action-btn.delivered:hover { background: #22c55e; color: white; border-color: #16a34a; }
    .or-action-btn.confirm  { border-color: #86efac; color: #166534; background: #dcfce7; }
    .or-action-btn.confirm:hover { background: #16a34a; color: white; border-color: #166534; }
    .or-action-btn.cancel   { border-color: #fca5a5; color: #dc2626; }
    .or-action-btn.cancel:hover { background: #dc2626; color: white; border-color: #dc2626; }
    .or-action-btn.return   { border-color: #fdba74; color: #c2410c; }
    .or-action-btn.return:hover { background: #f97316; color: white; border-color: #c2410c; }
    .or-action-btn.whatsapp { border-color: #86efac; color: #15803d; background: #f0fdf4; }
    .or-action-btn.whatsapp:hover { background: #16a34a; color: white; }
    .or-action-btn.install  { border-color: var(--gold); color: var(--gold-dark); background: #fcf9f0; }
    .or-action-btn.install:hover { background: var(--gold); color: var(--navy); }
    .or-action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ============================================================ */
    /* Empty / Loading                                               */
    /* ============================================================ */
    .or-empty, .or-loading {
      text-align: center; padding: 60px 20px;
      background: var(--white); border-radius: var(--radius-md);
      border: 2px dashed var(--gray-300);
    }
    .or-empty .empty-icon {
      width: 90px; height: 90px; border-radius: 50%;
      background: var(--gray-100); color: var(--gray-400);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; margin: 0 auto 16px;
    }
    .or-empty h3 { font-size: 1.1rem; font-weight: 900; color: var(--navy); margin-bottom: 6px; }
    .or-empty p { font-size: 0.85rem; color: var(--gray-500); }
    .or-loading i { font-size: 2rem; color: var(--gold); margin-bottom: 10px; }

    /* ============================================================ */
    /* Modal                                                         */
    /* ============================================================ */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(15,26,46,.75); backdrop-filter: blur(4px);
      z-index: 999; justify-content: center; align-items: center;
      padding: 20px; overflow-y: auto;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: var(--white); border-radius: var(--radius-lg);
      max-width: 850px; width: 100%;
      max-height: 92vh; overflow-y: auto;
      padding: 0; position: relative;
      animation: modalSlide .3s ease;
    }
    .modal-content.small { max-width: 500px; }
    .modal-content.medium { max-width: 650px; }
    @keyframes modalSlide { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header {
      padding: 18px 22px;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 2;
    }
    .modal-header h2 {
      font-size: 1.05rem; font-weight: 900; margin: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .modal-header h2 i { color: var(--gold); }
    .modal-close {
      background: rgba(255,255,255,.15); border: none;
      color: var(--white); width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; font-size: 1.1rem;
      transition: var(--transition);
    }
    .modal-close:hover { background: var(--danger); transform: rotate(90deg); }
    .modal-body { padding: 20px 22px; }
    .modal-actions {
      padding: 16px 22px; border-top: 2px solid var(--gray-100);
      display: flex; gap: 10px; justify-content: flex-end;
      position: sticky; bottom: 0; background: var(--white);
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 18px; border: none; border-radius: var(--radius-sm);
      font-family: inherit; font-weight: 800; font-size: 0.85rem;
      cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 2px solid var(--gray-300); color: var(--gray-700); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold-dark); }
    .btn-gold { background: var(--gold); color: var(--navy); }
    .btn-gold:hover { background: var(--gold-dark); color: var(--white); transform: translateY(-1px); }
    .btn-success { background: #16a34a; color: white; }
    .btn-success:hover { background: #15803d; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-purple { background: #8b5cf6; color: white; }
    .btn-purple:hover { background: #6d28d9; }
    .btn-orange { background: #f97316; color: white; }
    .btn-orange:hover { background: #ea580c; }

    /* ============================================================ */
    /* Responsive                                                    */
    /* ============================================================ */
    @media (max-width: 1200px) {
      .or-stats { grid-template-columns: repeat(3, 1fr); }
      .or-card-info { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .or-header { padding: 16px; border-radius: var(--radius-md); }
      .or-header-icon { width: 46px; height: 46px; font-size: 1.2rem; }
      .or-header h1 { font-size: 1.05rem; }
      .or-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .or-stat { padding: 11px 8px; }
      .or-stat-icon { width: 32px; height: 32px; font-size: 0.85rem; }
      .or-stat-num { font-size: 0.95rem; }
      .or-stat-label { font-size: 0.6rem; }
      .or-tab { padding: 8px 12px; font-size: 0.75rem; }
      .or-filters { flex-direction: column; align-items: stretch; }
      .or-search, .or-filters select, .or-filters input[type="date"] { min-width: 100%; }
      .or-card-info { grid-template-columns: 1fr; }
      .or-card-actions { justify-content: flex-start; }
      .or-action-btn { font-size: 0.68rem; padding: 6px 10px; flex: 1; justify-content: center; min-width: calc(50% - 3px); }
      .modal-content { margin: 10px; }
      .modal-body { padding: 16px; }
      .modal-actions { padding: 12px 16px; }
      .modal-actions .btn { flex: 1; justify-content: center; }
    }
    @media (max-width: 480px) {
      .or-stats { grid-template-columns: 1fr 1fr; }
      .or-action-btn { min-width: 100%; }
    }

    /* Print */
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>
  <div id="header-placeholder"></div>

  <main class="page-content">
    <div class="container">

      <div class="or-header">
        <div class="or-header-inner">
          <div class="or-header-left">
            <div class="or-header-icon"><i class="fas fa-shopping-bag"></i></div>
            <div>
              <h1>إدارة الطلبات</h1>
              <p>الطلبات · الدفع · الشحن · المرتجعات · الأقساط</p>
            </div>
          </div>
          <div class="or-header-actions">
            <button class="btn" onclick="loadOrders(true)">
              <i class="fas fa-sync-alt"></i> تحديث
            </button>
            <button class="btn" onclick="releaseExpiredManual()">
              <i class="fas fa-broom"></i> تنظيف المنتهية
            </button>
          </div>
        </div>
      </div>

      <div class="or-stats">
        <a href="#" class="or-stat" data-filter="pending" onclick="filterByStatus('pending', event)">
          <div class="or-stat-icon gold"><i class="fas fa-clock"></i></div>
          <div class="or-stat-num gold" id="statPending">0</div>
          <div class="or-stat-label">قيد الانتظار</div>
        </a>
        <a href="#" class="or-stat" data-filter="processing" onclick="filterByStatus('processing', event)">
          <div class="or-stat-icon blue"><i class="fas fa-cog"></i></div>
          <div class="or-stat-num blue" id="statProcessing">0</div>
          <div class="or-stat-label">قيد المعالجة</div>
        </a>
        <a href="#" class="or-stat" data-filter="shipped" onclick="filterByStatus('shipped', event)">
          <div class="or-stat-icon purple"><i class="fas fa-truck"></i></div>
          <div class="or-stat-num purple" id="statShipped">0</div>
          <div class="or-stat-label">تم الشحن</div>
        </a>
        <a href="#" class="or-stat" data-filter="delivered" onclick="filterByStatus('delivered', event)">
          <div class="or-stat-icon green"><i class="fas fa-check-circle"></i></div>
          <div class="or-stat-num green" id="statDelivered">0</div>
          <div class="or-stat-label">تم التسليم</div>
        </a>
        <a href="#" class="or-stat" data-filter="paid" onclick="filterByStatus('paid', event)">
          <div class="or-stat-icon teal"><i class="fas fa-money-check-alt"></i></div>
          <div class="or-stat-num teal" id="statPaid">0</div>
          <div class="or-stat-label">مدفوع</div>
        </a>
        <a href="#" class="or-stat" data-filter="cancelled" onclick="filterByStatus('cancelled', event)">
          <div class="or-stat-icon red"><i class="fas fa-times-circle"></i></div>
          <div class="or-stat-num red" id="statCancelled">0</div>
          <div class="or-stat-label">ملغي / مرتجع</div>
        </a>
      </div>

      <div class="or-tabs" id="orTabs">
        <button class="or-tab active" data-tab="" onclick="switchTab('')">
          <i class="fas fa-list"></i> الكل
          <span class="tab-count" id="tabCount-all">0</span>
        </button>
        <button class="or-tab" data-tab="pending" onclick="switchTab('pending')">
          <i class="fas fa-clock"></i> قيد الانتظار
          <span class="tab-count" id="tabCount-pending">0</span>
        </button>
        <button class="or-tab" data-tab="processing" onclick="switchTab('processing')">
          <i class="fas fa-cog"></i> قيد المعالجة
          <span class="tab-count" id="tabCount-processing">0</span>
        </button>
        <button class="or-tab" data-tab="shipped" onclick="switchTab('shipped')">
          <i class="fas fa-truck"></i> مشحون
          <span class="tab-count" id="tabCount-shipped">0</span>
        </button>
        <button class="or-tab" data-tab="delivered" onclick="switchTab('delivered')">
          <i class="fas fa-check"></i> مسلّم
          <span class="tab-count" id="tabCount-delivered">0</span>
        </button>
        <button class="or-tab" data-tab="paid" onclick="switchTab('paid')">
          <i class="fas fa-money-check"></i> مدفوع
          <span class="tab-count" id="tabCount-paid">0</span>
        </button>
        <button class="or-tab" data-tab="cancelled" onclick="switchTab('cancelled')">
          <i class="fas fa-ban"></i> ملغي/مرتجع
          <span class="tab-count" id="tabCount-cancelled">0</span>
        </button>
      </div>

      <div class="or-filters">
        <div class="or-search">
          <input type="text" id="searchInput" placeholder="بحث برقم الطلب / الاسم / الهاتف..." oninput="onSearchInput()">
          <i class="fas fa-search"></i>
        </div>
        <select id="paymentFilter" onchange="applyFilters()">
          <option value="">كل حالات الدفع</option>
          <option value="unpaid">غير مدفوع</option>
          <option value="pending">معلق</option>
          <option value="paid">مدفوع</option>
          <option value="partial">جزئي</option>
          <option value="refunded">مرتجع</option>
          <option value="awaiting_admin">بانتظار الأدمن</option>
        </select>
        <select id="branchFilter" onchange="applyFilters()">
          <option value="">كل الفروع</option>
        </select>
        <select id="storeFilter" onchange="applyFilters()">
          <option value="">كل المتاجر</option>
          <option value="retail">قطاعي</option>
          <option value="wholesale">جملة</option>
        </select>
        <select id="reservedFilter" onchange="applyFilters()">
          <option value="">الكل</option>
          <option value="yes">محجوز فقط</option>
          <option value="no">غير محجوز</option>
        </select>
        <div class="or-date-range">
          <input type="date" id="dateFrom" onchange="applyFilters()" title="من تاريخ">
          <span>→</span>
          <input type="date" id="dateTo" onchange="applyFilters()" title="إلى تاريخ">
        </div>
        <button class="btn-icon-only" onclick="resetFilters()" title="إعادة تعيين">
          <i class="fas fa-undo"></i>
        </button>
      </div>

      <div class="or-list" id="ordersList">
        <div class="or-loading"><i class="fas fa-spinner fa-spin"></i><p>جاري تحميل الطلبات...</p></div>
      </div>

    </div>
  </main>

  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>
  <div id="footer-placeholder"></div>
  <div id="sidebar-placeholder"></div>
  <div id="toast-container"></div>

  <!-- Modal Container — يُبنى ديناميكياً -->
  <div id="modalContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
  // ============================================================
  // admin/orders.html v2.0 — الجزء 1/2
  // ⚠️ استراتيجية: مفيش تكرار من main.js
  //    showToast, getCurrentUser, formatDate, formatDateTime,
  //    releaseExpiredOrders, formatPaymentMethodLabel (من main.js)
  // ============================================================

  const orState = {
    role: 'guest',
    isSuper: false,
    isAdminPlus: false,
    isAdmin: false,
    adminId: '',
    adminName: '',
    orders: [],
    filtered: [],
    branches: [],
    currentTab: '',
    currentOrderId: null,
    searchDebounce: null,
    unsubscribe: null,
    editItems: null,
    editAvailableProducts: null,
    editPickerSearch: '',
    initialized: false
  };

  const STATUS_LABELS = {
    pending: 'قيد الانتظار',
    processing: 'قيد المعالجة',
    shipped: 'تم الشحن',
    delivered: 'تم التسليم',
    cancelled: 'ملغي',
    auto_cancelled: 'ملغي تلقائي',
    returned: 'مرتجع'
  };

  const PAYMENT_STATUS_LABELS = {
    unpaid: 'غير مدفوع',
    pending: 'معلق',
    paid: 'مدفوع',
    partial: 'جزئي',
    refunded: 'مرتجع',
    awaiting_cardoona: 'بانتظار كرتونة',
    awaiting_agent: 'بانتظار مندوب',
    awaiting_admin: 'بانتظار الأدمن'
  };

  const STORE_TYPE_LABELS = {
    retail: 'قطاعي',
    wholesale: 'جملة'
  };

  // ============================================================
  // Init
  // ============================================================
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const user = getCurrentUser();
      if (!user || user.type !== 'admin') {
        window.location.href = '/gomla/admin/login.html';
        return;
      }

      orState.role = user.data?.role || 'admin';
      orState.isSuper = orState.role === 'super';
      orState.isAdminPlus = orState.role === 'admin_plus';
      orState.isAdmin = ['super', 'admin_plus', 'admin'].includes(orState.role);
      orState.adminId = user.data?.id || user.data?.uid || '';
      orState.adminName = user.data?.name || '';

      // تحميل الفروع (مرة واحدة)
      await loadBranchesCache();
      populateBranchFilter();

      // تحميل الطلبات
      loadOrders();

      // Auto-release expired orders (من main.js)
      if (typeof window.releaseExpiredOrders === 'function') {
        window.releaseExpiredOrders().catch(() => {});
      }

      // ESC handlers
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeAllModals();
        }
      });

      console.log('✅ orders.html v2.0 ready — role:', orState.role);

    } catch (err) {
      console.error('Init error:', err);
      window.showToast('خطأ في تحميل الصفحة', 'error');
    }
  });

  // ============================================================
  // Branches Cache
  // ============================================================
  async function loadBranchesCache() {
    try {
      const snap = await db.collection('branches').where('active', '==', true).get();
      orState.branches = [];
      snap.forEach(doc => orState.branches.push({ id: doc.id, ...doc.data() }));
      orState.branches.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
    } catch (err) {
      console.warn('Load branches:', err);
    }
  }

  function populateBranchFilter() {
    const sel = document.getElementById('branchFilter');
    if (!sel) return;
    sel.innerHTML = '<option value="">كل الفروع</option>' +
      orState.branches.map(b => `<option value="${b.id}">${_esc(b.name)}</option>`).join('');
  }

  function getBranchName(id) {
    if (!id) return '—';
    const b = orState.branches.find(x => x.id === id);
    return b ? b.name : id;
  }

  // ============================================================
  // Load Orders (realtime)
  // ============================================================
  function loadOrders(forceRefresh) {
    if (orState.unsubscribe && !forceRefresh) return;
    if (orState.unsubscribe) orState.unsubscribe();

    const list = document.getElementById('ordersList');
    if (list) list.innerHTML = `<div class="or-loading"><i class="fas fa-spinner fa-spin"></i><p>جاري التحميل...</p></div>`;

    orState.unsubscribe = db.collection('orders')
      .orderBy('createdAt', 'desc')
      .limit(300)
      .onSnapshot(snap => {
        orState.orders = [];
        snap.forEach(doc => orState.orders.push({ id: doc.id, ...doc.data() }));

        updateStats();
        updateTabCounts();
        applyFilters();

      }, err => {
        console.error('Load orders error:', err);
        if (list) list.innerHTML = `
          <div class="or-empty">
            <div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h3>فشل التحميل</h3>
            <p>${err.code === 'permission-denied' ? 'ليس لديك صلاحية' : 'خطأ في الاتصال: ' + err.message}</p>
          </div>`;
      });
  }

  // ============================================================
  // Stats
  // ============================================================
  function updateStats() {
    const all = orState.orders;
    const pending = all.filter(o => o.status === 'pending').length;
    const processing = all.filter(o => o.status === 'processing').length;
    const shipped = all.filter(o => o.status === 'shipped').length;
    const delivered = all.filter(o => o.status === 'delivered').length;
    const paid = all.filter(o => o.paymentStatus === 'paid').length;
    const cancelled = all.filter(o => ['cancelled', 'auto_cancelled', 'returned'].includes(o.status)).length;

    _setText('statPending', pending);
    _setText('statProcessing', processing);
    _setText('statShipped', shipped);
    _setText('statDelivered', delivered);
    _setText('statPaid', paid);
    _setText('statCancelled', cancelled);
  }

  function updateTabCounts() {
    const all = orState.orders;
    _setText('tabCount-all', all.length);
    _setText('tabCount-pending', all.filter(o => o.status === 'pending').length);
    _setText('tabCount-processing', all.filter(o => o.status === 'processing').length);
    _setText('tabCount-shipped', all.filter(o => o.status === 'shipped').length);
    _setText('tabCount-delivered', all.filter(o => o.status === 'delivered').length);
    _setText('tabCount-paid', all.filter(o => o.paymentStatus === 'paid').length);
    _setText('tabCount-cancelled', all.filter(o => ['cancelled', 'auto_cancelled', 'returned'].includes(o.status)).length);
  }

  function _setText(id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  }

  // ============================================================
  // Tabs
  // ============================================================
  function switchTab(tab) {
    orState.currentTab = tab;
    document.querySelectorAll('.or-tab').forEach(el => {
      el.classList.toggle('active', el.dataset.tab === tab);
    });
    applyFilters();
  }

  function filterByStatus(status, event) {
    if (event) event.preventDefault();
    if (status === 'paid') {
      // Paid tab — نميّزها
      orState.currentTab = 'paid';
      document.querySelectorAll('.or-tab').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === 'paid');
      });
    } else if (status === 'cancelled') {
      orState.currentTab = 'cancelled';
      document.querySelectorAll('.or-tab').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === 'cancelled');
      });
    } else {
      orState.currentTab = status;
      document.querySelectorAll('.or-tab').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === status);
      });
    }
    applyFilters();
  }

  // ============================================================
  // Filters
  // ============================================================
  function onSearchInput() {
    if (orState.searchDebounce) clearTimeout(orState.searchDebounce);
    orState.searchDebounce = setTimeout(applyFilters, 300);
  }

  function applyFilters() {
    const search = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
    const payStatus = document.getElementById('paymentFilter')?.value || '';
    const branch = document.getElementById('branchFilter')?.value || '';
    const store = document.getElementById('storeFilter')?.value || '';
    const reserved = document.getElementById('reservedFilter')?.value || '';
    const dateFrom = document.getElementById('dateFrom')?.value || '';
    const dateTo = document.getElementById('dateTo')?.value || '';

    let list = [...orState.orders];

    // Tab filter
    if (orState.currentTab === 'paid') {
      list = list.filter(o => o.paymentStatus === 'paid');
    } else if (orState.currentTab === 'cancelled') {
      list = list.filter(o => ['cancelled', 'auto_cancelled', 'returned'].includes(o.status));
    } else if (orState.currentTab) {
      list = list.filter(o => o.status === orState.currentTab);
    }

    // Search
    if (search) {
      list = list.filter(o =>
        (o.customerName || '').toLowerCase().includes(search) ||
        (o.customerPhone || '').includes(search) ||
        (o.id || '').toLowerCase().includes(search)
      );
    }

    // Other filters
    if (payStatus) list = list.filter(o => o.paymentStatus === payStatus);
    if (branch) list = list.filter(o => o.branchId === branch);
    if (store) list = list.filter(o => o.storeType === store);

    if (reserved === 'yes') list = list.filter(o => o.reserved === true && !o.released);
    else if (reserved === 'no') list = list.filter(o => !o.reserved || o.released);

    if (dateFrom) {
      const fromTs = new Date(dateFrom).setHours(0, 0, 0, 0);
      list = list.filter(o => {
        const ts = _ts(o.createdAt);
        return ts >= fromTs;
      });
    }
    if (dateTo) {
      const toTs = new Date(dateTo).setHours(23, 59, 59, 999);
      list = list.filter(o => {
        const ts = _ts(o.createdAt);
        return ts <= toTs;
      });
    }

    orState.filtered = list;
    renderOrders();
  }

  function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('paymentFilter').value = '';
    document.getElementById('branchFilter').value = '';
    document.getElementById('storeFilter').value = '';
    document.getElementById('reservedFilter').value = '';
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    orState.currentTab = '';
    document.querySelectorAll('.or-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === ''));
    applyFilters();
  }

  function _ts(t) {
    if (!t) return 0;
    if (t.toMillis) return t.toMillis();
    if (t.toDate) return t.toDate().getTime();
    if (t instanceof Date) return t.getTime();
    return 0;
  }

  // ============================================================
  // Render
  // ============================================================
  function renderOrders() {
    const list = document.getElementById('ordersList');
    if (!list) return;

    if (orState.filtered.length === 0) {
      list.innerHTML = `
        <div class="or-empty">
          <div class="empty-icon"><i class="fas fa-shopping-bag"></i></div>
          <h3>لا توجد طلبات</h3>
          <p>${orState.orders.length === 0 ? 'لم يتم استقبال طلبات بعد' : 'لا توجد نتائج مطابقة'}</p>
        </div>`;
      return;
    }

    list.innerHTML = orState.filtered.map(o => renderOrderCard(o)).join('');
  }

  function renderOrderCard(o) {
    const orderNum = o.id.slice(-8).toUpperCase();
    const status = o.status || 'pending';
    const payStatus = o.paymentStatus || 'unpaid';
    const dateStr = o.createdAt ? formatDate(o.createdAt) : '—';
    const total = (o.total || 0).toFixed(0);
    const itemsCount = (o.items || []).length;
    const totalQty = (o.items || []).reduce((s, i) => s + (i.quantity || 0), 0);
    const isReserved = o.reserved === true && !o.released;

    const statusIcon = {
      pending: 'clock', processing: 'cog', shipped: 'truck',
      delivered: 'check-circle', cancelled: 'times-circle',
      auto_cancelled: 'ban', returned: 'undo'
    }[status] || 'circle';

    const payMethodLabel = (typeof formatPaymentMethodLabel === 'function')
      ? formatPaymentMethodLabel(o.paymentMethod)
      : (o.paymentMethod || '—');

    return `
      <div class="or-card status-${status}" onclick="openOrderDetails('${o.id}')">
        <div class="or-card-head">
          <div class="or-card-title">
            <span class="or-num">#${orderNum}</span>
            <span>${_esc(o.customerName || 'عميل')}</span>
          </div>
          <div class="or-badges">
            <span class="or-badge status-${status}">
              <i class="fas fa-${statusIcon}"></i>
              ${STATUS_LABELS[status] || status}
            </span>
            <span class="or-badge payment-${payStatus}">
              <i class="fas fa-money-bill"></i>
              ${PAYMENT_STATUS_LABELS[payStatus] || payStatus}
            </span>
            ${isReserved ? `<span class="or-badge reserved"><i class="fas fa-lock"></i> محجوز</span>` : ''}
            ${o.installmentPlanId ? `<span class="or-badge" style="background:rgba(139,92,246,.15);color:#6d28d9;"><i class="fas fa-calendar-check"></i> أقساط</span>` : ''}
          </div>
        </div>

        <div class="or-card-info">
          <div class="or-info-item">
            <i class="fas fa-phone"></i>
            <span class="val">${_esc(o.customerPhone || '—')}</span>
          </div>
          <div class="or-info-item">
            <i class="fas fa-building"></i>
            <span class="val">${_esc(getBranchName(o.branchId))}</span>
          </div>
          <div class="or-info-item">
            <i class="fas fa-calendar"></i>
            <span class="val">${dateStr}</span>
          </div>
          <div class="or-info-item">
            <i class="fas fa-boxes"></i>
            <span class="val">${itemsCount} منتج (${totalQty} قطعة)</span>
          </div>
          <div class="or-info-item">
            <i class="fas fa-store"></i>
            <span class="val">${STORE_TYPE_LABELS[o.storeType] || o.storeType || '—'}</span>
          </div>
        </div>

        <div class="or-card-actions" onclick="event.stopPropagation()">
          ${renderCardActions(o)}
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--gray-100);">
          <span style="font-size:0.72rem;color:var(--gray-500);">
            <i class="fas fa-credit-card" style="color:var(--gold);"></i> ${payMethodLabel}
          </span>
          <span style="font-size:1.05rem;font-weight:900;color:var(--gold-dark);">
            ${total} ج.م
          </span>
        </div>
      </div>
    `;
  }

  function renderCardActions(o) {
    const status = o.status || 'pending';
    const payStatus = o.paymentStatus || 'unpaid';
    const isReserved = o.reserved === true && !o.released;
    const canConfirmPay = orState.isSuper || orState.isAdminPlus;
    const canCancel = ['pending', 'processing', 'shipped'].includes(status) && payStatus !== 'paid';
    const canReturn = ['delivered', 'shipped'].includes(status) && payStatus === 'paid';

    let html = '';

    html += `<button class="or-action-btn view" onclick="openOrderDetails('${o.id}')">
      <i class="fas fa-eye"></i> تفاصيل
    </button>`;
    if (['pending', 'processing'].includes(status) && payStatus !== 'paid' && payStatus !== 'refunded') {
      html += `<button class="or-action-btn" onclick="openEditOrder('${o.id}')" style="border-color:#93c5fd;color:#1e40af;">
        <i class="fas fa-edit"></i> تعديل
      </button>`;
    }
    if (status === 'pending') {
      html += `<button class="or-action-btn process" onclick="startProcessing('${o.id}')">
        <i class="fas fa-play"></i> بدء المعالجة
      </button>`;
    }

    if (status === 'processing' && isReserved) {
      html += `<button class="or-action-btn assign" onclick="openAssignDelivery('${o.id}')">
        <i class="fas fa-user-tie"></i> تعيين مندوب
      </button>`;
      html += `<button class="or-action-btn shipped" onclick="markShipped('${o.id}')">
        <i class="fas fa-truck"></i> تم الشحن
      </button>`;
    }

    if (status === 'shipped') {
      html += `<button class="or-action-btn delivered" onclick="markDelivered('${o.id}')">
        <i class="fas fa-check"></i> تم التسليم
      </button>`;
    }

    if (['processing', 'shipped', 'delivered'].includes(status) && payStatus !== 'paid' && payStatus !== 'refunded' && canConfirmPay) {
      html += `<button class="or-action-btn confirm" onclick="confirmPayment('${o.id}')">
        <i class="fas fa-money-check-alt"></i> تأكيد الدفع
      </button>`;
    }

    if (o.storeType === 'wholesale' && status === 'delivered' && payStatus !== 'paid' && !o.installmentPlanId && canConfirmPay) {
      html += `<button class="or-action-btn install" onclick="openInstallmentPlan('${o.id}')">
        <i class="fas fa-calendar-check"></i> إنشاء أقساط
      </button>`;
    }

    if (canCancel) {
      html += `<button class="or-action-btn cancel" onclick="cancelOrder('${o.id}')">
        <i class="fas fa-times"></i> إلغاء
      </button>`;
    }

    if (canReturn) {
      html += `<button class="or-action-btn return" onclick="openReturnModal('${o.id}')">
        <i class="fas fa-undo"></i> مرتجع
      </button>`;
    }

    return html;
  }

  // ============================================================
  // Helpers
  // ============================================================
  function closeAllModals() {
    document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
    document.body.style.overflow = '';
  }

  function closeModal(id) {
    document.getElementById(id)?.classList.remove('show');
    document.body.style.overflow = '';
  }

  function _esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  async function releaseExpiredManual() {

  function renderOrderModalActions(o) {
    const status = o.status || 'pending';
    const payStatus = o.paymentStatus || 'unpaid';
    const isReserved = o.reserved === true && !o.released;
    const canConfirmPay = orState.isSuper || orState.isAdminPlus;
    const canCancel = ['pending', 'processing', 'shipped'].includes(status) && payStatus !== 'paid';
    const canReturn = ['delivered', 'shipped'].includes(status) && payStatus === 'paid' && (o.refundedAmount || 0) < (o.total || 0);

    let html = `<button class="btn btn-outline" onclick="closeModal('orderModal')">إغلاق</button>`;
     
    if (['pending', 'processing'].includes(status) && payStatus !== 'paid' && payStatus !== 'refunded') {
      html += `<button class="btn btn-outline" onclick="openEditOrder('${o.id}')">
        <i class="fas fa-edit"></i> تعديل
      </button>`;
    }
     
    if (status === 'pending') {
      html += `<button class="btn btn-gold" onclick="startProcessing('${o.id}')">
        <i class="fas fa-play"></i> بدء المعالجة
      </button>`;
    }

    if (status === 'processing' && isReserved) {
      html += `<button class="btn btn-purple" onclick="openAssignDelivery('${o.id}')">
        <i class="fas fa-user-tie"></i> تعيين مندوب
      </button>`;
      html += `<button class="btn btn-purple" onclick="markShipped('${o.id}')">
        <i class="fas fa-truck"></i> تم الشحن
      </button>`;
    }

    if (status === 'shipped') {
      html += `<button class="btn btn-success" onclick="markDelivered('${o.id}')">
        <i class="fas fa-check"></i> تم التسليم
      </button>`;
    }

    if (['processing', 'shipped', 'delivered'].includes(status) && payStatus !== 'paid' && payStatus !== 'refunded' && canConfirmPay) {
      html += `<button class="btn btn-success" onclick="confirmPayment('${o.id}')">
        <i class="fas fa-money-check-alt"></i> تأكيد الدفع
      </button>`;
    }

    if (o.storeType === 'wholesale' && status === 'delivered' && payStatus !== 'paid' && !o.installmentPlanId && canConfirmPay) {
      html += `<button class="btn btn-gold" onclick="openInstallmentPlan('${o.id}')">
        <i class="fas fa-calendar-check"></i> إنشاء أقساط
      </button>`;
    }

    if (canCancel) {
      html += `<button class="btn btn-danger" onclick="cancelOrder('${o.id}')">
        <i class="fas fa-times"></i> إلغاء
      </button>`;
    }

    if (canReturn) {
      html += `<button class="btn btn-orange" onclick="openReturnModal('${o.id}')">
        <i class="fas fa-undo"></i> مرتجع
      </button>`;
    }

    html += `<button class="btn btn-outline" onclick="openWhatsApp('${o.id}')">
      <i class="fab fa-whatsapp" style="color:#16a34a;"></i> واتساب
    </button>`;

    if (o.invoiceGenerated) {
      html += `<button class="btn btn-outline" onclick="printInvoice('${o.id}')">
        <i class="fas fa-print"></i> طباعة
      </button>`;
    }

    return html;
  }

  // ============================================================
  // 2️⃣ بدء المعالجة
  // ============================================================
  async function startProcessing(orderId) {
    if (!orState.isAdmin) { window.showToast('غير مصرح', 'warning'); return; }
    if (!confirm('بدء معالجة الطلب؟ سيتم إضافة قيمته كمديونية على العميل (إن وُجد).')) return;

    try {
      const orderRef = db.collection('orders').doc(orderId);

      await db.runTransaction(async (t) => {
        const orderDoc = await t.get(orderRef);
        if (!orderDoc.exists) throw new Error('الطلب غير موجود');
        const order = orderDoc.data();

        if (order.status !== 'pending') {
          throw new Error('يمكن بدء معالجة الطلبات "قيد الانتظار" فقط');
        }

        const now = firebase.firestore.FieldValue.serverTimestamp();

        // 1. إضافة المديونية (لو عميل مسجل)
        if (order.customerId && !order.balanceApplied) {
          const custRef = db.collection('customers').doc(order.customerId);
          const custDoc = await t.get(custRef);
          if (custDoc.exists) {
            t.update(custRef, {
              balance: firebase.firestore.FieldValue.increment(order.total || 0),
              lastOrderAt: now
            });
          }
        }

        // 2. تحديث الطلب
        t.update(orderRef, {
          status: 'processing',
          balanceApplied: true,
          balanceAppliedAt: now,
          processedAt: now,
          processedBy: orState.adminId,
          processedByName: orState.adminName,
          updatedAt: now
        });

        // 3. إشعار العميل
        if (order.customerId) {
          t.set(db.collection('customer_notifications').doc(), {
            userId: order.customerId,
            title: 'طلبك قيد التحضير',
            body: `إجمالي طلبك ${order.total} ج.م — مديونية مؤقتة`,
            type: 'order_processing',
            orderId,
            read: false,
            createdAt: now
          });
        }
      });

      window.showToast('✅ بدء المعالجة', 'success');
      closeModal('orderModal');

    } catch (err) {
      console.error('startProcessing error:', err);
      window.showToast('❌ ' + err.message, 'error');
    }
  }

        .get();
      snap.forEach(doc => agents.push({ id: doc.id, ...doc.data() }));
    } catch (err) {

    }

    const agentsOptions = agents.length > 0
      ? agents.map(a => `<option value="${a.id}">${_esc(a.name || a.phone || a.id)} — ${_esc(a.region || '—')}</option>`).join('')
      : '<option value="">لا يوجد مندوبون نشطون</option>';

    const html = `

          <div class="modal-header">

          <div class="modal-body">

            <div style="margin-bottom:12px;">
              <label style="display:block;font-weight:800;font-size:0.85rem;margin-bottom:6px;">
                اختر المندوب <span style="color:var(--danger);">*</span>
              </label>
              <select id="assignAgentSelect" style="width:100%;padding:10px 12px;border:2px solid var(--gray-200);border-radius:8px;font-family:inherit;font-size:0.9rem;outline:none;">
                <option value="">— اختر —</option>
                ${agentsOptions}
              </select>
            </div>

            <div style="margin-bottom:12px;">
              <label style="display:block;font-weight:800;font-size:0.85rem;margin-bottom:6px;">
                ملاحظات للمندوب (اختياري)
              </label>
              <textarea id="assignNotes" maxlength="300" placeholder="مثال: الطلب عاجل / اتصل قبل التوصيل..."
                style="width:100%;padding:10px 12px;border:2px solid var(--gray-200);border-radius:8px;font-family:inherit;font-size:0.9rem;outline:none;min-height:60px;resize:vertical;"></textarea>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal('assignModal')">إلغاء</button>
            <button class="btn btn-purple" id="assignBtn" onclick="confirmAssignDelivery('${orderId}')" ${agents.length === 0 ? 'disabled' : ''}>
              <i class="fas fa-check"></i> تعيين
            </button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('modalContainer').innerHTML = html;
    document.body.style.overflow = 'hidden';
  }

  async function confirmAssignDelivery(orderId) {
    const agentId = document.getElementById('assignAgentSelect').value;
    const notes = document.getElementById('assignNotes').value.trim();

    if (!agentId) {
      window.showToast('اختر مندوب', 'warning');
      return;
    }

    const btn = document.getElementById('assignBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>...';

    try {
      const agentDoc = await db.collection('delivery_agents').doc(agentId).get();
      if (!agentDoc.exists) throw new Error('المندوب غير موجود');
      const agent = agentDoc.data();

      const now = firebase.firestore.FieldValue.serverTimestamp();

      await db.collection('orders').doc(orderId).update({
        deliveryAgentId: agentId,
        deliveryAgentName: agent.name || '',
        deliveryAgentPhone: agent.phone || '',
        assignedAt: now,
        assignedBy: orState.adminId,
        assignedByName: orState.adminName,
        deliveryNotes: notes || '',
        updatedAt: now
      });

      // إشعار للمندوب
      try {
        await db.collection('notifications').add({
          userId: agentId,
          userType: 'delivery',
          title: 'طلب جديد معيّن لك',
          body: `#${orderId.slice(-8).toUpperCase()} — ${notes || 'اتصل بالعميل'}`,
          type: 'order_assigned',
          orderId,
          read: false,
          createdAt: now
        });
      } catch (e) { console.warn('Notification failed:', e); }

      window.showToast('✅ تم تعيين المندوب', 'success');
      closeModal('assignModal');
      closeModal('orderModal');

    } catch (err) {
      console.error('Assign delivery error:', err);
      window.showToast('❌ ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check"></i> تعيين';
    }
  }

  // ============================================================
  // 4️⃣ تم الشحن (بدون commit مخزون)
  // ============================================================
  async function markShipped(orderId) {
    if (!orState.isAdmin) { window.showToast('غير مصرح', 'warning'); return; }
    if (!confirm('تحويل الطلب إلى "تم الشحن"؟')) return;

    try {
      const orderRef = db.collection('orders').doc(orderId);

      await db.runTransaction(async (t) => {
        const orderDoc = await t.get(orderRef);
        if (!orderDoc.exists) throw new Error('الطلب غير موجود');
        const order = orderDoc.data();

        if (order.status !== 'processing') {
          throw new Error('يمكن الشحن من "قيد المعالجة" فقط');
        }

        const now = firebase.firestore.FieldValue.serverTimestamp();

        t.update(orderRef, {
          status: 'shipped',
          shippedAt: now,
          shippedBy: orState.adminId,
          shippedByName: orState.adminName,
          updatedAt: now
        });

        if (order.customerId) {

  // ============================================================
  // 5️⃣ تم التسليم (commit المخزون — بدون تأكيد دفع)
  // ============================================================
  async function markDelivered(orderId) {
    if (!orState.isAdmin) { window.showToast('غير مصرح', 'warning'); return; }
    if (!confirm('تأكيد التسليم؟ سيتم:\n- خصم المخزون نهائياً\n- إطلاق الحجز\n\nملاحظة: الدفع لسه ما اتأكدش.')) return;

    try {
      const orderRef = db.collection('orders').doc(orderId);

      await db.runTransaction(async (t) => {
        const orderDoc = await t.get(orderRef);
        if (!orderDoc.exists) throw new Error('الطلب غير موجود');
        const order = orderDoc.data();

        if (order.status !== 'shipped') {
          throw new Error('يمكن التسليم من "تم الشحن" فقط');
        }
        if (order.stockCommitted) {
          throw new Error('المخزون تم خصمه بالفعل');
        }

        const items = order.items || [];
        if (items.length === 0) throw new Error('الطلب بدون منتجات');

        const isWholesale = order.storeType === 'wholesale';
        const branchId = order.branchId || 'RGB';
        const now = firebase.firestore.FieldValue.serverTimestamp();

        // ===== قراءة + خصم =====
        for (const item of items) {
          const qty = item.quantity || 0;
          if (qty <= 0) continue;

          if (isWholesale) {
            const pRef = db.collection('products').doc(item.productId);
            const pDoc = await t.get(pRef);
            if (!pDoc.exists) throw new Error(`منتج ${item.productName} غير موجود`);
            const p = pDoc.data();
            const ppu = p.piecesPerUnit || 1;
            const totalPieces = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
            if (totalPieces < qty) throw new Error(`مخزون غير كافٍ: ${item.productName}`);
            const newTotal = totalPieces - qty;
            t.update(pRef, {
              warehouseStock: Math.floor(newTotal / ppu),
              warehousePieces: newTotal % ppu,
              reservedPieces: Math.max(0, (p.reservedPieces || 0) - qty),
              updatedAt: now
            });
          } else {
            const invRef = db.collection('branch_inventory').doc(`${branchId}_${item.productId}`);
            const invDoc = await t.get(invRef);
            if (!invDoc.exists) throw new Error(`مخزون ${item.productName} غير موجود`);
            const inv = invDoc.data();
            const pieces = inv.piecesQty || 0;
            if (pieces < qty) throw new Error(`مخزون فرع غير كافٍ: ${item.productName}`);
            t.update(invRef, {
              piecesQty: pieces - qty,
              reservedQty: Math.max(0, (inv.reservedQty || 0) - qty),
              lastUpdated: now,
              updatedBy: orState.adminId
            });
          }
        }

        t.update(orderRef, {
          status: 'delivered',
          deliveredAt: now,
          deliveredBy: orState.adminId,
          deliveredByName: orState.adminName,
          reserved: false,
          stockCommitted: true,
          stockCommittedAt: now,
          updatedAt: now
        });

        if (order.customerId) {
          t.set(db.collection('customer_notifications').doc(), {
            userId: order.customerId,
            title: '✅ تم تسليم طلبك',
            body: 'نأمل أن تكون راضياً — شكراً لتعاملك معنا',
            type: 'order_delivered',
            orderId,
            read: false,
            createdAt: now
          });
        }
      });

      window.showToast('✅ تم تأكيد التسليم وخصم المخزون', 'success');
      closeModal('orderModal');

    } catch (err) {
      console.error('markDelivered error:', err);
      window.showToast('❌ ' + err.message, 'error');
    }
  }

  // ============================================================
  // 6️⃣ تأكيد الدفع (invoice + cashbox + balance -=)
  //    يدعم: (processing → paid) أو (delivered → paid)
  // ============================================================
  async function confirmPayment(orderId) {
    if (!orState.isSuper && !orState.isAdminPlus) {
      window.showToast('صلاحية super أو admin_plus فقط', 'warning');
      return;
    }

    const order = orState.orders.find(o => o.id === orderId);
    if (!order) return;

    const willCommitStock = !order.stockCommitted && !order.installmentPlanId;

    const msg = willCommitStock
      ? 'تأكيد الدفع؟ سيتم:\n- خصم المخزون نهائياً\n- إطلاق الحجز\n- إنشاء فاتورة\n- إضافة الصندوق\n- خصم المديونية\n- تحويل الحالة لـ "تم التسليم"'
      : 'تأكيد الدفع؟ سيتم:\n- إنشاء فاتورة\n- إضافة الصندوق\n- خصم المديونية';

    if (!confirm(msg)) return;

    try {
      const orderRef = db.collection('orders').doc(orderId);
      let invoiceRef = null;

      await db.runTransaction(async (t) => {
        const orderDoc = await t.get(orderRef);
        if (!orderDoc.exists) throw new Error('الطلب غير موجود');
        const order = orderDoc.data();

        if (order.paymentStatus === 'paid') throw new Error('الطلب مدفوع بالفعل');
        if (order.invoiceGenerated) throw new Error('الفاتورة موجودة بالفعل');
        if (order.installmentPlanId) throw new Error('الطلب مرتبط بخطة أقساط — استخدم صفحة الأقساط');

        const items = order.items || [];
        if (items.length === 0) throw new Error('الطلب بدون منتجات');

        const isWholesale = order.storeType === 'wholesale';
        const branchId = order.branchId || 'RGB';
        const now = firebase.firestore.FieldValue.serverTimestamp();
        const needsStockCommit = !order.stockCommitted;

        // ===== 1. خصم المخزون (لو لسه ما اتعملش) =====
        if (needsStockCommit) {
          for (const item of items) {
            const qty = item.quantity || 0;
            if (qty <= 0) continue;

            if (isWholesale) {
              const pRef = db.collection('products').doc(item.productId);
              const pDoc = await t.get(pRef);
              if (!pDoc.exists) throw new Error(`منتج ${item.productName} غير موجود`);
              const p = pDoc.data();
              const ppu = p.piecesPerUnit || 1;
              const totalPieces = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0);
              if (totalPieces < qty) throw new Error(`مخزون غير كافٍ: ${item.productName}`);
              const newTotal = totalPieces - qty;
              t.update(pRef, {
                warehouseStock: Math.floor(newTotal / ppu),
                warehousePieces: newTotal % ppu,
                reservedPieces: Math.max(0, (p.reservedPieces || 0) - qty),
                updatedAt: now
              });
            } else {
              const invRef = db.collection('branch_inventory').doc(`${branchId}_${item.productId}`);
              const invDoc = await t.get(invRef);
              if (!invDoc.exists) throw new Error(`مخزون ${item.productName} غير موجود`);
              const inv = invDoc.data();
              const pieces = inv.piecesQty || 0;
              if (pieces < qty) throw new Error(`مخزون فرع غير كافٍ: ${item.productName}`);
              t.update(invRef, {
                piecesQty: pieces - qty,
                reservedQty: Math.max(0, (inv.reservedQty || 0) - qty),
                lastUpdated: now,
                updatedBy: orState.adminId
              });
            }
          }
        }

        // ===== 2. خصم المديونية =====
        if (order.customerId && order.balanceApplied) {
          const custRef = db.collection('customers').doc(order.customerId);
          t.update(custRef, {
            balance: firebase.firestore.FieldValue.increment(-(order.total || 0))
          });
        }

        // ===== 3. إنشاء فاتورة =====
        invoiceRef = db.collection('invoices').doc();
        t.set(invoiceRef, {
          id: invoiceRef.id,
          orderId,
          orderNumber: orderId.slice(-8).toUpperCase(),
          customerId: order.customerId || null,
          customerName: order.customerName || '',
          customerPhone: order.customerPhone || '',
          customerAddress: order.deliveryAddress || order.customerAddress || '',
          branchId,
          storeType: order.storeType,
          items: order.items || [],
          subtotal: order.subtotal || 0,
          shippingCost: order.shippingCost || 0,
          discount: 0,
          total: order.total || 0,
          paidAmount: order.total || 0,
          remainingAmount: 0,
          paymentMethod: order.paymentMethod || 'cash',
          paymentStatus: 'paid',
          source: order.source || 'website',
          notes: order.notes || '',
          createdAt: now,
          createdBy: orState.adminId,
          createdByName: orState.adminName
        });

        // ===== 4. إضافة للصندوق =====
        const cashboxRef = db.collection('cashbox').doc();
        t.set(cashboxRef, {
          id: cashboxRef.id,
          type: 'income',
          category: 'order_payment',
          source: order.source || 'website',
          branchId,
          relatedId: orderId,
          relatedType: 'order',
          amount: order.total || 0,
          method: order.paymentMethod === 'credit' ? 'cash' : (order.paymentMethod || 'cash'),
          description: `دفع طلب #${orderId.slice(-8).toUpperCase()}`,
          attachments: order.paymentProof ? [order.paymentProof] : [],
          dailyCloseId: '',
          isOpening: false,
          refundOf: '',
          isRefund: false,
          status: 'approved',
          createdBy: orState.adminId,
          createdByName: orState.adminName,
          createdByRole: orState.role,
          approvedBy: orState.adminId,
          approvedByName: orState.adminName,
          approvedAt: now,
          createdAt: now,
          rejectionReason: ''
        });

        // ===== 5. تحديث الطلب =====
        t.update(orderRef, {
          status: needsStockCommit ? 'delivered' : (order.status || 'delivered'),
          paymentStatus: 'paid',
          paid: order.total || 0,
          paidAmount: order.total || 0,
          remaining: 0,
          invoiceGenerated: true,
          invoiceId: invoiceRef.id,
          reserved: false,
          stockCommitted: true,
          stockCommittedAt: now,
          confirmedByAdmin: true,
          confirmedAt: now,
          confirmedBy: orState.adminId,
          confirmedByName: orState.adminName,
          deliveredAt: order.deliveredAt || now,
          cashboxEntryId: cashboxRef.id,
          updatedAt: now
        });

        // ===== 6. إشعار العميل =====
        if (order.customerId) {
          t.set(db.collection('customer_notifications').doc(), {
            userId: order.customerId,
            title: '✅ تم تأكيد الدفع',
            body: `تم استلام مبلغ ${order.total} ج.م — شكراً لك`,
            type: 'payment_confirmed',
            orderId,
            invoiceId: invoiceRef.id,
            read: false,
            createdAt: now
          });
        }
      });

      window.showToast('✅ تم تأكيد الدفع وإنشاء الفاتورة', 'success');
      closeModal('orderModal');

    } catch (err) {
      console.error('confirmPayment error:', err);
      window.showToast('❌ ' + err.message, 'error');
    }
  }

  // ============================================================
  // 7️⃣ إلغاء الطلب
  // ============================================================
  async function cancelOrder(orderId) {
    if (!orState.isAdmin) { window.showToast('غير مصرح', 'warning'); return; }

    const reason = prompt('سبب إلغاء الطلب:', '');
    if (reason === null) return;

    if (!confirm('إلغاء الطلب؟ سيتم إرجاع الكميات المحجوزة وخصم المديونية.')) return;

    try {
      const orderRef = db.collection('orders').doc(orderId);

      await db.runTransaction(async (t) => {
        const orderDoc = await t.get(orderRef);
        if (!orderDoc.exists) throw new Error('الطلب غير موجود');
        const order = orderDoc.data();

        if (['delivered', 'cancelled', 'auto_cancelled', 'returned'].includes(order.status)) {
          throw new Error('لا يمكن إلغاء طلب بهذه الحالة');
        }
        if (order.paymentStatus === 'paid') {
          throw new Error('لا يمكن إلغاء طلب مدفوع — استخدم مرتجع');
        }

        const items = order.items || [];
        const isWholesale = order.storeType === 'wholesale';
        const branchId = order.branchId || 'RGB';
        const now = firebase.firestore.FieldValue.serverTimestamp();

        // ===== Release الحجز =====
        if (order.reserved && !order.released && !order.stockCommitted) {
          for (const item of items) {
            const qty = item.quantity || 0;
            if (qty <= 0) continue;

            if (isWholesale) {
              const pRef = db.collection('products').doc(item.productId);
              t.update(pRef, {
                reservedPieces: firebase.firestore.FieldValue.increment(-qty)
              });
            } else {
              const invRef = db.collection('branch_inventory').doc(`${branchId}_${item.productId}`);
              t.update(invRef, {
                reservedQty: firebase.firestore.FieldValue.increment(-qty),
                availableQty: firebase.firestore.FieldValue.increment(qty)
              });
            }
          }
        }

        // ===== إزالة المديونية =====
        if (order.customerId && order.balanceApplied && !order.invoiceGenerated) {
          const custRef = db.collection('customers').doc(order.customerId);
          t.update(custRef, {
            balance: firebase.firestore.FieldValue.increment(-(order.total || 0))
          });
        }

        // ===== تحديث الطلب =====
        t.update(orderRef, {
          status: 'cancelled',
          released: true,
          releasedAt: now,
          releaseReason: reason || 'cancelled_by_admin',
          cancelledBy: orState.adminId,
          cancelledByName: orState.adminName,
          cancelledAt: now,
          updatedAt: now
        });

        // ===== إشعار العميل =====
        if (order.customerId) {
          t.set(db.collection('customer_notifications').doc(), {
            userId: order.customerId,
            title: 'تم إلغاء طلبك',
            body: reason ? `السبب: ${reason}` : 'تم إلغاء الطلب من قبل الإدارة',
            type: 'order_cancelled',
            orderId,
            read: false,
            createdAt: now
          });
        }
      });

      window.showToast('✅ تم إلغاء الطلب', 'success');
      closeModal('orderModal');

    } catch (err) {
      console.error('cancelOrder error:', err);
      window.showToast('❌ ' + err.message, 'error');
    }
  }

  function updateReturnPreview() {
    const order = orState.orders.find(o => o.id === orState.currentOrderId);

  async function confirmReturn(orderId) {
    const order = orState.orders.find(o => o.id === orderId);
    if (!order) return;

    const reason = document.getElementById('returnReason').value;
    const refundMethod = document.getElementById('refundMethod').value;
    const notes = document.getElementById('returnNotes').value.trim();

        productName: item.productName,
        imageUrl: item.imageUrl,
        quantity: qty,
        unit: item.unit,
        price: item.price,

      });

    try {
      const orderRef = db.collection('orders').doc(orderId);
      const isWholesale = order.storeType === 'wholesale';
      const branchId = order.branchId || 'RGB';
      const now = firebase.firestore.FieldValue.serverTimestamp();

      await db.runTransaction(async (t) => {
        const orderDoc = await t.get(orderRef);
        if (!orderDoc.exists) throw new Error('الطلب غير موجود');
        const o = orderDoc.data();

        // ===== 1. إرجاع المخزون =====
        for (const ri of returnItems) {
          if (isWholesale) {
            const pRef = db.collection('products').doc(ri.productId);
            const pDoc = await t.get(pRef);
            if (!pDoc.exists) continue;
            const p = pDoc.data();
            const ppu = p.piecesPerUnit || 1;
            const totalPieces = (p.warehouseStock || 0) * ppu + (p.warehousePieces || 0) + ri.quantity;
            t.update(pRef, {
              warehouseStock: Math.floor(totalPieces / ppu),
              warehousePieces: totalPieces % ppu,
              updatedAt: now
            });
          } else {
            const invRef = db.collection('branch_inventory').doc(`${branchId}_${ri.productId}`);
            const invDoc = await t.get(invRef);
            if (invDoc.exists) {
              t.update(invRef, {
                piecesQty: firebase.firestore.FieldValue.increment(ri.quantity),
                availableQty: firebase.firestore.FieldValue.increment(ri.quantity),
                lastUpdated: now
              });
            }
          }
        }

        // ===== 2. إنشاء سجل المرتجع =====
        const returnRef = db.collection('returns').doc();
        t.set(returnRef, {
          id: returnRef.id,
          returnType: 'customer',
          customerId: o.customerId || null,
          customerName: o.customerName || '',
          orderId,
          invoiceId: o.invoiceId || null,
          branchId,
          items: returnItems,
          totalAmount: refundTotal,
          reason: reason,
          reasonText: notes,
          inventoryAction: 'restock',
          refundMethod: refundMethod,
          refundAmount: refundTotal,
          status: 'approved',
          createdBy: orState.adminId,
          createdByName: orState.adminName,
          createdByRole: orState.role,
          createdAt: now,
          approvedBy: orState.adminId,
          approvedAt: now
        });

        // ===== 3. cashbox expense (لو كاش/instapay/wallet) =====
        if (['cash', 'instapay', 'wallet'].includes(refundMethod)) {
          const cbRef = db.collection('cashbox').doc();
          t.set(cbRef, {
            id: cbRef.id,
            type: 'expense',
            category: 'customer_refund',
            source: 'manual',
            branchId,
            relatedId: returnRef.id,
            relatedType: 'return',
            amount: refundTotal,
            method: refundMethod,
            description: `مرتجع طلب #${orderId.slice(-8).toUpperCase()}`,
            attachments: [],
            dailyCloseId: '',
            isOpening: false,
            refundOf: '',
            isRefund: true,
            status: 'approved',
            createdBy: orState.adminId,
            createdByName: orState.adminName,
            createdByRole: orState.role,
            approvedBy: orState.adminId,
            approvedByName: orState.adminName,
            approvedAt: now,
            createdAt: now,
            rejectionReason: ''
          });
          t.update(returnRef, { cashboxEntryId: cbRef.id });
        }

        // ===== 4. credit_note → خصم من رصيد العميل =====
        if (refundMethod === 'credit_note' && o.customerId) {
          const custRef = db.collection('customers').doc(o.customerId);
          t.update(custRef, {
            balance: firebase.firestore.FieldValue.increment(-refundTotal)
          });
        }

        // ===== 5. تحديث الطلب =====
        const newRefunded = (o.refundedAmount || 0) + refundTotal;
        const isFullyReturned = newRefunded >= (o.total || 0);

        t.update(orderRef, {
          refundedAmount: newRefunded,
          paymentStatus: isFullyReturned ? 'refunded' : 'partial',
          status: isFullyReturned ? 'returned' : o.status,
          returnIds: firebase.firestore.FieldValue.arrayUnion(returnRef.id),
          returnedAt: isFullyReturned ? now : (o.returnedAt || null),
          updatedAt: now
        });

        // ===== 6. إشعار العميل =====
        if (o.customerId) {
          t.set(db.collection('customer_notifications').doc(), {
            userId: o.customerId,
            title: 'تم استلام مرتجعك',
            body: `تم استرداد ${refundTotal.toFixed(2)} ج.م — ${refundMethod}`,
            type: 'return_confirmed',
            orderId,
            returnId: returnRef.id,
            read: false,
            createdAt: now
          });
        }
      });

      window.showToast('✅ تم تسجيل المرتجع', 'success');
      closeModal('returnModal');
      closeModal('orderModal');

    } catch (err) {
      console.error('confirmReturn error:', err);
      window.showToast('❌ ' + err.message, 'error');
    }
  }

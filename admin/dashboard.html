<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - أولاد شعلان</title>
  <meta name="description" content="لوحة تحكم إدارة أولاد شعلان">
  <meta name="theme-color" content="#1a2a4a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    html, body { overflow-x: hidden !important; max-width: 100vw; }

    /* ===== Welcome Header ===== */
    .db-welcome {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 18px;
      color: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(26,42,74,.25);
      border-bottom: 4px solid var(--gold);
    }
    .db-welcome::before {
      content: '';
      position: absolute;
      top: -50%; right: -15%;
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(201,168,76,.18) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(30px,-30px) scale(1.15); }
    }
    .db-welcome-inner {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
    }
    .db-welcome-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 220px; }
    .db-avatar {
      width: 60px; height: 60px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; flex-shrink: 0;
      border: 3px solid var(--white);
      box-shadow: 0 8px 24px rgba(201,168,76,.4);
    }
    .db-greeting h1 { font-size: 1.3rem; font-weight: 900; margin: 0 0 3px; }
    .db-greeting h1 .gold { color: var(--gold); }
    .db-greeting p { font-size: 0.83rem; opacity: 0.9; margin: 0; }
    .db-welcome-right { display: flex; gap: 8px; flex-wrap: wrap; }
    .db-welcome-right .btn {
      background: rgba(255,255,255,.15); color: var(--white);
      border: 1px solid rgba(255,255,255,.3);
      padding: 8px 14px; border-radius: var(--radius-sm);
      font-family: inherit; font-weight: 700; font-size: 0.82rem;
      cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 6px;
      text-decoration: none;
    }
    .db-welcome-right .btn:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }

    /* ===== Stats Grid ===== */
    .db-stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .db-stat {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 16px 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      text-align: center;
      transition: var(--transition);
      text-decoration: none; color: inherit;
      position: relative; overflow: hidden;
    }
    .db-stat::before {
      content: '';
      position: absolute; top: 0; right: 0;
      width: 4px; height: 100%;
      background: var(--gold);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform .4s ease;
    }
    .db-stat:hover::before { transform: scaleY(1); }
    .db-stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--gold-light); }
    .db-stat-icon {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; margin: 0 auto 8px;
    }
    .db-stat-icon.blue   { background: rgba(59,130,246,.12); color: #2563eb; }
    .db-stat-icon.green  { background: rgba(34,197,94,.12);  color: #16a34a; }
    .db-stat-icon.red    { background: rgba(239,68,68,.12);  color: #dc2626; }
    .db-stat-icon.gold   { background: rgba(201,168,76,.15); color: var(--gold-dark); }
    .db-stat-icon.purple { background: rgba(139,92,246,.12); color: #7c3aed; }
    .db-stat-icon.orange { background: rgba(245,158,11,.12); color: #d97706; }
    .db-stat-num {
      font-size: 1.3rem; font-weight: 900;
      color: var(--navy); line-height: 1.2; margin-bottom: 3px;
    }
    .db-stat-num.green  { color: #16a34a; }
    .db-stat-num.red    { color: #dc2626; }
    .db-stat-num.gold   { color: var(--gold-dark); }
    .db-stat-num.orange { color: #d97706; }
    .db-stat-label { font-size: 0.68rem; color: var(--gray-500); font-weight: 700; line-height: 1.2; }

    /* ===== Sections ===== */
    .db-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }
    .db-section {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow: hidden;
      margin-bottom: 18px;
    }
    .db-section-header {
      padding: 14px 18px;
      border-bottom: 2px solid var(--gray-100);
      background: linear-gradient(135deg, #fcf9f0, #f8f4e8);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .db-section-header h2 {
      font-size: 0.95rem; font-weight: 900;
      color: var(--navy); margin: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .db-section-header h2 i { color: var(--gold); }
    .db-section-header .view-all {
      font-size: 0.78rem; font-weight: 700;
      color: var(--gold-dark); text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
      transition: var(--transition);
    }
    .db-section-header .view-all:hover { color: var(--gold); transform: translateX(-3px); }
    .db-section-body { padding: 12px 16px; }

    /* ===== Quick Access ===== */
    .qa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .qa-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 16px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: var(--gray-800);
      border: 2px solid transparent;
      transition: all .3s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      position: relative;
    }
    .qa-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold);
    }
    .qa-icon {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--gold); font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: transform .3s ease;
      box-shadow: 0 4px 12px rgba(26,42,74,.15);
    }
    .qa-card:hover .qa-icon {
      transform: scale(1.1) rotate(-5deg);
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
    }
    .qa-title { font-size: 0.82rem; font-weight: 800; color: var(--navy); line-height: 1.2; }
    .qa-sub { font-size: 0.65rem; color: var(--gray-400); }
    .qa-badge {
      position: absolute; top: 6px; left: 6px;
      background: var(--danger); color: white;
      font-size: 0.6rem; font-weight: 900;
      padding: 2px 6px; border-radius: 10px;
      min-width: 18px; text-align: center;
    }

    /* ===== Alerts ===== */
    .db-alerts { display: flex; flex-direction: column; gap: 8px; }
    .db-alert {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid;
      text-decoration: none; color: inherit;
      transition: var(--transition);
    }
    .db-alert:hover { transform: translateX(-3px); }
    .db-alert.danger  { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .db-alert.warning { background: #fef9e7; border-color: #fde68a; color: #92400e; }
    .db-alert.info    { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
    .db-alert.success { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .db-alert-icon {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0;
    }
    .db-alert.danger  .db-alert-icon { background: #fee2e2; color: #dc2626; }
    .db-alert.warning .db-alert-icon { background: #fef3c7; color: #d97706; }
    .db-alert.info    .db-alert-icon { background: #dbeafe; color: #2563eb; }
    .db-alert.success .db-alert-icon { background: #dcfce7; color: #16a34a; }
    .db-alert-content { flex: 1; min-width: 0; }
    .db-alert-title { font-size: 0.82rem; font-weight: 800; margin-bottom: 2px; }
    .db-alert-sub { font-size: 0.72rem; opacity: 0.85; }
    .db-alert-arrow { font-size: 0.7rem; opacity: 0.5; flex-shrink: 0; }

    /* ===== Lists ===== */
    .db-list { display: flex; flex-direction: column; gap: 6px; }
    .db-list-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: var(--gray-50);
      border-radius: var(--radius-sm);
      border: 1px solid var(--gray-200);
      text-decoration: none; color: inherit;
      transition: var(--transition);
    }
    .db-list-item:hover {
      background: var(--white);
      border-color: var(--gold);
      transform: translateX(-3px);
      box-shadow: var(--shadow-sm);
    }
    .db-list-icon {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: var(--navy);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; flex-shrink: 0;
    }
    .db-list-info { flex: 1; min-width: 0; }
    .db-list-title {
      font-size: 0.82rem; font-weight: 800; color: var(--navy);
      margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .db-list-meta {
      font-size: 0.7rem; color: var(--gray-500);
      display: flex; align-items: center; gap: 6px;
      flex-wrap: wrap;
    }
    .db-list-meta i { font-size: 0.6rem; color: var(--gold); }
    .db-list-badge {
      padding: 3px 8px; border-radius: 12px;
      font-size: 0.68rem; font-weight: 800;
      white-space: nowrap; flex-shrink: 0;
    }
    .db-list-badge.pending    { background: rgba(245,158,11,.15); color: #d97706; }
    .db-list-badge.processing { background: rgba(59,130,246,.15); color: #2563eb; }
    .db-list-badge.shipped    { background: rgba(139,92,246,.15); color: #7c3aed; }
    .db-list-badge.delivered  { background: rgba(34,197,94,.15);  color: #16a34a; }
    .db-list-badge.cancelled  { background: rgba(239,68,68,.15);  color: #dc2626; }
    .db-list-amount {
      font-size: 0.85rem; font-weight: 900;
      color: var(--gold-dark); flex-shrink: 0;
    }

    /* ===== Empty / Loading ===== */
    .db-empty {
      text-align: center; padding: 30px 16px;
      color: var(--gray-400);
    }
    .db-empty i { font-size: 2rem; margin-bottom: 8px; display: block; color: var(--gray-300); }
    .db-empty p { font-size: 0.8rem; margin: 0; }

    .db-loading {
      text-align: center; padding: 24px;
      color: var(--gray-400);
    }
    .db-loading i { font-size: 1.5rem; color: var(--gold); }

    /* ===== Responsive ===== */
    @media (max-width: 1024px) {
      .db-stats { grid-template-columns: repeat(3, 1fr); }
      .db-grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .db-welcome { padding: 16px; border-radius: var(--radius-md); }
      .db-avatar { width: 48px; height: 48px; font-size: 1.2rem; }
      .db-greeting h1 { font-size: 1rem; }
      .db-greeting p { font-size: 0.72rem; }
      .db-welcome-right .btn { font-size: 0.72rem; padding: 6px 10px; }

      .db-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .db-stat { padding: 12px 8px; }
      .db-stat-icon { width: 34px; height: 34px; font-size: 0.9rem; }
      .db-stat-num { font-size: 1.05rem; }
      .db-stat-label { font-size: 0.62rem; }

      .db-section-header { padding: 12px 14px; }
      .db-section-header h2 { font-size: 0.85rem; }
      .db-section-body { padding: 10px 12px; }

      .qa-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
      .qa-card { padding: 12px 8px; }
      .qa-icon { width: 36px; height: 36px; font-size: 0.95rem; }
      .qa-title { font-size: 0.72rem; }
      .qa-sub { display: none; }

      .db-list-item { padding: 8px 10px; gap: 8px; }
      .db-list-icon { width: 32px; height: 32px; font-size: 0.85rem; }
      .db-list-title { font-size: 0.76rem; }
      .db-list-meta { font-size: 0.65rem; }
      .db-list-amount { font-size: 0.78rem; }
    }
    @media (max-width: 480px) {
      .db-stats { grid-template-columns: 1fr 1fr; gap: 6px; }
      .db-stat { padding: 10px 6px; }
      .db-stat-num { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>
  <div id="header-placeholder"></div>

  <main class="page-content">
    <div class="container">

      <!-- ============================================================ -->
      <!-- Welcome Header                                                -->
      <!-- ============================================================ -->
      <div class="db-welcome">
        <div class="db-welcome-inner">
          <div class="db-welcome-left">
            <div class="db-avatar"><i class="fas fa-crown"></i></div>
            <div class="db-greeting">
              <h1>أهلاً <span class="gold" id="adminName">—</span></h1>
              <p id="greeting">جاري تحميل البيانات...</p>
            </div>
          </div>
          <div class="db-welcome-right">
            <a href="/gomla/store-wholesale.html" class="btn">
              <i class="fas fa-store"></i> متجر الجملة
            </a>
            <a href="/gomla/store-retail.html" class="btn">
              <i class="fas fa-shopping-cart"></i> متجر القطاعي
            </a>
          </div>
        </div>
      </div>

      <!-- ============================================================ -->
      <!-- Stats                                                         -->
      <!-- ============================================================ -->
      <div class="db-stats" id="statsGrid">
        <a href="/gomla/admin/orders.html" class="db-stat">
          <div class="db-stat-icon blue"><i class="fas fa-shopping-bag"></i></div>
          <div class="db-stat-num" id="statOrdersToday">0</div>
          <div class="db-stat-label">طلبات اليوم</div>
        </a>
        <a href="/gomla/admin/orders.html?status=pending" class="db-stat">
          <div class="db-stat-icon gold"><i class="fas fa-clock"></i></div>
          <div class="db-stat-num gold" id="statPendingOrders">0</div>
          <div class="db-stat-label">قيد الانتظار</div>
        </a>
        <a href="/gomla/admin/customers.html" class="db-stat">
          <div class="db-stat-icon red"><i class="fas fa-hand-holding-dollar"></i></div>
          <div class="db-stat-num red" id="statDebts">0</div>
          <div class="db-stat-label">مديونيات (ج.م)</div>
        </a>
        <a href="/gomla/admin/products.html?status=lowStock" class="db-stat">
          <div class="db-stat-icon orange"><i class="fas fa-exclamation-triangle"></i></div>
          <div class="db-stat-num orange" id="statLowStock">0</div>
          <div class="db-stat-label">مخزون منخفض</div>
        </a>
        <a href="/gomla/admin/registration-requests.html" class="db-stat">
          <div class="db-stat-icon purple"><i class="fas fa-user-plus"></i></div>
          <div class="db-stat-num" id="statPendingRequests">0</div>
          <div class="db-stat-label">طلبات تسجيل</div>
        </a>
      </div>

      <!-- ============================================================ -->
      <!-- Quick Access + Alerts                                         -->
      <!-- ============================================================ -->
      <div class="db-grid-2">

        <div class="db-section">
          <div class="db-section-header">
            <h2><i class="fas fa-bolt"></i> الوصول السريع</h2>
          </div>
          <div class="db-section-body">
            <div class="qa-grid" id="quickAccess"></div>
          </div>
        </div>

        <div class="db-section">
          <div class="db-section-header">
            <h2><i class="fas fa-bell"></i> التنبيهات</h2>
          </div>
          <div class="db-section-body">
            <div class="db-alerts" id="alertsContainer">
              <div class="db-loading"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
          </div>
        </div>

      </div>

      <!-- ============================================================ -->
      <!-- Recent Orders + Recent Invoices                               -->
      <!-- ============================================================ -->
      <div class="db-grid-2">

        <div class="db-section">
          <div class="db-section-header">
            <h2><i class="fas fa-receipt"></i> آخر الطلبات</h2>
            <a href="/gomla/admin/orders.html" class="view-all">
              عرض الكل <i class="fas fa-arrow-left"></i>
            </a>
          </div>
          <div class="db-section-body">
            <div class="db-list" id="recentOrders">
              <div class="db-loading"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
          </div>
        </div>

        <div class="db-section">
          <div class="db-section-header">
            <h2><i class="fas fa-file-invoice"></i> آخر الفواتير</h2>
            <a href="/gomla/admin/invoices.html" class="view-all">
              عرض الكل <i class="fas fa-arrow-left"></i>
            </a>
          </div>
          <div class="db-section-body">
            <div class="db-list" id="recentInvoices">
              <div class="db-loading"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>
  <div id="footer-placeholder"></div>
  <div id="sidebar-placeholder"></div>
  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
  // ============================================================
  // admin/dashboard.html — v1.0
  // ⚠️ استراتيجية صارمة: ممنوع تعريف دوال موجودة في main.js
  //    - showToast, getCurrentUser, formatDate, protectAnyAdminPage
  // ============================================================

  const dbState = {
    role: 'guest',
    isSuper: false,
    isAdminPlus: false,
    adminId: '',
    adminName: '',
    stats: {
      ordersToday: 0,
      pendingOrders: 0,
      debts: 0,
      lowStock: 0,
      pendingRequests: 0
    }
  };

  // ============================================================
  // Init
  // ============================================================
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const user = getCurrentUser();
      if (!user || user.type !== 'admin') {
        window.location.href = '/gomla/admin/login.html';
        return;
      }

      dbState.role = user.data?.role || 'admin';
      dbState.isSuper = dbState.role === 'super';
      dbState.isAdminPlus = dbState.role === 'admin_plus';
      dbState.adminId = user.data?.id || user.data?.uid || '';
      dbState.adminName = user.data?.name || 'أدمن';

      // Greeting
      document.getElementById('adminName').textContent = dbState.adminName;
      const hour = new Date().getHours();
      let greet = 'نتمنى لك يوم موفق';
      if (hour < 12) greet = 'صباح الخير — نتمنى لك يوم موفق';
      else if (hour < 18) greet = 'مساء الخير — نتمنى لك يوماً سعيداً';
      else greet = 'مساء الخير — تصفح لوحة التحكم';
      document.getElementById('greeting').textContent = greet + ' · ' + formatDate(new Date());

      // Render
      renderQuickAccess();
      await Promise.all([
        loadStats(),
        loadAlerts(),
        loadRecentOrders(),
        loadRecentInvoices()
      ]);

      console.log('✅ dashboard.html v1.0 ready — role:', dbState.role);

    } catch (err) {
      console.error('Dashboard init error:', err);
      if (typeof showToast === 'function') showToast('خطأ في تحميل الصفحة', 'error');
    }
  });

  // ============================================================
  // Quick Access
  // ============================================================
  function renderQuickAccess() {
    const container = document.getElementById('quickAccess');
    let cards = [];

    // مشترك بين كل الأدوار الإدارية
    const common = [
      { icon: 'fa-shopping-bag',     title: 'الطلبات',       sub: 'إدارة',       url: '/gomla/admin/orders.html',     badge: dbState.stats.pendingOrders || 0 },
      { icon: 'fa-boxes',            title: 'المنتجات',      sub: 'الكتالوج',    url: '/gomla/admin/products.html' },

  // ============================================================
  // Stats
  // ============================================================
  async function loadStats() {
    try {
      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);

      // 1. طلبات اليوم
      const ordersTodaySnap = await db.collection('orders')
        .where('createdAt', '>=', startOfDay)
        .limit(500).get();
      dbState.stats.ordersToday = ordersTodaySnap.size;
      document.getElementById('statOrdersToday').textContent = ordersTodaySnap.size;

      // 2. طلبات قيد الانتظار
      const pendingSnap = await db.collection('orders')
        .where('status', '==', 'pending')
        .limit(500).get();
      dbState.stats.pendingOrders = pendingSnap.size;
      document.getElementById('statPendingOrders').textContent = pendingSnap.size;

      // 3. المديونيات (sum balance من customers)
      const customersSnap = await db.collection('customers').limit(1000).get();
      let totalDebts = 0;
      customersSnap.forEach(doc => {
        const bal = doc.data().balance || 0;
        if (bal > 0) totalDebts += bal;
      });
      dbState.stats.debts = totalDebts;
      document.getElementById('statDebts').textContent = _formatMoney(totalDebts);

      // 4. مخزون منخفض (products)
      const productsSnap = await db.collection('products').limit(1000).get();
      let lowStockCount = 0;
      productsSnap.forEach(doc => {
        const p = doc.data();
        if (p.available === false) return;
        const threshold = p.lowStockThreshold || 5;
        let stock = 0;
        if (p.warehouseStock !== undefined) {
          stock = (p.warehouseStock || 0) * (p.piecesPerUnit || 1) + (p.warehousePieces || 0);
        } else {
          stock = p.stockQuantity || 0;
        }
        if (stock > 0 && stock <= threshold) lowStockCount++;
      });
      dbState.stats.lowStock = lowStockCount;
      document.getElementById('statLowStock').textContent = lowStockCount;

      // 5. طلبات التسجيل
      try {
        const requestsSnap = await db.collection('registration_requests')
          .where('status', '==', 'pending')
          .limit(100).get();
        dbState.stats.pendingRequests = requestsSnap.size;
        document.getElementById('statPendingRequests').textContent = requestsSnap.size;
      } catch (e) {
        document.getElementById('statPendingRequests').textContent = '0';
      }

      // Re-render quick access with badges
      renderQuickAccess();

    } catch (err) {
      console.warn('Stats loading error:', err);
    }
  }

  // ============================================================
  // Alerts
  // ============================================================
  async function loadAlerts() {
    const container = document.getElementById('alertsContainer');
    const alerts = [];

    // تنبيه 1: مخزون منخفض
    if (dbState.stats.lowStock > 0) {
      alerts.push({
        type: 'warning',
        icon: 'fa-exclamation-triangle',
        title: `${dbState.stats.lowStock} منتج بمخزون منخفض`,
        sub: 'راجع صفحة المنتجات',
        url: '/gomla/admin/products.html?status=lowStock'
      });
    }

    // تنبيه 2: طلبات قيد الانتظار
    if (dbState.stats.pendingOrders > 0) {
      alerts.push({
        type: 'info',
        icon: 'fa-clock',
        title: `${dbState.stats.pendingOrders} طلب قيد الانتظار`,
        sub: 'يحتاج مراجعة',
        url: '/gomla/admin/orders.html?status=pending'
      });
    }

    // تنبيه 3: طلبات تسجيل
    if (dbState.stats.pendingRequests > 0) {
      alerts.push({
        type: 'info',
        icon: 'fa-user-plus',
        title: `${dbState.stats.pendingRequests} طلب تسجيل جديد`,
        sub: 'يحتاج مراجعة',
        url: '/gomla/admin/registration-requests.html'
      });
    }

    // تنبيه 4: أقساط متأخرة (فقط super + admin_plus)
    if (dbState.isSuper || dbState.isAdminPlus) {
      try {
        const plansSnap = await db.collection('installment_plans')
          .where('status', '==', 'active')
          .limit(200).get();
        const today = new Date();
        let overdueCount = 0;
        plansSnap.forEach(doc => {
          const plan = doc.data();
          if (!plan.schedule) return;
          plan.schedule.forEach(inst => {
            if (!inst.paid && inst.dueDate) {
              const due = inst.dueDate.toDate ? inst.dueDate.toDate() : new Date(inst.dueDate);
              if (due < today) overdueCount++;
            }
          });
        });
        if (overdueCount > 0) {
          alerts.push({
            type: 'danger',
            icon: 'fa-calendar-times',
            title: `${overdueCount} قسط متأخر`,
            sub: 'يحتاج متابعة',
            url: '/gomla/admin/installments.html?status=overdue'
          });
        }
      } catch (e) { /* collection مش موجودة بعد */ }
    }

    // تنبيه 5: تقفيل اليوم
    if (dbState.isSuper || dbState.isAdminPlus) {
      try {
        const todayStr = new Date().toISOString().slice(0, 10);
        const closesSnap = await db.collection('daily_closes')
          .where('date', '==', todayStr)
          .limit(10).get();
        if (closesSnap.size === 0) {
          alerts.push({
            type: 'warning',
            icon: 'fa-calculator',
            title: 'لم يتم تقفيل اليوم',
            sub: 'ابدأ التقفيل اليومي',
            url: '/gomla/admin/daily-closes.html'
          });
        }
      } catch (e) { /* collection مش موجودة بعد */ }
    }

    if (alerts.length === 0) {
      container.innerHTML = `
        <div class="db-empty" style="padding:20px;">
          <i class="fas fa-check-circle" style="color:#16a34a;"></i>
          <p>لا توجد تنبيهات — كل شيء على ما يرام</p>
        </div>
      `;
      return;
    }

    container.innerHTML = alerts.map(a => `
      <a href="${a.url}" class="db-alert ${a.type}">
        <div class="db-alert-icon"><i class="fas ${a.icon}"></i></div>
        <div class="db-alert-content">
          <div class="db-alert-title">${a.title}</div>
          <div class="db-alert-sub">${a.sub}</div>
        </div>
        <i class="fas fa-chevron-left db-alert-arrow"></i>
      </a>
    `).join('');
  }

  // ============================================================
  // Recent Orders
  // ============================================================
  async function loadRecentOrders() {
    const container = document.getElementById('recentOrders');
    try {
      const snap = await db.collection('orders')
        .orderBy('createdAt', 'desc')
        .limit(5).get();

      if (snap.empty) {
        container.innerHTML = `<div class="db-empty"><i class="fas fa-shopping-bag"></i><p>لا توجد طلبات بعد</p></div>`;
        return;
      }

      const statusMap = {
        pending: 'قيد الانتظار', processing: 'قيد المعالجة',
        shipped: 'تم الشحن', delivered: 'تم التسليم', cancelled: 'ملغي'
      };

      container.innerHTML = snap.docs.map(doc => {
        const o = doc.data();
        const orderNum = doc.id.slice(-8).toUpperCase();
        const dateStr = o.createdAt ? formatDate(o.createdAt) : '—';
        const status = o.status || 'pending';
        const statusText = statusMap[status] || status;
        const total = (o.total || 0).toFixed(0);

        return `
          <a href="/gomla/admin/orders.html?id=${doc.id}" class="db-list-item">
            <div class="db-list-icon"><i class="fas fa-receipt"></i></div>
            <div class="db-list-info">
              <div class="db-list-title">#${orderNum} — ${o.customerName || 'عميل'}</div>
              <div class="db-list-meta">
                <i class="fas fa-calendar"></i> ${dateStr}
              </div>
            </div>
            <span class="db-list-badge ${status}">${statusText}</span>
            <div class="db-list-amount">${total} ج</div>
          </a>
        `;
      }).join('');

    } catch (err) {
      console.warn('Recent orders error:', err);
      container.innerHTML = `<div class="db-empty"><i class="fas fa-exclamation-triangle"></i><p>خطأ في التحميل</p></div>`;
    }
  }

  // ============================================================
  // Recent Invoices
  // ============================================================
  async function loadRecentInvoices() {
    const container = document.getElementById('recentInvoices');
    try {
      const snap = await db.collection('invoices')
        .orderBy('createdAt', 'desc')
        .limit(5).get();

      if (snap.empty) {
        container.innerHTML = `<div class="db-empty"><i class="fas fa-file-invoice"></i><p>لا توجد فواتير بعد</p></div>`;
        return;
      }

      container.innerHTML = snap.docs.map(doc => {
        const inv = doc.data();
        const invNum = doc.id.slice(-8).toUpperCase();
        const dateStr = inv.createdAt ? formatDate(inv.createdAt) : '—';
        const status = inv.paymentStatus || 'unpaid';
        const statusMap = {
          paid: 'مدفوع', unpaid: 'غير مدفوع', partial: 'جزئي',
          pending: 'معلق', awaiting_cardoona: 'كرتونة',
          awaiting_agent: 'مندوب', awaiting_admin: 'أدمن'
        };
        const statusText = statusMap[status] || status;

        return `
          <a href="/gomla/admin/invoices.html?id=${doc.id}" class="db-list-item">
            <div class="db-list-icon"><i class="fas fa-file-invoice-dollar"></i></div>
            <div class="db-list-info">
              <div class="db-list-title">#${invNum} — ${inv.customerName || 'عميل'}</div>
              <div class="db-list-meta">
                <i class="fas fa-calendar"></i> ${dateStr}
              </div>
            </div>
            <span class="db-list-badge ${status === 'paid' ? 'delivered' : 'pending'}">${statusText}</span>
            <div class="db-list-amount">${(inv.total || 0).toFixed(0)} ج</div>
          </a>
        `;
      }).join('');

    } catch (err) {
      console.warn('Recent invoices error:', err);
      container.innerHTML = `<div class="db-empty"><i class="fas fa-exclamation-triangle"></i><p>خطأ في التحميل</p></div>`;
    }
  }

  // ============================================================
  // Helpers (page-specific)
  // ============================================================
  function _formatMoney(n) {
    if (!n || n === 0) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return Math.round(n).toString();
  }

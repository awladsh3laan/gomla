<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أولاد شعلان جملة - لوحة التحكم</title>

  <!-- ===== SEO ===== -->
  <meta name="description" content="لوحة تحكم المديرين - أولاد شعلان جملة">
  <meta name="theme-color" content="#1a2a4a">

  <!-- ===== Font Awesome ===== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- ===== Google Font ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- ===== الستايل الموحد ===== -->
  <link rel="stylesheet" href="../assets/css/style.css">

  <!-- ===== Favicon ===== -->
  <link rel="icon" href="../assets/images/favicon.ico">

  <!-- ============================================================ -->
  <!-- 🎨 ستايل خاص بلوحة التحكم                                    -->
  <!-- ============================================================ -->
  <style>
    /* ===== الإحصائيات ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 14px;
      transition: var(--transition-base);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .stat-card .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .stat-card .stat-icon.gold { background: rgba(201,168,76,0.15); color: var(--gold); }
    .stat-card .stat-icon.green { background: rgba(34,197,94,0.15); color: #22c55e; }
    .stat-card .stat-icon.blue { background: rgba(59,130,246,0.15); color: #3b82f6; }
    .stat-card .stat-icon.purple { background: rgba(139,92,246,0.15); color: #8b5cf6; }
    .stat-card .stat-icon.red { background: rgba(239,68,68,0.15); color: #ef4444; }

    .stat-card .stat-info .stat-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--navy);
      display: block;
      line-height: 1.2;
    }

    .stat-card .stat-info .stat-label {
      font-size: 0.8rem;
      color: var(--gray-400);
    }

    /* ===== كروت الوصول السريع ===== */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .quick-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 18px 14px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-base);
      text-decoration: none;
      color: var(--gray-800);
      border: 2px solid transparent;
    }

    .quick-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold);
    }

    .quick-card .card-icon {
      font-size: 2rem;
      color: var(--gold);
      display: block;
      margin-bottom: 6px;
    }

    .quick-card .card-title {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .quick-card .card-sub {
      font-size: 0.75rem;
      color: var(--gray-400);
    }

    .quick-card .card-badge {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      padding: 1px 10px;
      border-radius: var(--radius-full);
      font-size: 0.6rem;
      font-weight: 700;
      margin-top: 4px;
    }

    /* ===== الأقسام ===== */
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title i {
      color: var(--gold);
    }

    .section-title .view-all {
      margin-right: auto;
      font-size: 0.85rem;
      color: var(--gray-400);
      text-decoration: none;
      transition: var(--transition-base);
    }

    .section-title .view-all:hover {
      color: var(--gold);
    }

    .recent-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .recent-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
    }

    .recent-card .recent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .recent-card .recent-header h4 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--navy);
    }

    .recent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--gray-100);
      font-size: 0.85rem;
    }

    .recent-item:last-child {
      border-bottom: none;
    }

    .recent-item .item-info {
      display: flex;
      flex-direction: column;
    }

    .recent-item .item-title {
      font-weight: 600;
    }

    .recent-item .item-sub {
      font-size: 0.75rem;
      color: var(--gray-400);
    }

    .recent-item .item-value {
      font-weight: 700;
      color: var(--gold);
    }

    .recent-item .item-status {
      padding: 2px 12px;
      border-radius: var(--radius-full);
      font-size: 0.7rem;
      font-weight: 600;
    }

    .recent-item .item-status.pending { background: #fef3c7; color: #92400e; }
    .recent-item .item-status.processing { background: #dbeafe; color: #1a3a5c; }
    .recent-item .item-status.completed { background: #dcfce7; color: #166534; }
    .recent-item .item-status.cancelled { background: #fef2f2; color: #dc2626; }

    /* ===== الإشعارات ===== */
    .notification-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--gray-100);
    }

    .notification-item:last-child {
      border-bottom: none;
    }

    .notification-item .notif-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .notification-item .notif-icon.info { background: #dbeafe; color: #3b82f6; }
    .notification-item .notif-icon.success { background: #dcfce7; color: #22c55e; }
    .notification-item .notif-icon.warning { background: #fef3c7; color: #f59e0b; }
    .notification-item .notif-icon.danger { background: #fef2f2; color: #ef4444; }

    .notification-item .notif-text {
      flex: 1;
      font-size: 0.85rem;
    }

    .notification-item .notif-time {
      font-size: 0.7rem;
      color: var(--gray-400);
    }

    /* ===== استجابة ===== */
    @media (max-width: 768px) {
      .recent-grid {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }

      .quick-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      }
    }

    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .quick-grid {
        grid-template-columns: 1fr 1fr;
      }

      .stat-card .stat-value {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================ -->
  <!-- 🧠 الهيدر (يتم تحميله من main.js)                            -->
  <!-- ============================================================ -->
  <div id="header-placeholder"></div>

  <!-- ============================================================ -->
  <!-- 📄 محتوى لوحة التحكم                                         -->
  <!-- ============================================================ -->
  <section class="page-content">
    <div class="container">

      <!-- ===== شريط الترحيب ===== -->
      <div class="page-header">
        <h1><i class="fas fa-tachometer-alt"></i> لوحة التحكم</h1>
        <span class="admin-badge" id="adminRoleBadge">🛡️ مشرف</span>
      </div>

      <!-- ===== الإحصائيات ===== -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-icon gold"><i class="fas fa-boxes"></i></div>
          <div class="stat-info">
            <span class="stat-value" id="totalProducts">0</span>
            <span class="stat-label">إجمالي المنتجات</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue"><i class="fas fa-users"></i></div>
          <div class="stat-info">
            <span class="stat-value" id="totalCustomers">0</span>
            <span class="stat-label">إجمالي العملاء</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><i class="fas fa-file-invoice"></i></div>
          <div class="stat-info">
            <span class="stat-value" id="totalInvoices">0</span>
            <span class="stat-label">إجمالي الفواتير</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple"><i class="fas fa-shopping-cart"></i></div>
          <div class="stat-info">
            <span class="stat-value" id="totalOrders">0</span>
            <span class="stat-label">إجمالي الطلبات</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon red"><i class="fas fa-clock"></i></div>
          <div class="stat-info">
            <span class="stat-value" id="pendingOrders">0</span>
            <span class="stat-label">طلبات معلقة</span>
          </div>
        </div>
      </div>

      <!-- ===== كروت الوصول السريع ===== -->
      <div class="section-title">
        <i class="fas fa-bolt"></i> الوصول السريع
      </div>
      <div class="quick-grid" id="quickGrid">
        <!-- سيتم تحميلها حسب الصلاحية -->
        <div class="loading-spinner" style="grid-column:1/-1;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
      </div>

      <!-- ===== الطلبات والفواتير الأخيرة ===== -->
      <div class="recent-grid">
        <!-- ===== الطلبات الأخيرة ===== -->
        <div class="recent-card">
          <div class="recent-header">
            <h4><i class="fas fa-shopping-cart" style="color:var(--gold);"></i> آخر الطلبات</h4>
            <a href="/gomla/admin/orders.html" class="view-all">عرض الكل <i class="fas fa-arrow-left"></i></a>
          </div>
          <div id="recentOrders">
            <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
          </div>
        </div>

        <!-- ===== الفواتير الأخيرة ===== -->
        <div class="recent-card">
          <div class="recent-header">
            <h4><i class="fas fa-file-invoice" style="color:var(--gold);"></i> آخر الفواتير</h4>
            <a href="/gomla/admin/invoices.html" class="view-all">عرض الكل <i class="fas fa-arrow-left"></i></a>
          </div>
          <div id="recentInvoices">
            <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
          </div>
        </div>
      </div>

      <!-- ===== المنتجات الأكثر مبيعاً ===== -->
      <div class="section-title">
        <i class="fas fa-fire"></i> المنتجات الأكثر مبيعاً
        <a href="/gomla/admin/products.html" class="view-all">عرض الكل <i class="fas fa-arrow-left"></i></a>
      </div>
      <div class="recent-card" style="margin-bottom:24px;">
        <div id="topProducts">
          <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
        </div>
      </div>

      <!-- ===== الإشعارات السريعة ===== -->
      <div class="section-title">
        <i class="fas fa-bell"></i> الإشعارات
      </div>
      <div class="recent-card">
        <div id="adminNotifications">
          <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
        </div>
      </div>

    </div>
  </section>

  <!-- ============================================================ -->
  <!-- 👣 الفوتر (يتم تحميله من main.js)                            -->
  <!-- ============================================================ -->
  <div id="footer-placeholder"></div>

  <!-- ============================================================ -->
  <!-- 🧠 السايدبار (يتم تحميله من main.js)                         -->
  <!-- ============================================================ -->
  <div id="sidebar-placeholder"></div>

  <!-- ============================================================ -->
  <!-- 🍞 Toast Container                                            -->
  <!-- ============================================================ -->
  <div id="toast-container"></div>

  <!-- ============================================================ -->
  <!-- 📚 Firebase & JavaScript                                      -->
  <!-- ============================================================ -->

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/admin.js"></script>

  <!-- ============================================================ -->
  <!-- 📝 كود الصفحة الخاص (لوحة التحكم)                            -->
  <!-- ============================================================ -->
  <script>
    // ============================================================
    // 📊 لوحة التحكم - admin/dashboard.html
    // ============================================================

    // ===== استخدام آمن لـ db =====
    const db = window.db || firebase.firestore();

    // ===== متغيرات عامة =====
    let allProducts = [];
    let allCustomers = [];
    let allInvoices = [];
    let allOrders = [];

    // ============================================================
    // 🚀 تحميل البيانات
    // ============================================================

    function loadDashboard() {
      // ===== جلب صلاحية المستخدم =====
      const adminData = localStorage.getItem('admin');
      if (adminData) {
        const admin = JSON.parse(adminData);
        const isSuper = admin.role === 'super';
        document.getElementById('adminRoleBadge').textContent = isSuper ? '👑 سوبر أدمن' : '🛡️ مشرف';
        document.getElementById('adminName').textContent = admin.name || 'مدير';
      }

      // ===== تحميل الإحصائيات =====
      loadStats();

      // ===== تحميل الكروت السريعة =====
      loadQuickCards();

      // ===== تحميل الطلبات والفواتير والمنتجات =====
      loadRecentOrders();
      loadRecentInvoices();
      loadTopProducts();
      loadAdminNotifications();
    }

    // ============================================================
    // 📊 الإحصائيات
    // ============================================================

    function loadStats() {
      // ===== المنتجات =====
      db.collection('products').get()
        .then(snapshot => {
          document.getElementById('totalProducts').textContent = snapshot.size;
        })
        .catch(() => {});

      // ===== العملاء =====
      db.collection('customers').get()
        .then(snapshot => {
          document.getElementById('totalCustomers').textContent = snapshot.size;
        })
        .catch(() => {});

      // ===== الفواتير =====
      Promise.all([
        db.collection('invoices_wholesale').get(),
        db.collection('invoices_retail').get()
      ]).then(([wholesale, retail]) => {
        const total = wholesale.size + retail.size;
        document.getElementById('totalInvoices').textContent = total;
      }).catch(() => {});

      // ===== الطلبات =====
      Promise.all([
        db.collection('orders_wholesale').get(),
        db.collection('orders_retail').get()
      ]).then(([wholesale, retail]) => {
        const total = wholesale.size + retail.size;
        document.getElementById('totalOrders').textContent = total;
      }).catch(() => {});

      // ===== الطلبات المعلقة =====
      Promise.all([
        db.collection('orders_wholesale').where('status', '==', 'pending').get(),
        db.collection('orders_retail').where('status', '==', 'pending').get()
      ]).then(([wholesale, retail]) => {
        const total = wholesale.size + retail.size;
        document.getElementById('pendingOrders').textContent = total;
      }).catch(() => {});
    }

    // ============================================================
    # 🚀 كروت الوصول السريع
    // ============================================================

    function loadQuickCards() {
      const container = document.getElementById('quickGrid');
      if (!container) return;

      const adminData = localStorage.getItem('admin');
      const isSuper = adminData ? JSON.parse(adminData).role === 'super' : false;

      let cards = [];

      // ===== كروت مشتركة للكل =====
      const commonCards = [
        { icon: 'fa-boxes', title: 'المنتجات', url: '/gomla/admin/products.html', desc: 'إدارة المنتجات' },
        { icon: 'fa-users', title: 'العملاء', url: '/gomla/admin/customers.html', desc: 'عرض العملاء' },
        { icon: 'fa-file-invoice', title: 'الفواتير', url: '/gomla/admin/invoices.html', desc: 'إدارة الفواتير' },
        { icon: 'fa-shopping-cart', title: 'الطلبات', url: '/gomla/admin/orders.html', desc: 'إدارة الطلبات' },
        { icon: 'fa-chart-line', title: 'عرض الأسعار', url: '/gomla/admin/reports.html', desc: 'عرض وطباعة الأسعار' },
      ];

      cards = [...commonCards];

      // ===== كروت إضافية للسوبر أدمن =====
      if (isSuper) {
        const superCards = [
          { icon: 'fa-cog', title: 'الإعدادات', url: '/gomla/admin/settings.html', desc: 'إعدادات الموقع' },
          { icon: 'fa-key', title: 'توليد الأكواد', url: '/gomla/admin/generate-codes.html', desc: 'توليد كود عميل' },
          { icon: 'fa-user-cog', title: 'الصلاحيات', url: '/gomla/admin/roles.html', desc: 'إدارة الصلاحيات' },
          { icon: 'fa-ad', title: 'الإعلانات', url: '/gomla/admin/ads.html', desc: 'إدارة الإعلانات' },
          { icon: 'fa-newspaper', title: 'الأخبار', url: '/gomla/admin/news.html', desc: 'إدارة الأخبار' },
          { icon: 'fa-quote-right', title: 'المقولات', url: '/gomla/admin/quotes.html', desc: 'إدارة المقولات' },
          { icon: 'fa-paint-brush', title: 'السايدبار', url: '/gomla/admin/sidebar.html', desc: 'إدارة السايدبار' },
          { icon: 'fa-download', title: 'نسخ احتياطي', url: '/gomla/admin/backup.html', desc: 'تصدير البيانات' },
        ];
        cards = [...cards, ...superCards];
      }

      // ===== عرض الكروت =====
      let html = '';
      cards.forEach(card => {
        html += `
          <a href="${card.url}" class="quick-card">
            <span class="card-icon"><i class="fas ${card.icon}"></i></span>
            <span class="card-title">${card.title}</span>
            <span class="card-sub">${card.desc}</span>
            ${isSuper ? '<span class="card-badge">سوبر</span>' : ''}
          </a>
        `;
      });

      container.innerHTML = html;
    }

    // ============================================================
    # 📦 آخر الطلبات
    // ============================================================

    function loadRecentOrders() {
      const container = document.getElementById('recentOrders');
      if (!container) return;

      Promise.all([
        db.collection('orders_wholesale').orderBy('createdAt', 'desc').limit(5).get(),
        db.collection('orders_retail').orderBy('createdAt', 'desc').limit(5).get()
      ]).then(([wholesale, retail]) => {
        const orders = [];
        wholesale.forEach(doc => orders.push({ id: doc.id, ...doc.data(), type: 'جملة' }));
        retail.forEach(doc => orders.push({ id: doc.id, ...doc.data(), type: 'قطاعي' }));
        orders.sort((a, b) => b.createdAt?.toMillis() - a.createdAt?.toMillis());
        const recent = orders.slice(0, 5);

        if (recent.length === 0) {
          container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">لا توجد طلبات</p>';
          return;
        }

        let html = '';
        const statusLabels = { pending: 'قيد المراجعة', processing: 'تم التحضير', completed: 'مكتمل', cancelled: 'ملغى' };
        const statusClasses = { pending: 'pending', processing: 'processing', completed: 'completed', cancelled: 'cancelled' };

        recent.forEach(order => {
          const status = order.status || 'pending';
          const dateStr = order.createdAt ? formatDate(order.createdAt) : '';
          html += `
            <div class="recent-item">
              <div class="item-info">
                <span class="item-title">${order.customerName || 'عميل'}</span>
                <span class="item-sub">${dateStr} • ${order.type}</span>
              </div>
              <span class="item-status ${statusClasses[status] || 'pending'}">${statusLabels[status] || 'قيد المراجعة'}</span>
            </div>
          `;
        });

        container.innerHTML = html;
      }).catch(() => {
        container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">حدث خطأ في التحميل</p>';
      });
    }

    // ============================================================
    # 📄 آخر الفواتير
    // ============================================================

    function loadRecentInvoices() {
      const container = document.getElementById('recentInvoices');
      if (!container) return;

      Promise.all([
        db.collection('invoices_wholesale').orderBy('createdAt', 'desc').limit(5).get(),
        db.collection('invoices_retail').orderBy('createdAt', 'desc').limit(5).get()
      ]).then(([wholesale, retail]) => {
        const invoices = [];
        wholesale.forEach(doc => invoices.push({ id: doc.id, ...doc.data(), type: 'جملة' }));
        retail.forEach(doc => invoices.push({ id: doc.id, ...doc.data(), type: 'قطاعي' }));
        invoices.sort((a, b) => b.createdAt?.toMillis() - a.createdAt?.toMillis());
        const recent = invoices.slice(0, 5);

        if (recent.length === 0) {
          container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">لا توجد فواتير</p>';
          return;
        }

        let html = '';
        recent.forEach(inv => {
          const dateStr = inv.createdAt ? formatDate(inv.createdAt) : '';
          const total = inv.total || 0;
          html += `
            <div class="recent-item">
              <div class="item-info">
                <span class="item-title">${inv.customerName || 'عميل'}</span>
                <span class="item-sub">${dateStr} • ${inv.type}</span>
              </div>
              <span class="item-value">${total.toFixed(2)} ج.م</span>
            </div>
          `;
        });

        container.innerHTML = html;
      }).catch(() => {
        container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">حدث خطأ في التحميل</p>';
      });
    }

    // ============================================================
    # 🔥 المنتجات الأكثر مبيعاً
    // ============================================================

    function loadTopProducts() {
      const container = document.getElementById('topProducts');
      if (!container) return;

      db.collection('products')
        .orderBy('salesCount', 'desc')
        .limit(5)
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">لا توجد منتجات</p>';
            return;
          }

          let html = '';
          snapshot.forEach(doc => {
            const product = doc.data();
            const sales = product.salesCount || 0;
            html += `
              <div class="recent-item">
                <div class="item-info">
                  <span class="item-title">${product.name}</span>
                  <span class="item-sub">${product.categoryName || 'بدون تصنيف'}</span>
                </div>
                <span class="item-value">${sales} مبيعات</span>
              </div>
            `;
          });

          container.innerHTML = html;
        })
        .catch(() => {
          container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">حدث خطأ في التحميل</p>';
        });
    }

    // ============================================================
    # 🔔 الإشعارات
    // ============================================================

    function loadAdminNotifications() {
      const container = document.getElementById('adminNotifications');
      if (!container) return;

      // جلب إشعارات المديرين من Firebase
      db.collection('admin_notifications')
        .orderBy('createdAt', 'desc')
        .limit(5)
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">لا توجد إشعارات</p>';
            return;
          }

          let html = '';
          const icons = {
            'info': 'fa-info-circle',
            'success': 'fa-check-circle',
            'warning': 'fa-exclamation-triangle',
            'danger': 'fa-times-circle'
          };
          const iconClasses = {
            'info': 'info',
            'success': 'success',
            'warning': 'warning',
            'danger': 'danger'
          };

          snapshot.forEach(doc => {
            const notif = doc.data();
            const type = notif.type || 'info';
            const dateStr = notif.createdAt ? formatDate(notif.createdAt) : '';

            html += `
              <div class="notification-item">
                <div class="notif-icon ${iconClasses[type] || 'info'}">
                  <i class="fas ${icons[type] || 'fa-info-circle'}"></i>
                </div>
                <div class="notif-text">${notif.message || notif.title || 'إشعار'}</div>
                <div class="notif-time">${dateStr}</div>
              </div>
            `;
          });

          container.innerHTML = html;
        })
        .catch(() => {
          container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">حدث خطأ في التحميل</p>';
        });
    }

    // ============================================================
    # 📅 دالة تنسيق التاريخ
    // ============================================================

    function formatDate(timestamp) {
      if (!timestamp) return '';
      try {
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return date.toLocaleDateString('ar-EG', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
      } catch {
        return '';
      }
    }

    // ============================================================
    # 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      // التحقق من صلاحية المدير
      if (typeof protectPage === 'function') {
        if (!protectPage()) return;
      }
      loadDashboard();
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الدعم والمساعدة | أولاد شعلان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
:root {
  --navy: #1a2a4a; --navy-light: #2a3f6a; --navy-dark: #0f1a2e;
  --gold: #c9a84c; --gold-light: #e8d5a3; --gold-dark: #b8942a;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; overscroll-behavior-x: contain; }
body {
  margin: 0; padding: 0;
  font-family: 'Tajawal', sans-serif;
  background: #f5f6fa;
  padding-top: 60px; padding-bottom: 90px;
  min-width: 0;
}

/* ===== Top Bar ===== */
.top-bar {
  position: fixed; top: 0; right: 0; left: 0;
  height: 60px; z-index: 900;
  background: linear-gradient(135deg, var(--navy-dark), var(--navy), var(--navy-light));
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; box-shadow: 0 2px 20px rgba(0,0,0,.25);
}
.top-bar .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 16px; }
.top-bar .brand img { width: 36px; height: 36px; border-radius: 10px; }
.top-bar .back-btn {
  background: rgba(255,255,255,.1); color: #fff; border: 0;
  width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: .2s;
}
.top-bar .back-btn:hover { background: rgba(255,255,255,.2); }

/* ===== Hero Mini ===== */
.hero-mini {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--navy-dark), var(--navy), var(--navy-light));
  padding: 34px 20px 40px;
  text-align: center; color: #fff;
  border-radius: 0 0 28px 28px;
  margin-bottom: 20px;
}
.hero-mini::before {
  content: ''; position: absolute; width: 200px; height: 200px;
  border-radius: 50%; background: radial-gradient(circle, rgba(201,168,76,.35), transparent 70%);
  top: -80px; right: -60px;
}
.hero-mini::after {
  content: ''; position: absolute; width: 160px; height: 160px;
  border-radius: 50%; background: radial-gradient(circle, rgba(201,168,76,.25), transparent 70%);
  bottom: -60px; left: -40px;
}
.hero-mini h1 {
  margin: 0 0 8px; font-size: 24px; font-weight: 900;
  color: var(--gold-light);
  position: relative; z-index: 1;
  animation: text-shine 3s ease-in-out infinite;
}
@keyframes text-shine {
  0%, 100% { text-shadow: 0 0 8px rgba(201,168,76,.4); }
  50% { text-shadow: 0 0 20px rgba(201,168,76,.9); }
}
.hero-mini p {
  margin: 0; font-size: 14px; opacity: .9;
  position: relative; z-index: 1;
}
.hero-mini .hero-icon {
  font-size: 42px; color: var(--gold);
  margin-bottom: 12px; position: relative; z-index: 1;
  animation: bellRing 2.5s ease-in-out infinite;
}
@keyframes bellRing {
  0%, 100%, 20%, 40% { transform: rotate(0deg); }
  10%, 30% { transform: rotate(12deg); }
}

/* ===== Container ===== */
.container { max-width: 900px; margin: 0 auto; padding: 0 14px; }
.section-title {
  font-size: 17px; font-weight: 800; color: var(--navy);
  margin: 22px 0 14px; display: flex; align-items: center; gap: 8px;
}
.section-title i { color: var(--gold); }

/* ===== Quick Contact Cards ===== */
.contact-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
}
.contact-card {
  background: #fff; border-radius: 16px; padding: 16px;
  text-align: center; text-decoration: none; color: var(--navy);
  box-shadow: 0 4px 14px rgba(0,0,0,.06);
  transition: .25s; cursor: pointer; border: 0;
  animation: dropIn .5s ease backwards;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.contact-card:hover { transform: translateY(-4px); box-shadow: 0 8px 22px rgba(0,0,0,.12); }
.contact-card .ico {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 22px;
}
.contact-card .ico.whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); }
.contact-card .ico.email { background: linear-gradient(135deg, #EA4335, #C5221F); }
.contact-card .ico.phone { background: linear-gradient(135deg, var(--navy-light), var(--navy)); }
.contact-card .ico.ticket { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); }
.contact-card h3 { margin: 0; font-size: 14px; font-weight: 700; }
.contact-card p { margin: 0; font-size: 11px; color: #6b7280; }
@keyframes dropIn {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}
.contact-card:nth-child(1) { animation-delay: 0s; }
.contact-card:nth-child(2) { animation-delay: .08s; }
.contact-card:nth-child(3) { animation-delay: .16s; }
.contact-card:nth-child(4) { animation-delay: .24s; }

/* ===== FAQ ===== */
.faq-list { display: flex; flex-direction: column; gap: 10px; }
.faq-item {
  background: #fff; border-radius: 14px; overflow: hidden;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
  transition: .25s;
}
.faq-item.open { box-shadow: 0 6px 20px rgba(26,42,74,.12); }
.faq-q {
  padding: 15px 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 700; color: var(--navy); font-size: 14px;
  user-select: none;
}
.faq-q i {
  color: var(--gold); font-size: 16px;
  transition: .3s;
}
.faq-item.open .faq-q i { transform: rotate(180deg); }
.faq-a {
  max-height: 0; overflow: hidden;
  transition: max-height .35s ease, padding .35s ease;
  padding: 0 16px; color: #4b5563; font-size: 13px; line-height: 1.75;
  background: #fafbfd; border-top: 1px solid transparent;
}
.faq-item.open .faq-a {
  max-height: 320px; padding: 14px 16px;
  border-top-color: #eef0f5;
}

/* ===== My Tickets ===== */
.tickets-list { display: flex; flex-direction: column; gap: 10px; }
.ticket-card {
  background: #fff; border-radius: 14px; padding: 14px 16px;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
  cursor: pointer; transition: .25s;
  border-right: 4px solid var(--gold);
}
.ticket-card:hover { transform: translateX(-4px); box-shadow: 0 6px 18px rgba(0,0,0,.1); }
.ticket-card .row1 {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}
.ticket-card .num { font-weight: 800; color: var(--navy); font-size: 13px; }
.ticket-card .status-pill {
  font-size: 10px; padding: 3px 9px; border-radius: 20px; font-weight: 700;
}
.status-open { background: #fef3c7; color: #92400e; }
.status-processing { background: #dbeafe; color: #1e40af; }
.status-closed { background: #dcfce7; color: #166534; }
.ticket-card .subject { font-size: 14px; font-weight: 600; color: #1f2937; margin: 0 0 4px; }
.ticket-card .meta { font-size: 11px; color: #9ca3af; }
.empty-state {
  text-align: center; padding: 30px 14px; color: #9ca3af;
}
.empty-state i { font-size: 40px; color: #e5e7eb; margin-bottom: 10px; display: block; }

/* ===== CTA Open Ticket ===== */
.cta-open {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 16px; border-radius: 16px; border: 0;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #fff; font-weight: 800; font-size: 15px;
  cursor: pointer; box-shadow: 0 6px 18px rgba(201,168,76,.35);
  transition: .25s; margin-top: 8px;
}
.cta-open:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(201,168,76,.5); }
.cta-open i { font-size: 18px; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,26,46,.7);
  display: none; align-items: center; justify-content: center;
  z-index: 2000; padding: 14px;
  backdrop-filter: blur(6px);
}
.modal-overlay.active { display: flex; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: #fff; border-radius: 20px; width: 100%; max-width: 500px;
  max-height: 90vh; overflow-y: auto;
  animation: slideUp .3s ease;
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-head {
  background: linear-gradient(135deg, var(--navy-dark), var(--navy));
  color: #fff; padding: 18px 20px;
  border-radius: 20px 20px 0 0;
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 5;
}
.modal-head h3 { margin: 0; font-size: 16px; font-weight: 800; }
.modal-head .close {
  background: rgba(255,255,255,.15); border: 0; color: #fff;
  width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
}
.modal-body { padding: 20px; }
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 700; color: var(--navy);
  margin-bottom: 6px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 11px 13px; border: 1.5px solid #e5e7eb;
  border-radius: 10px; font-family: inherit; font-size: 14px;
  color: var(--navy); outline: none; transition: .2s;
  background: #fafbfd;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--gold); background: #fff;
}
.form-group textarea { resize: vertical; min-height: 90px; }
.form-group input[type="file"] { padding: 8px; font-size: 12px; }
.btn-primary {
  width: 100%; padding: 13px; border-radius: 12px; border: 0;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #fff; font-weight: 800; font-size: 15px;
  cursor: pointer; transition: .25s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(201,168,76,.4); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }

/* ===== Ticket Detail ===== */
.ticket-detail-head {
  background: linear-gradient(135deg, var(--navy-dark), var(--navy));
  color: #fff; padding: 18px;
  border-radius: 20px 20px 0 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 10px;
}
.ticket-detail-head .close {
  background: rgba(255,255,255,.15); border: 0; color: #fff;
  width: 32px; height: 32px; border-radius: 10px; cursor: pointer;
  flex-shrink: 0;
}
.ticket-detail-head .tkt-num {
  font-size: 12px; color: var(--gold-light); font-weight: 700;
  margin-bottom: 4px;
}
.ticket-detail-head h3 { margin: 0; font-size: 15px; font-weight: 800; }
.timeline {
  padding: 8px 0;
}
.tl-item {
  display: flex; gap: 12px; padding: 10px 0; position: relative;
}
.tl-item::before {
  content: ''; position: absolute;
  right: 15px; top: 30px; bottom: -10px;
  width: 2px; background: #e5e7eb;
}
.tl-item:last-child::before { display: none; }
.tl-dot {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; z-index: 1;
}
.tl-dot.user { background: #dbeafe; color: #1e40af; }
.tl-dot.admin { background: var(--gold-light); color: var(--gold-dark); }
.tl-dot.sys { background: #e5e7eb; color: #6b7280; }
.tl-body { flex: 1; min-width: 0; }
.tl-body .who { font-size: 12px; font-weight: 800; color: var(--navy); }
.tl-body .when { font-size: 10px; color: #9ca3af; margin-right: 6px; }
.tl-body .txt {
  font-size: 13px; color: #374151; margin-top: 4px;
  background: #f9fafb; padding: 8px 12px; border-radius: 10px;
  line-height: 1.6; word-wrap: break-word;
}
.reply-box {
  display: flex; gap: 8px; margin-top: 12px;
}
.reply-box input {
  flex: 1; padding: 11px 13px; border: 1.5px solid #e5e7eb;
  border-radius: 10px; font-family: inherit; font-size: 14px;
  outline: none; transition: .2s;
}
.reply-box input:focus { border-color: var(--gold); }
.reply-box button {
  padding: 0 16px; border-radius: 10px; border: 0;
  background: var(--gold); color: #fff; font-weight: 700;
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; gap: 6px;
}
.reply-box button:hover { background: var(--gold-dark); }
.attachment-thumb {
  max-width: 100%; max-height: 200px; border-radius: 10px;
  margin-top: 8px; cursor: pointer;
  border: 1px solid #e5e7eb;
}

/* ===== Bottom Mobile Tabs ===== */
.bottom-tabs {
  position: fixed; bottom: 0; right: 0; left: 0;
  background: #fff; box-shadow: 0 -4px 20px rgba(0,0,0,.08);
  display: flex; justify-content: space-around; align-items: center;
  padding: 8px 0 max(8px, env(safe-area-inset-bottom));
  z-index: 800; border-top: 1px solid #f0f0f5;
}
.bottom-tabs a {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: #9ca3af; text-decoration: none; font-size: 10px;
  font-weight: 700; padding: 4px 10px; border-radius: 10px;
  transition: .2s; min-width: 60px;
}
.bottom-tabs a i { font-size: 18px; }
.bottom-tabs a.active { color: var(--gold); }
.bottom-tabs a.active i { transform: translateY(-2px); }

/* ===== Toast ===== */
.toast-wrap {
  position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
  z-index: 3000; display: flex; flex-direction: column; gap: 8px;
  pointer-events: none; width: 90%; max-width: 400px;
}
.toast {
  background: var(--navy); color: #fff; padding: 12px 16px;
  border-radius: 12px; font-size: 13px; font-weight: 700;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
  display: flex; align-items: center; gap: 10px;
  animation: toastIn .3s ease;
}
.toast.success { background: linear-gradient(135deg, #22c55e, #16a34a); }
.toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
.toast.warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
.toast.info { background: linear-gradient(135deg, var(--navy), var(--navy-light)); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Footer Bar ===== */
.rights-bar {
  text-align: center; padding: 20px 14px 10px;
  color: #9ca3af; font-size: 11px;
}
@media (min-width: 640px) {
  .contact-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>

/* =============================================
   support.html — Page Logic
   ============================================= */
const IMGBB_API_KEY = "cb056b7fd83c81129d5468c5d03287b4";
let _currentUser = null;
let _currentTicketId = null;
let _currentTicketDoc = null;
let _unsubTickets = null;

const FAQ_DATA = [
  { q: "إزاي أتابع طلبي؟", a: "من صفحة 'طلباتي' أو من صفحة التتبع على الرابط tracking.html مع رقم الطلب. هتشوف حالة الطلب خطوة بخطوة." },
  { q: "إيه الحد الأدنى لطلب الجملة؟", a: "الحد الأدنى لفاتورة الجملة 1500 ج.م. لو أقل من كده النظام مش هيسمح بإتمام الطلب." },
  { q: "مواعيد التوصيل إيه؟", a: "التوصيل داخل طنطا خلال 24-48 ساعة. المنصورة والمحلة خلال 2-4 أيام عمل. مواعيد العمل من 9 صباحاً لـ 10 مساءً." },
  { q: "الشحن بيوصل امتى ومجاني إمتى؟", a: "الشحن مجاني للجملة عند 5000 ج.م (طنطا/المنصورة) أو 2000 ج.م (المحلة). للقطاعي مجاني عند 2500 ج.م." },
  { q: "أقدر أرجّع منتج؟", a: "الاستبدال والإرجاع متاح خلال 3 أيام من الاستلام لو المنتج تالف أو غير مطابق. بشرط عدم فتح العبوة وسلامة المنتج." },
  { q: "إزاي أحصل على كود تاجر؟", a: "تواصل معنا على الواتساب وهنراجع طلبك. بعد الموافقة هنبعتلك كود فريد تستخدمه في trader-login.html للدخول." },
  { q: "طرق الدفع المتاحة إيه؟", a: "كاش عند الاستلام، تحويل بنكي، محفظة إلكترونية (فودافون كاش/انستاباي). للتجار يوجد نظام آجل." },
  { q: "إزاي أبلّغ عن سداد؟", a: "من صفحة 'رصيدي' في حسابك، اضغط 'أبلغ عن سداد' وارفع صورة الإيصال. الأدمن هيراجع ويخصم من الرصيد تلقائياً." }
];

/* ===== Boot ===== */
document.addEventListener('DOMContentLoaded', () => {
  loadCurrentUser();
  renderFAQ();
  setupEventListeners();
  if (_currentUser) {
    document.getElementById('myTicketsSection').style.display = 'block';
    loadMyTickets();
  }
});

function loadCurrentUser() {
  try {
    const admin = JSON.parse(localStorage.getItem('admin') || 'null');
    const customer = JSON.parse(localStorage.getItem('customer') || 'null');
    const cashier = JSON.parse(localStorage.getItem('cashier') || 'null');
    _currentUser = admin || customer || cashier || null;
  } catch (e) { _currentUser = null; }
}

function renderFAQ() {
  const wrap = document.getElementById('faqList');
  wrap.innerHTML = FAQ_DATA.map((item, i) => `
    <div class="faq-item" data-idx="${i}">
      <div class="faq-q">
        <span>${escapeHtml(item.q)}</span>
        <i class="fas fa-chevron-down"></i>
      </div>
      <div class="faq-a">${escapeHtml(item.a)}</div>
    </div>
  `).join('');
  wrap.querySelectorAll('.faq-item').forEach(el => {
    el.querySelector('.faq-q').addEventListener('click', () => {
      const isOpen = el.classList.contains('open');
      wrap.querySelectorAll('.faq-item').forEach(x => x.classList.remove('open'));
      if (!isOpen) el.classList.add('open');
    });
  });
}

function setupEventListeners() {
  document.getElementById('ticketModal').addEventListener('click', e => {
    if (e.target.id === 'ticketModal') closeTicketModal();
  });
  document.getElementById('viewTicketModal').addEventListener('click', e => {
    if (e.target.id === 'viewTicketModal') closeViewTicket();
  });
  document.getElementById('vtReplyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendReply();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeTicketModal();
      closeViewTicket();
    }
  });
}

/* ===== Create Ticket ===== */
function openTicketModal() {
  if (!_currentUser) {
    showToast('سجل دخول أولاً لفتح تذكرة', 'warning');
    setTimeout(() => location.href = 'login.html', 1200);
    return;
  }
  document.getElementById('ticketModal').classList.add('active');
}

function closeTicketModal() {
  document.getElementById('ticketModal').classList.remove('active');
}

async function submitTicket() {
  const btn = document.getElementById('submitTicketBtn');
  const category = document.getElementById('ticketCategory').value;
  const priority = document.getElementById('ticketPriority').value;
  const subject = document.getElementById('ticketSubject').value.trim();
  const details = document.getElementById('ticketDetails').value.trim();
  const file = document.getElementById('ticketAttachment').files[0];

  if (!subject || subject.length < 3) { showToast('اكتب موضوع واضح للتذكرة', 'warning'); return; }
  if (!details || details.length < 10) { showToast('اكتب تفاصيل كافية (10 حروف على الأقل)', 'warning'); return; }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';

  try {
    let attachmentUrl = '';
    if (file) {
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري رفع المرفق...';
      attachmentUrl = await uploadToImgBB(file);
    }

    const ticketNumber = 'TKT-' + String(Date.now()).slice(-6) + Math.floor(Math.random()*90+10);
    const now = firebase.firestore.FieldValue.serverTimestamp();

    const ticketData = {
      ticketNumber,
      senderId: _currentUser.id || _currentUser.uid || 'unknown',
      senderName: _currentUser.name || 'مستخدم',
      senderRole: _currentUser.role || 'retail',
      senderPhone: _currentUser.phone || '',
      senderCode: _currentUser.code || '',
      category,
      priority,
      subject,
      details,
      attachments: attachmentUrl ? [attachmentUrl] : [],
      status: 'open',
      replies: [{
        by: _currentUser.id || _currentUser.uid || 'unknown',
        byName: _currentUser.name || 'مستخدم',
        byRole: _currentUser.role || 'retail',
        text: details,
        at: new Date().toISOString(),
        isInitial: true
      }],
      rating: 0,
      createdAt: now,
      updatedAt: now,
      lastReplyAt: now
    };

    const ref = await db.collection('support_tickets').add(ticketData);

    // Notify admins
    await db.collection('admin_notifications').add({
      title: 'تذكرة دعم جديدة',
      message: `${ticketData.senderName} فتح تذكرة ${ticketNumber} — ${subject}`,
      type: 'support_ticket',
      ticketId: ref.id,
      priority,
      read: false,
      createdAt: now
    }).catch(() => {});

    showToast(`تم إرسال التذكرة ${ticketNumber} ✅`, 'success');
    document.getElementById('ticketSubject').value = '';
    document.getElementById('ticketDetails').value = '';
    document.getElementById('ticketAttachment').value = '';
    document.getElementById('ticketCategory').value = 'complaint';
    document.getElementById('ticketPriority').value = 'normal';
    closeTicketModal();

  } catch (err) {
    console.error(err);
    showToast('فشل الإرسال: ' + (err.message || 'خطأ غير معروف'), 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال التذكرة';
  }
}

/* ===== Upload to ImgBB ===== */
async function uploadToImgBB(file) {
  let compressed = file;
  try {
    compressed = await imageCompression(file, { maxSizeMB: 1, maxWidthOrHeight: 1400, useWebWorker: true });
  } catch(e) {}
  const fd = new FormData();
  fd.append('image', compressed);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
  const data = await res.json();
  if (!data.success) throw new Error('فشل رفع الصورة');
  return data.data.url;
}

/* ===== Load My Tickets ===== */
function loadMyTickets() {
  const uid = _currentUser.id || _currentUser.uid;
  if (!uid) return;
  if (_unsubTickets) _unsubTickets();

  _unsubTickets = db.collection('support_tickets')
    .where('senderId', '==', uid)
    .onSnapshot(snap => {
      const tickets = [];
      snap.forEach(d => tickets.push({ id: d.id, ...d.data() }));
      tickets.sort((a, b) => {
        const ta = a.createdAt?.toMillis?.() || 0;
        const tb = b.createdAt?.toMillis?.() || 0;
        return tb - ta;
      });
      renderMyTickets(tickets);
    }, err => {
      console.error('loadMyTickets error:', err);
    });
}

function renderMyTickets(tickets) {
  const wrap = document.getElementById('myTicketsList');
  if (!tickets.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-inbox"></i>
        مفيش تذاكر لسه — لو محتاج مساعدة اضغط "افتح تذكرة دعم"
      </div>`;
    return;
  }
  wrap.innerHTML = tickets.map(t => `
    <div class="ticket-card" onclick="viewTicket('${t.id}')">
      <div class="row1">
        <span class="num">${escapeHtml(t.ticketNumber || '')}</span>
        <span class="status-pill status-${t.status}">${statusArabic(t.status)}</span>
      </div>
      <p class="subject">${escapeHtml(t.subject || '')}</p>
      <div class="meta">
        ${categoryArabic(t.category)} • ${relativeTime(t.createdAt)} • ${(t.replies?.length || 0)} رد
      </div>
    </div>
  `).join('');
}

/* ===== View Ticket ===== */
function viewTicket(ticketId) {
  _currentTicketId = ticketId;
  document.getElementById('viewTicketModal').classList.add('active');
  document.getElementById('vtTimeline').innerHTML = '<div style="text-align:center;padding:20px;color:#9ca3af;"><i class="fas fa-spinner fa-spin"></i></div>';

  db.collection('support_tickets').doc(ticketId).onSnapshot(doc => {
    if (!doc.exists) return;
    _currentTicketDoc = { id: doc.id, ...doc.data() };
    renderTicketDetail(_currentTicketDoc);
  });
}

function renderTicketDetail(t) {
  document.getElementById('vtNumber').textContent = t.ticketNumber || '';
  document.getElementById('vtSubject').textContent = t.subject || '';
  const st = document.getElementById('vtStatus');
  st.className = 'status-pill status-' + t.status;
  st.textContent = statusArabic(t.status);
  document.getElementById('vtMeta').innerHTML =
    `${categoryArabic(t.category)} • أولوية: ${priorityArabic(t.priority)} • ${relativeTime(t.createdAt)}`;

  // Timeline
  const replies = (t.replies || []).slice().sort((a, b) => new Date(a.at) - new Date(b.at));
  const tl = document.getElementById('vtTimeline');
  tl.innerHTML = replies.map(r => {
    const isAdmin = ['super','admin_plus','admin','cashier'].includes(r.byRole) && !r.isInitial;
    const cls = r.isInitial ? 'user' : (isAdmin ? 'admin' : 'user');
    const icon = r.isInitial ? 'fa-user' : (isAdmin ? 'fa-shield-alt' : 'fa-user');
    return `
      <div class="tl-item">
        <div class="tl-dot ${cls}"><i class="fas ${icon}"></i></div>
        <div class="tl-body">
          <span class="who">${escapeHtml(r.byName || '—')}</span>
          <span class="when">${relativeTime(r.at)}</span>
          <div class="txt">${escapeHtml(r.text || '').replace(/\n/g,'<br>')}</div>
        </div>
      </div>
    `;
  }).join('');

  // Attachment (if initial had one)
  if (t.attachments && t.attachments.length) {
    tl.innerHTML += `
      <div class="tl-item">
        <div class="tl-dot sys"><i class="fas fa-paperclip"></i></div>
        <div class="tl-body">
          <span class="who">مرفق</span>
          <div style="margin-top:6px;">
            <img src="${t.attachments[0]}" class="attachment-thumb" onclick="window.open('${t.attachments[0]}','_blank')">
          </div>
        </div>
      </div>
    `;
  }

  // Reply box: disabled if closed
  const rb = document.getElementById('vtReplyBox');
  if (t.status === 'closed') {
    rb.innerHTML = '<div style="text-align:center;color:#9ca3af;font-size:12px;padding:8px;">التذكرة مغلقة — افتح تذكرة جديدة لو محتاج متابعة</div>';
  } else {
    rb.innerHTML = `
      <input type="text" id="vtReplyInput" placeholder="اكتب ردك..." maxlength="800">
      <button onclick="sendReply()"><i class="fas fa-paper-plane"></i></button>
    `;
    document.getElementById('vtReplyInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendReply();
    });
  }
}

function closeViewTicket() {
  document.getElementById('viewTicketModal').classList.remove('active');
  _currentTicketId = null;
  _currentTicketDoc = null;
}

/* ===== Send Reply ===== */
async function sendReply() {
  if (!_currentTicketId || !_currentTicketDoc) return;
  const input = document.getElementById('vtReplyInput');
  const text = (input?.value || '').trim();
  if (!text) return;
  if (_currentTicketDoc.status === 'closed') { showToast('التذكرة مغلقة', 'warning'); return; }

  input.disabled = true;
  try {
    const newReply = {
      by: _currentUser.id || _currentUser.uid,
      byName: _currentUser.name || 'مستخدم',
      byRole: _currentUser.role || 'retail',
      text,
      at: new Date().toISOString(),
      isInitial: false
    };
    await db.collection('support_tickets').doc(_currentTicketId).update({
      replies: firebase.firestore.FieldValue.arrayUnion(newReply),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastReplyAt: firebase.firestore.FieldValue.serverTimestamp(),
      status: 'processing'
    });
    input.value = '';
    showToast('تم إرسال ردك', 'success');
  } catch (err) {
    console.error(err);
    showToast('فشل الإرسال', 'error');
  } finally {
    input.disabled = false;
  }
}

/* ===== Helpers ===== */
function statusArabic(s) {
  return { open: 'مفتوحة', processing: 'جاري المعالجة', closed: 'مغلقة' }[s] || s;
}
function categoryArabic(c) {
  return { complaint: 'شكوى', inquiry: 'استفسار', request: 'طلب', suggestion: 'اقتراح', financial: 'مشكلة مالية' }[c] || c;
}
function priorityArabic(p) {
  return { normal: 'عادية', high: 'مهمة', urgent: 'عاجلة' }[p] || p;
}
function relativeTime(ts) {
  if (!ts) return '';
  let d;
  if (typeof ts === 'string') d = new Date(ts);
  else if (ts.toDate) d = ts.toDate();
  else if (ts.seconds) d = new Date(ts.seconds * 1000);
  else return '';
  const diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return 'الآن';
  if (diff < 3600) return `منذ ${Math.floor(diff/60)} دقيقة`;
  if (diff < 86400) return `منذ ${Math.floor(diff/3600)} ساعة`;
  if (diff < 604800) return `منذ ${Math.floor(diff/86400)} يوم`;
  return d.toLocaleDateString('ar-EG');
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg, type = 'info') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
  el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(-10px)'; setTimeout(() => el.remove(), 300); }, 3200);
}
</script>

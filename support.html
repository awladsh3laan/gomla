<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدعم والمساعدة - أولاد شعلان</title>
  <meta name="description" content="الدعم والمساعدة - أولاد شعلان للمنظفات والورقيات">
  <meta name="theme-color" content="#1a2a4a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.0/dist/browser-image-compression.js"></script>

  <style>
    /* ============================================================
       🛡️ منع السكرول الأفقي
       ============================================================ */
    html, body { overflow-x: hidden !important; max-width: 100vw; }
    .page-content, .page-content .container { overflow-x: hidden; min-width: 0; max-width: 100%; }

    /* ============================================================
       🎨 رأس الصفحة (نفس نمط ft-header بألوان navy/gold)
       ============================================================ */
    .support-header {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 50%, var(--navy-light) 100%);
      border-radius: var(--radius-lg);
      padding: 26px 24px;
      margin-bottom: 20px;
      color: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(15, 26, 46, 0.35);
      border-bottom: 4px solid var(--gold);
    }
    .support-header::before {
      content: '';
      position: absolute;
      top: -50%; right: -15%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(201,168,76,.28) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }
    .support-header-content {
      position: relative; z-index: 1;
      display: flex; align-items: center;
      gap: 16px; flex-wrap: wrap;
    }
    .support-header-content .header-icon {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(201,168,76,.5);
      animation: pulse 2s ease-in-out infinite;
    }
    .support-header-content .header-text { flex: 1; min-width: 200px; }
    .support-header-content .header-text h1 {
      font-size: 1.4rem; font-weight: 900;
      margin-bottom: 4px; color: var(--white);
    }
    .support-header-content .header-text p {
      font-size: 0.85rem; opacity: 0.9;
      color: rgba(255,255,255,0.9); margin: 0;
    }
    .support-header-content .header-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,.15);
      color: var(--gold-light);
      border: 1px solid rgba(201,168,76,.5);
      border-radius: var(--radius-full);
      font-size: 0.75rem; font-weight: 800;
      backdrop-filter: blur(10px);
    }
    .support-header-content .header-badge i { color: var(--gold); }

    /* ============================================================
       📞 كروت التواصل السريع
       ============================================================ */
    .contact-quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .contact-quick-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 18px 14px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      border: 2px solid var(--gray-200);
      transition: var(--transition);
      cursor: pointer;
      text-decoration: none;
      color: var(--navy);
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      font-family: inherit;
    }
    .contact-quick-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold);
    }
    .contact-quick-card .ico {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: var(--white); font-size: 1.4rem;
      transition: var(--transition);
    }
    .contact-quick-card:hover .ico { transform: scale(1.1) rotate(-6deg); }
    .contact-quick-card .ico.whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); }
    .contact-quick-card .ico.email { background: linear-gradient(135deg, #EA4335, #C5221F); }
    .contact-quick-card .ico.phone { background: linear-gradient(135deg, var(--navy-light), var(--navy)); }
    .contact-quick-card .ico.ticket { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); }
    .contact-quick-card h4 {
      margin: 0; font-size: 0.9rem; font-weight: 800;
      color: var(--navy);
    }
    .contact-quick-card p {
      margin: 0; font-size: 0.72rem;
      color: var(--gray-500);
    }

    /* ============================================================
       🎫 كارت التذكرة
       ============================================================ */
    .tickets-list {
      display: flex; flex-direction: column; gap: 10px;
    }
    .ticket-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      min-width: 0;
    }
    .ticket-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 5px; height: 100%;
      background: var(--gold);
    }
    .ticket-card.status-open::before { background: linear-gradient(180deg, #f59e0b, #d97706); }
    .ticket-card.status-processing::before { background: linear-gradient(180deg, #3b82f6, #1e40af); }
    .ticket-card.status-closed::before { background: linear-gradient(180deg, #22c55e, #16a34a); }
    .ticket-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold-light);
    }
    .ticket-card .ticket-row1 {
      display: flex; justify-content: space-between;
      align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .ticket-card .ticket-num {
      font-family: 'Courier New', monospace;
      font-size: 0.82rem; font-weight: 900;
      color: var(--navy); letter-spacing: 0.5px;
      direction: ltr;
    }
    .ticket-card .ticket-subject {
      font-size: 0.95rem; font-weight: 800;
      color: var(--navy); margin: 0 0 6px;
      overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ticket-card .ticket-meta {
      display: flex; flex-wrap: wrap; gap: 6px;
      font-size: 0.72rem; color: var(--gray-500);
      align-items: center;
    }
    .ticket-card .ticket-meta i { color: var(--gold); }

    /* ============================================================
       📖 الأسئلة الشائعة
       ============================================================ */
    .faq-list {
      display: flex; flex-direction: column; gap: 10px;
    }
    .faq-item {
      background: var(--white);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      transition: var(--transition);
    }
    .faq-item.open {
      box-shadow: var(--shadow-md);
      border-color: var(--gold-light);
    }
    .faq-q {
      padding: 16px 18px;
      cursor: pointer;
      display: flex; align-items: center;
      justify-content: space-between;
      font-weight: 700; color: var(--navy);
      font-size: 0.92rem;
      user-select: none;
      gap: 10px;
    }
    .faq-q i {
      color: var(--gold);
      transition: var(--transition);
      flex-shrink: 0;
    }
    .faq-item.open .faq-q i { transform: rotate(180deg); }
    .faq-a {
      max-height: 0; overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease;
      padding: 0 18px;
      color: var(--gray-600);
      font-size: 0.88rem;
      line-height: 1.8;
      background: var(--gray-50);
      border-top: 1px solid transparent;
    }
    .faq-item.open .faq-a {
      max-height: 400px;
      padding: 14px 18px;
      border-top-color: var(--gray-200);
    }

    /* ============================================================
       🎫 Modal التذكرة
       ============================================================ */
    .ticket-modal-header {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      padding: 18px 22px;
      display: flex; align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      position: sticky; top: 0; z-index: 10;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .ticket-modal-header .tkt-num {
      font-family: 'Courier New', monospace;
      font-size: 0.78rem; color: var(--gold-light);
      font-weight: 800; letter-spacing: 0.5px;
      margin-bottom: 4px; direction: ltr; text-align: right;
    }
    .ticket-modal-header h3 {
      margin: 0; font-size: 1rem; font-weight: 900;
      line-height: 1.4;
    }

    /* Timeline */
    .timeline { padding: 8px 0; margin-bottom: 12px; }
    .tl-item {
      display: flex; gap: 12px;
      padding: 10px 0; position: relative;
    }
    .tl-item::before {
      content: ''; position: absolute;
      right: 16px; top: 34px; bottom: -10px;
      width: 2px; background: var(--gray-200);
    }
    .tl-item:last-child::before { display: none; }
    .tl-dot {
      width: 34px; height: 34px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; z-index: 1;
      border: 3px solid var(--white);
      box-shadow: var(--shadow-sm);
    }
    .tl-dot.user { background: #dbeafe; color: #1e40af; }
    .tl-dot.admin { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--navy); }
    .tl-dot.sys { background: var(--gray-200); color: var(--gray-600); }
    .tl-body { flex: 1; min-width: 0; }
    .tl-body .who {
      font-size: 0.82rem; font-weight: 800;
      color: var(--navy); margin-left: 6px;
    }
    .tl-body .when {
      font-size: 0.7rem; color: var(--gray-400);
    }
    .tl-body .txt {
      font-size: 0.85rem; color: var(--gray-700);
      margin-top: 6px;
      background: var(--gray-50);
      padding: 10px 14px; border-radius: var(--radius-sm);
      line-height: 1.7;
      word-wrap: break-word;
      border: 1px solid var(--gray-200);
    }
    .tl-body .txt.admin-reply {
      background: #fcf9f0;
      border-color: var(--gold-light);
    }
    .attachment-thumb {
      max-width: 100%;
      max-height: 220px;
      border-radius: var(--radius-sm);
      margin-top: 8px;
      cursor: pointer;
      border: 1px solid var(--gray-200);
      transition: var(--transition);
    }
    .attachment-thumb:hover { opacity: 0.9; }

    /* Reply Box */
    .reply-box {
      display: flex; gap: 8px;
      margin-top: 12px;
      padding-top: 14px;
      border-top: 2px dashed var(--gray-200);
    }
    .reply-box input {
      flex: 1; padding: 11px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--gray-50);
      outline: none; transition: var(--transition);
      min-width: 0;
    }
    .reply-box input:focus {
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(201,168,76,.15);
    }
    .reply-box button {
      padding: 0 18px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--gold-dark);
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--white);
      font-weight: 800;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      font-family: inherit;
      transition: var(--transition);
      white-space: nowrap;
    }
    .reply-box button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(201,168,76,.4);
    }

    /* ============================================================
       📱 Responsive
       ============================================================ */
    @media (max-width: 768px) and (pointer: coarse) {
      .support-header { padding: 20px 18px; border-radius: var(--radius-md); }
      .support-header-content .header-icon { width: 52px; height: 52px; font-size: 1.3rem; }
      .support-header-content .header-text h1 { font-size: 1.1rem; }
      .support-header-content .header-text p { font-size: 0.75rem; }
      .support-header-content .header-badge { font-size: 0.68rem; padding: 4px 10px; }

      .contact-quick-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .contact-quick-card { padding: 14px 10px; }
      .contact-quick-card .ico { width: 44px; height: 44px; font-size: 1.2rem; }
      .contact-quick-card h4 { font-size: 0.82rem; }
      .contact-quick-card p { font-size: 0.68rem; }

      .ticket-card { padding: 12px 14px; }
      .ticket-card .ticket-subject { font-size: 0.88rem; }
      .faq-q { padding: 13px 15px; font-size: 0.85rem; }
      .faq-a { font-size: 0.82rem; }

      .ticket-modal-header { padding: 14px 16px; }
      .ticket-modal-header h3 { font-size: 0.92rem; }
      .reply-box { flex-direction: column; }
      .reply-box button { padding: 11px; justify-content: center; }
    }
    @media (max-width: 480px) {
      .contact-quick-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

      <div class="section-card" style="padding:16px;">

      <button class="btn btn-gold w-100" style="margin-bottom:20px;font-size:1rem;padding:14px 24px;" onclick="openTicketModal()">

      <!-- تذاكري -->
      <div id="myTicketsSection" style="display:none;">

            <h3 style="font-size:1.05rem;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;margin:0;">
              <i class="fas fa-ticket-alt" style="color:var(--gold);"></i>

  <!-- 📱 التبويبات السفلى + الفوتر + السايدبار -->

  <!-- ============================================================ -->
  <!-- 📚 Firebase & JS -->
  <!-- ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 support.html — الدعم والمساعدة
    // ============================================================

    let _currentUser = null;
    let _unsubTickets = null;
    let _currentTicketId = null;
    let _currentTicketDoc = null;
    let _unsubTicketDoc = null;

    const FAQ_DATA = [
      { q: "إزاي أتابع طلبي؟", a: "من صفحة 'طلباتي' أو من صفحة التتبع مع رقم الطلب. هتشوف حالة الطلب خطوة بخطوة (قيد المراجعة → جاري التحضير → تم الشحن → تم التسليم)." },
      { q: "إيه الحد الأدنى لطلب الجملة؟", a: "الحد الأدنى لفاتورة الجملة 1500 ج.م. لو أقل من كده النظام مش هيسمح بإتمام الطلب." },
      { q: "مواعيد التوصيل إيه؟", a: "التوصيل داخل طنطا خلال 24-48 ساعة. المنصورة والمحلة خلال 2-4 أيام عمل. مواعيد العمل من 9 صباحاً لـ 10 مساءً." },
      { q: "الشحن مجاني إمتى؟", a: "للجملة: مجاني عند 5000 ج.م (طنطا/المنصورة) أو 2000 ج.م (المحلة). للقطاعي: مجاني عند 2500 ج.م." },
      { q: "أقدر أرجّع منتج؟", a: "الاستبدال والإرجاع متاح خلال 3 أيام من الاستلام لو المنتج تالف أو غير مطابق. بشرط عدم فتح العبوة وسلامة المنتج." },
      { q: "إزاي أحصل على كود تاجر؟", a: "تواصل معنا على الواتساب وهنراجع طلبك. بعد الموافقة هنبعتلك كود فريد تستخدمه في صفحة دخول التجار." },
      { q: "طرق الدفع المتاحة إيه؟", a: "كاش عند الاستلام، تحويل بنكي، محفظة إلكترونية (فودافون كاش / انستاباي). للتجار يوجد نظام آجل." },
      { q: "إزاي أبلّغ عن سداد؟", a: "من صفحة 'رصيدي' في حسابك، اضغط 'أبلغ عن سداد' وارفع صورة الإيصال. الأدمن هيراجع ويخصم من الرصيد تلقائياً." }
    ];

    // ============================================================
    // 🚀 Init
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      _currentUser = (typeof getCurrentUser === 'function') ? getCurrentUser() : null;

      renderFAQ();
      setupListeners();

      // لو مسجل → اعرض تذاكره
      if (_currentUser && _currentUser.data) {
        document.getElementById('myTicketsSection').style.display = 'block';
        loadMyTickets();
      }
    });

    // ============================================================
    // 📖 FAQ
    // ============================================================
    function renderFAQ() {
      const wrap = document.getElementById('faqList');
      if (!wrap) return;
      wrap.innerHTML = FAQ_DATA.map((item, i) => `
        <div class="faq-item" data-idx="${i}">
          <div class="faq-q">
            <span>${escapeHtml(item.q)}</span>
            <i class="fas fa-chevron-down"></i>
          </div>
          <div class="faq-a">${escapeHtml(item.a)}</div>
        </div>
      `).join('');

      wrap.querySelectorAll('.faq-item').forEach(el => {
        el.querySelector('.faq-q').addEventListener('click', () => {
          const isOpen = el.classList.contains('open');
          wrap.querySelectorAll('.faq-item').forEach(x => x.classList.remove('open'));
          if (!isOpen) el.classList.add('open');
        });
      });
    }

    // ============================================================
    // 🎫 Modal: فتح/إغلاق
    // ============================================================
    function openTicketModal() {
      if (!_currentUser || !_currentUser.data) {
        if (typeof showToast === 'function') {
          showToast('⚠️ سجل دخول أولاً لفتح تذكرة', 'warning');
        }
        setTimeout(() => {
          window.location.href = '/gomla/login.html';
        }, 1300);
        return;
      }

      const modalHtml = `
        <div class="modal-overlay show" id="ticketModal" onclick="closeTicketModal(event)">
          <div class="modal-content medium" onclick="event.stopPropagation()">

            <div class="modal-header">
              <h3>
                <i class="fas fa-ticket-alt"></i>
                تذكرة دعم جديدة
              </h3>
              <button class="modal-close" onclick="closeTicketModal()">
                <i class="fas fa-times"></i>
              </button>
            </div>

            <div class="modal-body">

              <div class="form-row">
                <div class="form-group">
                  <label>التصنيف <span class="required">*</span></label>
                  <select id="ticketCategory">
                    <option value="complaint">شكوى</option>
                    <option value="inquiry">استفسار</option>
                    <option value="request">طلب</option>
                    <option value="suggestion">اقتراح</option>
                    <option value="financial">مشكلة مالية</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>الأولوية <span class="required">*</span></label>
                  <select id="ticketPriority">
                    <option value="normal">عادية</option>
                    <option value="high">مهمة</option>
                    <option value="urgent">عاجلة 🔥</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label>الموضوع <span class="required">*</span></label>
                <input type="text" id="ticketSubject" placeholder="مثال: تأخير في الطلب #1234" maxlength="120">
              </div>

              <div class="form-group">
                <label>التفاصيل <span class="required">*</span></label>
                <textarea id="ticketDetails" placeholder="اشرح المشكلة بالتفصيل..." maxlength="1500"></textarea>
                <div class="help-text">
                  <i class="fas fa-info-circle"></i>
                  اكتب 10 حروف على الأقل
                </div>
              </div>

              <div class="form-group">
                <label>مرفق (اختياري — صورة إيصال / منتج)</label>
                <input type="file" id="ticketAttachment" accept="image/*" style="padding:10px;">
                <div class="help-text">
                  <i class="fas fa-image"></i>
                  سيتم ضغط الصورة تلقائياً قبل الرفع
                </div>
                <div class="upload-progress" id="uploadProgress">
                  <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                  </div>
                  <div class="progress-text" id="progressText">0%</div>
                </div>
              </div>

            </div>

            <div class="modal-actions">
              <button class="btn btn-outline" onclick="closeTicketModal()">
                <i class="fas fa-times"></i>
                إلغاء
              </button>
              <button class="btn btn-gold" id="submitTicketBtn" onclick="submitTicket()">
                <i class="fas fa-paper-plane"></i>
                إرسال التذكرة
              </button>
            </div>

          </div>
        </div>
      `;

      const existing = document.getElementById('ticketModal');
      if (existing) existing.remove();

      document.body.insertAdjacentHTML('beforeend', modalHtml);
      document.body.style.overflow = 'hidden';
    }

    function closeTicketModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const modal = document.getElementById('ticketModal');
      if (modal) modal.remove();
      document.body.style.overflow = '';
    }

    // ============================================================
    // 📤 إرسال التذكرة
    // ============================================================
    async function submitTicket() {
      const btn = document.getElementById('submitTicketBtn');
      const category = document.getElementById('ticketCategory').value;
      const priority = document.getElementById('ticketPriority').value;
      const subject = document.getElementById('ticketSubject').value.trim();
      const details = document.getElementById('ticketDetails').value.trim();
      const fileInput = document.getElementById('ticketAttachment');
      const file = fileInput && fileInput.files ? fileInput.files[0] : null;

      if (!subject || subject.length < 3) {
        showToast('⚠️ اكتب موضوع واضح للتذكرة', 'warning');
        return;
      }
      if (!details || details.length < 10) {
        showToast('⚠️ اكتب تفاصيل كافية (10 حروف على الأقل)', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';

      try {
        let attachmentUrl = '';
        if (file) {
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري رفع المرفق...';
          const progress = document.getElementById('uploadProgress');
          if (progress) progress.style.display = 'block';

          attachmentUrl = await uploadImage(file, (percent) => {
            const fill = document.getElementById('progressFill');
            const txt = document.getElementById('progressText');
            if (fill) fill.style.width = percent + '%';
            if (txt) txt.textContent = percent + '%';
          }) || '';
        }

        const ticketNumber = 'TKT-' + String(Date.now()).slice(-6) + Math.floor(Math.random() * 90 + 10);
        const now = firebase.firestore.FieldValue.serverTimestamp();
        const userData = _currentUser.data || {};
        const uid = userData.uid || userData.id || _currentUser.uid || _currentUser.id;

        const ticketData = {
          ticketNumber,
          senderId: uid,
          senderName: userData.name || 'مستخدم',
          senderRole: userData.role || 'retail',
          senderPhone: userData.phone || '',
          senderCode: userData.code || '',
          category,
          priority,
          subject,
          details,
          attachments: attachmentUrl ? [attachmentUrl] : [],
          status: 'open',
          replies: [{
            by: uid,
            byName: userData.name || 'مستخدم',
            byRole: userData.role || 'retail',
            text: details,
            at: new Date().toISOString(),
            isInitial: true
          }],
          rating: 0,
          createdAt: now,
          updatedAt: now,
          lastReplyAt: now
        };

        const ref = await db.collection('support_tickets').add(ticketData);

        // إشعار للأدمن
        try {
          await db.collection('admin_notifications').add({
            title: 'تذكرة دعم جديدة',
            body: `${userData.name || 'مستخدم'} فتح تذكرة ${ticketNumber} — ${subject}`,
            message: `${userData.name || 'مستخدم'} فتح تذكرة ${ticketNumber} — ${subject}`,
            type: 'support_ticket',
            ticketId: ref.id,
            priority,
            read: false,
            createdAt: now
          });
        } catch (e) { console.warn('admin_notification failed', e); }

        showToast(`✅ تم إرسال التذكرة ${ticketNumber}`, 'success');
        closeTicketModal();
        loadMyTickets();

      } catch (err) {
        console.error(err);
        showToast('❌ فشل الإرسال: ' + (err.message || 'خطأ غير معروف'), 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال التذكرة';
      }
    }

    // ============================================================
    // 📥 تحميل تذاكري
    // ============================================================
    function loadMyTickets() {
      const userData = _currentUser && _currentUser.data;
      const uid = userData && (userData.uid || userData.id);
      if (!uid) return;

      if (_unsubTickets) _unsubTickets();

      const wrap = document.getElementById('myTicketsList');
      if (wrap) {
        wrap.innerHTML = `<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>`;
      }

      _unsubTickets = db.collection('support_tickets')
        .where('senderId', '==', uid)
        .onSnapshot(snap => {
          const tickets = [];
          snap.forEach(d => tickets.push({ id: d.id, ...d.data() }));
          tickets.sort((a, b) => {
            const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
            const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
            return tb - ta;
          });
          renderMyTickets(tickets);
        }, err => {
          console.error('loadMyTickets:', err);
          if (wrap) {
            wrap.innerHTML = `<div class="empty-state" style="padding:30px 14px;"><i class="fas fa-exclamation-triangle"></i><p>تعذر تحميل التذاكر</p></div>`;
          }
        });
    }

    function renderMyTickets(tickets) {
      const wrap = document.getElementById('myTicketsList');
      if (!wrap) return;

      if (!tickets.length) {
        wrap.innerHTML = `
          <div class="empty-state" style="padding:30px 14px;">
            <i class="fas fa-inbox"></i>
            <p>مفيش تذاكر لسه — اضغط "افتح تذكرة دعم"</p>
          </div>`;
        return;
      }

      wrap.innerHTML = tickets.map(t => `
        <div class="ticket-card status-${t.status}" onclick="viewTicket('${t.id}')">
          <div class="ticket-row1">
            <span class="ticket-num">${escapeHtml(t.ticketNumber || '')}</span>
            <span class="status-badge ${t.status}">${statusArabic(t.status)}</span>
          </div>
          <p class="ticket-subject">${escapeHtml(t.subject || '')}</p>
          <div class="ticket-meta">
            <i class="fas fa-tag"></i>
            <span>${categoryArabic(t.category)}</span>
            <span>•</span>
            <i class="fas fa-clock"></i>
            <span>${relativeTime(t.createdAt)}</span>
            <span>•</span>
            <i class="fas fa-comments"></i>
            <span>${(t.replies && t.replies.length) || 0} رد</span>
          </div>
        </div>
      `).join('');
    }

    // ============================================================
    // 👁️ عرض تفاصيل تذكرة
    // ============================================================
    function viewTicket(ticketId) {
      _currentTicketId = ticketId;

      if (_unsubTicketDoc) _unsubTicketDoc();

      const modalHtml = `
        <div class="modal-overlay show" id="viewTicketModal" onclick="closeViewTicket(event)">
          <div class="modal-content medium" onclick="event.stopPropagation()">
            <div class="ticket-modal-header">
              <div style="min-width:0;">
                <div class="tkt-num" id="vtNum">—</div>
                <h3 id="vtSubject">—</h3>
              </div>
              <button class="modal-close" onclick="closeViewTicket()">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="modal-body">
              <div style="margin-bottom:12px;font-size:0.8rem;color:var(--gray-500);display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
                <span id="vtStatus" class="status-badge"></span>
                <span id="vtMeta"></span>
              </div>
              <div class="timeline" id="vtTimeline">
                <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
              </div>
              <div id="vtReplyWrap"></div>
            </div>
          </div>
        </div>
      `;

      const existing = document.getElementById('viewTicketModal');
      if (existing) existing.remove();

      document.body.insertAdjacentHTML('beforeend', modalHtml);
      document.body.style.overflow = 'hidden';

      _unsubTicketDoc = db.collection('support_tickets').doc(ticketId).onSnapshot(doc => {
        if (!doc.exists) { closeViewTicket(); return; }
        _currentTicketDoc = { id: doc.id, ...doc.data() };
        renderTicketDetail(_currentTicketDoc);
      });
    }

    function renderTicketDetail(t) {
      const numEl = document.getElementById('vtNum');
      const subjEl = document.getElementById('vtSubject');
      const stEl = document.getElementById('vtStatus');
      const metaEl = document.getElementById('vtMeta');
      const tlEl = document.getElementById('vtTimeline');
      const replyWrap = document.getElementById('vtReplyWrap');

      if (numEl) numEl.textContent = t.ticketNumber || '';
      if (subjEl) subjEl.textContent = t.subject || '';
      if (stEl) {
        stEl.className = 'status-badge ' + t.status;
        stEl.textContent = statusArabic(t.status);
      }
      if (metaEl) {
        metaEl.innerHTML = `${categoryArabic(t.category)} • أولوية: ${priorityArabic(t.priority)} • ${relativeTime(t.createdAt)}`;
      }

      // Timeline
      const replies = (t.replies || []).slice().sort((a, b) => new Date(a.at) - new Date(b.at));
      let tlHtml = replies.map(r => {
        const adminRoles = ['super', 'admin_plus', 'admin', 'cashier'];
        const isAdmin = adminRoles.includes(r.byRole) && !r.isInitial;
        const cls = r.isInitial ? 'user' : (isAdmin ? 'admin' : 'user');
        const icon = r.isInitial ? 'fa-user' : (isAdmin ? 'fa-shield-alt' : 'fa-user');
        const txtCls = isAdmin ? 'txt admin-reply' : 'txt';
        return `
          <div class="tl-item">
            <div class="tl-dot ${cls}"><i class="fas ${icon}"></i></div>
            <div class="tl-body">
              <div>
                <span class="who">${escapeHtml(r.byName || '—')}</span>
                <span class="when">${relativeTime(r.at)}</span>
              </div>
              <div class="${txtCls}">${escapeHtml(r.text || '').replace(/\n/g, '<br>')}</div>
            </div>
          </div>
        `;
      }).join('');

      if (t.attachments && t.attachments.length) {
        tlHtml += `
          <div class="tl-item">
            <div class="tl-dot sys"><i class="fas fa-paperclip"></i></div>
            <div class="tl-body">
              <span class="who">مرفق من المرسل</span>
              <div style="margin-top:6px;">
                <img src="${t.attachments[0]}" class="attachment-thumb"
                     onclick="window.open('${t.attachments[0]}','_blank')"
                     onerror="this.style.display='none'">
              </div>
            </div>
          </div>
        `;
      }
      if (tlEl) tlEl.innerHTML = tlHtml;

      // Reply box
      if (replyWrap) {
        if (t.status === 'closed') {
          replyWrap.innerHTML = `
            <div style="text-align:center;padding:12px;color:var(--gray-500);font-size:0.82rem;background:var(--gray-50);border-radius:var(--radius-sm);margin-top:10px;">
              <i class="fas fa-lock"></i>
              التذكرة مغلقة — افتح تذكرة جديدة لو محتاج متابعة
            </div>
          `;
        } else {
          replyWrap.innerHTML = `
            <div class="reply-box">
              <input type="text" id="vtReplyInput" placeholder="اكتب ردك..." maxlength="800">
              <button onclick="sendReply()">
                <i class="fas fa-paper-plane"></i>
                رد
              </button>
            </div>
          `;
          const input = document.getElementById('vtReplyInput');
          if (input) {
            input.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') sendReply();
            });
          }
        }
      }
    }

    function closeViewTicket(event) {
      if (event && event.target !== event.currentTarget) return;
      if (_unsubTicketDoc) { _unsubTicketDoc(); _unsubTicketDoc = null; }
      const modal = document.getElementById('viewTicketModal');
      if (modal) modal.remove();
      document.body.style.overflow = '';
      _currentTicketId = null;
      _currentTicketDoc = null;
    }

    // ============================================================
    // 📨 إرسال رد
    // ============================================================
    async function sendReply() {
      if (!_currentTicketId || !_currentTicketDoc) return;
      const input = document.getElementById('vtReplyInput');
      const text = (input && input.value ? input.value : '').trim();
      if (!text) return;
      if (_currentTicketDoc.status === 'closed') {
        showToast('⚠️ التذكرة مغلقة', 'warning');
        return;
      }

      input.disabled = true;
      try {
        const userData = _currentUser.data || {};
        const uid = userData.uid || userData.id || _currentUser.uid || _currentUser.id;

        const newReply = {
          by: uid,
          byName: userData.name || 'مستخدم',
          byRole: userData.role || 'retail',
          text,
          at: new Date().toISOString(),
          isInitial: false
        };

        await db.collection('support_tickets').doc(_currentTicketId).update({
          replies: firebase.firestore.FieldValue.arrayUnion(newReply),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          lastReplyAt: firebase.firestore.FieldValue.serverTimestamp(),
          status: 'processing'
        });

        input.value = '';
        showToast('✅ تم إرسال ردك', 'success');
      } catch (err) {
        console.error(err);
        showToast('❌ فشل الإرسال', 'error');
      } finally {
        if (input) input.disabled = false;
      }
    }

    // ============================================================
    // 🛠️ Helpers
    // ============================================================
    function statusArabic(s) {
      return { open: 'مفتوحة', processing: 'جاري المعالجة', closed: 'مغلقة' }[s] || s;
    }
    function categoryArabic(c) {
      return {
        complaint: 'شكوى', inquiry: 'استفسار', request: 'طلب',
        suggestion: 'اقتراح', financial: 'مشكلة مالية'
      }[c] || c;
    }
    function priorityArabic(p) {
      return { normal: 'عادية', high: 'مهمة', urgent: 'عاجلة' }[p] || p;
    }
    function relativeTime(ts) {
      if (!ts) return '';
      let d;
      if (typeof ts === 'string') d = new Date(ts);
      else if (ts.toDate) d = ts.toDate();
      else if (ts.seconds) d = new Date(ts.seconds * 1000);
      else return '';
      const diff = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diff < 60) return 'الآن';
      if (diff < 3600) return `منذ ${Math.floor(diff / 60)} د`;
      if (diff < 86400) return `منذ ${Math.floor(diff / 3600)} س`;
      if (diff < 604800) return `منذ ${Math.floor(diff / 86400)} ي`;
      return d.toLocaleDateString('ar-EG');
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function setupListeners() {
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeTicketModal();
          closeViewTicket();
        }
      });
    }

    // تصدير عالمي
    window.openTicketModal = openTicketModal;
    window.closeTicketModal = closeTicketModal;
    window.submitTicket = submitTicket;
    window.viewTicket = viewTicket;
    window.closeViewTicket = closeViewTicket;
    window.sendReply = sendReply;
    window.loadMyTickets = loadMyTickets;
  </script>
</body>
</html>

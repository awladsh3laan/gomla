<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أولاد شعلان جملة - متجر الجملة</title>

  <!-- ===== SEO ===== -->
  <meta name="description" content="متجر الجملة - أولاد شعلان جملة">
  <meta name="theme-color" content="#1a2a4a">

  <!-- ===== Font Awesome ===== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- ===== Google Font ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- ===== الستايل الموحد ===== -->

  <!-- ============================================================ -->
  <!-- 🎨 ستايل خاص بالمتجر                                          -->
  <!-- ============================================================ -->
  <style>
    /* ===== السلايدر ===== */
    .slider-container {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      background: var(--gray-100);
    }

    .slider-track {
      display: flex;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .slider-item {
      min-width: 100%;
      position: relative;
    }

    .slider-item img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }

    .slider-item .slider-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      color: white;
      padding: 40px 24px 20px;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      transition: var(--transition-base);
      font-size: 1.2rem;
      z-index: 10;
    }

    .slider-btn:hover {
      background: rgba(0, 0, 0, 0.7);
    }

    .slider-btn.prev { right: 12px; }
    .slider-btn.next { left: 12px; }

    .slider-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .slider-dots .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gray-300);
      cursor: pointer;
      transition: var(--transition-base);
    }

    .slider-dots .dot.active {
      background: var(--gold);
      width: 28px;
      border-radius: 20px;
    }

    /* ===== البحث الذكي ===== */
    .smart-search {
      margin-bottom: 24px;
    }

    .smart-search .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--white);
      border-radius: var(--radius-full);
      padding: 4px 20px 4px 4px;
      box-shadow: var(--shadow-sm);
      border: 2px solid transparent;
      transition: var(--transition-base);
    }

    .smart-search .search-wrapper:focus-within {
      border-color: var(--gold);
      box-shadow: var(--shadow-md);
    }

    .smart-search .search-wrapper i {
      color: var(--gray-400);
      font-size: 1.1rem;
      margin-left: 12px;
    }

    .smart-search .search-wrapper input {
      flex: 1;
      border: none;
      padding: 14px 0;
      font-size: 1rem;
      font-family: inherit;
      background: transparent;
      outline: none;
      color: var(--gray-800);
    }

    .smart-search .search-wrapper input::placeholder {
      color: var(--gray-400);
    }

    .smart-search .search-wrapper .search-btn {
      background: var(--gold);
      color: var(--navy);
      border: none;
      padding: 10px 24px;
      border-radius: var(--radius-full);
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-base);
      font-family: inherit;
    }

    .smart-search .search-wrapper .search-btn:hover {
      background: var(--gold-light);
      transform: scale(1.02);
    }

    .search-suggestions {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      left: 0;
      background: var(--white);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 100;
    }

    .search-suggestions.show {
      display: block;
    }

    .search-suggestions .suggestion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      cursor: pointer;
      transition: var(--transition-base);
      border-bottom: 1px solid var(--gray-100);
    }

    .search-suggestions .suggestion-item:hover {
      background: var(--gray-50);
    }

    .search-suggestions .suggestion-item img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: var(--radius-sm);
    }

    /* ===== الأقسام الأفقية ===== */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-header h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-header h2 i {
      color: var(--gold);
    }

    .section-header .view-all {
      font-size: 0.85rem;
      color: var(--gray-400);
      text-decoration: none;
      transition: var(--transition-base);
    }

    .section-header .view-all:hover {
      color: var(--gold);
    }

    .horizontal-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 8px 4px 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .horizontal-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .horizontal-scroll::-webkit-scrollbar-track {
      background: var(--gray-100);
      border-radius: var(--radius-full);
    }

    .horizontal-scroll::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: var(--radius-full);
    }

    .horizontal-scroll .product-card {
      min-width: 200px;
      max-width: 220px;
      flex-shrink: 0;
    }

    .horizontal-scroll .brand-card {
      min-width: 140px;
      max-width: 160px;
      flex-shrink: 0;
      text-align: center;
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-base);
      cursor: pointer;
    }

    .horizontal-scroll .brand-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .horizontal-scroll .brand-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 8px;
      display: block;
    }

    .horizontal-scroll .brand-card .brand-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* ===== العروض ===== */
    .offer-card {
      position: relative;
      min-width: 220px;
      max-width: 240px;
      flex-shrink: 0;
    }

    .offer-card .offer-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #ef4444;
      color: white;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      z-index: 5;
    }

    .offer-card .price-before {
      text-decoration: line-through;
      color: var(--gray-400);
      font-size: 0.85rem;
      margin-left: 8px;
    }

    .offer-card .price-after {
      color: var(--gold);
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* ===== التصنيفات (شبكة) ===== */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .category-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 20px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: var(--transition-base);
      border: 2px solid transparent;
    }

    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold);
    }

    .category-card img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 8px;
      display: block;
    }

    .category-card h4 {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .category-card span {
      font-size: 0.75rem;
      color: var(--gray-400);
    }

    /* ===== منتجات الشاشة الرئيسية ===== */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    /* ===== استجابة ===== */
    @media (max-width: 768px) {
      .slider-item img { height: 200px; }
      .slider-btn { width: 34px; height: 34px; font-size: 0.9rem; }
      .horizontal-scroll .product-card { min-width: 160px; max-width: 180px; }
      .horizontal-scroll .brand-card { min-width: 110px; max-width: 130px; }
      .horizontal-scroll .brand-card img { width: 60px; height: 60px; }
      .offer-card { min-width: 170px; max-width: 190px; }
      .categories-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .smart-search .search-wrapper { flex-wrap: wrap; padding: 8px 16px; }
      .smart-search .search-wrapper .search-btn { width: 100%; justify-content: center; margin-top: 8px; }
    }

    @media (max-width: 480px) {
      .slider-item img { height: 150px; }
      .slider-item .slider-caption { font-size: 0.9rem; padding: 20px 16px 12px; }
      .horizontal-scroll .product-card { min-width: 140px; max-width: 160px; }
      .horizontal-scroll .brand-card { min-width: 90px; max-width: 110px; }
      .horizontal-scroll .brand-card img { width: 50px; height: 50px; }
      .offer-card { min-width: 150px; max-width: 170px; }
      .categories-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .section-header h2 { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="page-content">
    <div class="container">

      <section class="slider-container" id="sliderContainer">

          <div class="slider-item">

      <section class="offers-section">

 -->
  <script>
    // ============================================================
    // 🏪 متجر الجملة - store-wholesale.html
    // ============================================================

    // ===== استخدام آمن لـ db =====

    // ===== متغيرات عامة =====
    let allProducts = [];
    let currentPage = 0;
    const pageSize = 12;
    let searchTimeout;

    // ============================================================
    // 🖼️ السلايدر
    // ============================================================

    function loadSlider() {
      const track = document.getElementById('sliderTrack');
      const dotsContainer = document.getElementById('sliderDots');
      if (!track || !dotsContainer) return;

      db.collection('slider')
        .where('active', '==', true)
        .orderBy('order')
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            track.innerHTML = `
              <div class="slider-item">
                <div class="slide-placeholder" style="display:flex;align-items:center;justify-content:center;height:350px;background:var(--gray-100);color:var(--gray-400);font-size:1.1rem;">
                  <i class="fas fa-image" style="margin-left:8px;"></i> لا توجد صور في السلايدر
                </div>
              </div>
            `;
            return;
          }

          let slidesHtml = '';
          let dotsHtml = '';
          let index = 0;

          snapshot.forEach(doc => {
            const slide = doc.data();
            slidesHtml += `
              <div class="slider-item">
                <img src="${slide.imageUrl}" alt="${slide.title || 'صورة'}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'slide-placeholder\\' style=\\'display:flex;align-items:center;justify-content:center;height:350px;background:var(--gray-100);color:var(--gray-400);font-size:1.1rem;\\'><i class=\\'fas fa-image\\' style=\\'margin-left:8px;\\'></i> صورة غير متاحة</div>'">
                ${slide.title ? `<div class="slider-caption">${slide.title}</div>` : ''}
              </div>
            `;
            dotsHtml += `<span class="dot" data-index="${index}"></span>`;
            index++;
          });

          track.innerHTML = slidesHtml;
          dotsContainer.innerHTML = dotsHtml;

          // تفعيل النقاط
          document.querySelectorAll('.dot').forEach((dot, i) => {
            dot.addEventListener('click', () => goToSlide(i));
          });

          // بدء التشغيل التلقائي
          startSlider();
        })
        .catch(error => {
          console.error('Error loading slider:', error);
          track.innerHTML = `
            <div class="slider-item">
              <div class="slide-placeholder" style="display:flex;align-items:center;justify-content:center;height:350px;background:var(--gray-100);color:#ef4444;font-size:1.1rem;">
                <i class="fas fa-exclamation-triangle" style="margin-left:8px;"></i> حدث خطأ في تحميل السلايدر
              </div>
            </div>
          `;
        });
    }

    let slideIndex = 0;
    let slideInterval;

    function startSlider() {
      if (slideInterval) clearInterval(slideInterval);
      const total = document.querySelectorAll('.slider-item').length;
      if (total <= 1) return;

      slideInterval = setInterval(() => {
        slideIndex = (slideIndex + 1) % total;
        updateSlider();
      }, 5000);
    }

    function goToSlide(index) {
      slideIndex = index;
      updateSlider();
      startSlider();
    }

    function updateSlider() {
      const track = document.getElementById('sliderTrack');
      const dots = document.querySelectorAll('.dot');
      if (!track) return;

      const total = document.querySelectorAll('.slider-item').length;
      if (total === 0) return;

      track.style.transform = `translateX(${slideIndex * 100}%)`;

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === slideIndex);
      });
    }

    function slidePrev() {
      const total = document.querySelectorAll('.slider-item').length;
      if (total <= 1) return;
      slideIndex = (slideIndex - 1 + total) % total;
      updateSlider();
      startSlider();
    }

    function slideNext() {
      const total = document.querySelectorAll('.slider-item').length;
      if (total <= 1) return;
      slideIndex = (slideIndex + 1) % total;
      updateSlider();
      startSlider();
    }

    // ============================================================
    // 📦 تحميل المنتجات (جملة)
    // ============================================================

    function loadProducts() {
      db.collection('products')
        .where('available', '==', true)
        .orderBy('createdAt', 'desc')
        .limit(pageSize)
        .get()
        .then(snapshot => {
          allProducts = [];
          snapshot.forEach(doc => {
            allProducts.push({ id: doc.id, ...doc.data() });
          });
          renderProducts(allProducts);
          if (allProducts.length >= pageSize) {
            document.getElementById('loadMoreBtn').style.display = 'inline-block';
          }
        })
        .catch(error => {
          console.error('Error loading products:', error);
          document.getElementById('allProducts').innerHTML = `
            <div class="error-state" style="grid-column:1/-1;text-align:center;padding:40px;color:#ef4444;">
              <i class="fas fa-exclamation-triangle" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
              حدث خطأ في تحميل المنتجات
            </div>
          `;
        });
    }

    function renderProducts(products) {
      const container = document.getElementById('allProducts');
      if (!container) return;

      if (products.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray-400);">
            <i class="fas fa-box-open" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
            لا توجد منتجات متاحة حالياً
          </div>
        `;
        return;
      }

      let html = '';
      products.forEach(product => {
        const price = product.wholesalePrice || product.price || 0;
        const unit = product.unit || 'كرتونة';
        const brandName = product.brandName || '';

        html += `
          <div class="product-card" onclick="openProductModal('${product.id}')">
            <img src="${product.imageUrl || 'assets/images/no-image.png'}" alt="${product.name}" class="product-image" onerror="this.src='assets/images/no-image.png'">
            <div class="product-body">
              <h4 class="product-name">${product.name}</h4>
              ${brandName ? `<p class="product-brand">${brandName}</p>` : ''}
              <div class="product-price">${price.toFixed(2)} ج.م <small>/ ${unit}</small></div>
              <div class="product-actions">
                <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();addToCart('${product.id}')">
                  <i class="fas fa-cart-plus"></i> أضف للسلة
                </button>
                ${product.minOrder ? `<span style="font-size:0.7rem;color:var(--gray-400);">الحد الأدنى: ${product.minOrder}</span>` : ''}
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function loadMoreProducts() {
      currentPage++;
      const start = currentPage * pageSize;
      const end = start + pageSize;

      db.collection('products')
        .where('available', '==', true)
        .orderBy('createdAt', 'desc')
        .limit(end)
        .get()
        .then(snapshot => {
          const newProducts = [];
          snapshot.forEach(doc => {
            newProducts.push({ id: doc.id, ...doc.data() });
          });

          const additional = newProducts.slice(start);
          allProducts = [...allProducts, ...additional];

          if (additional.length > 0) {
            const container = document.getElementById('allProducts');
            let html = container.innerHTML;
            additional.forEach(product => {
              const price = product.wholesalePrice || product.price || 0;
              const unit = product.unit || 'كرتونة';
              const brandName = product.brandName || '';
              html += `
                <div class="product-card" onclick="openProductModal('${product.id}')">
                  <img src="${product.imageUrl || 'assets/images/no-image.png'}" alt="${product.name}" class="product-image" onerror="this.src='assets/images/no-image.png'">
                  <div class="product-body">
                    <h4 class="product-name">${product.name}</h4>
                    ${brandName ? `<p class="product-brand">${brandName}</p>` : ''}
                    <div class="product-price">${price.toFixed(2)} ج.م <small>/ ${unit}</small></div>
                    <div class="product-actions">
                      <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();addToCart('${product.id}')">
                        <i class="fas fa-cart-plus"></i> أضف للسلة
                      </button>
                      ${product.minOrder ? `<span style="font-size:0.7rem;color:var(--gray-400);">الحد الأدنى: ${product.minOrder}</span>` : ''}
                    </div>
                  </div>
                </div>
              `;
            });
            container.innerHTML = html;
          }

          if (newProducts.length >= end) {
            document.getElementById('loadMoreBtn').style.display = 'inline-block';
          } else {
            document.getElementById('loadMoreBtn').style.display = 'none';
          }
        })
        .catch(error => {
          console.error('Error loading more products:', error);
          showToast('❌ حدث خطأ في تحميل المزيد', 'error');
        });
    }

    // ============================================================
    // 🆕 أحدث المنتجات (عرض أفقي)
    // ============================================================

    function loadLatestProducts() {
      const container = document.getElementById('latestProducts');
      if (!container) return;

      db.collection('products')
        .where('available', '==', true)
        .orderBy('createdAt', 'desc')
        .limit(10)
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">لا توجد منتجات</p>';
            return;
          }

          let html = '';
          snapshot.forEach(doc => {
            const product = doc.data();
            const price = product.wholesalePrice || product.price || 0;
            const unit = product.unit || 'كرتونة';
            html += `
              <div class="product-card" onclick="openProductModal('${doc.id}')">
                <img src="${product.imageUrl || 'assets/images/no-image.png'}" alt="${product.name}" class="product-image" onerror="this.src='assets/images/no-image.png'">
                <div class="product-body">
                  <h4 class="product-name">${product.name}</h4>
                  <div class="product-price">${price.toFixed(2)} ج.م <small>/ ${unit}</small></div>
                  <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();addToCart('${doc.id}')">
                    <i class="fas fa-cart-plus"></i>
                  </button>
                </div>
              </div>
            `;
          });

          container.innerHTML = html;
          autoScroll(container);
        })
        .catch(error => {
          console.error('Error loading latest products:', error);
          container.innerHTML = '<p style="color:#ef4444;text-align:center;padding:12px;">حدث خطأ</p>';
        });
    }

    // ============================================================
    // 🏷️ البراندات
    // ============================================================

    function loadBrands() {
      const container = document.getElementById('brandsContainer');
      if (!container) return;

      db.collection('brands')
        .orderBy('name')
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">لا توجد براندات</p>';
            return;
          }

          let html = '';
          snapshot.forEach(doc => {
            const brand = doc.data();
            const logo = brand.logo || 'assets/images/no-image.png';
            html += `
              <div class="brand-card" onclick="filterByBrand('${doc.id}')">
                <img src="${logo}" alt="${brand.name}" onerror="this.src='assets/images/no-image.png'">
                <div class="brand-name">${brand.name}</div>
              </div>
            `;
          });

          container.innerHTML = html;
          autoScroll(container);
        })
        .catch(error => {
          console.error('Error loading brands:', error);
          container.innerHTML = '<p style="color:#ef4444;text-align:center;padding:12px;">حدث خطأ</p>';
        });
    }

    // ============================================================
    // 🎯 العروض (جملة)
    // ============================================================

    function loadOffers() {
      const container = document.getElementById('offersContainer');
      if (!container) return;

      db.collection('offers')
        .where('active', '==', true)
        .where('type', '==', 'wholesale')
        .orderBy('createdAt', 'desc')
        .limit(8)
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">لا توجد عروض حالياً</p>';
            return;
          }

          const productIds = [];
          snapshot.forEach(doc => productIds.push(doc.data().productId));

          if (productIds.length === 0) {
            container.innerHTML = '<p style="color:var(--gray-400);text-align:center;padding:12px;">لا توجد عروض</p>';
            return;
          }

          db.collection('products')
            .where('available', '==', true)
            .get()
            .then(productsSnapshot => {
              const products = {};
              productsSnapshot.forEach(doc => {
                products[doc.id] = { id: doc.id, ...doc.data() };
              });

              let html = '';
              snapshot.forEach(doc => {
                const offer = doc.data();
                const product = products[offer.productId];
                if (!product) return;

                const originalPrice = product.wholesalePrice || product.price || 0;
                const discount = offer.discount || 0;
                const priceAfterDiscount = originalPrice * (1 - discount / 100);
                const unit = product.unit || 'كرتونة';

                html += `
                  <div class="product-card offer-card" onclick="openProductModal('${product.id}')">
                    <div class="offer-badge">خصم ${discount}%</div>
                    <img src="${product.imageUrl || 'assets/images/no-image.png'}" alt="${product.name}" class="product-image" onerror="this.src='assets/images/no-image.png'">
                    <div class="product-body">
                      <h4 class="product-name">${product.name}</h4>
                      <div class="product-price">
                        <span class="price-after">${priceAfterDiscount.toFixed(2)} ج.م</span>
                        <span class="price-before">${originalPrice.toFixed(2)} ج.م</span>
                      </div>
                      <span style="font-size:0.7rem;color:var(--gray-400);">/${unit}</span>
                      <button class="btn btn-gold btn-sm" onclick="event.stopPropagation();addToCart('${product.id}')">
                        <i class="fas fa-cart-plus"></i>
                      </button>
                    </div>
                  </div>
                `;
              });

              container.innerHTML = html;
              autoScroll(container);
            });
        })
        .catch(error => {
          console.error('Error loading offers:', error);
          container.innerHTML = '<p style="color:#ef4444;text-align:center;padding:12px;">حدث خطأ</p>';
        });
    }

    // ============================================================
    // 📂 التصنيفات
    // ============================================================

    function loadCategories() {
      const container = document.getElementById('categoriesContainer');
      if (!container) return;

      db.collection('categories')
        .orderBy('name')
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            container.innerHTML = `
              <div class="empty-state" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray-400);">
                <i class="fas fa-folder-open" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
                لا توجد تصنيفات
              </div>
            `;
            return;
          }

          let html = '';
          snapshot.forEach(doc => {
            const cat = doc.data();
            const image = cat.imageUrl || 'assets/images/no-image.png';
            const count = cat.productCount || 0;
            html += `
              <div class="category-card" onclick="filterByCategory('${doc.id}')">
                <img src="${image}" alt="${cat.name}" onerror="this.src='assets/images/no-image.png'">
                <h4>${cat.name}</h4>
                <span>${count} منتج</span>
              </div>
            `;
          });

          container.innerHTML = html;
        })
        .catch(error => {
          console.error('Error loading categories:', error);
          container.innerHTML = `
            <div class="error-state" style="grid-column:1/-1;text-align:center;padding:40px;color:#ef4444;">
              <i class="fas fa-exclamation-triangle" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
              حدث خطأ في تحميل التصنيفات
            </div>
          `;
        });
    }

    // ============================================================
    // 🔍 البحث الذكي
    // ============================================================

    function handleSearch(value) {
      const suggestions = document.getElementById('searchSuggestions');
      if (!suggestions) return;

      clearTimeout(searchTimeout);

      if (value.length < 2) {
        suggestions.classList.remove('show');
        return;
      }

      searchTimeout = setTimeout(() => {
        db.collection('products')
          .where('available', '==', true)
          .limit(5)
          .get()
          .then(snapshot => {
            const results = [];
            const searchTerm = value.toLowerCase();
            snapshot.forEach(doc => {
              const product = doc.data();
              if (product.name.toLowerCase().includes(searchTerm) ||
                  (product.brandName && product.brandName.toLowerCase().includes(searchTerm))) {
                results.push({ id: doc.id, ...product });
              }
            });

            if (results.length === 0) {
              suggestions.innerHTML = `<div class="suggestion-item" style="color:var(--gray-400);">لا توجد نتائج</div>`;
              suggestions.classList.add('show');
              return;
            }

            let html = '';
            results.forEach(product => {
              const price = product.wholesalePrice || product.price || 0;
              html += `
                <div class="suggestion-item" onclick="selectProduct('${product.id}')">
                  <img src="${product.imageUrl || 'assets/images/no-image.png'}" onerror="this.src='assets/images/no-image.png'">
                  <div>
                    <div style="font-weight:600;">${product.name}</div>
                    <div style="font-size:0.8rem;color:var(--gold);">${price.toFixed(2)} ج.م</div>
                  </div>
                </div>
              `;
            });

            suggestions.innerHTML = html;
            suggestions.classList.add('show');
          })
          .catch(error => {
            console.error('Search error:', error);
          });
      }, 300);
    }

    function searchProducts() {
      const input = document.getElementById('searchInput');
      const value = input.value.trim();
      if (value.length > 1) {
        handleSearch(value);
      }
    }

    function selectProduct(productId) {
      document.getElementById('searchInput').value = '';
      document.getElementById('searchSuggestions').classList.remove('show');
      openProductModal(productId);
    }

    // ============================================================
    // 🛒 إضافة للسلة (جملة)
    // ============================================================

    function addToCart(productId) {
      const user = getCurrentUser();
      if (!user) {
        showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
      }

      // التحقق من أن المستخدم تاجر أو مسؤول
      if (user.type === 'customer' && user.data.type !== 'wholesale') {
        showToast('⚠️ هذا المتجر مخصص لتجار الجملة فقط', 'warning');
        return;
      }

      db.collection('products').doc(productId).get()
        .then(doc => {
          if (!doc.exists) {
            showToast('❌ المنتج غير موجود', 'error');
            return;
          }

          const product = doc.data();
          const userId = user.data.id || user.data.uid;

          // التحقق من الحد الأقصى
          return db.collection('cart')
            .where('userId', '==', userId)
            .where('productId', '==', productId)
            .get()
            .then(snapshot => {
              const existingQty = snapshot.empty ? 0 : (snapshot.docs[0].data().quantity || 0);
              if (product.maxOrder && existingQty >= product.maxOrder) {
                showToast(`⚠️ الحد الأقصى للطلب هو ${product.maxOrder}`, 'warning');
                return;
              }

              if (snapshot.empty) {
                return db.collection('cart').add({
                  userId: userId,
                  productId: productId,
                  quantity: 1,
                  unit: product.unit || 'كرتونة',
                  price: product.wholesalePrice || product.price || 0,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              } else {
                const doc = snapshot.docs[0];
                return db.collection('cart').doc(doc.id).update({
                  quantity: (doc.data().quantity || 0) + 1
                });
              }
            });
        })
        .then(() => {
          showToast('✅ تم إضافة المنتج للسلة', 'success');
          updateCartBadge();
        })
        .catch(error => {
          console.error('Error adding to cart:', error);
          showToast('❌ حدث خطأ', 'error');
        });
    }

    // ============================================================
    // 📦 فتح نافذة المنتج
    // ============================================================

    function openProductModal(productId) {
      showToast('سيتم فتح تفاصيل المنتج قريباً', 'info');
      // يمكن إضافة نافذة منبثقة لاحقاً
    }

    // ============================================================
    // 🔄 السكرول التلقائي
    // ============================================================

    function autoScroll(container) {
      let scrollInterval;
      let isHovering = false;

      container.addEventListener('mouseenter', () => { isHovering = true; });
      container.addEventListener('mouseleave', () => { isHovering = false; });

      const startAutoScroll = () => {
        if (scrollInterval) clearInterval(scrollInterval);
        scrollInterval = setInterval(() => {
          if (!isHovering && container.scrollWidth > container.clientWidth) {
            const maxScroll = container.scrollWidth - container.clientWidth;
            if (container.scrollLeft >= maxScroll - 10) {
              container.scrollTo({ left: 0, behavior: 'smooth' });
            } else {
              container.scrollBy({ left: 200, behavior: 'smooth' });
            }
          }
        }, 3000);
      };

      startAutoScroll();
    }

    // ============================================================
    // 🔍 التصفية حسب التصنيف أو البراند
    // ============================================================

    function filterByCategory(categoryId) {
      window.location.href = `/gomla/category-products.html?id=${categoryId}&type=wholesale`;
    }

    function filterByBrand(brandId) {
      window.location.href = `/gomla/brand-products.html?id=${brandId}&type=wholesale`;
    }

    // ============================================================
    // 🚀 تحميل كل محتوى الصفحة
    // ============================================================

    function loadStorePage() {
      loadSlider();
      loadLatestProducts();
      loadBrands();
      loadOffers();
      loadCategories();
      loadProducts();

      // إذا كان المستخدم تاجر أو مسؤول، يعرض المتجر
      const user = getCurrentUser();
      if (user) {
        const isWholesale = (user.type === 'customer' && user.data.type === 'wholesale') ||
                            (user.type === 'admin');
        if (!isWholesale) {
          showToast('⚠️ هذا المتجر مخصص لتجار الجملة والمسؤولين فقط', 'warning');
        }
      }
    }

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      loadStorePage();
    });

    // تصدير الدوال للاستخدام العالمي
    window.slidePrev = slidePrev;
    window.slideNext = slideNext;
    window.goToSlide = goToSlide;
    window.handleSearch = handleSearch;
    window.searchProducts = searchProducts;
    window.selectProduct = selectProduct;
    window.addToCart = addToCart;
    window.openProductModal = openProductModal;
    window.filterByCategory = filterByCategory;
    window.filterByBrand = filterByBrand;
    window.loadMoreProducts = loadMoreProducts;
  </script>

</body>

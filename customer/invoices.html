<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فواتيري - أولاد شعلان</title>
  <meta name="description" content="فواتيري - أولاد شعلان للمنظفات والورقيات">
  <meta name="theme-color" content="#1a2a4a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gomla/assets/css/style.css">
  <link rel="icon" href="/gomla/assets/images/favicon.ico">

  <style>
    /* ============================================================
       🛡️ منع السكرول الأفقي على الصفحة كلها
       ============================================================ */
    html, body {
      overflow-x: hidden !important;
      max-width: 100vw;
    }

    .page-content,
    .page-content .container {
      overflow-x: hidden;
      min-width: 0;
      max-width: 100%;
    }

    /* ============================================================
       🎨 ستايل صفحة فواتيري v2.1
       ============================================================ */

    /* ===== رأس الصفحة ===== */
    .invoices-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 18px;
      color: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(26, 42, 74, 0.25);
      border-bottom: 4px solid var(--gold);
    }

    .invoices-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -15%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.18) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }

    .invoices-header-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .invoices-header-content .header-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(201, 168, 76, 0.4);
    }

    .invoices-header-content .header-text {
      flex: 1;
      min-width: 0;
    }

    .invoices-header-content .header-text h1 {
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 3px;
      color: var(--white);
    }

    .invoices-header-content .header-text p {
      font-size: 0.83rem;
      opacity: 0.88;
      color: rgba(255, 255, 255, 0.85);
      margin: 0;
    }

    /* ===== بطاقات الإحصائيات المالية ===== */
    .financial-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .financial-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      position: relative;
      overflow: hidden;
      transition: var(--transition);
      text-align: center;
    }

    .financial-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 4px;
      height: 100%;
      transition: transform 0.4s ease;
      transform: scaleY(0);
      transform-origin: bottom;
    }

    .financial-card:hover::before { transform: scaleY(1); }

    .financial-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold-light);
    }

    .financial-card.total::before { background: var(--gold); }
    .financial-card.paid::before { background: #22c55e; }
    .financial-card.remaining::before { background: #ef4444; }
    .financial-card.count::before { background: #2563eb; }

    .financial-card .fc-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      margin: 0 auto 8px;
    }

    .fc-icon.gold { background: rgba(201, 168, 76, 0.15); color: var(--gold-dark); }
    .fc-icon.green { background: rgba(34, 197, 94, 0.12); color: #16a34a; }
    .fc-icon.red { background: rgba(239, 68, 68, 0.12); color: #dc2626; }
    .fc-icon.blue { background: rgba(59, 130, 246, 0.12); color: #2563eb; }

    .financial-card .fc-label {
      font-size: 0.68rem;
      color: var(--gray-500);
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .financial-card .fc-value {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--navy);
      line-height: 1.2;
      direction: ltr;
      text-align: center;
    }

    .financial-card .fc-value.gold { color: var(--gold-dark); }
    .financial-card .fc-value.green { color: #16a34a; }
    .financial-card .fc-value.red { color: #dc2626; }
    .financial-card .fc-value.blue { color: #2563eb; }

    .financial-card .fc-currency {
      font-size: 0.65rem;
      color: var(--gray-400);
      margin-top: 2px;
      font-weight: 700;
    }

    /* ===== أدوات الفلترة ===== */
    .filter-bar {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow: hidden;
      min-width: 0;
      max-width: 100%;
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--gray-50);
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
      background: var(--white);
    }

    .search-box .search-icon {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      pointer-events: none;
      font-size: 0.9rem;
    }

    /* 🛡️ wrapper لمنع تسرب السكرول */
    .payment-tabs-wrapper {
      position: relative;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    .payment-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 2px 8px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
      min-width: 0;
      width: 100%;
      overscroll-behavior-x: contain;
    }

    .payment-tabs::-webkit-scrollbar { height: 4px; }
    .payment-tabs::-webkit-scrollbar-track {
      background: var(--gray-100);
      border-radius: 10px;
    }
    .payment-tabs::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .payment-tab {
      padding: 8px 14px;
      border: 2px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
      border-radius: var(--radius-full);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .payment-tab:hover { border-color: var(--gold-light); }

    .payment-tab.active {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      border-color: var(--navy);
      box-shadow: 0 4px 12px rgba(26, 42, 74, 0.25);
    }

    .payment-tab.active i { color: var(--gold); }

    .payment-tab .tab-count {
      background: rgba(255, 255, 255, 0.2);
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 0.68rem;
      font-weight: 800;
      min-width: 18px;
      text-align: center;
    }

    .payment-tab:not(.active) .tab-count {
      background: var(--gray-100);
      color: var(--gray-600);
    }

    /* ===== قائمة الفواتير ===== */
    .invoices-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    .invoice-card {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow: hidden;
      transition: var(--transition);
      position: relative;
      min-width: 0;
      max-width: 100%;
    }

    .invoice-card:hover {
      box-shadow: var(--shadow-lg);
      border-color: var(--gold-light);
    }

    .invoice-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 4px;
      height: 100%;
      background: var(--gold);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.4s ease;
    }

    .invoice-card:hover::before { transform: scaleY(1); }

    /* رأس الكارت */
    .invoice-card-header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: linear-gradient(135deg, #fcf9f0, #f8f4e8);
      border-bottom: 1px solid var(--gray-200);
    }

    .invoice-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .invoice-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .invoice-num-wrap {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .invoice-num {
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      font-weight: 900;
      color: var(--navy);
      letter-spacing: 0.5px;
      direction: ltr;
      text-align: right;
      white-space: nowrap;
    }

    .invoice-date {
      font-size: 0.7rem;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .invoice-date i {
      color: var(--gold);
      font-size: 0.62rem;
      flex-shrink: 0;
    }

    /* شارة حالة الدفع */
    .payment-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: var(--radius-full);
      font-size: 0.7rem;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .payment-badge i { font-size: 0.68rem; }

    .payment-badge.paid {
      background: rgba(34, 197, 94, 0.15);
      color: #16a34a;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .payment-badge.unpaid {
      background: rgba(239, 68, 68, 0.15);
      color: #dc2626;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .payment-badge.partial {
      background: rgba(245, 158, 11, 0.15);
      color: #d97706;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* جسم الكارت */
    .invoice-card-body {
      padding: 12px 14px;
    }

    /* ===== معلومات الفاتورة كـ Chips ===== */
    .invoice-info-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .info-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      color: var(--gray-600);
      font-weight: 700;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-chip i {
      color: var(--gold);
      font-size: 0.7rem;
      flex-shrink: 0;
    }

    .info-chip strong {
      color: var(--navy);
      font-weight: 800;
    }

    /* ===== ملخص المبالغ - 3 بطاقات ===== */
    .amounts-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .amount-box {
      padding: 10px 8px;
      border-radius: var(--radius-sm);
      text-align: center;
      border: 1px solid var(--gray-200);
      min-width: 0;
    }

    .amount-box.total {
      background: linear-gradient(135deg, #fcf9f0, #f8f4e8);
      border-color: var(--gold-light);
    }

    .amount-box.paid {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border-color: #86efac;
    }

    .amount-box.remaining {
      background: linear-gradient(135deg, #fef2f2, #fee2e2);
      border-color: #fca5a5;
    }

    .amount-box.remaining.clear {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border-color: #86efac;
    }

    .amount-box .ab-label {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--gray-500);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .amount-box.total .ab-label { color: var(--gold-dark); }
    .amount-box.paid .ab-label { color: #16a34a; }
    .amount-box.remaining .ab-label { color: #dc2626; }
    .amount-box.remaining.clear .ab-label { color: #16a34a; }

    .amount-box .ab-value {
      font-size: 0.92rem;
      font-weight: 900;
      color: var(--navy);
      line-height: 1.2;
      direction: ltr;
      text-align: center;
    }

    .amount-box.total .ab-value { color: var(--gold-dark); }
    .amount-box.paid .ab-value { color: #16a34a; }
    .amount-box.remaining .ab-value { color: #dc2626; }
    .amount-box.remaining.clear .ab-value { color: #16a34a; }

    /* ===== الفوتر - أزرار ===== */
    .invoice-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 12px;
      border-top: 2px dashed var(--gray-200);
      flex-wrap: wrap;
    }

    .invoice-footer-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--gray-500);
      font-weight: 700;
    }

    .invoice-footer-info i {
      color: var(--gold);
      font-size: 0.7rem;
    }

    .invoice-actions {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .invoice-action-btn {
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 800;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
      border: 2px solid;
      cursor: pointer;
      font-family: inherit;
      background: var(--white);
      white-space: nowrap;
    }

    .invoice-action-btn.gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      border-color: var(--gold-dark);
    }

    .invoice-action-btn.gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(201, 168, 76, 0.4);
    }

    .invoice-action-btn.secondary {
      color: var(--gray-700);
      border-color: var(--gray-200);
    }

    .invoice-action-btn.secondary:hover {
      border-color: var(--gold);
      color: var(--gold-dark);
      background: #fcf9f0;
    }

    .invoice-action-btn i { font-size: 0.78rem; }

    /* ===== حالة فارغة ===== */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: var(--white);
      border-radius: var(--radius-md);
      border: 2px dashed var(--gray-200);
      margin-bottom: 24px;
    }

    .empty-state .empty-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gray-100), var(--gray-50));
      color: var(--gray-400);
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .empty-state h3 {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 0.85rem;
      color: var(--gray-500);
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .empty-state .btn-shop {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      text-decoration: none;
      border-radius: var(--radius-full);
      font-weight: 800;
      font-size: 0.88rem;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(201, 168, 76, 0.35);
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .empty-state .btn-shop:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(201, 168, 76, 0.5);
    }

    /* التحميل */
    .loading-state {
      text-align: center;
      padding: 50px 20px;
    }

    .loading-state i {
      font-size: 2.2rem;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .loading-state p {
      font-size: 0.88rem;
      color: var(--gray-500);
      font-weight: 600;
    }

    /* ============================================================
       🖨️ Modal الفاتورة
       ============================================================ */
    .invoice-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .invoice-modal {
      background: var(--white);
      border-radius: var(--radius-md);
      max-width: 800px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
      animation: modalIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.92) translateY(-20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .invoice-printable {
      padding: 24px;
      background: var(--white);
    }

    /* رأس الفاتورة */
    .inv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 3px double var(--navy);
      flex-wrap: wrap;
    }

    .inv-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .inv-brand .inv-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 900;
      box-shadow: 0 4px 12px rgba(201, 168, 76, 0.4);
      flex-shrink: 0;
    }

    .inv-brand .inv-brand-info h2 {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 2px;
    }

    .inv-brand .inv-brand-info p {
      font-size: 0.72rem;
      color: var(--gray-500);
      margin: 0;
    }

    .inv-number-block {
      text-align: left;
    }

    .inv-number-block .inv-label {
      font-size: 0.68rem;
      color: var(--gray-500);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .inv-number-block .inv-number {
      font-family: 'Courier New', monospace;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--gold-dark);
      letter-spacing: 1px;
      direction: ltr;
    }

    .inv-number-block .inv-date {
      font-size: 0.72rem;
      color: var(--gray-600);
      margin-top: 4px;
    }

    /* حالة الدفع + رقم الطلب */
    .inv-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .inv-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-weight: 800;
      font-size: 0.75rem;
    }

    .inv-order-ref {
      font-size: 0.75rem;
      color: var(--gray-500);
      direction: ltr;
    }

    .inv-order-ref strong {
      color: var(--navy);
      font-family: monospace;
      font-weight: 900;
    }

    /* بيانات العميل */
    .inv-customer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px;
      background: var(--gray-50);
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      border-right: 4px solid var(--gold);
    }

    .inv-customer-block h4 {
      font-size: 0.7rem;
      color: var(--gray-500);
      font-weight: 800;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .inv-customer-block h4 i {
      color: var(--gold);
      font-size: 0.7rem;
    }

    .inv-customer-block p {
      font-size: 0.85rem;
      color: var(--navy);
      font-weight: 700;
      line-height: 1.5;
      margin: 0;
      word-break: break-word;
    }

    .inv-customer-block.full-width {
      grid-column: 1 / -1;
    }

    /* ============================================================
       📋 جدول المنتجات - Desktop
       ============================================================ */
    .inv-items-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 0.82rem;
    }

    .inv-items-table thead {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
    }

    .inv-items-table th {
      padding: 10px 8px;
      text-align: right;
      font-weight: 800;
      font-size: 0.75rem;
    }

    .inv-items-table th:first-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
    .inv-items-table th:last-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }

    .inv-items-table td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--gray-200);
      color: var(--navy);
      vertical-align: middle;
    }

    .inv-items-table tbody tr:hover {
      background: var(--gray-50);
    }

    .inv-items-table .item-name {
      font-weight: 800;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inv-items-table .item-name img {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--gray-100);
      flex-shrink: 0;
    }

    .inv-items-table td.text-center { text-align: center; }
    .inv-items-table td.text-left { text-align: left; }

    /* 🆕 Cards بديلة للجدول على الموبايل */
    .inv-items-cards {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .inv-item-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
    }

    .inv-item-card img {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--gray-200);
      flex-shrink: 0;
    }

    .inv-item-card .item-details {
      flex: 1;
      min-width: 0;
    }

    .inv-item-card .item-name-text {
      font-weight: 800;
      color: var(--navy);
      font-size: 0.83rem;
      margin-bottom: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .inv-item-card .item-meta {
      font-size: 0.72rem;
      color: var(--gray-500);
    }

    .inv-item-card .item-meta strong {
      color: var(--navy);
      font-weight: 800;
    }

    .inv-item-card .item-price-total {
      font-weight: 900;
      color: var(--gold-dark);
      font-size: 0.88rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ===== الملخص المالي ===== */
    .inv-summary {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 16px;
    }

    .inv-summary-table {
      width: 100%;
      max-width: 380px;
    }

    .inv-summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 14px;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--gray-200);
    }

    .inv-summary-row .label {
      color: var(--gray-600);
      font-weight: 700;
    }

    .inv-summary-row .value {
      color: var(--navy);
      font-weight: 800;
      direction: ltr;
    }

    .inv-summary-row.total {
      background: linear-gradient(135deg, #fcf9f0, #f8f4e8);
      border-bottom: 3px double var(--gold);
      border-top: 2px solid var(--gold-light);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-top: 8px;
    }

    .inv-summary-row.total .label {
      color: var(--gold-dark);
      font-size: 0.95rem;
      font-weight: 900;
    }

    .inv-summary-row.total .value {
      color: var(--gold-dark);
      font-size: 1.1rem;
      font-weight: 900;
    }

    /* الفوتر */
    .inv-footer {
      padding-top: 16px;
      border-top: 2px dashed var(--gray-300);
      text-align: center;
    }

    .inv-footer p {
      font-size: 0.78rem;
      color: var(--gray-600);
      margin-bottom: 5px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .inv-footer p i {
      color: var(--gold);
      font-size: 0.75rem;
    }

    .inv-footer .thanks {
      font-size: 0.9rem;
      font-weight: 900;
      color: var(--gold-dark);
      margin-top: 8px;
    }

    .inv-footer .powered {
      font-size: 0.68rem;
      color: var(--gray-400);
      margin-top: 10px;
    }

    /* Modal actions */
    .inv-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px 20px;
      background: var(--gray-50);
      border-top: 1px solid var(--gray-200);
      border-radius: 0 0 var(--radius-md) var(--radius-md);
    }

    .inv-action-btn-modal {
      padding: 12px 18px;
      border: none;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .inv-action-btn-modal.print {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
    }

    .inv-action-btn-modal.print:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(26, 42, 74, 0.3);
    }

    .inv-action-btn-modal.close {
      background: var(--gray-200);
      color: var(--gray-700);
    }

    .inv-action-btn-modal.close:hover { background: var(--gray-300); }

    /* ============================================================
       📱 Responsive
       ============================================================ */
    @media (max-width: 768px) and (pointer: coarse) {
      .invoices-header { padding: 18px 16px; border-radius: var(--radius-md); }
      .invoices-header-content .header-icon { width: 48px; height: 48px; font-size: 1.2rem; }
      .invoices-header-content .header-text h1 { font-size: 1.1rem; }
      .invoices-header-content .header-text p { font-size: 0.75rem; }

      /* الإحصائيات → 2x2 */
      .financial-stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }
      .financial-card { padding: 12px 10px; }
      .financial-card .fc-icon { width: 34px; height: 34px; font-size: 0.92rem; margin-bottom: 6px; }
      .financial-card .fc-value { font-size: 1rem; }
      .financial-card .fc-label { font-size: 0.63rem; }

      .filter-bar { padding: 12px; margin-bottom: 14px; }
      .search-box { margin-bottom: 10px; }
      .search-box input { padding: 10px 38px 10px 12px; font-size: 0.85rem; }
      .payment-tab { padding: 7px 12px; font-size: 0.72rem; }

      .invoice-card-header { padding: 11px 12px; }
      .invoice-icon-wrap { width: 36px; height: 36px; font-size: 0.85rem; }
      .invoice-num { font-size: 0.82rem; }
      .invoice-date { font-size: 0.65rem; }
      .payment-badge { padding: 4px 8px; font-size: 0.65rem; }

      .invoice-card-body { padding: 11px 12px; }
      .info-chip { padding: 4px 8px; font-size: 0.68rem; }

      /* ملخص المبالغ → 3 أعمدة بس font أصغر */
      .amounts-summary { gap: 6px; margin-bottom: 10px; }
      .amount-box { padding: 8px 6px; }
      .amount-box .ab-label { font-size: 0.58rem; margin-bottom: 3px; }
      .amount-box .ab-value { font-size: 0.82rem; }

      /* الفوتر */
      .invoice-card-footer {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding-top: 10px;
      }

      .invoice-footer-info {
        justify-content: center;
        font-size: 0.68rem;
      }

      .invoice-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
      }

      .invoice-action-btn {
        padding: 10px 8px;
        font-size: 0.72rem;
        justify-content: center;
      }

      /* ============================================================
         Modal
         ============================================================ */
      .invoice-modal-overlay { padding: 8px; }
      .invoice-modal { max-height: 94vh; border-radius: var(--radius-md); }
      .invoice-printable { padding: 14px; }

      .inv-header { gap: 10px; }
      .inv-brand .inv-logo { width: 44px; height: 44px; font-size: 1.2rem; }
      .inv-brand .inv-brand-info h2 { font-size: 0.95rem; }
      .inv-brand .inv-brand-info p { font-size: 0.65rem; }
      .inv-number-block { text-align: right; width: 100%; padding-top: 8px; border-top: 1px dashed var(--gray-200); }
      .inv-number-block .inv-number { font-size: 0.95rem; }
      .inv-number-block .inv-date { font-size: 0.68rem; }

      .inv-status-bar { justify-content: center; }

      .inv-customer {
        grid-template-columns: 1fr;
        padding: 12px;
        gap: 10px;
      }

      /* 🆕 إخفاء الجدول وإظهار Cards */
      .inv-items-table { display: none; }
      .inv-items-cards { display: flex; }

      .inv-summary-table { max-width: 100%; }
      .inv-summary-row { padding: 7px 12px; font-size: 0.8rem; }
      .inv-summary-row.total { padding: 10px 12px; }
      .inv-summary-row.total .value { font-size: 1rem; }

      .inv-footer p { font-size: 0.72rem; }
      .inv-footer .thanks { font-size: 0.83rem; }
      .inv-footer .powered { font-size: 0.62rem; }

      .inv-actions {
        grid-template-columns: 1fr 1fr;
        padding: 12px 14px;
        gap: 8px;
      }

      .inv-action-btn-modal {
        padding: 11px 14px;
        font-size: 0.82rem;
      }
    }

    @media (max-width: 480px) {
      .invoice-modal-overlay { padding: 6px; }
      .inv-actions { grid-template-columns: 1fr; }
      .inv-items-table .item-name img { display: none; }
    }

    @media (max-width: 400px) {
      .payment-tab span:not(.tab-count) { display: none; }
      .payment-tab { padding: 7px 10px; gap: 4px; }
      .payment-tab i { font-size: 0.85rem; }
      .payment-tab .tab-count { display: inline-block; }
    }

    /* ===== Print Styles ===== */
    @media print {
      body * { visibility: hidden; }
      .invoice-modal-overlay, .invoice-modal-overlay * { visibility: visible; }
      .invoice-modal-overlay {
        position: absolute;
        inset: 0;
        background: white;
        padding: 0;
      }
      .invoice-modal {
        box-shadow: none;
        max-height: none;
        max-width: none;
        border-radius: 0;
      }
      .inv-actions { display: none !important; }
      .invoice-printable { padding: 20px; }
      .inv-items-table { display: table !important; }
      .inv-items-cards { display: none !important; }
    }
  </style>
</head>
<body>

  <div id="mobile-top-bar"></div>
  <div id="mobile-top-tabs"></div>
  <div id="header-placeholder"></div>

  <main class="page-content">
    <div class="container">

      <!-- رأس الصفحة -->
      <div class="invoices-header">
        <div class="invoices-header-content">
          <div class="header-icon">
            <i class="fas fa-file-invoice"></i>
          </div>
          <div class="header-text">
            <h1>فواتيري</h1>
            <p id="headerSubtitle">كل فواتيرك في مكان واحد</p>
          </div>
        </div>
      </div>

      <!-- الإحصائيات المالية -->
      <div class="financial-stats">
        <div class="financial-card total">
          <div class="fc-icon gold">
            <i class="fas fa-file-invoice-dollar"></i>
          </div>
          <div class="fc-label">إجمالي الفواتير</div>
          <div class="fc-value gold" id="statTotal">0.00</div>
          <div class="fc-currency">ج.م</div>
        </div>

        <div class="financial-card paid">
          <div class="fc-icon green">
            <i class="fas fa-check-circle"></i>
          </div>
          <div class="fc-label">المدفوع</div>
          <div class="fc-value green" id="statPaid">0.00</div>
          <div class="fc-currency">ج.م</div>
        </div>

        <div class="financial-card remaining">
          <div class="fc-icon red">
            <i class="fas fa-exclamation-circle"></i>
          </div>
          <div class="fc-label">المتبقي</div>
          <div class="fc-value red" id="statRemaining">0.00</div>
          <div class="fc-currency">ج.م</div>
        </div>

        <div class="financial-card count">
          <div class="fc-icon blue">
            <i class="fas fa-file-alt"></i>
          </div>
          <div class="fc-label">عدد الفواتير</div>
          <div class="fc-value blue" id="statCount">0</div>
          <div class="fc-currency">فاتورة</div>
        </div>
      </div>

      <!-- أدوات الفلترة -->
      <div class="filter-bar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="ابحث برقم الفاتورة..." autocomplete="off" oninput="handleSearch(this.value)">
          <i class="fas fa-search search-icon"></i>
        </div>

        <div class="payment-tabs-wrapper">
          <div class="payment-tabs" id="paymentTabs">
            <button class="payment-tab active" data-status="all" onclick="filterByPayment('all')">
              <i class="fas fa-list"></i>
              <span>الكل</span>
              <span class="tab-count" id="countAll">0</span>
            </button>
            <button class="payment-tab" data-status="paid" onclick="filterByPayment('paid')">
              <i class="fas fa-check-circle"></i>
              <span>مدفوع</span>
              <span class="tab-count" id="countPaid">0</span>
            </button>
            <button class="payment-tab" data-status="partial" onclick="filterByPayment('partial')">
              <i class="fas fa-hourglass-half"></i>
              <span>دفع جزئي</span>
              <span class="tab-count" id="countPartial">0</span>
            </button>
            <button class="payment-tab" data-status="unpaid" onclick="filterByPayment('unpaid')">
              <i class="fas fa-times-circle"></i>
              <span>غير مدفوع</span>
              <span class="tab-count" id="countUnpaid">0</span>
            </button>
          </div>
        </div>
      </div>

      <!-- قائمة الفواتير -->
      <div class="invoices-list" id="invoicesList">
        <div class="loading-state">
          <i class="fas fa-spinner fa-spin"></i>
          <p>جاري تحميل الفواتير...</p>
        </div>
      </div>

    </div>
  </main>

  <div id="mobile-bottom-tabs"></div>
  <div id="mobile-copyright"></div>
  <div id="footer-placeholder"></div>
  <div id="sidebar-placeholder"></div>
  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="/gomla/assets/js/firebase-config.js"></script>
  <script src="/gomla/assets/js/main.js"></script>

  <script>
    // ============================================================
    // 📄 customer/invoices.html - صفحة فواتيري v2.1
    // ============================================================

    let userData = null;
    let userId = null;
    let userType = null;
    let allInvoices = [];
    let filteredInvoices = [];
    let currentPayment = 'all';
    let currentSearch = '';

    // ============================================================
    // 🚀 تشغيل الصفحة
    // ============================================================
    document.addEventListener('DOMContentLoaded', async function() {
      const user = getCurrentUser();

      if (!user) {
        window.location.href = '/gomla/customer-login.html';
        return;
      }

      const role = user.data.role;
      if (role !== ROLES.RETAIL && role !== ROLES.WHOLESALE) {
        if ([ROLES.SUPER, ROLES.ADMIN_PLUS, ROLES.ADMIN].includes(role)) {
          window.location.href = '/gomla/admin/invoices.html';
        } else if (role === ROLES.CASHIER) {
          window.location.href = '/gomla/cashier/home.html';
        } else {
          window.location.href = '/gomla/';
        }
        return;
      }

      userData = user.data;
      userId = userData.id || userData.uid;
      userType = role;

      if (userType === ROLES.WHOLESALE) {
        document.getElementById('headerSubtitle').textContent = 'كل فواتيرك من متجر الجملة';
      }

      await loadInvoices();
      console.log('✅ customer/invoices.html v2.1 loaded');
    });

    // ============================================================
    // 📄 تحميل الفواتير
    // ============================================================
    async function loadInvoices() {
      try {
        const snapshot = await db.collection(COLLECTIONS.INVOICES)
          .where('customerId', '==', userId)
          .get();

        allInvoices = [];
        snapshot.forEach(doc => {
          allInvoices.push({ id: doc.id, ...doc.data() });
        });

        allInvoices.sort((a, b) => {
          const da = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
          const db2 = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
          return db2 - da;
        });

        updateStats();
        applyFilters();

      } catch (error) {
        console.error('Error loading invoices:', error);
        document.getElementById('invoicesList').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h3>حدث خطأ في التحميل</h3>
            <p>تعذر تحميل فواتيرك. حاول مرة أخرى.</p>
            <button class="btn-shop" onclick="loadInvoices()">
              <i class="fas fa-sync-alt"></i> إعادة المحاولة
            </button>
          </div>
        `;
      }
    }

    // ============================================================
    // 📊 الإحصائيات المالية
    // ============================================================
    function updateStats() {
      let total = 0, paid = 0, remaining = 0;
      let cntPaid = 0, cntPartial = 0, cntUnpaid = 0;

      allInvoices.forEach(inv => {
        const invTotal = inv.total || 0;
        const invPaid = inv.paid || 0;
        const invRemaining = inv.remaining !== undefined ? inv.remaining : (invTotal - invPaid);

        total += invTotal;
        paid += invPaid;
        remaining += invRemaining;

        const status = inv.paymentStatus ||
          (invRemaining <= 0 ? 'paid' : (invPaid > 0 ? 'partial' : 'unpaid'));

        if (status === 'paid') cntPaid++;
        else if (status === 'partial') cntPartial++;
        else cntUnpaid++;
      });

      document.getElementById('statTotal').textContent = formatMoney(total);
      document.getElementById('statPaid').textContent = formatMoney(paid);
      document.getElementById('statRemaining').textContent = formatMoney(remaining);
      document.getElementById('statCount').textContent = allInvoices.length;

      document.getElementById('countAll').textContent = allInvoices.length;
      document.getElementById('countPaid').textContent = cntPaid;
      document.getElementById('countPartial').textContent = cntPartial;
      document.getElementById('countUnpaid').textContent = cntUnpaid;
    }

    function formatMoney(amount) {
      if (amount >= 1000000) return (amount / 1000000).toFixed(1) + 'M';
      if (amount >= 1000) return (amount / 1000).toFixed(1) + 'k';
      return amount.toFixed(2);
    }

    // ============================================================
    // 🔍 البحث
    // ============================================================
    let searchTimeout = null;
    function handleSearch(value) {
      if (searchTimeout) clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentSearch = value.trim();
        applyFilters();
      }, 250);
    }

    // ============================================================
    // 🎯 فلترة
    // ============================================================
    function filterByPayment(status) {
      currentPayment = status;
      document.querySelectorAll('.payment-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.status === status);
      });
      applyFilters();
    }

    function applyFilters() {
      filteredInvoices = allInvoices.filter(inv => {
        if (currentPayment !== 'all') {
          const invTotal = inv.total || 0;
          const invPaid = inv.paid || 0;
          const invRemaining = inv.remaining !== undefined ? inv.remaining : (invTotal - invPaid);
          const status = inv.paymentStatus ||
            (invRemaining <= 0 ? 'paid' : (invPaid > 0 ? 'partial' : 'unpaid'));

          if (status !== currentPayment) return false;
        }

        if (currentSearch) {
          const search = currentSearch.toUpperCase();
          const invNumber = inv.id.slice(-8).toUpperCase();
          const fullId = inv.id.toUpperCase();
          const orderNum = (inv.orderId || '').slice(-8).toUpperCase();

          if (!invNumber.includes(search) &&
              !fullId.includes(search) &&
              !orderNum.includes(search)) {
            return false;
          }
        }

        return true;
      });

      renderInvoices();
    }

    // ============================================================
    // 🎨 عرض الفواتير
    // ============================================================
    function renderInvoices() {
      const container = document.getElementById('invoicesList');

      if (filteredInvoices.length === 0) {
        if (currentSearch) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon"><i class="fas fa-search-minus"></i></div>
              <h3>لا توجد نتائج</h3>
              <p>لم نجد فواتير تطابق "<strong>${escapeHtml(currentSearch)}</strong>"</p>
              <button class="btn-shop" onclick="clearSearch()">
                <i class="fas fa-times"></i> مسح البحث
              </button>
            </div>
          `;
        } else if (currentPayment !== 'all') {
          const statusNames = {
            paid: 'مدفوعة',
            partial: 'دفع جزئي',
            unpaid: 'غير مدفوعة'
          };
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon"><i class="fas fa-inbox"></i></div>
              <h3>لا توجد فواتير "${statusNames[currentPayment] || ''}"</h3>
              <p>جرب تحديد حالة أخرى أو تصفح كل الفواتير.</p>
              <button class="btn-shop" onclick="filterByPayment('all')">
                <i class="fas fa-list"></i> عرض كل الفواتير
              </button>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon"><i class="fas fa-file-invoice"></i></div>
              <h3>لا توجد فواتير بعد</h3>
              <p>عندما تقوم بطلب، ستظهر فاتورتك هنا للطباعة والمتابعة.</p>
              <a href="${userType === ROLES.WHOLESALE ? '/gomla/store-wholesale.html' : '/gomla/store-retail.html'}" class="btn-shop">
                <i class="fas fa-store"></i> ابدأ التسوق
              </a>
            </div>
          `;
        }
        return;
      }

      let html = '';
      filteredInvoices.forEach(inv => {
        html += renderInvoiceCard(inv);
      });

      container.innerHTML = html;
    }

    function renderInvoiceCard(inv) {
      const invNumber = inv.id.slice(-8).toUpperCase();

      // حالة الدفع
      const invTotal = inv.total || 0;
      const invPaid = inv.paid || 0;
      const invRemaining = inv.remaining !== undefined ? inv.remaining : (invTotal - invPaid);
      const status = inv.paymentStatus ||
        (invRemaining <= 0 ? 'paid' : (invPaid > 0 ? 'partial' : 'unpaid'));

      const statusMap = {
        paid: { text: 'مدفوع', icon: 'fa-check-circle', class: 'paid' },
        partial: { text: 'دفع جزئي', icon: 'fa-hourglass-half', class: 'partial' },
        unpaid: { text: 'غير مدفوع', icon: 'fa-times-circle', class: 'unpaid' }
      };
      const statusInfo = statusMap[status] || statusMap.unpaid;

      const date = inv.createdAt
        ? (inv.createdAt.toDate ? inv.createdAt.toDate() : new Date(inv.createdAt))
        : new Date();
      const dateStr = date.toLocaleDateString('ar-EG', {
        year: 'numeric', month: 'short', day: 'numeric'
      });

      const itemsCount = (inv.items || []).length;
      const orderNum = inv.orderId ? inv.orderId.slice(-8).toUpperCase() : '---';

      return `
        <div class="invoice-card">
          <div class="invoice-card-header">
            <div class="invoice-header-left">
              <div class="invoice-icon-wrap">
                <i class="fas fa-file-invoice"></i>
              </div>
              <div class="invoice-num-wrap">
                <div class="invoice-num">#${invNumber}</div>
                <div class="invoice-date">
                  <i class="fas fa-calendar"></i>
                  ${dateStr}
                </div>
              </div>
            </div>
            <span class="payment-badge ${statusInfo.class}">
              <i class="fas ${statusInfo.icon}"></i>
              ${statusInfo.text}
            </span>
          </div>

          <div class="invoice-card-body">

            <div class="invoice-info-chips">
              <span class="info-chip">
                <i class="fas fa-receipt"></i>
                طلب: <strong style="font-family:monospace;direction:ltr;">#${orderNum}</strong>
              </span>
              <span class="info-chip">
                <i class="fas fa-box"></i>
                <strong>${itemsCount}</strong> صنف
              </span>
            </div>

            <div class="amounts-summary">
              <div class="amount-box total">
                <div class="ab-label"><i class="fas fa-file-invoice-dollar"></i> الإجمالي</div>
                <div class="ab-value">${invTotal.toFixed(2)}</div>
              </div>
              <div class="amount-box paid">
                <div class="ab-label"><i class="fas fa-check-circle"></i> المدفوع</div>
                <div class="ab-value">${invPaid.toFixed(2)}</div>
              </div>
              <div class="amount-box remaining ${invRemaining <= 0 ? 'clear' : ''}">
                <div class="ab-label">
                  <i class="fas ${invRemaining <= 0 ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                  ${invRemaining <= 0 ? 'مسدد' : 'المتبقي'}
                </div>
                <div class="ab-value">${Math.max(0, invRemaining).toFixed(2)}</div>
              </div>
            </div>

            <div class="invoice-card-footer">
              <div class="invoice-footer-info">
                <i class="fas fa-coins"></i>
                ${invRemaining <= 0 ? 'تم السداد بالكامل' : `متبقي ${invRemaining.toFixed(2)} ج.م`}
              </div>

              <div class="invoice-actions">
                <button class="invoice-action-btn gold" onclick="openInvoiceModal('${inv.id}')">
                  <i class="fas fa-file-invoice"></i>
                  عرض / طباعة
                </button>
                <button class="invoice-action-btn secondary" onclick="printInvoiceDirect('${inv.id}')">
                  <i class="fas fa-print"></i>
                  طباعة
                </button>
              </div>
            </div>

          </div>
        </div>
      `;
    }

    // ============================================================
    // 🖼️ Modal الفاتورة
    // ============================================================
    function openInvoiceModal(invoiceId) {
      const inv = allInvoices.find(i => i.id === invoiceId);
      if (!inv) return;

      const modalHtml = buildInvoiceModal(inv);

      const existing = document.getElementById('invoiceModalOverlay');
      if (existing) existing.remove();

      document.body.insertAdjacentHTML('beforeend', modalHtml);
      document.body.style.overflow = 'hidden';
    }

    function buildInvoiceModal(inv) {
      const invNumber = inv.id.slice(-8).toUpperCase();
      const orderNum = inv.orderId ? inv.orderId.slice(-8).toUpperCase() : '---';

      // حالة الدفع
      const invTotal = inv.total || 0;
      const invPaid = inv.paid || 0;
      const invRemaining = inv.remaining !== undefined ? inv.remaining : (invTotal - invPaid);
      const status = inv.paymentStatus ||
        (invRemaining <= 0 ? 'paid' : (invPaid > 0 ? 'partial' : 'unpaid'));

      const statusMap = {
        paid: { text: 'مدفوع بالكامل', color: '#16a34a', bg: 'rgba(34,197,94,0.15)', icon: 'fa-check-circle' },
        partial: { text: 'دفع جزئي', color: '#d97706', bg: 'rgba(245,158,11,0.15)', icon: 'fa-hourglass-half' },
        unpaid: { text: 'غير مدفوع', color: '#dc2626', bg: 'rgba(239,68,68,0.15)', icon: 'fa-times-circle' }
      };
      const statusInfo = statusMap[status] || statusMap.unpaid;

      const date = inv.createdAt
        ? (inv.createdAt.toDate ? inv.createdAt.toDate() : new Date(inv.createdAt))
        : new Date();
      const dateStr = date.toLocaleDateString('ar-EG', {
        year: 'numeric', month: 'long', day: 'numeric'
      });
      const timeStr = date.toLocaleTimeString('ar-EG', {
        hour: '2-digit', minute: '2-digit'
      });

      // المنتجات - جدول (Desktop) + Cards (Mobile)
      const items = inv.items || [];
      let itemsTableRows = '';
      let itemsCardsHtml = '';

      items.forEach((item, index) => {
        const itemName = item.productName || item.name || 'منتج';
        const itemQty = item.quantity || 0;
        const itemPrice = item.price || 0;
        const itemTotal = itemQty * itemPrice;
        const unit = item.unit || 'قطعة';
        const imgSrc = item.imageUrl || '/gomla/assets/images/no-image.png';

        // Row للجدول
        itemsTableRows += `
          <tr>
            <td class="text-center">${index + 1}</td>
            <td>
              <div class="item-name">
                <img src="${imgSrc}" alt="${escapeHtml(itemName)}" onerror="this.src='/gomla/assets/images/no-image.png'">
                <span>${escapeHtml(itemName)}</span>
              </div>
            </td>
            <td class="text-center">${itemQty} ${unit}</td>
            <td class="text-center">${itemPrice.toFixed(2)}</td>
            <td class="text-left" style="font-weight:800;color:var(--gold-dark);">${itemTotal.toFixed(2)}</td>
          </tr>
        `;

        // Card للموبايل
        itemsCardsHtml += `
          <div class="inv-item-card">
            <img src="${imgSrc}" alt="${escapeHtml(itemName)}" onerror="this.src='/gomla/assets/images/no-image.png'">
            <div class="item-details">
              <div class="item-name-text">${escapeHtml(itemName)}</div>
              <div class="item-meta">
                ${itemQty} ${unit} × <strong>${itemPrice.toFixed(2)}</strong> ج.م
              </div>
            </div>
            <div class="item-price-total">${itemTotal.toFixed(2)} ج.م</div>
          </div>
        `;
      });

      const customerName = inv.customerName || userData.name || '---';
      const customerPhone = inv.customerPhone || userData.phone || '---';
      const customerAddress = inv.customerAddress || userData.address || '---';

      const shippingCost = inv.shippingCost || 0;
      const subtotal = inv.subtotal || (invTotal - shippingCost);

      return `
        <div class="invoice-modal-overlay" id="invoiceModalOverlay" onclick="closeInvoiceModal(event)">
          <div class="invoice-modal" onclick="event.stopPropagation()">

            <div class="invoice-printable" id="invoicePrintable">

              <!-- رأس الفاتورة -->
              <div class="inv-header">
                <div class="inv-brand">
                  <div class="inv-logo">ش</div>
                  <div class="inv-brand-info">
                    <h2>أولاد شعلان</h2>
                    <p>للمنظفات والورقيات</p>
                  </div>
                </div>
                <div class="inv-number-block">
                  <div class="inv-label">رقم الفاتورة</div>
                  <div class="inv-number">#${invNumber}</div>
                  <div class="inv-date">${dateStr} - ${timeStr}</div>
                </div>
              </div>

              <!-- حالة الدفع + رقم الطلب -->
              <div class="inv-status-bar">
                <div class="inv-status-badge" style="background:${statusInfo.bg};color:${statusInfo.color};border:1px solid ${statusInfo.color}40;">
                  <i class="fas ${statusInfo.icon}"></i>
                  ${statusInfo.text}
                </div>
                <div class="inv-order-ref">
                  الطلب: <strong>#${orderNum}</strong>
                </div>
              </div>

              <!-- بيانات العميل -->
              <div class="inv-customer">
                <div class="inv-customer-block">
                  <h4><i class="fas fa-user"></i> العميل</h4>
                  <p>${escapeHtml(customerName)}</p>
                </div>
                <div class="inv-customer-block">
                  <h4><i class="fas fa-phone"></i> الهاتف</h4>
                  <p style="direction:ltr;text-align:left;">${escapeHtml(customerPhone)}</p>
                </div>
                <div class="inv-customer-block full-width">
                  <h4><i class="fas fa-map-marker-alt"></i> العنوان</h4>
                  <p>${escapeHtml(customerAddress)}</p>
                </div>
              </div>

              <!-- جدول المنتجات (Desktop) -->
              <table class="inv-items-table">
                <thead>
                  <tr>
                    <th style="width:36px;">#</th>
                    <th>المنتج</th>
                    <th style="text-align:center;width:75px;">الكمية</th>
                    <th style="text-align:center;width:85px;">السعر</th>
                    <th style="text-align:left;width:95px;">الإجمالي</th>
                  </tr>
                </thead>
                <tbody>
                  ${itemsTableRows || '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--gray-400);">لا توجد منتجات</td></tr>'}
                </tbody>
              </table>

              <!-- Cards للموبايل -->
              <div class="inv-items-cards">
                ${itemsCardsHtml || '<p style="text-align:center;color:var(--gray-400);padding:16px;font-size:0.85rem;">لا توجد منتجات</p>'}
              </div>

              <!-- الملخص -->
              <div class="inv-summary">
                <div class="inv-summary-table">
                  <div class="inv-summary-row">
                    <span class="label">المجموع الفرعي</span>
                    <span class="value">${subtotal.toFixed(2)} ج.م</span>
                  </div>
                  <div class="inv-summary-row">
                    <span class="label">الشحن</span>
                    <span class="value" style="color:${shippingCost > 0 ? 'var(--navy)' : '#16a34a'};">
                      ${shippingCost > 0 ? shippingCost.toFixed(2) + ' ج.م' : 'مجاني'}
                    </span>
                  </div>
                  <div class="inv-summary-row total">
                    <span class="label">الإجمالي</span>
                    <span class="value">${invTotal.toFixed(2)} ج.م</span>
                  </div>
                  <div class="inv-summary-row">
                    <span class="label">المدفوع</span>
                    <span class="value" style="color:#16a34a;">${invPaid.toFixed(2)} ج.م</span>
                  </div>
                  <div class="inv-summary-row" style="border-bottom:none;">
                    <span class="label" style="color:${invRemaining > 0 ? '#dc2626' : '#16a34a'};font-weight:900;">المتبقي</span>
                    <span class="value" style="color:${invRemaining > 0 ? '#dc2626' : '#16a34a'};font-weight:900;">
                      ${Math.max(0, invRemaining).toFixed(2)} ج.م
                    </span>
                  </div>
                </div>
              </div>

              <!-- الفوتر -->
              <div class="inv-footer">
                <p><i class="fas fa-phone-alt"></i> للاستفسار: 01120282953</p>
                <p><i class="fas fa-map-marker-alt"></i> المحلة الكبرى - شارع البحر</p>
                <div class="thanks">شكراً لتعاملكم معنا 🌟</div>
                <div class="powered">تم تنفيذ النظام بواسطة Famo</div>
              </div>

            </div>

            <!-- أزرار الإجراءات -->
            <div class="inv-actions">
              <button class="inv-action-btn-modal print" onclick="printCurrentInvoice()">
                <i class="fas fa-print"></i>
                طباعة
              </button>
              <button class="inv-action-btn-modal close" onclick="closeInvoiceModal()">
                <i class="fas fa-times"></i>
                إغلاق
              </button>
            </div>

          </div>
        </div>
      `;
    }

    function closeInvoiceModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const modal = document.getElementById('invoiceModalOverlay');
      if (modal) modal.remove();
      document.body.style.overflow = '';
    }

    // ============================================================
    // 🖨️ طباعة
    // ============================================================
    function printCurrentInvoice() {
      window.print();
    }

    function printInvoiceDirect(invoiceId) {
      openInvoiceModal(invoiceId);
      setTimeout(() => {
        window.print();
      }, 500);
    }

    // إغلاق بـ ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeInvoiceModal();
    });

    // ============================================================
    // 🔍 مسح البحث
    // ============================================================
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      currentSearch = '';
      applyFilters();
    }

    // ============================================================
    // 🛠️ Helper
    // ============================================================
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    }

    // ===== تصدير =====
    window.filterByPayment = filterByPayment;
    window.handleSearch = handleSearch;
    window.clearSearch = clearSearch;
    window.openInvoiceModal = openInvoiceModal;
    window.closeInvoiceModal = closeInvoiceModal;
    window.printCurrentInvoice = printCurrentInvoice;
    window.printInvoiceDirect = printInvoiceDirect;
    window.loadInvoices = loadInvoices;
  </script>

</body>
</html>

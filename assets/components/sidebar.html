<!-- 🧠 السايدبار الذكي - أولاد شعلان جملة      -->
<!-- ========================================== -->

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="smart-sidebar" id="smartSidebar">
  
  <!-- ===== رأس السايدبار ===== -->
  <div class="sidebar-header">
    <div class="sidebar-user">
      <img src="assets/images/default-avatar.png" alt="صورة المستخدم" id="sidebarAvatar" class="sidebar-avatar">
      <div class="sidebar-user-info">
        <span class="sidebar-username" id="sidebarUsername">زائر عزيز</span>
        <span class="sidebar-user-role" id="sidebarUserRole">مرحباً بك</span>
      </div>
    </div>
    <button class="sidebar-close" id="sidebarClose">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <!-- ===== الجمل التحفيزية ===== -->
  <div class="sidebar-motivational">
    <div class="motivational-icon">
      <i class="fas fa-quote-right"></i>
    </div>
    <div class="motivational-text" id="motivationalText">
      "ابتسم فإن الله يراك"
    </div>
  </div>
  
  <!-- ===== الأخبار ===== -->
  <div class="sidebar-news">
    <div class="news-header">
      <i class="fas fa-bullhorn"></i>
      <span>آخر الأخبار</span>
    </div>
    <div class="news-list" id="newsList">
      <div class="news-item">
        <span class="news-dot"></span>
        <span class="news-text">جاري تحميل الأخبار...</span>
      </div>
    </div>
  </div>
  
  <!-- ===== الروابط ===== -->
  <nav class="sidebar-nav" id="sidebarNav">
    <!-- سيتم تحميلها حسب نوع المستخدم -->
  </nav>
  
  <!-- ===== زر الدخول/الخروج ===== -->
  <div class="sidebar-footer">
    <button class="sidebar-action-btn" id="sidebarActionBtn">
      <i class="fas fa-sign-in-alt"></i>
      <span>تسجيل الدخول</span>
    </button>
  </div>
  
</aside>

<!-- ============================================================
# 🧠 السايدبار الذكي - أولاد شعلان جملة
# 📌 يتم تحميله عبر main.js في كل الصفحات
# ============================================================ -->

<!-- ===== طبقة التعتيم ===== -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ===== السايدبار ===== -->
<aside class="smart-sidebar" id="smartSidebar">
  
  <!-- ===== رأس السايدبار ===== -->
  <div class="sidebar-header">
    <div class="sidebar-user">
      <img src="assets/images/default-avatar.png" alt="صورة المستخدم" id="sidebarAvatar" class="sidebar-avatar">
      <div>
        <div class="sidebar-username" id="sidebarUsername">زائر عزيز</div>
        <div class="sidebar-user-role" id="sidebarUserRole">مرحباً بك</div>
      </div>
    </div>
    <button class="sidebar-close" id="sidebarClose">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- ===== الجمل التحفيزية ===== -->
  <div class="sidebar-motivational">
    <div class="motivational-icon"><i class="fas fa-quote-right"></i></div>
    <div class="motivational-text" id="sidebarMotivationalText">
      "النجاح ليس نهاية الطريق، بل هو بداية جديدة"
    </div>
    <button class="refresh-quote-btn" onclick="refreshMotivationalQuote()">
      <i class="fas fa-sync-alt"></i>
    </button>
  </div>

  <!-- ===== الأخبار ===== -->
  <div class="sidebar-news">
    <div class="news-header">
      <i class="fas fa-bullhorn"></i>
      <span>آخر الأخبار</span>
    </div>
    <div class="news-list" id="sidebarNewsList">
      <div class="news-item">
        <span class="news-dot"></span>
        <span>جاري تحميل الأخبار...</span>
      </div>
    </div>
  </div>

  <!-- ===== الروابط (تتغير حسب الصلاحية) ===== -->
  <nav class="sidebar-nav" id="sidebarNav">
    <!-- سيتم تعبئتها عبر JavaScript -->
  </nav>

  <!-- ===== زر تسجيل الخروج ===== -->
  <div class="sidebar-footer">
    <button class="sidebar-action-btn" onclick="logoutUser()">
      <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
    </button>
  </div>

</aside>

<!-- ===== زر فتح السايدبار (عائم) ===== -->
<button class="sidebar-toggle" id="sidebarToggle">
  <i class="fas fa-bars"></i>
</button>

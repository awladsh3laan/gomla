<!-- ============================================================
# 🧠 الهيدر الذكي - أولاد شعلان جملة
# 📌 يتم تحميله عبر main.js في كل الصفحات
# ============================================================ -->

<header class="smart-header">
  <div class="container">
    
    <!-- ===== الجزء الأيسر: اللوجو + اسم الشركة ===== -->
    <div class="header-left">
      <a href="/gomla/" class="logo">
        <img src="assets/images/logo.png" alt="أولاد شعلان" onerror="this.style.display='none'">
        <span>أولاد شعلان <small>للمنظفات والورقيات</small></span>
      </a>
    </div>

    <!-- ===== الجزء الأوسط: أزرار حسب الصلاحية ===== -->
    <div class="header-center" id="header-center-buttons">
      <!-- سيتم تعبئتها عبر JavaScript حسب المستخدم -->
    </div>

    <!-- ===== الجزء الأيمن: صورة المستخدم + اسمه + رتبته / قائمة الدخول ===== -->
    <div class="header-right">
      
      <!-- ===== وضع الزائر ===== -->
      <div id="guest-mode" class="header-guest">
        <div class="dropdown">
          <button class="btn btn-gold dropdown-toggle">
            <i class="fas fa-user"></i> تسجيل الدخول ▾
          </button>
          <div class="dropdown-menu">
            <a href="/gomla/trader-login.html"><i class="fas fa-store"></i> الدخول كتاجر</a>
            <a href="/gomla/customer-login.html"><i class="fas fa-user"></i> الدخول كعميل</a>
            <a href="/gomla/admin/login.html"><i class="fas fa-user-shield"></i> الدخول كمسؤول</a>
          </div>
        </div>
      </div>

      <!-- ===== وضع العميل / المدير ===== -->
      <div id="user-mode" style="display:none;">
        <div class="user-info">
          <img src="assets/images/default-avatar.png" alt="صورة المستخدم" id="userAvatar" class="user-avatar">
          <div class="user-details">
            <span class="user-name" id="userName">مستخدم</span>
            <span class="user-role" id="userRole">عميل</span>
          </div>
          <button class="btn btn-sm btn-danger" onclick="logoutUser()">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>

      <!-- ===== زر الإشعارات ===== -->
      <div class="notification-badge" id="notification-container">
        <button class="btn btn-sm btn-outline" onclick="toggleNotifications()">
          <i class="fas fa-bell"></i>
          <span class="badge-count" id="notification-badge">0</span>
        </button>
        <div class="notifications-dropdown" id="notifications-dropdown">
          <div class="notification-empty">لا توجد إشعارات</div>
        </div>
      </div>

      <!-- ===== زر السلة ===== -->
      <a href="/gomla/cart.html" class="btn btn-sm btn-outline cart-btn">
        <i class="fas fa-shopping-cart"></i>
        <span class="badge-count" id="cart-badge">0</span>
      </a>

    </div>

    <!-- ===== زر المنيو للهاتف ===== -->
    <button class="mobile-menu-btn" id="mobileMenuBtn">
      <i class="fas fa-bars"></i>
    </button>

  </div>
</header>
